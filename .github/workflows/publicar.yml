name: Publicar portal de ODAs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o conteúdo do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Executar os testes Python
        run: python -m unittest discover -s tests -v

      - name: Executar os testes dos componentes
        run: node --test "tests/js/*.test.mjs"

      - name: Construir o site
        run: mkdocs build --strict

      - name: Gerar as ODAs no formato de aplicação
        run: python scripts/gerar_odas.py --destino site/novo

      - name: Instalar dependências de teste do navegador
        run: npm ci && npx playwright install --with-deps chromium

      - name: Executar o teste de fumaça das ODAs
        run: npx playwright test

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar o site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

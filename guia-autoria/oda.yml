  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: Os blocos a seguir mostram código, pastas, diagramas e fluxos do repositório de referência, e cada um deles exige o contexto que diz de onde o trecho vem.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: As pastas e os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: conceito
    titulo: editor
    texto: Exibe linhas de código, comandos ou saída. Um editor de arquivo exige caminho, o commit do catálogo e contexto, texto exibido acima do editor que diz o que o arquivo é e por que ele aparece, e o motor acrescenta à barra o botão Ver no GitHub. Saídas e logs exigem origem.

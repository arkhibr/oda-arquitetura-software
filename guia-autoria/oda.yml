- id: laboratorio
  titulo: Crie sua ODA
  blocos:
  - tipo: passos
    itens:
    - titulo: Registre no catálogo
      texto: Em catalogo/odas.yml, preencha os campos da ODA, incluindo situacao disponivel e app oda-<id>. Confira o commit
        do repositório.
    - titulo: Escreva o conteúdo
      texto: 'Crie odas/oda-<id>/oda.yml com id e titulo iguais aos do catálogo e as sete abas na ordem exigida: missao, conceito,
        codigo, simulacao, laboratorio, diagnostico e verificacao.'
    - titulo: Escolha os componentes
      texto: Use os exemplos das etapas anteriores e adapte os campos ao seu conteúdo. Para arquivos e fluxos, use o commit
        fixado no catálogo.
    - titulo: Gere e confira
      texto: Execute os comandos exibidos abaixo, abra a ODA gerada e teste as interações e o layout em telas pequenas.
    - titulo: Proteja a publicação
      texto: Inclua a nova ODA nos testes de navegador e execute os portões de qualidade documentados em Sobre > Compreender
        o código.
  - tipo: editor
    rotulo: terminal
    linhas:
    - .venv/bin/mkdocs build --strict
    - .venv/bin/python scripts/gerar_odas.py --destino site
    - python3 scripts/servidor_estatico.py 8000 site
  - tipo: faixa
    estilo: dica
    texto: Consulte Sobre > Estender a aplicação para o esquema completo e os testes necessários. O gerador é a fonte de verdade
      para validação.
- id: diagnostico
  titulo: Diagnóstico e avaliação
  blocos:
  - tipo: conceito
    titulo: incidente
    texto: Apresenta saída, pergunta e alternativas com uma única correta, além da correção e da origem.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: incidente'
    - 'titulo: Chamada recusada pelo BFF'
    - 'origem: executado'
    - 'rotulo_saida: log'
    - 'saida: ''HTTP/1.1 401 Unauthorized'
    - ''
    - ''
    - '  {"error":"unauthorized","message":"Requisição interna não autenticada."}'''
    - 'pergunta: Por que o BFF recusou a chamada?'
    - 'correcao: O BFF não é ponto de entrada de clientes externos, e a chamada válida chega pelo Gateway, que'
    - '  acrescenta a chave interna e a identidade do usuário depois de validar o JWT.'
    - 'alternativas:'
    - '- texto: O JWT expirou.'
    - '  correta: false'
    - '  explicacao: O BFF não lê JWT, porque o Gateway remove o cabeçalho `Authorization`.'
    - '- texto: O endereço não existe.'
    - '  correta: false'
    - '  explicacao: Endereço inexistente geraria 404, e não 401.'
    - '- texto: A chamada não trouxe a chave interna nem o sujeito autenticado, que só o Gateway acrescenta.'
    - '  correta: true'
    - '  explicacao: O `bffs/endereco/src/auth.ts` exige `X-Internal-Gateway-Key` e `X-Authenticated-Subject`.'
  - tipo: incidente
    titulo: Chamada recusada pelo BFF
    origem: executado
    rotulo_saida: log
    saida: 'HTTP/1.1 401 Unauthorized


      {"error":"unauthorized","message":"Requisição interna não autenticada."}'
    pergunta: Por que o BFF recusou a chamada?
    correcao: O BFF não é ponto de entrada de clientes externos, e a chamada válida chega pelo Gateway, que acrescenta a chave
      interna e a identidade do usuário depois de validar o JWT.
    alternativas:
    - texto: O JWT expirou.
      correta: false
      explicacao: O BFF não lê JWT, porque o Gateway remove o cabeçalho `Authorization`.
    - texto: O endereço não existe.
      correta: false
      explicacao: Endereço inexistente geraria 404, e não 401.
    - texto: A chamada não trouxe a chave interna nem o sujeito autenticado, que só o Gateway acrescenta.
      correta: true
      explicacao: O `bffs/endereco/src/auth.ts` exige `X-Internal-Gateway-Key` e `X-Authenticated-Subject`.
  - tipo: conceito
    titulo: quiz
    texto: Avalia o aprendizado com perguntas e alternativas; cada pergunta precisa de exatamente uma resposta correta.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: quiz'
    - 'perguntas:'
    - '- enunciado: Qual comando atualiza o `integrity` do manifesto?'
    - '  alternativas:'
    - '  - texto: ''`npm run deploy` dentro do microfrontend.'''
    - '    correta: false'
    - '    explicacao: O deploy do microfrontend só cria o bucket e envia o arquivo.'
    - '  - texto: ''`npm run build` do microfrontend.'''
    - '    correta: false'
    - '    explicacao: O build só gera `dist/`.'
    - '  - texto: ''`npm run deploy` na raiz do repositório.'''
    - '    correta: true'
    - '    explicacao: A função `updateManifestIntegrity` fica em `scripts/deploy.ts`.'
    - '- enunciado: Por que o bucket recebe CORS?'
    - '  alternativas:'
    - '  - texto: Porque o shell baixa o bundle com `fetch` a partir de outra origem.'
    - '    correta: true'
    - '    explicacao: O shell roda em `localhost:5173`, e o bucket em `localhost:4566`.'
    - '  - texto: Porque o LocalStack exige CORS para aceitar uploads.'
    - '    correta: false'
    - '    explicacao: O upload é feito pelo SDK no Node, sem regras de CORS.'
    - '  - texto: Porque o Gateway lê o bucket.'
    - '    correta: false'
    - '    explicacao: O Gateway não participa do download dos bundles.'
    - '- enunciado: O que a ADR-011 pede para pipelines de produção?'
    - '  alternativas:'
    - '  - texto: Que cada microfrontend tenha o próprio manifesto.'
    - '    correta: false'
    - '    explicacao: O manifesto é único e lido pelo shell.'
    - '  - texto: Que bundle e manifesto sejam promovidos juntos, de forma atômica.'
    - '    correta: true'
    - '    explicacao: É o texto da Atualização 1.1.'
    - '  - texto: Que o manifesto seja publicado antes do bundle.'
    - '    correta: false'
    - '    explicacao: Nessa ordem, o manifesto aponta para um bundle que ainda não existe com aquele hash.'
    - '- enunciado: Por que o build usa lib mode com um único arquivo ESM?'
    - '  alternativas:'
    - '  - texto: Para compartilhar o React do shell.'
    - '    correta: false'
    - '    explicacao: O React vai embutido no bundle.'
    - '  - texto: Para gerar o manifesto.'
    - '    correta: false'
    - '    explicacao: O manifesto é gravado pelo deploy da raiz.'
    - '  - texto: Para que o shell baixe, confira e importe um só módulo com `mount` e `unmount`.'
    - '    correta: true'
    - '    explicacao: O carregador confere o hash de um arquivo e importa um Blob.'
    - '- enunciado: Depois do deploy da raiz, por que o manifesto aparece no `git status`?'
    - '  alternativas:'
    - '  - texto: Porque o deploy grava o hash novo em `public/mfe-manifest.json`, que é versionado.'
    - '    correta: true'
    - '    explicacao: O manifesto precisa ir no mesmo commit do código que gerou o bundle.'
    - '  - texto: Porque o Vite reescreve o manifesto ao subir.'
    - '    correta: false'
    - '    explicacao: O Vite só serve o arquivo de `public/`.'
    - '  - texto: Porque o LocalStack devolve o manifesto.'
    - '    correta: false'
    - '    explicacao: O manifesto fica no repositório do shell.'
  - tipo: quiz
    perguntas:
    - enunciado: Qual comando atualiza o `integrity` do manifesto?
      alternativas:
      - texto: '`npm run deploy` dentro do microfrontend.'
        correta: false
        explicacao: O deploy do microfrontend só cria o bucket e envia o arquivo.
      - texto: '`npm run build` do microfrontend.'
        correta: false
        explicacao: O build só gera `dist/`.
      - texto: '`npm run deploy` na raiz do repositório.'
        correta: true
        explicacao: A função `updateManifestIntegrity` fica em `scripts/deploy.ts`.
    - enunciado: Por que o bucket recebe CORS?
      alternativas:
      - texto: Porque o shell baixa o bundle com `fetch` a partir de outra origem.
        correta: true
        explicacao: O shell roda em `localhost:5173`, e o bucket em `localhost:4566`.
      - texto: Porque o LocalStack exige CORS para aceitar uploads.
        correta: false
        explicacao: O upload é feito pelo SDK no Node, sem regras de CORS.
      - texto: Porque o Gateway lê o bucket.
        correta: false
        explicacao: O Gateway não participa do download dos bundles.
    - enunciado: O que a ADR-011 pede para pipelines de produção?
      alternativas:
      - texto: Que cada microfrontend tenha o próprio manifesto.
        correta: false
        explicacao: O manifesto é único e lido pelo shell.
      - texto: Que bundle e manifesto sejam promovidos juntos, de forma atômica.
        correta: true
        explicacao: É o texto da Atualização 1.1.
      - texto: Que o manifesto seja publicado antes do bundle.
        correta: false
        explicacao: Nessa ordem, o manifesto aponta para um bundle que ainda não existe com aquele hash.
    - enunciado: Por que o build usa lib mode com um único arquivo ESM?
      alternativas:
      - texto: Para compartilhar o React do shell.
        correta: false
        explicacao: O React vai embutido no bundle.
      - texto: Para gerar o manifesto.
        correta: false
        explicacao: O manifesto é gravado pelo deploy da raiz.
      - texto: Para que o shell baixe, confira e importe um só módulo com `mount` e `unmount`.
        correta: true
        explicacao: O carregador confere o hash de um arquivo e importa um Blob.
    - enunciado: Depois do deploy da raiz, por que o manifesto aparece no `git status`?
      alternativas:
      - texto: Porque o deploy grava o hash novo em `public/mfe-manifest.json`, que é versionado.
        correta: true
        explicacao: O manifesto precisa ir no mesmo commit do código que gerou o bundle.
      - texto: Porque o Vite reescreve o manifesto ao subir.
        correta: false
        explicacao: O Vite só serve o arquivo de `public/`.
      - texto: Porque o LocalStack devolve o manifesto.
        correta: false
        explicacao: O manifesto fica no repositório do shell.
  - tipo: conceito
    titulo: resumo
    texto: Exibe o progresso das etapas e não requer propriedades adicionais.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: resumo'
  - tipo: resumo
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Qual é o papel do terminal da ODA?
      alternativas:
      - texto: Simular comandos declarados no YAML.
        correta: true
        explicacao: Ele apresenta respostas pré-definidas e não executa comandos no computador.
      - texto: Executar qualquer comando no computador.
        correta: false
        explicacao: O terminal é uma simulação.
    - enunciado: Qual commit deve aparecer em um editor de arquivo?
      alternativas:
      - texto: O commit fixado para o repositório no catálogo.
        correta: true
        explicacao: O gerador compara a referência com o catálogo.
      - texto: Qualquer commit escolhido no momento.
        correta: false
        explicacao: O commit deve coincidir com o catálogo.
  - tipo: resumo

id: autoria
titulo: Como criar uma ODA
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: Crie uma ODA a partir de dados YAML e experimente os componentes disponíveis no próprio motor.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: ODA (Objeto Digital de Aprendizagem)
      definicao: Página interativa de estudo com seis abas, de Objetivos à Verificação, gerada a partir de um arquivo `oda.yml` e ligada a um repositório e a um commit de referência.
    - termo: YAML
      definicao: Formato de texto para dados estruturados, baseado em indentação, em que cada ODA descreve as abas e os blocos que o motor exibe.
      referencia:
        rotulo: YAML · especificação 1.2.2
        url: https://yaml.org/spec/1.2.2/
    - termo: Motor
      definicao: Conjunto de módulos JavaScript da pasta `motor/` que lê os dados da ODA embutidos na página e monta cada bloco no navegador.
    - termo: Bloco
      definicao: Unidade de conteúdo de uma aba, identificada pelo campo `tipo`, como legenda, editor, terminal ou quiz, com propriedades obrigatórias conferidas pelo gerador.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Registrar uma ODA no catálogo e organizar as seis etapas.
    - Escolher e configurar cada componente do motor.
    - Gerar, testar e publicar a ODA.
  - tipo: faixa
    estilo: dica
    texto: Os exemplos abaixo demonstram os componentes e seus dados YAML. Adapte conteúdo e referências ao objetivo de aprendizagem.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: conceito
    titulo: legenda
    texto: Apresenta uma ideia breve; use até três frases em texto.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: legenda'
    - 'texto: Percorra o que o `npm run deploy` faz, etapa por etapa, e depois localize cada peça do repositório.'
  - tipo: legenda
    texto: Percorra o que o `npm run deploy` faz, etapa por etapa, e depois localize cada peça do repositório.
  - tipo: conceito
    titulo: glossario
    texto: Explica os termos técnicos da ODA antes do primeiro uso e fica na aba Objetivos, logo depois da legenda, posição que o gerador confere. Cada item tem termo e definicao, e a referencia opcional aponta para um portal curado da lista `CURADOS` do gerador.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: glossario'
    - 'itens:'
    - '- termo: CSP (Content Security Policy)'
    - '  definicao: Cabeçalho HTTP que diz ao navegador de quais origens a página pode carregar recursos.'
    - '  referencia: {rotulo: "MDN · CSP", url: "https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP"}'
  - tipo: conceito
    titulo: faixa
    texto: Destaca dica, sucesso, quebra ou erro, e o estilo erro exige sintoma, causa e correcao. A lista opcional links acrescenta ao fim da faixa endereços que começam com https. O estilo objetivo, obrigatório logo depois da legenda do Laboratório, exige problema, impacto, mecanismo e comprovacao, para que o aluno saiba que risco ou defeito o laboratório trata, por que ele importa, com que mecanismo e como provar o resultado.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: faixa'
    - 'estilo: dica'
    - 'texto: O plugin identifica a camada pelo caminho resolvido do arquivo importado. Por isso, trocar o alias'
    - '  por um caminho relativo não contorna a regra.'
  - tipo: faixa
    estilo: dica
    texto: O plugin identifica a camada pelo caminho resolvido do arquivo importado. Por isso, trocar o alias por um caminho relativo não contorna a regra.
  - tipo: conceito
    titulo: conceito
    texto: Explica um conceito com titulo e texto e admite analogia. Toda aba explica os conceitos que usa na primeira vez que eles aparecem nela, num bloco `conceito` anterior ou num aposto na própria frase, porque o aluno pode abrir qualquer aba direto, e a aba Conceito e código abre ensinando os conceitos centrais antes de comparativos, diagramas e ADRs. Na mesma aba, a faixa 💻 No código abre a parte que mostra os arquivos do repositório, seguida dos conceitos usados no código que ainda não foram explicados acima.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: conceito'
    - 'titulo: Estado local de componente'
    - 'texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de'
    - '  envio de um formulário pertencem a um único componente, e a página de login os mantém com `react-hook-form`'
    - '  e `useState`, sem passar pelo store.'
  - tipo: conceito
    titulo: Estado local de componente
    texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de envio de um formulário pertencem a um único componente, e a página de login os mantém com `react-hook-form` e `useState`, sem passar pelo store.
  - tipo: conceito
    titulo: adr
    texto: 'Apresenta uma decisão arquitetural recolhível com contexto, decisão, alternativas e consequências. A ADR é apoio e nunca pré-requisito: o texto da ODA só cita uma ADR quando a própria frase diz o que ela decidiu, e os conceitos que a decisão usa são explicados antes, em blocos `conceito` da mesma aba.'
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: adr'
    - 'id: ADR-001'
    - 'titulo: Tática de plataforma tecnológica'
    - 'status: Proposed'
    - 'contexto: O projeto precisava de uma plataforma front-end moderna com TypeScript e ecossistema maduro,'
    - '  e a equipe já tinha experiência com React.'
    - 'decisao: Adotar React 19, TypeScript e Vite como plataforma principal.'
    - 'alternativas: Vue 3 com TypeScript e Vite, descartado pela falta de experiência da equipe, e não adotar'
    - '  plataforma alguma.'
    - 'consequencias: Estrutura, estado e roteamento exigem decisões adicionais, registradas nas ADR-002 e ADR-003,'
    - '  e o Vite determina as ferramentas de teste.'
  - tipo: adr
    id: ADR-001
    titulo: Tática de plataforma tecnológica
    status: Proposed
    contexto: O projeto precisava de uma plataforma front-end moderna com TypeScript e ecossistema maduro, e a equipe já tinha experiência com React.
    decisao: Adotar React 19, TypeScript e Vite como plataforma principal.
    alternativas: Vue 3 com TypeScript e Vite, descartado pela falta de experiência da equipe, e não adotar plataforma alguma.
    consequencias: Estrutura, estado e roteamento exigem decisões adicionais, registradas nas ADR-002 e ADR-003, e o Vite determina as ferramentas de teste.
  - tipo: conceito
    titulo: checklist
    texto: Lista objetivos ou ações que a pessoa pode marcar; as marcas persistem no navegador.
  - tipo: editor

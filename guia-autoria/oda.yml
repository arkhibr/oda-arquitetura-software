  - tipo: conceito
    titulo: fluxo
    texto: Apresenta etapas com titulo e descricao; trechos de codigo devem apontar para o commit do catálogo.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: fluxo'
    - 'titulo: Kahn sobre o manifesto com minimo, endereco e emprestimo, nessa ordem no arquivo'
    - 'etapas:'
    - '- titulo: Graus de entrada'
    - '  descricao: Os graus de entrada são 1 para `minimo`, que depende de `endereco`, 0 para `endereco`, que'
    - '    não tem dependências, e 1 para `emprestimo`, que também depende de `endereco`.'
    - '- titulo: Fila inicial'
    - '  descricao: Só `endereco` tem grau 0, e a fila começa com ele, mesmo estando em segundo lugar no arquivo.'
    - '- titulo: Saída de endereco'
    - '  descricao: ''`endereco` vai para a ordem, e os dependentes `minimo` e `emprestimo` chegam a grau 0 e'
    - '    entram na fila, na ordem em que aparecem no arquivo.'''
    - '- titulo: Ordem final'
    - '  descricao: ''`endereco`, `minimo` e `emprestimo`, que é a ordem do menu depois de Início, conferida pelo'
    - '    teste do laboratório e pelo navegador.'''
    - '- titulo: Ciclo'
    - '  descricao: Se `endereco` passar a depender de `minimo`, nenhum dos três começa com grau 0, a fila nasce'
    - '    vazia e o erro lista os três.'
  - tipo: fluxo
    titulo: Kahn sobre o manifesto com minimo, endereco e emprestimo, nessa ordem no arquivo
    etapas:
    - titulo: Graus de entrada
      descricao: Os graus de entrada são 1 para `minimo`, que depende de `endereco`, 0 para `endereco`, que não tem dependências,
        e 1 para `emprestimo`, que também depende de `endereco`.
    - titulo: Fila inicial
      descricao: Só `endereco` tem grau 0, e a fila começa com ele, mesmo estando em segundo lugar no arquivo.
    - titulo: Saída de endereco
      descricao: '`endereco` vai para a ordem, e os dependentes `minimo` e `emprestimo` chegam a grau 0 e entram na fila,
        na ordem em que aparecem no arquivo.'
    - titulo: Ordem final
      descricao: '`endereco`, `minimo` e `emprestimo`, que é a ordem do menu depois de Início, conferida pelo teste do laboratório
        e pelo navegador.'
    - titulo: Ciclo
      descricao: Se `endereco` passar a depender de `minimo`, nenhum dos três começa com grau 0, a fila nasce vazia e o erro
        lista os três.
- id: simulacao
  titulo: Simulações
  blocos:
  - tipo: conceito
    titulo: terminal
    texto: Simula comandos declarados, não executa comandos reais. Cenários devem referenciar entradas existentes; condições
      dependem de efeitos definidos.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: terminal'
    - 'titulo: terminal · verificação do ambiente'
    - 'comandos:'
    - '- entrada: curl --version'
    - '  saida: curl 8.7.1 (x86_64-apple-darwin26.0) libcurl/8.7.1 (SecureTransport) LibreSSL/3.3.6 zlib/1.2.12'
    - '    nghttp2/1.69.0'
    - '  origem: exemplo'
    - '  dica: Qualquer versão do curl atende.'
    - 'cenarios:'
    - '- rotulo: Verificar o curl'
    - '  comando: curl --version'
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: curl --version
      saida: curl 8.7.1 (x86_64-apple-darwin26.0) libcurl/8.7.1 (SecureTransport) LibreSSL/3.3.6 zlib/1.2.12 nghttp2/1.69.0
      origem: exemplo
      dica: Qualquer versão do curl atende.
    cenarios:
    - rotulo: Verificar o curl
      comando: curl --version
  - tipo: conceito
    titulo: console-api
    texto: 'Simula requisições e respostas: cada cenário informa rotulo, requisicao, resposta e origem.'
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: console-api'
    - 'cenarios:'
    - '- rotulo: Gateway sem token'
    - '  requisicao:'
    - '    metodo: GET'
    - '    url: http://localhost:4000/bff/endereco/usuario/endereco'
    - '  resposta:'
    - '    status: 401'
    - '    corpo:'
    - '      error: unauthorized'
    - '      message: Token Bearer ausente ou inválido.'
    - '  origem: executado'
    - '  nota: A resposta traz o cabeçalho `x-correlation-id`, criado pelo Gateway antes da autenticação.'
    - '- rotulo: BFF direto, sem a chave interna'
    - '  requisicao:'
    - '    metodo: GET'
    - '    url: http://localhost:4002/usuario/endereco'
    - '  resposta:'
    - '    status: 401'
    - '    corpo:'
    - '      error: unauthorized'
    - '      message: Requisição interna não autenticada.'
    - '  origem: executado'
    - '  nota: O BFF recusa qualquer chamada que não traga a chave interna do Gateway.'
    - '- rotulo: BFF direto, com os cabeçalhos do Gateway'
    - '  requisicao:'
    - '    metodo: GET'
    - '    url: http://localhost:4002/usuario/endereco'
    - '    cabecalhos:'
    - '      X-Internal-Gateway-Key: local-development-gateway-key'
    - '      X-Authenticated-Subject: usuario-teste'
    - '  resposta:'
    - '    status: 200'
    - '    corpo:'
    - '      cep: ''01001000'''
    - '      logradouro: Praça da Sé'
    - '      numero: ''1'''
    - '  origem: executado'
    - '  nota: São os cabeçalhos que o proxy do Gateway acrescenta antes de chamar o BFF.'
  - tipo: console-api
    cenarios:
    - rotulo: Gateway sem token
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
      nota: A resposta traz o cabeçalho `x-correlation-id`, criado pelo Gateway antes da autenticação.
    - rotulo: BFF direto, sem a chave interna
      requisicao:
        metodo: GET
        url: http://localhost:4002/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Requisição interna não autenticada.
      origem: executado
      nota: O BFF recusa qualquer chamada que não traga a chave interna do Gateway.
    - rotulo: BFF direto, com os cabeçalhos do Gateway
      requisicao:
        metodo: GET
        url: http://localhost:4002/usuario/endereco
        cabecalhos:
          X-Internal-Gateway-Key: local-development-gateway-key
          X-Authenticated-Subject: usuario-teste
      resposta:
        status: 200
        corpo:
          cep: '01001000'
          logradouro: Praça da Sé
          numero: '1'
      origem: executado
      nota: São os cabeçalhos que o proxy do Gateway acrescenta antes de chamar o BFF.
  - tipo: conceito
    titulo: linha-do-tempo
    texto: Simula eventos entre atores, com falhas opcionais; dependencias apontam para eventos anteriores.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: linha-do-tempo'
    - 'titulo: Ciclo de vida de um microfrontend'
    - 'atores:'
    - '- id: host'
    - '  rotulo: MfeHost'
    - '- id: loader'
    - '  rotulo: loadMfeModule'
    - '- id: s3'
    - '  rotulo: Bucket do microfrontend'
    - '- id: mfe'
    - '  rotulo: Bundle do microfrontend'
    - 'eventos:'
    - '- id: e1'
    - '  de: host'
    - '  para: loader'
    - '  mensagem: ''`loadMfeModule(url, integrity)`'''
    - '- id: e2'
    - '  de: loader'
    - '  para: s3'
    - '  mensagem: ''`fetch(url)` dos bytes do bundle'''
    - '  depende: e1'
    - '- id: e3'
    - '  de: s3'
    - '  para: loader'
    - '  mensagem: bytes, conferidos com o SHA-256 do manifesto'
    - '  depende: e2'
    - '- id: e4'
    - '  de: loader'
    - '  para: host'
    - '  mensagem: ''`{ mount, unmount }` validados'''
    - '  depende: e3'
    - '- id: e5'
    - '  de: host'
    - '  para: mfe'
    - '  mensagem: ''`mount(div, ctx)`'''
    - '  depende: e4'
    - '- id: e6'
    - '  de: host'
    - '  para: mfe'
    - '  mensagem: ''`unmount(div)` ao sair da rota'''
    - '  depende: e5'
    - 'falhas:'
    - '- id: bucket-fora'
    - '  rotulo: O bucket não responde, como depois de reiniciar o LocalStack'
    - '  ator: s3'
  - tipo: linha-do-tempo
    titulo: Ciclo de vida de um microfrontend
    atores:
    - id: host
      rotulo: MfeHost
    - id: loader
      rotulo: loadMfeModule
    - id: s3
      rotulo: Bucket do microfrontend
    - id: mfe
      rotulo: Bundle do microfrontend
    eventos:
    - id: e1
      de: host
      para: loader
      mensagem: '`loadMfeModule(url, integrity)`'
    - id: e2
      de: loader
      para: s3
      mensagem: '`fetch(url)` dos bytes do bundle'
      depende: e1
    - id: e3
      de: s3
      para: loader
      mensagem: bytes, conferidos com o SHA-256 do manifesto
      depende: e2
    - id: e4
      de: loader
      para: host
      mensagem: '`{ mount, unmount }` validados'
      depende: e3
    - id: e5
      de: host
      para: mfe
      mensagem: '`mount(div, ctx)`'
      depende: e4
    - id: e6
      de: host
      para: mfe
      mensagem: '`unmount(div)` ao sair da rota'
      depende: e5
    falhas:
    - id: bucket-fora
      rotulo: O bucket não responde, como depois de reiniciar o LocalStack
      ator: s3
  - tipo: conceito

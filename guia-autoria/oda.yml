    texto: A aba Objetivos de toda ODA traz a faixa 🧭 Como ter o código na sua máquina, com os passos para clonar o repositório e fixar o commit, e toda aba que mostra arquivos, árvores de pastas ou trechos de fluxo traz a faixa 📂 Onde está o código. O gerador recusa a ODA em que falte uma dessas faixas ou o contexto de um editor de arquivo, e os scripts de montagem acrescentam as duas faixas automaticamente.

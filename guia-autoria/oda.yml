  - tipo: conceito
    titulo: diagrama
    texto: Mostra um diagrama Mermaid com id, tipo_diagrama, titulo e mermaid; o carregamento depende de rede.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: diagrama'
    - 'id: D-01'
    - 'tipo_diagrama: Fluxo'
    - 'titulo: Fan-out do cenário 09'
    - 'mermaid: "flowchart LR\n    T[Teste xUnit] -->|PublishAsync| S((fanout-topic))\n    S -->|cópia| Q1[fanout-queue-1]\n\'
    - '  \    S -->|cópia| Q2[fanout-queue-2]\n    Q1 -->|ReceiveMessageAsync| R1[Leitura da fila 1]\n    Q2\'
    - '  \ -->|ReceiveMessageAsync| R2[Leitura da fila 2]"'
  - tipo: diagrama
    id: D-01

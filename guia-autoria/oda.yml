id: autoria
titulo: Como criar uma ODA
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: Crie uma ODA a partir de dados YAML e experimente os componentes disponíveis no próprio motor.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Registrar uma ODA no catálogo e organizar as sete etapas.
    - Escolher e configurar cada componente do motor.
    - Gerar, testar e publicar a ODA.
  - tipo: faixa
    estilo: dica
    texto: Os exemplos abaixo demonstram os componentes e seus dados YAML. Adapte conteúdo e referências ao objetivo de aprendizagem.
- id: conceito
  titulo: Estrutura e texto
  blocos:
  - tipo: conceito
    titulo: legenda
    texto: Apresenta uma ideia breve; use até três frases em texto.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: legenda'
    - 'texto: Percorra o que o `npm run deploy` faz, etapa por etapa, e depois localize cada peça do repositório.'
  - tipo: legenda
    texto: Percorra o que o `npm run deploy` faz, etapa por etapa, e depois localize cada peça do repositório.
  - tipo: conceito
    titulo: faixa
    texto: Destaca dica, sucesso, quebra ou erro; erro exige sintoma, causa e correcao.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: faixa'
    - 'estilo: dica'
    - 'texto: O plugin identifica a camada pelo caminho resolvido do arquivo importado. Por isso, trocar o alias'
    - '  por um caminho relativo não contorna a regra.'
  - tipo: faixa
    estilo: dica
    texto: O plugin identifica a camada pelo caminho resolvido do arquivo importado. Por isso, trocar o alias por um caminho
      relativo não contorna a regra.
  - tipo: conceito
    titulo: conceito
    texto: Explica um conceito com titulo e texto e admite analogia.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: conceito'
    - 'titulo: Estado local de componente'
    - 'texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de'
    - '  envio de um formulário pertencem a um único componente, e a página de login os mantém com `react-hook-form`'
    - '  e `useState`, sem passar pelo store.'
  - tipo: conceito
    titulo: Estado local de componente
    texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de envio de um formulário
      pertencem a um único componente, e a página de login os mantém com `react-hook-form` e `useState`, sem passar pelo store.
  - tipo: conceito
    titulo: adr
    texto: Apresenta uma decisão arquitetural recolhível com contexto, decisão, alternativas e consequências.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: adr'
    - 'id: ADR-001'
    - 'titulo: Tática de plataforma tecnológica'
    - 'status: Proposed'
    - 'contexto: O projeto precisava de uma plataforma front-end moderna com TypeScript e ecossistema maduro,'
    - '  e a equipe já tinha experiência com React.'
    - 'decisao: Adotar React 19, TypeScript e Vite como plataforma principal.'
    - 'alternativas: Vue 3 com TypeScript e Vite, descartado pela falta de experiência da equipe, e não adotar'
    - '  plataforma alguma.'
    - 'consequencias: Estrutura, estado e roteamento exigem decisões adicionais, registradas nas ADR-002 e ADR-003,'
    - '  e o Vite determina as ferramentas de teste.'
  - tipo: adr
    id: ADR-001
    titulo: Tática de plataforma tecnológica
    status: Proposed
    contexto: O projeto precisava de uma plataforma front-end moderna com TypeScript e ecossistema maduro, e a equipe já tinha
      experiência com React.
    decisao: Adotar React 19, TypeScript e Vite como plataforma principal.
    alternativas: Vue 3 com TypeScript e Vite, descartado pela falta de experiência da equipe, e não adotar plataforma alguma.
    consequencias: Estrutura, estado e roteamento exigem decisões adicionais, registradas nas ADR-002 e ADR-003, e o Vite
      determina as ferramentas de teste.
  - tipo: conceito
    titulo: checklist
    texto: Lista objetivos ou ações que a pessoa pode marcar; as marcas persistem no navegador.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: checklist'
    - 'titulo: Checklist final'
    - 'itens:'
    - '- O deploy publicou os dois microfrontends no LocalStack.'
    - '- O shell subiu em `http://localhost:5173/`.'
    - '- O login de teste levou ao painel.'
    - '- A rota `/endereco` mostrou o formulário do microfrontend.'
    - '- As três falhas de ambiente estão claras.'
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O deploy publicou os dois microfrontends no LocalStack.
    - O shell subiu em `http://localhost:5173/`.
    - O login de teste levou ao painel.
    - A rota `/endereco` mostrou o formulário do microfrontend.
    - As três falhas de ambiente estão claras.
- id: codigo
  titulo: Código e representação
  blocos:
  - tipo: conceito
    titulo: editor
    texto: Exibe linhas de código, comandos ou saída. Para arquivo, informe caminho e commit do catálogo; para saida e log,
      informe origem.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: editor'
    - 'rotulo: arquivo'
    - 'caminho: tsconfig.app.json'
    - 'commit: ''2179313'''
    - 'linhas:'
    - '- ''    "paths": { "@/*": ["./src/*"] }'''
    - 'anotacoes:'
    - '- linha: 24'
    - '  texto: O alias `@/` aponta para `src/`, e o plugin resolve o caminho real antes de identificar a camada.'
    - 'inicio: 24'
  - tipo: editor
    rotulo: arquivo
    caminho: tsconfig.app.json
    commit: '2179313'
    linhas:
    - '    "paths": { "@/*": ["./src/*"] }'
    anotacoes:
    - linha: 24
      texto: O alias `@/` aponta para `src/`, e o plugin resolve o caminho real antes de identificar a camada.
    inicio: 24
  - tipo: conceito
    titulo: passos
    texto: Organiza instruções marcáveis. Cada item pode ter texto, editor e efeito para alterar o estado da simulação.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: passos'
    - 'itens:'
    - '- titulo: Simular a violação em httpClient.ts'
    - '  texto: Marque este passo para que o simulador de lint acima passe a considerar a importação proibida.'
    - '  efeito: simulacao_violacao'
  - tipo: passos
    itens:
    - titulo: Simular a violação em httpClient.ts
      texto: Marque este passo para que o simulador de lint acima passe a considerar a importação proibida.
      efeito: simulacao_violacao
  - tipo: conceito
    titulo: arvores
    texto: Compara duas árvores de caminhos; cada nó tem caminho e descricao e pastas terminam em barra.
  - tipo: editor
    rotulo: terminal
    linhas:
    - 'tipo: arvores'
    - 'esquerda:'
    - '  titulo: Cenários de mensageria'
    - '  nos:'
    - '  - caminho: scenarios/'
    - '    descricao: Um projeto xUnit independente por cenário de integração.'
    - '  - caminho: scenarios/02-SQS.Basic/'
    - '    descricao: ''Operações básicas de fila: criar, enviar, receber, apagar e fila de mensagens mortas.'''
    - '  - caminho: scenarios/04-SNS.Basic/'
    - '    descricao: Operações básicas de tópico.'
    - '  - caminho: scenarios/09-SNS.SQS.Fanout/'
    - '    descricao: Fan-out de um tópico para duas filas.'
    - '  - caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs'
    - '    descricao: Cria tópico e filas, grava a política de acesso e faz as assinaturas.'
    - '  - caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs'
    - '    descricao: Publica uma mensagem e confere uma cópia em cada fila.'
    - '  - caminho: scenarios/10-S3.SQS.Notification/'
    - '    descricao: Notificação de objeto criado no S3 entregue numa fila.'
    - 'direita:'
    - '  titulo: Infraestrutura de teste'
    - '  nos:'
    - '  - caminho: src/'
    - '    descricao: Código compartilhado pelos cenários.'
    - '  - caminho: src/AppHost/Program.cs'
    - '    descricao: Declara os contêineres do LocalStack e do PostgreSQL para o Aspire.'
    - '  - caminho: src/Shared/LocalStackFixture.cs'
    - '    descricao: Sobe o ambiente, espera o LocalStack ficar saudável e adquire o bloqueio da porta 4566.'
    - '  - caminho: src/Shared/AwsClientFactory.cs'
    - '    descricao: Cria os clientes do SDK apontando para o LocalStack.'
  - tipo: arvores
    esquerda:
      titulo: Cenários de mensageria
      nos:
      - caminho: scenarios/
        descricao: Um projeto xUnit independente por cenário de integração.
      - caminho: scenarios/02-SQS.Basic/
        descricao: 'Operações básicas de fila: criar, enviar, receber, apagar e fila de mensagens mortas.'
      - caminho: scenarios/04-SNS.Basic/
        descricao: Operações básicas de tópico.
      - caminho: scenarios/09-SNS.SQS.Fanout/
        descricao: Fan-out de um tópico para duas filas.
      - caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        descricao: Cria tópico e filas, grava a política de acesso e faz as assinaturas.
      - caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs
        descricao: Publica uma mensagem e confere uma cópia em cada fila.
      - caminho: scenarios/10-S3.SQS.Notification/
        descricao: Notificação de objeto criado no S3 entregue numa fila.
    direita:
      titulo: Infraestrutura de teste
      nos:
      - caminho: src/
        descricao: Código compartilhado pelos cenários.
      - caminho: src/AppHost/Program.cs
        descricao: Declara os contêineres do LocalStack e do PostgreSQL para o Aspire.
      - caminho: src/Shared/LocalStackFixture.cs
        descricao: Sobe o ambiente, espera o LocalStack ficar saudável e adquire o bloqueio da porta 4566.
      - caminho: src/Shared/AwsClientFactory.cs
        descricao: Cria os clientes do SDK apontando para o LocalStack.
  - tipo: conceito

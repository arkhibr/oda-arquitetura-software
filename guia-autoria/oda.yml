- id: laboratorio
  titulo: Crie sua ODA
  blocos:
  - tipo: faixa
    estilo: objetivo
    problema: Uma ODA escrita sem estrutura comum mistura objetivo, contexto e exercício, e o aluno que chega direto nela não sabe o que precisa fazer nem por quê.
    impacto: Sem objetivo explícito e sem conceitos definidos antes do uso, o aluno executa passos sem entender o problema que eles resolvem e não consegue transferir o aprendizado para outro sistema.
    mecanismo: O laboratório monta uma ODA mínima em `oda.yml` com as seis abas, o glossário na aba Objetivos, a faixa de objetivo no Laboratório e o contexto de cada trecho de código, regras que o gerador confere.
    comprovacao: O comando `.venv/bin/python scripts/gerar_odas.py` termina com `0 erro(s).`, e a página gerada abre no navegador com as seis abas.
  - tipo: passos
    itens:
    - titulo: Registre no catálogo
      texto: Em catalogo/odas.yml, preencha os campos da ODA, incluindo situacao disponivel e app oda-<id>. Confira o commit do repositório.
    - titulo: Escreva o conteúdo
      texto: 'Crie odas/oda-<id>/oda.yml com id e titulo iguais aos do catálogo e as seis abas na ordem exigida: objetivos, conceito, simulacao, laboratorio, diagnostico e verificacao.'
    - titulo: Escolha os componentes
      texto: Use os exemplos das etapas anteriores e adapte os campos ao seu conteúdo. Para arquivos e fluxos, use o commit fixado no catálogo.
    - titulo: Gere e confira
      texto: Execute os comandos exibidos abaixo, abra a ODA gerada e teste as interações e o layout em telas pequenas.
    - titulo: Proteja a publicação
      texto: Inclua a nova ODA nos testes de navegador e execute os portões de qualidade documentados em Sobre > Compreender o código.
  - tipo: editor
    rotulo: terminal
    linhas:
    - .venv/bin/mkdocs build --strict
    - .venv/bin/python scripts/gerar_odas.py --destino site
    - python3 scripts/servidor_estatico.py 8000 site
  - tipo: faixa
    estilo: dica
    texto: Consulte Sobre > Estender a aplicação para o esquema completo e os testes necessários. O gerador é a fonte de verdade para validação.

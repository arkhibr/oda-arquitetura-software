site_name: ODAs — Arquitetura de Referência
site_description: Objetos Digitais de Aprendizagem sobre a arquitetura de referência da Faciltech
use_directory_urls: true
exclude_docs: |
  superpowers/**

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest

hooks:
  - hooks/catalogo.py

extra_css:
  - assets/stylesheets/oda.css

extra_javascript:
  - path: assets/javascripts/oda/index.mjs
    type: module

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Catálogo de ODAs: odas/index.md
  - Como escrever uma ODA: referencia/modelo-de-oda.md

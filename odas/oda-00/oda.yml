  - tipo: faixa
    estilo: erro
    sintoma: Depois de reiniciar o Docker ou o LocalStack, a rota `/endereco` mostra que o módulo está indisponível.
    causa: O compose não ativa a persistência do LocalStack, e os buckets com os bundles se perdem a cada reinício.
    correcao: Rodar `npm run deploy` de novo, que recria os buckets e atualiza o manifesto.
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta três falhas comuns ao subir o portal pela primeira vez. Nas três, a tela mostra a mesma mensagem de erro do microfrontend, e é o console do navegador que diferencia a causa: escolha a causa de cada incidente para ver a explicação e a correção.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Health check
      definicao: Endereço que um serviço expõe para informar se está pronto para receber requisições. O deploy consulta `/_localstack/health` e sobe o compose quando o LocalStack não responde.
      referencia:
        rotulo: microservices.io · Health Check API
        url: https://microservices.io/patterns/observability/health-check-api.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
  - tipo: incidente
    titulo: Módulo indisponível depois de desfazer alterações
    origem: executado
    rotulo_saida: log
    saida: "tela: O módulo Alteração de Endereço está indisponível no momento.\nconsole: error: [mfe] falha ao carregar \"Alteração de Endereço\": Error: [mfe] integridade do bundle inválida\n    at verifyBundleIntegrity (http://localhost:5173/src/app/mfe/loadMfeModule.ts:16:34)"
    pergunta: O deploy foi feito e, em seguida, o `public/mfe-manifest.json` foi restaurado com `git checkout`. Qual é a causa?
    correcao: Rodar `npm run deploy` de novo, para que o manifesto receba o hash do bundle publicado.
    alternativas:
    - texto: O usuário não fez login.
      correta: false
      explicacao: Sem login, o roteador levaria para `/login` antes de tentar montar o microfrontend.
    - texto: O hash do manifesto voltou ao valor do commit e não corresponde mais ao bundle publicado.
      correta: true
      explicacao: O shell recalcula o SHA-256 do bundle baixado e recusa a montagem quando ele difere do `integrity`.
    - texto: O LocalStack está fora do ar.
      correta: false
      explicacao: Com o LocalStack fora do ar, o erro seria `Failed to fetch`, e não de integridade.
  - tipo: incidente
    titulo: Módulo indisponível com o shell no ar
    origem: executado
    rotulo_saida: log
    saida: "tela: O módulo Alteração de Endereço está indisponível no momento.\nconsole: error: Failed to load resource: net::ERR_FAILED\nconsole: error: [mfe] falha ao carregar \"Alteração de Endereço\": TypeError: Failed to fetch\n    at loadMfeModule (http://localhost:5173/src/app/mfe/loadMfeModule.ts:20:25)"
    pergunta: O shell carregou normalmente, mas o microfrontend não. Qual é a causa?
    correcao: Subir o LocalStack com `docker compose -f infra/docker-compose.yml up -d` e rodar `npm run deploy` de novo.
    alternativas:
    - texto: O hash do bundle está errado.
      correta: false
      explicacao: A verificação de hash só acontece depois que o bundle é baixado.
    - texto: O microfrontend lançou uma exceção ao montar.
      correta: false
      explicacao: A falha aconteceu em `loadMfeModule`, antes da montagem.
    - texto: O bundle não pôde ser baixado, porque o LocalStack, que serve os buckets na porta 4566, está parado.
      correta: true
      explicacao: '`Failed to fetch` indica que a requisição do bundle não obteve resposta.'
  - tipo: incidente
    titulo: Bucket inexistente depois de reiniciar o LocalStack
    origem: executado
    rotulo_saida: log
    saida: 'GET http://localhost:4566/_localstack/health -> 200

      GET http://localhost:4566/mfe-endereco/endereco.js -> 404

      <Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message>...<BucketName>mfe-endereco</BucketName></Error>'
    pergunta: O LocalStack responde ao health check, mas o bundle não existe mais. Por quê?
    correcao: Rodar `npm run deploy` depois de cada reinício do LocalStack.
    alternativas:
    - texto: O LocalStack do compose não guarda os dados entre reinícios, e os buckets precisam ser recriados.
      correta: true
      explicacao: O `infra/docker-compose.yml` não ativa a persistência, então cada reinício começa com o S3 vazio.
    - texto: O nome do bucket mudou no manifesto.
      correta: false
      explicacao: O manifesto continua apontando para `mfe-endereco`, que deixou de existir.
    - texto: O Gateway bloqueou o download.
      correta: false
      explicacao: O bundle é baixado direto do LocalStack, sem passar pelo Gateway.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Camadas do shell
      definicao: Pastas de `src/` declaradas como camadas na configuração do ESLint, de cima para baixo `app`, `pages`, `widgets`, `features`, `entities` e `shared`, mais a exceção `mocks`. As pastas `widgets` e `entities` estão declaradas e não existem no commit de referência.
      referencia:
        rotulo: Feature-Sliced Design · Visão geral
        url: https://feature-sliced.design/docs/get-started/overview
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
  - tipo: quiz
    perguntas:
    - enunciado: Onde fica o código que baixa e monta os microfrontends?
      alternativas:
      - texto: Em `gateway/`.
        correta: false
        explicacao: O Gateway atende chamadas de API, e não o download dos bundles.
      - texto: Em `src/app/mfe/`, no shell.
        correta: true
        explicacao: O motor de microfrontends fica na camada `app` do shell.
      - texto: Em `mfes/endereco/`.
        correta: false
        explicacao: Essa pasta contém um microfrontend, e não o motor que carrega os microfrontends.
    - enunciado: Por que o `public/mfe-manifest.json` aparece modificado depois do `npm run deploy`?
      alternativas:
      - texto: O deploy adiciona novos microfrontends ao manifesto.
        correta: false
        explicacao: O deploy só atualiza o hash das entradas existentes.
      - texto: O Vite reformata todos os arquivos JSON.
        correta: false
        explicacao: A alteração vem do script de deploy, e não do Vite.
      - texto: O deploy grava no campo `integrity` o SHA-256 dos bundles que acabou de publicar.
        correta: true
        explicacao: A decisão de gravar no manifesto o hash do bundle publicado pelo deploy está registrada na Atualização 1.1 da ADR-011.
    - enunciado: Qual peça responde na porta 4566?
      alternativas:
      - texto: O LocalStack, que emula o S3 com os bundles.
        correta: true
        explicacao: É a porta declarada no `infra/docker-compose.yml` e usada nas URLs do manifesto.
      - texto: O shell em modo de desenvolvimento.
        correta: false
        explicacao: O shell responde na porta 5173.
      - texto: O Gateway de API.
        correta: false
        explicacao: O Gateway usa a porta 4000.
    - enunciado: A tela mostra o módulo indisponível e o console registra `integridade do bundle inválida`. O que fazer?
      alternativas:
      - texto: Apagar a pasta `node_modules`.
        correta: false
        explicacao: As dependências não participam da verificação de integridade.
      - texto: Rodar `npm run deploy` de novo, para alinhar o manifesto ao bundle publicado.
        correta: true
        explicacao: O deploy recalcula o hash e atualiza o manifesto.
      - texto: Reiniciar o navegador.
        correta: false
        explicacao: O hash divergente continua no manifesto depois do reinício.
    - enunciado: Por que o login funciona sem nenhum back-end rodando?
      alternativas:
      - texto: O Gateway aceita qualquer senha em desenvolvimento.
        correta: false
        explicacao: O shell em desenvolvimento não chama o Gateway para o login.
      - texto: O login fica gravado no LocalStack.
        correta: false
        explicacao: O LocalStack guarda apenas os bundles.
      - texto: Em desenvolvimento, o shell ativa o back-end simulado do MSW, que responde ao login de teste.
        correta: true
        explicacao: Os handlers ficam em `src/mocks/` e aceitam o usuário `usuario@teste.com`.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O deploy publicou os dois microfrontends no LocalStack.
    - O shell subiu em `http://localhost:5173/`.
    - O login de teste levou ao painel.
    - A rota `/endereco` mostrou o formulário do microfrontend.
    - As três falhas de ambiente estão claras.

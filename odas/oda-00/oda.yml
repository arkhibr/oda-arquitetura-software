id: '00'
titulo: Ambiente e mapa do repositório
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é colocar o portal `frontend-react` para rodar na sua máquina e localizar cada parte dele no repositório, porque sem o ambiente no ar e sem esse mapa nenhuma decisão de arquitetura do portal pode ser conferida no código. Você vai clonar o repositório, publicar os microfrontends num Amazon S3 (Simple Storage Service) local emulado pelo LocalStack, subir o shell e abrir a rota `/endereco`, que carrega um microfrontend publicado. No caminho, cada pasta do repositório fica associada à responsabilidade que ela tem no portal, e as falhas de ambiente mais comuns passam a ser reconhecidas pela mensagem do console do navegador.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: Type stripping do Node.js (`--experimental-strip-types`)
      definicao: Opção do Node.js que remove as anotações de tipo de um arquivo TypeScript e executa o JavaScript que sobra, sem etapa de compilação. Os scripts de deploy, o Gateway e os BFFs rodam dessa forma, e por isso exigem Node 22.12 ou superior.
      referencia:
        rotulo: Node.js · Módulos TypeScript
        url: https://nodejs.org/api/typescript.html
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: detached HEAD
      definicao: Estado do Git em que a cópia de trabalho aponta para um commit específico, fora de qualquer branch. É o estado que o `git checkout` de um commit produz, e as alterações feitas nele não pertencem a nenhum branch até que um seja criado.
      referencia:
        rotulo: Git · git checkout
        url: https://git-scm.com/docs/git-checkout
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: WSL (Windows Subsystem for Linux) e Git Bash
      definicao: O WSL é um recurso do Windows que executa um ambiente Linux completo, e o Git Bash é o terminal bash que acompanha o Git para Windows. Os dois aceitam a sintaxe de comandos usada nos laboratórios.
      referencia:
        rotulo: Microsoft Learn · O que é o Subsistema do Windows para Linux
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: SPA (Single-Page Application)
      definicao: Aplicação web que carrega uma única página HTML e troca o conteúdo da tela por JavaScript, sem recarregar a página a cada navegação. O shell é uma SPA.
      referencia:
        rotulo: MDN · SPA (Single-page application)
        url: https://developer.mozilla.org/en-US/docs/Glossary/SPA
    - termo: Hono
      definicao: Framework web leve para JavaScript e TypeScript, que define rotas e middlewares de um servidor HTTP. O Gateway e os BFFs do repositório são aplicações Hono.
      referencia:
        rotulo: Hono · Documentação
        url: https://hono.dev/docs/
    - termo: Modelo C4
      definicao: Forma de diagramar arquitetura de software em quatro níveis de detalhe, contexto, containers, componentes e código, em que cada nível amplia uma parte do anterior. A documentação do repositório traz os níveis de contexto e de containers em `docs/architecture/README.md`.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Provider
      definicao: Componente React que disponibiliza um recurso, como o store do Redux ou o cliente do React Query, para todos os componentes abaixo dele na árvore. O shell reúne os providers em `src/app/providers/index.tsx`.
    - termo: ESM (ECMAScript Modules)
      definicao: Formato padrão de módulos do JavaScript, com `import` e `export`, que o navegador carrega diretamente. Os bundles dos microfrontends são módulos ESM.
      referencia:
        rotulo: MDN · Módulos JavaScript
        url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Modules
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: CORS (Cross-Origin Resource Sharing)
      definicao: Mecanismo de cabeçalhos HTTP com que um servidor autoriza páginas de outra origem a ler as respostas dele. Os buckets precisam de CORS porque o shell, na porta 5173, baixa bundles servidos pela porta 4566, que é outra origem.
      referencia:
        rotulo: MDN · Cross-Origin Resource Sharing (CORS)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Camadas do shell
      definicao: Pastas de `src/` declaradas como camadas na configuração do ESLint, de cima para baixo `app`, `pages`, `widgets`, `features`, `entities` e `shared`, mais a exceção `mocks`. As pastas `widgets` e `entities` estão declaradas e não existem no commit de referência.
      referencia:
        rotulo: Feature-Sliced Design · Visão geral
        url: https://feature-sliced.design/docs/get-started/overview
    - termo: Feature-Sliced Design (FSD)
      definicao: Metodologia de organização de front-end em camadas com responsabilidade definida, como `app`, `pages`, `features` e `shared`, em que cada camada só importa das camadas abaixo dela. O shell do repositório segue essa organização dentro de `src/`.
      referencia:
        rotulo: Feature-Sliced Design · Visão geral
        url: https://feature-sliced.design/docs/get-started/overview
    - termo: Health check
      definicao: Endereço que um serviço expõe para informar se está pronto para receber requisições. O deploy consulta `/_localstack/health` e sobe o compose quando o LocalStack não responde.
      referencia:
        rotulo: microservices.io · Health Check API
        url: https://microservices.io/patterns/observability/health-check-api.html
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Identificar a responsabilidade de cada pasta de primeiro nível do `frontend-react`.
    - Executar o deploy dos microfrontends no LocalStack e subir o shell em modo de desenvolvimento.
    - Distinguir o shell, os microfrontends, o LocalStack, o Gateway e os BFFs pela porta e pela forma de subir.
    - Diagnosticar as falhas de ambiente mais comuns pela mensagem do console do navegador.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários Node 22.12 ou superior, com recomendação do Node 24, npm, Git e Docker com o comando `docker compose`. Os scripts de deploy, do Gateway e dos BFFs rodam com `node --experimental-strip-types`, opção que o Node 20 não reconhece. O laboratório usa o repositório `arkhibr/frontend-react` no commit `2179313`.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: 'Qualquer versão a partir da 22.12 atende. No Node 22 aparece o aviso `ExperimentalWarning: Type Stripping is an experimental feature`, que não impede a execução.'
    - entrada: docker compose version
      saida: Docker Compose version 5.1.4
      origem: exemplo
      dica: O deploy usa `docker compose` para subir o LocalStack quando ele não está no ar.
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Docker Compose
      comando: docker compose version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta as peças do portal `frontend-react`: o shell, aplicação React que hospeda a navegação, dois microfrontends, telas publicadas à parte e carregadas pelo shell quando a página roda, um Gateway de API, ponto único de entrada que autentica as chamadas, e dois BFFs, serviços que adaptam o back-end a cada tela. Os conceitos abaixo explicam cada peça e o caminho de publicação, e as duas árvores reproduzem as pastas do repositório no commit `2179313`, a da esquerda a partir da raiz e a da direita dentro do shell, em `src/`. Clique numa pasta para ver a responsabilidade dela.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: SPA (Single-Page Application)
      definicao: Aplicação web que carrega uma única página HTML e troca o conteúdo da tela por JavaScript, sem recarregar a página a cada navegação. O shell é uma SPA.
      referencia:
        rotulo: MDN · SPA (Single-page application)
        url: https://developer.mozilla.org/en-US/docs/Glossary/SPA
    - termo: Hono
      definicao: Framework web leve para JavaScript e TypeScript, que define rotas e middlewares de um servidor HTTP. O Gateway e os BFFs do repositório são aplicações Hono.
      referencia:
        rotulo: Hono · Documentação
        url: https://hono.dev/docs/
    - termo: Modelo C4
      definicao: Forma de diagramar arquitetura de software em quatro níveis de detalhe, contexto, containers, componentes e código, em que cada nível amplia uma parte do anterior. A documentação do repositório traz os níveis de contexto e de containers em `docs/architecture/README.md`.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Provider
      definicao: Componente React que disponibiliza um recurso, como o store do Redux ou o cliente do React Query, para todos os componentes abaixo dele na árvore. O shell reúne os providers em `src/app/providers/index.tsx`.
    - termo: ESM (ECMAScript Modules)
      definicao: Formato padrão de módulos do JavaScript, com `import` e `export`, que o navegador carrega diretamente. Os bundles dos microfrontends são módulos ESM.
      referencia:
        rotulo: MDN · Módulos JavaScript
        url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Modules
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: CORS (Cross-Origin Resource Sharing)
      definicao: Mecanismo de cabeçalhos HTTP com que um servidor autoriza páginas de outra origem a ler as respostas dele. Os buckets precisam de CORS porque o shell, na porta 5173, baixa bundles servidos pela porta 4566, que é outra origem.
      referencia:
        rotulo: MDN · Cross-Origin Resource Sharing (CORS)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
  - tipo: conceito
    titulo: Microfrontend e shell
    texto: Um microfrontend é uma parte da interface construída, compilada e publicada sozinha, que uma aplicação hospedeira, o shell, baixa e monta quando a página roda. No `frontend-react`, o shell em `src/` cuida do login, do layout e das rotas, e os microfrontends de `mfes/endereco/` e `mfes/emprestimo/` entram nas rotas `/endereco` e `/emprestimos` sem que o shell seja recompilado. Isso permite publicar uma tela nova sem publicar o portal inteiro, com um passo de publicação a mais para cada microfrontend.
  - tipo: conceito
    titulo: S3 local com o LocalStack
    texto: O Amazon S3 é o serviço de armazenamento de objetos da AWS, em que cada arquivo fica num bucket e é lido por uma URL, e o LocalStack é um emulador que reproduz esse serviço num contêiner Docker na porta 4566. O `npm run deploy` publica o bundle de cada microfrontend num bucket próprio desse S3 local, e é dele que o navegador baixa o código da rota `/endereco`. Como o compose do repositório não ativa a persistência, cada reinício do LocalStack apaga os buckets, e o deploy precisa ser repetido.
  - tipo: conceito
    titulo: Manifesto e hash do bundle
    texto: O manifesto `public/mfe-manifest.json` lista para cada microfrontend a URL do bundle, a rota, o estado, as dependências e o hash SHA-256 do arquivo publicado, um valor calculado a partir dos bytes que muda com qualquer byte alterado. O shell lê o manifesto ao iniciar e, antes de montar um microfrontend, recalcula o hash do bundle baixado e o compara com o campo `integrity`. O deploy reescreve esse campo a cada publicação, e por isso o `git status` mostra o manifesto modificado depois de um deploy.
  - tipo: conceito
    titulo: Gateway de API e BFFs
    texto: O Gateway de API, em `gateway/`, é o ponto único de entrada do back-end, que confere o JWT, o token assinado que identifica o usuário, e encaminha a chamada ao BFF de destino. Os BFFs, sigla de Backend for Frontend, ficam em `bffs/` e adaptam os dados do back-end ao formato de cada tela, e só aceitam chamadas que passaram pelo Gateway. Em `npm run dev`, o login do shell usa o back-end simulado do MSW e não precisa do Gateway nem dos BFFs no ar.
  - tipo: conceito
    titulo: Shell nuclear e microfrontends
    texto: O shell é um núcleo estável que cuida de login, layout e roteamento, e os microfrontends entram e saem sem recompilar o shell. Em desenvolvimento, as chamadas de API do shell caem no back-end simulado do MSW, e os microfrontends são baixados do S3 local.
    analogia: O shell funciona como o prédio de um shopping, e os microfrontends funcionam como as lojas, que abrem e fecham sem obra na estrutura do prédio.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: As pastas e os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:

      texto: Identidade do usuário, extraída do JWT pelo Gateway.
    inicio: 20
    contexto: O arquivo `gateway/src/proxy.ts` contém o roteador que repassa a requisição do Gateway ao BFF de destino. O trecho abaixo monta os cabeçalhos enviados ao BFF, e ele mostra quais dados de identidade atravessam a fronteira entre os dois containers.
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/endereco/src/auth.ts
    commit: '2179313'
    linhas:
    - 'export function createInternalAuthentication(internalGatewayKey: string): MiddlewareHandler<BffEnv> {'
    - '  return async (c, next) => {'
    - '    const sub = c.req.header(''x-authenticated-subject'')'
    - '    if (!keysMatch(c.req.header(''x-internal-gateway-key''), internalGatewayKey) ||'
    - '      !sub || !/^[A-Za-z0-9._:@-]{1,128}$/.test(sub)) {'

id: '01'
titulo: Ler a arquitetura com C4 e ADRs
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é ler a documentação de arquitetura do `frontend-react`, com os diagramas do modelo C4 e as 17 ADRs (Architecture Decision Records), e conferir no código e no terminal se ela descreve o sistema real, porque uma documentação que diverge do código leva a decisões tomadas sobre um sistema que não existe. Você vai localizar no diagrama de containers o caminho de uma requisição, encontrar a ADR que responde a cada pergunta de projeto e chamar o Gateway de API e o BFF (Backend for Frontend) para ver esse caminho funcionando. Ao final, você vai reconhecer duas divergências reais entre a documentação e o código, a posição do manifesto no diagrama e a contagem de ADRs no README da raiz.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Modelo C4
      definicao: Forma de diagramar arquitetura de software em quatro níveis de detalhe, contexto, containers, componentes e código, em que cada nível amplia uma parte do anterior. A documentação do repositório traz os níveis de contexto e de containers em `docs/architecture/README.md`.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Container (no modelo C4)
      definicao: Aplicação ou armazenamento de dados que roda separadamente e se comunica pela rede, como o shell, o Gateway, cada BFF e o S3. O termo do C4 não se refere a contêineres Docker, embora um container possa rodar dentro de um.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: curl
      definicao: Ferramenta de linha de comando que envia requisições HTTP e mostra a resposta, com a opção `-i` para exibir também o status e os cabeçalhos. No Windows, o PowerShell trata `curl` como outro comando, e por isso os laboratórios usam o Git Bash ou o WSL.
    - termo: WSL (Windows Subsystem for Linux) e Git Bash
      definicao: O WSL é um recurso do Windows que executa um ambiente Linux completo, e o Git Bash é o terminal bash que acompanha o Git para Windows. Os dois aceitam a sintaxe de comandos usada nos laboratórios.
      referencia:
        rotulo: Microsoft Learn · O que é o Subsistema do Windows para Linux
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: detached HEAD
      definicao: Estado do Git em que a cópia de trabalho aponta para um commit específico, fora de qualquer branch. É o estado que o `git checkout` de um commit produz, e as alterações feitas nele não pertencem a nenhum branch até que um seja criado.
      referencia:
        rotulo: Git · git checkout
        url: https://git-scm.com/docs/git-checkout
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Status de uma ADR
      definicao: Situação da decisão registrada, como Proposed para proposta, Accepted para aceita e Superseded para substituída. No commit de referência, todas as ADRs do repositório estão como Proposed.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Driver arquitetural
      definicao: Requisito, restrição ou objetivo de qualidade que orienta uma decisão de arquitetura, como a experiência da equipe ou a exigência de isolamento entre módulos. As ADRs do repositório listam os drivers antes de comparar as opções.
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Vue
      definicao: Framework JavaScript para construção de interfaces, alternativa ao React avaliada e descartada na ADR-001 do repositório.
    - termo: Proxy reverso
      definicao: Componente que recebe a requisição do cliente e a repassa a outro servidor, devolvendo a resposta dele. O `proxy.ts` do Gateway faz esse papel, escolhendo o BFF pelo prefixo `/bff/<nome>` do caminho.
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: Hono
      definicao: Framework web leve para JavaScript e TypeScript, que define rotas e middlewares de um servidor HTTP. O Gateway e os BFFs do repositório são aplicações Hono.
      referencia:
        rotulo: Hono · Documentação
        url: https://hono.dev/docs/
    - termo: Middleware
      definicao: Função que processa a requisição antes ou depois do tratador final e pode encerrá-la com uma resposta. No Gateway, os middlewares rodam em sequência, do identificador de correlação até o proxy que encaminha ao BFF.
      referencia:
        rotulo: Hono · Middleware
        url: https://hono.dev/docs/guides/middleware
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
    - termo: Emissor e audiência de um JWT (`iss` e `aud`)
      definicao: Campos do token que dizem quem o emitiu e para qual serviço ele foi emitido. O Gateway só aceita tokens com o emissor e a audiência configurados nele.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Assinatura do JWT
      definicao: Parte final do token, calculada com uma chave a partir do cabeçalho e do conteúdo, que prova que o token não foi alterado e foi emitido por quem tem a chave. O shell só lê o conteúdo, e quem confere a assinatura é o Gateway.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Limite de taxa (rate limiting)
      definicao: Controle que restringe quantas requisições um cliente pode fazer numa janela de tempo e responde HTTP 429 quando o limite é ultrapassado. O Gateway aplica um limite global e outro para os métodos que alteram dados.
      referencia:
        rotulo: MDN · 429 Too Many Requests
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/429
    - termo: '`eslint-plugin-boundaries`'
      definicao: Plugin do ESLint que associa cada pasta a um elemento, como uma camada, e acusa as importações entre elementos que a configuração não permite. O erro dele aparece com o nome de regra `boundaries/dependencies`.
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: CSP (Content Security Policy)
      definicao: Cabeçalho HTTP com que o servidor informa ao navegador de quais origens a página pode carregar scripts, estilos e outros recursos e para onde ela pode abrir conexões. O navegador bloqueia o que a política não autoriza, e a ADR-012 do repositório adota uma política estrita.
      referencia:
        rotulo: MDN · Políticas de Segurança de Conteúdo (CSP)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: Nginx
      definicao: Servidor web que, em produção, entrega os arquivos compilados do shell e aplica os cabeçalhos de segurança. O `Dockerfile` do repositório gera uma imagem com o Nginx a partir do build do Vite.
      referencia:
        rotulo: nginx · Documentação
        url: https://nginx.org/en/docs/
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Comparação em tempo constante
      definicao: Comparação de segredos cujo tempo de execução não depende de quantos caracteres coincidem, o que impede descobrir a chave medindo o tempo de resposta. O BFF de endereço compara a chave interna com `timingSafeEqual`, do módulo `node:crypto`.
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Interpretar os níveis de contexto e de containers do modelo C4 aplicados ao portal.
    - Localizar a ADR que responde a cada pergunta de projeto.
    - Rastrear uma requisição do cliente ao Gateway e do Gateway ao BFF no diagrama e no código.
    - Identificar divergências entre a documentação e o código do repositório.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: 'O repositório `arkhibr/frontend-react` no commit `2179313`: rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta e rode `git checkout 2179313`. O laboratório também usa Node.js 22.12 ou superior, `curl` e `grep`, com comandos na sintaxe do bash. No Windows, os passos devem ser executados no Git Bash ou no WSL, porque o PowerShell trata `curl` como outro comando e não tem `grep`.'
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: curl --version
      saida: curl 8.7.1 (x86_64-apple-darwin26.0) libcurl/8.7.1 (SecureTransport) LibreSSL/3.3.6 zlib/1.2.12 nghttp2/1.69.0
      origem: exemplo
      dica: Qualquer versão do curl atende.
    cenarios:
    - rotulo: Verificar o curl
      comando: curl --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba explica os dois artefatos que a documentação do repositório usa: o modelo C4, forma de desenhar a arquitetura em quatro níveis de detalhe, do contexto até o código, e as ADRs, documentos curtos que registram cada decisão de arquitetura com o contexto, as opções e as consequências. Os conceitos abaixo explicam como ler cada um, e o diagrama de containers mostra as peças que o laboratório chama pelo terminal.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Driver arquitetural
      definicao: Requisito, restrição ou objetivo de qualidade que orienta uma decisão de arquitetura, como a experiência da equipe ou a exigência de isolamento entre módulos. As ADRs do repositório listam os drivers antes de comparar as opções.
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: Vue
      definicao: Framework JavaScript para construção de interfaces, alternativa ao React avaliada e descartada na ADR-001 do repositório.
  - tipo: conceito
    titulo: Modelo C4
    texto: 'O modelo C4 descreve a arquitetura de um sistema em quatro níveis de detalhe: o contexto mostra o sistema, os usuários e os sistemas externos, os containers mostram as aplicações e os armazenamentos que se comunicam pela rede, os componentes mostram as partes de cada container, e o código mostra classes e arquivos. Em `docs/architecture/README.md`, o nível de containers mostra o shell, o Gateway, os BFFs e o armazenamento dos bundles. É nesse nível que se acompanha o caminho de uma requisição entre as peças do portal.'
  - tipo: conceito
    titulo: ADR, o registro de decisão de arquitetura
    texto: Uma ADR, sigla de Architecture Decision Record, é um documento curto que registra uma decisão de arquitetura com o contexto, as opções avaliadas, a decisão e as consequências. O repositório guarda 17 ADRs em `docs/architecture/adrs/`, e o índice de `docs/architecture/README.md` mostra o status de cada uma, que no commit de referência é `Proposed` para todas. Ler a ADR junto com o diagrama permite conferir se o código ainda segue a razão registrada para cada escolha.
  - tipo: conceito
    titulo: Gateway de API e BFF
    texto: O Gateway de API é o ponto único de entrada do back-end, que valida o JWT, o token assinado enviado pelo navegador, e encaminha a chamada, e um BFF, sigla de Backend for Frontend, é um serviço que adapta os dados do back-end ao formato de uma interface. No repositório, o Gateway em `gateway/` remove o JWT e envia ao BFF a chave interna e a identidade do usuário, e o BFF recusa com 401 qualquer chamada que não traga esses cabeçalhos. É esse caminho que o laboratório confere contra o diagrama de containers.
  - tipo: conceito
    titulo: Como ler uma ADR
    texto: 'Toda ADR do repositório tem contexto, opções avaliadas, decisão e consequências, e a ordem das seções varia: a ADR-001, mostrada abaixo, apresenta a decisão antes das opções, e a ADR-015 começa por contexto, drivers e opções. O índice em `docs/architecture/README.md` mostra o status de cada uma, e no commit de referência todas estão como Proposed.'
    analogia: O diagrama funciona como a planta de uma casa, e a ADR funciona como o memorial que explica por que a escada ficou naquela parede.
  - tipo: comparativo
    colunas:
    - O que mostra
    - Onde está no repositório
    linhas:
    - dimensao: Nível 1 · Contexto
      valores:
      - O sistema, os usuários e os sistemas externos
      - '`docs/architecture/README.md`, seção Diagrama de Contexto'
    - dimensao: Nível 2 · Containers
      valores:
      - Aplicações e armazenamentos que se comunicam pela rede
      - '`docs/architecture/README.md`, seção Diagrama de Containers'
    - dimensao: Nível 3 · Componentes
      valores:
      - Módulos internos de um container
      - Mapa de Módulos do mesmo README e os README de cada pasta
    - dimensao: Nível 4 · Código
      valores:
      - Classes, funções e arquivos
      - O próprio código-fonte
    - dimensao: ADR
      valores:
      - Contexto, opções avaliadas, decisão e consequências, em ordem que varia entre as ADRs
      - '`docs/architecture/adrs/`, com o status no índice do README'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: C4 · Containers
    titulo: Diagrama de containers do portal (docs/architecture/README.md)
    mermaid: "graph LR\n    user([\"\U0001F464 Usuário\"])\n\n    subgraph infra[\"Infraestrutura de produção\"]\n        nginx[\"Nginx\\nservidor HTTP estático\"]\n        shell[\"Shell nuclear\\nReact 19 + TypeScript\\nexecutado no navegador\"]\n        mfe[\"MFE autônomo\\nbundle ESM (ex: endereço)\"]\n    end\n\n    subgraph storage[\"Object storage (S3 / LocalStack)\"]\n        manifest[\"mfe-manifest.json\"]\n        bundle[\"bundles dos MFEs\\n(um bucket por MFE)\"]\n    end\n\n    gateway[\"Gateway\\nJWT · auditoria · rate limit\"]\n    bff[\"BFFs internos\\ncontrato + autorização\"]\n\n    user -->|\"HTTPS\"| nginx\n    nginx -->|\"HTML + JS + CSS\"| shell\n    shell -->|\"fetch manifesto\"| manifest\n    shell -->|\"fetch + SHA-256 + import Blob\"| bundle\n    bundle -->|\"monta na rota\"| mfe\n    shell -->|\"HTTPS + Bearer JWT\"| gateway\n    mfe -->|\"HTTPS + Bearer JWT\"| gateway\n    gateway -->|\"identidade interna\"| bff"
  - tipo: adr
    id: ADR-001
    titulo: Tática de plataforma tecnológica
    status: Proposed
    contexto: O projeto precisava de uma plataforma front-end moderna com TypeScript e ecossistema maduro, e a equipe já tinha experiência com React.
    decisao: Adotar React 19, TypeScript e Vite como plataforma principal.
    alternativas: Vue 3 com TypeScript e Vite, descartado pela falta de experiência da equipe, e não adotar plataforma alguma.
    consequencias: Estrutura, estado e roteamento exigem decisões adicionais, registradas nas ADR-002 e ADR-003, e o Vite determina as ferramentas de teste.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra, no código, o caminho de uma requisição entre os containers que os diagramas C4 descrevem: o `app.ts` e o `proxy.ts` do Gateway, a autenticação interna do BFF de endereço e a função do shell que carrega o manifesto de microfrontends. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que ligam o diagrama ao código.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Container (no modelo C4)
      definicao: Aplicação ou armazenamento de dados que roda separadamente e se comunica pela rede, como o shell, o Gateway, cada BFF e o S3. O termo do C4 não se refere a contêineres Docker, embora um container possa rodar dentro de um.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: Modelo C4
      definicao: Forma de diagramar arquitetura de software em quatro níveis de detalhe, contexto, containers, componentes e código, em que cada nível amplia uma parte do anterior. A documentação do repositório traz os níveis de contexto e de containers em `docs/architecture/README.md`.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: Proxy reverso
      definicao: Componente que recebe a requisição do cliente e a repassa a outro servidor, devolvendo a resposta dele. O `proxy.ts` do Gateway faz esse papel, escolhendo o BFF pelo prefixo `/bff/<nome>` do caminho.
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código

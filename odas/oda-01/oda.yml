- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Qual nível do C4 mostra o shell, o Gateway, os BFFs e o armazenamento como peças que se comunicam pela rede?
      alternativas:
      - texto: Contexto.
        correta: false
        explicacao: O nível 1 mostra os usuários, os sistemas externos e as fronteiras do sistema. No README deste repositório, o diagrama de contexto já separa Portal, Gateway e BFFs, mas sem o armazenamento e sem detalhar as comunicações entre as peças, que ficam para o nível 2.
      - texto: Código.
        correta: false
        explicacao: O nível 4 mostra classes e arquivos.
      - texto: Containers.
        correta: true
        explicacao: O nível 2 mostra aplicações e armazenamentos e as comunicações entre eles.
    - enunciado: Onde se confirma o status de uma ADR no repositório?
      alternativas:
      - texto: No índice de ADRs em `docs/architecture/README.md`.
        correta: true
        explicacao: O índice tem a coluna de status de cada ADR.
      - texto: No nome do arquivo da ADR.
        correta: false
        explicacao: O nome traz número e título, sem status.
      - texto: No `package.json`.
        correta: false
        explicacao: O `package.json` não registra decisões de arquitetura.
    - enunciado: Que cabeçalho prova ao BFF que a chamada veio do Gateway?
      alternativas:
      - texto: '`X-Correlation-Id`.'
        correta: false
        explicacao: A correlação serve para rastrear a requisição, e não para autenticá-la.
      - texto: '`X-Internal-Gateway-Key`.'
        correta: true
        explicacao: O BFF compara a chave recebida com a configurada, em tempo constante.
      - texto: '`Authorization`.'
        correta: false
        explicacao: O Gateway remove o JWT antes de chamar o BFF.
    - enunciado: Qual ADR explica por que os bundles ficam num bucket S3 por microfrontend?
      alternativas:
      - texto: ADR-001.
        correta: false
        explicacao: A ADR-001 trata da plataforma React, TypeScript e Vite.
      - texto: ADR-015.
        correta: false
        explicacao: A ADR-015 trata do Gateway e dos BFFs.
      - texto: ADR-011.
        correta: true
        explicacao: A ADR-011 decide o build em Vite lib mode e a hospedagem em S3.
    - enunciado: O diagrama e o código divergem sobre um detalhe. O que deve prevalecer?
      alternativas:
      - texto: O código, e a divergência deve ser registrada para correção da documentação.
        correta: true
        explicacao: O código descreve o comportamento real, e o diagrama precisa acompanhá-lo.
      - texto: O diagrama, porque foi aprovado em ADR.
        correta: false
        explicacao: O diagrama não é uma ADR, e as ADRs do repositório estão como Proposed.
      - texto: Nenhum dos dois até uma reunião de arquitetura.
        correta: false
        explicacao: O comportamento em produção é o do código, independentemente da reunião.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os quatro níveis do C4 estão claros.
    - As ADRs foram listadas e o status foi conferido no índice.
    - O Gateway respondeu 401 sem token.
    - O BFF recusou a chamada sem a chave interna e respondeu com os cabeçalhos do Gateway.
    - As duas divergências entre documentação e código foram identificadas.

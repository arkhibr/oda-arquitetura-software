    inicio: 11
    contexto: O arquivo `gateway/src/app.ts` monta o Gateway de API em Hono, a porta única pela qual o portal chega aos BFFs. O trecho abaixo é a função `createApp`, que registra os middlewares na ordem em que cada requisição passa por eles, desde o identificador de correlação até o encaminhamento ao BFF.

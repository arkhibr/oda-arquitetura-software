- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: 'Esta aba simula, sem executar nada, o caminho de uma requisição autenticada: do navegador ao Gateway, que valida o token, e do Gateway ao BFF de endereço, que só aceita chamadas com a chave interna. Percorra as etapas e depois envie pelo console três requisições, cada uma com a resposta que o Gateway e o BFF devolvem.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
    - termo: Emissor e audiência de um JWT (`iss` e `aud`)
      definicao: Campos do token que dizem quem o emitiu e para qual serviço ele foi emitido. O Gateway só aceita tokens com o emissor e a audiência configurados nele.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Assinatura do JWT
      definicao: Parte final do token, calculada com uma chave a partir do cabeçalho e do conteúdo, que prova que o token não foi alterado e foi emitido por quem tem a chave. O shell só lê o conteúdo, e quem confere a assinatura é o Gateway.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Limite de taxa (rate limiting)
      definicao: Controle que restringe quantas requisições um cliente pode fazer numa janela de tempo e responde HTTP 429 quando o limite é ultrapassado. O Gateway aplica um limite global e outro para os métodos que alteram dados.
      referencia:
        rotulo: MDN · 429 Too Many Requests
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/429
    - termo: Proxy reverso
      definicao: Componente que recebe a requisição do cliente e a repassa a outro servidor, devolvendo a resposta dele. O `proxy.ts` do Gateway faz esse papel, escolhendo o BFF pelo prefixo `/bff/<nome>` do caminho.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Vue
      definicao: Framework JavaScript para construção de interfaces, alternativa ao React avaliada e descartada na ADR-001 do repositório.
    - termo: '`eslint-plugin-boundaries`'
      definicao: Plugin do ESLint que associa cada pasta a um elemento, como uma camada, e acusa as importações entre elementos que a configuração não permite. O erro dele aparece com o nome de regra `boundaries/dependencies`.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: CSP (Content Security Policy)
      definicao: Cabeçalho HTTP com que o servidor informa ao navegador de quais origens a página pode carregar scripts, estilos e outros recursos e para onde ela pode abrir conexões. O navegador bloqueia o que a política não autoriza, e a ADR-012 do repositório adota uma política estrita.
      referencia:
        rotulo: MDN · Políticas de Segurança de Conteúdo (CSP)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os trechos de código das etapas abaixo pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: fluxo
    titulo: Caminho de uma requisição até o BFF de endereço
    etapas:
    - titulo: Correlação
      descricao: O Gateway aceita o `X-Correlation-Id` recebido ou cria um novo e o devolve no cabeçalho da resposta.
      codigo:
        arquivo: gateway/src/correlationId.ts
        commit: '2179313'
        linhas:
        - 'const id = incoming && /^[A-Za-z0-9_-]{1,128}$/.test(incoming) ? incoming : randomUUID()'
        - c.header('X-Correlation-Id', id)
        destaque:
        - 1
        - 2
    - titulo: Autenticação
      descricao: 'O Gateway exige `Authorization: Bearer` e valida emissor, público e assinatura do JWT.'
      codigo:
        arquivo: gateway/src/auth.ts
        commit: '2179313'
        linhas:
        - const match = authorization?.match(/^Bearer ([A-Za-z0-9._~-]+)$/)
        - if (!match) {
        - '  return c.json({ error: ''unauthorized'', message: ''Token Bearer ausente ou inválido.'' }, 401)'
        - '}'
        destaque:
        - 3
    - titulo: Auditoria e limite de taxa
      descricao: Com o usuário autenticado, a requisição passa pelo registro de auditoria e pelos limites de taxa global e de escrita.
    - titulo: Repasse ao BFF
      descricao: O proxy troca o JWT pela chave interna e pela identidade do usuário e chama o BFF pelo nome do caminho `/bff/<nome>`.
      codigo:
        arquivo: gateway/src/proxy.ts
        commit: '2179313'
        linhas:
        - headers.delete('authorization')
        - headers.set('X-Internal-Gateway-Key', internalGatewayKey)
        - headers.set('X-Authenticated-Subject', auth.sub)
        destaque:
        - 2
        - 3
    - titulo: Validação no BFF
      descricao: O BFF confere a chave interna e o sujeito antes de responder com o endereço.
  - tipo: console-api
    cenarios:
    - rotulo: Gateway sem token
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
      nota: A resposta traz o cabeçalho `x-correlation-id`, criado pelo Gateway antes da autenticação.
    - rotulo: BFF direto, sem a chave interna
      requisicao:
        metodo: GET
        url: http://localhost:4002/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Requisição interna não autenticada.
      origem: executado
      nota: O BFF recusa qualquer chamada que não traga a chave interna do Gateway.
    - rotulo: BFF direto, com os cabeçalhos do Gateway
      requisicao:
        metodo: GET
        url: http://localhost:4002/usuario/endereco
        cabecalhos:
          X-Internal-Gateway-Key: local-development-gateway-key
          X-Authenticated-Subject: usuario-teste
      resposta:
        status: 200
        corpo:
          cep: '01001000'
          logradouro: Praça da Sé
          numero: '1'
      origem: executado
      nota: São os cabeçalhos que o proxy do Gateway acrescenta antes de chamar o BFF.
  - tipo: classificador
    enunciado: Qual ADR responde a cada pergunta de projeto?
    categorias:
    - id: adr001
      rotulo: ADR-001
    - id: adr003
      rotulo: ADR-003
    - id: adr007
      rotulo: ADR-007
    - id: adr010
      rotulo: ADR-010
    - id: adr011
      rotulo: ADR-011
    - id: adr012
      rotulo: ADR-012
    - id: adr015
      rotulo: ADR-015
    itens:
    - texto: Por que React, e não Vue?
      categoria: adr001
      explicacao: A ADR-001 compara React e Vue e registra a experiência da equipe como critério.
    - texto: Como o estado global é gerenciado?
      categoria: adr003
      explicacao: A ADR-003 trata do gerenciamento de estado.
    - texto: Como impedir que `shared` importe de `features`?
      categoria: adr007
      explicacao: A ADR-007 adota o `eslint-plugin-boundaries`.
    - texto: Como o shell descobre quais microfrontends existem e em que ordem carregá-los?
      categoria: adr010
      explicacao: A ADR-010 trata do manifesto e da resolução de dependências.
    - texto: Onde os bundles dos microfrontends ficam hospedados?
      categoria: adr011
      explicacao: A ADR-011 decide por um bucket S3 por microfrontend, com LocalStack em desenvolvimento.
    - texto: Como reduzir o risco de script injetado na página?
      categoria: adr012
      explicacao: A ADR-012 adota Content Security Policy estrito.
    - texto: Por que o microfrontend não chama o back-end legado diretamente?
      categoria: adr015
      explicacao: A ADR-015 coloca um Gateway com BFFs entre os microfrontends e o back-end.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é confirmar, com chamadas reais, que o diagrama de containers descreve o caminho de uma requisição, porque a seta única entre o Gateway e o BFF esconde a chave interna e a identidade do usuário que o código exige. Os passos 1 a 3 percorrem a documentação e o índice das ADRs, e os passos 4 a 7 sobem o BFF de endereço e o Gateway e conferem no terminal as respostas de cada um. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Container (no modelo C4)
      definicao: Aplicação ou armazenamento de dados que roda separadamente e se comunica pela rede, como o shell, o Gateway, cada BFF e o S3. O termo do C4 não se refere a contêineres Docker, embora um container possa rodar dentro de um.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Status de uma ADR
      definicao: Situação da decisão registrada, como Proposed para proposta, Accepted para aceita e Superseded para substituída. No commit de referência, todas as ADRs do repositório estão como Proposed.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
  - tipo: faixa
    estilo: objetivo
    problema: 'A documentação do `frontend-react` diverge do código em dois pontos: o diagrama coloca o manifesto no armazenamento de objetos, e o shell o busca em `public/`, e o README da raiz cita 15 ADRs para uma pasta que tem 17. O diagrama de containers também mostra numa única seta a identidade interna entre o Gateway e o BFF.'
    impacto: Quem confia só no diagrama não sabe que o BFF recusa chamadas sem `X-Internal-Gateway-Key` e `X-Authenticated-Subject`, e procura o manifesto no lugar errado ao investigar uma falha de carga.
    mecanismo: O laboratório confronta a documentação com o código e com chamadas HTTP. Ele lê o diagrama de containers e o índice de ADRs em `docs/architecture/README.md`, sobe o BFF de endereço e o Gateway e chama os dois com o `curl`, com e sem token e com e sem a chave interna.
    comprovacao: O Gateway responde `401 Unauthorized` com `Token Bearer ausente ou inválido.` à chamada sem token, e o BFF responde 401 à chamada direta e 200 com o endereço quando recebe a chave interna e o sujeito autenticado. O índice lista as 17 ADRs, todas com status `Proposed`.
  - tipo: passos
    itens:
    - titulo: Abrir o diagrama de containers
      texto: Abra `docs/architecture/README.md` e localize a seção Diagrama de Containers. Identifique as setas entre o shell, o Gateway e os BFFs.
    - titulo: Listar as ADRs
      editor:
        rotulo: terminal
        linhas:
        - ls -1 docs/architecture/adrs
      sucesso: 17 arquivos, de `ADR-001-plataforma-tecnologica.md` a `ADR-017-contrato-de-tipos-mfe-bff-hono-rpc.md`.
    - titulo: Consultar o status no índice
      editor:
        rotulo: terminal
        linhas:
        - grep -E '^\| \[ADR-0(01|07|11|15)\]' docs/architecture/README.md
      sucesso: Quatro linhas do índice, todas com o status `Proposed`.
    - titulo: Subir o BFF de endereço
      texto: Num terminal separado, aberto na raiz do repositório, instale as dependências e suba o BFF com a chave interna usada no compose.
      editor:
        rotulo: terminal
        linhas:
        - cd bffs/endereco
        - npm ci
        - INTERNAL_GATEWAY_KEY=local-development-gateway-key npm run dev
      sucesso: '`BFF-endereco ouvindo em http://localhost:4002`.'
    - titulo: Subir o Gateway
      texto: Em outro terminal, também aberto na raiz do repositório, suba o Gateway com o segredo de desenvolvimento do JWT e a mesma chave interna.
      editor:
        rotulo: terminal
        linhas:
        - cd gateway
        - npm ci
        - JWT_SHARED_SECRET=local-development-jwt-secret INTERNAL_GATEWAY_KEY=local-development-gateway-key npm run dev
      sucesso: '`Gateway ouvindo em http://localhost:4000`.'
    - titulo: Chamar o Gateway sem token
      editor:
        rotulo: terminal
        linhas:
        - curl -i http://localhost:4000/bff/endereco/usuario/endereco
      sucesso: '`401 Unauthorized`, com `x-correlation-id` e a mensagem `Token Bearer ausente ou inválido.`'
    - titulo: Chamar o BFF diretamente
      editor:
        rotulo: terminal
        linhas:
        - curl -i http://localhost:4002/usuario/endereco
        - 'curl -i -H "X-Internal-Gateway-Key: local-development-gateway-key" -H "X-Authenticated-Subject: usuario-teste" http://localhost:4002/usuario/endereco'
      sucesso: '`401` na primeira chamada e `200` com o endereço na segunda.'
  - tipo: terminal
    titulo: terminal · frontend-react
    comandos:
    - entrada: ls -1 docs/architecture/adrs
      saida: 'ADR-001-plataforma-tecnologica.md

        ADR-002-modularizacao.md

        ADR-003-gerenciamento-de-estado.md

        ADR-004-autenticacao.md

        ADR-005-testes.md

        ADR-006-conteinizacao.md

        ADR-007-imposicao-fronteiras-arquiteturais.md

        ADR-008-microfrontends-dinamicos.md

        ADR-009-contrato-mount-unmount.md

        ADR-010-manifesto-e-dependencias.md

        ADR-011-deploy-s3-localstack.md

        ADR-012-content-security-policy.md

        ADR-013-trusted-types-e-reporting.md

        ADR-014-css-e-contrato-visual-em-microfrontends.md

        ADR-015-gateway-api-e-bff.md

        ADR-016-hono-gateway-e-bffs.md

        ADR-017-contrato-de-tipos-mfe-bff-hono-rpc.md'
      origem: executado
    - entrada: grep -E '^\| \[ADR-0(01|07|11|15)\]' docs/architecture/README.md
      saida: '| [ADR-001](adrs/ADR-001-plataforma-tecnologica.md) | Tática de plataforma tecnológica | Proposed |

        | [ADR-007](adrs/ADR-007-imposicao-fronteiras-arquiteturais.md) | Tática de imposição de fronteiras arquiteturais | Proposed |

        | [ADR-011](adrs/ADR-011-deploy-s3-localstack.md) | Build independente e deploy de MFEs em S3 (LocalStack) | Proposed |

        | [ADR-015](adrs/ADR-015-gateway-api-e-bff.md) | **Gateway de API com BFFs** | Proposed |'
      origem: executado
    - entrada: curl -i http://localhost:4000/bff/endereco/usuario/endereco
      saida: 'HTTP/1.1 401 Unauthorized

        x-correlation-id: 4d4a8692-5e1d-4399-93b1-50c078a7d083


        {"error":"unauthorized","message":"Token Bearer ausente ou inválido."}'
      origem: executado
    - entrada: curl -i http://localhost:4002/usuario/endereco
      saida: 'HTTP/1.1 401 Unauthorized


        {"error":"unauthorized","message":"Requisição interna não autenticada."}'
      origem: executado
    - entrada: 'curl -i -H "X-Internal-Gateway-Key: local-development-gateway-key" -H "X-Authenticated-Subject: usuario-teste" http://localhost:4002/usuario/endereco'
      saida: 'HTTP/1.1 200 OK


        {"cep":"01001000","logradouro":"Praça da Sé","numero":"1"}'
      origem: executado
    cenarios:
    - rotulo: Gateway sem token
      comando: curl -i http://localhost:4000/bff/endereco/usuario/endereco
    - rotulo: BFF sem a chave
      comando: curl -i http://localhost:4002/usuario/endereco
    - rotulo: BFF com os cabeçalhos
      comando: 'curl -i -H "X-Internal-Gateway-Key: local-development-gateway-key" -H "X-Authenticated-Subject: usuario-teste" http://localhost:4002/usuario/endereco'
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um leitor da documentação encontraria. As duas primeiras partem de respostas reais do Gateway e do BFF, e as duas últimas mostram divergências entre a documentação e o código: escolha a causa de cada uma para ver a explicação e a correção.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Container (no modelo C4)
      definicao: Aplicação ou armazenamento de dados que roda separadamente e se comunica pela rede, como o shell, o Gateway, cada BFF e o S3. O termo do C4 não se refere a contêineres Docker, embora um container possa rodar dentro de um.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: Nginx
      definicao: Servidor web que, em produção, entrega os arquivos compilados do shell e aplica os cabeçalhos de segurança. O `Dockerfile` do repositório gera uma imagem com o Nginx a partir do build do Vite.
      referencia:
        rotulo: nginx · Documentação
        url: https://nginx.org/en/docs/
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Status de uma ADR
      definicao: Situação da decisão registrada, como Proposed para proposta, Accepted para aceita e Superseded para substituída. No commit de referência, todas as ADRs do repositório estão como Proposed.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
  - tipo: incidente
    titulo: Quem respondeu 401?
    origem: executado
    rotulo_saida: log
    saida: 'HTTP/1.1 401 Unauthorized

      x-correlation-id: 4d4a8692-5e1d-4399-93b1-50c078a7d083


      {"error":"unauthorized","message":"Token Bearer ausente ou inválido."}'
    pergunta: Qual container produziu esta resposta?
    correcao: 'O 401 veio da borda, antes de qualquer BFF, e a investigação segue no cliente que montou a requisição sem o cabeçalho `Authorization: Bearer`.'
    alternativas:
    - texto: O shell.
      correta: false
      explicacao: O shell roda no navegador e não responde a chamadas HTTP.
    - texto: O Gateway, que recusou a requisição sem token antes de chamar o BFF.
      correta: true
      explicacao: A mensagem `Token Bearer ausente ou inválido.` vem de `gateway/src/auth.ts`, e o `x-correlation-id` foi criado pelo Gateway.
    - texto: O BFF de endereço.
      correta: false
      explicacao: O BFF responde com `Requisição interna não autenticada.`
  - tipo: incidente
    titulo: Chamada recusada pelo BFF
    origem: executado
    rotulo_saida: log
    saida: 'HTTP/1.1 401 Unauthorized


      {"error":"unauthorized","message":"Requisição interna não autenticada."}'
    pergunta: Por que o BFF recusou a chamada?
    correcao: O BFF não é ponto de entrada de clientes externos, e a chamada válida chega pelo Gateway, que acrescenta a chave interna e a identidade do usuário depois de validar o JWT.
    alternativas:
    - texto: O JWT expirou.
      correta: false
      explicacao: O BFF não lê JWT, porque o Gateway remove o cabeçalho `Authorization`.
    - texto: O endereço não existe.
      correta: false
      explicacao: Endereço inexistente geraria 404, e não 401.
    - texto: A chamada não trouxe a chave interna nem o sujeito autenticado, que só o Gateway acrescenta.
      correta: true
      explicacao: O `bffs/endereco/src/auth.ts` exige `X-Internal-Gateway-Key` e `X-Authenticated-Subject`.
  - tipo: incidente
    titulo: Manifesto no lugar errado do diagrama
    origem: codigo
    rotulo_saida: log
    saida: "docs/architecture/README.md · Diagrama de Containers\n  subgraph storage[\"Object storage (S3 / LocalStack)\"]\n      manifest[\"mfe-manifest.json\"]\n\nsrc/app/mfe/loadManifest.ts:6\n  const res = await fetch('/mfe-manifest.json')"
    pergunta: O diagrama coloca o manifesto no armazenamento de objetos. O que o código mostra?
    correcao: Tratar o código como fonte da verdade e registrar a divergência para correção do diagrama.
    alternativas:
    - texto: O shell busca o manifesto na própria origem, servido a partir de `public/`, e não no S3.
      correta: true
      explicacao: O caminho relativo `/mfe-manifest.json` aponta para o servidor do shell, que é o Vite em desenvolvimento e o Nginx em produção.
    - texto: O shell busca o manifesto no LocalStack, na porta 4566.
      correta: false
      explicacao: Apenas os bundles têm URL do LocalStack, declarada no próprio manifesto.
    - texto: O manifesto é embutido no bundle do shell durante o build.
      correta: false
      explicacao: O `fetch` acontece em tempo de execução, no boot do shell.
  - tipo: incidente
    titulo: Contagem de ADRs desatualizada
    origem: codigo
    rotulo_saida: log
    saida: 'README.md:5  ... mapa de módulos e as 15 ADRs (Architecture Decision Record ...)


      docs/architecture/adrs/  17 arquivos, de ADR-001 a ADR-017'
    pergunta: O README raiz cita 15 ADRs, e a pasta tem 17. Qual é a leitura correta?
    correcao: Consultar o índice de `docs/architecture/README.md`, que lista as 17 ADRs com status.
    alternativas:
    - texto: A pasta tem arquivos duplicados.
      correta: false
      explicacao: Os 17 arquivos têm números e títulos diferentes.
    - texto: O texto do README raiz está desatualizado em relação à pasta, que tem também as ADR-016 e ADR-017.
      correta: true
      explicacao: O índice em `docs/architecture/README.md` lista as 17 ADRs, inclusive a ADR-016 e a ADR-017.
    - texto: Duas ADRs foram revogadas e continuam na pasta.
      correta: false
      explicacao: O índice mostra as 17 com status `Proposed`, sem revogação.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Modelo C4
      definicao: Forma de diagramar arquitetura de software em quatro níveis de detalhe, contexto, containers, componentes e código, em que cada nível amplia uma parte do anterior. A documentação do repositório traz os níveis de contexto e de containers em `docs/architecture/README.md`.
      referencia:
        rotulo: C4 model · Página oficial
        url: https://c4model.com/
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Chave interna do Gateway (`X-Internal-Gateway-Key`)
      definicao: Segredo compartilhado entre o Gateway e os BFFs, enviado num cabeçalho, que prova ao BFF que a chamada passou pelo Gateway. Junto com ele, o Gateway envia o `X-Authenticated-Subject`, com o identificador do usuário tirado do JWT.
    - termo: Comparação em tempo constante
      definicao: Comparação de segredos cujo tempo de execução não depende de quantos caracteres coincidem, o que impede descobrir a chave medindo o tempo de resposta. O BFF de endereço compara a chave interna com `timingSafeEqual`, do módulo `node:crypto`.
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Identificador de correlação (`X-Correlation-Id`)
      definicao: Valor único associado a uma requisição e repassado a todos os serviços que ela atravessa, para que os registros de cada serviço possam ser ligados entre si. O Gateway reaproveita o valor recebido ou cria um novo e o devolve na resposta.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Status de uma ADR
      definicao: Situação da decisão registrada, como Proposed para proposta, Accepted para aceita e Superseded para substituída. No commit de referência, todas as ADRs do repositório estão como Proposed.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
  - tipo: quiz
    perguntas:
    - enunciado: Qual nível do C4 mostra o shell, o Gateway, os BFFs e o armazenamento como peças que se comunicam pela rede?
      alternativas:
      - texto: Contexto.
        correta: false
        explicacao: O nível 1 mostra os usuários, os sistemas externos e as fronteiras do sistema. No README deste repositório, o diagrama de contexto já separa Portal, Gateway e BFFs, mas sem o armazenamento e sem detalhar as comunicações entre as peças, que ficam para o nível 2.
      - texto: Código.
        correta: false
        explicacao: O nível 4 mostra classes e arquivos.
      - texto: Containers.
        correta: true
        explicacao: O nível 2 mostra aplicações e armazenamentos e as comunicações entre eles.
    - enunciado: Onde se confirma o status de uma ADR no repositório?
      alternativas:
      - texto: No índice de ADRs em `docs/architecture/README.md`.
        correta: true
        explicacao: O índice tem a coluna de status de cada ADR.
      - texto: No nome do arquivo da ADR.
        correta: false
        explicacao: O nome traz número e título, sem status.
      - texto: No `package.json`.
        correta: false
        explicacao: O `package.json` não registra decisões de arquitetura.
    - enunciado: Que cabeçalho prova ao BFF que a chamada veio do Gateway?
      alternativas:
      - texto: '`X-Correlation-Id`.'
        correta: false
        explicacao: A correlação serve para rastrear a requisição, e não para autenticá-la.
      - texto: '`X-Internal-Gateway-Key`.'
        correta: true
        explicacao: O BFF compara a chave recebida com a configurada, em tempo constante.
      - texto: '`Authorization`.'
        correta: false
        explicacao: O Gateway remove o JWT antes de chamar o BFF.
    - enunciado: Qual ADR explica por que os bundles ficam num bucket S3 por microfrontend?
      alternativas:
      - texto: ADR-001.
        correta: false
        explicacao: A ADR-001 trata da plataforma React, TypeScript e Vite.
      - texto: ADR-015.
        correta: false
        explicacao: A ADR-015 trata do Gateway e dos BFFs.
      - texto: ADR-011.
        correta: true
        explicacao: A ADR-011 decide o build em Vite lib mode e a hospedagem em S3.
    - enunciado: O diagrama e o código divergem sobre um detalhe. O que deve prevalecer?
      alternativas:
      - texto: O código, e a divergência deve ser registrada para correção da documentação.
        correta: true
        explicacao: O código descreve o comportamento real, e o diagrama precisa acompanhá-lo.
      - texto: O diagrama, porque foi aprovado em ADR.
        correta: false
        explicacao: O diagrama não é uma ADR, e as ADRs do repositório estão como Proposed.
      - texto: Nenhum dos dois até uma reunião de arquitetura.
        correta: false
        explicacao: O comportamento em produção é o do código, independentemente da reunião.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os quatro níveis do C4 estão claros.
    - As ADRs foram listadas e o status foi conferido no índice.
    - O Gateway respondeu 401 sem token.
    - O BFF recusou a chamada sem a chave interna e respondeu com os cabeçalhos do Gateway.
    - As duas divergências entre documentação e código foram identificadas.

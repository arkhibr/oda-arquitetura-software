id: '02'
titulo: Feature-Sliced Design e fronteiras impostas pelo ESLint
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é aplicar as regras de dependência entre as camadas do Feature-Sliced Design (FSD) no shell do `frontend-react` e entender as violações que o ESLint aponta, porque uma importação na direção proibida faz a infraestrutura comum depender de uma funcionalidade e se repete pelo código sem que a revisão manual a detecte. O shell organiza o código em camadas que só podem importar camadas abaixo delas, e o plugin `eslint-plugin-boundaries` recusa as importações que quebram essa regra. Você vai introduzir uma violação, ler o erro do lint, corrigi-la e descobrir que uma pasta fora dos elementos declarados fica sem verificação.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Feature-Sliced Design (FSD)
      definicao: Metodologia de organização de front-end em camadas com responsabilidade definida, como `app`, `pages`, `features` e `shared`, em que cada camada só importa das camadas abaixo dela. O shell do repositório segue essa organização dentro de `src/`.
      referencia:
        rotulo: Feature-Sliced Design · Visão geral
        url: https://feature-sliced.design/docs/get-started/overview
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
    - termo: '`eslint-plugin-boundaries`'
      definicao: Plugin do ESLint que associa cada pasta a um elemento, como uma camada, e acusa as importações entre elementos que a configuração não permite. O erro dele aparece com o nome de regra `boundaries/dependencies`.
    - termo: Camadas do shell
      definicao: Pastas de `src/` declaradas como camadas na configuração do ESLint, de cima para baixo `app`, `pages`, `widgets`, `features`, `entities` e `shared`, mais a exceção `mocks`. As pastas `widgets` e `entities` estão declaradas e não existem no commit de referência.
      referencia:
        rotulo: Feature-Sliced Design · Visão geral
        url: https://feature-sliced.design/docs/get-started/overview
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Esteira de CI (integração contínua)
      definicao: Sequência automática de verificações, como build, testes e lint, que roda a cada alteração enviada ao repositório. O repositório define a esteira em `.github/workflows/`, com o GitHub Actions.
      referencia:
        rotulo: GitHub Docs · Integração contínua
        url: https://docs.github.com/pt/actions/get-started/continuous-integration
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: Dependência circular
      definicao: Situação em que dois módulos importam um do outro, de forma direta ou passando por outros módulos. Esse acoplamento dificulta testar e alterar cada módulo separadamente, e a ADR-002 do repositório cita esse risco.
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Alias de caminho (`@/`)
      definicao: Atalho de importação declarado em `tsconfig.app.json`, que faz `@/` apontar para `src/`. O plugin de fronteiras resolve o alias até o arquivo real antes de identificar a camada.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: WSL (Windows Subsystem for Linux) e Git Bash
      definicao: O WSL é um recurso do Windows que executa um ambiente Linux completo, e o Git Bash é o terminal bash que acompanha o Git para Windows. Os dois aceitam a sintaxe de comandos usada nos laboratórios.
      referencia:
        rotulo: Microsoft Learn · O que é o Subsistema do Windows para Linux
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a hierarquia de camadas do Feature-Sliced Design adotada pelo shell.
    - Classificar uma importação entre camadas como permitida ou proibida segundo `eslint.config.ts`.
    - Executar o lint e interpretar o erro `boundaries/dependencies`.
    - Justificar a imposição automática das fronteiras em relação à revisão manual, com base na ADR-007.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários Node 20 ou superior, versão usada na esteira de CI e no `Dockerfile` do repositório, além de npm e Git. O laboratório usa o repositório `arkhibr/frontend-react` no commit `2179313`.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão 20 ou superior atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: O Feature-Sliced Design organiza o shell em camadas com responsabilidade definida e dependência em uma só direção. No repositório `frontend-react`, cada camada é uma pasta dentro de `src/`, e as árvores abaixo reproduzem essas pastas no commit `2179313`. Clique numa pasta para ver o papel da camada correspondente.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: As pastas e os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: arvores
    esquerda:
      titulo: Camadas declaradas em eslint.config.ts
      nos:
      - caminho: src/
        descricao: Raiz do shell. Cada subpasta corresponde a um elemento do plugin `eslint-plugin-boundaries`.
      - caminho: src/app/
        descricao: Inicialização, providers, roteamento e runtime de microfrontends. Pode importar de todas as camadas abaixo.
      - caminho: src/pages/
        descricao: Telas completas, como login e dashboard. Importa de widgets, features, entities e shared.
      - caminho: src/widgets/
        descricao: Blocos de interface reutilizáveis. Declarada na configuração, a pasta não existe no clone do commit de referência.
      - caminho: src/features/
        descricao: Ações do usuário, como a chamada de login. Importa de entities e shared.
      - caminho: src/entities/
        descricao: Conceitos de negócio. Declarada na configuração, a pasta não existe no clone do commit de referência.
      - caminho: src/shared/
        descricao: Infraestrutura reutilizável, como cliente HTTP e configuração. Não importa de nenhuma outra camada.
      - caminho: src/mocks/
        descricao: Simuladores MSW. Exceção declarada, que importa de shared, entities e features.
    direita:
      titulo: Arquivos citados nesta ODA
      nos:
      - caminho: src/pages/login/index.tsx
        descricao: Página de login, que importa de `shared` e de `features`.
      - caminho: src/features/auth/loginRequest.ts
        descricao: Chamada de login, que importa a configuração de `shared`.
      - caminho: src/shared/api/httpClient.ts
        descricao: Cliente HTTP, onde o laboratório introduz a violação.
      - caminho: src/shared/config/index.ts
        descricao: Configuração de ambiente, importada por várias camadas.
      - caminho: src/app/router/index.tsx
        descricao: Roteador, que importa as páginas.
      - caminho: src/mocks/handlers.ts
        descricao: Agregador dos handlers do MSW.
  - tipo: comparativo
    colunas:
    - Pode importar de
    - Não pode importar de
    linhas:
    - dimensao: app
      valores:
      - pages, widgets, features, entities, shared
      - mocks
    - dimensao: pages
      valores:
      - widgets, features, entities, shared
      - app, mocks
    - dimensao: widgets
      valores:
      - features, entities, shared
      - app, pages, mocks
    - dimensao: features
      valores:
      - entities, shared
      - app, pages, widgets, mocks
    - dimensao: entities
      valores:
      - shared
      - app, pages, widgets, features, mocks
    - dimensao: shared
      valores:
      - nenhuma outra camada
      - todas as camadas
    - dimensao: mocks
      valores:
      - shared, entities, features
      - app, pages, widgets
  - tipo: conceito
    titulo: Dependência em uma só direção
    texto: Cada camada importa somente das camadas abaixo dela, e importações dentro da mesma camada não são verificadas. A regra fica escrita em `eslint.config.ts` e é conferida a cada execução de `npm run lint`, inclusive na esteira de CI.
    analogia: 'As camadas funcionam como os andares de um prédio: cada andar se apoia na estrutura dos andares de baixo, e nenhum andar de baixo depende de um andar de cima.'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Hierarquia direta entre as camadas (os saltos permitidos estão na tabela acima)
    mermaid: "graph TD\n    app --> pages\n    app --> widgets\n    pages --> widgets\n    pages --> features\n    widgets --> features\n    features --> entities\n    entities --> shared\n    features --> shared\n    pages --> shared\n    mocks -.-> features\n    mocks -.-> entities\n    mocks -.-> shared"
  - tipo: adr
    id: ADR-007
    titulo: Tática de imposição de fronteiras arquiteturais
    status: Proposed
    contexto: O FSD define regras explícitas de dependência entre camadas, e sem verificação automatizada essas regras se degradam sob pressão de entrega.
    decisao: Adotar o `eslint-plugin-boundaries` para impor as regras de dependência como erros de lint executados na esteira de CI, com cada camada mapeada como um elemento do plugin.
    alternativas: A revisão de código manual, que não escala com o crescimento do time, e a ausência de mecanismo, que leva ao acúmulo de importações cruzadas.
    consequencias: Os erros de fronteira aparecem no editor e na esteira de CI, e todo novo módulo precisa ser registrado em `boundaries/elements`.
  - tipo: adr
    id: ADR-002
    titulo: Tática de modularização
    status: Proposed
    contexto: A organização por tipo técnico espalha uma funcionalidade por várias pastas e aumenta o risco de dependências circulares à medida que o projeto cresce.
    decisao: Adotar o Feature-Sliced Design com imposição via ESLint, para obter coesão por domínio e dependências unidirecionais verificadas automaticamente.
    alternativas: A organização por tipo técnico, adequada só a projetos pequenos, e a ausência de estrutura imposta.
    consequencias: O onboarding passa a ser guiado pela estrutura de pastas, e cada funcionalidade nova exige decidir a camada a que pertence.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra onde as camadas do Feature-Sliced Design viram regra verificável: a configuração do ESLint que declara as camadas e as importações permitidas entre elas, duas importações reais do shell e o alias `@/` do TypeScript, que o plugin precisa resolver. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para esta ODA.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: eslint.config.ts
    commit: '2179313'
    linhas:
    - '      ''boundaries/elements'': ['
    - '        { type: ''shared'',   pattern: ''src/shared/**'' },'
    - '        { type: ''entities'', pattern: ''src/entities/**'' },'
    - '        { type: ''features'', pattern: ''src/features/**'' },'
    - '        { type: ''widgets'',  pattern: ''src/widgets/**'' },'
    - '        { type: ''pages'',    pattern: ''src/pages/**'' },'
    - '        { type: ''app'',      pattern: ''src/app/**'' },'
    - '        { type: ''mocks'',    pattern: ''src/mocks/**'' },'
    - '      ],'
    - '      ''boundaries/ignore'': [''src/main.tsx'', ''src/test-setup.ts''],'
    - '    },'
    - '    rules: {'
    - '      ...reactHooks.configs.recommended.rules,'
    - '      ''@typescript-eslint/no-unused-vars'': [''error'', { argsIgnorePattern: ''^_'' }],'
    - '      ''boundaries/dependencies'': [''error'', {'
    - '        default: ''disallow'','
    - '        rules: ['
    - '          { from: { type: ''shared'' },   disallow: { to: { type: ''*'' } } },'
    - '          { from: { type: ''entities'' }, allow: { to: { type: [''shared''] } } },'
    - '          { from: { type: ''features'' }, allow: { to: { type: [''entities'', ''shared''] } } },'
    - '          { from: { type: ''widgets'' },  allow: { to: { type: [''features'', ''entities'', ''shared''] } } },'
    - '          { from: { type: ''pages'' },    allow: { to: { type: [''widgets'', ''features'', ''entities'', ''shared''] } } },'
    - '          { from: { type: ''app'' },      allow: { to: { type: [''pages'', ''widgets'', ''features'', ''entities'', ''shared''] } } },'
    - '          { from: { type: ''mocks'' },    allow: { to: { type: [''shared'', ''entities'', ''features''] } } },'
    - '        ],'
    - '      }],'
    anotacoes:
    - linha: 32
      texto: Cada camada vira um elemento do plugin, identificado pelo padrão de caminho.
    - linha: 49
      texto: A camada `shared` não pode importar de nenhuma outra. Esta é a regra de índice 0, citada na mensagem de erro.
    - linha: 47
      texto: Tudo o que não estiver listado nas regras é proibido.
    - linha: 55
      texto: Exceção declarada para os simuladores do MSW.
    inicio: 32
    contexto: O arquivo `eslint.config.ts`, na raiz do repositório, configura o ESLint do shell, e o plugin `eslint-plugin-boundaries` é quem transforma as camadas do Feature-Sliced Design em regras verificadas pelo `npm run lint`. O trecho abaixo declara cada camada por um padrão de caminho dentro de `src/` e lista, para cada uma, as camadas de que ela pode importar.
  - tipo: editor
    rotulo: arquivo
    caminho: src/pages/login/index.tsx
    commit: '2179313'
    linhas:
    - import { login } from '@/shared/lib/store/authSlice'
    - import { loginRequest } from '@/features/auth/loginRequest'
    - import { Button } from '@/shared/ui/Button/Button'
    anotacoes:
    - linha: 6
      texto: A página importa de `features`, camada abaixo dela, o que é permitido.
    inicio: 5
    contexto: O arquivo `src/pages/login/index.tsx` é a tela de login do shell, que pertence à camada `pages`. As importações abaixo mostram uma página que depende de camadas inferiores, como `shared` e `features`, que é a direção de dependência que a configuração do ESLint permite.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/api/httpClient.ts
    commit: '2179313'
    linhas:
    - import { tokenStorage } from '@/shared/auth/tokenStorage'
    - import { getApiUrl } from '@/shared/config'
    - import { ApiError } from './types'
    anotacoes:
    - linha: 1
      texto: Importação dentro da própria camada `shared`, que o plugin não verifica.
    contexto: O arquivo `src/shared/api/httpClient.ts` é o cliente HTTP comum do shell e fica na camada `shared`, a mais baixa da pilha. As importações abaixo vêm todas da própria camada `shared` e servem para discutir quais importações o plugin verifica.
  - tipo: editor
    rotulo: arquivo
    caminho: tsconfig.app.json
    commit: '2179313'
    linhas:
    - '    "paths": { "@/*": ["./src/*"] }'
    anotacoes:
    - linha: 24
      texto: O alias `@/` aponta para `src/`, e o plugin resolve o caminho real antes de identificar a camada.
    inicio: 24
    contexto: O arquivo `tsconfig.app.json` configura o compilador TypeScript para o código do shell em `src/`. A linha abaixo declara o alias `@/`, usado nas importações do shell, e o ESLint precisa resolver esse alias para saber em qual camada fica o arquivo importado.
  - tipo: faixa
    estilo: dica
    texto: O plugin identifica a camada pelo caminho resolvido do arquivo importado. Por isso, trocar o alias por um caminho relativo não contorna a regra.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: 'Esta aba simula, sem executar nada, como o plugin decide se uma importação é permitida: ele descobre a camada do arquivo que importa e a do arquivo importado e confere a regra entre as duas. Percorra a decisão para uma importação proibida e depois classifique outras importações segundo as regras de `eslint.config.ts`.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os trechos de código das etapas abaixo pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: fluxo
    titulo: Como o lint decide uma importação de shared para features
    etapas:
    - titulo: Arquivo de origem
      descricao: O plugin associa `src/shared/api/httpClient.ts` ao elemento `shared` pelo padrão `src/shared/**`.
      codigo:
        arquivo: eslint.config.ts
        commit: '2179313'
        linhas:
        - '{ type: ''shared'',   pattern: ''src/shared/**'' },'
        destaque:
        - 1
    - titulo: Caminho importado
      descricao: O caminho `@/features/auth/loginRequest` é resolvido pelo alias do `tsconfig.app.json` para `src/features/auth/loginRequest.ts`.
      codigo:
        arquivo: tsconfig.app.json
        commit: '2179313'
        linhas:
        - '"paths": { "@/*": ["./src/*"] }'
        destaque:
        - 1
    - titulo: Camada de destino
      descricao: O arquivo importado pertence ao elemento `features`, pelo padrão `src/features/**`.
      codigo:
        arquivo: eslint.config.ts
        commit: '2179313'
        linhas:
        - '{ type: ''features'', pattern: ''src/features/**'' },'
        destaque:
        - 1
    - titulo: Regra aplicada
      descricao: A regra de índice 0 proíbe qualquer destino para a origem `shared`, e o lint registra o erro `boundaries/dependencies`.
      codigo:
        arquivo: eslint.config.ts
        commit: '2179313'
        linhas:
        - '{ from: { type: ''shared'' },   disallow: { to: { type: ''*'' } } },'
        destaque:
        - 1
    - titulo: Mensagem exibida
      descricao: A mensagem nomeia primeiro o tipo de destino e depois o tipo de origem, com a posição da regra em `rules`.
  - tipo: classificador
    enunciado: Classifique cada importação segundo as regras de `eslint.config.ts`.
    categorias:
    - id: permitida
      rotulo: Permitida
    - id: proibida
      rotulo: Proibida
    itens:
    - texto: '`src/pages/login/index.tsx` importa `@/features/auth/loginRequest`'
      categoria: permitida
      explicacao: '`pages` pode importar de `widgets`, `features`, `entities` e `shared`.'
    - texto: '`src/features/auth/loginRequest.ts` importa `@/shared/config`'
      categoria: permitida
      explicacao: '`features` pode importar de `entities` e `shared`.'
    - texto: '`src/shared/api/httpClient.ts` importa `@/features/auth/loginRequest`'
      categoria: proibida
      explicacao: A regra de `shared` proíbe importar de qualquer outra camada.
    - texto: '`src/features/auth/loginRequest.ts` importa `@/pages/login`'
      categoria: proibida
      explicacao: '`features` não importa camadas superiores, como `pages`.'
    - texto: '`src/app/router/index.tsx` importa `@/pages/dashboard`'
      categoria: permitida
      explicacao: '`app` é a camada superior e pode importar de todas as demais.'
    - texto: '`src/mocks/handlers.ts` importa `@/features/auth/loginRequest`'
      categoria: permitida
      explicacao: A camada `mocks` tem permissão explícita para `shared`, `entities` e `features`.
    - texto: '`src/mocks/handlers.ts` importa `@/pages/login`'
      categoria: proibida
      explicacao: A permissão de `mocks` não inclui `pages`.
    - texto: '`src/pages/dashboard/index.tsx` importa `@/app/router/routes`'
      categoria: proibida
      explicacao: '`pages` não importa de `app`, que fica acima dela.'
  - tipo: terminal
    titulo: terminal · simulador de lint
    comandos:
    - entrada: npm run lint
      condicao: simulacao_violacao
      saida: "> frontend-react@0.0.0 lint\n> eslint src/\n\n\n.../frontend-react/src/shared/api/httpClient.ts\n  4:30  error  Dependencies to elements of type \"features\" are not allowed in elements of type \"shared\". Denied by rule at index 0  boundaries/dependencies\n\n✖ 1 problem (1 error, 0 warnings)"
      origem: executado
    - entrada: npm run lint
      saida: '> frontend-react@0.0.0 lint

        > eslint src/'
      origem: executado
    cenarios:
    - rotulo: Rodar o lint
      comando: npm run lint
  - tipo: passos
    itens:
    - titulo: Simular a violação em httpClient.ts
      texto: Marque este passo para que o simulador de lint acima passe a considerar a importação proibida.

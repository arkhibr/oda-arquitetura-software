- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é estender a fatia de interface com uma preferência nova e proteger com testes a configuração de cache do React Query, porque nenhum teste do commit de referência confere o `staleTime`, e uma troca desse valor passaria despercebida. Os passos 1 a 6 acrescentam o campo `densidade` à `uiSlice` com o teste escrito antes da implementação, e os passos 7 a 10 caracterizam o cache do `queryClient` com dois testes e rodam a suíte. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: faixa
    estilo: objetivo
    problema: 'No commit `2179313`, nenhum teste confere as opções de `src/shared/lib/queryClient.ts`, e trocar `staleTime: 5 * 60 * 1000` por `staleTime: 0` não faz nenhum teste falhar. Os reducers `addToast` e `login` também geram valores fora da função, com `crypto.randomUUID()` e com a gravação no `sessionStorage`.'
    impacto: Sem teste, uma mudança no `staleTime` faz cada consulta repetida chamar a API de novo, o que aumenta a carga no back-end sem nenhum aviso. Os efeitos dentro dos reducers contrariam o guia de estilo do Redux e tornam o estado dependente de algo que o teste não controla.
    mecanismo: O laboratório aplica o teste escrito antes para acrescentar o campo `densidade` à `uiSlice`, com o `createSlice` gerando a ação `setDensidade`, e usa testes de caracterização com `vi.fn()` para contar quantas vezes o `queryClient` chama a API dentro do `staleTime`.
    comprovacao: O teste da densidade falha com `expected undefined to be 'confortavel'` e passa depois da implementação, o teste do `queryClient` falha com `expected "vi.fn()" to be called 1 times, but got 2 times` quando o `staleTime` vai a 0, e a suíte completa termina com `Tests 102 passed (102)`.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'

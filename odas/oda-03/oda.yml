id: '03'
titulo: Estado global e estado de servidor
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O shell do portal separa o estado em duas ferramentas: Redux Toolkit para o estado do cliente e React Query para o estado vindo do servidor. Esta ODA mostra onde cada ferramenta atua no código, quais regras as fatias do Redux seguem e como estender uma fatia com o teste escrito antes da implementação.'
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Distinguir estado do cliente, estado do servidor e estado local de componente, conforme a ADR-003.
    - Ler as três fatias do store e identificar quem despacha cada ação no shell.
    - Acrescentar um campo à `uiSlice` com o teste escrito e rodado antes da implementação.
    - Caracterizar com testes o cache configurado em `queryClient.ts`.
    - Reconhecer efeitos colaterais em reducers e a fronteira da ADR-003 em relação aos microfrontends.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: A ODA 02, com o repositório clonado no commit `2179313` e as dependências da raiz instaladas por `npm ci`. Os testes rodam com Vitest e não dependem do Docker nem do LocalStack.
  - tipo: terminal
    titulo: terminal · linha de base das fatias
    comandos:
    - entrada: npx vitest run src/shared/lib/store
      saida: " RUN  v4.1.7 .\n\n\n Test Files  2 passed (2)\n      Tests  7 passed (7)"
      origem: executado
      dica: Dois arquivos de teste, um para `authSlice` e outro para `uiSlice`, com 7 testes no total.
    cenarios:
    - rotulo: Rodar os testes das fatias
      comando: npx vitest run src/shared/lib/store
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: A ADR-003 parte da diferença de ciclo de vida entre dois tipos de estado. O estado do cliente nasce e termina no navegador, e o estado do servidor é uma cópia local de dados que pertencem à API e que podem mudar sem aviso.
  - tipo: comparativo
    colunas:
    - Estado do cliente
    - Estado do servidor
    linhas:
    - dimensao: Fonte da verdade
      valores:
      - O próprio navegador
      - A API, e o navegador guarda uma cópia
    - dimensao: Ferramenta no shell
      valores:
      - Redux Toolkit, em `src/shared/lib/store/`
      - React Query, configurado em `src/shared/lib/queryClient.ts`
    - dimensao: Exemplos no portal
      valores:
      - Token e usuário autenticado, barra lateral, modal ativo, notificações e tempo de inatividade
      - Dados de clientes, endereço e contratos devolvidos pelos BFFs
    - dimensao: Problemas que a ferramenta resolve
      valores:
      - Mudanças síncronas, rastreáveis no Redux DevTools
      - Cache, revalidação, nova tentativa e estados de carregamento e erro
    - dimensao: Risco apontado pela ADR
      valores:
      - Copiar para o Redux dados que já estão no cache do React Query
      - '`staleTime` inadequado, com requisições em excesso'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Separação de estado
    titulo: Diagrama da ADR-003 (docs/architecture/adrs/ADR-003-gerenciamento-de-estado.md)
    mermaid: "graph LR\n    api[\"API de Clientes\"]\n\n    subgraph cliente[\"Estado do Cliente — Redux Toolkit\"]\n        auth[\"authSlice\\ntoken · user · isAuthenticated\"]\n        ui[\"uiSlice\\nsidebar · modal · toasts\"]\n        session[\"sessionSlice\\nlastActivityAt · timeout\"]\n    end\n\n    subgraph servidor[\"Estado do Servidor — React Query\"]\n        qc[\"QueryClient\\ncache · revalidação · retry\"]\n    end\n\n    api -->|\"dados remotos\"| qc\n    auth -.->|\"logout() ao expirar\"| api"
  - tipo: conceito
    titulo: Estado local de componente
    texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de envio de um formulário pertencem a um único componente, e a página de login os mantém com `react-hook-form` e `useState`, sem passar pelo store.
  - tipo: conceito
    titulo: Regras de uma fatia do Redux Toolkit
    texto: Uma fatia criada com `createSlice` declara o estado inicial e os reducers, e o Redux Toolkit gera uma ação para cada reducer. O guia de estilo do Redux (https://redux.js.org/style-guide/) exige que o reducer dependa apenas do estado e da ação, sem efeitos fora da função, sem lógica assíncrona e sem valores aleatórios como `Date.now()` e `Math.random()`.
  - tipo: adr
    id: ADR-003
    titulo: Tática de gerenciamento de estado
    status: Proposed
    contexto: Uma SPA lida com estado do servidor, que exige cache, revalidação e sincronização com a API, e com estado do cliente, como flags de interface, autenticação e sessão. Colocar os dois no Redux resulta em reducers complexos e em invalidação manual de cache.
    decisao: Redux Toolkit para o estado do cliente, nas fatias `auth`, `ui` e `session`, e React Query para o estado do servidor.
    alternativas: Redux Toolkit com RTK Query, descartado por ser menos ergonômico em requisições complexas, Zustand com React Query, descartado pela ausência do Redux DevTools nativo, e apenas `useState` e `useEffect`, descartado porque não escala.
    consequencias: A equipe precisa respeitar a fronteira entre as duas ferramentas, novas fatias devem ser registradas em `src/shared/lib/store/index.ts`, e o `staleTime` e o `retry` do `QueryClient` devem ser revistos quando os contratos da API mudarem.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, o store, uma fatia completa, o reducer de login, a configuração do React Query e o hook que os microfrontends usam para buscar dados. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/index.ts
    commit: '2179313'
    linhas:
    - import { configureStore } from '@reduxjs/toolkit'
    - import { authSlice } from './authSlice'
    - import { uiSlice } from './uiSlice'
    - import { sessionSlice } from './sessionSlice'
    - ''
    - export const store = configureStore({
    - '  reducer: {'
    - '    auth: authSlice.reducer,'
    - '    ui: uiSlice.reducer,'
    - '    session: sessionSlice.reducer,'
    - '  },'
    - '})'
    - ''
    - export type RootState = ReturnType<typeof store.getState>
    - export type AppDispatch = typeof store.dispatch
    anotacoes:
    - linha: 6
      texto: O store único do shell, criado com `configureStore`, que habilita por padrão a integração com o Redux DevTools.
    - linha: 8
      texto: 'Cada chave do objeto `reducer` vira um ramo do estado: `auth`, `ui` e `session`.'
    - linha: 14
      texto: O tipo do estado é derivado do próprio store, e os seletores usam `RootState` para ler cada ramo.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/uiSlice.ts
    commit: '2179313'
    linhas:
    - import { createSlice, type PayloadAction } from '@reduxjs/toolkit'
    - ''
    - 'type Toast = { id: string; message: string; type: ''success'' | ''error'' | ''info'' }'
    - ''
    - type UiState = {
    - '  sidebarOpen: boolean'
    - '  activeModal: string | null'
    - '  toasts: Toast[]'
    - '}'
    - ''
    - 'const initialState: UiState = {'
    - '  sidebarOpen: true,'
    - '  activeModal: null,'
    - '  toasts: [],'
    - '}'
    - ''
    - export const uiSlice = createSlice({
    - '  name: ''ui'','
    - '  initialState,'
    - '  reducers: {'
    - '    toggleSidebar(state) {'
    - '      state.sidebarOpen = !state.sidebarOpen'
    - '    },'
    - '    openModal(state, action: PayloadAction<string>) {'
    - '      state.activeModal = action.payload'
    - '    },'
    - '    closeModal(state) {'
    - '      state.activeModal = null'
    - '    },'
    - '    addToast(state, action: PayloadAction<Omit<Toast, ''id''>>) {'
    - '      state.toasts.push({ ...action.payload, id: crypto.randomUUID() })'
    - '    },'
    - '    removeToast(state, action: PayloadAction<string>) {'
    - '      state.toasts = state.toasts.filter((t) => t.id !== action.payload)'
    - '    },'
    - '  },'
    - '})'
    - ''
    - export const { toggleSidebar, openModal, closeModal, addToast, removeToast } =
    - '  uiSlice.actions'
    anotacoes:
    - linha: 5
      texto: O tipo da fatia, que o laboratório estende com o campo `densidade`.
    - linha: 17
      texto: '`createSlice` gera o reducer e as ações a partir de um único objeto.'
    - linha: 22
      texto: O reducer parece alterar o estado, mas o Redux Toolkit usa o Immer e produz um objeto novo.
    - linha: 31
      texto: O identificador aleatório é gerado dentro do reducer, o que o guia de estilo do Redux proíbe.
    - linha: 39
      texto: As ações geradas, com o tipo `ui/<nome do reducer>`.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/authSlice.ts
    commit: '2179313'
    linhas:
    - '    login(state, action: PayloadAction<{ token: string }>) {'
    - '      const { token } = action.payload'
    - '      if (isTokenExpired(token)) throw new Error(''Token JWT inválido ou expirado'')'
    - '      const user = parseToken(token)'
    - '      tokenStorage.set(token)'
    - '      state.token = token'
    - '      state.user = user'
    - '      state.isAuthenticated = true'
    - '    },'
    - '    logout(state) {'
    - '      tokenStorage.clear()'
    - '      state.token = null'
    - '      state.user = null'
    - '      state.isAuthenticated = false'
    - '    },'
    anotacoes:
    - linha: 33
      texto: Com token expirado, o reducer lança uma exceção, que chega a quem chamou `dispatch`.
    - linha: 35
      texto: Gravação no `sessionStorage` feita dentro do reducer, que é um efeito fora da função.
    - linha: 38
      texto: Campo lido pelo `AuthGuard` para liberar as rotas protegidas.
    - linha: 41
      texto: O `logout` também apaga o token do `sessionStorage` e altera apenas o ramo `auth`.
    inicio: 31
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/queryClient.ts
    commit: '2179313'
    linhas:
    - import { QueryClient } from '@tanstack/react-query'
    - ''
    - export const queryClient = new QueryClient({
    - '  defaultOptions: {'
    - '    queries: {'
    - '      staleTime: 5 * 60 * 1000,'
    - '      retry: 1,'
    - '      refetchOnWindowFocus: false,'
    - '    },'
    - '  },'
    - '})'
    anotacoes:
    - linha: 6
      texto: Durante 5 minutos, uma consulta com a mesma chave usa o cache sem chamar a API.
    - linha: 7
      texto: Uma nova tentativa depois de uma falha.
    - linha: 8
      texto: Voltar à aba do navegador não dispara nova busca.
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/providers/index.tsx
    commit: '2179313'
    linhas:
    - 'export function Providers({ children }: ProvidersProps) {'
    - '  return ('
    - '    <ReduxProvider store={store}>'
    - '      <QueryClientProvider client={queryClient}>'
    - '        {children}'
    - '      </QueryClientProvider>'
    - '    </ReduxProvider>'
    - '  )'
    - '}'
    anotacoes:
    - linha: 11
      texto: O store do Redux envolve toda a árvore do shell.
    - linha: 12
      texto: O cliente do React Query fica disponível para qualquer componente do shell que chame `useQuery`.
    inicio: 9
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/emprestimo/src/hooks/useAsync.ts
    commit: '2179313'
    linhas:
    - 'export function useAsync<T>(fn: () => Promise<T>, deps: unknown[]) {'
    - '  const [data, setData] = useState<T | null>(null)'
    - '  const [loading, setLoading] = useState(true)'
    - '  const [error, setError] = useState<Error | null>(null)'
    - '  useEffect(() => {'
    - '    let vivo = true'
    - '    setLoading(true)'
    - '    setError(null)'
    - '    fn()'
    - '      .then((d) => { if (vivo) setData(d) })'
    - '      .catch((e) => { if (vivo) setError(e instanceof Error ? e : new Error(String(e))) })'
    - '      .finally(() => { if (vivo) setLoading(false) })'
    - '    return () => { vivo = false }'
    - '    // eslint-disable-next-line react-hooks/exhaustive-deps'
    - '  }, deps)'
    - '  return { data, loading, error }'
    - '}'
    anotacoes:
    - linha: 3
      texto: Hook do microfrontend de empréstimo para buscar dados, sem React Query.
    - linha: 5
      texto: Carregamento e erro controlados à mão, com `useState`, a cada uso do hook.
    - linha: 15
      texto: Evita atualizar o estado depois que o componente foi desmontado, e não guarda cache entre montagens.
    inicio: 3
  - tipo: faixa
    estilo: dica
    texto: 'No commit `2179313`, nenhum componente do shell chama `useQuery`: o `QueryClientProvider` está montado e aguarda a primeira consulta. Os dados de negócio chegam pelos microfrontends, que usam `useEffect` e `useState`, e o shell busca apenas `config.json` e `mfe-manifest.json`, com `fetch` direto e fora do React.'
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: O console abaixo reproduz o store do shell, com as três fatias e as respostas do código no commit `2179313`. `TOKEN` é um JWT válido até 2286, com `sub` igual a `user1`, e `EXPIRADO` é um JWT com `exp` igual a 1. Leia o estado, despache ações e observe qual ramo cada ação altera.
  - tipo: terminal
    titulo: console · store do shell
    comandos:
    - entrada: store.getState().auth
      condicao: logado
      saida: "{\n  \"token\": \"eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature\",\n  \"user\": {\n    \"sub\": \"user1\",\n    \"exp\": 9999999999,\n    \"iat\": 1700000000\n  },\n  \"isAuthenticated\": true\n}"
      origem: executado
    - entrada: store.getState().auth
      saida: "{\n  \"token\": null,\n  \"user\": null,\n  \"isAuthenticated\": false\n}"
      origem: executado
    - entrada: store.getState().ui
      condicao: sidebar_fechada
      saida: "{\n  \"sidebarOpen\": false,\n  \"activeModal\": null,\n  \"toasts\": []\n}"
      origem: executado
    - entrada: store.getState().ui
      saida: "{\n  \"sidebarOpen\": true,\n  \"activeModal\": null,\n  \"toasts\": []\n}"
      origem: executado
    - entrada: store.getState().session
      saida: "{\n  \"lastActivityAt\": null,\n  \"inactivityTimeoutMs\": 1800000\n}"
      origem: executado
      dica: Nenhum código do shell despacha `recordActivity`, por isso `lastActivityAt` continua nulo.
    - entrada: Object.keys(sessionStorage)
      condicao: logado
      saida: "[\n  \"portal_access_token\"\n]"
      origem: executado
      dica: A chave foi gravada pelo reducer `login`, por meio de `tokenStorage.set`.
    - entrada: Object.keys(sessionStorage)
      saida: '[]'
      origem: executado
    - entrada: 'store.dispatch(login({ token: TOKEN }))'
      saida: "{\n  \"type\": \"auth/login\",\n  \"payload\": {\n    \"token\": \"eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature\"\n  }\n}"
      origem: executado
      efeito: logado
      dica: O `dispatch` devolve a ação despachada. Leia de novo o ramo `auth` e o `sessionStorage`.
    - entrada: 'store.dispatch(login({ token: EXPIRADO }))'
      saida: 'Error: Token JWT inválido ou expirado'
      origem: executado
      dica: A exceção sai do reducer e chega a quem chamou `dispatch`, e o estado anterior continua intacto.
    - entrada: store.dispatch(toggleSidebar())
      condicao: sidebar_fechada
      saida: "{\n  \"type\": \"ui/toggleSidebar\"\n}"
      origem: executado
      efeito: '!sidebar_fechada'
    - entrada: store.dispatch(toggleSidebar())
      saida: "{\n  \"type\": \"ui/toggleSidebar\"\n}"
      origem: executado
      efeito: sidebar_fechada
    - entrada: store.dispatch(logout())
      saida: "{\n  \"type\": \"auth/logout\"\n}"
      origem: executado
      efeito: '!logado'
      dica: 'Leia o ramo `ui` depois do logout: a barra lateral continua como estava.'
    cenarios:
    - rotulo: Ler auth
      comando: store.getState().auth
    - rotulo: Login válido
      comando: 'store.dispatch(login({ token: TOKEN }))'
    - rotulo: Ler sessionStorage
      comando: Object.keys(sessionStorage)
    - rotulo: Login expirado
      comando: 'store.dispatch(login({ token: EXPIRADO }))'
    - rotulo: Alternar barra lateral
      comando: store.dispatch(toggleSidebar())
    - rotulo: Ler ui
      comando: store.getState().ui
    - rotulo: Logout
      comando: store.dispatch(logout())
    - rotulo: Ler session
      comando: store.getState().session
  - tipo: fluxo
    titulo: Do formulário de login ao AuthGuard
    etapas:
    - titulo: Requisição de login
      descricao: A página de login chama `loginRequest` e recebe o token, que na configuração de desenvolvimento vem do back-end simulado pelo MSW.
      codigo:
        arquivo: src/pages/login/index.tsx
        commit: '2179313'
        linhas:
        - '    try {'
        - '      const token = await loginRequest(email, senha)'
        - '      dispatch(login({ token }))'
        destaque:
        - 2
        - 3
    - titulo: Validação no reducer
      descricao: O reducer `login` recusa o token expirado com uma exceção antes de alterar o estado.
      codigo:
        arquivo: src/shared/lib/store/authSlice.ts
        commit: '2179313'
        linhas:
        - '    login(state, action: PayloadAction<{ token: string }>) {'
        - '      const { token } = action.payload'
        - '      if (isTokenExpired(token)) throw new Error(''Token JWT inválido ou expirado'')'
        - '      const user = parseToken(token)'
        destaque:
        - 3
    - titulo: Persistência do token
      descricao: O mesmo reducer grava o token no `sessionStorage`, o que permite reidratar a sessão depois de recarregar a página.
      codigo:
        arquivo: src/shared/lib/store/authSlice.ts
        commit: '2179313'
        linhas:
        - '      tokenStorage.set(token)'
        - '      state.token = token'
        - '      state.user = user'
        - '      state.isAuthenticated = true'
        destaque:
        - 1
    - titulo: Leitura pelo guard
      descricao: O `AuthGuard` lê `isAuthenticated` com `useSelector` e libera as rotas protegidas, ou redireciona para o login.
      codigo:
        arquivo: src/app/router/guards/AuthGuard.tsx
        commit: '2179313'
        linhas:
        - '  const isAuthenticated = useSelector((s: RootState) => s.auth.isAuthenticated)'
        - '  const location = useLocation()'
        - ''
        - '  if (!isAuthenticated) {'
        destaque:
        - 1
        - 4
  - tipo: classificador
    enunciado: Pela ADR-003, onde o shell deve guardar cada estado?
    categorias:
    - id: redux
      rotulo: Redux Toolkit
    - id: query
      rotulo: React Query
    - id: local
      rotulo: Estado local do componente
    itens:
    - texto: Token JWT e dados do usuário autenticado
      categoria: redux
      explicacao: A fatia `auth` guarda o token, o usuário e `isAuthenticated`, lidos pelos guards e pelo host dos microfrontends.
    - texto: Barra lateral aberta ou fechada
      categoria: redux
      explicacao: É estado de interface compartilhado pelo layout, na fatia `ui`.
    - texto: Momento da última atividade do usuário
      categoria: redux
      explicacao: A fatia `session` tem `lastActivityAt` e o tempo limite de inatividade.
    - texto: Lista de clientes que uma página do shell busca na API
      categoria: query
      explicacao: Dados que pertencem à API ficam no cache do React Query, com revalidação pelo `staleTime`.
    - texto: Resultado de uma consulta de CEP feita por uma página do shell
      categoria: query
      explicacao: É uma cópia de dado remoto, com carregamento, erro e cache tratados pelo React Query.
    - texto: Texto digitado no campo de e-mail do login
      categoria: local
      explicacao: A página de login mantém os campos com `react-hook-form`, sem passar pelo store.
    - texto: Indicador de envio do formulário de login
      categoria: local
      explicacao: A página de login usa `useState` para `submitting`, porque nenhum outro componente lê esse valor.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no repositório clonado na ODA 00. Os passos 1 a 6 acrescentam o campo `densidade` à `uiSlice` com o teste escrito antes da implementação, e os passos 7 a 9 caracterizam o cache do `queryClient` com dois testes.
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/shared/lib/store
      sucesso: '`Test Files 2 passed (2)` e `Tests 7 passed (7)`.'
    - titulo: Escrever o teste da densidade
      texto: Em `src/shared/lib/store/__tests__/uiSlice.test.ts`, acrescente `setDensidade` à lista importada de `../uiSlice` e inclua o teste abaixo antes do `})` que fecha o `describe`.
      editor:
        rotulo: arquivo
        caminho: src/shared/lib/store/__tests__/uiSlice.test.ts (alteração)
        commit: '2179313'
        linhas:
        - '  it(''setDensidade troca a densidade da interface'', () => {'
        - '    const inicial = reducer(undefined, { type: ''inicio'' })'
        - '    expect(inicial.densidade).toBe(''confortavel'')'
        - '    const state = reducer(inicial, setDensidade(''compacta''))'
        - '    expect(state.densidade).toBe(''compacta'')'
        - '  })'
      efeito: teste_densidade
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/shared/lib/store
      sucesso: '`AssertionError: expected undefined to be ''confortavel''` e `Tests 1 failed | 7 passed (8)`, porque o campo ainda não existe.'
    - titulo: Implementar o campo na fatia
      texto: Em `src/shared/lib/store/uiSlice.ts`, declare o tipo antes de `UiState`, acrescente o campo ao tipo e ao estado inicial e inclua o reducer depois de `removeToast`, exportando `setDensidade` junto das demais ações.
      editor:
        rotulo: arquivo
        caminho: src/shared/lib/store/uiSlice.ts (alteração)
        commit: '2179313'
        linhas:
        - type Densidade = 'confortavel' | 'compacta'
        - ''
        - // em UiState
        - '  densidade: Densidade'
        - ''
        - // em initialState
        - '  densidade: ''confortavel'','
        - ''
        - // em reducers
        - '    setDensidade(state, action: PayloadAction<Densidade>) {'
        - '      state.densidade = action.payload'

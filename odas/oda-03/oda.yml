- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os incidentes abaixo partem de respostas do store e de trechos do código no commit `2179313`. Em cada um, identifique a causa antes de ler a correção.
  - tipo: incidente
    titulo: Token expirado relatado como senha errada
    origem: executado
    rotulo_saida: log
    saida: "> store.dispatch(login({ token: EXPIRADO }))\nError: Token JWT inválido ou expirado\n\nsrc/pages/login/index.tsx:22-26\n      const token = await loginRequest(email, senha)\n      dispatch(login({ token }))\n      navigate('/dashboard')\n    } catch {\n      setError('E-mail ou senha inválidos.')"
    pergunta: Se o back-end devolver um token já expirado, que mensagem a pessoa vê na tela de login?
    correcao: Validar o token antes do `dispatch`, ou tratar a exceção do reducer separadamente, para que a tela informe que o token recebido do back-end já está expirado.
    alternativas:
    - texto: Nenhuma, porque o login é concluído e a pessoa vai para `/dashboard`.
      correta: false
      explicacao: A exceção interrompe o `try` antes de `navigate`, e o estado `auth` não muda.
    - texto: '`E-mail ou senha inválidos.`, porque a exceção do reducer cai no mesmo `catch` da falha de credenciais.'
      correta: true
      explicacao: O `dispatch` está dentro do `try`, e o `catch` não distingue a origem do erro.
    - texto: '`Token JWT inválido ou expirado`, exibida pelo Redux.'
      correta: false
      explicacao: O Redux não exibe mensagens na tela, e a página substitui o erro pelo próprio texto.
  - tipo: incidente
    titulo: Logout que mantém a interface
    origem: executado
    rotulo_saida: log
    saida: "> store.dispatch(toggleSidebar())\n> store.dispatch(logout())\n> store.getState().auth\n{\n  \"token\": null,\n  \"user\": null,\n  \"isAuthenticated\": false\n}\n> store.getState().ui\n{\n  \"sidebarOpen\": false,\n  \"activeModal\": null,\n  \"toasts\": []\n}"
    pergunta: Por que a barra lateral continua fechada depois do logout?
    correcao: Quando o produto exigir uma interface reiniciada no logout, a `uiSlice` deve responder à ação `auth/logout` por meio de `extraReducers`, sem que a fatia `auth` altere o ramo `ui`.
    alternativas:
    - texto: O `logout` falhou e o usuário continua autenticado.
      correta: false
      explicacao: 'O ramo `auth` mostra `isAuthenticated: false`.'
    - texto: O `sessionStorage` guarda o estado da barra lateral.
      correta: false
      explicacao: O `sessionStorage` guarda apenas `portal_access_token`.
    - texto: Cada fatia só responde às ações que declara, e `logout` pertence à fatia `auth`.
      correta: true
      explicacao: O reducer `logout` altera apenas `token`, `user` e `isAuthenticated`.
  - tipo: incidente
    titulo: Reducers com efeitos fora da função
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/shared/lib/store/authSlice.ts\n      if (isTokenExpired(token)) throw new Error('Token JWT inválido ou expirado')\n      const user = parseToken(token)\n      tokenStorage.set(token)\n\nsrc/shared/lib/store/uiSlice.ts\n    addToast(state, action: PayloadAction<Omit<Toast, 'id'>>) {\n      state.toasts.push({ ...action.payload, id: crypto.randomUUID() })\n    },\n\nsrc/shared/lib/store/sessionSlice.ts\n    recordActivity(state) {\n      state.lastActivityAt = Date.now()\n    },"
    pergunta: Qual regra do Redux os três trechos contrariam?
    correcao: Gerar o identificador e o horário no `prepare` da ação, que roda antes do reducer, e mover a gravação do token para quem despacha a ação ou para um middleware.
    alternativas:
    - texto: O reducer deve depender só do estado e da ação, sem gravar fora da função nem gerar valores aleatórios ou de horário.
      correta: true
      explicacao: O guia de estilo do Redux cita `Date.now()` e valores aleatórios entre os exemplos proibidos, e `tokenStorage.set` grava fora da função.
    - texto: O reducer não pode alterar o estado com atribuição.
      correta: false
      explicacao: Com `createSlice`, a atribuição é permitida, porque o Immer produz um objeto novo.
    - texto: O reducer não pode importar módulos de `shared/auth`.
      correta: false
      explicacao: A importação respeita as fronteiras da ADR-007, e o problema está no que o reducer faz.
  - tipo: incidente
    titulo: Busca de dados sem React Query
    origem: codigo
    rotulo_saida: arquivo
    saida: "mfes/emprestimo/src/hooks/useAsync.ts\nexport function useAsync<T>(fn: () => Promise<T>, deps: unknown[]) {\n  const [data, setData] = useState<T | null>(null)\n  const [loading, setLoading] = useState(true)\n  const [error, setError] = useState<Error | null>(null)\n  ...\n\nmfes/endereco/src/index.tsx:9\n  const root = createRoot(el)"
    pergunta: A ADR-003 escolheu React Query para o estado do servidor. Por que os microfrontends usam `useState` e `useEffect`?
    correcao: Registrar a tática de estado dos microfrontends numa ADR própria, ou ampliar a ADR-003, porque a decisão atual só cobre o shell.
    alternativas:
    - texto: O CSP da ADR-012 bloqueia o React Query.
      correta: false
      explicacao: O CSP restringe origens de scripts e recursos, e não bibliotecas embutidas no bundle.
    - texto: Cada microfrontend cria a própria árvore React com `createRoot` e não enxerga o `QueryClientProvider` do shell, e o `package.json` deles não inclui React Query.
      correta: true
      explicacao: O React fica embutido em cada bundle, conforme `mfes/endereco/vite.config.ts`, e a ADR-003 trata apenas do shell.
    - texto: O React Query não funciona com React 19.
      correta: false
      explicacao: O shell usa React 19 e `@tanstack/react-query` 5 no mesmo `package.json`.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Pela ADR-003, onde fica a lista de contratos que uma página do shell busca na API?
      alternativas:
      - texto: Numa nova fatia do Redux.
        correta: false
        explicacao: A ADR aponta essa cópia como risco de duplicação.
      - texto: No `sessionStorage`.
        correta: false
        explicacao: O `sessionStorage` guarda apenas o token de acesso.
      - texto: No cache do React Query.
        correta: true
        explicacao: Dados que pertencem à API são estado do servidor.
    - enunciado: O que acontece com o estado quando um reducer lança uma exceção?
      alternativas:
      - texto: O estado anterior permanece, e a exceção chega a quem chamou `dispatch`.
        correta: true
        explicacao: O console mostrou o ramo `auth` igual ao de antes do `login` com token expirado.
      - texto: O estado volta ao inicial.
        correta: false
        explicacao: O store não reinicia o estado diante de uma exceção.
      - texto: O Redux ignora a exceção e aplica a ação.
        correta: false
        explicacao: A exceção interrompe o reducer antes das atribuições.
    - enunciado: No laboratório, por que o teste da densidade roda antes da implementação?
      alternativas:
      - texto: Porque o TypeScript exige o teste antes do tipo.
        correta: false
        explicacao: O TypeScript não impõe ordem entre teste e implementação.
      - texto: Para confirmar que o teste falha pela ausência do campo e, portanto, verifica o comportamento novo.
        correta: true
        explicacao: A falha `expected undefined to be 'confortavel'` mostrou que o teste lê o campo que ainda não existia.
      - texto: Para gerar o código da fatia automaticamente.
        correta: false
        explicacao: O Vitest executa testes e não gera código.
    - enunciado: Que configuração do `queryClient` o teste de caracterização protege?
      alternativas:
      - texto: 'O `retry: 1`.'
        correta: false
        explicacao: Os testes usam funções que não falham, por isso não exercitam a nova tentativa.
      - texto: O `refetchOnWindowFocus`.
        correta: false
        explicacao: Os testes não simulam foco de janela.
      - texto: O `staleTime` de 5 minutos, que evita nova chamada à API dentro desse prazo.
        correta: true
        explicacao: 'Com `staleTime: 0`, o primeiro teste registrou duas chamadas no lugar de uma.'
    - enunciado: Onde gerar o identificador aleatório de uma notificação para manter o reducer conforme o guia de estilo do Redux?
      alternativas:
      - texto: No `prepare` da ação, antes de o reducer receber o payload.
        correta: true
        explicacao: O `prepare` monta o payload da ação, e o reducer só copia o valor recebido.
      - texto: No próprio reducer, com `crypto.randomUUID()`.
        correta: false
        explicacao: É o que o código atual faz, e o guia proíbe valores aleatórios no reducer.
      - texto: No `configureStore`.
        correta: false
        explicacao: O `configureStore` monta o store e não cria ações.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A diferença entre estado do cliente, estado do servidor e estado local está clara.
    - O teste da densidade falhou antes da implementação e passou depois.
    - 'Os testes do `queryClient` passaram e falharam com `staleTime: 0`.'
    - A suíte completa terminou com 102 testes aprovados e o `staleTime` restaurado.
    - Os efeitos colaterais nos reducers e a fronteira da ADR-003 foram identificados.

id: '03'
titulo: Estado global e estado de servidor
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é distinguir o estado que pertence ao navegador do estado que é cópia de dados do servidor e estender uma fatia do Redux com o teste escrito antes, porque misturar os dois tipos leva a cache invalidado à mão e a reducers com efeitos fora da função, como os que o shell já tem. O shell do `frontend-react` usa o Redux Toolkit para o primeiro tipo e o React Query para o segundo. Você vai acrescentar um campo de preferência à fatia de interface e escrever testes que protegem a configuração de cache do React Query, cujo `staleTime` evita chamadas repetidas à API.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Redux e Redux Toolkit
      definicao: O Redux guarda o estado global de uma aplicação num único objeto, que só muda por meio de ações tratadas por reducers. O Redux Toolkit é o pacote oficial que simplifica esse uso, e o shell o usa em `src/shared/lib/store/`.
      referencia:
        rotulo: Redux Toolkit · Primeiros passos
        url: https://redux-toolkit.js.org/introduction/getting-started
    - termo: Fatia (slice)
      definicao: Parte do estado do Redux com o próprio estado inicial, reducers e ações, criada com `createSlice`. O store do shell tem três fatias, `auth`, `ui` e `session`.
      referencia:
        rotulo: Redux Toolkit · createSlice
        url: https://redux-toolkit.js.org/api/createSlice
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: React Query (TanStack Query)
      definicao: 'Biblioteca que busca dados da API, guarda o resultado em cache e decide quando buscar de novo. O shell a configura em `src/shared/lib/queryClient.ts`, com `staleTime` de 5 minutos, `retry: 1` e `refetchOnWindowFocus: false`.'
      referencia:
        rotulo: TanStack Query · Visão geral
        url: https://tanstack.com/query/latest/docs/framework/react/overview
    - termo: Teste escrito antes (TDD)
      definicao: Prática em que o teste do comportamento novo é escrito e rodado antes da implementação, para confirmar que ele falha pela razão esperada. Depois, a implementação mínima faz o teste passar.
      referencia:
        rotulo: martinfowler.com · Test Driven Development
        url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    - termo: Estado do cliente, do servidor e local
      definicao: O estado do cliente nasce e termina no navegador, como a barra lateral aberta, e o estado do servidor é uma cópia local de dados que pertencem à API e podem mudar sem aviso. O estado local de componente pertence a um único componente, como o texto de um campo, e fica fora do store.
      referencia:
        rotulo: TanStack Query · Padrões importantes
        url: https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults
    - termo: Store
      definicao: Objeto do Redux que guarda o estado global, recebe as ações por `dispatch` e avisa os componentes que leem o estado. O shell cria um único store com `configureStore`.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: Reducer e ação
      definicao: A ação é um objeto que descreve o que aconteceu, com um `type` e um `payload`, e o reducer é a função que recebe o estado atual e a ação e devolve o estado novo. O guia de estilo do Redux exige que o reducer não tenha efeitos fora da função.
      referencia:
        rotulo: Redux · Estado, ações e reducers
        url: https://redux.js.org/tutorials/fundamentals/part-3-state-actions-reducers
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Vitest
      definicao: Ferramenta de testes integrada ao Vite, que roda os testes do shell e dos microfrontends com `npm test` e oferece simulação de módulos e de relógio.
      referencia:
        rotulo: Vitest · Primeiros passos
        url: https://vitest.dev/guide/
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: SPA (Single-Page Application)
      definicao: Aplicação web que carrega uma única página HTML e troca o conteúdo da tela por JavaScript, sem recarregar a página a cada navegação. O shell é uma SPA.
      referencia:
        rotulo: MDN · SPA (Single-page application)
        url: https://developer.mozilla.org/en-US/docs/Glossary/SPA
    - termo: Cache, `staleTime` e revalidação
      definicao: O cache guarda o resultado de uma consulta para reaproveitá-lo, e o `staleTime` diz por quanto tempo esse resultado é considerado atual. Depois desse prazo, o React Query busca o dado de novo, o que se chama revalidação.
      referencia:
        rotulo: TanStack Query · Padrões importantes
        url: https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults
    - termo: Hooks do React (`useState`, `useEffect`)
      definicao: Funções que dão a um componente React estado próprio, com `useState`, ou efeitos que rodam depois da renderização, com `useEffect`. Os microfrontends buscam dados com esses dois hooks.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: '`react-hook-form`'
      definicao: Biblioteca de formulários para React que guarda os valores dos campos e as validações dentro do próprio componente. A página de login do shell a usa para os campos de e-mail e senha.
    - termo: RTK Query e Zustand
      definicao: O RTK Query é o módulo de busca de dados do Redux Toolkit, e o Zustand é uma biblioteca de estado global para React. A ADR-003 avaliou os dois e manteve o React Query para o estado do servidor.
    - termo: Redux DevTools
      definicao: Extensão de navegador que mostra cada ação despachada e o estado do store antes e depois dela. O `configureStore` habilita essa integração por padrão.
    - termo: Immer
      definicao: Biblioteca usada pelo Redux Toolkit que permite escrever o reducer como se alterasse o estado e produz, a partir dessas alterações, um objeto novo. Por isso a atribuição dentro de `createSlice` é permitida.
      referencia:
        rotulo: Redux Toolkit · createSlice
        url: https://redux-toolkit.js.org/api/createSlice
    - termo: '`sessionStorage`'
      definicao: Área de armazenamento do navegador isolada por aba, apagada quando a aba é fechada e acessível por JavaScript. O shell guarda nela o token, na chave `portal_access_token`.
      referencia:
        rotulo: MDN · Window.sessionStorage
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Window/sessionStorage
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: '`dispatch`'
      definicao: Função do store que entrega uma ação aos reducers para atualizar o estado. Uma exceção lançada dentro do reducer chega a quem chamou `dispatch`, e o estado anterior continua intacto.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: Guard de rota (`AuthGuard`)
      definicao: Componente que decide se uma rota pode ser exibida e redireciona para outra quando a condição falha. O `AuthGuard` do shell lê `isAuthenticated` no store e leva para `/login` quem não está autenticado.
    - termo: Seletor e `useSelector`
      definicao: Um seletor é uma função que lê uma parte do estado do store, e o `useSelector` é o hook que um componente React usa para ler esse valor e renderizar de novo quando ele muda.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: Provider
      definicao: Componente React que disponibiliza um recurso, como o store do Redux ou o cliente do React Query, para todos os componentes abaixo dele na árvore. O shell reúne os providers em `src/app/providers/index.tsx`.
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
    - termo: '`prepare` e `extraReducers`'
      definicao: O `prepare` monta o payload de uma ação antes de ela chegar ao reducer, e é o lugar indicado para gerar identificadores e horários. O `extraReducers` permite que uma fatia responda a ações de outra fatia.
      referencia:
        rotulo: Redux Toolkit · createSlice
        url: https://redux-toolkit.js.org/api/createSlice
    - termo: Middleware do Redux
      definicao: Função que fica entre o `dispatch` e os reducers e pode executar efeitos, como gravar no armazenamento do navegador, a partir das ações despachadas.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: Raiz React (`createRoot`)
      definicao: Ponto em que o React começa a renderizar uma árvore de componentes dentro de um elemento da página. Cada microfrontend cria a própria raiz com o React embutido no bundle, separada da árvore do shell.
      referencia:
        rotulo: React · createRoot
        url: https://react.dev/reference/react-dom/client/createRoot
    - termo: CSP (Content Security Policy)
      definicao: Cabeçalho HTTP com que o servidor informa ao navegador de quais origens a página pode carregar scripts, estilos e outros recursos e para onde ela pode abrir conexões. O navegador bloqueia o que a política não autoriza, e a ADR-012 do repositório adota uma política estrita.
      referencia:
        rotulo: MDN · Políticas de Segurança de Conteúdo (CSP)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Distinguir estado do cliente, estado do servidor e estado local de componente, conforme a ADR-003.
    - Ler as três fatias do store e identificar quem despacha cada ação no shell.
    - Acrescentar um campo à `uiSlice` com o teste escrito e rodado antes da implementação.
    - Caracterizar com testes o cache configurado em `queryClient.ts`.
    - Reconhecer efeitos colaterais em reducers e a fronteira da ADR-003 em relação aos microfrontends.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. Os testes rodam com Vitest e não dependem do Docker nem do LocalStack.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica a diferença de ciclo de vida entre os dois tipos de estado. O estado do cliente nasce e termina no navegador, e o estado do servidor é uma cópia local de dados que pertencem à API e podem mudar sem aviso, o que exige cache e nova busca, e a ADR-003 do repositório registra essa separação.
  - tipo: comparativo
    colunas:
    - Estado do cliente
    - Estado do servidor
    linhas:
    - dimensao: Fonte da verdade
      valores:
      - O próprio navegador
      - A API, e o navegador guarda uma cópia
    - dimensao: Ferramenta no shell
      valores:
      - Redux Toolkit, em `src/shared/lib/store/`
      - React Query, configurado em `src/shared/lib/queryClient.ts`
    - dimensao: Exemplos no portal
      valores:
      - Token e usuário autenticado, barra lateral, modal ativo, notificações e tempo de inatividade
      - Dados de clientes, endereço e contratos devolvidos pelos BFFs
    - dimensao: Problemas que a ferramenta resolve
      valores:
      - Mudanças síncronas, rastreáveis no Redux DevTools
      - Cache, revalidação, nova tentativa e estados de carregamento e erro
    - dimensao: Risco apontado pela ADR
      valores:
      - Copiar para o Redux dados que já estão no cache do React Query
      - '`staleTime` inadequado, com requisições em excesso'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Separação de estado
    titulo: Diagrama da ADR-003 (docs/architecture/adrs/ADR-003-gerenciamento-de-estado.md)
    mermaid: "graph LR\n    api[\"API de Clientes\"]\n\n    subgraph cliente[\"Estado do Cliente — Redux Toolkit\"]\n        auth[\"authSlice\\ntoken · user · isAuthenticated\"]\n        ui[\"uiSlice\\nsidebar · modal · toasts\"]\n        session[\"sessionSlice\\nlastActivityAt · timeout\"]\n    end\n\n    subgraph servidor[\"Estado do Servidor — React Query\"]\n        qc[\"QueryClient\\ncache · revalidação · retry\"]\n    end\n\n    api -->|\"dados remotos\"| qc\n    auth -.->|\"logout() ao expirar\"| api"
  - tipo: conceito
    titulo: Estado local de componente
    texto: Nem todo estado precisa de uma das duas ferramentas. O valor digitado num campo e o indicador de envio de um formulário pertencem a um único componente, e a página de login os mantém com `react-hook-form` e `useState`, sem passar pelo store.
  - tipo: conceito
    titulo: Regras de uma fatia do Redux Toolkit
    texto: Uma fatia criada com `createSlice` declara o estado inicial e os reducers, e o Redux Toolkit gera uma ação para cada reducer. O guia de estilo do Redux (https://redux.js.org/style-guide/) exige que o reducer dependa apenas do estado e da ação, sem efeitos fora da função, sem lógica assíncrona e sem valores aleatórios como `Date.now()` e `Math.random()`.
  - tipo: adr
    id: ADR-003
    titulo: Tática de gerenciamento de estado
    status: Proposed
    contexto: Uma SPA lida com estado do servidor, que exige cache, revalidação e sincronização com a API, e com estado do cliente, como flags de interface, autenticação e sessão. Colocar os dois no Redux resulta em reducers complexos e em invalidação manual de cache.
    decisao: Redux Toolkit para o estado do cliente, nas fatias `auth`, `ui` e `session`, e React Query para o estado do servidor.
    alternativas: Redux Toolkit com RTK Query, descartado por ser menos ergonômico em requisições complexas, Zustand com React Query, descartado pela ausência do Redux DevTools nativo, e apenas `useState` e `useEffect`, descartado porque não escala.
    consequencias: A equipe precisa respeitar a fronteira entre as duas ferramentas, novas fatias devem ser registradas em `src/shared/lib/store/index.ts`, e o `staleTime` e o `retry` do `QueryClient` devem ser revistos quando os contratos da API mudarem.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra onde o shell guarda cada tipo de estado: o store do Redux Toolkit com as fatias `ui` e `auth`, o cliente do React Query e os providers que os ligam à aplicação, além do hook com que o microfrontend de empréstimo busca dados sem o React Query. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para esta ODA.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/index.ts
    commit: '2179313'
    linhas:
    - import { configureStore } from '@reduxjs/toolkit'
    - import { authSlice } from './authSlice'
    - import { uiSlice } from './uiSlice'
    - import { sessionSlice } from './sessionSlice'
    - ''
    - export const store = configureStore({
    - '  reducer: {'
    - '    auth: authSlice.reducer,'
    - '    ui: uiSlice.reducer,'
    - '    session: sessionSlice.reducer,'
    - '  },'
    - '})'
    - ''
    - export type RootState = ReturnType<typeof store.getState>
    - export type AppDispatch = typeof store.dispatch
    anotacoes:
    - linha: 6
      texto: O store único do shell, criado com `configureStore`, que habilita por padrão a integração com o Redux DevTools.
    - linha: 8
      texto: 'Cada chave do objeto `reducer` vira um ramo do estado: `auth`, `ui` e `session`.'
    - linha: 14
      texto: O tipo do estado é derivado do próprio store, e os seletores usam `RootState` para ler cada ramo.
    contexto: O arquivo `src/shared/lib/store/index.ts` cria o store do Redux Toolkit, que guarda o estado global do shell no navegador. O arquivo aparece inteiro porque nele se vê como as três fatias, `auth`, `ui` e `session`, compõem um único estado e de onde vêm os tipos que os componentes usam para lê-lo.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/uiSlice.ts
    commit: '2179313'
    linhas:
    - import { createSlice, type PayloadAction } from '@reduxjs/toolkit'
    - ''
    - 'type Toast = { id: string; message: string; type: ''success'' | ''error'' | ''info'' }'
    - ''
    - type UiState = {
    - '  sidebarOpen: boolean'
    - '  activeModal: string | null'
    - '  toasts: Toast[]'
    - '}'
    - ''
    - 'const initialState: UiState = {'
    - '  sidebarOpen: true,'
    - '  activeModal: null,'
    - '  toasts: [],'
    - '}'
    - ''
    - export const uiSlice = createSlice({
    - '  name: ''ui'','
    - '  initialState,'
    - '  reducers: {'
    - '    toggleSidebar(state) {'
    - '      state.sidebarOpen = !state.sidebarOpen'
    - '    },'
    - '    openModal(state, action: PayloadAction<string>) {'
    - '      state.activeModal = action.payload'
    - '    },'
    - '    closeModal(state) {'
    - '      state.activeModal = null'
    - '    },'
    - '    addToast(state, action: PayloadAction<Omit<Toast, ''id''>>) {'
    - '      state.toasts.push({ ...action.payload, id: crypto.randomUUID() })'
    - '    },'
    - '    removeToast(state, action: PayloadAction<string>) {'
    - '      state.toasts = state.toasts.filter((t) => t.id !== action.payload)'
    - '    },'
    - '  },'
    - '})'
    - ''
    - export const { toggleSidebar, openModal, closeModal, addToast, removeToast } =
    - '  uiSlice.actions'
    anotacoes:
    - linha: 5

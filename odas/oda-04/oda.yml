- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar o projeto, as chamadas de login e de endereço. Envie pelo console as requisições ao back-end simulado pelo MSW e ao Gateway e compare as respostas para o mesmo token. Depois, acompanhe na linha do tempo o caminho que um 401 recebido pelo `httpClient` do shell percorreria, com e sem o `sessionMonitor` iniciado.
  - tipo: console-api
    cenarios:
    - rotulo: MSW · login com a senha correta
      requisicao:
        metodo: POST
        url: /auth/token
        corpo:
          email: usuario@teste.com
          senha: senha123
      resposta:
        status: 200
        corpo:
          access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature
      origem: executado
      nota: 'O token tem cabeçalho RS256 e a assinatura literal `signature`, e o payload traz `sub: user1` e `exp: 9999999999`.'
    - rotulo: MSW · login com a senha errada
      requisicao:
        metodo: POST
        url: /auth/token
        corpo:
          email: usuario@teste.com
          senha: errada
      resposta:
        status: 401
      origem: executado
      nota: O `loginRequest` usa um `fetch` próprio para que este 401 signifique credenciais inválidas e não dispare o encerramento de sessão.
    - rotulo: MSW · endereço sem token
      requisicao:
        metodo: GET
        url: /usuario/endereco
      resposta:
        status: 200
        corpo:
          cep: '01001000'
          logradouro: Praça da Sé
          numero: '1'
      origem: executado
      nota: Os handlers do MSW simulam o contrato da API e não conferem o cabeçalho `Authorization`.
    - rotulo: Gateway · endereço sem token
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
    - rotulo: Gateway · endereço com o token do MSW
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
        cabecalhos:
          Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
      nota: 'O shell aceita esse token porque só lê o payload. O Gateway, configurado com segredo compartilhado, aceita apenas HS256 e recusa o cabeçalho `alg: RS256` antes de verificar a assinatura, que também falharia, assim como a ausência de `iss` e `aud`.'

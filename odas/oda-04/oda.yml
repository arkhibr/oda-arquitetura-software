- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer o shell encerrar a sessão quando o token deixa de valer, com testes que provam a falha e a correção, porque no commit de referência nenhum código chama `sessionMonitor.start()` e os dois mecanismos de encerramento ficam desligados. Os passos 1 a 4 caracterizam o `sessionMonitor`, os passos 5 a 9 corrigem o shell com o teste escrito antes da correção, e o passo 10 confere o resultado no navegador. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: faixa
    estilo: objetivo
    problema: O `src/shared/auth/sessionMonitor.ts` tem dois mecanismos de encerramento, a verificação da expiração a cada 60 segundos e a escuta do evento `auth:unauthorized`, e nenhum arquivo de `src/` chama `sessionMonitor.start()` no commit `2179313`. O README de `shared/auth` e o diagrama da ADR-004 afirmam o contrário, e o `vitest.config.ts` exclui o monitor da cobertura.
    impacto: Com o portal aberto, um token que expira não leva a pessoa de volta ao login, e o evento que o `httpClient` emitiria num 401 não tem ouvinte. A sessão só termina quando uma chamada de microfrontend recebe 401 e aciona o callback `onUnauthorized`.
    mecanismo: O laboratório caracteriza o monitor com o relógio simulado do Vitest, que avança 60 segundos sem espera, escreve antes da correção um teste que monta os `Providers` do shell e liga o monitor ao ciclo de vida do shell com um `useEffect` que chama `sessionMonitor.start()` e devolve a função que o desliga.
    comprovacao: Os dois testes dos `Providers` falham com `expected true to be false` antes da correção e passam depois, a suíte termina com `Tests 103 passed (103)`, e no navegador o evento `auth:unauthorized` leva a página para `/login` e apaga `portal_access_token` do `sessionStorage`.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'

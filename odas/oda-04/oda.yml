- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os incidentes abaixo partem do navegador, do Gateway, do MSW e do código no commit `2179313`. Em cada um, identifique a causa antes de ler a correção.
  - tipo: incidente
    titulo: Evento auth:unauthorized sem efeito
    origem: executado
    rotulo_saida: log
    saida: "{\n  \"antes\": \"/dashboard\",\n  \"tokenAntes\": [\n    \"portal_access_token\"\n  ],\n  \"depois\": \"/dashboard\",\n  \"tokenDepois\": [\n    \"portal_access_token\"\n  ]\n}"
    pergunta: Depois do login, o evento `auth:unauthorized` foi emitido na janela, e o resultado mostra a rota e o `sessionStorage` antes e depois dele. Por que a pessoa continua no painel?
    correcao: Iniciar o `sessionMonitor` no ciclo de vida do shell, como no laboratório, e corrigir o README de `shared/auth`, que atribui a chamada ao `authSlice`.
    alternativas:
    - texto: O evento precisa ser emitido no `document`, e não na `window`.
      correta: false
      explicacao: O `sessionMonitor` registra o ouvinte na `window`, a mesma usada pelo `httpClient`.
    - texto: Nenhum código do shell chama `sessionMonitor.start()`, e por isso ninguém ouve o evento.
      correta: true
      explicacao: O `main.tsx`, os `Providers` e o `authSlice` não iniciam o monitor no commit `2179313`.
    - texto: O `AuthGuard` só confere a sessão ao trocar de rota.
      correta: false
      explicacao: O guard reage à mudança de `isAuthenticated`, e o valor não mudou.
  - tipo: incidente
    titulo: Token aceito no shell e recusado no Gateway
    origem: executado
    rotulo_saida: log
    saida: '$ curl -i -H "Authorization: Bearer $TEST_TOKEN" http://localhost:4000/bff/endereco/usuario/endereco

      HTTP/1.1 401 Unauthorized

      content-type: application/json

      vary: Origin

      x-correlation-id: dac60d07-663e-472e-ad09-5ba4073eec27

      content-length: 71

      Date: Fri, 09 Oct 2026 20:55:10 GMT

      Connection: keep-alive

      Keep-Alive: timeout=5


      {"error":"unauthorized","message":"Token Bearer ausente ou inválido."}'
    pergunta: O shell aceita o `TEST_TOKEN` do MSW e libera o painel. Por que o Gateway responde 401?
    correcao: Testar chamadas pelo Gateway com um token assinado pelo emissor configurado nele, porque o token do MSW serve apenas ao modo de desenvolvimento do shell.
    alternativas:
    - texto: O token expirou entre o login e a chamada.
      correta: false
      explicacao: O `exp` do token é 9999999999, no ano de 2286.
    - texto: O Gateway exige o token num cabeçalho chamado `X-Token`.
      correta: false
      explicacao: O `gateway/src/auth.ts` lê o cabeçalho `Authorization` no formato `Bearer <token>`.
    - texto: O shell só decodifica o payload e confere `exp`, e o Gateway confere algoritmo, assinatura, emissor e audiência, e o token do MSW falha nesses pontos.
      correta: true
      explicacao: 'O `tokenParser` não verifica assinatura. O Gateway exige HS256 assinado com `JWT_SHARED_SECRET`, e o token do MSW tem `alg: RS256`, a assinatura literal `signature` e nenhum `iss` ou `aud`.'
  - tipo: incidente
    titulo: Endereço devolvido sem token
    origem: executado
    rotulo_saida: log
    saida: "GET /usuario/endereco  (sem Authorization)\nHTTP 200\n{\"cep\":\"01001000\",\"logradouro\":\"Praça da Sé\",\"numero\":\"1\"}\n\nsrc/mocks/handlers.ts:15-17\n  http.get('/usuario/endereco', () =>\n    HttpResponse.json({ cep: '01001000', logradouro: 'Praça da Sé', numero: '1' }),\n  ),"
    pergunta: Em `npm run dev`, o endereço chega mesmo sem token. O que isso indica?
    correcao: Testar autorização contra o Gateway, e tratar o MSW como simulação do contrato de dados.
    alternativas:
    - texto: O handler do MSW devolve o endereço sem conferir o cabeçalho `Authorization`.
      correta: true
      explicacao: O handler de `GET /usuario/endereco` responde sempre 200 com o mesmo corpo.
    - texto: O BFF de endereço está sem autenticação.
      correta: false
      explicacao: Em `npm run dev`, a requisição é interceptada pelo MSW no navegador e não chega ao BFF, que exige a chave interna do Gateway.
    - texto: O token ficou no cache do navegador.
      correta: false
      explicacao: A requisição foi feita sem o cabeçalho `Authorization`, e o MSW não lê o `sessionStorage`.
  - tipo: incidente
    titulo: Por que o login não usa o httpClient
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/features/auth/loginRequest.ts:3-9\n/**\n * Autentica via `POST /auth/token` e retorna o access token.\n *\n * Usa fetch dedicado (e não o httpClient compartilhado) porque o 401 aqui\n * significa \"credenciais inválidas\" — não \"sessão expirada\" — e não deve\n * disparar o fluxo global de logout.\n */"
    pergunta: O que aconteceria se o login usasse o `httpClient` compartilhado?
    correcao: Manter o `fetch` dedicado no login, porque o 401 dessa rota tem significado próprio.
    alternativas:
    - texto: O `httpClient` não aceita o método `POST`.
      correta: false
      explicacao: O `httpClient` repassa `options`, que podem ter qualquer método.
    - texto: A senha errada geraria 401, e o `httpClient` apagaria o token e emitiria `auth:unauthorized`, tratando credencial inválida como sessão expirada.
      correta: true
      explicacao: O comentário do arquivo registra essa razão, e o `httpClient` trata todo 401 como fim de sessão.
    - texto: O login ficaria mais lento.
      correta: false
      explicacao: As duas formas fazem um único `fetch`.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Pela Atualização 1.1 da ADR-004, quem é a autoridade para aceitar ou recusar um JWT?
      alternativas:
      - texto: O `tokenParser` do shell.
        correta: false
        explicacao: O `tokenParser` só decodifica o payload e serve à experiência do usuário.
      - texto: O `sessionStorage`.
        correta: false
        explicacao: A ADR registra que o `sessionStorage` não é fronteira de autorização.
      - texto: O Gateway.
        correta: true
        explicacao: Ele valida assinatura, algoritmo, emissor, audiência e expiração antes de encaminhar aos BFFs.
    - enunciado: Por que a ADR-004 escolheu `sessionStorage` e não `localStorage`?
      alternativas:
      - texto: Porque o `sessionStorage` é isolado por aba e é limpo ao fechar a aba.
        correta: true
        explicacao: A ADR cita o isolamento de sessão e a menor janela de exposição.
      - texto: Porque o `sessionStorage` não é acessível por JavaScript.
        correta: false
        explicacao: O `sessionStorage` é acessível por JavaScript, e essa proteção é do cookie `httpOnly`.
      - texto: Porque o `sessionStorage` tem mais espaço.
        correta: false
        explicacao: Espaço não aparece entre os drivers da ADR.
    - enunciado: Num microfrontend, o que acontece quando o BFF responde 401?
      alternativas:
      - texto: Nada, porque só o shell trata 401.
        correta: false
        explicacao: O `createHttpClient` do microfrontend trata o 401 com o callback.
      - texto: O `httpClient` do microfrontend chama `onUnauthorized`, e o shell despacha `logout()`.
        correta: true
        explicacao: 'O `MfeHost` passa `onUnauthorized: () => dispatch(logout())` no contexto de montagem.'
      - texto: O microfrontend apaga o token do `sessionStorage`.
        correta: false
        explicacao: O microfrontend recebe o token pelo contexto e não acessa o `sessionStorage`.
    - enunciado: No laboratório, por que o teste do `Providers` falhou antes da correção?
      alternativas:
      - texto: Porque o `TEST_TOKEN` estava expirado.
        correta: false
        explicacao: O `exp` do `TEST_TOKEN` é 9999999999.
      - texto: Porque o `render` não monta o store.
        correta: false
        explicacao: Os `Providers` envolvem a árvore com o `ReduxProvider` do store do shell.
      - texto: Porque o evento `auth:unauthorized` não tinha ouvinte, já que o monitor não era iniciado.
        correta: true
        explicacao: Depois do `useEffect` com `sessionMonitor.start()`, o mesmo teste passou.
    - enunciado: O que o relógio simulado do Vitest permite verificar no `sessionMonitor`?
      alternativas:
      - texto: Que o logout acontece na verificação de 60 segundos, e não antes.
        correta: true
        explicacao: O teste avança 59.999 ms, confere a sessão ativa e só então avança o último milissegundo.
      - texto: Que o Gateway recusa tokens expirados.
        correta: false
        explicacao: O teste roda só no shell, sem chamar o Gateway.
      - texto: Que o `sessionStorage` expira sozinho.
        correta: false
        explicacao: O `sessionStorage` não tem expiração por tempo.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O caminho do token do login aos guards e aos microfrontends está claro.
    - A diferença entre a verificação no shell e a validação no Gateway está clara.
    - Os testes do `sessionMonitor` passaram e falharam sem o ouvinte.
    - Os dois testes do `Providers` falharam antes da correção e passaram depois, com a suíte em 103 testes.
    - O navegador foi para `/login` depois do evento `auth:unauthorized`.

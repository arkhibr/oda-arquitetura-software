id: '04'
titulo: Autenticação JWT de ponta a ponta
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O portal autentica com JWT: o shell guarda o token no `sessionStorage`, os guards de rota leem o estado do Redux, e o Gateway é a única autoridade que valida a assinatura. Esta ODA percorre esse ciclo, compara a ADR-004 com o código e corrige, com o teste escrito antes, o encerramento de sessão que a ADR descreve e o shell não executa.'
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar o caminho do token desde o login até os guards de rota e os microfrontends.
    - Distinguir a verificação de expiração feita no shell da validação de assinatura feita no Gateway.
    - Caracterizar o `sessionMonitor` com testes que usam relógio simulado.
    - Ligar o `sessionMonitor` ao ciclo de vida do shell com o teste escrito e rodado antes da correção.
    - Identificar onde o MSW, o shell e o Gateway respondem de forma diferente ao mesmo token.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: A ODA 03, com o repositório clonado no commit `2179313` e as dependências da raiz instaladas. O passo final do laboratório usa o navegador com `npm run dev` e não depende do Docker.
  - tipo: terminal
    titulo: terminal · testes de autenticação
    comandos:
    - entrada: npx vitest run src/shared/auth src/shared/api src/app/router
      saida: " RUN  v4.1.7 .\n\n\n Test Files  6 passed (6)\n      Tests  23 passed (23)"
      origem: executado
      dica: 'São 6 arquivos: o `httpClient`, o `ApiError`, o `tokenParser`, o `tokenStorage` e os dois guards. Nenhum deles testa o `sessionMonitor`.'
    cenarios:
    - rotulo: Rodar os testes de autenticação
      comando: npx vitest run src/shared/auth src/shared/api src/app/router
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: A ADR-004 decide onde guardar o token e como perceber que a sessão terminou. A Atualização 1.1 da mesma ADR acrescenta que o `sessionStorage` não é fronteira de autorização, porque a autoridade de segurança passou a ser o Gateway.
  - tipo: comparativo
    colunas:
    - Shell (navegador)
    - Gateway
    linhas:
    - dimensao: O que confere no token
      valores:
      - Formato, `sub`, `iat` e `exp`, decodificando o payload sem verificar a assinatura
      - Assinatura, algoritmo, emissor, audiência e expiração
    - dimensao: Arquivo
      valores:
      - '`src/shared/auth/tokenParser.ts`'
      - '`gateway/src/auth.ts`'
    - dimensao: Consequência de token inválido
      valores:
      - O usuário volta para o login, o que só melhora a experiência
      - Resposta 401, e a requisição não chega ao BFF
    - dimensao: Pode ser contornado pelo usuário?
      valores:
      - Sim, porque o código roda no navegador dele
      - Não sem a chave de assinatura
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Sequência
    titulo: Fluxo de autenticação da ADR-004 (docs/architecture/adrs/ADR-004-autenticacao.md)
    mermaid: "sequenceDiagram\n    actor U as Usuário\n    participant SPA as Portal Web\n    participant TS as tokenStorage\n    participant SM as sessionMonitor\n    participant API as API de Clientes\n\n    U->>SPA: login(usuário, senha)\n    SPA->>API: POST /auth/token\n    API-->>SPA: { access_token }\n    SPA->>TS: set(token)\n    SPA->>SM: start()\n\n    loop a cada 60s\n        SM->>TS: get()\n        SM->>SM: isTokenExpired?\n        alt token expirado\n            SM->>SPA: dispatch(logout())\n            SPA->>TS: clear()\n        end\n    end\n\n    SPA->>API: GET /recurso (Bearer token)\n    alt 401 Unauthorized\n        API-->>SPA: 401\n        SPA-->>SPA: event(auth:unauthorized)\n        SPA->>SPA: dispatch(logout())\n        SPA->>TS: clear()\n    end"
  - tipo: conceito
    titulo: Dois mecanismos de encerramento
    texto: O `sessionMonitor` combina uma verificação pelo relógio do navegador a cada 60 segundos com a escuta do evento `auth:unauthorized`, que o `httpClient` do shell emite ao receber 401. Os dois só funcionam depois de `sessionMonitor.start()`, e o diagrama da ADR mostra essa chamada logo após o login. Como o `httpClient` do shell ainda não tem chamadores, o efeito prático do monitor está na verificação de 60 segundos, que encerra a sessão quando o token expira com o portal aberto.
  - tipo: adr
    id: ADR-004
    titulo: Tática de autenticação
    status: Proposed
    contexto: O token JWT precisa ficar no navegador entre requisições, ter a validade verificada de forma proativa e ser descartado quando o servidor recusar uma requisição por sessão expirada.
    decisao: '`sessionStorage`, isolado por aba, com o `sessionMonitor` verificando a expiração a cada 60 segundos e reagindo ao evento DOM `auth:unauthorized`.'
    alternativas: '`localStorage`, descartado por persistir além da sessão e ampliar a exposição a XSS, cookie `httpOnly`, descartado por exigir mudanças no back-end nesta fase, e token só em memória, descartado por perder a sessão a cada recarga.'
    consequencias: O usuário autentica de novo ao reabrir a aba, e o relógio do navegador pode divergir do servidor. A Atualização 1.1 registra que a autorização depende do Gateway, que valida o token antes de encaminhar a requisição aos BFFs.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Os trechos abaixo seguem o token no commit `2179313`: armazenamento, leitura do payload, reidratação no store, monitoramento, tratamento do 401 no shell e nos microfrontends e validação no Gateway. Clique nos marcadores para ler a explicação de cada linha.'
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/auth/tokenStorage.ts
    commit: '2179313'
    linhas:
    - // src/shared/auth/tokenStorage.ts
    - const KEY = 'portal_access_token'
    - ''
    - export const tokenStorage = {
    - '  get(): string | null {'
    - '    return sessionStorage.getItem(KEY)'
    - '  },'
    - '  set(token: string): void {'
    - '    sessionStorage.setItem(KEY, token)'
    - '  },'
    - '  clear(): void {'
    - '    sessionStorage.removeItem(KEY)'
    - '  },'
    - '}'
    anotacoes:
    - linha: 2
      texto: A chave usada no `sessionStorage`, que aparece no console do navegador depois do login.
    - linha: 9
      texto: Único ponto de gravação do token, chamado pelo reducer `login`.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/auth/tokenParser.ts
    commit: '2179313'
    linhas:
    - 'export function parseToken(token: string): JwtPayload {'
    - '  const parts = token.split(''.'')'
    - '  if (parts.length !== 3) throw new Error(''Token JWT inválido'')'
    - ''
    - '  const raw = parts[1]!'
    - '  const decoded = atob(raw.replace(/-/g, ''+'').replace(/_/g, ''/''))'
    - '  return JSON.parse(decoded) as JwtPayload'
    - '}'
    - ''
    - 'export function isTokenExpired(token: string): boolean {'
    - '  try {'
    - '    const { exp, iat, sub } = parseToken(token)'
    - '    if (!Number.isFinite(exp) || !Number.isFinite(iat) || typeof sub !== ''string'' || sub.length === 0) return true'
    - '    return Date.now() >= exp * 1000'
    - '  } catch {'
    - '    return true'
    - '  }'
    - '}'
    anotacoes:
    - linha: 14
      texto: Decodifica o payload sem verificar a assinatura, que fica a cargo do Gateway.
    - linha: 21
      texto: Token sem `exp`, `iat` ou `sub` válidos é tratado como expirado, que é a falha segura citada pela ADR.
    - linha: 22
      texto: A expiração usa o relógio do navegador.
    inicio: 9
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/authSlice.ts
    commit: '2179313'
    linhas:
    - 'function hydrateInitialState(): AuthState {'
    - '  const token = tokenStorage.get()'
    - '  if (token && !isTokenExpired(token)) {'
    - '    try {'
    - '      return { token, user: parseToken(token), isAuthenticated: true }'
    - '    } catch {'
    - '      tokenStorage.clear()'
    - '    }'
    - '  }'
    - '  return { token: null, user: null, isAuthenticated: false }'
    - '}'
    - ''
    - 'const initialState: AuthState = hydrateInitialState()'
    anotacoes:
    - linha: 14
      texto: Ao carregar o módulo, o store lê o token gravado na aba.
    - linha: 17
      texto: Uma recarga de página mantém a sessão se o token ainda não expirou.
    inicio: 13
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/auth/sessionMonitor.ts
    commit: '2179313'
    linhas:
    - import { store } from '@/shared/lib/store'
    - import { logout } from '@/shared/lib/store/authSlice'
    - import { isTokenExpired } from './tokenParser'
    - import { tokenStorage } from './tokenStorage'
    - ''
    - 'let intervalId: ReturnType<typeof setInterval> | null = null'
    - ''
    - function handleUnauthorized() {
    - '  store.dispatch(logout())'
    - '}'
    - ''
    - export const sessionMonitor = {
    - '  start(): void {'
    - '    if (intervalId) return'
    - ''
    - '    intervalId = setInterval(() => {'
    - '      const token = tokenStorage.get()'
    - '      if (token && isTokenExpired(token)) {'
    - '        store.dispatch(logout())'
    - '      }'
    - '    }, 60_000)'
    - ''
    - '    window.addEventListener(''auth:unauthorized'', handleUnauthorized)'
    - '  },'
    - ''
    - '  stop(): void {'
    - '    if (intervalId) {'
    - '      clearInterval(intervalId)'
    - '      intervalId = null'
    - '    }'
    - '    window.removeEventListener(''auth:unauthorized'', handleUnauthorized)'
    - '  },'
    - '}'
    anotacoes:
    - linha: 16
      texto: 'Primeiro mecanismo: verificação a cada 60 segundos.'
    - linha: 23
      texto: 'Segundo mecanismo: reação ao 401 sinalizado pelo `httpClient`.'
    - linha: 26
      texto: Desliga os dois mecanismos, o que um componente deve chamar ao desmontar.
  - tipo: faixa
    estilo: dica
    texto: Nenhum código de produção do shell importa `src/shared/api/httpClient.ts` no commit `2179313`. Os `fetch` do shell estão em `loadManifest.ts`, `loadMfeModule.ts`, `loginRequest.ts` e `shared/config/index.ts`, e as chamadas de negócio saem dos microfrontends, cujo 401 encerra a sessão pelo callback `onUnauthorized`.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/api/httpClient.ts
    commit: '2179313'
    linhas:
    - export async function httpClient<T>(
    - '  url: string,'
    - '  options: RequestInit = {},'
    - '): Promise<T> {'
    - '  const token = tokenStorage.get()'
    - '  const baseUrl = getApiUrl()'
    - ''
    - '  const response = await fetch(`${baseUrl}${url}`, {'
    - '    ...options,'
    - '    headers: {'
    - '      ''Content-Type'': ''application/json'','
    - '      ...(token ? { Authorization: `Bearer ${token}` } : {}),'
    - '      ...options.headers,'
    - '    },'
    - '  })'
    - ''
    - '  if (response.status === 401) {'
    - '    tokenStorage.clear()'
    - '    window.dispatchEvent(new CustomEvent(''auth:unauthorized''))'
    - '    throw new ApiError(401, ''Sessão expirada'')'
    - '  }'
    - ''
    - '  if (!response.ok) {'
    - '    const body = await response.json().catch(() => ({}))'
    - '    throw new ApiError(response.status, body)'
    - '  }'
    - ''
    - '  if (response.status === 204) return undefined as T'
    - '  return response.json() as Promise<T>'
    - '}'
    anotacoes:
    - linha: 16
      texto: O token seguiria no cabeçalho `Authorization` das chamadas feitas por este cliente, que no commit `2179313` não tem chamadores fora dos testes.
    - linha: 22
      texto: No 401, o `httpClient` apaga o token da aba antes de avisar o restante do shell.
    - linha: 23
      texto: O aviso é um evento DOM, ouvido apenas por um `sessionMonitor` iniciado.
    inicio: 5
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/api/httpClient.ts
    commit: '2179313'
    linhas:
    - 'export function createHttpClient(deps: HttpClientDeps) {'
    - '  const bff = deps.bff ?? ''endereco'''
    - '  const prefix = deps.apiUrl ? `/bff/${bff}` : '''''
    - '  return async function client<T>(path: string, options: RequestInit = {}): Promise<T> {'
    - '    const res = await fetch(`${deps.apiUrl}${prefix}${path}`, {'
    - '      ...options,'
    - '      headers: {'
    - '        ''Content-Type'': ''application/json'','
    - '        ...(deps.token ? { Authorization: `Bearer ${deps.token}` } : {}),'
    - '        ...options.headers,'
    - '      },'
    - '    })'
    - '    if (res.status === 401) {'
    - '      deps.onUnauthorized()'
    - '      throw new Error(''Sessão expirada'')'
    - '    }'
    - '    if (!res.ok) throw new Error(`HTTP ${res.status}`)'
    - '    if (res.status === 204) return undefined as T'
    - '    return res.json() as Promise<T>'
    - '  }'
    - '}'
    anotacoes:
    - linha: 22
      texto: O microfrontend recebe o token pelo contexto de montagem e não lê o `sessionStorage`.
    - linha: 27
      texto: No 401, o microfrontend chama o callback recebido do shell.
    inicio: 14
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/MfeHost.tsx
    commit: '2179313'
    linhas:
    - '        m.mount(el, {'
    - '          apiUrl: getApiUrl(),'
    - '          token,'
    - '          basePath: entry.route,'
    - '          onUnauthorized: () => dispatch(logout()),'
    - '        })'
    anotacoes:
    - linha: 32
      texto: O shell entrega ao microfrontend o token lido do store.
    - linha: 34
      texto: O callback encerra a sessão diretamente, sem depender do `sessionMonitor`.
    inicio: 30
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/auth.ts
    commit: '2179313'
    linhas:
    - '    const match = authorization?.match(/^Bearer ([A-Za-z0-9._~-]+)$/)'
    - '    if (!match) {'
    - '      return c.json({ error: ''unauthorized'', message: ''Token Bearer ausente ou inválido.'' }, 401)'
    - '    }'
    - ''
    - '    try {'
    - '      const options = { issuer: config.issuer, audience: config.audience }'
    - '      const { payload } = remoteJwks'
    - '        ? await jwtVerify(match[1], remoteJwks, { ...options, algorithms: [''RS256''] })'
    - '        : await jwtVerify(match[1], sharedSecret!, { ...options, algorithms: [''HS256''] })'
    - '      const user = userFromPayload(payload)'
    - '      if (!user) throw new Error(''claims inválidos'')'
    - '      c.set(''auth'', user)'
    - '      await next()'
    - '    } catch {'
    - '      return c.json({ error: ''unauthorized'', message: ''Token Bearer ausente ou inválido.'' }, 401)'
    - '    }'
    anotacoes:
    - linha: 25
      texto: O Gateway exige o cabeçalho no formato `Bearer <token>`.
    - linha: 34
      texto: Com segredo compartilhado, só tokens HS256 assinados com o segredo são aceitos, com emissor e audiência conferidos.
    - linha: 39
      texto: Qualquer falha de verificação vira a mesma resposta 401.
    inicio: 25
  - tipo: faixa
    estilo: erro
    sintoma: O `src/shared/auth/README.md` diz que o `authSlice` chama `sessionMonitor.start()`, e o diagrama da ADR-004 mostra essa chamada logo após o login.
    causa: No commit `2179313`, nenhum arquivo de `src/` chama `sessionMonitor.start()`, nem o `authSlice`, nem o `main.tsx`, nem os `Providers`, e os dois mecanismos de encerramento ficam desligados. O `vitest.config.ts` exclui o `sessionMonitor` e os `Providers` da cobertura com a justificativa de que são cobertos por E2E, e nenhum teste de `tests/e2e/` exercita o monitor.
    correcao: O laboratório inicia o monitor nos `Providers` com o teste escrito antes, e o README de `shared/auth` precisa registrar o novo ponto de chamada.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Envie pelo console as requisições de login e de endereço ao back-end simulado pelo MSW e ao Gateway, e compare as respostas para o mesmo token. Depois, acompanhe na linha do tempo o caminho que um 401 recebido pelo `httpClient` do shell percorreria, com e sem o `sessionMonitor` iniciado.
  - tipo: console-api
    cenarios:
    - rotulo: MSW · login com a senha correta
      requisicao:
        metodo: POST
        url: /auth/token
        corpo:
          email: usuario@teste.com
          senha: senha123
      resposta:
        status: 200
        corpo:
          access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature
      origem: executado
      nota: 'O token tem cabeçalho RS256 e a assinatura literal `signature`, e o payload traz `sub: user1` e `exp: 9999999999`.'
    - rotulo: MSW · login com a senha errada
      requisicao:
        metodo: POST
        url: /auth/token
        corpo:
          email: usuario@teste.com
          senha: errada
      resposta:
        status: 401
      origem: executado
      nota: O `loginRequest` usa um `fetch` próprio para que este 401 signifique credenciais inválidas e não dispare o encerramento de sessão.
    - rotulo: MSW · endereço sem token
      requisicao:
        metodo: GET
        url: /usuario/endereco
      resposta:
        status: 200
        corpo:
          cep: '01001000'
          logradouro: Praça da Sé
          numero: '1'
      origem: executado
      nota: Os handlers do MSW simulam o contrato da API e não conferem o cabeçalho `Authorization`.
    - rotulo: Gateway · endereço sem token
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
    - rotulo: Gateway · endereço com o token do MSW
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/endereco/usuario/endereco
        cabecalhos:
          Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsImV4cCI6OTk5OTk5OTk5OSwiaWF0IjoxNzAwMDAwMDAwfQ.signature
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
      nota: 'O shell aceita esse token porque só lê o payload. O Gateway, configurado com segredo compartilhado, aceita apenas HS256 e recusa o cabeçalho `alg: RS256` antes de verificar a assinatura, que também falharia, assim como a ausência de `iss` e `aud`.'
  - tipo: linha-do-tempo
    titulo: Um 401 recebido pelo httpClient do shell, se ele tivesse chamadores
    atores:
    - id: gateway
      rotulo: Gateway
    - id: http
      rotulo: httpClient do shell
    - id: storage
      rotulo: sessionStorage
    - id: janela
      rotulo: window (eventos DOM)
    - id: monitor
      rotulo: sessionMonitor
    - id: store
      rotulo: Store (auth)
    - id: guard
      rotulo: AuthGuard
    eventos:
    - id: e1
      de: gateway
      para: http
      mensagem: 401 `Token Bearer ausente ou inválido.`
    - id: e2
      de: http
      para: storage
      mensagem: '`tokenStorage.clear()` apaga `portal_access_token`'
      depende: e1
    - id: e3
      de: http
      para: janela
      mensagem: '`window.dispatchEvent(new CustomEvent(''auth:unauthorized''))`'
      depende: e1
    - id: e4
      de: janela
      para: monitor
      mensagem: o ouvinte registrado por `sessionMonitor.start()` recebe o evento
      depende: e3
    - id: e5
      de: monitor
      para: store
      mensagem: '`store.dispatch(logout())`'
      depende: e4
    - id: e6
      de: store
      para: guard
      mensagem: '`isAuthenticated: false` leva a rota para `/login`'
      depende: e5
    falhas:
    - id: monitor-parado
      rotulo: O sessionMonitor não foi iniciado, como no commit 2179313
      ator: monitor
  - tipo: classificador
    enunciado: Quem confere cada propriedade do token no portal?
    categorias:
    - id: shell
      rotulo: Shell
    - id: gateway
      rotulo: Gateway
    - id: ninguem
      rotulo: Nenhum dos dois
    itens:
    - texto: A assinatura do token
      categoria: gateway
      explicacao: O `jwtVerify` do Gateway confere a assinatura com o segredo ou com o JWKS.
    - texto: O emissor e a audiência
      categoria: gateway
      explicacao: O Gateway passa `issuer` e `audience` ao `jwtVerify`.
    - texto: A expiração, para levar o usuário de volta ao login
      categoria: shell
      explicacao: O `isTokenExpired` usa o relógio do navegador no reducer `login` e em `hydrateInitialState`, para melhorar a experiência, sem valor de autorização. A verificação periódica do `sessionMonitor` só passa a rodar depois da correção do laboratório.
    - texto: Se o token foi revogado antes de expirar
      categoria: ninguem
      explicacao: Nenhum dos trechos lidos consulta lista de revogação, e a ADR-004 não trata esse caso.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no repositório clonado na ODA 00. Os passos 1 a 4 caracterizam o `sessionMonitor`, os passos 5 a 9 corrigem o shell com o teste escrito antes da correção, e o passo 10 confere o resultado no navegador.
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/shared/auth src/shared/api src/app/router
      sucesso: '`Test Files 6 passed (6)` e `Tests 23 passed (23)`.'
    - titulo: Escrever os testes do sessionMonitor
      texto: Crie o arquivo abaixo. O relógio simulado do Vitest permite avançar 60 segundos sem esperar.
      editor:
        rotulo: arquivo
        caminho: src/shared/auth/__tests__/sessionMonitor.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect, vi, beforeEach, afterEach } from 'vitest'
        - import { store } from '@/shared/lib/store'
        - import { login } from '@/shared/lib/store/authSlice'
        - import { sessionMonitor } from '../sessionMonitor'
        - ''
        - const INICIO = new Date('2026-10-09T12:00:00Z')
        - ''
        - 'function tokenQueExpiraEm(segundos: number) {'
        - '  const agora = Math.floor(INICIO.getTime() / 1000)'

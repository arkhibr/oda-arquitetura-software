id: '04'
titulo: Autenticação JWT de ponta a ponta
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é acompanhar o JWT (JSON Web Token) do login até a resposta 401 e corrigir o encerramento de sessão que o shell deveria fazer e não faz, porque sem ele uma pessoa com o token expirado continua no painel até que uma chamada de microfrontend receba 401. No `frontend-react`, o shell guarda o token no `sessionStorage`, os guards de rota leem o estado do Redux, e só o Gateway valida a assinatura. Você vai mostrar com testes que o monitor de sessão nunca é iniciado e corrigir o shell com o teste escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: JWT (JSON Web Token)
      definicao: Token assinado com três partes em Base64, cabeçalho, conteúdo e assinatura, que carrega dados do usuário como o identificador e a data de expiração. O portal envia o JWT no cabeçalho `Authorization`, e o Gateway confere a assinatura antes de aceitar a chamada.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: '`sessionStorage`'
      definicao: Área de armazenamento do navegador isolada por aba, apagada quando a aba é fechada e acessível por JavaScript. O shell guarda nela o token, na chave `portal_access_token`.
      referencia:
        rotulo: MDN · Window.sessionStorage
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Window/sessionStorage
    - termo: Guard de rota (`AuthGuard`)
      definicao: Componente que decide se uma rota pode ser exibida e redireciona para outra quando a condição falha. O `AuthGuard` do shell lê `isAuthenticated` no store e leva para `/login` quem não está autenticado.
    - termo: Redux e Redux Toolkit
      definicao: O Redux guarda o estado global de uma aplicação num único objeto, que só muda por meio de ações tratadas por reducers. O Redux Toolkit é o pacote oficial que simplifica esse uso, e o shell o usa em `src/shared/lib/store/`.
      referencia:
        rotulo: Redux Toolkit · Primeiros passos
        url: https://redux-toolkit.js.org/introduction/getting-started
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: Assinatura do JWT
      definicao: Parte final do token, calculada com uma chave a partir do cabeçalho e do conteúdo, que prova que o token não foi alterado e foi emitido por quem tem a chave. O shell só lê o conteúdo, e quem confere a assinatura é o Gateway.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Monitor de sessão (`sessionMonitor`)
      definicao: Módulo do shell em `src/shared/auth/sessionMonitor.ts` que encerra a sessão quando o token expira, conferindo a cada 60 segundos, ou quando recebe o evento `auth:unauthorized`. Ele só age depois de `sessionMonitor.start()`.
    - termo: Teste escrito antes (TDD)
      definicao: Prática em que o teste do comportamento novo é escrito e rodado antes da implementação, para confirmar que ele falha pela razão esperada. Depois, a implementação mínima faz o teste passar.
      referencia:
        rotulo: martinfowler.com · Test Driven Development
        url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    - termo: Relógio simulado (fake timers)
      definicao: Recurso do Vitest que substitui o relógio real durante o teste e permite avançar o tempo pelo intervalo que o teste indicar, sem esperar. O laboratório avança 60 segundos para disparar a verificação do monitor.
      referencia:
        rotulo: Vitest · Timers
        url: https://vitest.dev/guide/mocking/timers
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Evento DOM e `CustomEvent`
      definicao: Um evento DOM é um aviso emitido num objeto da página e recebido pelos ouvintes registrados com `addEventListener`, e o `CustomEvent` cria um evento com nome próprio. O `httpClient` do shell emite `auth:unauthorized` na `window` ao receber 401.
      referencia:
        rotulo: MDN · CustomEvent
        url: https://developer.mozilla.org/en-US/docs/Web/API/CustomEvent
    - termo: '`localStorage`'
      definicao: Área de armazenamento do navegador compartilhada por todas as abas da mesma origem e mantida depois de fechar o navegador. A ADR-004 a descartou para o token por ampliar a exposição.
      referencia:
        rotulo: MDN · Window.localStorage
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Window/localStorage
    - termo: XSS (Cross-Site Scripting)
      definicao: Ataque em que um script malicioso é injetado na página e roda com as permissões dela, podendo ler o que o JavaScript da página acessa, como o `sessionStorage`. A CSP e o cookie `httpOnly` são defesas contra os efeitos desse ataque.
      referencia:
        rotulo: OWASP · Cross Site Scripting (XSS)
        url: https://owasp.org/www-community/attacks/xss/
    - termo: Cookie `httpOnly`
      definicao: Cookie que o navegador envia ao servidor em cada requisição e que o JavaScript da página não consegue ler. A ADR-004 o descartou porque exigiria mudanças no back-end.
      referencia:
        rotulo: MDN · Cookies HTTP
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/Cookies
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: '`exp`, `iat` e `sub`'
      definicao: Campos do conteúdo de um JWT que informam a expiração, o momento de emissão e o identificador do usuário. O `tokenParser` do shell trata como expirado o token sem esses campos válidos.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Store
      definicao: Objeto do Redux que guarda o estado global, recebe as ações por `dispatch` e avisa os componentes que leem o estado. O shell cria um único store com `configureStore`.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: Callback `onUnauthorized`
      definicao: Função que o shell entrega ao microfrontend no contexto de montagem e que o microfrontend chama quando a API responde 401. O shell a implementa com o `dispatch(logout())`.
    - termo: 'Cabeçalho `Authorization: Bearer`'
      definicao: Cabeçalho HTTP que leva a credencial da requisição, e o esquema `Bearer` indica que a credencial é um token, enviado como `Bearer <token>`. O Gateway lê o JWT desse cabeçalho e o remove antes de chamar o BFF.
      referencia:
        rotulo: MDN · Cabeçalho Authorization
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Authorization
    - termo: HS256, RS256 e JWKS
      definicao: HS256 assina o token com um segredo compartilhado, e RS256 assina com uma chave privada e confere com a chave pública correspondente. O JWKS é o endereço que publica essas chaves públicas, e o Gateway usa HS256 com `JWT_SHARED_SECRET` quando não há JWKS configurado.
      referencia:
        rotulo: IETF · RFC 7518, JSON Web Algorithms
        url: https://datatracker.ietf.org/doc/html/rfc7518
    - termo: Emissor e audiência de um JWT (`iss` e `aud`)
      definicao: Campos do token que dizem quem o emitiu e para qual serviço ele foi emitido. O Gateway só aceita tokens com o emissor e a audiência configurados nele.
      referencia:
        rotulo: jwt.io · Introdução ao JSON Web Token
        url: https://jwt.io/introduction
    - termo: Teste E2E (ponta a ponta)
      definicao: Teste que abre a aplicação num navegador real e percorre telas como uma pessoa faria. O repositório os escreve com o Playwright, em `tests/e2e/`.
      referencia:
        rotulo: Playwright · Instalação
        url: https://playwright.dev/docs/intro
    - termo: Cobertura de testes
      definicao: Medida de quais linhas do código os testes executam. O `vitest.config.ts` exclui alguns arquivos dessa medida, entre eles o `sessionMonitor`.
      referencia:
        rotulo: Vitest · Primeiros passos
        url: https://vitest.dev/guide/
    - termo: Vitest
      definicao: Ferramenta de testes integrada ao Vite, que roda os testes do shell e dos microfrontends com `npm test` e oferece simulação de módulos e de relógio.
      referencia:
        rotulo: Vitest · Primeiros passos
        url: https://vitest.dev/guide/
    - termo: DevTools do navegador
      definicao: Ferramentas de desenvolvedor embutidas no navegador, abertas com F12, com o console para executar JavaScript e a aba Application para ver o `sessionStorage`.
    - termo: Revogação de token
      definicao: Invalidação de um token antes da data de expiração, por exemplo depois de um logout ou de uma senha trocada, o que exige uma lista consultada a cada requisição. Nenhum trecho lido nesta ODA faz essa consulta.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar o caminho do token desde o login até os guards de rota e os microfrontends.
    - Distinguir a verificação de expiração feita no shell da validação de assinatura feita no Gateway.
    - Caracterizar o `sessionMonitor` com testes que usam relógio simulado.
    - Ligar o `sessionMonitor` ao ciclo de vida do shell com o teste escrito e rodado antes da correção.
    - Identificar onde o MSW, o shell e o Gateway respondem de forma diferente ao mesmo token.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O passo final do laboratório usa o navegador com `npm run dev` e não depende do Docker.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba explica as duas decisões de uma autenticação por token no navegador: onde guardar o token e como perceber que a sessão terminou. No repositório, a ADR-004 registra essas escolhas, e a Atualização 1.1 dela acrescenta que o `sessionStorage` não é fronteira de autorização, porque quem valida é o Gateway.'
  - tipo: comparativo
    colunas:
    - Shell (navegador)
    - Gateway
    linhas:
    - dimensao: O que confere no token
      valores:
      - Formato, `sub`, `iat` e `exp`, decodificando o payload sem verificar a assinatura
      - Assinatura, algoritmo, emissor, audiência e expiração
    - dimensao: Arquivo
      valores:
      - '`src/shared/auth/tokenParser.ts`'
      - '`gateway/src/auth.ts`'
    - dimensao: Consequência de token inválido
      valores:
      - O usuário volta para o login, o que só melhora a experiência
      - Resposta 401, e a requisição não chega ao BFF
    - dimensao: Pode ser contornado pelo usuário?
      valores:
      - Sim, porque o código roda no navegador dele
      - Não sem a chave de assinatura
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Sequência
    titulo: Fluxo de autenticação da ADR-004 (docs/architecture/adrs/ADR-004-autenticacao.md)
    mermaid: "sequenceDiagram\n    actor U as Usuário\n    participant SPA as Portal Web\n    participant TS as tokenStorage\n    participant SM as sessionMonitor\n    participant API as API de Clientes\n\n    U->>SPA: login(usuário, senha)\n    SPA->>API: POST /auth/token\n    API-->>SPA: { access_token }\n    SPA->>TS: set(token)\n    SPA->>SM: start()\n\n    loop a cada 60s\n        SM->>TS: get()\n        SM->>SM: isTokenExpired?\n        alt token expirado\n            SM->>SPA: dispatch(logout())\n            SPA->>TS: clear()\n        end\n    end\n\n    SPA->>API: GET /recurso (Bearer token)\n    alt 401 Unauthorized\n        API-->>SPA: 401\n        SPA-->>SPA: event(auth:unauthorized)\n        SPA->>SPA: dispatch(logout())\n        SPA->>TS: clear()\n    end"
  - tipo: conceito
    titulo: Dois mecanismos de encerramento
    texto: O `sessionMonitor` combina uma verificação pelo relógio do navegador a cada 60 segundos com a escuta do evento `auth:unauthorized`, que o `httpClient` do shell emite ao receber 401. Os dois só funcionam depois de `sessionMonitor.start()`, e o diagrama da ADR mostra essa chamada logo após o login. Como o `httpClient` do shell ainda não tem chamadores, o efeito prático do monitor está na verificação de 60 segundos, que encerra a sessão quando o token expira com o portal aberto.
  - tipo: adr
    id: ADR-004
    titulo: Tática de autenticação
    status: Proposed
    contexto: O token JWT precisa ficar no navegador entre requisições, ter a validade verificada de forma proativa e ser descartado quando o servidor recusar uma requisição por sessão expirada.
    decisao: '`sessionStorage`, isolado por aba, com o `sessionMonitor` verificando a expiração a cada 60 segundos e reagindo ao evento DOM `auth:unauthorized`.'
    alternativas: '`localStorage`, descartado por persistir além da sessão e ampliar a exposição a XSS, cookie `httpOnly`, descartado por exigir mudanças no back-end nesta fase, e token só em memória, descartado por perder a sessão a cada recarga.'
    consequencias: O usuário autentica de novo ao reabrir a aba, e o relógio do navegador pode divergir do servidor. A Atualização 1.1 registra que a autorização depende do Gateway, que valida o token antes de encaminhar a requisição aos BFFs.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba segue o token JWT pelos arquivos do shell, do microfrontend de endereço e do Gateway: onde ele é guardado, como o payload é lido, como a sessão volta depois de uma recarga, como o fim da sessão é detectado e onde a assinatura é verificada. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para esta ODA.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/auth/tokenStorage.ts
    commit: '2179313'
    linhas:
    - // src/shared/auth/tokenStorage.ts
    - const KEY = 'portal_access_token'
    - ''
    - export const tokenStorage = {
    - '  get(): string | null {'
    - '    return sessionStorage.getItem(KEY)'
    - '  },'
    - '  set(token: string): void {'
    - '    sessionStorage.setItem(KEY, token)'
    - '  },'
    - '  clear(): void {'
    - '    sessionStorage.removeItem(KEY)'
    - '  },'
    - '}'
    anotacoes:
    - linha: 2
      texto: A chave usada no `sessionStorage`, que aparece no console do navegador depois do login.
    - linha: 9
      texto: Único ponto de gravação do token, chamado pelo reducer `login`.
    contexto: O arquivo `src/shared/auth/tokenStorage.ts` é o módulo do shell que guarda o token JWT no `sessionStorage` da aba do navegador. O arquivo aparece inteiro porque é o único lugar do shell que lê, grava e apaga o token, e a chave que ele usa é a que o laboratório procura no console.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/auth/tokenParser.ts
    commit: '2179313'
    linhas:
    - 'export function parseToken(token: string): JwtPayload {'
    - '  const parts = token.split(''.'')'
    - '  if (parts.length !== 3) throw new Error(''Token JWT inválido'')'
    - ''
    - '  const raw = parts[1]!'
    - '  const decoded = atob(raw.replace(/-/g, ''+'').replace(/_/g, ''/''))'
    - '  return JSON.parse(decoded) as JwtPayload'
    - '}'
    - ''
    - 'export function isTokenExpired(token: string): boolean {'
    - '  try {'
    - '    const { exp, iat, sub } = parseToken(token)'
    - '    if (!Number.isFinite(exp) || !Number.isFinite(iat) || typeof sub !== ''string'' || sub.length === 0) return true'
    - '    return Date.now() >= exp * 1000'
    - '  } catch {'
    - '    return true'
    - '  }'
    - '}'
    anotacoes:
    - linha: 14
      texto: Decodifica o payload sem verificar a assinatura, que fica a cargo do Gateway.
    - linha: 21
      texto: Token sem `exp`, `iat` ou `sub` válidos é tratado como expirado, que é a falha segura citada pela ADR.
    - linha: 22
      texto: A expiração usa o relógio do navegador.
    inicio: 9
    contexto: O arquivo `src/shared/auth/tokenParser.ts` lê o conteúdo do token JWT dentro do navegador. O trecho abaixo contém as funções que decodificam o payload e decidem se o token expirou, e mostra que o shell não confere a assinatura, tarefa que fica com o Gateway.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/store/authSlice.ts
    commit: '2179313'
    linhas:
    - 'function hydrateInitialState(): AuthState {'
    - '  const token = tokenStorage.get()'
    - '  if (token && !isTokenExpired(token)) {'
    - '    try {'
    - '      return { token, user: parseToken(token), isAuthenticated: true }'
    - '    } catch {'
    - '      tokenStorage.clear()'
    - '    }'
    - '  }'
    - '  return { token: null, user: null, isAuthenticated: false }'
    - '}'
    - ''
    - 'const initialState: AuthState = hydrateInitialState()'
    anotacoes:
    - linha: 14
      texto: Ao carregar o módulo, o store lê o token gravado na aba.
    - linha: 17
      texto: Uma recarga de página mantém a sessão se o token ainda não expirou.
    inicio: 13
    contexto: O arquivo `src/shared/lib/store/authSlice.ts` define a fatia `auth` do store do Redux, que mantém o token e o usuário autenticado enquanto o shell está aberto. O trecho abaixo é a reidratação do estado inicial a partir do `sessionStorage`, que decide se uma recarga de página mantém a sessão.

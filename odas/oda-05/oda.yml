    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe
      sucesso: '`Test Files 8 passed (8)` e `Tests 31 passed (31)`.'
    - titulo: Escrever o teste do microfrontend mínimo
      texto: Crie o arquivo abaixo. O `import.meta.glob` do Vite carrega o módulo e lê o texto dos arquivos de `mfes/minimo/` sem depender de APIs do Node.
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/__tests__/mfeMinimo.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect } from 'vitest'
        - import { assertMfeModule, verifyBundleIntegrity } from '../loadMfeModule'
        - ''
        - const PASTA = '../../../../mfes/minimo'
        - const modulos = import.meta.glob('../../../../mfes/minimo/index.js')
        - 'const textos = import.meta.glob<string>(''../../../../mfes/minimo/*'', { query: ''?raw'', import: ''default'', eager: true })'
        - 'const ctx = { apiUrl: '''', token: ''token-de-teste'', onUnauthorized: () => {}, basePath: ''/minimo'' }'
        - ''
        - async function carregar() {
        - '  const importar = modulos[`${PASTA}/index.js`]'
        - '  if (!importar) throw new Error(`[teste] ${PASTA}/index.js não encontrado`)'
        - '  return assertMfeModule(await importar(), `${PASTA}/index.js`)'
        - '}'
        - ''
        - describe('microfrontend mínimo', () => {
        - '  it(''exporta mount e unmount'', async () => {'
        - '    await expect(carregar()).resolves.toBeDefined()'
        - '  })'
        - ''
        - '  it(''mount renderiza dentro do elemento recebido, com o basePath do contexto'', async () => {'
        - '    const mfe = await carregar()'
        - '    const el = document.createElement(''div'')'
        - '    mfe.mount(el, ctx)'
        - '    expect(el.textContent).toContain(''/minimo'')'
        - '  })'
        - ''
        - '  it(''unmount esvazia o elemento'', async () => {'
        - '    const mfe = await carregar()'
        - '    const el = document.createElement(''div'')'
        - '    mfe.mount(el, ctx)'
        - '    mfe.unmount(el)'
        - '    expect(el.childElementCount).toBe(0)'
        - '  })'
        - ''
        - '  it(''o hash SHA-256 do arquivo confere com o valor de integrity.txt'', async () => {'
        - '    const conteudo = textos[`${PASTA}/index.js`]'
        - '    const integridade = textos[`${PASTA}/integrity.txt`]'
        - '    expect(conteudo).toBeDefined()'
        - '    expect(integridade).toBeDefined()'
        - '    await expect(verifyBundleIntegrity(new TextEncoder().encode(conteudo).buffer, integridade!.trim())).resolves.toBeUndefined()'
        - '  })'
        - '})'
      efeito: teste_minimo
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/mfeMinimo.test.ts
      sucesso: '`Tests 4 failed (4)`, com `[teste] ../../../../mfes/minimo/index.js não encontrado`.'
    - titulo: Criar o microfrontend mínimo
      texto: Crie a pasta `mfes/minimo/` e o arquivo abaixo, que cumpre o contrato com a API do DOM.
      editor:
        rotulo: arquivo
        caminho: mfes/minimo/index.js (novo)
        commit: '2179313'
        linhas:
        - '// Microfrontend mínimo: cumpre o contrato mount/unmount da ADR-009 sem framework.'
        - const limpezas = new WeakMap()
        - ''
        - export function mount(el, ctx) {
        - '  const secao = document.createElement(''section'')'
        - '  const titulo = document.createElement(''h2'')'
        - '  titulo.textContent = ''Microfrontend mínimo'''
        - '  const rota = document.createElement(''p'')'
        - '  rota.textContent = `Rota: ${ctx.basePath}`'
        - '  const botao = document.createElement(''button'')'
        - '  botao.type = ''button'''
        - '  botao.textContent = ''Sinalizar sessão expirada'''
        - '  const aoClicar = () => ctx.onUnauthorized()'
        - '  botao.addEventListener(''click'', aoClicar)'
        - '  secao.append(titulo, rota, botao)'
        - '  el.replaceChildren(secao)'
        - '  limpezas.set(el, () => botao.removeEventListener(''click'', aoClicar))'
        - '}'
        - ''
        - export function unmount(el) {
        - '  limpezas.get(el)?.()'
        - '  limpezas.delete(el)'
        - '  el.replaceChildren()'
        - '}'
      efeito: modulo
    - titulo: Rodar o teste sem o hash publicado
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/mfeMinimo.test.ts

id: '05'
titulo: Microfrontends dinâmicos e o contrato mount/unmount
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é escrever um microfrontend mínimo que o shell do `frontend-react` aceite carregar, cumprindo o contrato `mount` e `unmount`, porque o carregador recusa o bundle cujo hash SHA-256 não confere com o manifesto, antes de executá-lo, e o módulo que não exporta as duas funções, antes de montá-lo. No portal, cada microfrontend é um bundle ESM (ECMAScript Modules) autônomo, carregado em tempo de execução, e essas conferências impedem o shell de montar código alterado depois da publicação ou incapaz de se desmontar. Você vai criar um microfrontend de um arquivo, sem React, com o teste escrito antes, e provocar as duas falhas que o carregador detecta.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Contrato `mount`/`unmount`
      definicao: 'Interface que todo microfrontend do portal cumpre: `mount(el, ctx)` renderiza a tela dentro do elemento entregue pelo shell, com o contexto recebido, e `unmount(el)` desmonta essa tela e libera o elemento. A ADR-009 define esse contrato.'
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: ESM (ECMAScript Modules)
      definicao: Formato padrão de módulos do JavaScript, com `import` e `export`, que o navegador carrega diretamente. Os bundles dos microfrontends são módulos ESM.
      referencia:
        rotulo: MDN · Módulos JavaScript
        url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Modules
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Teste escrito antes (TDD)
      definicao: Prática em que o teste do comportamento novo é escrito e rodado antes da implementação, para confirmar que ele falha pela razão esperada. Depois, a implementação mínima faz o teste passar.
      referencia:
        rotulo: martinfowler.com · Test Driven Development
        url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: OpenSSL
      definicao: Ferramenta de linha de comando para criptografia, usada no laboratório para calcular o SHA-256 de um arquivo e convertê-lo para Base64.
    - termo: WSL (Windows Subsystem for Linux) e Git Bash
      definicao: O WSL é um recurso do Windows que executa um ambiente Linux completo, e o Git Bash é o terminal bash que acompanha o Git para Windows. Os dois aceitam a sintaxe de comandos usada nos laboratórios.
      referencia:
        rotulo: Microsoft Learn · O que é o Subsistema do Windows para Linux
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: detached HEAD
      definicao: Estado do Git em que a cópia de trabalho aponta para um commit específico, fora de qualquer branch. É o estado que o `git checkout` de um commit produz, e as alterações feitas nele não pertencem a nenhum branch até que um seja criado.
      referencia:
        rotulo: Git · git checkout
        url: https://git-scm.com/docs/git-checkout
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Blob
      definicao: Objeto do navegador que guarda bytes em memória e pode receber uma URL própria. O carregador transforma o bundle já conferido num Blob e importa esse Blob como módulo.
      referencia:
        rotulo: MDN · Blob
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Blob
    - termo: Module Federation
      definicao: Recurso de bundlers como o Webpack e o Vite, por plugin, que carrega módulos de outra aplicação em tempo de execução e compartilha dependências entre elas, como o React. A ADR-009 o descartou porque o compartilhamento acopla as versões.
    - termo: Web Components e Shadow DOM
      definicao: Web Components são elementos HTML personalizados definidos por JavaScript, e o Shadow DOM isola o HTML e o CSS de um elemento do restante da página. A ADR-009 os descartou pelo atrito com estilos globais e com a passagem de funções.
      referencia:
        rotulo: MDN · Web Components
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Web_components
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: DOM (Document Object Model)
      definicao: Representação da página como uma árvore de objetos que o JavaScript lê e altera, por meio de funções como `createElement` e `addEventListener`.
      referencia:
        rotulo: MDN · DOM
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/DOM
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: Raiz React (`createRoot`)
      definicao: Ponto em que o React começa a renderizar uma árvore de componentes dentro de um elemento da página. Cada microfrontend cria a própria raiz com o React embutido no bundle, separada da árvore do shell.
      referencia:
        rotulo: React · createRoot
        url: https://react.dev/reference/react-dom/client/createRoot
    - termo: Árvore React
      definicao: Conjunto de componentes que uma raiz React renderiza, em que cada componente é filho de outro. Erros de renderização sobem por essa árvore até o error boundary mais próximo.
      referencia:
        rotulo: React · createRoot
        url: https://react.dev/reference/react-dom/client/createRoot
    - termo: '`import()` dinâmico'
      definicao: Forma de carregar um módulo ESM durante a execução, a partir de uma URL calculada pelo programa. Com `import(url)`, o navegador baixa e executa o módulo na mesma operação, sem oportunidade de conferir os bytes antes.
      referencia:
        rotulo: MDN · import()
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: Store
      definicao: Objeto do Redux que guarda o estado global, recebe as ações por `dispatch` e avisa os componentes que leem o estado. O shell cria um único store com `configureStore`.
      referencia:
        rotulo: Redux · Store
        url: https://redux.js.org/tutorials/fundamentals/part-4-store
    - termo: Error boundary
      definicao: Componente React que captura erros de renderização dos componentes abaixo dele na mesma árvore e mostra uma tela alternativa. O shell envolve cada microfrontend no `MfeErrorBoundary`.
      referencia:
        rotulo: React · Error boundary
        url: https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary
    - termo: Callback `onUnauthorized`
      definicao: Função que o shell entrega ao microfrontend no contexto de montagem e que o microfrontend chama quando a API responde 401. O shell a implementa com o `dispatch(logout())`.
    - termo: Reducer e ação
      definicao: A ação é um objeto que descreve o que aconteceu, com um `type` e um `payload`, e o reducer é a função que recebe o estado atual e a ação e devolve o estado novo. O guia de estilo do Redux exige que o reducer não tenha efeitos fora da função.
      referencia:
        rotulo: Redux · Estado, ações e reducers
        url: https://redux.js.org/tutorials/fundamentals/part-3-state-actions-reducers
    - termo: Base64
      definicao: Codificação que representa bytes com 64 caracteres de texto, usada para escrever hashes e tokens em formato legível. O hash do campo `integrity` tem 43 caracteres em Base64 seguidos de `=`.
      referencia:
        rotulo: MDN · Base64
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Base64
    - termo: '`import.meta.glob`'
      definicao: Função do Vite que importa, durante o build ou o teste, todos os arquivos que correspondem a um padrão de caminho. O teste do laboratório a usa para carregar o microfrontend mínimo e ler o texto dos arquivos.
      referencia:
        rotulo: Vite · Importação com glob
        url: https://vite.dev/guide/features#glob-import
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: CORS (Cross-Origin Resource Sharing)
      definicao: Mecanismo de cabeçalhos HTTP com que um servidor autoriza páginas de outra origem a ler as respostas dele. Os buckets precisam de CORS porque o shell, na porta 5173, baixa bundles servidos pela porta 4566, que é outra origem.
      referencia:
        rotulo: MDN · Cross-Origin Resource Sharing (CORS)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
    - termo: Pacote de tipos
      definicao: Pacote npm que publica só declarações de tipo do TypeScript, sem código que rode, para que vários projetos compilem contra a mesma definição de contrato.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Vitest
      definicao: Ferramenta de testes integrada ao Vite, que roda os testes do shell e dos microfrontends com `npm test` e oferece simulação de módulos e de relógio.
      referencia:
        rotulo: Vitest · Primeiros passos
        url: https://vitest.dev/guide/
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar por que o portal carrega os microfrontends em tempo de execução e que contrato cada bundle precisa cumprir para ser montado pelo shell.
    - 'Seguir no código o caminho do bundle: download, hash SHA-256, importação e validação do contrato.'
    - Implementar um microfrontend mínimo que cumpre o contrato, com o teste escrito e rodado antes.
    - Reconhecer as mensagens do carregador quando o contrato ou o hash não conferem.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O laboratório usa `openssl`, disponível no macOS, no Linux e no Git Bash do Windows. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica a escolha entre integrar microfrontends na compilação do shell ou em tempo de execução, quando o shell baixa o código de cada microfrontend ao abrir a rota, e o contrato que torna a segunda forma possível. Esse contrato é um módulo ESM, formato padrão de módulos do JavaScript, que exporta as funções `mount` e `unmount` e leva o próprio React embutido.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Contrato `mount`/`unmount`
      definicao: 'Interface que todo microfrontend do portal cumpre: `mount(el, ctx)` renderiza a tela dentro do elemento entregue pelo shell, com o contexto recebido, e `unmount(el)` desmonta essa tela e libera o elemento. A ADR-009 define esse contrato.'
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Module Federation
      definicao: Recurso de bundlers como o Webpack e o Vite, por plugin, que carrega módulos de outra aplicação em tempo de execução e compartilha dependências entre elas, como o React. A ADR-009 o descartou porque o compartilhamento acopla as versões.
    - termo: Web Components e Shadow DOM
      definicao: Web Components são elementos HTML personalizados definidos por JavaScript, e o Shadow DOM isola o HTML e o CSS de um elemento do restante da página. A ADR-009 os descartou pelo atrito com estilos globais e com a passagem de funções.
      referencia:
        rotulo: MDN · Web Components
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Web_components
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Vite e modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do shell e dos microfrontends, o mesmo que responde em `npm run dev`. O modo biblioteca gera um único arquivo a partir de um ponto de entrada, e é assim que cada microfrontend vira um bundle ESM.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: DOM (Document Object Model)
      definicao: Representação da página como uma árvore de objetos que o JavaScript lê e altera, por meio de funções como `createElement` e `addEventListener`.
      referencia:
        rotulo: MDN · DOM
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/DOM
  - tipo: conceito
    titulo: Integração em tempo de execução
    texto: Integrar microfrontends em tempo de execução significa que o shell baixa o código de cada microfrontend quando a página roda, a partir de uma URL, sem que esse código entre no build do shell. Cada microfrontend é um bundle ESM, um arquivo JavaScript no formato padrão de módulos, que leva o próprio React embutido. Com isso, um microfrontend é publicado sem recompilar o shell, e cada um carrega o próprio React, o que aumenta o tamanho dos bundles.
  - tipo: conceito
    titulo: Verificação de integridade do bundle
    texto: Antes de executar um bundle, o carregador do shell baixa os bytes, calcula o hash SHA-256, um valor que muda com qualquer byte alterado, e o compara com o campo `integrity` do manifesto. Só com o hash conferido o shell transforma os bytes num Blob, um objeto de bytes em memória, e o importa como módulo, recusando em seguida o módulo que não exporte `mount` e `unmount`. Assim, um arquivo alterado depois da publicação não chega a rodar no portal.
  - tipo: conceito
    titulo: O que o contrato exige
    texto: O `mount(el, ctx)` assume a `div` entregue pelo shell e renderiza dentro dela com os dados do contexto, e o `unmount(el)` libera a mesma `div`, desmontando a árvore e removendo ouvintes. O shell chama `unmount` ao sair da rota e remonta o microfrontend quando a URL do bundle ou o token mudam.
  - tipo: comparativo
    colunas:
    - Contrato mount/unmount (escolhido)
    - Module Federation
    - Web Components
    linhas:
    - dimensao: Dependências compartilhadas
      valores:
      - Nenhuma, cada bundle embute o próprio React
      - React compartilhado como singleton
      - Nenhuma, com estilos isolados por Shadow DOM
    - dimensao: Tamanho do bundle
      valores:
      - Maior, porque cada bundle traz o próprio React. A ADR cita cerca de 800 kB para o `endereco.js`, e o build do commit gera menos de 300 kB
      - Menor
      - Depende do framework interno
    - dimensao: Passagem de contexto
      valores:
      - Objeto `ctx` com `apiUrl`, `token`, `basePath` e `onUnauthorized`
      - Imports federados
      - Atributos e propriedades do elemento, com dificuldade para funções
    - dimensao: Motivo na ADR-009
      valores:
      - Autonomia total e contrato mínimo
      - Descartado por acoplar versões de React
      - Descartado pelo atrito com estilos globais e contexto rico
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Sequência
    titulo: Ciclo de vida do contrato (docs/architecture/adrs/ADR-009-contrato-mount-unmount.md)
    mermaid: "sequenceDiagram\n    participant S as Shell (MfeHost)\n    participant L as loadMfeModule\n    participant M as MFE bundle\n    S->>L: import(url)\n    L->>L: valida mount/unmount\n    L-->>S: { mount, unmount }\n    S->>M: mount(div, ctx)\n    M->>M: renderiza (React próprio)\n    Note over S,M: usuário sai da rota / token muda\n    S->>M: unmount(div)"
  - tipo: adr
    id: ADR-009
    titulo: Contrato mount/unmount entre shell e MFEs
    status: Proposed
    contexto: A ADR-008 decidiu integrar microfrontends em tempo de execução, e faltava definir como um bundle de outra equipe é montado no shell e recebe a URL da API e o token sem importar nada do shell em build.
    decisao: Contrato `mount`/`unmount` com bundles ESM gerados pelo Vite em lib mode, com o React embutido em cada bundle.
    alternativas: Module Federation, descartado porque compartilhar dependências contraria a autonomia e acopla versões de React, e Web Components com Shadow DOM, descartado pelo atrito com estilos globais e com a passagem de funções.
    consequencias: Cada microfrontend embute o próprio React, o que aumenta o tamanho dos bundles, e o contrato precisa ser mantido estável e versionado.

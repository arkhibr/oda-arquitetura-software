- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria ao publicar microfrontends. As duas primeiras mostram falhas reais do carregador no laboratório, e as duas últimas tratam de divergências entre a documentação e o código: escolha a causa de cada uma para ver a explicação e a correção.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Contrato `mount`/`unmount`
      definicao: 'Interface que todo microfrontend do portal cumpre: `mount(el, ctx)` renderiza a tela dentro do elemento entregue pelo shell, com o contexto recebido, e `unmount(el)` desmonta essa tela e libera o elemento. A ADR-009 define esse contrato.'
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: '`fetch`'
      definicao: 'Função do navegador que faz requisições HTTP e devolve uma promessa. A falha `TypeError: Failed to fetch` indica que não houve resposta utilizável, por servidor parado ou por bloqueio de CORS ou de CSP.'
      referencia:
        rotulo: MDN · Fetch API
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: OpenSSL
      definicao: Ferramenta de linha de comando para criptografia, usada no laboratório para calcular o SHA-256 de um arquivo e convertê-lo para Base64.
    - termo: '`import()` dinâmico'
      definicao: Forma de carregar um módulo ESM durante a execução, a partir de uma URL calculada pelo programa. Com `import(url)`, o navegador baixa e executa o módulo na mesma operação, sem oportunidade de conferir os bytes antes.
      referencia:
        rotulo: MDN · import()
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Blob
      definicao: Objeto do navegador que guarda bytes em memória e pode receber uma URL própria. O carregador transforma o bundle já conferido num Blob e importa esse Blob como módulo.
      referencia:
        rotulo: MDN · Blob
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Blob
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: CORS (Cross-Origin Resource Sharing)
      definicao: Mecanismo de cabeçalhos HTTP com que um servidor autoriza páginas de outra origem a ler as respostas dele. Os buckets precisam de CORS porque o shell, na porta 5173, baixa bundles servidos pela porta 4566, que é outra origem.
      referencia:
        rotulo: MDN · Cross-Origin Resource Sharing (CORS)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
    - termo: Pacote de tipos
      definicao: Pacote npm que publica só declarações de tipo do TypeScript, sem código que rode, para que vários projetos compilem contra a mesma definição de contrato.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: TypeScript
      definicao: Linguagem que acrescenta tipos estáticos ao JavaScript e é convertida em JavaScript antes de rodar. O compilador `tsc` confere os tipos sem gerar arquivos quando é chamado com `--noEmit`.
      referencia:
        rotulo: TypeScript · Documentação
        url: https://www.typescriptlang.org/docs/
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
  - tipo: incidente
    titulo: Bundle recusado pelo carregador
    origem: executado
    rotulo_saida: log
    saida: "Caused by: Error: [mfe] bundle ../../../../mfes/minimo/index.js não exporta unmount()\nCaused by: Error: [mfe] integridade do bundle inválida\n Test Files  1 failed (1)\n      Tests  4 failed (4)"
    pergunta: O que o carregador do shell detectou?
    correcao: Exportar `mount` e `unmount` com esses nomes exatos, que são os nomes que o contrato exige.
    alternativas:
    - texto: O React do microfrontend tem versão diferente da do shell.
      correta: false
      explicacao: O microfrontend mínimo nem usa React, e o contrato não compara versões.
    - texto: O módulo não exporta uma função chamada `unmount`, e o `assertMfeModule` o recusa.
      correta: true
      explicacao: A mensagem vem de `loadMfeModule.ts:7`, que confere o tipo de `unmount`. A falha de integridade aparece junto porque renomear a função também mudou os bytes do arquivo.
    - texto: O bundle não foi encontrado no bucket.
      correta: false
      explicacao: Bundle ausente gera `respondeu HTTP 404` ou falha de `fetch`, e não a mensagem do contrato.
  - tipo: incidente
    titulo: Hash que não confere
    origem: executado
    rotulo_saida: log
    saida: "Caused by: Error: [mfe] integridade do bundle inválida\n Test Files  1 failed (1)\n      Tests  1 failed | 3 passed (4)"
    pergunta: Uma única letra do arquivo mudou depois de gerar o hash. Por que o teste falhou?
    correcao: Gerar o hash depois da última alteração e publicar o bundle e o manifesto juntos, como faz o deploy da raiz.
    alternativas:
    - texto: O `mount` lançou exceção por causa do texto.
      correta: false
      explicacao: Os testes de `mount` e `unmount` passaram, e só o teste do hash falhou.
    - texto: O `openssl` gerou o hash com outro algoritmo.
      correta: false
      explicacao: O comando usa `-sha256`, e o mesmo arquivo sem a alteração passou no teste.
    - texto: O SHA-256 dos bytes atuais difere do valor registrado, e o shell recusa o bundle antes de executá-lo.
      correta: true
      explicacao: O `verifyBundleIntegrity` compara o hash calculado com o `integrity` publicado.
  - tipo: incidente
    titulo: import(url) na ADR e Blob no código
    origem: codigo
    rotulo_saida: arquivo
    saida: "docs/architecture/adrs/ADR-009-contrato-mount-unmount.md\n  O shell faz `import(url)` nativo do bundle, valida que `mount`/`unmount` existem ...\n\nsrc/app/mfe/loadMfeModule.ts:25-32\n  const response = await fetch(url, { credentials: 'omit', cache: 'no-store' })\n  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)\n  const bytes = await response.arrayBuffer()\n  await verifyBundleIntegrity(bytes, integrity)\n  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }))\n  let mod: unknown\n  try {\n    mod = await import(/* @vite-ignore */ blobUrl)"
    pergunta: A ADR-009 descreve um `import(url)` direto do bundle. Por que o código não importa a URL diretamente?
    correcao: Atualizar a ADR-009 para descrever o download, a verificação do hash e a importação do Blob.
    alternativas:
    - texto: Para conferir o hash dos bytes antes de executá-los, o que `import(url)` não permite.
      correta: true
      explicacao: Com `import(url)`, o navegador executa o módulo ao baixá-lo, sem dar ao shell a chance de recusá-lo.
    - texto: Porque `import()` não funciona com URLs de outra origem.
      correta: false
      explicacao: O `import()` aceita outras origens com CORS, e os buckets têm CORS configurado, decisão registrada na ADR-011.
    - texto: Para reduzir o tamanho do bundle.
      correta: false
      explicacao: O Blob tem os mesmos bytes baixados.
  - tipo: incidente
    titulo: Três cópias do mesmo contrato
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/app/mfe/types.ts:18-29\n/** Contrato que todo bundle de MFE deve exportar. */\nexport interface MfeMountContext {\n  apiUrl: string\n  token: string | null\n  onUnauthorized: () => void\n  basePath: string\n}\n\nexport interface MfeModule {\n  mount: (el: HTMLElement, ctx: MfeMountContext) => void\n  unmount: (el: HTMLElement) => void\n}\n\nmfes/endereco/src/contract.ts e mfes/emprestimo/src/contract.ts\n// Contrato publicado pelo shell (ADR-009). Cópia local para manter o MFE autônomo.\nexport interface MfeMountContext {\n  ..."
    pergunta: O shell e os dois microfrontends têm cópias idênticas do contrato, e nenhum teste as compara. Qual é o risco?
    correcao: Versionar o contrato e acrescentar uma verificação que compare as cópias, ou publicar o contrato como pacote de tipos sem código de execução.
    alternativas:
    - texto: O Vite recusa tipos duplicados no build.
      correta: false
      explicacao: Cada pacote tem o próprio build, e tipos iguais em pacotes diferentes não conflitam.
    - texto: Uma mudança numa cópia passa despercebida até falhar em tempo de execução, porque cada pacote compila contra a própria cópia.
      correta: true
      explicacao: A cópia local mantém a autonomia de build, e o preço é a divergência silenciosa entre as versões.
    - texto: O bundle fica maior por causa das cópias.
      correta: false
      explicacao: As interfaces do TypeScript somem na compilação e não vão para o bundle.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Module Federation
      definicao: Recurso de bundlers como o Webpack e o Vite, por plugin, que carrega módulos de outra aplicação em tempo de execução e compartilha dependências entre elas, como o React. A ADR-009 o descartou porque o compartilhamento acopla as versões.
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Contrato `mount`/`unmount`
      definicao: 'Interface que todo microfrontend do portal cumpre: `mount(el, ctx)` renderiza a tela dentro do elemento entregue pelo shell, com o contexto recebido, e `unmount(el)` desmonta essa tela e libera o elemento. A ADR-009 define esse contrato.'
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: DOM (Document Object Model)
      definicao: Representação da página como uma árvore de objetos que o JavaScript lê e altera, por meio de funções como `createElement` e `addEventListener`.
      referencia:
        rotulo: MDN · DOM
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/DOM
    - termo: Callback `onUnauthorized`
      definicao: Função que o shell entrega ao microfrontend no contexto de montagem e que o microfrontend chama quando a API responde 401. O shell a implementa com o `dispatch(logout())`.
    - termo: HTTP 401 (Unauthorized)
      definicao: Código de resposta HTTP que indica que a requisição não trouxe credencial válida. No portal, o Gateway responde 401 sem token válido, e o BFF responde 401 quando a chamada não veio do Gateway.
      referencia:
        rotulo: MDN · 401 Unauthorized
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Integração em tempo de execução
      definicao: Forma de compor o portal em que o shell baixa o bundle de cada microfrontend quando a página roda, sem recompilar o shell. A ADR-008 escolheu essa forma, e a integração na compilação exigiria um novo build do shell a cada mudança de microfrontend.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
  - tipo: quiz
    perguntas:
    - enunciado: Por que o portal não usa o Module Federation, recurso que carrega módulos de outra aplicação e compartilha dependências como o React?
      alternativas:
      - texto: Porque o Federation não funciona com Vite.
        correta: false
        explicacao: A ADR-009, que registra essa escolha, cita o plugin `@originjs/vite-plugin-federation` como opção viável.
      - texto: Porque o Federation gera bundles maiores.
        correta: false
        explicacao: O Federation gera bundles menores, e a ADR-009 aceitou bundles maiores em troca da autonomia de cada microfrontend.
      - texto: Porque compartilhar dependências acopla as versões de React entre shell e microfrontends.
        correta: true
        explicacao: A ADR-009 registra que o benefício central do Federation contraria o requisito de autonomia.
    - enunciado: Em que momento o shell baixa o bundle de um microfrontend?
      alternativas:
      - texto: Quando a rota do microfrontend é renderizada pelo `MfeHost`.
        correta: true
        explicacao: O único chamador de `loadMfeModule` é o efeito do `MfeMountPoint`.
      - texto: No boot do shell, na ordem do manifesto.
        correta: false
        explicacao: No boot, o shell só lê e valida o manifesto.
      - texto: No login.
        correta: false
        explicacao: O login só grava o token.
    - enunciado: O que o `unmount` precisa fazer?
      alternativas:
      - texto: Chamar `onUnauthorized`.
        correta: false
        explicacao: O `onUnauthorized` serve para sinalizar o 401.
      - texto: Liberar o elemento recebido, desmontando a árvore e removendo os ouvintes.
        correta: true
        explicacao: É o que o contrato exige, e o teste do laboratório confere o elemento vazio.
      - texto: Apagar o bundle do bucket.
        correta: false
        explicacao: O bundle continua publicado, e o `unmount` só trata o DOM.
    - enunciado: Por que o microfrontend mínimo do laboratório funciona sem React?
      alternativas:
      - texto: Porque o shell empresta o React dele.
        correta: false
        explicacao: O shell não compartilha React com os microfrontends.
      - texto: Porque o teste simula o React.
        correta: false
        explicacao: O teste usa o módulo real e as funções `assertMfeModule` e `verifyBundleIntegrity` do carregador do shell.
      - texto: Porque o contrato só exige duas funções que recebem um elemento do DOM.
        correta: true
        explicacao: Nada no contrato depende do React ou de outro framework.
    - enunciado: O que acontece se o arquivo do bundle mudar depois de o hash ser publicado no manifesto?
      alternativas:
      - texto: O shell recusa o bundle com `[mfe] integridade do bundle inválida`.
        correta: true
        explicacao: O laboratório mostrou a falha com uma única letra alterada.
      - texto: O shell carrega a versão nova normalmente.
        correta: false
        explicacao: O hash é conferido em toda carga.
      - texto: O shell recalcula o hash e atualiza o manifesto.
        correta: false
        explicacao: Quem atualiza o manifesto é o deploy, e não o shell.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A integração em tempo de execução e o contrato `mount`/`unmount` estão claros.
    - O caminho do bundle, do download à validação do contrato, está claro.
    - O teste do microfrontend mínimo falhou antes do módulo e passou depois do hash.
    - As mensagens de contrato quebrado e de hash diferente foram reconhecidas.
    - A suíte completa terminou com 103 testes aprovados.

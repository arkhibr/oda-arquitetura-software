  - tipo: fluxo
    titulo: Do manifesto ao mount
    etapas:
    - titulo: Download
      descricao: O `MfeHost` chama `loadMfeModule` com a URL e o `integrity` da entrada do manifesto.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - '  const response = await fetch(url, { credentials: ''omit'', cache: ''no-store'' })'
        - '  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)'
        - '  const bytes = await response.arrayBuffer()'
        destaque:
        - 1
        - 2
    - titulo: Hash
      descricao: O SHA-256 dos bytes é comparado com o manifesto, e a diferença interrompe a carga antes de executar o código.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - 'export async function verifyBundleIntegrity(bytes: ArrayBuffer, integrity: string): Promise<void> {'
        - '  const digest = await crypto.subtle.digest(''SHA-256'', bytes)'
        - '  const actual = `sha256-${toBase64(new Uint8Array(digest))}`'
        - '  if (actual !== integrity) throw new Error(''[mfe] integridade do bundle inválida'')'
        - '}'
        destaque:
        - 4
    - titulo: Importação
      descricao: Os bytes conferidos viram um Blob, importado como módulo ESM.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - '  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: ''text/javascript'' }))'
        - '  let mod: unknown'
        - '  try {'
        - '    mod = await import(/* @vite-ignore */ blobUrl)'
        - '  } finally {'
        - '    URL.revokeObjectURL(blobUrl)'
        - '  }'
        destaque:
        - 1
        - 4
    - titulo: Contrato
      descricao: O módulo precisa exportar `mount` e `unmount` como funções.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - 'export function assertMfeModule(mod: unknown, url: string): MfeModule {'
        - '  const m = mod as Partial<MfeModule>'
        - '  if (typeof m?.mount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta mount()`)'
        - '  if (typeof m?.unmount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta unmount()`)'
        - '  return m as MfeModule'
        - '}'
        destaque:
        - 3
        - 4
    - titulo: Montagem
      descricao: O `MfeHost` chama `mount` com a `div` e o contexto, e chama `unmount` quando a rota sai da tela ou o token muda.
  - tipo: linha-do-tempo
    titulo: Ciclo de vida de um microfrontend
    atores:
    - id: host
      rotulo: MfeHost
    - id: loader
      rotulo: loadMfeModule
    - id: s3
      rotulo: Bucket do microfrontend
    - id: mfe
      rotulo: Bundle do microfrontend
    eventos:
    - id: e1
      de: host
      para: loader
      mensagem: '`loadMfeModule(url, integrity)`'
    - id: e2
      de: loader
      para: s3
      mensagem: '`fetch(url)` dos bytes do bundle'
      depende: e1
    - id: e3
      de: s3
      para: loader
      mensagem: bytes, conferidos com o SHA-256 do manifesto
      depende: e2
    - id: e4
      de: loader
      para: host
      mensagem: '`{ mount, unmount }` validados'
      depende: e3
    - id: e5
      de: host
      para: mfe
      mensagem: '`mount(div, ctx)`'
      depende: e4
    - id: e6
      de: host
      para: mfe
      mensagem: '`unmount(div)` ao sair da rota'
      depende: e5
    falhas:
    - id: bucket-fora
      rotulo: O bucket não responde, como depois de reiniciar o LocalStack
      ator: s3
  - tipo: classificador
    enunciado: Quem é responsável por cada tarefa no contrato `mount`/`unmount`?
    categorias:
    - id: shell
      rotulo: Shell
    - id: mfe
      rotulo: Microfrontend
    itens:
    - texto: Conferir o hash SHA-256 do bundle
      categoria: shell
      explicacao: O `verifyBundleIntegrity` roda no carregador do shell, antes da importação.
    - texto: Criar a raiz React que renderiza a tela
      categoria: mfe
      explicacao: O `mount` do microfrontend chama `createRoot` com o próprio React embutido.
    - texto: Entregar `apiUrl`, `token` e `basePath`
      categoria: shell
      explicacao: O `MfeHost` monta o contexto a partir da configuração e do store.
    - texto: Remover os ouvintes de eventos ao sair da rota
      categoria: mfe
      explicacao: A ADR-009 atribui ao `unmount` a remoção da árvore e dos ouvintes.
    - texto: Recusar um módulo sem `unmount`
      categoria: shell
      explicacao: O `assertMfeModule` lança o erro que o error boundary transforma em aviso.
    - texto: Encerrar a sessão quando a API responde 401
      categoria: shell
      explicacao: O microfrontend só chama `onUnauthorized`, e o shell despacha o `logout`.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é criar um microfrontend que passa pelas validações do carregador do shell e ver as duas falhas que elas detectam, porque são as mensagens dessas falhas que revelam a uma equipe um contrato quebrado ou um bundle publicado com o hash desatualizado. Os passos 1 a 7 escrevem o teste, criam o microfrontend de um arquivo, sem React e sem build, e publicam o hash, e os passos 8 a 10 quebram o contrato, alteram o arquivo depois do hash e rodam a suíte. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: '`import.meta.glob`'
      definicao: Função do Vite que importa, durante o build ou o teste, todos os arquivos que correspondem a um padrão de caminho. O teste do laboratório a usa para carregar o microfrontend mínimo e ler o texto dos arquivos.
      referencia:
        rotulo: Vite · Importação com glob
        url: https://vite.dev/guide/features#glob-import
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: DOM (Document Object Model)
      definicao: Representação da página como uma árvore de objetos que o JavaScript lê e altera, por meio de funções como `createElement` e `addEventListener`.
      referencia:
        rotulo: MDN · DOM
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/DOM
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Contrato `mount`/`unmount`
      definicao: 'Interface que todo microfrontend do portal cumpre: `mount(el, ctx)` renderiza a tela dentro do elemento entregue pelo shell, com o contexto recebido, e `unmount(el)` desmonta essa tela e libera o elemento. A ADR-009 define esse contrato.'
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
  - tipo: faixa
    estilo: objetivo
    problema: O shell só monta um microfrontend cujo bundle tenha o SHA-256 igual ao campo `integrity` do manifesto e exporte `mount` e `unmount` como funções, conferências feitas por `verifyBundleIntegrity` e `assertMfeModule` em `src/app/mfe/loadMfeModule.ts`. A ADR-009 ainda descreve um `import(url)` direto, que não permitiria conferir os bytes antes de executá-los.
    impacto: Sem essas conferências, um bundle alterado depois da publicação ou sem a função de desmontagem rodaria dentro do portal, e um microfrontend que não libera o elemento deixaria a árvore e os ouvintes ativos depois de sair da rota.
    mecanismo: O laboratório aplica o teste escrito antes, cria `mfes/minimo/index.js` com a API do DOM, calcula o SHA-256 em Base64 com o `openssl` e confere o módulo com as funções reais do carregador do shell, carregadas no teste por `import.meta.glob`.
    comprovacao: O teste falha com `mfes/minimo/index.js não encontrado` antes do módulo e passa depois do `integrity.txt`, renomear `unmount` produz `não exporta unmount()`, trocar uma letra produz `[mfe] integridade do bundle inválida`, e a suíte termina com `Tests 103 passed (103)`.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'

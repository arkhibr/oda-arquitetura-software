id: '05'
titulo: Microfrontends dinâmicos e o contrato mount/unmount
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O portal carrega microfrontends em tempo de execução, e cada um é um bundle ESM autônomo que exporta duas funções, `mount` e `unmount`. Esta ODA mostra por que a ADR-008 escolheu integração em tempo de execução, como a ADR-009 define o contrato e como o shell confere o bundle antes de montá-lo, e termina com um microfrontend mínimo, sem React, escrito com o teste antes.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a escolha de integração em tempo de execução da ADR-008 e o contrato da ADR-009.
    - 'Seguir no código o caminho do bundle: download, hash SHA-256, importação e validação do contrato.'
    - Implementar um microfrontend mínimo que cumpre o contrato, com o teste escrito e rodado antes.
    - Reconhecer as mensagens do carregador quando o contrato ou o hash não conferem.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: As ODAs 00 e 02, com o repositório clonado no commit `2179313` e as dependências da raiz instaladas. O laboratório usa `openssl`, disponível no macOS, no Linux e no Git Bash do Windows. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · testes do carregamento de microfrontends
    comandos:
    - entrada: npx vitest run src/app/mfe
      saida: " RUN  v4.1.7 .\n\n\n Test Files  8 passed (8)\n      Tests  31 passed (31)"
      origem: executado
      dica: São 8 arquivos de teste da pasta `src/app/mfe`, do manifesto ao error boundary.
    cenarios:
    - rotulo: Rodar os testes de src/app/mfe
      comando: npx vitest run src/app/mfe
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'A ADR-008 decide que funcionalidades entram no portal sem recompilar o shell, e a ADR-009 decide o mecanismo: um módulo ESM com duas funções, que leva o próprio React embutido.'
  - tipo: comparativo
    colunas:
    - Contrato mount/unmount (escolhido)
    - Module Federation
    - Web Components
    linhas:
    - dimensao: Dependências compartilhadas
      valores:
      - Nenhuma, cada bundle embute o próprio React
      - React compartilhado como singleton
      - Nenhuma, com estilos isolados por Shadow DOM
    - dimensao: Tamanho do bundle
      valores:
      - Maior, porque cada bundle traz o próprio React. A ADR cita cerca de 800 kB para o `endereco.js`, e o build do commit gera menos de 300 kB, como mostra a ODA 08
      - Menor
      - Depende do framework interno
    - dimensao: Passagem de contexto
      valores:
      - Objeto `ctx` com `apiUrl`, `token`, `basePath` e `onUnauthorized`
      - Imports federados
      - Atributos e propriedades do elemento, com dificuldade para funções
    - dimensao: Motivo na ADR-009
      valores:
      - Autonomia total e contrato mínimo
      - Descartado por acoplar versões de React
      - Descartado pelo atrito com estilos globais e contexto rico
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Sequência
    titulo: Ciclo de vida do contrato (docs/architecture/adrs/ADR-009-contrato-mount-unmount.md)
    mermaid: "sequenceDiagram\n    participant S as Shell (MfeHost)\n    participant L as loadMfeModule\n    participant M as MFE bundle\n    S->>L: import(url)\n    L->>L: valida mount/unmount\n    L-->>S: { mount, unmount }\n    S->>M: mount(div, ctx)\n    M->>M: renderiza (React próprio)\n    Note over S,M: usuário sai da rota / token muda\n    S->>M: unmount(div)"
  - tipo: conceito
    titulo: O que o contrato exige
    texto: O `mount(el, ctx)` assume a `div` entregue pelo shell e renderiza dentro dela com os dados do contexto, e o `unmount(el)` libera a mesma `div`, desmontando a árvore e removendo ouvintes. O shell chama `unmount` ao sair da rota e remonta o microfrontend quando a URL do bundle ou o token mudam.
  - tipo: adr
    id: ADR-009
    titulo: Contrato mount/unmount entre shell e MFEs
    status: Proposed
    contexto: A ADR-008 decidiu integrar microfrontends em tempo de execução, e faltava definir como um bundle de outra equipe é montado no shell e recebe a URL da API e o token sem importar nada do shell em build.
    decisao: Contrato `mount`/`unmount` com bundles ESM gerados pelo Vite em lib mode, com o React embutido em cada bundle.
    alternativas: Module Federation, descartado porque compartilhar dependências contraria a autonomia e acopla versões de React, e Web Components com Shadow DOM, descartado pelo atrito com estilos globais e com a passagem de funções.
    consequencias: Cada microfrontend embute o próprio React, o que aumenta o tamanho dos bundles, e o contrato precisa ser mantido estável e versionado.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, o contrato, a implementação no microfrontend de endereço e o carregador do shell. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/contract.ts
    commit: '2179313'
    linhas:
    - // Contrato publicado pelo shell (ADR-009). Cópia local para manter o MFE autônomo.
    - export interface MfeMountContext {
    - '  apiUrl: string'
    - '  token: string | null'
    - '  onUnauthorized: () => void'
    - '  basePath: string'
    - '}'
    - export interface MfeModule {
    - '  mount: (el: HTMLElement, ctx: MfeMountContext) => void'
    - '  unmount: (el: HTMLElement) => void'
    - '}'
    anotacoes:
    - linha: 1
      texto: O microfrontend mantém uma cópia local do contrato para não importar nada do shell.
    - linha: 5
      texto: Única função de retorno ao shell, usada para encerrar a sessão num 401.
    - linha: 10
      texto: A desmontagem recebe o mesmo elemento entregue ao `mount`.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/index.tsx
    commit: '2179313'
    linhas:
    - import { StrictMode } from 'react'
    - import { createRoot, type Root } from 'react-dom/client'
    - import { EnderecoApp } from './EnderecoApp'
    - import type { MfeMountContext } from './contract'
    - ''
    - const roots = new WeakMap<HTMLElement, Root>()
    - ''
    - 'export function mount(el: HTMLElement, ctx: MfeMountContext): void {'
    - '  const root = createRoot(el)'
    - '  roots.set(el, root)'
    - '  root.render('
    - '    <StrictMode>'
    - '      <EnderecoApp ctx={ctx} />'
    - '    </StrictMode>,'
    - '  )'
    - '}'
    - ''
    - 'export function unmount(el: HTMLElement): void {'
    - '  roots.get(el)?.unmount()'
    - '  roots.delete(el)'
    - '}'
    anotacoes:
    - linha: 6
      texto: Guarda a raiz React de cada elemento, para que o `unmount` encontre a raiz certa.
    - linha: 9
      texto: O microfrontend cria a própria raiz React, separada da árvore do shell.
    - linha: 19
      texto: Desmonta a árvore e libera o elemento.
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/loadMfeModule.ts
    commit: '2179313'
    linhas:
    - 'export function assertMfeModule(mod: unknown, url: string): MfeModule {'
    - '  const m = mod as Partial<MfeModule>'
    - '  if (typeof m?.mount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta mount()`)'
    - '  if (typeof m?.unmount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta unmount()`)'
    - '  return m as MfeModule'
    - '}'
    - ''
    - 'function toBase64(bytes: Uint8Array): string {'
    - '  let binary = '''''
    - '  for (const byte of bytes) binary += String.fromCharCode(byte)'
    - '  return btoa(binary)'
    - '}'
    - ''
    - 'export async function verifyBundleIntegrity(bytes: ArrayBuffer, integrity: string): Promise<void> {'
    - '  const digest = await crypto.subtle.digest(''SHA-256'', bytes)'
    - '  const actual = `sha256-${toBase64(new Uint8Array(digest))}`'
    - '  if (actual !== integrity) throw new Error(''[mfe] integridade do bundle inválida'')'
    - '}'
    - ''
    - 'export async function loadMfeModule(url: string, integrity: string, id?: string): Promise<MfeModule> {'
    - '  if (id) markStart(id, ''fetchEval'')'
    - '  const response = await fetch(url, { credentials: ''omit'', cache: ''no-store'' })'
    - '  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)'
    - '  const bytes = await response.arrayBuffer()'
    - '  await verifyBundleIntegrity(bytes, integrity)'
    - '  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: ''text/javascript'' }))'
    - '  let mod: unknown'
    - '  try {'
    - '    mod = await import(/* @vite-ignore */ blobUrl)'
    - '  } finally {'
    - '    URL.revokeObjectURL(blobUrl)'
    - '  }'
    - '  if (id) markEnd(id, ''fetchEval'')'
    - ''
    - '  if (id) markStart(id, ''validate'')'
    - '  const result = assertMfeModule(mod, url)'
    - '  if (id) markEnd(id, ''validate'')'
    - ''
    - '  return result'
    - '}'
    anotacoes:
    - linha: 7
      texto: 'Validação do contrato: um módulo sem `mount` ou sem `unmount` é recusado.'
    - linha: 20
      texto: O hash SHA-256 dos bytes baixados precisa ser igual ao campo `integrity` do manifesto.
    - linha: 25
      texto: O shell baixa os bytes do bundle sem cookies e sem cache.
    - linha: 29
      texto: Os bytes já conferidos viram um Blob, e é esse Blob que o shell importa.
    - linha: 39
      texto: A validação do contrato acontece depois da importação e antes de qualquer `mount`.
    inicio: 4
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/MfeHost.tsx
    commit: '2179313'
    linhas:
    - '    loadMfeModule(entry.url, entry.integrity, entry.id)'
    - '      .then((m) => {'
    - '        if (cancelled) return'
    - '        mod = m'
    - '        markStart(entry.id, ''mount'')'
    - '        m.mount(el, {'
    - '          apiUrl: getApiUrl(),'
    - '          token,'
    - '          basePath: entry.route,'
    - '          onUnauthorized: () => dispatch(logout()),'
    - '        })'
    anotacoes:
    - linha: 25
      texto: O bundle só é baixado quando a rota do microfrontend é renderizada.
    - linha: 30
      texto: O shell entrega a `div` e o contexto definido pelo contrato.
    inicio: 25
  - tipo: faixa
    estilo: dica
    texto: A ADR-009 descreve que o shell faz `import(url)` do bundle. O código do commit `2179313` baixa os bytes, confere o SHA-256 e importa um Blob, o que corresponde à descrição da ADR-008 e permite recusar o bundle antes de executá-lo.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Percorra as etapas do carregamento de um microfrontend e acompanhe na linha do tempo o ciclo de vida do contrato, com e sem uma falha no bundle. Depois, classifique as responsabilidades entre o shell e o microfrontend.
  - tipo: fluxo
    titulo: Do manifesto ao mount
    etapas:
    - titulo: Download
      descricao: O `MfeHost` chama `loadMfeModule` com a URL e o `integrity` da entrada do manifesto.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - '  const response = await fetch(url, { credentials: ''omit'', cache: ''no-store'' })'
        - '  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)'
        - '  const bytes = await response.arrayBuffer()'
        destaque:
        - 1
        - 2
    - titulo: Hash
      descricao: O SHA-256 dos bytes é comparado com o manifesto, e a diferença interrompe a carga antes de executar o código.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - 'export async function verifyBundleIntegrity(bytes: ArrayBuffer, integrity: string): Promise<void> {'
        - '  const digest = await crypto.subtle.digest(''SHA-256'', bytes)'
        - '  const actual = `sha256-${toBase64(new Uint8Array(digest))}`'
        - '  if (actual !== integrity) throw new Error(''[mfe] integridade do bundle inválida'')'
        - '}'
        destaque:
        - 4
    - titulo: Importação
      descricao: Os bytes conferidos viram um Blob, importado como módulo ESM.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - '  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: ''text/javascript'' }))'
        - '  let mod: unknown'
        - '  try {'
        - '    mod = await import(/* @vite-ignore */ blobUrl)'
        - '  } finally {'
        - '    URL.revokeObjectURL(blobUrl)'
        - '  }'
        destaque:
        - 1
        - 4
    - titulo: Contrato
      descricao: O módulo precisa exportar `mount` e `unmount` como funções.
      codigo:
        arquivo: src/app/mfe/loadMfeModule.ts
        commit: '2179313'
        linhas:
        - 'export function assertMfeModule(mod: unknown, url: string): MfeModule {'
        - '  const m = mod as Partial<MfeModule>'
        - '  if (typeof m?.mount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta mount()`)'
        - '  if (typeof m?.unmount !== ''function'') throw new Error(`[mfe] bundle ${url} não exporta unmount()`)'
        - '  return m as MfeModule'
        - '}'
        destaque:
        - 3
        - 4
    - titulo: Montagem
      descricao: O `MfeHost` chama `mount` com a `div` e o contexto, e chama `unmount` quando a rota sai da tela ou o token muda.
  - tipo: linha-do-tempo
    titulo: Ciclo de vida de um microfrontend
    atores:
    - id: host
      rotulo: MfeHost
    - id: loader
      rotulo: loadMfeModule
    - id: s3
      rotulo: Bucket do microfrontend
    - id: mfe
      rotulo: Bundle do microfrontend
    eventos:
    - id: e1
      de: host
      para: loader
      mensagem: '`loadMfeModule(url, integrity)`'
    - id: e2
      de: loader
      para: s3
      mensagem: '`fetch(url)` dos bytes do bundle'
      depende: e1
    - id: e3
      de: s3
      para: loader
      mensagem: bytes, conferidos com o SHA-256 do manifesto
      depende: e2
    - id: e4
      de: loader
      para: host
      mensagem: '`{ mount, unmount }` validados'
      depende: e3
    - id: e5
      de: host
      para: mfe
      mensagem: '`mount(div, ctx)`'
      depende: e4
    - id: e6
      de: host
      para: mfe
      mensagem: '`unmount(div)` ao sair da rota'
      depende: e5
    falhas:
    - id: bucket-fora
      rotulo: O bucket não responde, como depois de reiniciar o LocalStack
      ator: s3
  - tipo: classificador
    enunciado: Quem é responsável por cada tarefa no contrato da ADR-009?
    categorias:
    - id: shell
      rotulo: Shell
    - id: mfe
      rotulo: Microfrontend
    itens:
    - texto: Conferir o hash SHA-256 do bundle
      categoria: shell
      explicacao: O `verifyBundleIntegrity` roda no carregador do shell, antes da importação.
    - texto: Criar a raiz React que renderiza a tela
      categoria: mfe
      explicacao: O `mount` do microfrontend chama `createRoot` com o próprio React embutido.
    - texto: Entregar `apiUrl`, `token` e `basePath`
      categoria: shell
      explicacao: O `MfeHost` monta o contexto a partir da configuração e do store.
    - texto: Remover os ouvintes de eventos ao sair da rota
      categoria: mfe
      explicacao: A ADR-009 atribui ao `unmount` a remoção da árvore e dos ouvintes.
    - texto: Recusar um módulo sem `unmount`
      categoria: shell
      explicacao: O `assertMfeModule` lança o erro que o error boundary transforma em aviso.
    - texto: Encerrar a sessão quando a API responde 401
      categoria: shell
      explicacao: O microfrontend só chama `onUnauthorized`, e o shell despacha o `logout`.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no repositório clonado na ODA 00. O microfrontend mínimo é um único arquivo JavaScript, sem React e sem build, testado pelas funções de validação do carregador do shell. Os passos 8 e 9 provocam as duas falhas que o carregador detecta.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe
      sucesso: '`Test Files 8 passed (8)` e `Tests 31 passed (31)`.'
    - titulo: Escrever o teste do microfrontend mínimo
      texto: Crie o arquivo abaixo. O `import.meta.glob` do Vite carrega o módulo e lê o texto dos arquivos de `mfes/minimo/` sem depender de APIs do Node.
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/__tests__/mfeMinimo.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect } from 'vitest'
        - import { assertMfeModule, verifyBundleIntegrity } from '../loadMfeModule'
        - ''
        - const PASTA = '../../../../mfes/minimo'
        - const modulos = import.meta.glob('../../../../mfes/minimo/index.js')
        - 'const textos = import.meta.glob<string>(''../../../../mfes/minimo/*'', { query: ''?raw'', import: ''default'', eager: true })'
        - 'const ctx = { apiUrl: '''', token: ''token-de-teste'', onUnauthorized: () => {}, basePath: ''/minimo'' }'
        - ''
        - async function carregar() {
        - '  const importar = modulos[`${PASTA}/index.js`]'
        - '  if (!importar) throw new Error(`[teste] ${PASTA}/index.js não encontrado`)'
        - '  return assertMfeModule(await importar(), `${PASTA}/index.js`)'
        - '}'
        - ''
        - describe('microfrontend mínimo', () => {
        - '  it(''exporta mount e unmount'', async () => {'
        - '    await expect(carregar()).resolves.toBeDefined()'
        - '  })'
        - ''
        - '  it(''mount renderiza dentro do elemento recebido, com o basePath do contexto'', async () => {'
        - '    const mfe = await carregar()'
        - '    const el = document.createElement(''div'')'
        - '    mfe.mount(el, ctx)'
        - '    expect(el.textContent).toContain(''/minimo'')'
        - '  })'
        - ''
        - '  it(''unmount esvazia o elemento'', async () => {'
        - '    const mfe = await carregar()'
        - '    const el = document.createElement(''div'')'
        - '    mfe.mount(el, ctx)'
        - '    mfe.unmount(el)'
        - '    expect(el.childElementCount).toBe(0)'
        - '  })'
        - ''
        - '  it(''o hash SHA-256 do arquivo confere com o valor de integrity.txt'', async () => {'
        - '    const conteudo = textos[`${PASTA}/index.js`]'
        - '    const integridade = textos[`${PASTA}/integrity.txt`]'
        - '    expect(conteudo).toBeDefined()'
        - '    expect(integridade).toBeDefined()'
        - '    await expect(verifyBundleIntegrity(new TextEncoder().encode(conteudo).buffer, integridade!.trim())).resolves.toBeUndefined()'
        - '  })'
        - '})'
      efeito: teste_minimo
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/mfeMinimo.test.ts
      sucesso: '`Tests 4 failed (4)`, com `[teste] ../../../../mfes/minimo/index.js não encontrado`.'
    - titulo: Criar o microfrontend mínimo
      texto: Crie a pasta `mfes/minimo/` e o arquivo abaixo, que cumpre o contrato com a API do DOM.
      editor:
        rotulo: arquivo
        caminho: mfes/minimo/index.js (novo)
        commit: '2179313'
        linhas:
        - '// Microfrontend mínimo: cumpre o contrato mount/unmount da ADR-009 sem framework.'
        - const limpezas = new WeakMap()
        - ''
        - export function mount(el, ctx) {
        - '  const secao = document.createElement(''section'')'
        - '  const titulo = document.createElement(''h2'')'
        - '  titulo.textContent = ''Microfrontend mínimo'''
        - '  const rota = document.createElement(''p'')'
        - '  rota.textContent = `Rota: ${ctx.basePath}`'
        - '  const botao = document.createElement(''button'')'
        - '  botao.type = ''button'''
        - '  botao.textContent = ''Sinalizar sessão expirada'''
        - '  const aoClicar = () => ctx.onUnauthorized()'
        - '  botao.addEventListener(''click'', aoClicar)'
        - '  secao.append(titulo, rota, botao)'
        - '  el.replaceChildren(secao)'
        - '  limpezas.set(el, () => botao.removeEventListener(''click'', aoClicar))'
        - '}'
        - ''
        - export function unmount(el) {
        - '  limpezas.get(el)?.()'
        - '  limpezas.delete(el)'
        - '  el.replaceChildren()'
        - '}'
      efeito: modulo
    - titulo: Rodar o teste sem o hash publicado
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/mfeMinimo.test.ts
      sucesso: '`Tests 1 failed | 3 passed (4)`: o contrato está cumprido, e falta o `integrity.txt`.'
    - titulo: Gerar o hash do arquivo
      texto: O comando grava em `mfes/minimo/integrity.txt` o valor no formato do campo `integrity` do manifesto.
      editor:
        rotulo: terminal
        linhas:
        - printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/minimo/index.js | openssl base64 -A)" | tee mfes/minimo/integrity.txt
      efeito: integridade
      sucesso: '`sha256-0gkcEL1G2JvJqf1d5Eiu017gUNftn9rgI9A35CytriM=`, se o arquivo for idêntico ao do passo 4.'
    - titulo: Ver o teste passar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/mfeMinimo.test.ts
      sucesso: '`Tests 4 passed (4)`.'
    - titulo: Quebrar o contrato
      texto: Em `mfes/minimo/index.js`, renomeie `unmount` para `desmontar` e rode o teste. Depois de ver a falha, restaure o nome e desmarque este passo.
      editor:
        rotulo: arquivo
        caminho: mfes/minimo/index.js (alteração temporária)

- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: 'Esta aba simula, sem executar nada, a ordenação de Kahn que o shell aplica ao manifesto: os microfrontends sem dependência pendente entram primeiro, e um ciclo impede a ordenação. Acompanhe a ordenação do manifesto do laboratório e depois classifique alterações de manifesto pelo efeito que causam no boot.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Ordenação topológica e algoritmo de Kahn
      definicao: Ordenação topológica é uma ordem em que cada item aparece depois de todos os itens de que depende. O algoritmo de Kahn a calcula pondo numa fila os itens sem dependência pendente e liberando os dependentes à medida que a fila esvazia.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Grau de entrada
      definicao: Número de dependências ainda pendentes de um item durante o algoritmo de Kahn. Um item entra na fila quando esse número chega a zero.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
  - tipo: fluxo
    titulo: Kahn sobre o manifesto com minimo, endereco e emprestimo, nessa ordem no arquivo
    etapas:
    - titulo: Graus de entrada
      descricao: Os graus de entrada são 1 para `minimo`, que depende de `endereco`, 0 para `endereco`, que não tem dependências, e 1 para `emprestimo`, que também depende de `endereco`.
    - titulo: Fila inicial
      descricao: Só `endereco` tem grau 0, e a fila começa com ele, mesmo estando em segundo lugar no arquivo.
    - titulo: Saída de endereco
      descricao: '`endereco` vai para a ordem, e os dependentes `minimo` e `emprestimo` chegam a grau 0 e entram na fila, na ordem em que aparecem no arquivo.'
    - titulo: Ordem final
      descricao: '`endereco`, `minimo` e `emprestimo`, que é a ordem do menu depois de Início, conferida pelo teste do laboratório e pelo navegador.'
    - titulo: Ciclo
      descricao: Se `endereco` passar a depender de `minimo`, nenhum dos três começa com grau 0, a fila nasce vazia e o erro lista os três.
  - tipo: classificador
    enunciado: Qual é o efeito de cada alteração no manifesto do laboratório?
    categorias:
    - id: boot
      rotulo: O boot falha
    - id: menu
      rotulo: O menu muda
    - id: nada
      rotulo: Nada muda no boot
    itens:
    - texto: '`endereco` passa a depender de `minimo`'
      categoria: boot
      explicacao: Forma um ciclo, e o `resolveLoadOrder` interrompe o boot.
    - texto: A URL do `minimo` passa para a porta 9999
      categoria: boot
      explicacao: A origem `http://localhost:9999` não está em `mfeAllowedOrigins`.
    - texto: O estado do `minimo` passa a `disabled`
      categoria: menu
      explicacao: Microfrontends `disabled` saem do menu e das rotas.
    - texto: '`minimo` deixa de depender de `endereco`'
      categoria: menu
      explicacao: Com grau 0, `minimo` entra primeiro na fila, por estar antes no arquivo, e passa à frente de `endereco` no menu.
    - texto: O `integrity` do `minimo` recebe outro hash com formato válido
      categoria: nada
      explicacao: O formato é conferido no boot, e o hash só é comparado quando o bundle é baixado, o que não acontece em manutenção.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é acrescentar uma entrada ao manifesto, provar com teste que ela é aceita e ver no navegador o efeito da ordem e das validações, porque uma entrada nova muda o menu de todo o portal e, se estiver errada, impede o boot. Os passos 1 a 6 registram um microfrontend mínimo em manutenção com o teste escrito antes, e os passos 7 a 9 conferem no navegador o menu, o aviso de manutenção e as falhas de boot. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: Teste escrito antes (TDD)
      definicao: Prática em que o teste do comportamento novo é escrito e rodado antes da implementação, para confirmar que ele falha pela razão esperada. Depois, a implementação mínima faz o teste passar.
      referencia:
        rotulo: martinfowler.com · Test Driven Development
        url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: '`config.json`'
      definicao: Arquivo de configuração de ambiente que o shell baixa no boot, com dados como a URL da API e a lista `mfeAllowedOrigins`. Ele muda a cada ambiente de deploy, e o manifesto muda quando um microfrontend entra ou sai.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: '`dependsOn`'
      definicao: Lista, em cada entrada do manifesto, dos `id` de microfrontends de que aquela entrada depende. O shell usa essa lista para ordenar as entradas e recusa dependências inexistentes e ciclos.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
  - tipo: faixa
    estilo: objetivo
    problema: O `public/mfe-manifest.json` é validado no boot por `validateManifest`, e qualquer erro, como um `dependsOn` que fecha um ciclo ou uma URL fora de `mfeAllowedOrigins`, interrompe a inicialização com `Falha ao iniciar o portal`. A ADR-010 fala em ordem de carga, e no commit `2179313` a ordem calculada define apenas as rotas e o menu.
    impacto: Uma entrada mal escrita impede o portal de iniciar para todos os usuários, inclusive nos microfrontends que não mudaram. Quem espera que o `dependsOn` baixe a dependência antes descobre que cada bundle só é baixado quando a rota dele abre.
    mecanismo: O laboratório aplica o teste escrito antes para validar o manifesto com as origens de `public/config.json`, como o shell faz no boot, registra o microfrontend mínimo no estado `maintenance`, que dispensa o bundle publicado, e usa a ordenação topológica de Kahn de `resolveLoadOrder` para prever a posição dele no menu.
    comprovacao: O teste falha com `expected undefined to be 'maintenance'` antes da entrada e passa depois, a suíte termina com `Tests 101 passed (101)`, o menu mostra Microfrontend Mínimo depois de Alteração de Endereço, e o ciclo e a porta 9999 produzem as duas mensagens de falha de boot.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe
      sucesso: '`Test Files 8 passed (8)` e `Tests 31 passed (31)`.'
    - titulo: Escrever o teste do manifesto publicado
      texto: Crie o arquivo abaixo. Ele valida o `public/mfe-manifest.json` com as origens do `public/config.json`, como o shell faz no boot, e confere o estado e a ordem do microfrontend mínimo.
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/__tests__/manifestoPublicado.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect } from 'vitest'
        - import manifestoPublicado from '../../../../public/mfe-manifest.json'
        - import config from '../../../../public/config.json'
        - import { validateManifest } from '../manifest'
        - import { resolveLoadOrder } from '../dependencyResolver'
        - ''
        - describe('manifesto publicado em public/', () => {
        - '  const manifesto = validateManifest(manifestoPublicado, { allowedOrigins: config.mfeAllowedOrigins, allowInsecureLocalhost: true })'
        - ''
        - '  it(''registra o microfrontend mínimo em manutenção'', () => {'
        - '    expect(manifesto.mfes.find((m) => m.id === ''minimo'')?.state).toBe(''maintenance'')'
        - '  })'
        - ''
        - '  it(''ordena o mínimo depois do endereço, do qual ele depende'', () => {'
        - '    expect(resolveLoadOrder(manifesto.mfes).map((m) => m.id)).toEqual([''endereco'', ''minimo'', ''emprestimo''])'
        - '  })'
        - '})'
      efeito: teste_manifesto
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/manifestoPublicado.test.ts
      sucesso: '`Tests 2 failed (2)`, com `expected undefined to be ''maintenance''` e a ordem sem `minimo`.'
    - titulo: Registrar o microfrontend mínimo
      texto: Em `public/mfe-manifest.json`, acrescente a entrada abaixo no início da lista `mfes`. Qualquer hash com formato válido serve, porque em manutenção o shell não baixa o bundle, e a URL usa a origem permitida do LocalStack.
      editor:
        rotulo: arquivo
        caminho: public/mfe-manifest.json (alteração)
        commit: '2179313'
        linhas:
        - '    {'
        - '      "id": "minimo",'
        - '      "name": "Microfrontend Mínimo",'
        - '      "state": "maintenance",'
        - '      "url": "http://localhost:4566/mfe-minimo/index.js",'
        - '      "integrity": "sha256-0gkcEL1G2JvJqf1d5Eiu017gUNftn9rgI9A35CytriM=",'
        - '      "route": "/minimo",'
        - '      "dependsOn": ["endereco"]'
        - '    },'
      efeito: entrada_minimo
    - titulo: Ver o teste passar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/manifestoPublicado.test.ts
      sucesso: '`Tests 2 passed (2)`.'
    - titulo: Conferir tipos, fronteiras e a suíte
      editor:
        rotulo: terminal
        linhas:
        - npx tsc --noEmit -p tsconfig.app.json && npm run lint
        - npx vitest run
      sucesso: Tipos e lint sem erros, e `Test Files 24 passed (24)` com `Tests 101 passed (101)`.
    - titulo: Conferir o menu e o aviso de manutenção
      texto: Rode `npm run dev`, entre com `usuario@teste.com` e `senha123` e clique em Microfrontend Mínimo.
      sucesso: O menu Início, Alteração de Endereço, Microfrontend Mínimo, Simulação de Empréstimo, nessa ordem, e a mensagem `O módulo Microfrontend Mínimo está em manutenção.`.
    - titulo: Provocar um ciclo
      texto: Mude o `dependsOn` de `endereco` para `["minimo"]` e recarregue a página. Depois de ver o erro, restaure `[]`.
      sucesso: 'A página mostra `Falha ao iniciar o portal: Error: [mfe-manifest] ciclo de dependência detectado entre: minimo, endereco, emprestimo`.'
    - titulo: Usar uma origem não permitida
      texto: Troque a porta da URL do `minimo` de 4566 para 9999 e recarregue a página. Depois de ver o erro, restaure a porta 4566.
      sucesso: 'A página mostra `Falha ao iniciar o portal: Error: [mfe-manifest] mfes[0].url usa origem não permitida`.'

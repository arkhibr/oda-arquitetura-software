- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que um time encontraria ao editar o manifesto. As duas primeiras mostram mensagens reais de boot, exibidas pelo navegador com o manifesto alterado, e as duas últimas tratam do que o manifesto controla e do que ele não controla.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: '`dependsOn`'
      definicao: Lista, em cada entrada do manifesto, dos `id` de microfrontends de que aquela entrada depende. O shell usa essa lista para ordenar as entradas e recusa dependências inexistentes e ciclos.
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: Grau de entrada
      definicao: Número de dependências ainda pendentes de um item durante o algoritmo de Kahn. Um item entra na fila quando esse número chega a zero.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: '`config.json`'
      definicao: Arquivo de configuração de ambiente que o shell baixa no boot, com dados como a URL da API e a lista `mfeAllowedOrigins`. Ele muda a cada ambiente de deploy, e o manifesto muda quando um microfrontend entra ou sai.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Ordenação topológica e algoritmo de Kahn
      definicao: Ordenação topológica é uma ordem em que cada item aparece depois de todos os itens de que depende. O algoritmo de Kahn a calcula pondo numa fila os itens sem dependência pendente e liberando os dependentes à medida que a fila esvazia.
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
  - tipo: incidente
    titulo: Portal que não inicia depois de uma dependência nova
    origem: executado
    rotulo_saida: log
    saida: 'Falha ao iniciar o portal:

      Error: [mfe-manifest] ciclo de dependência detectado entre: minimo, endereco, emprestimo'
    pergunta: 'A equipe do endereço declarou `dependsOn: ["minimo"]`. Por que o erro lista também `emprestimo`?'
    correcao: Remover a dependência que fecha o ciclo e revisar mudanças de `dependsOn` na esteira, antes de publicar o manifesto.
    alternativas:
    - texto: O algoritmo lista todos os microfrontends quando encontra qualquer erro.
      correta: false
      explicacao: A lista é calculada pelos que não entraram na ordem, e um microfrontend sem relação com o ciclo entraria.
    - texto: O `emprestimo` depende de `endereco`, que está no ciclo, e por isso também nunca chega a grau 0.
      correta: true
      explicacao: O erro lista todos os que sobraram fora da ordem, inclusive os que apenas dependem de um microfrontend do ciclo.
    - texto: O `emprestimo` também depende de `minimo`.
      correta: false
      explicacao: O `emprestimo` só declara `endereco` no `dependsOn`.
  - tipo: incidente
    titulo: Bundle numa origem fora da lista
    origem: executado
    rotulo_saida: log
    saida: 'Falha ao iniciar o portal:

      Error: [mfe-manifest] mfes[0].url usa origem não permitida'
    pergunta: O boot falha sem que o navegador faça qualquer requisição à URL do bundle. Por quê?
    correcao: Publicar o bundle numa origem listada em `mfeAllowedOrigins`, ou incluir a origem nova no `config.json` do ambiente depois de avaliá-la.
    alternativas:
    - texto: O bundle respondeu com erro HTTP.
      correta: false
      explicacao: A validação do manifesto não faz requisição ao bundle.
    - texto: O hash do bundle não confere.
      correta: false
      explicacao: O hash só é conferido ao baixar o bundle, depois do boot.
    - texto: A origem `http://localhost:9999` não está em `mfeAllowedOrigins`, e a validação recusa a entrada sem fazer requisição.
      correta: true
      explicacao: A conferência de origem fica em `manifest.ts:26`, e o shell nem chega a contatar a URL.
  - tipo: incidente
    titulo: Microfrontend em manutenção com hash errado
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/app/mfe/MfeHost.tsx:63-70\nexport function MfeHost({ entry }: { entry: MfeEntry }) {\n  if (entry.state === 'maintenance') {\n    return (\n      <div role=\"status\" className=\"rounded border border-secondary/30 bg-surface p-6 text-secondary\">\n        O módulo <strong>{entry.name}</strong> está em manutenção.\n      </div>\n    )\n  }"
    pergunta: O `minimo` está em `maintenance` e tem um hash que não corresponde a nenhum arquivo. Algum erro aparece?
    correcao: Conferir o hash no deploy, antes de mudar o estado para `active`, porque só a carga do bundle compara os bytes.
    alternativas:
    - texto: Não, porque em manutenção o `MfeHost` mostra o aviso e não chama o carregador que compara o hash.
      correta: true
      explicacao: O boot só confere o formato do `integrity`, e a comparação dos bytes acontece em `loadMfeModule`.
    - texto: Sim, o boot falha com `integrity inválido`.
      correta: false
      explicacao: Essa mensagem só aparece quando o formato do campo está errado.
    - texto: Sim, o menu esconde o microfrontend.
      correta: false
      explicacao: Microfrontends em manutenção aparecem no menu.
  - tipo: incidente
    titulo: Dependência declarada e não carregada
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/app/router/index.tsx:22-24\n  const mfeRoutes = mfes\n    .filter((m) => m.state !== 'disabled')\n    .map((m) => ({ path: m.route, element: <MfeHost entry={m} /> }))\n\nsrc/app/mfe/MfeHost.tsx:25\n    loadMfeModule(entry.url, entry.integrity, entry.id)"
    pergunta: O `emprestimo` declara dependência de `endereco`. Ao abrir `/emprestimos` direto, o shell baixa o bundle do endereço?
    correcao: Tratar o `dependsOn` como ordem de registro e validação de referências. Se a pré-carga for necessária, implementá-la e registrar a mudança na ADR-010.
    alternativas:
    - texto: Sim, porque os dois compartilham o mesmo React.
      correta: false
      explicacao: Cada microfrontend embute o próprio React no bundle.
    - texto: Não, cada rota tem um `MfeHost` que baixa apenas o bundle da própria entrada.
      correta: true
      explicacao: O `dependsOn` define a ordem das rotas e do menu e é validado no boot, sem disparar downloads.
    - texto: Sim, o shell carrega as dependências antes, na ordem de Kahn.
      correta: false
      explicacao: O único chamador de `loadMfeModule` é o `MfeHost` da rota aberta.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: '`config.json`'
      definicao: Arquivo de configuração de ambiente que o shell baixa no boot, com dados como a URL da API e a lista `mfeAllowedOrigins`. Ele muda a cada ambiente de deploy, e o manifesto muda quando um microfrontend entra ou sai.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Grau de entrada
      definicao: Número de dependências ainda pendentes de um item durante o algoritmo de Kahn. Um item entra na fila quando esse número chega a zero.
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
  - tipo: quiz
    perguntas:
    - enunciado: Por que a lista de microfrontends fica no manifesto, separada do `config.json`?
      alternativas:
      - texto: Porque o `config.json` não aceita listas.
        correta: false
        explicacao: O `config.json` já tem a lista `mfeAllowedOrigins`.
      - texto: Porque o manifesto precisa ficar no S3.
        correta: false
        explicacao: No commit, o manifesto é servido de `public/` pelo próprio shell.
      - texto: Porque configuração de ambiente e catálogo de microfrontends mudam por motivos e em ritmos diferentes.
        correta: true
        explicacao: O `config.json` muda por deploy, e o catálogo muda com a evolução do produto.
    - enunciado: Qual é a ordem calculada para `a` sem dependências, `b` dependente de `a` e `c` dependente de `b`, declarados como `c`, `b`, `a`?
      alternativas:
      - texto: '`a`, `b`, `c`.'
        correta: true
        explicacao: Só `a` começa com grau 0, e cada saída libera o próximo da cadeia, como no teste `resolve cadeia transitiva`.
      - texto: '`c`, `b`, `a`.'
        correta: false
        explicacao: Essa é a ordem do arquivo, que só desempata quem tem grau 0 ao mesmo tempo.
      - texto: O algoritmo lança erro de ciclo.
        correta: false
        explicacao: Uma cadeia sem retorno não forma ciclo.
    - enunciado: O que acontece com um microfrontend em `disabled`?
      alternativas:
      - texto: Faz o boot falhar.
        correta: false
        explicacao: '`disabled` é um estado válido.'
      - texto: Fica fora do menu e das rotas.
        correta: true
        explicacao: O roteador e o `ShellLayout` filtram as entradas `disabled`.
      - texto: Aparece no menu com aviso.
        correta: false
        explicacao: Esse é o comportamento de `maintenance`.
    - enunciado: Quando o shell confere a origem da URL de um bundle?
      alternativas:
      - texto: Só quando a rota é aberta.
        correta: false
        explicacao: Na rota, o shell confere o hash dos bytes.
      - texto: No deploy.
        correta: false
        explicacao: O deploy grava o manifesto, e quem valida a origem é o shell.
      - texto: No boot, ao validar o manifesto, para todas as entradas.
        correta: true
        explicacao: A validação percorre todas as entradas antes de criar o roteador.
    - enunciado: No laboratório, por que foi possível testar o registro sem publicar o bundle?
      alternativas:
      - texto: Porque em `maintenance` o shell não baixa o bundle e só valida o formato da entrada.
        correta: true
        explicacao: O aviso de manutenção aparece sem chamar o carregador.
      - texto: Porque o MSW simula o bucket.
        correta: false
        explicacao: O MSW intercepta chamadas de API, e não há handler para bundles.
      - texto: Porque o Vite serve a pasta `mfes/`.
        correta: false
        explicacao: A URL do manifesto aponta para a porta 4566 do LocalStack.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A separação entre manifesto e `config.json` está clara.
    - As validações de boot e a mensagem de erro de cada uma estão claras.
    - O teste do manifesto falhou antes da entrada e passou depois.
    - O menu mostrou o microfrontend mínimo depois do endereço, com o aviso de manutenção.
    - O ciclo e a origem não permitida impediram o boot, e o manifesto foi restaurado.

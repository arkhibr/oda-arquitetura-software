- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os dois primeiros incidentes mostram mensagens reais de boot, exibidas pelo navegador com o manifesto alterado. Os dois últimos tratam do que o manifesto controla e do que ele não controla.
  - tipo: incidente
    titulo: Portal que não inicia depois de uma dependência nova
    origem: executado
    rotulo_saida: log
    saida: 'Falha ao iniciar o portal:

      Error: [mfe-manifest] ciclo de dependência detectado entre: minimo, endereco, emprestimo'
    pergunta: 'A equipe do endereço declarou `dependsOn: ["minimo"]`. Por que o erro lista também `emprestimo`?'
    correcao: Remover a dependência que fecha o ciclo e revisar mudanças de `dependsOn` na esteira, antes de publicar o manifesto.
    alternativas:
    - texto: O algoritmo lista todos os microfrontends quando encontra qualquer erro.
      correta: false
      explicacao: A lista é calculada pelos que não entraram na ordem, e um microfrontend sem relação com o ciclo entraria.
    - texto: O `emprestimo` depende de `endereco`, que está no ciclo, e por isso também nunca chega a grau 0.
      correta: true
      explicacao: O erro lista todos os que sobraram fora da ordem, e não só os que formam o ciclo.
    - texto: O `emprestimo` também depende de `minimo`.
      correta: false
      explicacao: O `emprestimo` só declara `endereco` no `dependsOn`.
  - tipo: incidente
    titulo: Bundle numa origem fora da lista
    origem: executado
    rotulo_saida: log
    saida: 'Falha ao iniciar o portal:

      Error: [mfe-manifest] mfes[0].url usa origem não permitida'
    pergunta: O boot falha sem que o navegador faça qualquer requisição à URL do bundle. Por quê?
    correcao: Publicar o bundle numa origem listada em `mfeAllowedOrigins`, ou incluir a origem nova no `config.json` do ambiente depois de avaliá-la.
    alternativas:
    - texto: O bundle respondeu com erro HTTP.
      correta: false
      explicacao: A validação do manifesto não faz requisição ao bundle.
    - texto: O hash do bundle não confere.
      correta: false
      explicacao: O hash só é conferido ao baixar o bundle, depois do boot.
    - texto: A origem `http://localhost:9999` não está em `mfeAllowedOrigins`, e a validação recusa a entrada sem fazer requisição.
      correta: true
      explicacao: A conferência de origem fica em `manifest.ts:26`, e o shell nem chega a contatar a URL.
  - tipo: incidente
    titulo: Microfrontend em manutenção com hash errado
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/app/mfe/MfeHost.tsx:63-70\nexport function MfeHost({ entry }: { entry: MfeEntry }) {\n  if (entry.state === 'maintenance') {\n    return (\n      <div role=\"status\" className=\"rounded border border-secondary/30 bg-surface p-6 text-secondary\">\n        O módulo <strong>{entry.name}</strong> está em manutenção.\n      </div>\n    )\n  }"
    pergunta: O `minimo` está em `maintenance` e tem um hash que não corresponde a nenhum arquivo. Algum erro aparece?
    correcao: Conferir o hash no deploy, antes de mudar o estado para `active`, porque só a carga do bundle compara os bytes.
    alternativas:
    - texto: Não, porque em manutenção o `MfeHost` mostra o aviso e não chama o carregador que compara o hash.
      correta: true
      explicacao: O boot só confere o formato do `integrity`, e a comparação dos bytes acontece em `loadMfeModule`.
    - texto: Sim, o boot falha com `integrity inválido`.
      correta: false
      explicacao: Essa mensagem só aparece quando o formato do campo está errado.
    - texto: Sim, o menu esconde o microfrontend.
      correta: false
      explicacao: Microfrontends em manutenção aparecem no menu.
  - tipo: incidente
    titulo: Dependência declarada e não carregada
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/app/router/index.tsx:22-24\n  const mfeRoutes = mfes\n    .filter((m) => m.state !== 'disabled')\n    .map((m) => ({ path: m.route, element: <MfeHost entry={m} /> }))\n\nsrc/app/mfe/MfeHost.tsx:25\n    loadMfeModule(entry.url, entry.integrity, entry.id)"
    pergunta: O `emprestimo` declara dependência de `endereco`. Ao abrir `/emprestimos` direto, o shell baixa o bundle do endereço?
    correcao: Tratar o `dependsOn` como ordem de registro e validação de referências, e não como pré-carga, ou implementar a pré-carga e registrar a mudança na ADR-010.
    alternativas:
    - texto: Sim, porque os dois compartilham o mesmo React.
      correta: false
      explicacao: Cada microfrontend embute o próprio React, conforme a ADR-009.
    - texto: Não, cada rota tem um `MfeHost` que baixa apenas o bundle da própria entrada.
      correta: true
      explicacao: O `dependsOn` define a ordem das rotas e do menu e é validado no boot, sem disparar downloads.
    - texto: Sim, o shell carrega as dependências antes, na ordem de Kahn.
      correta: false
      explicacao: O único chamador de `loadMfeModule` é o `MfeHost` da rota aberta.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que a ADR-010 não embutiu a lista de microfrontends no `config.json`?
      alternativas:
      - texto: Porque o `config.json` não aceita listas.
        correta: false
        explicacao: O `config.json` já tem a lista `mfeAllowedOrigins`.
      - texto: Porque o manifesto precisa ficar no S3.
        correta: false
        explicacao: No commit, o manifesto é servido de `public/` pelo próprio shell.
      - texto: Porque configuração de ambiente e catálogo de microfrontends mudam por motivos e em ritmos diferentes.
        correta: true
        explicacao: O `config.json` muda por deploy, e o catálogo muda com a evolução do produto.
    - enunciado: Qual é a ordem calculada para `a` sem dependências, `b` dependente de `a` e `c` dependente de `b`, declarados como `c`, `b`, `a`?
      alternativas:
      - texto: '`a`, `b`, `c`.'
        correta: true
        explicacao: Só `a` começa com grau 0, e cada saída libera o próximo da cadeia, como no teste `resolve cadeia transitiva`.
      - texto: '`c`, `b`, `a`.'
        correta: false
        explicacao: Essa é a ordem do arquivo, que só desempata quem tem grau 0 ao mesmo tempo.
      - texto: O algoritmo lança erro de ciclo.
        correta: false
        explicacao: Uma cadeia sem retorno não forma ciclo.
    - enunciado: O que acontece com um microfrontend em `disabled`?
      alternativas:
      - texto: Faz o boot falhar.
        correta: false
        explicacao: '`disabled` é um estado válido.'
      - texto: Fica fora do menu e das rotas.
        correta: true
        explicacao: O roteador e o `ShellLayout` filtram as entradas `disabled`.
      - texto: Aparece no menu com aviso.
        correta: false
        explicacao: Esse é o comportamento de `maintenance`.
    - enunciado: Quando o shell confere a origem da URL de um bundle?
      alternativas:
      - texto: Só quando a rota é aberta.
        correta: false
        explicacao: Na rota, o shell confere o hash dos bytes.
      - texto: No deploy.
        correta: false
        explicacao: O deploy grava o manifesto, e quem valida a origem é o shell.
      - texto: No boot, ao validar o manifesto, para todas as entradas.
        correta: true
        explicacao: A validação percorre todas as entradas antes de criar o roteador.
    - enunciado: No laboratório, por que foi possível testar o registro sem publicar o bundle?
      alternativas:
      - texto: Porque em `maintenance` o shell não baixa o bundle e só valida o formato da entrada.
        correta: true
        explicacao: O aviso de manutenção aparece sem chamar o carregador.
      - texto: Porque o MSW simula o bucket.
        correta: false
        explicacao: O MSW intercepta chamadas de API, e não há handler para bundles.
      - texto: Porque o Vite serve a pasta `mfes/`.
        correta: false
        explicacao: A URL do manifesto aponta para a porta 4566 do LocalStack.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A separação entre manifesto e `config.json` está clara.
    - As validações de boot e a mensagem de erro de cada uma estão claras.
    - O teste do manifesto falhou antes da entrada e passou depois.
    - O menu mostrou o microfrontend mínimo depois do endereço, com o aviso de manutenção.
    - O ciclo e a origem não permitida impediram o boot, e o manifesto foi restaurado.

id: '06'
titulo: Manifesto e resolução de dependências
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é registrar um microfrontend no manifesto do portal e prever em que ordem o shell vai carregá-lo, porque um erro no manifesto, como um ciclo de dependências ou uma origem não permitida, impede o portal inteiro de iniciar. O shell do `frontend-react` lê `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências, valida o arquivo no boot e ordena as entradas pelo algoritmo de Kahn. Você vai registrar um microfrontend em manutenção com o teste escrito antes e provocar no navegador as falhas de boot de um ciclo e de uma origem não permitida.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Ordenação topológica e algoritmo de Kahn
      definicao: Ordenação topológica é uma ordem em que cada item aparece depois de todos os itens de que depende. O algoritmo de Kahn a calcula pondo numa fila os itens sem dependência pendente e liberando os dependentes à medida que a fila esvazia.
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: Teste escrito antes (TDD)
      definicao: Prática em que o teste do comportamento novo é escrito e rodado antes da implementação, para confirmar que ele falha pela razão esperada. Depois, a implementação mínima faz o teste passar.
      referencia:
        rotulo: martinfowler.com · Test Driven Development
        url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: '`config.json`'
      definicao: Arquivo de configuração de ambiente que o shell baixa no boot, com dados como a URL da API e a lista `mfeAllowedOrigins`. Ele muda a cada ambiente de deploy, e o manifesto muda quando um microfrontend entra ou sai.
    - termo: '`dependsOn`'
      definicao: Lista, em cada entrada do manifesto, dos `id` de microfrontends de que aquela entrada depende. O shell usa essa lista para ordenar as entradas e recusa dependências inexistentes e ciclos.
    - termo: Node.js
      definicao: Ambiente que executa JavaScript fora do navegador. No repositório, ele roda o Vite, os testes, o script de deploy, o Gateway e os BFFs.
    - termo: npm
      definicao: Gerenciador de pacotes do Node.js, que instala as dependências listadas no `package.json` e executa os scripts declarados nele, como `npm run dev` e `npm run deploy`.
    - termo: Docker e Docker Compose
      definicao: O Docker executa aplicações em contêineres, que são ambientes isolados criados a partir de imagens. O Docker Compose sobe vários contêineres descritos num arquivo YAML, e o repositório usa `infra/docker-compose.yml` para o LocalStack, o Gateway e os BFFs.
      referencia:
        rotulo: Docker Docs · Docker Compose
        url: https://docs.docker.com/compose/
    - termo: WSL (Windows Subsystem for Linux) e Git Bash
      definicao: O WSL é um recurso do Windows que executa um ambiente Linux completo, e o Git Bash é o terminal bash que acompanha o Git para Windows. Os dois aceitam a sintaxe de comandos usada nos laboratórios.
      referencia:
        rotulo: Microsoft Learn · O que é o Subsistema do Windows para Linux
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: React
      definicao: Biblioteca JavaScript para construir interfaces a partir de componentes, que são funções que descrevem um trecho da tela a partir de dados. O shell e os microfrontends do repositório usam o React 19.
      referencia:
        rotulo: React · Início rápido
        url: https://react.dev/learn
    - termo: Gateway de API
      definicao: Serviço que funciona como ponto único de entrada do back-end, recebe as chamadas do portal, valida a autenticação e encaminha cada chamada ao serviço de destino. No repositório, ele fica em `gateway/` e responde na porta 4000.
      referencia:
        rotulo: Microsoft Learn · Gateways de API
        url: https://learn.microsoft.com/pt-br/azure/architecture/microservices/design/gateway
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface ou a um domínio, que adapta os dados de outros sistemas ao formato de que a tela precisa. Os BFFs do repositório ficam em `bffs/`, respondem nas portas 4001 e 4002 e só aceitam chamadas que passaram pelo Gateway.
      referencia:
        rotulo: Microsoft Learn · Padrão Backends for Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: detached HEAD
      definicao: Estado do Git em que a cópia de trabalho aponta para um commit específico, fora de qualquer branch. É o estado que o `git checkout` de um commit produz, e as alterações feitas nele não pertencem a nenhum branch até que um seja criado.
      referencia:
        rotulo: Git · git checkout
        url: https://git-scm.com/docs/git-checkout
    - termo: '`package-lock.json` e `npm ci`'
      definicao: O `package-lock.json` registra a versão exata de cada dependência instalada, e o `npm ci` instala exatamente essas versões e falha quando o arquivo não traz algum pacote exigido. Neste commit, isso acontece em Linux e no WSL, e o `npm install --no-save` instala as dependências sem alterar o arquivo.
      referencia:
        rotulo: npm Docs · npm ci
        url: https://docs.npmjs.com/cli/v10/commands/npm-ci
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Versão do esquema (`schemaVersion`)
      definicao: Número que identifica o formato do manifesto, conferido pelo shell no boot para garantir que ele sabe ler o arquivo.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Grau de entrada
      definicao: Número de dependências ainda pendentes de um item durante o algoritmo de Kahn. Um item entra na fila quando esse número chega a zero.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: Base64
      definicao: Codificação que representa bytes com 64 caracteres de texto, usada para escrever hashes e tokens em formato legível. O hash do campo `integrity` tem 43 caracteres em Base64 seguidos de `=`.
      referencia:
        rotulo: MDN · Base64
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Base64
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: LocalStack
      definicao: Emulador que reproduz serviços da AWS num contêiner Docker na máquina local, sem conta na nuvem. No repositório, ele responde na porta 4566, emula só o S3 e não guarda dados entre reinícios, porque o compose não ativa a persistência.
      referencia:
        rotulo: LocalStack · Documentação
        url: https://docs.localstack.cloud/getting-started/
    - termo: ESLint e lint
      definicao: O ESLint é a ferramenta que analisa o código sem executá-lo e acusa trechos que violam regras configuradas, e lint é o nome dessa análise. No repositório, `npm run lint` roda o ESLint sobre `src/` com a configuração de `eslint.config.ts`.
      referencia:
        rotulo: ESLint · Documentação
        url: https://eslint.org/docs/latest/
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica dentro de um bucket e é acessado por uma URL. No portal, o S3 guarda os bundles publicados dos microfrontends.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta, dentro do navegador, as requisições HTTP feitas pela aplicação e responde com dados simulados. Em `npm run dev`, o shell ativa os handlers de `src/mocks/`, e por isso o login funciona sem nenhum back-end no ar.
      referencia:
        rotulo: Mock Service Worker · Introdução
        url: https://mswjs.io/docs/
    - termo: Bucket
      definicao: Contêiner de objetos do S3, identificado por um nome único. O deploy do repositório usa um bucket por microfrontend, `mfe-endereco` e `mfe-emprestimo`.
    - termo: Vite
      definicao: Ferramenta de build e servidor de desenvolvimento do shell e dos microfrontends, que responde em `npm run dev` na porta 5173 e também executa os testes por meio do Vitest.
      referencia:
        rotulo: Vite · Build em modo biblioteca
        url: https://vite.dev/guide/build#library-mode
    - termo: Vitest
      definicao: Ferramenta de testes integrada ao Vite, que roda os testes do shell e dos microfrontends com `npm test` e oferece simulação de módulos e de relógio.
      referencia:
        rotulo: Vitest · Primeiros passos
        url: https://vitest.dev/guide/
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar por que a ADR-010 separa o manifesto do `config.json`.
    - Listar as validações que fazem o boot falhar antes de montar qualquer microfrontend.
    - Prever a ordem calculada pelo algoritmo de Kahn para um conjunto de `dependsOn`.
    - Registrar um microfrontend no manifesto com o teste escrito e rodado antes.
    - Distinguir a ordem do menu e das rotas do momento em que cada bundle é baixado.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O laboratório usa o navegador com `npm run dev` e não depende do Docker, porque o microfrontend mínimo é registrado em manutenção e o shell não baixa o bundle dele. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba explica as duas fontes que o shell lê no boot, a inicialização feita quando a página abre: o manifesto, catálogo dos microfrontends que muda quando um deles entra ou sai, e o `config.json`, configuração do ambiente que muda a cada deploy. Os conceitos abaixo explicam por que os dois ficam em arquivos separados, como o shell valida o manifesto e como ordena os microfrontends pelas dependências declaradas.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: Versão do esquema (`schemaVersion`)
      definicao: Número que identifica o formato do manifesto, conferido pelo shell no boot para garantir que ele sabe ler o arquivo.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: '`dependsOn`'
      definicao: Lista, em cada entrada do manifesto, dos `id` de microfrontends de que aquela entrada depende. O shell usa essa lista para ordenar as entradas e recusa dependências inexistentes e ciclos.
    - termo: Ordenação topológica e algoritmo de Kahn
      definicao: Ordenação topológica é uma ordem em que cada item aparece depois de todos os itens de que depende. O algoritmo de Kahn a calcula pondo numa fila os itens sem dependência pendente e liberando os dependentes à medida que a fila esvazia.
    - termo: Grau de entrada
      definicao: Número de dependências ainda pendentes de um item durante o algoritmo de Kahn. Um item entra na fila quando esse número chega a zero.
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
  - tipo: conceito
    titulo: Manifesto e config.json
    texto: O manifesto `public/mfe-manifest.json` é o catálogo dos microfrontends do portal, com a URL do bundle, o hash, a rota, o estado e as dependências de cada um, e o `public/config.json` é a configuração do ambiente, com a URL da API e a lista `mfeAllowedOrigins`, das origens de onde o shell aceita bundles. O shell lê os dois no boot, a inicialização feita em `src/main.tsx` quando a página abre. Eles ficam em arquivos separados porque o catálogo muda quando um microfrontend entra ou sai, e a configuração muda a cada ambiente de deploy.
  - tipo: conceito
    titulo: Estados de um microfrontend
    texto: 'Cada entrada do manifesto tem um estado: `active` carrega o bundle na rota, `maintenance` mostra um aviso de manutenção sem baixar o bundle, e `disabled` tira o microfrontend do menu e das rotas. O laboratório usa `maintenance` para registrar um microfrontend sem publicar o bundle dele.'
  - tipo: conceito
    titulo: Validação que falha cedo
    texto: No boot, `validateManifest` confere a versão do esquema, os campos obrigatórios, o formato do `integrity`, o protocolo e a origem da URL, a rota, o estado, o tipo de `dependsOn`, a unicidade dos `id` e a existência de cada dependência. Qualquer erro interrompe o boot com a mensagem `Falha ao iniciar o portal`, o que evita um portal que funciona pela metade.
  - tipo: conceito
    titulo: Ordenação topológica de Kahn
    texto: O `resolveLoadOrder` coloca na fila os microfrontends sem dependências, na ordem do arquivo, e a cada saída da fila reduz o grau de entrada dos dependentes, que entram na fila quando chegam a zero. Se sobrar algum microfrontend fora da ordem, há um ciclo, e o erro lista os que sobraram.
  - tipo: comparativo
    colunas:
    - Aparece no menu
    - Monta
    - Comportamento
    linhas:
    - dimensao: '`active`'
      valores:
      - Sim
      - Sim
      - Baixa o bundle quando a rota é aberta
    - dimensao: '`maintenance`'
      valores:
      - Sim
      - Não
      - Mostra o aviso de manutenção sem baixar o bundle
    - dimensao: '`disabled`'
      valores:
      - Não
      - Não
      - Fica fora do menu e das rotas
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Dependências
    titulo: Dependências declaradas no manifesto depois do laboratório
    mermaid: "graph LR\n    endereco[\"endereco\\nAlteração de Endereço\"]\n    minimo[\"minimo\\nMicrofrontend Mínimo\\n(maintenance)\"]\n    emprestimo[\"emprestimo\\nSimulação de Empréstimo\"]\n    endereco --> minimo\n    endereco --> emprestimo"
  - tipo: adr
    id: ADR-010
    titulo: Manifesto de MFEs e resolução de dependências
    status: Proposed
    contexto: O shell precisa de uma fonte declarativa sobre quais microfrontends existem, onde estão os bundles, em que rota montam, em que estado se encontram e de que dependem, detectando ciclos antes de montar qualquer um.
    decisao: Manifesto dedicado em `mfe-manifest.json`, validado no boot e ordenado topologicamente pelo algoritmo de Kahn, com detecção de ciclo.
    alternativas: Embutir a lista no `config.json`, descartado por misturar configuração de ambiente com catálogo de módulos, e manter a lista no código do shell, descartado porque cada mudança recompilaria o shell.
    consequencias: Acrescentar ou desativar um microfrontend não toca o código do shell, e erros de configuração aparecem no boot com mensagem clara, ao custo de mais um artefato para versionar e revisar.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba segue o manifesto de microfrontends pelo shell: o próprio `public/mfe-manifest.json`, a validação em `manifest.ts`, a ordenação por dependências em `dependencyResolver.ts` e o uso da ordem no boot, no menu e no componente que hospeda cada microfrontend. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para esta ODA.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba, inclusive os da legenda acima, estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json`, que declara para cada microfrontend a URL do bundle, o hash, a rota, o estado e as dependências. O shell lê esse arquivo ao iniciar para saber o que pode carregar e em que rota.
    - termo: Microfrontend
      definicao: Parte de uma interface web construída, compilada e publicada de forma independente, que uma aplicação hospedeira carrega em tempo de execução. No `frontend-react`, os microfrontends ficam em `mfes/` e são os módulos de alteração de endereço e de simulação de empréstimo.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Shell
      definicao: Aplicação React hospedeira do portal, em `src/`, que cuida do login, do layout e do roteamento e carrega os microfrontends nas rotas deles. Em desenvolvimento, ela responde na porta 5173.
    - termo: Boot do shell
      definicao: Inicialização do shell quando a página abre, em `src/main.tsx`, que carrega a configuração, valida o manifesto, ordena os microfrontends e cria o roteador. Um erro nessa fase mostra `Falha ao iniciar o portal`.
    - termo: Deploy
      definicao: Publicação de uma versão compilada num ambiente em que ela pode ser usada. No repositório, `npm run deploy` compila cada microfrontend, envia o bundle ao bucket no LocalStack e atualiza o hash no manifesto.
    - termo: Carregador de microfrontends (`loadMfeModule`)
      definicao: Função do shell em `src/app/mfe/loadMfeModule.ts` que baixa o bundle, confere o hash, importa o módulo e recusa o que não exporta `mount` e `unmount`.
    - termo: SHA-256 e campo `integrity`
      definicao: SHA-256 é uma função de hash que gera uma impressão de 256 bits de um conteúdo, e qualquer byte alterado muda o resultado. O campo `integrity` do manifesto guarda esse hash no formato `sha256-<Base64>`, o mesmo da Subresource Integrity dos navegadores, e o shell recusa o bundle cujo hash não confere.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    - termo: Base64
      definicao: Codificação que representa bytes com 64 caracteres de texto, usada para escrever hashes e tokens em formato legível. O hash do campo `integrity` tem 43 caracteres em Base64 seguidos de `=`.
      referencia:
        rotulo: MDN · Base64
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Base64
    - termo: Origem (origin)
      definicao: Combinação de protocolo, domínio e porta de uma URL, como `http://localhost:4566`. O shell só aceita bundles de origens listadas em `mfeAllowedOrigins`, no `config.json`.
      referencia:
        rotulo: MDN · Origem
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Origin
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build que reúne o código de um módulo e as dependências dele num arquivo pronto para o navegador. Cada microfrontend gera um bundle, como `endereco.js`, que fica publicado no bucket.
    - termo: '`config.json`'
      definicao: Arquivo de configuração de ambiente que o shell baixa no boot, com dados como a URL da API e a lista `mfeAllowedOrigins`. Ele muda a cada ambiente de deploy, e o manifesto muda quando um microfrontend entra ou sai.
    - termo: Ciclo de dependências
      definicao: Situação em que uma cadeia de dependências volta ao ponto de partida, como A depender de B e B depender de A. Nenhum item do ciclo chega a grau de entrada zero, e o shell interrompe o boot.
    - termo: Roteador
      definicao: Parte do shell que associa cada caminho da URL a uma tela e é criada no boot a partir da lista ordenada de microfrontends, com o React Router.
    - termo: Estados de um microfrontend (`active`, `maintenance`, `disabled`)
      definicao: 'Campo `state` do manifesto: `active` carrega o bundle, `maintenance` mostra um aviso de manutenção no lugar dele, e `disabled` tira o microfrontend do menu e das rotas.'
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, as alternativas avaliadas, a decisão e as consequências. As ADRs do repositório ficam em `docs/architecture/adrs/`, numeradas de ADR-001 a ADR-017.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: '`dependsOn`'
      definicao: Lista, em cada entrada do manifesto, dos `id` de microfrontends de que aquela entrada depende. O shell usa essa lista para ordenar as entradas e recusa dependências inexistentes e ciclos.

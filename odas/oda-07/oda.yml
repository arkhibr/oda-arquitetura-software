id: '07'
titulo: Carga segura e isolamento de falhas
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'A ADR-008 exige que um microfrontend quebrado não derrube o portal. Esta ODA percorre as falhas possíveis na carga de um microfrontend, mostra onde cada uma é detectada e o que a pessoa vê na tela, e corrige com o teste escrito antes uma falha que hoje escapa do isolamento: o erro de renderização dentro da árvore React do próprio microfrontend.'
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - 'Classificar as falhas de carga por quem as detecta: validação do manifesto, carregador ou error boundary.'
    - Ler no console e na tela as mensagens de hash inválido, de bucket inacessível e de contrato quebrado.
    - Demonstrar com teste que o error boundary do shell não alcança a árvore própria do microfrontend.
    - Acrescentar um boundary interno ao microfrontend de endereço com o teste escrito e rodado antes.
    - Relacionar as fases medidas em `perf.ts` com o caminho atual do carregador.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: 'As ODAs 05 e 06, com o repositório clonado no commit `2179313`. O laboratório roda testes no shell e em `mfes/endereco`, que precisa das próprias dependências: se a pasta `mfes/endereco/node_modules` não existir, rode `npm ci` dentro dela antes do passo 4.'
  - tipo: terminal
    titulo: terminal · testes do carregamento de microfrontends
    comandos:
    - entrada: npx vitest run src/app/mfe
      saida: " RUN  v4.1.7 .\n\n\n Test Files  8 passed (8)\n      Tests  31 passed (31)"
      origem: executado
      dica: O `MfeHost.test.tsx` já cobre a falha de carregamento com o aviso do error boundary.
    cenarios:
    - rotulo: Rodar os testes de src/app/mfe
      comando: npx vitest run src/app/mfe
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Uma falha pode ser detectada em três momentos: no boot, quando o manifesto é validado, na carga, quando o carregador baixa e confere o bundle, e na montagem, quando o microfrontend renderiza. O isolamento da ADR-008 cobre os dois últimos momentos por meio do `MfeErrorBoundary`, com um limite que esta ODA demonstra.'
  - tipo: comparativo
    colunas:
    - Quem detecta
    - O que a pessoa vê
    - Registro no console
    linhas:
    - dimensao: Origem não permitida ou ciclo
      valores:
      - '`validateManifest` e `resolveLoadOrder`, no boot'
      - '`Falha ao iniciar o portal`, sem menu'
      - Nenhum, a mensagem fica na página
    - dimensao: Bucket inacessível
      valores:
      - '`fetch` dentro de `loadMfeModule`'
      - '`O módulo ... está indisponível no momento.`'
      - '`TypeError: Failed to fetch`'
    - dimensao: Bundle com HTTP de erro
      valores:
      - '`loadMfeModule`'
      - O mesmo aviso do boundary
      - '`[mfe] bundle ... respondeu HTTP <status>`'
    - dimensao: Hash diferente
      valores:
      - '`verifyBundleIntegrity`'
      - O mesmo aviso do boundary
      - '`[mfe] integridade do bundle inválida`'
    - dimensao: Contrato quebrado ou exceção no `mount`
      valores:
      - '`assertMfeModule` ou o próprio `mount`, dentro da promessa do `MfeHost`'
      - O mesmo aviso do boundary
      - A mensagem do erro, com o nome do microfrontend
    - dimensao: Erro de renderização dentro do microfrontend
      valores:
      - Ninguém no shell, porque o erro acontece noutra raiz React
      - A área do microfrontend fica vazia, sem aviso
      - Erro não tratado na janela
  - tipo: conceito
    titulo: Por que o boundary do shell não alcança o microfrontend
    texto: Um error boundary do React captura erros de renderização dos componentes da mesma árvore. O microfrontend chama `createRoot` com o próprio React embutido, e a árvore dele não é filha do `MfeErrorBoundary`, que só recebe os erros que o `MfeHost` relança ao renderizar depois de uma falha de carga ou de `mount`.
  - tipo: conceito
    titulo: Fases medidas pelo shell
    texto: O `perf.ts` registra as medidas `mfe:<id>:fetchEval`, `validate`, `mount` e `total` com a Performance API. O relatório de 30/06/2026 em `docs/performance/` mediu o `emprestimo` com mediana total de 13 ms sem limite de rede e de 7 247 ms em Slow 3G, e concluiu que o custo está na transferência do bundle.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, como a falha de carga chega ao error boundary e como as fases são medidas. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/MfeHost.tsx
    commit: '2179313'
    linhas:
    - '  useEffect(() => {'
    - '    const el = hostRef.current'
    - '    if (!el) return'
    - ''
    - '    let mod: MfeModule | null = null'
    - '    let cancelled = false'
    - ''
    - '    const loadStart = performance?.now?.() ?? 0'
    - '    loadMfeModule(entry.url, entry.integrity, entry.id)'
    - '      .then((m) => {'
    - '        if (cancelled) return'
    - '        mod = m'
    - '        markStart(entry.id, ''mount'')'
    - '        m.mount(el, {'
    - '          apiUrl: getApiUrl(),'
    - '          token,'
    - '          basePath: entry.route,'
    - '          onUnauthorized: () => dispatch(logout()),'
    - '        })'
    - '        markEnd(entry.id, ''mount'')'
    - '        try {'
    - '          if (typeof performance !== ''undefined'' && typeof performance.mark === ''function'') {'
    - '            performance.mark(`mfe:${entry.id}:total:start`, { startTime: loadStart })'
    - '            performance.measure(`mfe:${entry.id}:total`, `mfe:${entry.id}:total:start`)'
    - '          }'
    - '        } catch {'
    - '          // ignore: performance API unavailable ou mark não suportado'
    - '        }'
    - '      })'
    - '      .catch((err) => {'
    - '        if (cancelled) return'
    - '        console.error(`[mfe] falha ao carregar "${entry.name}":`, err)'
    - '        setLoadError(err instanceof Error ? err : new Error(String(err)))'
    - '      })'
    - ''
    - '    return () => {'
    - '      cancelled = true'
    - '      if (mod && el) mod.unmount(el)'
    - '    }'
    - '  }, [entry.url, entry.integrity, entry.route, entry.name, entry.id, token, dispatch])'
    - ''
    - '  if (loadError) throw loadError'
    - ''
    - '  return <div ref={hostRef} data-mfe={entry.id} />'
    - '}'
    anotacoes:
    - linha: 30
      texto: Uma exceção lançada pelo `mount` cai no `.catch` logo abaixo, como as falhas de carga.
    - linha: 48
      texto: Mensagem que aparece no console com o nome do microfrontend.
    - linha: 49
      texto: O erro da promessa vira estado do componente.
    - linha: 58
      texto: Relançar o erro durante a renderização é o que permite ao error boundary capturá-lo.
    inicio: 17
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/MfeErrorBoundary.tsx
    commit: '2179313'
    linhas:
    - export class MfeErrorBoundary extends Component<Props, State> {
    - '  state: State = { hasError: false }'
    - ''
    - '  static getDerivedStateFromError(): State {'
    - '    return { hasError: true }'
    - '  }'
    - ''
    - '  componentDidCatch(error: unknown, info: ErrorInfo) {'
    - '    console.error(`[mfe] falha no microfrontend "${this.props.mfeName}":`, error, info.componentStack)'
    - '  }'
    - ''
    - '  render() {'
    - '    if (this.state.hasError) {'
    - '      return ('
    - '        <div role="alert" className="rounded border border-danger/40 bg-danger/5 p-6 text-danger">'
    - '          O módulo <strong>{this.props.mfeName}</strong> está indisponível no momento.'
    - '        </div>'
    - '      )'
    - '    }'
    - '    return this.props.children'
    - '  }'
    - '}'
    anotacoes:
    - linha: 9
      texto: Troca o conteúdo pelo aviso quando um filho lança erro ao renderizar.
    - linha: 21
      texto: Texto que a pessoa vê, com `role="alert"`.
    inicio: 6
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/loadMfeModule.ts
    commit: '2179313'
    linhas:
    - 'export async function loadMfeModule(url: string, integrity: string, id?: string): Promise<MfeModule> {'
    - '  if (id) markStart(id, ''fetchEval'')'
    - '  const response = await fetch(url, { credentials: ''omit'', cache: ''no-store'' })'
    - '  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)'
    - '  const bytes = await response.arrayBuffer()'
    - '  await verifyBundleIntegrity(bytes, integrity)'
    - '  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: ''text/javascript'' }))'
    - '  let mod: unknown'
    - '  try {'
    - '    mod = await import(/* @vite-ignore */ blobUrl)'
    - '  } finally {'
    - '    URL.revokeObjectURL(blobUrl)'
    - '  }'
    - '  if (id) markEnd(id, ''fetchEval'')'
    - ''
    - '  if (id) markStart(id, ''validate'')'
    - '  const result = assertMfeModule(mod, url)'
    - '  if (id) markEnd(id, ''validate'')'
    - ''
    - '  return result'
    - '}'
    anotacoes:
    - linha: 24
      texto: A fase `fetchEval` começa antes do download.
    - linha: 28
      texto: O hash é conferido dentro da fase `fetchEval`.
    - linha: 36
      texto: A fase termina depois da importação do Blob.
    inicio: 23
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/index.tsx
    commit: '2179313'
    linhas:
    - 'export function mount(el: HTMLElement, ctx: MfeMountContext): void {'
    - '  const root = createRoot(el)'
    - '  roots.set(el, root)'
    - '  root.render('
    - '    <StrictMode>'
    - '      <EnderecoApp ctx={ctx} />'
    - '    </StrictMode>,'
    - '  )'
    - '}'
    anotacoes:
    - linha: 9
      texto: A raiz do microfrontend é independente da árvore do shell, sem nenhum boundary acima do `EnderecoApp`.
    inicio: 8
  - tipo: faixa
    estilo: dica
    texto: O relatório de performance descreve `fetchEval` em torno de um `import()` da URL do bundle. No commit `2179313`, a fase inclui também o cálculo do SHA-256 e a importação do Blob, o que os números de 30/06/2026 podem não refletir.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Compare o caminho de uma exceção no `mount` com o de um erro de renderização dentro do microfrontend, e classifique as falhas pela forma como aparecem para a pessoa.
  - tipo: fluxo
    titulo: Dois caminhos de erro depois do contrato validado
    etapas:
    - titulo: mount chamado
      descricao: O `MfeHost` chama `mount(div, ctx)` dentro do `.then` da promessa de carga.
      codigo:
        arquivo: src/app/mfe/MfeHost.tsx
        commit: '2179313'
        linhas:
        - '      .then((m) => {'
        - '        if (cancelled) return'
        - '        mod = m'
        - '        markStart(entry.id, ''mount'')'
        - '        m.mount(el, {'
        destaque:
        - 5
    - titulo: Exceção síncrona no mount
      descricao: Uma exceção lançada antes de o `mount` retornar rejeita a promessa e cai no `.catch`, que guarda o erro no estado.
      codigo:
        arquivo: src/app/mfe/MfeHost.tsx
        commit: '2179313'
        linhas:
        - '      .catch((err) => {'
        - '        if (cancelled) return'
        - '        console.error(`[mfe] falha ao carregar "${entry.name}":`, err)'
        - '        setLoadError(err instanceof Error ? err : new Error(String(err)))'
        - '      })'
        destaque:
        - 4
    - titulo: Aviso do boundary
      descricao: Na renderização seguinte, o `MfeHost` relança o erro, e o `MfeErrorBoundary` mostra o aviso de módulo indisponível.
      codigo:
        arquivo: src/app/mfe/MfeHost.tsx
        commit: '2179313'
        linhas:
        - '  if (loadError) throw loadError'
        destaque:
        - 1
    - titulo: Erro dentro da raiz do microfrontend
      descricao: 'Se o `mount` retorna e um componente quebra depois, ao renderizar na raiz criada pelo microfrontend, o erro fica nessa raiz: o React desmonta a árvore dela, e o shell não recebe nada.'
      codigo:
        arquivo: mfes/endereco/src/index.tsx
        commit: '2179313'
        linhas:
        - '  const root = createRoot(el)'
        - '  roots.set(el, root)'
        - '  root.render('
        - '    <StrictMode>'
        - '      <EnderecoApp ctx={ctx} />'
        - '    </StrictMode>,'
        - '  )'
        destaque:
        - 1
  - tipo: classificador
    enunciado: O que a pessoa vê em cada falha, no commit 2179313?
    categorias:
    - id: boot
      rotulo: Portal não inicia
    - id: aviso
      rotulo: Aviso de módulo indisponível
    - id: vazio
      rotulo: Área vazia, sem aviso
    itens:
    - texto: O manifesto declara um ciclo de dependências
      categoria: boot
      explicacao: O `resolveLoadOrder` interrompe o boot antes de criar as rotas.
    - texto: O LocalStack está parado
      categoria: aviso
      explicacao: O `fetch` falha dentro do carregador, e o `MfeHost` relança o erro ao boundary.
    - texto: O manifesto tem o hash de um build anterior
      categoria: aviso
      explicacao: O `verifyBundleIntegrity` recusa os bytes, e o boundary mostra o aviso.
    - texto: O `mount` lança exceção antes de renderizar
      categoria: aviso
      explicacao: A exceção acontece dentro da promessa tratada pelo `MfeHost`.
    - texto: Um componente do microfrontend lança erro ao renderizar
      categoria: vazio
      explicacao: O erro fica na raiz React do microfrontend, que é desmontada sem aviso.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no repositório clonado na ODA 00. Os passos 1 a 3 demonstram no shell o limite do error boundary, e os passos 4 a 9 corrigem o microfrontend de endereço com o teste escrito antes.
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base do shell
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe
      sucesso: '`Test Files 8 passed (8)` e `Tests 31 passed (31)`.'
    - titulo: Escrever o teste de isolamento
      texto: Crie o arquivo abaixo. O primeiro teste simula um `mount` que lança exceção, e o segundo simula um microfrontend que cria a própria raiz React e quebra ao renderizar, registrando o erro com `onUncaughtError`.
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/__tests__/isolamento.test.tsx (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect, vi, beforeEach } from 'vitest'
        - import { render, screen, waitFor } from '@testing-library/react'
        - import { Provider } from 'react-redux'
        - import { configureStore } from '@reduxjs/toolkit'
        - import { createRoot } from 'react-dom/client'
        - import { authSlice } from '@/shared/lib/store/authSlice'
        - import { MfeHost } from '../MfeHost'
        - import { loadMfeModule } from '../loadMfeModule'
        - import type { MfeEntry } from '../types'
        - ''
        - 'vi.mock(''../loadMfeModule'', () => ({ loadMfeModule: vi.fn() }))'
        - ''
        - 'const entry: MfeEntry = {'
        - '  id: ''minimo'', name: ''Mínimo'', state: ''active'','
        - '  url: ''http://x/minimo.js'', integrity: ''sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='', route: ''/minimo'', dependsOn: [],'
        - '}'
        - ''
        - function renderHost() {
        - '  const store = configureStore({ reducer: { auth: authSlice.reducer } })'
        - '  return render(<Provider store={store}><p>menu do shell</p><MfeHost entry={entry} /></Provider>)'
        - '}'
        - ''
        - 'function Quebra(): never {'
        - '  throw new Error(''falha de renderização dentro do microfrontend'')'
        - '}'
        - ''
        - beforeEach(() => {
        - '  vi.spyOn(console, ''error'').mockImplementation(() => {})'
        - '})'
        - ''
        - describe('isolamento de falhas do MfeHost', () => {
        - '  it(''mount que lança exceção leva ao aviso do error boundary'', async () => {'
        - '    vi.mocked(loadMfeModule).mockResolvedValue({'
        - '      mount: () => { throw new Error(''falha no mount'') },'
        - '      unmount: () => {},'
        - '    })'
        - '    renderHost()'
        - '    await waitFor(() => expect(screen.getByRole(''alert'')).toHaveTextContent(''está indisponível no momento''))'
        - '    expect(screen.getByText(''menu do shell'')).toBeInTheDocument()'
        - '  })'
        - ''
        - '  it(''erro de renderização na árvore própria do microfrontend não chega ao error boundary do shell'', async () => {'
        - '    let alvo: HTMLElement | null = null'
        - '    const errosDaRaiz: unknown[] = []'
        - '    vi.mocked(loadMfeModule).mockResolvedValue({'
        - '      mount: (el) => {'
        - '        alvo = el'
        - '        createRoot(el, { onUncaughtError: (erro) => errosDaRaiz.push(erro) }).render(<Quebra />)'
        - '      },'
        - '      unmount: () => {},'
        - '    })'
        - '    renderHost()'
        - '    await waitFor(() => expect(errosDaRaiz).toHaveLength(1))'
        - '    expect(screen.queryByRole(''alert'')).toBeNull()'
        - '    expect(alvo!.childElementCount).toBe(0)'
        - '    expect(screen.getByText(''menu do shell'')).toBeInTheDocument()'
        - '  })'
        - '})'
      efeito: teste_iso
    - titulo: Rodar o teste de isolamento
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/app/mfe/__tests__/isolamento.test.tsx
      sucesso: '`Tests 2 passed (2)`: o boundary mostra o aviso para a exceção do `mount` e não vê o erro da raiz própria.'
    - titulo: Rodar a linha de base do microfrontend
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run
      sucesso: '`Test Files 4 passed (4)` e `Tests 11 passed (11)`.'
    - titulo: Escrever o teste da falha interna
      texto: Crie o arquivo abaixo em `mfes/endereco`. O `vi.mock` troca o `EnderecoApp` por um componente que lança erro ao renderizar.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/__tests__/falhaInterna.test.tsx (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect, vi } from 'vitest'
        - import { mount, unmount } from '../index'
        - ''
        - vi.mock('../EnderecoApp', () => ({
        - '  EnderecoApp: () => {'
        - '    throw new Error(''falha de renderização no EnderecoApp'')'
        - '  },'
        - '}))'
        - ''
        - 'const ctx = { apiUrl: '''', token: ''t'', onUnauthorized: () => {}, basePath: ''/endereco'' }'
        - ''
        - describe('falha dentro da árvore do microfrontend', () => {
        - '  it(''mostra um aviso do próprio microfrontend no elemento recebido'', async () => {'
        - '    vi.spyOn(console, ''error'').mockImplementation(() => {})'
        - '    const el = document.createElement(''div'')'
        - '    mount(el, ctx)'
        - '    await vi.waitFor(() => expect(el.querySelector(''[role="alert"]'')?.textContent).toBe(''O módulo de endereço encontrou um erro.''))'
        - '    unmount(el)'
        - '  })'
        - '})'
      efeito: teste_falha
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run src/__tests__/falhaInterna.test.tsx
      sucesso: '`Tests 1 failed (1)` e `Errors 1 error`, com o erro de renderização fora de qualquer boundary.'
    - titulo: Criar o boundary interno
      texto: Crie o componente abaixo e, em `mfes/endereco/src/index.tsx`, importe `FalhaInterna` de `./FalhaInterna` e envolva o `<EnderecoApp ctx={ctx} />` com `<FalhaInterna>`.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/FalhaInterna.tsx (novo)
        commit: '2179313'
        linhas:
        - import { Component, type ReactNode } from 'react'
        - ''
        - 'type Props = { children: ReactNode }'
        - 'type State = { falhou: boolean }'
        - ''
        - // Captura erros da árvore deste microfrontend, que roda num createRoot próprio
        - // e por isso não chega ao MfeErrorBoundary do shell.
        - export class FalhaInterna extends Component<Props, State> {
        - '  state: State = { falhou: false }'
        - ''
        - '  static getDerivedStateFromError(): State {'
        - '    return { falhou: true }'
        - '  }'
        - ''
        - '  render() {'
        - '    if (this.state.falhou) return <p role="alert">O módulo de endereço encontrou um erro.</p>'
        - '    return this.props.children'
        - '  }'
        - '}'
      efeito: falha_interna
    - titulo: Ver o teste passar e conferir o microfrontend
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run src/__tests__/falhaInterna.test.tsx
        - cd mfes/endereco && npx vitest run
        - cd mfes/endereco && npx tsc --noEmit
      sucesso: '`Tests 1 passed (1)`, a suíte do microfrontend com `Tests 12 passed (12)` e o `tsc` sem mensagens.'
    - titulo: Conferir tipos e fronteiras do shell
      editor:
        rotulo: terminal
        linhas:
        - npx tsc --noEmit -p tsconfig.app.json && npm run lint
      sucesso: O `tsc` termina sem mensagens, e o ESLint termina sem erros depois de `> eslint src/`.
  - tipo: terminal
    titulo: terminal · frontend-react
    comandos:
    - entrada: npx vitest run src/app/mfe
      condicao: teste_iso
      saida: " RUN  v4.1.7 .\n\n\n Test Files  9 passed (9)\n      Tests  33 passed (33)"
      origem: executado
    - entrada: npx vitest run src/app/mfe
      saida: " RUN  v4.1.7 .\n\n\n Test Files  8 passed (8)\n      Tests  31 passed (31)"
      origem: executado
    - entrada: npx vitest run src/app/mfe/__tests__/isolamento.test.tsx
      condicao: teste_iso
      saida: " RUN  v4.1.7 .\n\n\n Test Files  1 passed (1)\n      Tests  2 passed (2)"
      origem: executado
      dica: 'Os dois testes descrevem o comportamento atual: o segundo documenta o limite do error boundary do shell.'
    - entrada: npx vitest run src/app/mfe/__tests__/isolamento.test.tsx
      saida: ' RUN  v4.1.7 .


        No test files found, exiting with code 1



  - tipo: faixa
    estilo: dica
    texto: A correção vale para o portal depois de um novo build e deploy do microfrontend, que a ODA 08 trata. O shell não muda, porque o boundary novo fica dentro do bundle do endereço.
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os dois primeiros incidentes reproduzem a tela e o console do portal com falhas de carga, os dois últimos partem do laboratório e do relatório de performance.
  - tipo: incidente
    titulo: Módulo indisponível depois de um deploy
    origem: executado
    rotulo_saida: log
    saida: 'tela: O módulo Alteração de Endereço está indisponível no momento.

      console: error: [mfe] falha ao carregar "Alteração de Endereço": Error: [mfe] integridade do bundle inválida'
    pergunta: O manifesto foi restaurado para a versão anterior ao último deploy. Por que o módulo ficou indisponível?
    correcao: Promover bundle e manifesto juntos, rodando `npm run deploy`, que recalcula o `integrity` depois de publicar.
    alternativas:
    - texto: O token expirou.
      correta: false
      explicacao: 'O download do bundle usa `credentials: ''omit''` e não depende do token.'
    - texto: O manifesto tem o hash do build anterior, e o carregador recusa os bytes publicados agora.
      correta: true
      explicacao: A mensagem `integridade do bundle inválida` vem de `verifyBundleIntegrity`.
    - texto: O bucket foi apagado.
      correta: false
      explicacao: Bucket inexistente gera erro de HTTP ou de `fetch`, e não de integridade.
  - tipo: incidente
    titulo: Módulo indisponível com o LocalStack parado
    origem: executado
    rotulo_saida: log
    saida: 'tela: O módulo Alteração de Endereço está indisponível no momento.

      console: error: Failed to load resource: net::ERR_FAILED

      console: error: [mfe] falha ao carregar "Alteração de Endereço": TypeError: Failed to fetch'
    pergunta: 'O que o `TypeError: Failed to fetch` indica?'
    correcao: Subir o LocalStack e, se ele foi reiniciado sem persistência, rodar o deploy de novo para recriar os buckets.
    alternativas:
    - texto: O bundle respondeu 404.
      correta: false
      explicacao: Com 404, o carregador lança `respondeu HTTP 404`.
    - texto: O CSP bloqueou o React do microfrontend.
      correta: false
      explicacao: O erro aconteceu no download, antes de executar o bundle.
    - texto: O navegador não conseguiu conexão com a origem do bundle, e a falha aconteceu antes de qualquer resposta HTTP.
      correta: true
      explicacao: Sem resposta, o `fetch` rejeita a promessa, e o `MfeHost` relança o erro ao boundary.
  - tipo: incidente
    titulo: Tela em branco na rota do endereço
    origem: executado
    rotulo_saida: log
    saida: "AssertionError: expected undefined to be 'O módulo de endereço encontrou um err…' // Object.is equality\nError: falha de renderização no EnderecoApp\n Test Files  1 failed (1)\n      Tests  1 failed (1)\n     Errors  1 error"
    pergunta: Um componente do microfrontend lançou erro ao renderizar. Por que nenhum aviso apareceu?
    correcao: Envolver a árvore do microfrontend num boundary próprio, como o `FalhaInterna` do laboratório.
    alternativas:
    - texto: O erro aconteceu na raiz React criada pelo microfrontend, que não é filha do `MfeErrorBoundary` do shell.
      correta: true
      explicacao: O teste de isolamento do laboratório mostrou o shell sem aviso e a área do microfrontend vazia.
    - texto: O `MfeErrorBoundary` só captura erros de rede.
      correta: false
      explicacao: O boundary captura qualquer erro relançado na renderização do `MfeHost`, inclusive exceções do `mount`.
    - texto: O StrictMode desliga os boundaries em desenvolvimento.
      correta: false
      explicacao: O StrictMode repete renderizações e efeitos, mas não desliga boundaries.
  - tipo: incidente
    titulo: Relatório que mede outro caminho
    origem: codigo
    rotulo_saida: arquivo
    saida: "docs/performance/2026-06-30-carga-dinamica-mfe-emprestimo.md\n  → loadMfeModule(url, id)    // import() dinâmico: fetch + parse + eval do bundle ESM\n\nsrc/app/mfe/loadMfeModule.ts:24-36\n  if (id) markStart(id, 'fetchEval')\n  const response = await fetch(url, { credentials: 'omit', cache: 'no-store' })\n  if (!response.ok) throw new Error(`[mfe] bundle ${url} respondeu HTTP ${response.status}`)\n  const bytes = await response.arrayBuffer()\n  await verifyBundleIntegrity(bytes, integrity)\n  const blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }))\n  let mod: unknown\n  try {\n    mod = await import(/* @vite-ignore */ blobUrl)\n  } finally {\n    URL.revokeObjectURL(blobUrl)\n  }\n  if (id) markEnd(id, 'fetchEval')"
    pergunta: O que mudou na fase `fetchEval` desde o relatório?
    correcao: Rodar de novo o `npm run test:perf` e atualizar o relatório, registrando a inclusão do SHA-256 na fase.
    alternativas:
    - texto: A validação do contrato passou para dentro de `fetchEval`.
      correta: false
      explicacao: A validação continua na fase `validate`, depois do `markEnd` de `fetchEval`.
    - texto: A fase passou a incluir o download explícito, o cálculo do SHA-256 e a importação de um Blob.
      correta: true
      explicacao: O `markStart` vem antes do `fetch` e o `markEnd` vem depois do `import` do Blob.
    - texto: A fase deixou de ser medida.
      correta: false
      explicacao: O `markStart` e o `markEnd` de `fetchEval` continuam no carregador.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Como uma falha de carga, que acontece numa promessa, chega ao error boundary?
      alternativas:
      - texto: O error boundary escuta promessas rejeitadas.
        correta: false
        explicacao: Boundaries do React só capturam erros de renderização e de ciclo de vida.
      - texto: O `loadMfeModule` chama o boundary diretamente.
        correta: false
        explicacao: O carregador só lança o erro.
      - texto: O `MfeHost` guarda o erro no estado e o relança ao renderizar.
        correta: true
        explicacao: O `if (loadError) throw loadError` coloca o erro no caminho da renderização.
    - enunciado: Quais falhas fazem o portal inteiro deixar de iniciar?
      alternativas:
      - texto: As de validação do manifesto, como ciclo e origem não permitida.
        correta: true
        explicacao: Elas acontecem no boot, antes de criar o roteador.
      - texto: As de hash inválido.
        correta: false
        explicacao: O hash é conferido na rota, e o resto do portal continua funcionando.
      - texto: As de `mount`.
        correta: false
        explicacao: O boundary isola a falha de `mount` na área do microfrontend.
    - enunciado: Por que o boundary interno do laboratório fica no microfrontend, e não no shell?
      alternativas:
      - texto: Porque o contrato proíbe o shell de capturar erros.
        correta: false
        explicacao: O contrato não trata de erros, e o shell captura os de carga e de `mount`.
      - texto: Porque só um componente da mesma árvore React captura os erros de renderização dessa árvore.
        correta: true
        explicacao: A raiz do microfrontend é criada por ele, com o React embutido no bundle.
      - texto: Porque o shell não pode ter mais de um boundary.
        correta: false
        explicacao: Uma árvore React pode ter quantos boundaries quiser.
    - enunciado: Onde fica a maior parte do tempo de carga, segundo o relatório de performance?
      alternativas:
      - texto: Na validação do contrato.
        correta: false
        explicacao: O relatório trata `validate` como código do shell, com custo esperado perto de 0 ms.
      - texto: No `mount`.
        correta: false
        explicacao: O relatório aponta a rede como fator dominante em todos os perfis.
      - texto: Na transferência do bundle pela rede, dentro de `fetchEval`.
        correta: true
        explicacao: O relatório registra que o mecanismo de orquestração custa cerca de 1 ms.
    - enunciado: Depois de criar o `FalhaInterna`, o que falta para a correção chegar ao portal?
      alternativas:
      - texto: Novo build e deploy do microfrontend, com o manifesto atualizado.
        correta: true
        explicacao: O boundary vai dentro do bundle, e o manifesto precisa do hash novo.
      - texto: Recompilar o shell.
        correta: false
        explicacao: O shell não muda, como prevê a ADR-008.
      - texto: Nada, porque o Vite recarrega o microfrontend.
        correta: false
        explicacao: O portal baixa o bundle publicado no bucket, e não o código-fonte.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - As falhas de boot, de carga e de montagem e a forma como aparecem para a pessoa estão claras.
    - O teste de isolamento mostrou o aviso para a exceção do `mount` e nenhum aviso para o erro da raiz própria.
    - O teste da falha interna falhou antes do boundary e passou depois.
    - A suíte do microfrontend terminou com 12 testes aprovados e o `tsc` sem mensagens.
    - A diferença entre o relatório de performance e o carregador atual foi identificada.

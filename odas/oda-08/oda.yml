      origem: executado
      efeito: deploy_raiz
    - entrada: npm run deploy
      saida: "> frontend-react@0.0.0 deploy\n> node --experimental-strip-types scripts/deploy.ts\n\n✓ LocalStack no ar em http://localhost:4566\n\n▶ mfes/endereco\n\n> mfe-endereco@0.0.0 build\n> tsc --noEmit && vite build\n\nvite v8.0.16 building client environment for production...\n\n WARN  inlineDynamicImports option is deprecated, please use codeSplitting: false instead.\n\n\ntransforming...✓ 16 modules transformed.\nrendering chunks...\ncomputing gzip size...\ndist/endereco.js  296.05 kB │ gzip: 78.72 kB\n\n✓ built in 56ms\n\n> mfe-endereco@0.0.0 deploy\n> node --experimental-strip-types scripts/deploy.ts\n\n✅ deploy: http://localhost:4566/mfe-endereco/endereco.js\n  ✓ publicado e validado: http://localhost:4566/mfe-endereco/endereco.js\n  ✓ manifesto atualizado: endereco → sha256-dK2p5Vm48WkUzvjw6kZZh5eoONWmTxFA8RKXB5FO6bM=\n\n▶ mfes/emprestimo\n\n> mfe-emprestimo@0.0.0 build\n> tsc --noEmit && vite build\n\nvite v8.0.16 building client environment for production...\n\n WARN  inlineDynamicImports option is deprecated, please use codeSplitting: false instead.\n\n\ntransforming...✓ 28 modules transformed.\nrendering chunks...\ncomputing gzip size...\ndist/emprestimo.js  337.89 kB │ gzip: 87.26 kB\n\n✓ built in 57ms\n\n> mfe-emprestimo@0.0.0 deploy\n> node --experimental-strip-types scripts/deploy.ts\n\n✅ deploy: http://localhost:4566/mfe-emprestimo/emprestimo.js\n  ✓ publicado e validado: http://localhost:4566/mfe-emprestimo/emprestimo.js\n  ✓ manifesto atualizado: emprestimo → sha256-JipnXLXX2ZObIxBYmjNzsLy5W2WvXcShNJ9T30xMDi0=\n\n✅ deploy concluído: 2 MFEs publicados em http://localhost:4566"
      origem: executado

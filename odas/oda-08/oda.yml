- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os incidentes abaixo partem das saídas do laboratório e de dois pontos do código e da documentação que merecem atenção.
  - tipo: incidente
    titulo: Endereço indisponível depois de uma entrega
    origem: executado
    rotulo_saida: log
    saida: 'tela: O módulo Alteração de Endereço está indisponível no momento.

      console: [mfe] falha ao carregar "Alteração de Endereço": Error: [mfe] integridade do bundle inválida

      console: [mfe] falha no microfrontend "Alteração de Endereço": Error: [mfe] integridade do bundle inválida'
    pergunta: A equipe publicou o microfrontend com `npm run deploy` dentro de `mfes/endereco`. O que faltou?
    correcao: Rodar o deploy da raiz, que publica o bundle e grava o hash no manifesto, e versionar o manifesto no mesmo commit do código.
    alternativas:
    - texto: Recompilar o shell.
      correta: false
      explicacao: O shell não muda, e o problema está no hash registrado no manifesto.
    - texto: Atualizar o `integrity` do manifesto, que o deploy do microfrontend não grava.
      correta: true
      explicacao: Só `scripts/deploy.ts` da raiz chama `updateManifestIntegrity`.
    - texto: Configurar CORS no bucket.
      correta: false
      explicacao: O deploy do microfrontend aplica CORS, e o erro é de integridade.
  - tipo: incidente
    titulo: Dois hashes para o mesmo arquivo
    origem: executado
    rotulo_saida: log
    saida: "$ printf 'sha256-%s\\n' \"$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)\"\nsha256-+mvU7BTnqjJqM684m1pOBjoyutPPAy14guWBbJU/w+4=\n\n$ grep -A4 '\"id\": \"endereco\"' public/mfe-manifest.json\n      \"id\": \"endereco\",\n      \"name\": \"Alteração de Endereço\",\n      \"state\": \"active\",\n      \"url\": \"http://localhost:4566/mfe-endereco/endereco.js\",\n      \"integrity\": \"sha256-dK2p5Vm48WkUzvjw6kZZh5eoONWmTxFA8RKXB5FO6bM=\","
    pergunta: O que a diferença entre as duas saídas indica?
    correcao: Promover bundle e manifesto juntos e, numa esteira de produção, tornar as duas etapas atômicas, como pede a Atualização 1.1 da ADR-011.
    alternativas:
    - texto: O `openssl` e o Node calculam hashes diferentes.
      correta: false
      explicacao: Depois do deploy da raiz, os dois valores coincidem.
    - texto: O LocalStack alterou o arquivo no upload.
      correta: false
      explicacao: O hash é calculado sobre o arquivo local, e o shell aceita o bundle baixado quando o manifesto é atualizado.
    - texto: O bundle em `dist/` e no bucket mudou, e o manifesto ainda aponta para o build anterior.
      correta: true
      explicacao: O valor do manifesto é o do deploy inicial, e o do arquivo é o do deploy só do microfrontend.
  - tipo: incidente
    titulo: Deploy contra um endpoint errado
    origem: executado
    rotulo_saida: log
    saida: "$ cd mfes/endereco && S3_ENDPOINT=http://localhost:4599 npm run deploy\n> mfe-endereco@0.0.0 deploy\n> node --experimental-strip-types scripts/deploy.ts\n\nAggregateError [ECONNREFUSED]: \n    at internalConnectMultiple (node:net:1193:18)\n    at afterConnectMultiple (node:net:1783:7) {\n  code: 'ECONNREFUSED',\n  '$metadata': { attempts: 3, totalRetryDelay: 158 },\n  ..."
    pergunta: O erro não diz qual operação falhou. Qual foi a primeira a falhar?
    correcao: Tratar no `ensureBucket` apenas o erro de bucket existente e relançar os demais, para que a mensagem aponte a criação do bucket.
    alternativas:
    - texto: A criação do bucket, cuja falha o `catch` vazio ignorou, e o erro exibido vem da aplicação da policy, que veio em seguida.
      correta: true
      explicacao: O `if` dentro do `catch` de `ensureBucket` não tem corpo, e o `PutBucketPolicyCommand` é a próxima chamada fora do `try`.
    - texto: O build do microfrontend.
      correta: false
      explicacao: O comando roda só o `npm run deploy`, que não compila.
    - texto: A leitura de `dist/endereco.js`.
      correta: false
      explicacao: O erro é de conexão recusada na porta 4599, e não de arquivo ausente.
  - tipo: incidente
    titulo: Tamanho do bundle na ADR
    origem: executado
    rotulo_saida: log
    saida: "docs/architecture/adrs/ADR-009-contrato-mount-unmount.md\n  O bundle de exemplo (`endereco.js`) tem ~800 kB não comprimido (~200 kB gzip)\n\n$ cd mfes/endereco && npm run build && npm run deploy\n  ...\ndist/endereco.js  296.41 kB │ gzip: 78.85 kB"
    pergunta: Como tratar a diferença entre o tamanho citado na ADR e o do build?
    correcao: Atualizar o número na ADR-009 com a medição atual e registrar a data, porque o custo da autonomia continua sendo o React embutido.
    alternativas:
    - texto: Concluir que o build falhou.
      correta: false
      explicacao: O build terminou com `✓ built` e o deploy validou o bundle.
    - texto: Tratar o build como fonte atual e atualizar a ADR, porque o número registrado não corresponde ao código do commit.
      correta: true
      explicacao: A saída do Vite 8 mede o arquivo gerado agora, e a ADR registra uma medição anterior.
    - texto: Concluir que o React deixou de ir no bundle.
      correta: false
      explicacao: O `vite.config.ts` continua sem marcar o React como externo.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Qual comando atualiza o `integrity` do manifesto?
      alternativas:
      - texto: '`npm run deploy` dentro do microfrontend.'
        correta: false
        explicacao: O deploy do microfrontend só cria o bucket e envia o arquivo.
      - texto: '`npm run build` do microfrontend.'
        correta: false
        explicacao: O build só gera `dist/`.
      - texto: '`npm run deploy` na raiz do repositório.'
        correta: true
        explicacao: A função `updateManifestIntegrity` fica em `scripts/deploy.ts`.
    - enunciado: Por que o bucket recebe CORS?
      alternativas:
      - texto: Porque o shell baixa o bundle com `fetch` a partir de outra origem.
        correta: true
        explicacao: O shell roda em `localhost:5173`, e o bucket em `localhost:4566`.
      - texto: Porque o LocalStack exige CORS para aceitar uploads.
        correta: false
        explicacao: O upload é feito pelo SDK no Node, sem regras de CORS.
      - texto: Porque o Gateway lê o bucket.
        correta: false
        explicacao: O Gateway não participa do download dos bundles.
    - enunciado: O que a ADR-011 pede para pipelines de produção?
      alternativas:
      - texto: Que cada microfrontend tenha o próprio manifesto.
        correta: false
        explicacao: O manifesto é único e lido pelo shell.
      - texto: Que bundle e manifesto sejam promovidos juntos, de forma atômica.
        correta: true
        explicacao: É o texto da Atualização 1.1.
      - texto: Que o manifesto seja publicado antes do bundle.
        correta: false
        explicacao: Nessa ordem, o manifesto aponta para um bundle que ainda não existe com aquele hash.
    - enunciado: Por que o build usa lib mode com um único arquivo ESM?
      alternativas:
      - texto: Para compartilhar o React do shell.
        correta: false
        explicacao: O React vai embutido no bundle.
      - texto: Para gerar o manifesto.
        correta: false
        explicacao: O manifesto é gravado pelo deploy da raiz.
      - texto: Para que o shell baixe, confira e importe um só módulo com `mount` e `unmount`.
        correta: true
        explicacao: O carregador confere o hash de um arquivo e importa um Blob.
    - enunciado: Depois do deploy da raiz, por que o manifesto aparece no `git status`?
      alternativas:
      - texto: Porque o deploy grava o hash novo em `public/mfe-manifest.json`, que é versionado.
        correta: true
        explicacao: O manifesto precisa ir no mesmo commit do código que gerou o bundle.
      - texto: Porque o Vite reescreve o manifesto ao subir.
        correta: false
        explicacao: O Vite só serve o arquivo de `public/`.
      - texto: Porque o LocalStack devolve o manifesto.
        correta: false
        explicacao: O manifesto fica no repositório do shell.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A diferença entre o deploy do microfrontend e o deploy da raiz está clara.
    - O portal recusou o bundle publicado sem o manifesto correspondente.
    - O deploy da raiz alinhou o hash do bundle e o do manifesto, e o endereço voltou a funcionar.
    - O manifesto alterado foi identificado como parte do mesmo commit do código.
    - O efeito do `catch` vazio em `ensureBucket` e a divergência de tamanho na ADR-009 foram identificados.

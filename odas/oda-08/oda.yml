id: 08
titulo: Build independente e deploy em S3
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é garantir que uma versão nova de microfrontend chegue ao portal sem derrubar a funcionalidade, publicando o bundle no Amazon S3 (Simple Storage Service), emulado na sua máquina pelo LocalStack, junto com o manifesto que o shell usa para conferi-lo. No `frontend-react`, o shell recusa o bundle cujo hash não confere com o manifesto, e o deploy próprio de cada microfrontend publica só o bundle, o que deixa o módulo indisponível para todos os usuários depois de uma promoção parcial. Você vai publicar só o bundle de uma versão nova, ver o portal recusá-lo e corrigir a promoção publicando bundle e manifesto juntos.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Microfrontend
      definicao: Parte da interface do portal com build e deploy próprios, que o shell carrega numa rota enquanto o usuário navega. No `frontend-react`, os microfrontends ficam em `mfes/endereco/` e `mfes/emprestimo/`.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica guardado num bucket e é acessado por uma URL. No portal, cada microfrontend tem um bucket próprio, que guarda o bundle publicado.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: LocalStack
      definicao: Emulador dos serviços da AWS que roda num contêiner Docker na sua máquina e responde na porta 4566. O `frontend-react` usa só o S3 do LocalStack, para hospedar os bundles dos microfrontends em desenvolvimento.
      referencia:
        rotulo: LocalStack · Simple Storage Service (S3)
        url: https://docs.localstack.cloud/aws/services/s3/
    - termo: Bundle
      definicao: Arquivo JavaScript gerado pelo build a partir do código-fonte de um microfrontend, com tudo de que ele precisa para rodar no navegador. O shell baixa esse arquivo do bucket e o executa como módulo.
    - termo: Manifesto de microfrontends
      definicao: Arquivo `public/mfe-manifest.json` que o shell baixa ao iniciar para saber quais microfrontends existem, de onde baixar o bundle de cada um, em que rota montá-lo e qual hash o bundle precisa ter.
    - termo: Build e deploy
      definicao: O build transforma o código-fonte em arquivos prontos para o navegador, e o deploy publica esses arquivos no lugar de onde eles serão servidos. A promoção é o deploy de uma versão nova para o ambiente em uso.
    - termo: Shell
      definicao: Aplicação React da pasta `src/` que cuida do login, do layout e das rotas do portal e carrega os microfrontends em tempo de execução, sem precisar ser recompilada quando um microfrontend muda.
    - termo: Hash e campo integrity
      definicao: Um hash é um resumo de tamanho fixo calculado a partir do conteúdo de um arquivo, que muda por completo quando um único byte do arquivo muda. O campo `integrity` do manifesto guarda o hash SHA-256 de cada bundle, e o shell recusa o bundle cujo hash calculado não confere com esse valor.
      referencia:
        rotulo: MDN · Subresource Integrity
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity
    - termo: Vite e o modo biblioteca (lib mode)
      definicao: O Vite é a ferramenta de build e o servidor de desenvolvimento do portal. No modo biblioteca, ele gera um único módulo JavaScript a partir de um ponto de entrada, e é assim que cada microfrontend produz o próprio bundle.
      referencia:
        rotulo: Vite · Building for Production, Library Mode
        url: https://vite.dev/guide/build#library-mode
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas consideradas e as consequências. As ADRs do `frontend-react` ficam em `docs/architecture/adrs/`, e a ADR-011 trata do build e do deploy dos microfrontends.
      referencia:
        rotulo: Architectural Decision Records (ADRs)
        url: https://adr.github.io/
    - termo: Docker e docker compose
      definicao: O Docker empacota uma aplicação e as dependências dela numa imagem e roda essa imagem como contêiner, um processo isolado do restante da máquina. O `docker compose` sobe os contêineres descritos num arquivo YAML, como o `infra/docker-compose.yml` do LocalStack.
      referencia:
        rotulo: Docker Docs · What is Docker?
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: Módulo ESM (ECMAScript Module)
      definicao: Formato padrão de módulo do JavaScript, com `import` e `export`, que o navegador carrega e executa diretamente. O bundle de cada microfrontend é um módulo ESM.
      referencia:
        rotulo: MDN · Módulos JavaScript
        url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Modules
    - termo: AWS SDK v3
      definicao: Biblioteca oficial da AWS para chamar os serviços dela a partir de JavaScript, organizada em comandos como `PutObjectCommand` e `PutBucketPolicyCommand`. O script de deploy de cada microfrontend a usa para criar o bucket e enviar o bundle ao LocalStack.
    - termo: Bucket policy
      definicao: Documento JSON associado a um bucket do S3 que define quem pode ler ou gravar os objetos dele. O deploy grava uma policy que permite a leitura pública do bundle, para que o navegador consiga baixá-lo.
    - termo: CORS (Cross-Origin Resource Sharing)
      definicao: Mecanismo pelo qual um servidor informa, em cabeçalhos HTTP, quais outras origens podem ler as respostas dele pelo navegador. O bucket de cada microfrontend precisa de configuração de CORS, porque o shell roda numa origem e baixa o bundle de outra.
      referencia:
        rotulo: MDN · Cross-Origin Resource Sharing (CORS)
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar o build em Vite lib mode e a publicação num bucket S3 por microfrontend, conforme a ADR-011.
    - Distinguir o deploy do microfrontend, que só publica o bundle, do deploy da raiz, que também atualiza o manifesto.
    - Reproduzir no portal a falha causada por um bundle novo com manifesto antigo e corrigi-la com a promoção conjunta.
    - Conferir o hash do bundle publicado contra o campo `integrity` do manifesto.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: 'Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O Docker precisa estar em execução, porque o deploy publica no LocalStack, na porta 4566. O laboratório usa dois terminais: um com `npm run dev` e outro para os comandos de deploy. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.'
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba explica como cada microfrontend é construído e hospedado e a ligação entre a publicação e o hash do manifesto: um bundle publicado sem o manifesto correspondente é recusado pelo shell. No repositório, a ADR-011 e a Atualização 1.1 dela registram essas decisões.'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Pipeline
    titulo: Pipeline de deploy da ADR-011 (docs/architecture/adrs/ADR-011-deploy-s3-localstack.md)
    mermaid: "graph LR\n    src[\"mfes/endereco/src\"] -->|\"vite build (lib)\"| dist[\"dist/endereco.js\"]\n    dist -->|\"AWS SDK v3 PutObject\"| bucket[\"S3 bucket\\nmfe-endereco (LocalStack)\"]\n    bucket -->|\"fetch + CORS\"| shell[\"Shell\"]\n    dist -->|\"SHA-256\"| manifest[\"mfe-manifest.json\"]"
  - tipo: comparativo
    colunas:
    - Deploy do microfrontend
    - Deploy da raiz
    linhas:
    - dimensao: Comando
      valores:
      - '`npm run build` e `npm run deploy` dentro de `mfes/endereco`'
      - '`npm run deploy` na raiz do repositório'
    - dimensao: Sobe o LocalStack se estiver parado
      valores:
      - Não
      - Sim, com `docker compose`
    - dimensao: Publica o bundle
      valores:
      - Sim, no bucket `mfe-endereco`, com policy pública e CORS
      - Sim, para cada microfrontend da lista `MFES`, delegando ao deploy de cada um
    - dimensao: Confere HTTP 200 no bucket
      valores:
      - Não
      - Sim
    - dimensao: Atualiza o `integrity` do manifesto
      valores:
      - Não
      - Sim, com o SHA-256 do arquivo em `dist/`
  - tipo: conceito
    titulo: Promoção conjunta
    texto: O shell lê o manifesto no boot de cada carga da página e confere o hash de cada bundle baixado contra ele. Se o bundle muda e o manifesto não, a carga falha, e se o manifesto muda antes do bundle, a falha também acontece. A Atualização 1.1 da ADR-011 registra que pipelines de produção devem executar as duas etapas de forma atômica.
  - tipo: adr
    id: ADR-011
    titulo: Build independente e deploy de MFEs em S3 (LocalStack)
    status: Proposed
    contexto: Cada microfrontend é um bundle ESM carregado em tempo de execução, e faltava definir como ele é construído, onde fica hospedado e como é publicado sem reacoplar o deploy ao do shell.
    decisao: Build em Vite lib mode e um bucket S3 por microfrontend, com LocalStack em desenvolvimento e publicação pelo AWS SDK v3, num repositório único com uma pasta por microfrontend para fins didáticos.
    alternativas: Servir os bundles pelo próprio shell, descartado por reacoplar os deploys, e um repositório isolado por microfrontend, recomendado pela ADR para produção.
    consequencias: Cada microfrontend compila e publica sozinho, ao custo de configurar policy e CORS por bucket. A Atualização 1.1 acrescenta a atualização do `integrity` no deploy da raiz e a exigência de promover bundle e manifesto juntos.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os três arquivos que levam um microfrontend do código-fonte ao S3 local: o `vite.config.ts` do microfrontend de endereço, que gera o bundle, o `deploy.ts` próprio dele, que publica o bundle no bucket, e o `scripts/deploy.ts` da raiz, que publica todos os microfrontends e atualiza o manifesto. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para o build e o deploy independentes.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/vite.config.ts
    commit: '2179313'
    linhas:
    - '  // Lib mode não substitui process.env.NODE_ENV; como o React vai embutido no'
    - '  // bundle (MFE autônomo), é preciso defini-lo ou o bundle quebra no browser'
    - '  // com "ReferenceError: process is not defined".'
    - '  define: { ''process.env.NODE_ENV'': JSON.stringify(''production'') },'
    - '  build: {'
    - '    lib: {'
    - '      entry: path.resolve(__dirname, ''src/index.tsx''),'
    - '      formats: [''es''],'
    - '      fileName: () => ''endereco.js'','
    - '    },'
    - '    // React fica embutido no bundle (MFE autônomo) — NÃO marcar como external.'
    - '    rollupOptions: { output: { inlineDynamicImports: true } },'
    - '  },'
    anotacoes:
    - linha: 11
      texto: Sem esta definição, o React embutido quebra no navegador com `process is not defined`.
    - linha: 15
      texto: Um único módulo ESM, que o shell importa como Blob.
    - linha: 19
      texto: 'Tudo num arquivo só. O Vite 8 avisa no build que a opção está obsoleta e sugere `codeSplitting: false`.'
    inicio: 8
    contexto: O `mfes/endereco/vite.config.ts` configura o build do microfrontend de endereço, que compila sozinho, separado do shell, com o React embutido no bundle. O trecho abaixo é o modo biblioteca do Vite, que gera um único arquivo ESM, o formato que o shell baixa e importa em tempo de execução.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/scripts/deploy.ts
    commit: '2179313'
    linhas:
    - async function ensureBucket() {
    - '  try {'
    - '    await s3.send(new CreateBucketCommand({ Bucket: BUCKET }))'
    - '  } catch (err) {'
    - '    if ((err as { name?: string }).name !== ''BucketAlreadyOwnedByYou'') {'
    - '      // LocalStack costuma ser idempotente; ignora "já existe"'
    - '    }'
    - '  }'
    - '  await s3.send(new PutBucketPolicyCommand({'
    - '    Bucket: BUCKET,'
    - '    Policy: JSON.stringify({'
    - '      Version: ''2012-10-17'','
    - '      Statement: [{ Effect: ''Allow'', Principal: ''*'', Action: ''s3:GetObject'', Resource: `arn:aws:s3:::${BUCKET}/*` }],'
    - '    }),'
    - '  }))'
    - '  // O shell faz import() ESM cross-origin do bundle; o navegador exige CORS.'
    - '  await s3.send(new PutBucketCorsCommand({'
    - '    Bucket: BUCKET,'
    - '    CORSConfiguration: {'
    - '      CORSRules: [{ AllowedOrigins: [''*''], AllowedMethods: [''GET''], AllowedHeaders: [''*''] }],'
    - '    },'
    - '  }))'
    - '}'
    - ''
    - async function main() {
    - '  await ensureBucket()'
    - '  await s3.send(new PutObjectCommand({'
    - '    Bucket: BUCKET,'
    - '    Key: ''endereco.js'','
    - '    Body: readFileSync(''dist/endereco.js''),'
    - '    ContentType: ''application/javascript'','
    - '  }))'
    - '  console.log(`✅ deploy: ${ENDPOINT}/${BUCKET}/endereco.js`)'
    - '}'
    anotacoes:
    - linha: 22
      texto: Cria o bucket do microfrontend, que pode já existir.
    - linha: 24
      texto: 'O bloco está vazio: qualquer erro na criação do bucket é ignorado, e não só o de bucket existente.'
    - linha: 32
      texto: Leitura pública dos objetos, para o navegador baixar o bundle.
    - linha: 39
      texto: CORS para o `fetch` do shell, que roda noutra origem.
    - linha: 49
      texto: Publica o arquivo de `dist/` com a mesma chave, sobrescrevendo a versão anterior.
    inicio: 20
    contexto: O `mfes/endereco/scripts/deploy.ts` é o script de deploy próprio do microfrontend de endereço, que publica o bundle no bucket `mfe-endereco` do S3 emulado pelo LocalStack. O trecho abaixo cria o bucket, libera a leitura pública e o CORS e grava o arquivo de `dist/`, as quatro operações que tornam o bundle acessível ao navegador.
  - tipo: editor
    rotulo: arquivo
    caminho: scripts/deploy.ts
    commit: '2179313'
    linhas:
    - 'async function deployMfe(mfe: (typeof MFES)[number]): Promise<void> {'
    - '  console.log(`\n▶ ${mfe.dir}`)'
    - '  if (!existsSync(`${mfe.dir}/node_modules`)) {'
    - '    console.log(''  node_modules ausente — npm ci…'')'
    - '    run(''npm ci'', mfe.dir)'
    - '  }'
    - '  run(''npm run build'', mfe.dir)'
    - '  run(''npm run deploy'', mfe.dir)'
    - ''
    - '  const url = `${ENDPOINT}/${mfe.bucket}/${mfe.file}`'
    - '  const res = await fetch(url).catch(() => null)'
    - '  if (!res?.ok) {'
    - '    throw new Error('
    - '      `Validação falhou: ${url} respondeu ${res?.status ?? ''sem resposta''} após o deploy.`,'
    - '    )'
    - '  }'
    - '  console.log(`  ✓ publicado e validado: ${url}`)'
    - '  updateManifestIntegrity(mfe)'
    - '}'
    - ''
    - 'function updateManifestIntegrity(mfe: (typeof MFES)[number]): void {'
    - '  const bundlePath = `${mfe.dir}/dist/${mfe.file}`'
    - '  const integrity = `sha256-${createHash(''sha256'').update(readFileSync(bundlePath)).digest(''base64'')}`'
    - '  const manifest = JSON.parse(readFileSync(MANIFEST_PATH, ''utf-8'')) as Manifest'
    - '  const entry = manifest.mfes.find((item) => item.id === mfe.id)'
    - '  if (!entry) throw new Error(`Manifesto não possui entrada para o MFE "${mfe.id}".`)'
    - ''
    - '  entry.integrity = integrity'
    - '  writeFileSync(MANIFEST_PATH, `${JSON.stringify(manifest, null, 2)}\n`)'
    - '  console.log(`  ✓ manifesto atualizado: ${mfe.id} → ${integrity}`)'
    - '}'
    anotacoes:
    - linha: 72
      texto: O deploy da raiz roda o build e o deploy de cada microfrontend.
    - linha: 77
      texto: Confere que o bundle responde no bucket antes de mexer no manifesto.
    - linha: 88
      texto: Calcula o hash do arquivo local publicado.
    - linha: 94
      texto: Grava o manifesto em `public/`, que é versionado no Git.
    inicio: 66
    contexto: O `scripts/deploy.ts` da raiz do repositório é o programa que o `npm run deploy` executa para publicar todos os microfrontends em sequência. O trecho abaixo compila e publica cada microfrontend, confere que o bundle responde no bucket e grava o hash SHA-256 do arquivo no manifesto `public/mfe-manifest.json`, que o shell lê.
  - tipo: faixa
    estilo: dica
    texto: O shell lê o manifesto uma única vez, no boot da página (`src/main.tsx:27`). Depois de qualquer deploy, uma aba já aberta continua com os hashes antigos e recusa o bundle novo até ser recarregada, e o deploy da raiz grava o manifesto só depois de publicar e validar o bundle.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, as etapas do deploy da raiz para um microfrontend, do build à gravação do hash no manifesto. Percorra as etapas e depois classifique cada situação pelo resultado que ela produz no portal.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os trechos de código das etapas abaixo pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs, e cada caminho parte da raiz desse repositório no commit `2179313`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: fluxo
    titulo: Deploy da raiz para um microfrontend
    etapas:
    - titulo: LocalStack
      descricao: Confere a saúde em `/_localstack/health` e sobe o compose se necessário.
      codigo:
        arquivo: scripts/deploy.ts
        commit: '2179313'
        linhas:
        - 'async function ensureLocalStack(): Promise<void> {'
        - '  if (await isHealthy()) {'
        - '    console.log(`✓ LocalStack no ar em ${ENDPOINT}`)'
        - '    return'
        - '  }'
        destaque:
        - 2
    - titulo: Build
      descricao: Instala as dependências se faltarem e roda `tsc --noEmit && vite build` no microfrontend.
      codigo:
        arquivo: scripts/deploy.ts
        commit: '2179313'
        linhas:
        - '  if (!existsSync(`${mfe.dir}/node_modules`)) {'
        - '    console.log(''  node_modules ausente — npm ci…'')'
        - '    run(''npm ci'', mfe.dir)'
        - '  }'
        - '  run(''npm run build'', mfe.dir)'
        destaque:
        - 5
    - titulo: Publicação
      descricao: O deploy do microfrontend cria o bucket, aplica policy e CORS e envia o arquivo.
      codigo:
        arquivo: scripts/deploy.ts
        commit: '2179313'
        linhas:
        - '  run(''npm run deploy'', mfe.dir)'
        destaque:
        - 1
    - titulo: Validação
      descricao: O script baixa a URL do bundle e exige HTTP 200.
      codigo:
        arquivo: scripts/deploy.ts
        commit: '2179313'
        linhas:
        - '  const url = `${ENDPOINT}/${mfe.bucket}/${mfe.file}`'
        - '  const res = await fetch(url).catch(() => null)'
        - '  if (!res?.ok) {'
        - '    throw new Error('
        - '      `Validação falhou: ${url} respondeu ${res?.status ?? ''sem resposta''} após o deploy.`,'
        - '    )'
        - '  }'
        destaque:
        - 2
        - 3
    - titulo: Manifesto
      descricao: O SHA-256 do arquivo em `dist/` vai para o `integrity` da entrada, e o manifesto é gravado.
      codigo:
        arquivo: scripts/deploy.ts
        commit: '2179313'
        linhas:
        - '  const bundlePath = `${mfe.dir}/dist/${mfe.file}`'
        - '  const integrity = `sha256-${createHash(''sha256'').update(readFileSync(bundlePath)).digest(''base64'')}`'
        - '  const manifest = JSON.parse(readFileSync(MANIFEST_PATH, ''utf-8'')) as Manifest'
        - '  const entry = manifest.mfes.find((item) => item.id === mfe.id)'
        - '  if (!entry) throw new Error(`Manifesto não possui entrada para o MFE "${mfe.id}".`)'
        - ''
        - '  entry.integrity = integrity'
        - '  writeFileSync(MANIFEST_PATH, `${JSON.stringify(manifest, null, 2)}\n`)'
        destaque:
        - 2
        - 8
  - tipo: classificador
    enunciado: O que o portal mostra na rota do endereço em cada situação?
    categorias:
    - id: ok
      rotulo: O formulário de endereço
    - id: indisponivel
      rotulo: Módulo indisponível
    itens:
    - texto: Deploy da raiz concluído
      categoria: ok
      explicacao: Bundle e manifesto têm o mesmo hash.
    - texto: Código alterado e deploy só do microfrontend
      categoria: indisponivel
      explicacao: O bundle novo está no bucket, e o manifesto continua com o hash anterior.
    - texto: Código alterado sem nenhum deploy
      categoria: ok
      explicacao: O bucket ainda tem o bundle anterior, que corresponde ao manifesto.
    - texto: Manifesto restaurado com `git checkout` depois de um deploy
      categoria: indisponivel
      explicacao: O manifesto volta ao hash do commit, diferente do bundle publicado.
    - texto: Deploy só do microfrontend seguido do deploy da raiz
      categoria: ok
      explicacao: O deploy da raiz recalcula o hash e grava o manifesto.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é provar que a promoção parcial derruba o microfrontend e que a promoção conjunta de bundle e manifesto o restaura, comparando o hash do bundle com o do manifesto a cada etapa. Os passos 1 a 4 partem de um deploy consistente, os passos 5 a 8 publicam só o bundle e mostram a recusa por integridade, e os passos 9 e 10 promovem bundle e manifesto juntos. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo, com o `npm run dev` rodando num terminal separado.
  - tipo: faixa
    estilo: objetivo
    problema: O shell só executa o bundle de um microfrontend quando o hash SHA-256 do arquivo baixado confere com o campo `integrity` do `public/mfe-manifest.json`. O `npm run deploy` de `mfes/endereco` publica só o bundle no bucket, e quem promove uma versão nova por ele deixa no manifesto o hash da versão anterior.
    impacto: Depois de uma promoção parcial, o portal recusa o bundle e mostra `O módulo Alteração de Endereço está indisponível no momento.` para todos os usuários, e o mesmo acontece quando o manifesto chega antes do bundle. A falha nasce de uma etapa de publicação incompleta e não de um erro no código do microfrontend.
    mecanismo: O laboratório compara o hash calculado com `openssl` sobre o bundle compilado com o valor gravado no manifesto, antes e depois de uma mudança. Em seguida, aplica a promoção conjunta pelo `npm run deploy` da raiz, que publica cada bundle, confere a resposta 200 e grava o hash novo no campo `integrity`.
    comprovacao: Depois do deploy só do microfrontend, os dois hashes divergem e o console mostra `[mfe] integridade do bundle inválida`. Depois do deploy da raiz, os hashes voltam a ser iguais, o formulário de endereço reaparece sem erros no console e o `git status --short` lista o manifesto ao lado do código do microfrontend, para que os dois entrem no mesmo commit.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Conferir o LocalStack
      editor:
        rotulo: terminal
        linhas:
        - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:4566/_localstack/health
      sucesso: '`200`.'
    - titulo: Fazer o deploy da raiz
      editor:
        rotulo: terminal
        linhas:
        - npm run deploy
      efeito: deploy_inicial
      sucesso: 'A última linha `✅ deploy concluído: 2 MFEs publicados em http://localhost:4566`.'
    - titulo: Comparar o hash publicado com o manifesto
      editor:
        rotulo: terminal
        linhas:
        - printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
        - 'grep -A4 ''"id": "endereco"'' public/mfe-manifest.json'
      sucesso: O mesmo valor nas duas saídas, no formato `sha256-` seguido de 44 caracteres.
    - titulo: Abrir o endereço no portal
      texto: Entre com `usuario@teste.com` e `senha123` e clique em Alteração de Endereço.
      sucesso: O formulário com CEP, Logradouro, Número e o botão Salvar, sem erros no console.
    - titulo: Alterar o microfrontend
      texto: 'Qualquer mudança no código serve para gerar um bundle novo. Este laboratório usa como mudança um boundary interno: crie `mfes/endereco/src/FalhaInterna.tsx` com o conteúdo abaixo e, em `mfes/endereco/src/index.tsx`, importe o componente e envolva o `EnderecoApp`, como nas linhas finais do editor.'
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/FalhaInterna.tsx (novo) e index.tsx (alteração)
        commit: '2179313'
        linhas:
        - import { Component, type ReactNode } from 'react'
        - ''
        - 'type Props = { children: ReactNode }'
        - 'type State = { falhou: boolean }'
        - ''
        - // Captura erros da árvore deste microfrontend, que roda num createRoot próprio
        - // e por isso não chega ao MfeErrorBoundary do shell.
        - export class FalhaInterna extends Component<Props, State> {
        - '  state: State = { falhou: false }'
        - ''
        - '  static getDerivedStateFromError(): State {'
        - '    return { falhou: true }'
        - '  }'
        - ''
        - '  render() {'
        - '    if (this.state.falhou) return <p role="alert">O módulo de endereço encontrou um erro.</p>'
        - '    return this.props.children'
        - '  }'
        - '}'
        - ''
        - // mfes/endereco/src/index.tsx
        - import { FalhaInterna } from './FalhaInterna'
        - ''
        - '      <FalhaInterna>'
        - '        <EnderecoApp ctx={ctx} />'
        - '      </FalhaInterna>'
      efeito: mudanca
    - titulo: Publicar só o microfrontend
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npm run build && npm run deploy)
      efeito: deploy_mfe
      sucesso: '`dist/endereco.js  296.41 kB │ gzip: 78.85 kB` e `✅ deploy: http://localhost:4566/mfe-endereco/endereco.js`.'
    - titulo: Comparar de novo
      editor:
        rotulo: terminal
        linhas:
        - printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
        - 'grep -A4 ''"id": "endereco"'' public/mfe-manifest.json'
      sucesso: 'Valores diferentes: o hash do arquivo mudou, e o manifesto não.'
    - titulo: Recarregar o endereço no portal
      texto: Recarregue a página e clique em Alteração de Endereço.
      sucesso: 'A mensagem `O módulo Alteração de Endereço está indisponível no momento.` e, no console, `[mfe] falha ao carregar "Alteração de Endereço": Error: [mfe] integridade do bundle inválida`.'
    - titulo: Promover bundle e manifesto juntos
      editor:
        rotulo: terminal
        linhas:
        - npm run deploy
        - printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
        - 'grep -A4 ''"id": "endereco"'' public/mfe-manifest.json'
      efeito: deploy_raiz
      sucesso: '`✓ manifesto atualizado: endereco → sha256-+mvU7BTnqjJqM684m1pOBjoyutPPAy14guWBbJU/w+4=` e o mesmo valor nas duas comparações.'
    - titulo: Conferir o portal e o repositório
      texto: Recarregue o endereço no portal e liste os arquivos alterados com `git status --short`. O manifesto e o código do microfrontend aparecem juntos e devem ir no mesmo commit.
      sucesso: O formulário de endereço de volta, sem erros no console.

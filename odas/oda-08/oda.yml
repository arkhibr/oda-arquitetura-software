    - entrada: cd mfes/endereco && npm run build && npm run deploy
      condicao: mudanca
      saida: "> mfe-endereco@0.0.0 build\n> tsc --noEmit && vite build\n\nvite v8.0.16 building client environment for production...\n\n WARN  inlineDynamicImports option is deprecated, please use codeSplitting: false instead.\n\n\ntransforming...✓ 17 modules transformed.\nrendering chunks...\ncomputing gzip size...\ndist/endereco.js  296.41 kB │ gzip: 78.85 kB\n\n✓ built in 45ms\n\n> mfe-endereco@0.0.0 deploy\n> node --experimental-strip-types scripts/deploy.ts\n\n✅ deploy: http://localhost:4566/mfe-endereco/endereco.js"
      origem: executado
      efeito: deploy_mfe
      dica: O bundle novo está no bucket, e o manifesto continua com o hash anterior. Compare os dois nos passos seguintes.
    - entrada: printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
      condicao: deploy_raiz
      saida: sha256-+mvU7BTnqjJqM684m1pOBjoyutPPAy14guWBbJU/w+4=
      origem: executado
    - entrada: printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
      condicao: deploy_mfe
      saida: sha256-+mvU7BTnqjJqM684m1pOBjoyutPPAy14guWBbJU/w+4=
      origem: executado
      dica: Este é o hash do bundle recém-publicado, diferente do que está no manifesto.
    - entrada: printf 'sha256-%s\n' "$(openssl dgst -sha256 -binary mfes/endereco/dist/endereco.js | openssl base64 -A)"
      saida: sha256-dK2p5Vm48WkUzvjw6kZZh5eoONWmTxFA8RKXB5FO6bM=
      origem: executado
    - entrada: 'grep -A4 ''"id": "endereco"'' public/mfe-manifest.json'
      condicao: deploy_raiz
      saida: "      \"id\": \"endereco\",\n      \"name\": \"Alteração de Endereço\",\n      \"state\": \"active\",\n      \"url\": \"http://localhost:4566/mfe-endereco/endereco.js\",\n      \"integrity\": \"sha256-+mvU7BTnqjJqM684m1pOBjoyutPPAy14guWBbJU/w+4=\","
      origem: executado
      dica: O deploy da raiz gravou no manifesto o hash do bundle publicado.
    - entrada: 'grep -A4 ''"id": "endereco"'' public/mfe-manifest.json'
      saida: "      \"id\": \"endereco\",\n      \"name\": \"Alteração de Endereço\",\n      \"state\": \"active\",\n      \"url\": \"http://localhost:4566/mfe-endereco/endereco.js\",\n      \"integrity\": \"sha256-dK2p5Vm48WkUzvjw6kZZh5eoONWmTxFA8RKXB5FO6bM=\","
      origem: executado

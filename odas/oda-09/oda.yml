        - ''
        - // mfes/endereco/src/EnderecoForm.tsx
        - <form ... className="endereco-form">
        - <label className="endereco-campo">
        - <input ... className="endereco-entrada" />
        - <button type="submit" className="endereco-botao">Salvar</button>
      efeito: tema_criado
    - titulo: Rodar o teste e a verificação de tipos
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run src/theme
        - cd mfes/endereco && npx tsc --noEmit
      sucesso: '`Tests 2 failed | 2 passed (4)`, com o CSS lido como texto vazio nos testes do namespace e do token, e `TS2307` para `theme.css?raw` no TypeScript.'
    - titulo: Configurar o CSS bruto nos testes e nos tipos
      texto: No `mfes/endereco/vitest.config.ts`, acrescente a linha `css` depois de `setupFiles`, e copie `mfes/emprestimo/src/vite-env.d.ts` para `mfes/endereco/src/`, que declara o tipo de `*.css?raw`. O empréstimo já usa as duas configurações.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/vitest.config.ts (alteração) e src/vite-env.d.ts (novo)
        commit: '2179313'
        linhas:
        - '    setupFiles: [''./src/test-setup.ts''],'
        - '    // Sem esta linha, o Vitest entrega os imports `?raw` de CSS como texto vazio.'
        - '    css: { include: [/\.css\?raw$/] },'
        - ''
        - // mfes/endereco/src/vite-env.d.ts
        - /// <reference types="vite/client" />
        - ''
        - declare module '*.css?raw' {
        - '  const s: string'
        - '  export default s'
        - '}'
      efeito: raw_configurado
    - titulo: Ver o teste passar
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run src/theme
        - cd mfes/endereco && npx vitest run
        - cd mfes/endereco && npx tsc --noEmit
      sucesso: '`Tests 4 passed (4)`, a suíte do endereço com `Tests 15 passed (15)` e o `tsc` sem mensagens.'
    - titulo: Procurar a classe de novo
      editor:
        rotulo: terminal
        linhas:
        - npm run build > /dev/null && grep -o '\.bg-blue-600' dist/assets/*.css | wc -l
      sucesso: '`0`: o shell deixou de carregar CSS para o endereço.'
    - titulo: Conferir no portal

- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os três primeiros incidentes partem de saídas do laboratório, e o último, de um trecho do tema do empréstimo.
  - tipo: incidente
    titulo: Botão sem estilo depois da separação dos repositórios
    origem: executado
    rotulo_saida: log
    saida: "$ npm run build > /dev/null && grep -o '\\.bg-blue-600' dist/assets/*.css | wc -l\n       1\n\n$ mv mfes ../mfes-fora && npm run build > /dev/null; grep -o '\\.bg-blue-600' dist/assets/*.css | wc -l; mv ../mfes-fora mfes\n       0"
    pergunta: A ADR-011 recomenda um repositório por microfrontend em produção. O que acontece com o botão do endereço nesse cenário?
    correcao: Levar o endereço ao contrato da ADR-014, com CSS próprio no bundle e tokens do shell com fallback, como no laboratório.
    alternativas:
    - texto: O shell deixa de iniciar.
      correta: false
      explicacao: CSS ausente não interrompe o boot, só a aparência.
    - texto: O botão perde o estilo, porque o build do shell deixa de encontrar as classes do endereço e não as gera.
      correta: true
      explicacao: A contagem cai de 1 para 0 sem a pasta `mfes/`.
    - texto: Nada muda, porque o Tailwind gera todas as classes possíveis.
      correta: false
      explicacao: O Tailwind gera só as classes encontradas nos arquivos que varre.
  - tipo: incidente
    titulo: Teste de CSS que recebe texto vazio
    origem: executado
    rotulo_saida: log
    saida: "     × mantém todos os seletores no namespace endereco- 2ms\n     × consome a cor primária do shell com fallback local 1ms\nAssertionError: expected 0 to be greater than 0\nAssertionError: expected '' to match /var\\(--color-primary,\\s*#[0-9a-fA-F]{…/\n Test Files  1 failed (1)\n      Tests  2 failed | 2 passed (4)"
    pergunta: O `theme.css` tem seletores e o token, e os dois testes que leem o arquivo receberam texto vazio. Por quê?
    correcao: Incluir o padrão `.css?raw` em `test.css.include` do `vitest.config.ts`, como o empréstimo faz.
    alternativas:
    - texto: O arquivo `theme.css` foi salvo vazio.
      correta: false
      explicacao: O arquivo tem o token, como mostra o passo 6, e o mesmo texto vazio derruba também o teste do namespace, que exige ao menos um seletor.
    - texto: O token precisa estar em letras maiúsculas.
      correta: false
      explicacao: A expressão do teste aceita maiúsculas e minúsculas no hexadecimal.
    - texto: O Vitest substitui imports de CSS por texto vazio, inclusive com `?raw`, quando o padrão não está em `css.include`.
      correta: true
      explicacao: O `vitest.config.ts` do empréstimo documenta o mesmo comportamento no comentário da opção.
  - tipo: incidente
    titulo: Cor do ambiente que não chega ao endereço
    origem: executado
    rotulo_saida: log
    saida: "{\n  \"classe\": \"rounded bg-blue-600 px-4 py-2 text-white\",\n  \"fundo\": \"oklch(0.546 0.245 262.881)\"\n}"
    pergunta: Antes do laboratório, o ambiente define `primaryColor` no `config.json`. Por que o botão do endereço não segue essa cor?
    correcao: Ler a cor por `var(--color-primary, <fallback>)` no CSS do microfrontend, e não por uma classe de paleta fixa.
    alternativas:
    - texto: A classe `bg-blue-600` usa a cor fixa da paleta do Tailwind e não lê o token `--color-primary`.
      correta: true
      explicacao: Depois do laboratório, o mesmo botão mostrou `rgb(4, 120, 87)` com a cor do ambiente trocada.
    - texto: O `config.json` só vale para o shell em produção.
      correta: false
      explicacao: O `loadConfig` aplica a cor também em desenvolvimento.
    - texto: O microfrontend não pode ler variáveis CSS do shell.
      correta: false
      explicacao: Variáveis CSS do elemento raiz são herdadas por todo o documento, inclusive pela área do microfrontend.
  - tipo: incidente
    titulo: Propriedades declaradas duas vezes no tema do empréstimo
    origem: codigo
    rotulo_saida: arquivo
    saida: "mfes/emprestimo/src/theme/theme.css:9-13\n    --emprestimo-primary: var(--color-primary, #06422f);\n    --emprestimo-primary-hover: #083827;\n    --emprestimo-primary-soft: #e6f3ed;\n    --emprestimo-primary-hover: color-mix(in srgb, var(--emprestimo-primary) 84%, #000);\n    --emprestimo-primary-soft: color-mix(in srgb, var(--emprestimo-primary) 12%, #fff);"
    pergunta: Que valor de `--emprestimo-primary-hover` o navegador usa?
    correcao: Remover as duas declarações fixas das linhas 10 e 11, que nunca prevalecem.
    alternativas:
    - texto: Nenhum, porque declarações duplicadas invalidam o bloco.
      correta: false
      explicacao: O CSS aceita declarações repetidas e usa a última válida.
    - texto: O `color-mix` da linha 12, porque a última declaração da mesma propriedade no mesmo bloco prevalece.
      correta: true
      explicacao: As declarações das linhas 10 e 11 ficam sem efeito e só confundem a leitura.
    - texto: O `#083827` da linha 10, porque vem primeiro.
      correta: false
      explicacao: Na cascata, a declaração posterior com a mesma especificidade substitui a anterior.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Pela ADR-014, o que o shell publica para os microfrontends?
      alternativas:
      - texto: As classes de cada tela de domínio.
        correta: false
        explicacao: A ADR proíbe o shell de conhecer classes internas.
      - texto: Um arquivo CSS por microfrontend no manifesto.
        correta: false
        explicacao: A ADR exclui CSS separado no manifesto como requisito.
      - texto: Tokens e estrutura externa, sem estilizar seletores internos.
        correta: true
        explicacao: O shell governa o vocabulário visual, e o microfrontend governa a implementação local.
    - enunciado: Por que o tema é injetado no `mount` e removido no `unmount`?
      alternativas:
      - texto: Para que o CSS siga o ciclo de vida do microfrontend e não fique no documento depois que ele sai.
        correta: true
        explicacao: O teste do laboratório confere o `<style>` antes e depois do `unmount`.
      - texto: Para acelerar o build.
        correta: false
        explicacao: A injeção acontece em tempo de execução.
      - texto: Porque o shell exige.
        correta: false
        explicacao: O shell não conhece o tema dos microfrontends.
    - enunciado: 'Para que serve o valor depois da vírgula em `var(--color-primary, #1a56db)`?'
      alternativas:
      - texto: Sobrescreve o token do shell.
        correta: false
        explicacao: Quando o token existe, ele prevalece.
      - texto: É o fallback usado quando o token do shell não está definido.
        correta: true
        explicacao: O microfrontend continua coerente fora do portal.
      - texto: É uma segunda cor para o modo escuro.
        correta: false
        explicacao: O `var()` não trata temas.
    - enunciado: Por que o build do shell gerava `bg-blue-600`?
      alternativas:
      - texto: Porque o `tokens.css` declara a classe.
        correta: false
        explicacao: O `tokens.css` declara apenas variáveis.
      - texto: Porque o bundle do endereço injeta a classe.
        correta: false
        explicacao: O bundle do endereço não tinha CSS antes do laboratório.
      - texto: Porque o Tailwind do shell varre os arquivos do repositório, inclusive `mfes/endereco/src`.
        correta: true
        explicacao: O código do shell não usa a classe, e ela some do build sem a pasta `mfes/`.
    - enunciado: Depois do laboratório, o que acontece com o botão ao trocar `primaryColor` no `config.json`?
      alternativas:
      - texto: A cor muda sem novo deploy do microfrontend.
        correta: true
        explicacao: O tema lê o token que o shell aplica a partir do `config.json`.
      - texto: Nada, até um novo deploy.
        correta: false
        explicacao: O bundle lê o token em tempo de execução.
      - texto: O portal deixa de iniciar.
        correta: false
        explicacao: A cor é um valor válido de configuração.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A divisão de responsabilidades visuais da ADR-014 está clara.
    - A dependência do endereço em relação ao build do shell foi demonstrada com a contagem da classe.
    - O teste do contrato visual falhou antes do tema e passou depois, com o CSS bruto configurado.
    - O botão mostrou no portal a cor do token do shell e a cor trocada pelo `config.json`.
    - As declarações duplicadas no tema do empréstimo foram identificadas.

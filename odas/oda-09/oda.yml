id: 09
titulo: CSS e contrato visual entre microfrontends
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'A ADR-014 divide a responsabilidade visual: o shell publica tokens e a estrutura externa, e cada microfrontend carrega o próprio CSS, escopado ao seu domínio. Esta ODA mostra o contrato aplicado no microfrontend de empréstimo, revela que o de endereço depende do CSS gerado para o shell e o corrige com o teste escrito antes.'
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a divisão de responsabilidades visuais da ADR-014 entre shell, design system e microfrontend.
    - Reconhecer um tema escopado com tokens do shell e fallback local, injetado no `mount` e removido no `unmount`.
    - Demonstrar que o microfrontend de endereço depende de classes geradas no build do shell.
    - Levar o endereço ao contrato com o teste escrito e rodado antes, e conferir no portal a cor vinda do token.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: As ODAs 07 e 08, com as dependências de `mfes/endereco` instaladas e o LocalStack acessível para o deploy do passo 13. O passo 2 move a pasta `mfes/` temporariamente e a devolve no mesmo comando.
  - tipo: terminal
    titulo: terminal · CSS gerado para o shell
    comandos:
    - entrada: npm run build > /dev/null && grep -o '\.bg-blue-600' dist/assets/*.css | wc -l
      saida: '       1'
      origem: executado
      dica: O valor 1 indica que a classe está no CSS gerado para o shell.
    cenarios:
    - rotulo: Procurar bg-blue-600 no CSS do shell
      comando: npm run build > /dev/null && grep -o '\.bg-blue-600' dist/assets/*.css | wc -l
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: A ADR-014 descarta concentrar todo o CSS no shell, porque o shell passaria a conhecer o HTML dos microfrontends, e descarta deixar cada microfrontend com a própria identidade, porque o portal ficaria fragmentado. A decisão combina tokens do shell com CSS local de cada microfrontend.
  - tipo: comparativo
    colunas:
    - Shell
    - Microfrontend
    linhas:
    - dimensao: Publica
      valores:
      - Tokens como `--color-primary` e `--font-family-sans`, reset e layout externo
      - CSS local com seletores do próprio namespace
    - dimensao: Não deve
      valores:
      - Estilizar seletores internos de microfrontends
      - Definir reset global ou estilizar `html`, `body` e `:root`
    - dimensao: Ciclo de vida
      valores:
      - CSS global carregado no boot
      - CSS injetado no `mount` e removido no `unmount`
    - dimensao: No commit `2179313`
      valores:
      - '`tokens.css` com cinco tokens e `config.json` com as cores do ambiente'
      - Empréstimo com tema escopado, e endereço com classes do Tailwind do shell
  - tipo: conceito
    titulo: Token com fallback
    texto: 'O microfrontend lê o token do shell com `var(--color-primary, #1a56db)`. Quando o shell define o token, a cor do portal prevalece, e quando o microfrontend roda isolado, como num teste ou noutra aplicação, o valor local garante uma aparência coerente.'
  - tipo: adr
    id: ADR-014
    titulo: CSS e contrato visual em microfrontends dinâmicos
    status: Proposed
    contexto: As ADRs 008 e 009 definiram a carga em tempo de execução e o contrato técnico, e faltava definir quem é dono do CSS e da identidade visual, sem acoplar o shell aos seletores internos e sem fragmentar o portal.
    decisao: Contrato visual por tokens globais do shell, design system compartilhável e CSS local de cada microfrontend, escopado ao seu domínio.
    alternativas: Todo o CSS no shell, descartado pelo acoplamento ao HTML dos microfrontends, e todo o CSS em cada microfrontend, descartado pela fragmentação visual.
    consequencias: Os microfrontends mantêm autonomia de implantação e o portal mantém consistência, ao custo de disciplina de versionamento visual e de alguma duplicação de CSS nos bundles.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, os tokens do shell, o tema do empréstimo e as classes do endereço. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/styles/tokens.css
    commit: '2179313'
    linhas:
    - '@theme {'
    - '  --color-primary: #1A56DB;'
    - '  --color-secondary: #6B7280;'
    - '  --color-danger: #E02424;'
    - '  --color-surface: #F9FAFB;'
    - '  --font-family-sans: "Inter", sans-serif;'
    - '}'
    anotacoes:
    - linha: 2
      texto: Token de cor primária, que o `config.json` pode sobrescrever em tempo de execução.
    - linha: 6
      texto: Fonte do portal, consumida pelos microfrontends que seguem o contrato.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/config/index.ts
    commit: '2179313'
    linhas:
    - '  const root = document.documentElement'
    - '  if (data.primaryColor) root.style.setProperty(''--color-primary'', data.primaryColor)'
    - '  if (data.secondaryColor) root.style.setProperty(''--color-secondary'', data.secondaryColor)'
    anotacoes:
    - linha: 59
      texto: O `config.json` do ambiente redefine o token no elemento raiz do documento.
    inicio: 58
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/emprestimo/src/theme/inject.ts
    commit: '2179313'
    linhas:
    - import css from './theme.css?raw'
    - ''
    - 'export function injectTheme(host: HTMLElement): () => void {'
    - '  const style = document.createElement(''style'')'
    - '  style.setAttribute(''data-emprestimo-theme'', '''')'
    - '  style.textContent = css'
    - '  host.prepend(style)'
    - '  return () => style.remove()'
    - '}'
    anotacoes:
    - linha: 1
      texto: O CSS vai como texto dentro do bundle, sem arquivo separado no manifesto.
    - linha: 7
      texto: O `<style>` entra no elemento entregue pelo shell.
    - linha: 8
      texto: A função devolvida remove o tema no `unmount`.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/emprestimo/src/theme/theme.css
    commit: '2179313'
    linhas:
    - .emprestimo-app {
    - '    --emprestimo-ink: #111817;'
    - '    --emprestimo-muted: var(--color-secondary, #65716e);'
    - '    --emprestimo-subtle: #87918e;'
    - '    --emprestimo-line: #dfe6df;'
    - '    --emprestimo-line-strong: #c8d4cb;'
    - '    --emprestimo-surface: var(--color-surface, #f7faf7);'
    - '    --emprestimo-panel: #ffffff;'
    - '    --emprestimo-primary: var(--color-primary, #06422f);'
    - '    --emprestimo-primary-hover: #083827;'
    - '    --emprestimo-primary-soft: #e6f3ed;'
    - '    --emprestimo-primary-hover: color-mix(in srgb, var(--emprestimo-primary) 84%, #000);'
    - '    --emprestimo-primary-soft: color-mix(in srgb, var(--emprestimo-primary) 12%, #fff);'
    - '    --emprestimo-accent: #c89412;'
    - '    --emprestimo-accent-soft: #fff4d6;'
    - '    --emprestimo-danger: var(--color-danger, #b4233a);'
    anotacoes:
    - linha: 1
      texto: Todos os seletores começam pelo namespace do microfrontend.
    - linha: 9
      texto: Token do shell com fallback local.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/EnderecoForm.tsx
    commit: '2179313'
    linhas:
    - '  return ('
    - '    <form onSubmit={handleSubmit((data) => onSubmit(data))} className="flex max-w-md flex-col gap-4">'
    - '      <label className="flex flex-col gap-1">CEP<input {...register(''cep'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Logradouro<input {...register(''logradouro'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Número<input {...register(''numero'')} className="rounded border p-2" /></label>'
    - '      <button type="submit" className="rounded bg-blue-600 px-4 py-2 text-white">Salvar</button>'
    - '    </form>'
    - '  )'
    anotacoes:
    - linha: 16
      texto: 'Classes utilitárias do Tailwind, que o microfrontend não compila: o CSS delas vem do build do shell.'
    inicio: 11
  - tipo: faixa
    estilo: dica
    texto: O `mfes/endereco/package.json` não tem Tailwind entre as dependências, e o `src/app/styles/globals.css` do shell importa o Tailwind, que gera classes a partir dos arquivos que encontra no repositório, inclusive em `mfes/`.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Percorra a origem da cor do botão Salvar antes e depois do laboratório, e classifique regras de CSS conforme o contrato da ADR-014.
  - tipo: fluxo
    titulo: De onde vem a cor do botão Salvar
    etapas:
    - titulo: 'Antes: classe do Tailwind'
      descricao: O botão tem `rounded bg-blue-600 px-4 py-2 text-white`, e o navegador calcula `oklch(0.546 0.245 262.881)`, a cor fixa da paleta do Tailwind, sem relação com o token do portal.
    - titulo: 'Antes: quem gera a classe'
      descricao: O CSS da classe existe porque o build do shell encontrou `bg-blue-600` em `mfes/endereco/src`. Sem a pasta `mfes/`, o mesmo build não gera a classe.
    - titulo: 'Depois: tema do microfrontend'
      descricao: 'O botão tem `endereco-botao`, e o tema injetado no `mount` define o fundo como `var(--endereco-primary)`, que lê `var(--color-primary, #1a56db)`.'
    - titulo: 'Depois: token do shell'
      descricao: O navegador calcula `rgb(26, 86, 219)`, que é o `#1A56DB` do shell, e a fonte `Inter, sans-serif`.
    - titulo: 'Depois: cor do ambiente'
      descricao: Com `primaryColor` igual a `#047857` no `config.json`, o mesmo bundle passa a mostrar `rgb(4, 120, 87)`, sem novo deploy.
  - tipo: classificador
    enunciado: Cada regra de CSS respeita o contrato da ADR-014?
    categorias:
    - id: sim
      rotulo: Respeita
    - id: nao
      rotulo: Viola
    itens:
    - texto: '`.endereco-botao { background: var(--color-primary, #1a56db) }` no tema do endereço'
      categoria: sim
      explicacao: Seletor no namespace do microfrontend e token do shell com fallback.
    - texto: '`body { font-family: Arial }` no tema de um microfrontend'
      categoria: nao
      explicacao: O microfrontend não pode estilizar o documento, e o teste do empréstimo recusa `body`.
    - texto: '`.emprestimo-card { padding: 12px }` no `globals.css` do shell'
      categoria: nao
      explicacao: O shell não pode depender de classes internas, como confere o `visualContract.test.ts`.
    - texto: '`--color-primary: #1A56DB` no `tokens.css` do shell'
      categoria: sim
      explicacao: Publicar tokens é responsabilidade do shell.
    - texto: Botão do microfrontend com `bg-blue-600`, gerado pelo build do shell
      categoria: nao
      explicacao: O microfrontend passa a depender do CSS do shell e do repositório compartilhado.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no repositório clonado na ODA 00. Os passos 1 a 3 mostram a dependência do endereço em relação ao CSS do shell, os passos 4 a 12 aplicam o contrato com o teste escrito antes, e o passo 13 confere o resultado no portal.
  - tipo: passos
    itens:
    - titulo: Procurar a classe no CSS do shell
      editor:
        rotulo: terminal
        linhas:
        - npm run build > /dev/null && grep -o '\.bg-blue-600' dist/assets/*.css | wc -l
      sucesso: '`1`: a classe `bg-blue-600` está no CSS gerado para o shell.'
    - titulo: Repetir sem a pasta mfes
      texto: O comando move `mfes/` para fora do repositório, refaz o build, conta a classe e devolve a pasta.
      editor:
        rotulo: terminal
        linhas:
        - mv mfes ../mfes-fora && npm run build > /dev/null; grep -o '\.bg-blue-600' dist/assets/*.css | wc -l; mv ../mfes-fora mfes
      sucesso: '`0`: sem os microfrontends, o shell não gera a classe que o botão do endereço usa.'
    - titulo: Rodar a linha de base do endereço
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run
      sucesso: '`Test Files 4 passed (4)` e `Tests 11 passed (11)`.'
    - titulo: Escrever o teste do contrato visual
      texto: Crie o arquivo abaixo em `mfes/endereco`. Ele confere o namespace dos seletores, o token com fallback, a injeção do tema e as classes usadas na tela.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/theme/__tests__/contratoVisual.test.tsx (novo)
        commit: '2179313'
        linhas:
        - import { describe, it, expect, vi, afterEach } from 'vitest'
        - import css from '../theme.css?raw'
        - import { mount, unmount } from '../../index'
        - ''
        - afterEach(() => vi.unstubAllGlobals())
        - ''
        - 'const ctx = { apiUrl: '''', token: ''t'', onUnauthorized: () => {}, basePath: ''/endereco'' }'
        - ''
        - 'function seletores(): string[] {'
        - '  return [...css.replace(/\/\*[\s\S]*?\*\//g, '''').matchAll(/([^{}]+)\{/g)]'
        - '    .flatMap((m) => (m[1] ?? '''').split('','').map((s) => s.trim()))'
        - '    .filter((s) => s !== '''' && !s.startsWith(''@''))'
        - '}'
        - ''
        - describe('ADR-014 contrato visual do MFE endereço', () => {
        - '  it(''mantém todos os seletores no namespace endereco-'', () => {'
        - '    expect(seletores().length).toBeGreaterThan(0)'
        - '    expect(seletores().filter((s) => !s.startsWith(''.endereco-''))).toEqual([])'
        - '  })'
        - ''
        - '  it(''consome a cor primária do shell com fallback local'', () => {'
        - '    expect(css).toMatch(/var\(--color-primary,\s*#[0-9a-fA-F]{6}\)/)'
        - '  })'
        - ''
        - '  it(''injeta o tema no mount e o remove no unmount'', async () => {'
        - '    vi.stubGlobal(''fetch'', vi.fn(async () => new Response(JSON.stringify({ cep: '''', logradouro: '''', numero: '''' }))))'
        - '    const el = document.createElement(''div'')'
        - '    mount(el, ctx)'
        - '    expect(el.querySelector(''style[data-endereco-theme]'')).not.toBeNull()'
        - '    await vi.waitFor(() => expect(el.querySelector(''button'')).not.toBeNull())'
        - '    unmount(el)'
        - '    expect(el.querySelector(''style[data-endereco-theme]'')).toBeNull()'
        - '  })'
        - ''
        - '  it(''usa apenas classes do próprio namespace'', async () => {'
        - '    vi.stubGlobal(''fetch'', vi.fn(async () => new Response(JSON.stringify({ cep: '''', logradouro: '''', numero: '''' }))))'
        - '    const el = document.createElement(''div'')'
        - '    mount(el, ctx)'
        - '    await vi.waitFor(() => expect(el.querySelector(''button'')).not.toBeNull())'
        - '    const classes = [...el.querySelectorAll(''[class]'')].flatMap((n) => [...n.classList])'
        - '    expect(classes.filter((c) => !c.startsWith(''endereco-''))).toEqual([])'
        - '    unmount(el)'
        - '  })'
        - '})'
      efeito: teste_tema
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - cd mfes/endereco && npx vitest run src/theme
      sucesso: '`Failed to resolve import "../theme.css?raw"`, porque o tema ainda não existe.'
    - titulo: Criar o tema do endereço
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/theme/theme.css (novo)
        commit: '2179313'
        linhas:
        - .endereco-app {
        - '  --endereco-primary: var(--color-primary, #1a56db);'
        - '  --endereco-line: var(--color-secondary, #6b7280);'
        - '  --endereco-ink: #111827;'
        - '  --endereco-success: #047857;'
        - '  display: grid;'
        - '  gap: 16px;'
        - '  color: var(--endereco-ink);'
        - '  font-family: var(--font-family-sans, system-ui, sans-serif);'
        - '}'
        - ''
        - .endereco-titulo {
        - '  margin: 0;'
        - '  font-size: 1.25rem;'
        - '  font-weight: 700;'
        - '}'
        - ''
        - .endereco-form {
        - '  display: flex;'
        - '  flex-direction: column;'
        - '  gap: 16px;'
        - '  max-width: 28rem;'
        - '}'
        - ''
        - .endereco-campo {
        - '  display: flex;'
        - '  flex-direction: column;'
        - '  gap: 4px;'
        - '}'
        - ''
        - .endereco-entrada {
        - '  border: 1px solid var(--endereco-line);'
        - '  border-radius: 4px;'
        - '  padding: 8px;'
        - '}'
        - ''
        - .endereco-botao {
        - '  border: 0;'
        - '  border-radius: 4px;'
        - '  padding: 8px 16px;'
        - '  background: var(--endereco-primary);'
        - '  color: #ffffff;'
        - '}'
        - ''
        - .endereco-status {
        - '  color: var(--endereco-success);'
        - '}'
    - titulo: Injetar o tema no mount
      texto: Crie o `inject.ts` abaixo, no mesmo formato do empréstimo, e substitua o `src/index.tsx` pela segunda parte do editor, que injeta o tema e monta a raiz React num contêiner próprio.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/theme/inject.ts (novo) e src/index.tsx (alteração)
        commit: '2179313'
        linhas:
        - import css from './theme.css?raw'
        - ''
        - 'export function injectTheme(host: HTMLElement): () => void {'
        - '  const style = document.createElement(''style'')'
        - '  style.setAttribute(''data-endereco-theme'', '''')'
        - '  style.textContent = css'
        - '  host.prepend(style)'
        - '  return () => style.remove()'
        - '}'
        - ''
        - // mfes/endereco/src/index.tsx
        - import { StrictMode } from 'react'
        - import { createRoot, type Root } from 'react-dom/client'
        - import { EnderecoApp } from './EnderecoApp'
        - import { injectTheme } from './theme/inject'
        - import type { MfeMountContext } from './contract'
        - ''
        - const roots = new WeakMap<HTMLElement, Root>()
        - const containers = new WeakMap<HTMLElement, HTMLElement>()
        - const disposers = new WeakMap<HTMLElement, () => void>()
        - ''
        - 'export function mount(el: HTMLElement, ctx: MfeMountContext): void {'
        - '  disposers.set(el, injectTheme(el))'
        - '  const container = document.createElement(''div'')'
        - '  el.append(container)'
        - '  containers.set(el, container)'
        - ''
        - '  const root = createRoot(container)'
        - '  roots.set(el, root)'
        - '  root.render('
        - '    <StrictMode>'
        - '      <EnderecoApp ctx={ctx} />'
        - '    </StrictMode>,'
        - '  )'
        - '}'
        - ''
        - 'export function unmount(el: HTMLElement): void {'
        - '  roots.get(el)?.unmount()'
        - '  roots.delete(el)'
        - '  containers.get(el)?.remove()'
        - '  containers.delete(el)'
        - '  disposers.get(el)?.()'
        - '  disposers.delete(el)'
        - '}'
    - titulo: Trocar as classes dos componentes
      texto: Substitua as classes do Tailwind pelas classes do namespace, conforme a lista abaixo.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/src/EnderecoApp.tsx e EnderecoForm.tsx (alteração)
        commit: '2179313'
        linhas:

id: '10'
titulo: Gateway de API
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O Gateway é a porta única entre os microfrontends e os BFFs, e cada requisição atravessa uma cadeia de seis middlewares antes do proxy. Esta ODA percorre essa cadeia, revela que o Gateway entrega 500 para respostas que o BFF devolveu com sucesso, embora os 19 testes passem, e acrescenta um limite próprio para o envio de propostas, com o teste escrito antes.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a ordem dos middlewares do Gateway e o que cada um faz antes e depois do `next()`.
    - Distinguir as respostas 401, 404 e 429 produzidas no Gateway das respostas vindas do BFF.
    - Reproduzir num teste com o servidor HTTP do Node uma falha que o `app.request()` não reproduz, e corrigi-la no proxy.
    - Acrescentar um limite por usuário para `POST /bff/emprestimo/propostas`, com o teste escrito e rodado antes.
    - Reconhecer as requisições que escapam da auditoria e do controle de tráfego.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: 'As ODAs 00 e 04. O laboratório usa três terminais na raiz do repositório: um para o BFF de empréstimo, um para o Gateway e um para os comandos. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.'
  - tipo: terminal
    titulo: terminal · Gateway e BFF no ar
    comandos:
    - entrada: 'TOKEN=$(cd gateway && node --input-type=module -e "import { SignJWT } from ''jose''; console.log(await new SignJWT({ roles: [''cliente''] }).setProtectedHeader({ alg: ''HS256'' }).setSubject(''cliente-1'').setIssuer(''portal-dev'').setAudience(''portal-api'').setExpirationTime(''15m'').sign(new TextEncoder().encode(''segredo-local'')))")'
      saida: ''
      origem: executado
      dica: O comando grava na variável `TOKEN` um JWT HS256 assinado com o segredo de desenvolvimento, sem imprimir nada.
    - entrada: 'curl -i -H "Authorization: Bearer $TOKEN" -H "Origin: http://localhost:5173" http://localhost:4000/bff/emprestimo/contratos'
      saida: 'HTTP/1.1 500 Internal Server Error

        access-control-allow-origin: http://localhost:5173

        content-type: text/plain; charset=UTF-8

        vary: Origin

        x-correlation-id: …

        content-length: 21

        Date: …

        Connection: keep-alive

        Keep-Alive: timeout=5


        Internal Server Error'
      origem: executado
    - entrada: (cd gateway && npx vitest run)
      saida: " RUN  v4.1.9 ./gateway\n\n\n Test Files  6 passed (6)\n      Tests  19 passed (19)"
      origem: executado
    cenarios:
    - rotulo: Contratos pelo Gateway
      comando: 'curl -i -H "Authorization: Bearer $TOKEN" -H "Origin: http://localhost:5173" http://localhost:4000/bff/emprestimo/contratos'
    - rotulo: Testes do Gateway
      comando: (cd gateway && npx vitest run)
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: A ADR-015 coloca no Gateway a correlação, a autenticação, a auditoria e o controle de tráfego, e deixa a adaptação de contrato para os BFFs. A ADR-016 troca o Express pelo Hono, e com isso o proxy e o limitador passaram a ser código próprio.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Sequência
    titulo: Cadeia de middlewares de gateway/src/app.ts
    mermaid: "sequenceDiagram\n    participant MFE as Microfrontend\n    participant C as correlationId\n    participant O as cors\n    participant A as auth\n    participant L as auditLog\n    participant R as limites\n    participant P as proxy\n    participant B as BFF\n    MFE->>C: requisição\n    C->>O: next()\n    O->>A: next()\n    alt token ausente ou inválido\n        A-->>MFE: 401, sem auditoria e sem limite\n    end\n    A->>L: next()\n    L->>R: next()\n    alt limite excedido\n        R-->>L: 429\n    end\n    R->>P: next()\n    alt nome de BFF desconhecido\n        P-->>L: 404\n    end\n    P->>B: fetch com identidade interna\n    B-->>P: resposta\n    P-->>L: resposta do BFF\n    L-->>MFE: auditoria gravada depois do next()"
  - tipo: conceito
    titulo: Antes e depois do next()
    texto: Cada middleware recebe o contexto e chama `await next()` para passar a vez. O código antes do `next()` age na ida, como a autenticação, e o código depois age na volta, como a auditoria e o cabeçalho `Vary` do CORS. O `auth` responde 401 sem chamar `next()`, e por isso a auditoria e os limites não executam para essa requisição.
  - tipo: conceito
    titulo: Janela fixa em memória
    texto: O limitador guarda, para cada chave, um contador e o instante em que a janela de 60 segundos termina, e recomeça a contagem quando esse instante passa. A chave junta um prefixo, como `global`, `mutating` ou `proposal`, ao `sub` do token autenticado. O contador vive na memória do processo, e por isso duas instâncias do Gateway mantêm contadores separados para o mesmo usuário.
  - tipo: comparativo
    colunas:
    - Gateway
    - BFF
    linhas:
    - dimensao: Responde por
      valores:
      - Correlação, CORS, autenticação, auditoria, limites e roteamento por `/bff/<nome>`
      - Contrato do microfrontend, validação de payload e autorização por recurso
    - dimensao: Conhece
      valores:
      - Nomes e URLs dos BFFs, sem nenhum campo de contrato
      - Formato do back-end legado e do microfrontend
    - dimensao: Exposição
      valores:
      - Porta 4000, pública
      - Portas 4001 e 4002, acessíveis com `X-Internal-Gateway-Key`
    - dimensao: Respostas próprias
      valores:
      - 401, 404 e 429
      - 400, 404, 413 e as respostas de negócio
  - tipo: adr
    id: ADR-015
    titulo: Gateway de API com BFFs
    status: Proposed
    contexto: Cada microfrontend falava direto com o back-end legado, sem ponto único de auditoria nem controle de taxa de requisições.
    decisao: Um Gateway faz correlação, controle de tráfego e auditoria e roteia por `/bff/<nome>` para BFFs que adaptam o contrato.
    alternativas: Gateway como proxy fino com as três responsabilidades em cada BFF, BFFs expostos diretamente e manter a chamada direta ao legado.
    consequencias: Toda requisição ganha um salto de rede, e a plataforma passa a operar três serviços novos, com auditoria e limites num único lugar.
  - tipo: adr
    id: ADR-016
    titulo: Hono como framework web de Gateway e BFFs
    status: Proposed
    contexto: O Gateway dependia de `express-rate-limit` e `http-proxy-middleware`, que só existiam para adaptar o modelo do Express.
    decisao: Hono sobre `@hono/node-server`, com limitador em memória próprio e proxy por `fetch()` nativo.
    alternativas: Fastify com plugins oficiais de proxy e de limite, e manter o Express.
    consequencias: Menos dependências e Web Standards nativos, e o proxy e o limitador passam a ser código próprio, coberto apenas pelos testes da equipe.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, a montagem da cadeia e os middlewares que respondem sem chamar o BFF. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/app.ts
    commit: '2179313'
    linhas:
    - 'export function createApp(config: GatewayConfig): Hono<GatewayEnv> {'
    - '  const app = new Hono<GatewayEnv>()'
    - ''
    - '  app.use(correlationId)'
    - '  app.use(cors({ origin: config.corsOrigin }))'
    - '  app.use(createAuthentication(config.auth))'
    - '  app.use(createAuditLog(config.auditLogPath, config.bffs))'
    - ''
    - '  const { global, mutating } = createRateLimiters(config.rateLimit)'
    - '  app.use(global)'
    - '  app.use(mutating)'
    - ''
    - '  app.all(''*'', createProxyRouter(config.bffs, config.internalGatewayKey))'
    - ''
    - '  return app'
    - '}'
    anotacoes:
    - linha: 14
      texto: 'Primeiro da cadeia: toda resposta, inclusive 401 e 429, leva o `X-Correlation-Id`.'
    - linha: 16
      texto: A autenticação vem antes da auditoria e dos limites.
    - linha: 17
      texto: A auditoria só vê requisições que passaram pela autenticação.
    - linha: 23
      texto: O proxy é o último elo e atende qualquer método e caminho.
    inicio: 11
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/correlationId.ts
    commit: '2179313'
    linhas:
    - 'export const correlationId: MiddlewareHandler<GatewayEnv> = async (c, next) => {'
    - '  const incoming = c.req.header(''x-correlation-id'')'
    - '  const id = incoming && /^[A-Za-z0-9_-]{1,128}$/.test(incoming) ? incoming : randomUUID()'
    - '  c.set(''correlationId'', id)'
    - '  c.header(''X-Correlation-Id'', id)'
    - '  await next()'
    - '}'
    anotacoes:
    - linha: 7
      texto: Aceita o identificador recebido só se ele tiver formato seguro.
    - linha: 9
      texto: O cabeçalho é preparado antes do `next()` e copiado para a resposta final.
    inicio: 5
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/auth.ts
    commit: '2179313'
    linhas:
    - '  return async (c, next) => {'
    - '    const authorization = c.req.header(''authorization'')'
    - '    const match = authorization?.match(/^Bearer ([A-Za-z0-9._~-]+)$/)'
    - '    if (!match) {'
    - '      return c.json({ error: ''unauthorized'', message: ''Token Bearer ausente ou inválido.'' }, 401)'
    - '    }'
    anotacoes:
    - linha: 25
      texto: Exige o formato `Bearer <token>`.
    - linha: 27
      texto: 'Responde sem chamar `next()`: os middlewares seguintes não executam.'
    inicio: 23
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/rateLimit.ts
    commit: '2179313'
    linhas:
    - '  return async (c, next) => {'
    - '    if (!opts.applies(c.req.method)) {'
    - '      await next()'
    - '      return'
    - '    }'
    - ''
    - '    const now = Date.now()'
    - '    const identity = c.get(''auth'')?.sub ?? c.req.header(''x-forwarded-for'') ?? ''unknown'''
    - '    const key = `${opts.keyPrefix}:${identity}`'
    - '    const bucket = buckets.get(key)'
    - ''
    - '    if (!bucket || bucket.resetAt <= now) {'
    - '      buckets.set(key, { count: 1, resetAt: now + opts.windowMs })'
    - '      await next()'
    - '      return'
    - '    }'
    - ''
    - '    if (bucket.count >= opts.max) {'
    - '      return c.json({'
    - '        error: ''rate_limit_exceeded'','
    - '        message: ''Limite de requisições excedido.'','
    - '        correlationId: c.get(''correlationId'') ?? ''unknown'','
    - '      }, 429)'
    - '    }'
    - ''
    - '    bucket.count += 1'
    - '    await next()'
    - '  }'
    anotacoes:
    - linha: 26
      texto: O limitador de mutação usa esta saída para ignorar GET e HEAD.
    - linha: 32
      texto: A chave é o `sub` do token, sempre presente porque a autenticação vem antes.
    - linha: 36
      texto: 'Janela fixa: ao vencer, o contador recomeça em 1.'
    - linha: 47
      texto: A resposta 429 sai do Gateway, sem chamar o BFF.
    inicio: 25
  - tipo: editor
    rotulo: arquivo
    caminho: gateway/src/proxy.ts
    commit: '2179313'
    linhas:
    - '    const remainder = pathname.slice(`/bff/${target.name}`.length)'
    - '    const url = new URL(remainder === '''' ? ''/'' : remainder, target.baseUrl)'
    - '    url.search = new URL(c.req.url).search'
    - ''
    - '    const headers = new Headers(c.req.raw.headers)'
    - '    headers.delete(''authorization'')'
    - '    headers.delete(''host'')'
    - '    const auth = c.get(''auth'')'
    - '    headers.set(''X-Correlation-Id'', c.get(''correlationId'') ?? ''unknown'')'
    - '    headers.set(''X-Internal-Gateway-Key'', internalGatewayKey)'
    - '    headers.set(''X-Authenticated-Subject'', auth.sub)'
    - '    headers.set(''X-Authenticated-Roles'', auth.roles.join('',''))'
    - ''
    - '    const hasBody = c.req.method !== ''GET'' && c.req.method !== ''HEAD'''
    - '    const init: RequestInit & { duplex?: ''half'' } = { method: c.req.method, headers }'
    - '    if (hasBody) {'
    - '      init.body = c.req.raw.body'
    - '      init.duplex = ''half'''
    - '    }'
    - ''
    - '    return fetch(url, init)'
    - '  }'
    anotacoes:
    - linha: 17
      texto: Remove o prefixo `/bff/<nome>` antes de encaminhar.
    - linha: 22
      texto: O Bearer não segue para o BFF.
    - linha: 26
      texto: A chave interna prova ao BFF que a chamada veio do Gateway.
    - linha: 37
      texto: Devolve a resposta do `fetch` sem cópia, e os middlewares da volta tentam gravar cabeçalhos nela.
    inicio: 17
  - tipo: faixa
    estilo: dica
    texto: Os testes de `app.test.ts` chamam `createApp(config).request(...)`, o cliente de teste do Hono, que não abre porta nem passa pelo `@hono/node-server`. O `index.ts` usa o `serve` desse pacote, que substitui o `Request` e o `Response` globais por versões próprias.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Envie ao Gateway as requisições abaixo, com respostas capturadas antes e depois do laboratório, e depois classifique onde cada requisição termina.
  - tipo: console-api
    cenarios:
    - rotulo: Antes · contratos com token válido
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/emprestimo/contratos
        cabecalhos:
          Authorization: Bearer <token HS256 de cliente-1>
          Origin: http://localhost:5173
      resposta:
        status: 500
        corpo: Internal Server Error
      origem: executado
      nota: O BFF respondeu 200, e o Gateway falhou ao gravar cabeçalhos na resposta do `fetch`.
    - rotulo: Depois · contratos com token válido
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/emprestimo/contratos
        cabecalhos:
          Authorization: Bearer <token HS256 de cliente-1>
          Origin: http://localhost:5173
      resposta:
        status: 200
        corpo: []
      origem: executado
      nota: 'Com a cópia da resposta no proxy, chegam também `access-control-allow-origin`, `vary: Origin` e `x-correlation-id`.'
    - rotulo: Depois · terceira proposta no minuto
      requisicao:
        metodo: POST
        url: http://localhost:4000/bff/emprestimo/propostas
        cabecalhos:
          Authorization: Bearer <token HS256 de cliente-1>
        corpo:
          valorLiquido: 10000
          numeroParcelas: 24
          linhaCredito: 205
          dataLiberacao: '2026-06-30'
      resposta:
        status: 429
        corpo:
          error: rate_limit_exceeded
          message: Limite de requisições excedido.
          correlationId: fdb0d1ff-2e6c-493c-83d8-d5055cba2e22
      origem: executado
      nota: Com `RATE_LIMIT_PROPOSAL_MAX=2`, a terceira proposta para no Gateway, e o BFF não recebe a chamada.
    - rotulo: Token inválido
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/emprestimo/contratos
        cabecalhos:
          Authorization: Bearer invalido
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Token Bearer ausente ou inválido.
      origem: executado
      nota: Em 120 tentativas seguidas, todas receberam 401, nenhuma recebeu 429, e nenhuma entrou na auditoria.
    - rotulo: BFF desconhecido
      requisicao:
        metodo: GET
        url: http://localhost:4000/bff/inexistente/foo
        cabecalhos:
          Authorization: Bearer <token válido>
      resposta:
        status: 404
        corpo:
          error: not_found
          message: Rota não encontrada.
          correlationId: <uuid>
      origem: codigo
      nota: Resposta montada pelo `createProxyRouter` quando `resolveTarget` devolve `null`, conferida pelo teste `responde 404 para um BFF desconhecido`.
  - tipo: fluxo
    titulo: Uma proposta atravessa o Gateway depois do laboratório
    etapas:
    - titulo: correlationId
      descricao: Gera um UUID, guarda no contexto e prepara o cabeçalho `X-Correlation-Id`.
    - titulo: cors
      descricao: 'Na ida, responde ao preflight `OPTIONS`. Na volta, acrescenta `Vary: Origin` à resposta.'
    - titulo: auth
      descricao: Valida algoritmo, assinatura, emissor, audiência, expiração e `sub`, e guarda `{ sub, roles }` no contexto.
    - titulo: auditLog
      descricao: Registra o início e, depois do `next()`, grava uma linha JSON com status e duração, sem esperar a escrita.
    - titulo: limites
      descricao: O global conta toda requisição, o de mutação conta POST, PUT, PATCH e DELETE, e o de propostas conta só o `POST` dessa rota.
    - titulo: proxy
      descricao: Troca o Bearer pela identidade interna, chama o BFF e devolve uma cópia da resposta, que os middlewares da volta podem alterar.
  - tipo: classificador
    enunciado: Com o laboratório aplicado e `RATE_LIMIT_PROPOSAL_MAX=2`, onde cada requisição termina?
    categorias:
    - id: auth
      rotulo: 401 no auth
    - id: limite
      rotulo: 429 num limite
    - id: proxy
      rotulo: 404 no proxy
    - id: bff
      rotulo: Resposta do BFF
    itens:
    - texto: '`GET /bff/emprestimo/contratos` sem o cabeçalho `Authorization`'
      categoria: auth
      explicacao: O `auth` responde sem chamar `next()`.
    - texto: Terceiro `POST /bff/emprestimo/propostas` do mesmo usuário em um minuto
      categoria: limite
      explicacao: O limitador de propostas já contou dois envios na janela.
    - texto: '`GET /bff/inexistente/x` com token válido'
      categoria: proxy
      explicacao: O `resolveTarget` não encontra o nome no mapa de BFFs.
    - texto: Token assinado com outro segredo
      categoria: auth
      explicacao: A verificação da assinatura falha e o `auth` devolve 401.
    - texto: Centésima primeira requisição `GET` do mesmo usuário em um minuto
      categoria: limite
      explicacao: O limite global padrão é de 100 requisições por janela.
    - texto: '`GET /bff/emprestimo/propostas` repetido quatro vezes'
      categoria: bff
      explicacao: O limitador de propostas ignora métodos diferentes de `POST`.
    - texto: '`GET /saude` com token válido'
      categoria: proxy
      explicacao: O Gateway não tem rota de saúde, e o caminho fora de `/bff/*` recebe 404.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos na raiz do repositório clonado na ODA 00. Os passos 1 a 8 reproduzem e corrigem a falha do proxy, os passos 9 a 14 acrescentam o limite de propostas com o teste escrito antes, e o passo 15 confere o resultado com os serviços no ar.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Instalar as dependências
      editor:
        rotulo: terminal
        linhas:
        - (cd gateway && npm ci)
        - (cd bffs/emprestimo && npm ci)
      sucesso: '`added 72 packages` no Gateway e `added 69 packages` no BFF de empréstimo.'
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - (cd gateway && npx vitest run)
        - (cd gateway && npx tsc --noEmit)
      sucesso: '`Test Files 6 passed (6)` e `Tests 19 passed (19)`, e o `tsc` sem mensagens.'
    - titulo: Subir o BFF e o Gateway
      texto: Rode cada comando num terminal próprio e deixe os dois abertos. A variável `RATE_LIMIT_PROPOSAL_MAX` ainda não tem efeito e passa a valer no passo 11.
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/emprestimo && npm start)
        - (cd gateway && JWT_SHARED_SECRET=segredo-local RATE_LIMIT_PROPOSAL_MAX=2 npm start)
      sucesso: '`BFF-emprestimo ouvindo em http://localhost:4001` e `Gateway ouvindo em http://localhost:4000`.'
    - titulo: Chamar o Gateway com um token válido
      texto: No terceiro terminal, gere o token e peça os contratos. Depois, olhe o terminal do Gateway.
      editor:
        rotulo: terminal
        linhas:
        - 'TOKEN=$(cd gateway && node --input-type=module -e "import { SignJWT } from ''jose''; console.log(await new SignJWT({ roles: [''cliente''] }).setProtectedHeader({ alg: ''HS256'' }).setSubject(''cliente-1'').setIssuer(''portal-dev'').setAudience(''portal-api'').setExpirationTime(''15m'').sign(new TextEncoder().encode(''segredo-local'')))")'
        - 'curl -i -H "Authorization: Bearer $TOKEN" -H "Origin: http://localhost:5173" http://localhost:4000/bff/emprestimo/contratos'
      sucesso: '`HTTP/1.1 500 Internal Server Error`, e o terminal do Gateway mostra `TypeError: immutable`.'
    - titulo: Escrever o teste no servidor do Node
      texto: Crie o arquivo abaixo. Ele sobe um BFF falso e o Gateway com o `serve` do `@hono/node-server`, o mesmo do `index.ts`, e faz a chamada por HTTP.
      editor:
        rotulo: arquivo
        caminho: gateway/src/__tests__/servidorNode.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { afterEach, describe, expect, it } from 'vitest'
        - import { createServer } from 'node:http'
        - import type { Server } from 'node:http'
        - import type { AddressInfo } from 'node:net'
        - import { once } from 'node:events'
        - import { mkdtempSync, rmSync } from 'node:fs'
        - import { tmpdir } from 'node:os'
        - import { join } from 'node:path'
        - import { serve } from '@hono/node-server'
        - import { SignJWT } from 'jose'
        - import { createApp } from '../app.ts'
        - import type { GatewayConfig } from '../config.ts'
        - ''
        - 'const servidores: { close: (fim: () => void) => unknown }[] = []'
        - 'let pasta: string | undefined'
        - ''
        - afterEach(async () => {
        - '  for (const s of servidores.splice(0)) await new Promise<void>((resolve) => s.close(() => resolve()))'
        - '  if (pasta) rmSync(pasta, { recursive: true, force: true, maxRetries: 3 })'
        - '  pasta = undefined'
        - '})'
        - ''
        - 'async function porta(servidor: Server): Promise<number> {'
        - '  servidores.push(servidor)'

- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os três primeiros incidentes partem de saídas do laboratório, e o último, de um trecho do README do Gateway.
  - tipo: incidente
    titulo: Propostas criadas com resposta 500
    origem: executado
    rotulo_saida: log
    saida: "$ for i in 1 2 3; do curl -s -w ' %{http_code}\\n' -X POST -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json' -d '{\"valorLiquido\":10000,\"numeroParcelas\":24,\"linhaCredito\":205,\"dataLiberacao\":\"2026-06-30\"}' http://localhost:4000/bff/emprestimo/propostas; done\nInternal Server Error 500\nInternal Server Error 500\nInternal Server Error 500\n\n$ grep -o '\"status\":[0-9]*' gateway/logs/audit.log | sort | uniq -c\n   3 \"status\":201\n   1 \"status\":500"
    pergunta: Antes da correção do proxy, o cliente recebeu 500 nas três propostas. O que aconteceu com elas no BFF?
    correcao: Copiar a resposta do `fetch` no proxy, como no passo 7. Enquanto a falha existir, uma nova tentativa do cliente cria outra proposta.
    alternativas:
    - texto: O Gateway bloqueou as propostas antes do proxy.
      correta: false
      explicacao: Antes do laboratório não existe limite para essa rota, e o limite de mutação padrão é de 20 por minuto.
    - texto: O BFF criou as três propostas e respondeu 201, que a auditoria registrou. A falha aconteceu na volta, quando o Gateway tentou gravar cabeçalhos na resposta.
      correta: true
      explicacao: A auditoria lê o status depois do `next()`, antes de o CORS gravar o `Vary` e derrubar a resposta.
    - texto: O BFF recusou as propostas por falta da chave interna.
      correta: false
      explicacao: Sem a chave, o BFF responderia 401, e a auditoria mostra 201.
  - tipo: incidente
    titulo: Tentativas com token inválido sem limite nem auditoria
    origem: executado
    rotulo_saida: log
    saida: "$ for i in $(seq 1 120); do curl -s -o /dev/null -w '%{http_code}\\n' -H \"Authorization: Bearer invalido\" http://localhost:4000/bff/emprestimo/contratos; done | sort | uniq -c\n 120 401\n\n$ grep -c '\"status\":401' gateway/logs/audit.log\n0"
    pergunta: Por que nenhuma das 120 tentativas recebeu 429 nem entrou na auditoria?
    correcao: Registrar a auditoria antes da autenticação e aplicar às requisições sem identidade um limite próprio, com chave de origem confiável, e não o `x-forwarded-for` informado pelo cliente.
    alternativas:
    - texto: O limite global só conta requisições com status 200.
      correta: false
      explicacao: O limitador conta antes do `next()`, sem olhar o status.
    - texto: A auditoria descarta respostas de erro.
      correta: false
      explicacao: A auditoria registra 429 e 500, como mostra o incidente anterior.
    - texto: O `auth` responde 401 sem chamar `next()`, e a auditoria e os limites estão depois dele na cadeia.
      correta: true
      explicacao: A ordem está em `app.ts`, linhas 16 a 21.
  - tipo: incidente
    titulo: Falha eventual no app.test.ts
    origem: executado
    rotulo_saida: log
    saida: " FAIL  src/__tests__/app.test.ts > createApp > libera CORS para a origem configurada\nError: ENOTEMPTY, Directory not empty: $TMPDIR/gateway-app-pLIKVw '$TMPDIR/gateway-app-pLIKVw'\n ❯ src/__tests__/app.test.ts:17:16\n     17|   if (tempDir) rmSync(tempDir, { recursive: true, force: true })"
    pergunta: O teste falha em algumas execuções e passa nas seguintes, sem mudança de código. Qual é a causa?
    correcao: 'Usar `rmSync(tempDir, { recursive: true, force: true, maxRetries: 3 })` no `afterEach`, como fazem os testes do laboratório.'
    alternativas:
    - texto: A auditoria grava com `appendFile` sem esperar, e o `afterEach` apaga a pasta temporária enquanto a gravação ainda cria o arquivo.
      correta: true
      explicacao: Em 60 execuções da suíte final, o `app.test.ts` falhou 4 vezes com `ENOTEMPTY`, e os dois testes novos não falharam.
    - texto: Dois testes usam a mesma pasta temporária.
      correta: false
      explicacao: O `mkdtempSync` cria uma pasta com nome único a cada configuração.
    - texto: O BFF falso continua no ar depois do teste.
      correta: false
      explicacao: O `afterEach` fecha o servidor antes de apagar a pasta, e a mensagem cita a pasta, e não a porta.
  - tipo: incidente
    titulo: Limite documentado por IP
    origem: codigo
    rotulo_saida: arquivo
    saida: "gateway/README.md\n| `RATE_LIMIT_GLOBAL_MAX` | Requisições/minuto por IP (todas as rotas) | `100` |\n| `RATE_LIMIT_MUTATING_MAX` | Requisições/minuto por IP para POST/PUT/DELETE/PATCH | `20` |\n\ngateway/src/rateLimit.ts:32\n    const identity = c.get('auth')?.sub ?? c.req.header('x-forwarded-for') ?? 'unknown'"
    pergunta: Em `createApp`, qual valor identifica quem está sendo limitado?
    correcao: Corrigir o README para "por usuário autenticado (`sub`)", como já diz a tabela de estrutura do mesmo arquivo.
    alternativas:
    - texto: O `X-Correlation-Id`.
      correta: false
      explicacao: O identificador de correlação muda a cada requisição e não serve de chave.
    - texto: O `sub` do token, porque o `auth` sempre grava a identidade antes dos limitadores.
      correta: true
      explicacao: O `x-forwarded-for` só seria usado sem autenticação antes do limitador, como no `rateLimit.test.ts`.
    - texto: O IP do cliente, como diz o README.
      correta: false
      explicacao: O IP é a segunda opção do operador `??` e não chega a ser lido.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Pela ADR-015, o que fica no Gateway e o que fica no BFF?
      alternativas:
      - texto: O Gateway converte PascalCase em camelCase.
        correta: false
        explicacao: A transformação de mensagem fica no BFF de empréstimo.
      - texto: Cada BFF aplica os próprios limites de tráfego.
        correta: false
        explicacao: Essa é a Opção 2, descartada pela duplicação.
      - texto: O Gateway cuida de correlação, autenticação, auditoria e tráfego, e o BFF adapta o contrato do microfrontend.
        correta: true
        explicacao: O Gateway não conhece nenhum campo de contrato.
    - enunciado: Por que os 19 testes passavam com o Gateway entregando 500?
      alternativas:
      - texto: O `app.request()` não passa pelo `@hono/node-server`, e a falha só aparece com o servidor que o `index.ts` usa.
        correta: true
        explicacao: O teste do passo 5 sobe o mesmo `serve` e reproduz a falha.
      - texto: Os testes não usam CORS.
        correta: false
        explicacao: O `app.test.ts` confere o `access-control-allow-origin`.
      - texto: Os testes não chamam um BFF.
        correta: false
        explicacao: O primeiro teste do `app.test.ts` sobe um BFF falso.
    - enunciado: Que requisições o limitador de propostas conta?
      alternativas:
      - texto: Também o `DELETE /bff/emprestimo/propostas/:id`.
        correta: false
        explicacao: O caminho e o método são outros.
      - texto: Só `POST /bff/emprestimo/propostas`, por usuário.
        correta: true
        explicacao: O `app.use` recebe o caminho exato, e o `applies` aceita só `POST`.
      - texto: Todo `POST` do BFF de empréstimo.
        correta: false
        explicacao: O teste do passo 9 confere que a simulação não é limitada.
    - enunciado: Com duas instâncias do Gateway atrás de um balanceador e `RATE_LIMIT_PROPOSAL_MAX=5`, quantas propostas por minuto um usuário consegue enviar?
      alternativas:
      - texto: Exatamente 5, porque o limite segue o `sub`.
        correta: false
        explicacao: A chave é a mesma, mas os mapas são de processos diferentes.
      - texto: Nenhuma, porque as instâncias entram em conflito.
        correta: false
        explicacao: As instâncias não trocam informação.
      - texto: Até 10, porque cada instância mantém os contadores na própria memória.
        correta: true
        explicacao: A ADR-016 lista o limite distribuído como gatilho de revisão.
    - enunciado: Qual middleware age depois do `next()`?
      alternativas:
      - texto: A auditoria, que grava status e duração depois que a resposta existe.
        correta: true
        explicacao: 'O CORS também age na volta, ao acrescentar `Vary: Origin`.'
      - texto: A autenticação.
        correta: false
        explicacao: Ela decide na ida e encerra a cadeia com 401.
      - texto: O proxy.
        correta: false
        explicacao: O proxy é o último elo e não chama `next()`.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A ordem dos middlewares de `app.ts` e o papel de cada um na ida e na volta estão claros.
    - O teste com o servidor do Node falhou com 500 antes da cópia da resposta e passou depois.
    - O teste do limite de propostas falhou antes do limitador e passou depois, com os tipos conferidos.
    - Com os serviços no ar, a terceira proposta recebeu 429 sem chegar ao BFF.
    - As requisições que escapam da auditoria e dos limites foram identificadas.

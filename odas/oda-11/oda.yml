id: '11'
titulo: BFF e adaptação do contrato legado
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é acrescentar um campo do sistema legado ao contrato que um BFF entrega ao microfrontend, com teste e medição de desempenho. No `frontend-react`, o BFF de empréstimo lê o legado em PascalCase e devolve um contrato próprio em camelCase, escolhendo campo a campo o que passa, o que muda de nome e o que fica de fora. Você vai acrescentar a data de término do empréstimo com o teste escrito antes e medir o efeito com o benchmark do próprio BFF.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar por que a ADR-015 coloca a transformação de mensagem no BFF, e não no Gateway nem no microfrontend.
    - Ler um mapeamento do `transform.ts` e reconhecer renomeação, achatamento, valor padrão e descarte.
    - Mapear `VencimentoDoContrato` para `vencimentoFinal`, com o teste escrito e rodado antes.
    - Comparar o benchmark antes e depois da mudança e separar diferença real de ruído de medição.
    - Reconhecer dados que o legado entrega de forma diferente na lista e no detalhe.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, preparado como indica a faixa do Laboratório. O laboratório chama o BFF diretamente na porta 4001, com os cabeçalhos internos que o Gateway enviaria, e usa dois terminais na raiz do repositório. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · legado e contrato
    comandos:
    - entrada: grep -o '"[A-Za-z]*":' bffs/emprestimo/src/fixtures/contratos.list.json | sort | uniq -c
      saida: "   2 \"CodigoDaLinha\":\n   2 \"Conta\":\n   2 \"Contrato\":\n   1 \"DataDeLiberacaoDoContrato\":\n   1 \"DataDeVencimentoInicial\":\n   1 \"DataDoProximoVencimento\":\n   2 \"DescricaoDaLinha\":\n   2 \"FormaDePagamento\":\n   1 \"LinhaDeEmprestimo\":\n   2 \"NumeroDeParcelas\":\n   1 \"NumeroDoContrato\":\n   2 \"ParcelasEmAtraso\":\n   2 \"ParcelasRestantes\":\n   2 \"ProximaParcela\":\n   1 \"Quitado\":\n   2 \"SaldoAtual\":\n   2 \"TaxaDaCETAnual\":\n   2 \"TaxaDaCETMensal\":\n   2 \"TaxaDeJuros\":\n   2 \"TemParcelasEmAtraso\":\n   2 \"Valor\":\n   2 \"ValorBruto\":\n   1 \"ValorDaPrestacao\":\n   1 \"ValorDoSaldoAtual\":\n   2 \"ValorLiberado\":\n   1 \"ValorNoProximoVencimento\":\n   2 \"Vencimento\":\n   1 \"VencimentoDaParcela\":\n   2 \"VencimentoDoContrato\":"
      origem: executado
      dica: Os campos com contagem 1 aparecem num só contrato ou dentro de `ParcelasEmAtraso`.
    - entrada: 'curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos'
      saida: '[{"numero":"123456-7","linhaDeCredito":"Crédito Pessoal","valorLiberado":15000,"saldoAtual":9245.5,"parcelas":24,"parcelasRestantes":14,"taxaDeJuros":1.89,"cetMensal":2.11,"cetAnual":28.7,"temAtraso":false,"proximaParcela":{"vencimento":"2026-07-10","valor":944.3}},{"numero":"654321-0","linhaDeCredito":"Refinanciamento Consignado","valorLiberado":8300,"saldoAtual":4132.99,"parcelas":18,"parcelasRestantes":8,"taxaDeJuros":1.49,"cetMensal":1.72,"cetAnual":22.8,"temAtraso":true,"proximaParcela":{"vencimento":"2026-07-05","valor":615.8}}]'
      origem: executado
    cenarios:
    - rotulo: Campos do legado
      comando: grep -o '"[A-Za-z]*":' bffs/emprestimo/src/fixtures/contratos.list.json | sort | uniq -c
    - rotulo: Contratos no BFF
      comando: 'curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba explica o papel de um BFF: adaptar o formato do sistema legado ao microfrontend que ele atende, enquanto o Gateway continua genérico, sem conhecer campo de nenhum contrato, como registra a ADR-015. O BFF de empréstimo transforma o contrato, e o de endereço apenas repassa um formato que já é limpo.'
  - tipo: comparativo
    colunas:
    - Legado
    - Contrato do BFF
    linhas:
    - dimensao: Convenção
      valores:
      - PascalCase, com nomes como `TaxaDaCETMensal` e `TemParcelasEmAtraso`
      - camelCase, com nomes curtos como `cetMensal` e `temAtraso`
    - dimensao: Campos opcionais
      valores:
      - Ausentes quando não há valor
      - Sempre presentes, com `0`, `false`, `null` ou `'—'`
    - dimensao: Estrutura
      valores:
      - Objetos aninhados, como `StatusDaProposta.Value`
      - Valores achatados, como `status`
    - dimensao: Escopo
      valores:
      - Tudo que o sistema de origem tem, inclusive `Conta` e `CpfDoCliente`
      - Só o que a tela usa
  - tipo: conceito
    titulo: Anticorruption layer
    texto: O `transform.ts` isola o microfrontend do vocabulário do legado. Quando o legado muda um nome, a correção fica num mapeamento do BFF, e o microfrontend continua a ler o mesmo contrato.
  - tipo: conceito
    titulo: Ausente, null e valor padrão
    texto: O contrato do BFF escolhe, campo a campo, o que fazer quando o legado não envia o dado. `cetMensal` vira `0` e `temAtraso` vira `false`, o que esconde a ausência, e `proximaParcela` vira `null`, o que obriga a tela a tratar a falta do dado.
  - tipo: conceito
    titulo: Micro-benchmark
    texto: O `vitest bench` repete uma função milhões de vezes e informa a vazão em `hz` e o erro relativo em `rme`. A ADR-005 registra que os números absolutos dependem da máquina e que o uso do benchmark está na comparação entre medições do mesmo ambiente.
  - tipo: adr
    id: ADR-015
    titulo: Gateway de API com BFFs
    status: Proposed
    contexto: O microfrontend de empréstimo lia o contrato `.svc` em PascalCase, que espelha o payload do servidor.
    decisao: Um BFF por microfrontend na topologia inicial, responsável por transformar a mensagem do legado no contrato do microfrontend.
    alternativas: Transformação no Gateway, descartada para mantê-lo genérico, e microfrontend falando direto com o legado.
    consequencias: O microfrontend deixa de conhecer o formato legado, e as fixtures do MSW do shell e as do BFF podem divergir com o tempo.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `2179313`, os dois contratos, o do legado e o do BFF, a função que transforma um no outro, a rota que a usa e o benchmark que mede a transformação. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/emprestimo/src/legacyBackend.ts
    commit: '2179313'
    linhas:
    - export interface ContratoLegacy {
    - '  Contrato: string'
    - '  DescricaoDaLinha: string'
    - '  ValorLiberado: number'
    - '  SaldoAtual: number'
    - '  NumeroDeParcelas: number'
    - '  ParcelasRestantes: number'
    - '  TaxaDeJuros: number'
    - '  TaxaDaCETMensal?: number'
    - '  TaxaDaCETAnual?: number'
    - '  TemParcelasEmAtraso?: boolean'
    - '  ProximaParcela?: { Vencimento?: string; Valor?: number }'
    - '}'
    anotacoes:
    - linha: 19
      texto: 'Opcional no legado: o contrato pode chegar sem CET.'
    - linha: 22
      texto: Objeto aninhado com campos opcionais.
    inicio: 11
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/emprestimo/src/transform.ts
    commit: '2179313'
    linhas:
    - 'export function toContrato(d: ContratoLegacy): Contrato {'
    - '  const p = d.ProximaParcela'
    - '  return {'
    - '    numero: d.Contrato,'
    - '    linhaDeCredito: d.DescricaoDaLinha,'
    - '    valorLiberado: d.ValorLiberado,'
    - '    saldoAtual: d.SaldoAtual,'
    - '    parcelas: d.NumeroDeParcelas,'
    - '    parcelasRestantes: d.ParcelasRestantes,'
    - '    taxaDeJuros: d.TaxaDeJuros,'
    - '    cetMensal: d.TaxaDaCETMensal ?? 0,'
    - '    cetAnual: d.TaxaDaCETAnual ?? 0,'
    - '    temAtraso: d.TemParcelasEmAtraso ?? false,'
    - '    proximaParcela: p?.Vencimento != null && p.Valor != null'
    - '      ? { vencimento: p.Vencimento, valor: p.Valor }'
    - '      : null,'
    - '  }'
    - '}'
    anotacoes:
    - linha: 16
      texto: 'Renomeação: `Contrato` vira `numero`.'
    - linha: 23
      texto: 'Valor padrão: sem CET, o contrato informa `0`.'
    - linha: 25
      texto: 'Valor padrão: sem o dado, o contrato informa que não há atraso.'
    - linha: 26
      texto: 'Achatamento: só os dois campos que a tela usa, ou `null`.'
    inicio: 13
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/emprestimo/src/routes/contratos.ts
    commit: '2179313'
    linhas:
    - '  router.get(''/contratos'', (c) => {'
    - '    return c.json(listarContratos(authenticatedSubject(c)).map(toContrato))'
    - '  })'
    - ''
    - '  router.get(''/contratos/:id'', (c) => {'
    - '    const owner = authenticatedSubject(c)'
    - '    const id = c.req.param(''id'')'
    - '    if (!isResourceId(id)) {'
    - '      return c.json({ error: ''invalid_request'', message: ''Identificador de contrato inválido.'' }, 400)'
    - '    }'
    - '    const contrato = obterContrato(owner, id)'
    - '    if (!contrato) {'
    - '      return c.json({ error: ''not_found'', message: ''Contrato não encontrado.'' }, 404)'
    - '    }'
    - '    return c.json(toContrato(contrato))'
    - '  })'
    anotacoes:
    - linha: 12
      texto: A lista aplica o mesmo `toContrato` a cada item do legado.
    - linha: 21
      texto: O detalhe vem de outra fonte do legado, com outro conjunto de campos.
    inicio: 11
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/emprestimo/src/legacyBackend.ts
    commit: '2179313'
    linhas:
    - 'export function obterContrato(owner: string, id: string): ContratoLegacy | undefined {'
    - '  if (owner !== FIXTURE_OWNER || !contratosList.some((contrato) => contrato.Contrato === id)) return undefined'
    - '  return id === contratosDetail.Contrato ? contratosDetail : contratosList.find((contrato) => contrato.Contrato === id)'
    - '}'
    anotacoes:
    - linha: 163
      texto: Para `123456-7`, o detalhe usa `contratos.detail.json`, e não o item da lista.
    inicio: 161
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/emprestimo/src/transform.bench.ts
    commit: '2179313'
    linhas:
    - describe('transform', () => {
    - '  bench(''toContrato (um item)'', () => {'
    - '    toContrato(contratoLegacy)'
    - '  })'
    - '  bench(''toProposta (um item)'', () => {'
    - '    toProposta(propostaLegacy)'
    - '  })'
    - '  bench(''toContrato — lista de 100'', () => {'
    - '    for (let i = 0; i < 100; i++) toContrato(contratoLegacy)'
    - '  })'
    - '})'
    anotacoes:
    - linha: 22
      texto: Cada `bench` mede a função isolada, repetida milhares de vezes.
    - linha: 29
      texto: Cem transformações por iteração, como numa lista grande.
    inicio: 21
  - tipo: faixa
    estilo: dica
    texto: O microfrontend declara a própria cópia do contrato em `mfes/emprestimo/src/domain/index.ts`. Um campo novo no BFF chega ao navegador, mas o TypeScript do microfrontend só o conhece quando essa cópia é atualizada à mão, porque nenhum compilador compara as duas declarações.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula o BFF sem executar o projeto. Envie as requisições abaixo, capturadas antes e depois do laboratório, acompanhe um contrato da fixture até a resposta e classifique o que o BFF faz com cada campo do legado.
  - tipo: console-api
    cenarios:
    - rotulo: Antes · lista de contratos
      requisicao:
        metodo: GET
        url: http://localhost:4001/contratos
        cabecalhos:
          X-Internal-Gateway-Key: development-only-gateway-key
          X-Authenticated-Subject: user1
      resposta:
        status: 200
        corpo:
        - numero: 123456-7
          linhaDeCredito: Crédito Pessoal
          valorLiberado: 15000
          saldoAtual: 9245.5
          parcelas: 24
          parcelasRestantes: 14
          taxaDeJuros: 1.89
          cetMensal: 2.11
          cetAnual: 28.7
          temAtraso: false
          proximaParcela:
            vencimento: '2026-07-10'
            valor: 944.3
      origem: executado
      nota: Primeiro dos dois contratos. O legado tem `VencimentoDoContrato`, e o contrato não tem campo equivalente.
    - rotulo: Depois · lista de contratos
      requisicao:
        metodo: GET
        url: http://localhost:4001/contratos
        cabecalhos:
          X-Internal-Gateway-Key: development-only-gateway-key
          X-Authenticated-Subject: user1
      resposta:
        status: 200
        corpo:
        - numero: 123456-7
          linhaDeCredito: Crédito Pessoal
          valorLiberado: 15000
          saldoAtual: 9245.5
          parcelas: 24
          parcelasRestantes: 14
          taxaDeJuros: 1.89
          cetMensal: 2.11
          cetAnual: 28.7
          temAtraso: false
          proximaParcela:
            vencimento: '2026-07-10'
            valor: 944.3
          vencimentoFinal: '2027-08-10'
      origem: executado
      nota: Primeiro dos dois contratos, agora com `vencimentoFinal`.
    - rotulo: Depois · detalhe do contrato
      requisicao:
        metodo: GET
        url: http://localhost:4001/contratos/123456-7
        cabecalhos:
          X-Internal-Gateway-Key: development-only-gateway-key
          X-Authenticated-Subject: user1
      resposta:
        status: 200
        corpo:
          numero: 123456-7
          linhaDeCredito: Crédito Pessoal
          valorLiberado: 15000
          saldoAtual: 9245.5
          parcelas: 24
          parcelasRestantes: 14
          taxaDeJuros: 1.89
          cetMensal: 2.11
          cetAnual: 28.7
          temAtraso: false
          proximaParcela:
            vencimento: '2026-07-10'
            valor: 944.3
          vencimentoFinal: null
      origem: executado
      nota: 'O mesmo contrato, lido de `contratos.detail.json`, chega com `vencimentoFinal: null`.'
    - rotulo: Sem a chave interna
      requisicao:
        metodo: GET
        url: http://localhost:4001/contratos
      resposta:
        status: 401
        corpo:
          error: unauthorized
          message: Requisição interna não autenticada.
      origem: codigo
      nota: Resposta do `createInternalAuthentication` de `bffs/emprestimo/src/auth.ts` quando falta `X-Internal-Gateway-Key` ou `X-Authenticated-Subject`.
  - tipo: fluxo
    titulo: Do arquivo do legado à resposta do BFF
    etapas:
    - titulo: Leitura da fixture
      descricao: Ao importar `legacyBackend.ts`, o BFF lê `contratos.list.json` e `contratos.detail.json` uma única vez.
    - titulo: Autenticação interna
      descricao: O BFF confere `X-Internal-Gateway-Key` com comparação em tempo constante e grava o `sub` recebido no contexto.
    - titulo: Filtro por dono
      descricao: '`listarContratos` devolve os contratos só para `user1`, o dono das fixtures, e uma lista vazia para os demais.'
    - titulo: Transformação
      descricao: '`toContrato` renomeia, achata e completa os campos, e descarta `Conta`, `CodigoDaLinha`, `ValorBruto` e `Quitado`.'
    - titulo: Resposta
      descricao: '`c.json` serializa o contrato em camelCase, que o Gateway repassa ao microfrontend sem alterar o corpo.'
  - tipo: classificador
    enunciado: O que o `toContrato` faz com cada campo do legado?
    categorias:
    - id: renomeia
      rotulo: Renomeia
    - id: padrao
      rotulo: Completa com valor padrão
    - id: achata
      rotulo: Achata ou reduz
    - id: descarta
      rotulo: Descarta
    itens:
    - texto: '`Contrato`'
      categoria: renomeia
      explicacao: Vira `numero`.
    - texto: '`TaxaDaCETAnual` ausente'
      categoria: padrao
      explicacao: 'Vira `cetAnual: 0`.'
    - texto: '`ProximaParcela.FormaDePagamento`'
      categoria: achata
      explicacao: A próxima parcela chega com `vencimento` e `valor`, e a forma de pagamento fica de fora.
    - texto: '`Conta`'
      categoria: descarta
      explicacao: A tela não usa a conta, e o contrato não tem campo para ela.
    - texto: '`TemParcelasEmAtraso` ausente'
      categoria: padrao
      explicacao: 'Vira `temAtraso: false`.'
    - texto: '`DescricaoDaLinha`'
      categoria: renomeia
      explicacao: Vira `linhaDeCredito`.
    - texto: '`CodigoDaLinha`'
      categoria: descarta
      explicacao: O teste de rotas confere que `CodigoDaLinha` não aparece na resposta.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer o BFF devolver a data de término do empréstimo, com um teste que define o formato e um benchmark que mede o custo. Os passos 1 a 4 medem o ponto de partida, os passos 5 a 10 acrescentam o campo com o teste escrito antes, e os passos 11 e 12 comparam o benchmark e conferem a resposta do BFF. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa acima.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Instalar as dependências do BFF
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/emprestimo && npm ci)
      sucesso: '`added 69 packages`.'
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/emprestimo && npx vitest run)
        - (cd bffs/emprestimo && npx tsc --noEmit)
      sucesso: '`Test Files 9 passed (9)` e `Tests 62 passed (62)`, e o `tsc` sem mensagens.'
    - titulo: Subir o BFF e comparar o legado com o contrato
      texto: Suba o BFF num terminal próprio e, no outro, liste os campos da fixture e chame a lista de contratos.
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/emprestimo && npm start)
        - grep -o '"[A-Za-z]*":' bffs/emprestimo/src/fixtures/contratos.list.json | sort | uniq -c
        - 'curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos'
      sucesso: '`2 "VencimentoDoContrato":` na fixture e nenhum campo de vencimento final na resposta.'
    - titulo: Medir o benchmark antes da mudança
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/emprestimo && npx vitest bench --run --outputJson /tmp/bench-antes.json)
      sucesso: Três linhas de resultado, com `toContrato (um item)` na casa de dezenas de milhões de operações por segundo, e `Benchmark report written to /tmp/bench-antes.json`.
    - titulo: Escrever o teste do campo novo
      texto: Crie o arquivo abaixo. Ele confere o mapeamento, o `null` na ausência, a lista e o detalhe.
      editor:
        rotulo: arquivo
        caminho: bffs/emprestimo/src/__tests__/vencimentoFinal.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, expect, it } from 'vitest'
        - import { Hono } from 'hono'
        - import { toContrato } from '../transform.ts'
        - import { createContratosRouter } from '../routes/contratos.ts'
        - import type { ContratoLegacy } from '../legacyBackend.ts'
        - import type { BffEnv } from '../types.ts'
        - ''
        - 'const legado: ContratoLegacy = {'
        - '  Contrato: ''123456-7'', DescricaoDaLinha: ''Crédito Pessoal'', ValorLiberado: 15000,'
        - '  SaldoAtual: 9245.5, NumeroDeParcelas: 24, ParcelasRestantes: 14, TaxaDeJuros: 1.89,'
        - '  VencimentoDoContrato: ''2027-08-10'','
        - '}'
        - ''
        - function app() {
        - '  const app = new Hono<BffEnv>()'
        - '  app.use(async (c, next) => {'
        - '    c.set(''auth'', { sub: ''user1'', roles: [] })'
        - '    await next()'
        - '  })'
        - '  app.route(''/'', createContratosRouter())'
        - '  return app'
        - '}'
        - ''
        - describe('vencimento final do contrato', () => {
        - '  it(''mapeia VencimentoDoContrato para vencimentoFinal'', () => {'
        - '    expect(toContrato(legado).vencimentoFinal).toBe(''2027-08-10'')'
        - '  })'
        - ''
        - '  it(''usa null quando o legado não informa o vencimento'', () => {'
        - '    const { VencimentoDoContrato: _ausente, ...semVencimento } = legado'
        - '    expect(toContrato(semVencimento).vencimentoFinal).toBeNull()'
        - '  })'
        - ''
        - '  it(''expõe o vencimento na lista de contratos'', async () => {'
        - '    const lista = (await (await app().request(''/contratos'')).json()) as { vencimentoFinal: string | null }[]'

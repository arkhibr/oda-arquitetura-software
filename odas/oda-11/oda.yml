      saida: " RUN  v4.1.9 ./bffs/emprestimo\n\n\n ✓ src/transform.bench.ts > transform 10507ms\n     name                                  hz     min     max    mean     p75     p99    p995    p999     rme   samples\n   · toContrato (um item)       44,725,201.46  0.0000  0.0508  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.09%  22362601\n   · toProposta (um item)       44,302,379.20  0.0000  2.0433  0.0000  0.0000  0.0000  0.0000  0.0001  ±1.01%  22151190\n   · toContrato — lista de 100   1,815,419.73  0.0005  0.3755  0.0006  0.0005  0.0007  0.0007  0.0009  ±0.28%    907710\n\n BENCH  Summary\n\n  toContrato (um item) - src/transform.bench.ts > transform\n    1.01x faster than toProposta (um item)\n    24.64x faster than toContrato — lista de 100\n\nBenchmark report written to /tmp/bench-antes.json"
      origem: executado
      dica: Os valores absolutos dependem da máquina. O arquivo `/tmp/bench-antes.json` guarda a medição para a comparação do passo 11.
    - entrada: (cd bffs/emprestimo && npx vitest bench --run --compare /tmp/bench-antes.json)
      condicao: campo_mapeado
      saida: " RUN  v4.1.9 ./bffs/emprestimo\n\n\n ✓ src/transform.bench.ts > transform 10613ms\n     name                                  hz     min      max    mean     p75     p99    p995    p999     rme   samples\n   · toContrato (um item)       44,697,459.11  0.0000   0.0681  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.08%  22348730  [1.00x] ⇓\n     toContrato (um item)       44,725,201.46  0.0000   0.0508  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.09%  22362601  (baseline)\n   · toProposta (um item)       45,189,048.73  0.0000   0.3899  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.18%  22594525  [1.02x] ⇑\n     toProposta (um item)       44,302,379.20  0.0000   2.0433  0.0000  0.0000  0.0000  0.0000  0.0001  ±1.01%  22151190  (baseline)\n   · toContrato — lista de 100   1,749,556.36  0.0005  16.6634  0.0006  0.0005  0.0007  0.0007  0.0009  ±6.53%    874779  [0.96x] ⇓\n     toContrato — lista de 100   1,815,419.73  0.0005   0.3755  0.0006  0.0005  0.0007  0.0007  0.0009  ±0.28%    907710  (baseline)\n\n BENCH  Summary\n\n  toProposta (um item) - src/transform.bench.ts > transform\n    1.01x faster than toContrato (um item)\n    25.83x faster than toContrato — lista de 100"
      origem: executado
    - entrada: (cd bffs/emprestimo && npx vitest bench --run --compare /tmp/bench-antes.json)
      saida: " RUN  v4.1.9 ./bffs/emprestimo\n\n\n ✓ src/transform.bench.ts > transform 10557ms\n     name                                  hz     min     max    mean     p75     p99    p995    p999     rme   samples\n   · toContrato (um item)       44,401,140.98  0.0000  0.0518  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.09%  22200572  [1.00x] ⇓\n     toContrato (um item)       44,455,911.96  0.0000  1.4830  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.59%  22227957  (baseline)\n   · toProposta (um item)       45,237,998.73  0.0000  0.0598  0.0000  0.0000  0.0000  0.0000  0.0000  ±0.09%  22619000  [1.01x] ⇑\n     toProposta (um item)       44,986,051.46  0.0000  0.3590  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.20%  22493026  (baseline)\n   · toContrato — lista de 100   1,729,829.14  0.0005  0.2777  0.0006  0.0006  0.0008  0.0011  0.0020  ±0.27%    864915  [0.98x] ⇓\n     toContrato — lista de 100   1,759,207.13  0.0005  0.1821  0.0006  0.0006  0.0007  0.0007  0.0009  ±0.21%    879604  (baseline)\n\n BENCH  Summary\n\n  toProposta (um item) - src/transform.bench.ts > transform\n    1.02x faster than toContrato (um item)\n    26.15x faster than toContrato — lista de 100"
      origem: executado
      dica: Sem nenhuma mudança no código, a comparação já registra diferenças de alguns por cento. Veja o Diagnóstico.
    cenarios:
    - rotulo: Lista de contratos
      comando: 'curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos'
    - rotulo: Detalhe do contrato
      comando: 'curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos/123456-7'
    - rotulo: Teste do campo
      comando: (cd bffs/emprestimo && npx vitest run src/__tests__/vencimentoFinal.test.ts)
    - rotulo: Suíte do BFF
      comando: (cd bffs/emprestimo && npx vitest run)
    - rotulo: Comparar o benchmark
      comando: (cd bffs/emprestimo && npx vitest bench --run --compare /tmp/bench-antes.json)
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que um time encontraria ao adaptar contratos num BFF, a partir de saídas do laboratório e de chamadas aos dois BFFs. Escolha a causa de cada uma para ver a explicação e a correção.
  - tipo: incidente
    titulo: Vencimento presente na lista e ausente no detalhe
    origem: executado
    rotulo_saida: log
    saida: '$ curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos

      [{"numero":"123456-7","linhaDeCredito":"Crédito Pessoal","valorLiberado":15000,"saldoAtual":9245.5,"parcelas":24,"parcelasRestantes":14,"taxaDeJuros":1.89,"cetMensal":2.11,"cetAnual":28.7,"temAtraso":false,"proximaParcela":{"vencimento":"2026-07-10","valor":944.3},"vencimentoFinal":"2027-08-10"},{"numero":"654321-0","linhaDeCredito":"Refinanciamento Consignado","valorLiberado":8300,"saldoAtual":4132.99,"parcelas":18,"parcelasRestantes":8,"taxaDeJuros":1.49,"cetMensal":1.72,"cetAnual":22.8,"temAtraso":true,"proximaParcela":{"vencimento":"2026-07-05","valor":615.8},"vencimentoFinal":"2027-02-05"}]


      $ curl -s -H "X-Internal-Gateway-Key: development-only-gateway-key" -H "X-Authenticated-Subject: user1" http://localhost:4001/contratos/123456-7

      {"numero":"123456-7","linhaDeCredito":"Crédito Pessoal","valorLiberado":15000,"saldoAtual":9245.5,"parcelas":24,"parcelasRestantes":14,"taxaDeJuros":1.89,"cetMensal":2.11,"cetAnual":28.7,"temAtraso":false,"proximaParcela":{"vencimento":"2026-07-10","valor":944.3},"vencimentoFinal":null}'
    pergunta: A tela de detalhe vai mostrar o vencimento final do contrato `123456-7`?
    correcao: Tratar `null` na tela, e decidir com o dono do legado se o detalhe passa a enviar o campo ou se o BFF o completa com a lista.
    alternativas:
    - texto: Não, porque o mapeamento só vale para listas.
      correta: false
      explicacao: A rota de detalhe usa o mesmo `toContrato`.
    - texto: Não, porque o detalhe vem de `contratos.detail.json`, que não tem `VencimentoDoContrato`, e o BFF devolve `null`.
      correta: true
      explicacao: O mesmo vale para `TemParcelasEmAtraso`, que também falta no detalhe e vira `false`.
    - texto: Sim, porque o BFF reaproveita o item da lista.
      correta: false
      explicacao: '`obterContrato` devolve o detalhe para esse contrato, e o item da lista só para os demais.'
  - tipo: incidente
    titulo: Benchmark mais lento depois do campo novo
    origem: executado
    rotulo_saida: log
    saida: "# depois do campo novo\n   · toContrato — lista de 100   1,749,556.36  0.0005  16.6634  0.0006  0.0005  0.0007  0.0007  0.0009  ±6.53%    874779  [0.96x] ⇓\n     toContrato — lista de 100   1,815,419.73  0.0005   0.3755  0.0006  0.0005  0.0007  0.0007  0.0009  ±0.28%    907710  (baseline)\n\n# sem nenhuma mudança no código\n   · toContrato — lista de 100   1,729,829.14  0.0005  0.2777  0.0006  0.0006  0.0008  0.0011  0.0020  ±0.27%    864915  [0.98x] ⇓\n     toContrato — lista de 100   1,759,207.13  0.0005  0.1821  0.0006  0.0006  0.0007  0.0007  0.0009  ±0.21%    879604  (baseline)"
    pergunta: A lista de 100 caiu para `0.96x` depois da mudança. O campo novo deixou a transformação mais lenta?
    correcao: Repetir a medição algumas vezes no mesmo ambiente e só tratar como regressão uma diferença que se mantém acima da variação observada sem mudança.
    alternativas:
    - texto: Sim, a queda de 4% mostra o custo do campo novo.
      correta: false
      explicacao: A variação entre duas medições do mesmo código é da mesma ordem.
    - texto: Não, porque `toContrato (um item)` ficou em `1.00x`.
      correta: false
      explicacao: 'Uma linha estável não anula a dúvida sobre a outra: as duas sofrem o mesmo ruído.'
    - texto: A medição não permite concluir, porque sem nenhuma mudança a mesma linha registrou `0.98x`, e a execução com o campo novo teve `rme` de `±6.53%`.
      correta: true
      explicacao: Numa rodada anterior sem mudança, a mesma linha chegou a `0.93x`.
  - tipo: incidente
    titulo: Lista de 100 mais barata por item que a chamada isolada
    origem: executado
    rotulo_saida: log
    saida: "   · toContrato (um item)       44,725,201.46  0.0000  0.0508  0.0000  0.0000  0.0000  0.0000  0.0001  ±0.09%  22362601\n   · toContrato — lista de 100   1,815,419.73  0.0005  0.3755  0.0006  0.0005  0.0007  0.0007  0.0009  ±0.28%    907710"
    pergunta: Uma chamada isolada leva cerca de 22 ns, e cem chamadas no laço levam cerca de 550 ns, ou 5,5 ns por item. Como ler essa diferença?
    correcao: Usar o resultado da função no benchmark, por exemplo acumulando um valor que é lido no fim, e medir com dados variados, mais próximos de uma lista real.
    alternativas:
    - texto: 'Os dois casos não medem o mesmo trabalho: o resultado nunca é lido, e o otimizador do V8 pode eliminar parte de um trabalho cujo resultado ninguém usa.'
      correta: true
      explicacao: A ADR-005 registra números parecidos, com 46,2 M e 1,7 M de operações por segundo.
    - texto: Transformar cem itens é quatro vezes mais barato por item, e o BFF deveria agrupar as chamadas.
      correta: false
      explicacao: O laço repete o mesmo objeto, e a diferença vem da forma de medir.
    - texto: O `vitest bench` divide o tempo pelo número de itens.
      correta: false
      explicacao: O `hz` conta execuções da função de benchmark inteira, com as cem chamadas.
  - tipo: incidente
    titulo: Endereço que volta ao valor anterior
    origem: executado
    rotulo_saida: log
    saida: '$ curl -s -X PUT … -d {"cep":"30130010","logradouro":"Avenida Afonso Pena","numero":"1000"} http://localhost:4002/usuario/endereco

      {"cep":"30130010","logradouro":"Avenida Afonso Pena","numero":"1000"}

      $ curl -s … http://localhost:4002/usuario/endereco

      {"cep":"01001000","logradouro":"Praça da Sé","numero":"1"}'
    pergunta: Por que o `GET` seguinte não mostra o endereço gravado pelo `PUT`?
    correcao: Guardar o endereço por `sub` no BFF de endereço, como o de empréstimo faz com as propostas, e cobrir o `PUT` seguido de `GET` num teste.
    alternativas:
    - texto: O `PUT` falhou na validação.
      correta: false
      explicacao: A validação falhando daria 400, e a resposta foi o endereço enviado.
    - texto: '`putEndereco` devolve uma cópia do corpo recebido sem guardá-la, e `getEndereco` sempre devolve o endereço fixo.'
      correta: true
      explicacao: As duas funções estão em `bffs/endereco/src/legacyBackend.ts`, linhas 13 a 19.
    - texto: O Gateway guarda a resposta do `GET` em cache.
      correta: false
      explicacao: As chamadas foram feitas direto ao BFF, na porta 4002.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que a transformação do contrato fica no BFF?
      alternativas:
      - texto: Porque o Gateway não consegue ler JSON.
        correta: false
        explicacao: O Gateway poderia ler, e a ADR decide não fazer isso.
      - texto: Porque o microfrontend não roda TypeScript.
        correta: false
        explicacao: O microfrontend é escrito em TypeScript.
      - texto: Para manter o Gateway genérico e isolar o microfrontend do formato do legado.
        correta: true
        explicacao: É a justificativa da ADR-015.
    - enunciado: Por que o campo novo é `string | null`, e não `string` opcional?
      alternativas:
      - texto: Para que a ausência do dado apareça na resposta e no tipo, e a tela tenha de tratá-la.
        correta: true
        explicacao: Um campo omitido no JSON some sem aviso para quem lê a resposta.
      - texto: Porque o JSON não aceita campos opcionais.
        correta: false
        explicacao: O JSON aceita omitir campos.
      - texto: Porque `null` ocupa menos bytes.
        correta: false
        explicacao: A escolha é de contrato, e não de tamanho.
    - enunciado: O que quebrou o `transform.test.ts` depois do mapeamento?
      alternativas:
      - texto: A fixture foi alterada.
        correta: false
        explicacao: O laboratório não altera as fixtures.
      - texto: 'O `toEqual` compara o objeto inteiro e passou a receber `vencimentoFinal: null`.'
        correta: true
        explicacao: O teste protege o contrato completo, e a mudança de contrato exige a atualização dele.
      - texto: O tipo `ContratoLegacy` ficou inválido.
        correta: false
        explicacao: O `tsc` não acusou erro no estado do passo 8.
    - enunciado: Que leitura do benchmark a ADR-005 recomenda?
      alternativas:
      - texto: Exigir pelo menos 40 milhões de operações por segundo.
        correta: false
        explicacao: A ADR não fixa um valor mínimo.
      - texto: Rodar o benchmark com carga HTTP.
        correta: false
        explicacao: A ADR descarta ferramentas de carga para unidade.
      - texto: Comparar medições do mesmo ambiente ao longo do tempo, e não os valores absolutos.
        correta: true
        explicacao: Os números dependem da máquina.
    - enunciado: Depois do laboratório, o que falta para a tela do microfrontend usar `vencimentoFinal` com tipos?
      alternativas:
      - texto: Atualizar a cópia do contrato em `mfes/emprestimo/src/domain/index.ts`.
        correta: true
        explicacao: Sem tipos derivados do BFF, a cópia só muda à mão.
      - texto: Nada, porque o TypeScript lê o BFF em tempo de execução.
        correta: false
        explicacao: Os tipos do microfrontend são declarados à mão.
      - texto: Mudar o Gateway.
        correta: false
        explicacao: O Gateway repassa o corpo sem conhecer os campos.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O papel do `transform.ts` como camada de isolamento do legado está claro.
    - O teste do campo novo falhou antes do mapeamento e passou depois.
    - O teste de contrato antigo foi atualizado para o campo novo.
    - A comparação do benchmark foi lida à luz da variação sem mudança.
    - A diferença entre a lista e o detalhe do legado foi identificada.

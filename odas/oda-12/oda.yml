id: '12'
titulo: Contrato de tipos via Hono RPC
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O microfrontend de endereço declara à mão o formato da resposta do BFF, e nenhum compilador compara as duas declarações. Esta ODA mostra que uma renomeação no BFF passa por todos os testes e pelo `tsc` dos dois lados, e então aplica a prova de conceito que a ADR-017 propõe, até que a mesma renomeação pare o build do microfrontend.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a dessincronia silenciosa descrita na ADR-017 e por que a ADR-009 duplica tipos entre microfrontend e BFF.
    - Expor o tipo das rotas do BFF num `contract.ts` e consumi-lo no microfrontend com `import type` e alias de caminho.
    - 'Explicar por que a anotação `: Hono<BffEnv>` apaga o tipo das rotas e por que o encadeamento o preserva.'
    - Detectar na compilação do microfrontend a renomeação de um campo no BFF.
    - Reconhecer a nova dependência de build entre microfrontend e BFF e o que fica fora do bundle.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: A ODA 11. O laboratório altera o BFF e o microfrontend de endereço e não precisa de nenhum serviço no ar. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL, com o `perl` que acompanha o Git.
  - tipo: terminal
    titulo: terminal · renomeação no BFF
    comandos:
    - entrada: perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
      saida: ''
      origem: executado
      efeito: renomeado
      dica: O comando troca `numero` por `numeroDoImovel` em todo o BFF de endereço, inclusive nos testes, sem imprimir nada.
    - entrada: (cd bffs/endereco && npx vitest run)
      condicao: renomeado
      saida: " RUN  v4.1.9 ./bffs/endereco\n\n\n Test Files  3 passed (3)\n      Tests  9 passed (9)"
      origem: executado
    - entrada: (cd bffs/endereco && npx vitest run)
      saida: " RUN  v4.1.9 ./bffs/endereco\n\n\n Test Files  3 passed (3)\n      Tests  9 passed (9)"
      origem: executado
    - entrada: (cd mfes/endereco && npx tsc --noEmit)
      condicao: renomeado
      saida: ''
      origem: executado
      dica: 'Sem mensagens: o microfrontend não percebe a mudança no BFF.'
    - entrada: (cd mfes/endereco && npx tsc --noEmit)
      saida: ''
      origem: executado
      dica: 'Sem mensagens: os tipos conferem.'
    - entrada: git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
      saida: ''
      origem: executado
      efeito: '!renomeado'
      dica: O comando restaura só os arquivos tocados pela renomeação e mantém o `routes.ts` e o `contract.ts`.
    cenarios:
    - rotulo: Renomear numero no BFF
      comando: perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
    - rotulo: Testes do BFF
      comando: (cd bffs/endereco && npx vitest run)
    - rotulo: Tipos do microfrontend
      comando: (cd mfes/endereco && npx tsc --noEmit)
    - rotulo: Desfazer
      comando: git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: A ADR-009 mantém cada microfrontend autônomo, com cópias locais dos contratos, e o preço é que nenhuma compilação compara a cópia com o original. A ADR-017 propõe que o BFF publique o tipo das próprias rotas e que o microfrontend o importe só como tipo, sem levar código do BFF ao bundle.
  - tipo: comparativo
    colunas:
    - Cópia manual do tipo
    - Tipo derivado do BFF
    linhas:
    - dimensao: Onde o formato é declarado
      valores:
      - 'Duas vezes: no BFF e em `EnderecoForm.tsx`'
      - Uma vez, no BFF, e inferido das rotas
    - dimensao: Renomeação no BFF
      valores:
      - Passa pela compilação e quebra a tela em execução
      - Para o `tsc` e o `npm run build` do microfrontend
    - dimensao: Build do microfrontend
      valores:
      - Precisa só do próprio pacote
      - Precisa do código e das dependências do BFF instaladas
    - dimensao: Bundle publicado
      valores:
      - Só o código do microfrontend
      - O mesmo, porque o `import type` é apagado
  - tipo: conceito
    titulo: Tipo que carrega as rotas
    texto: 'Cada `.get` e cada `.put` encadeados devolvem uma instância do Hono cujo tipo acumula caminho, método e resposta. Uma anotação de retorno como `: Hono<BffEnv>` troca esse tipo pelo tipo genérico, sem rotas, e o cliente `hc` passa a enxergar `unknown`.'
  - tipo: conceito
    titulo: Dependência de build sem dependência de execução
    texto: O `import type` existe apenas para o compilador e desaparece no JavaScript gerado. O microfrontend continua a ser publicado sozinho no S3, e a esteira passa a precisar do código e do `node_modules` do BFF para checar os tipos.
  - tipo: adr
    id: ADR-017
    titulo: Contrato de tipos entre MFE e BFF via Hono RPC
    status: Proposta
    contexto: Cada microfrontend mantém uma cópia manual do contrato de resposta do BFF, e nenhum sinal de compilação avisa quando o BFF muda o formato.
    decisao: Cada BFF exporta o tipo das rotas num `contract.ts`, consumido pelo microfrontend com `import type` e alias de caminho, sem pacote publicado.
    alternativas: tRPC, com duas dependências novas e chamadas agrupadas que quebrariam a auditoria por rota do Gateway, e manter os tipos duplicados.
    consequencias: Erro de compilação quando o BFF muda um campo, ao custo de encadear as rotas dos BFFs e de instalar as dependências do BFF na esteira do microfrontend.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `2179313`, os dois lados do contrato de endereço. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/endereco/src/legacyBackend.ts
    commit: '2179313'
    linhas:
    - export interface Endereco {
    - '  cep: string'
    - '  logradouro: string'
    - '  numero: string'
    - '}'
    - ''
    - 'const ENDERECO_FIXO: Endereco = {'
    - '  cep: ''01001000'','
    - '  logradouro: ''Praça da Sé'','
    - '  numero: ''1'','
    - '}'
    anotacoes:
    - linha: 1
      texto: Formato declarado no BFF.
    - linha: 10
      texto: Valor fixo devolvido pelo `GET`.
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/endereco/src/routes.ts
    commit: '2179313'
    linhas:
    - 'export function createRoutes(): Hono<BffEnv> {'
    - '  const router = new Hono<BffEnv>()'
    - ''
    - '  router.get(''/usuario/endereco'', (c) => {'
    - '    return c.json(getEndereco())'
    - '  })'
    - ''
    - '  router.put(''/usuario/endereco'', async (c) => {'
    - '    const body = (await c.req.json()) as Endereco'
    - '    const validation = validateEndereco(body)'
    - '    if (!validation.ok) {'
    - '      return c.json({ error: ''invalid_request'', message: validation.message }, 400)'
    - '    }'
    - '    return c.json(putEndereco(validation.value))'
    - '  })'
    - ''
    - '  return router'
    - '}'
    anotacoes:
    - linha: 7
      texto: A anotação de retorno apaga o tipo das rotas registradas abaixo.
    - linha: 10
      texto: Rotas registradas por chamadas separadas, sem encadeamento.
    - linha: 23
      texto: O objeto devolvido tem as rotas em execução, mas o tipo declarado não as conhece.
    inicio: 7
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/EnderecoForm.tsx
    commit: '2179313'
    linhas:
    - import { useForm } from 'react-hook-form'
    - ''
    - export interface Endereco {
    - '  cep: string'
    - '  logradouro: string'
    - '  numero: string'
    - '}'
    - ''
    - 'export function EnderecoForm({ initial, onSubmit }: { initial: Endereco; onSubmit: (e: Endereco) => void }) {'
    - '  const { register, handleSubmit } = useForm<Endereco>({ defaultValues: initial })'
    - '  return ('
    - '    <form onSubmit={handleSubmit((data) => onSubmit(data))} className="flex max-w-md flex-col gap-4">'
    - '      <label className="flex flex-col gap-1">CEP<input {...register(''cep'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Logradouro<input {...register(''logradouro'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Número<input {...register(''numero'')} className="rounded border p-2" /></label>'
    anotacoes:
    - linha: 3
      texto: Cópia manual do formato do BFF, sem ligação com o original.
    - linha: 15
      texto: O `register` só aceita chaves de `Endereco`, e por isso acusa uma chave que deixa de existir.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/EnderecoApp.tsx
    commit: '2179313'
    linhas:
    - '  useEffect(() => {'
    - '    client<Endereco>(''/usuario/endereco'').then(setEndereco).catch(() => setEndereco({ cep: '''', logradouro: '''', numero: '''' }))'
    - '    // eslint-disable-next-line react-hooks/exhaustive-deps'
    - '  }, [])'
    anotacoes:
    - linha: 12
      texto: O genérico `<Endereco>` afirma o formato da resposta sem conferi-lo.
    inicio: 11
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/contract.ts
    commit: '2179313'
    linhas:
    - // Contrato publicado pelo shell (ADR-009). Cópia local para manter o MFE autônomo.
    - export interface MfeMountContext {
    - '  apiUrl: string'
    - '  token: string | null'
    - '  onUnauthorized: () => void'
    - '  basePath: string'
    - '}'
    anotacoes:
    - linha: 1
      texto: A mesma estratégia de cópia local vale para o contrato com o shell.
  - tipo: faixa
    estilo: dica
    texto: O cabeçalho da ADR-017 registra que nenhum código foi alterado para ela. O laboratório executa a prova de conceito no BFF de endereço, que a seção de riscos da própria ADR indica como primeiro passo, antes do BFF de empréstimo.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Acompanhe o caminho do tipo, do BFF ao build do microfrontend, e classifique o resultado de cada mudança no BFF antes e depois da prova de conceito.
  - tipo: fluxo
    titulo: Do encadeamento de rotas ao erro no build do microfrontend
    etapas:
    - titulo: Rotas encadeadas
      descricao: '`createRoutes` devolve `new Hono<BffEnv>().get(...).put(...)`, e o TypeScript infere o tipo com as duas rotas e as respostas de cada uma.'
    - titulo: contract.ts
      descricao: '`AppType` recebe o tipo de `createRoutes`, e `InferResponseType` extrai a resposta 200 do `GET /usuario/endereco`.'
    - titulo: Alias no microfrontend
      descricao: O `paths` do `tsconfig.json` leva `@bff-endereco/contract` ao arquivo do BFF, e o `hono` é resolvido a partir de `bffs/endereco/node_modules`.
    - titulo: Tipo derivado
      descricao: '`Endereco` passa a ser `EnderecoResposta`, e o `register(''numero'')` e os objetos montados à mão são conferidos contra o formato do BFF.'
    - titulo: Build
      descricao: '`npm run build` roda `tsc --noEmit` antes do `vite build`, e uma divergência para a esteira antes de gerar o bundle.'
  - tipo: classificador
    enunciado: O comando indicado termina com erro ou sem erro?
    categorias:
    - id: erro
      rotulo: Termina com erro
    - id: ok
      rotulo: Termina sem erro
    itens:
    - texto: Sem o contrato, o BFF renomeia `numero`, e o microfrontend roda `npx tsc --noEmit`
      categoria: ok
      explicacao: A cópia manual do tipo continua com `numero`.
    - texto: Com o contrato, o BFF renomeia `numero`, e o microfrontend roda `npx tsc --noEmit`
      categoria: erro
      explicacao: Quatro erros, um em `register('numero')` e três em objetos com `numero`.
    - texto: Com o contrato e a renomeação, o microfrontend roda `npx vitest run`
      categoria: ok
      explicacao: O Vitest não confere tipos, e os 11 testes passam.
    - texto: 'Com o contrato, o BFF acrescenta `complemento: string` ao endereço, e o microfrontend roda `npx tsc --noEmit`'
      categoria: erro
      explicacao: Os objetos montados à mão no microfrontend passam a não ter o campo obrigatório, com `TS2741`.
    - texto: 'Com o contrato, o BFF devolve `consultadoEm: new Date()`, e o microfrontend guarda um `Date` nesse campo'
      categoria: erro
      explicacao: O tipo inferido é `string`, porque a resposta JSON serializa a data como texto.
    - texto: Com o contrato, o microfrontend roda `npx tsc --noEmit` numa esteira sem `bffs/endereco/node_modules`
      categoria: erro
      explicacao: O `hono/client` não é encontrado, com `TS2307`.
    - texto: Com o contrato, o microfrontend roda `npm run build`, sem renomeação no BFF
      categoria: ok
      explicacao: O bundle tem os mesmos 296,05 kB do commit de referência.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos na raiz do repositório clonado na ODA 00. Os passos 1 a 4 mostram a quebra silenciosa, os passos 5 a 10 aplicam a prova de conceito acompanhando cada erro de compilação, e os passos 11 e 12 repetem a quebra e conferem o bundle.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Instalar as dependências
      texto: No microfrontend, o `npm ci` deste commit falha porque o `package-lock.json` está fora de sincronia. O `npm install --no-save` instala sem alterar o lock.
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/endereco && npm ci)
        - (cd mfes/endereco && npm install --no-save)
      sucesso: '`added 69 packages` no BFF e `added 227 packages` no microfrontend, com `git status` sem alterações.'
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/endereco && npx vitest run)
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
      sucesso: '`Tests 9 passed (9)` no BFF, o `tsc` do microfrontend sem mensagens e `Tests 11 passed (11)` no microfrontend.'
    - titulo: Renomear o campo no BFF
      texto: O comando troca `numero` por `numeroDoImovel` no BFF, inclusive nos testes, como faria quem renomeia o campo com cuidado do lado do BFF.
      editor:
        rotulo: terminal
        linhas:
        - perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
        - (cd bffs/endereco && npx vitest run)
        - (cd bffs/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
      efeito: renomeado
      sucesso: '`Tests 9 passed (9)`, os dois `tsc` sem mensagens e `Tests 11 passed (11)`: nenhum comando acusa a quebra.'
    - titulo: Desfazer a renomeação
      editor:
        rotulo: terminal
        linhas:
        - git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
      efeito: '!renomeado'
      sucesso: '`git status` sem alterações.'
    - titulo: Apontar o microfrontend para o contrato
      texto: Acrescente o alias ao `tsconfig.json` do microfrontend e troque a interface `Endereco` de `EnderecoForm.tsx` pelo tipo importado.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/tsconfig.json e src/EnderecoForm.tsx (alteração)
        commit: '2179313'
        linhas:
        - '// mfes/endereco/tsconfig.json: dentro de compilerOptions'
        - '    "paths": {'
        - '      "@/*": ["./src/*"],'
        - '      "@bff-endereco/contract": ["../../bffs/endereco/src/contract.ts"]'
        - '    }'
        - ''
        - '// mfes/endereco/src/EnderecoForm.tsx: no lugar da interface Endereco'
        - import type { EnderecoResposta } from '@bff-endereco/contract'
        - ''
        - export type Endereco = EnderecoResposta
      efeito: alias_criado
    - titulo: Ver o tipo faltar
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
      sucesso: '`TS2307`: o módulo `@bff-endereco/contract` ainda não existe.'
    - titulo: Criar o contrato no BFF
      texto: 'Crie o arquivo abaixo. Ele não tem código de execução: só tipos derivados de `createRoutes`.'
      editor:
        rotulo: arquivo
        caminho: bffs/endereco/src/contract.ts (novo)
        commit: '2179313'
        linhas:
        - import type { hc, InferResponseType } from 'hono/client'
        - import type { createRoutes } from './routes.ts'
        - ''
        - export type AppType = ReturnType<typeof createRoutes>
        - ''
        - type Cliente = ReturnType<typeof hc<AppType>>
        - ''
        - export type EnderecoResposta = InferResponseType<Cliente['usuario']['endereco']['$get'], 200>
      efeito: contrato_criado
    - titulo: Ler os erros do contrato
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx tsc --noEmit)
      sucesso: Duas mensagens `TS5097` nos imports `.ts` do BFF e `Property 'usuario' does not exist on type 'unknown'` no microfrontend, e a mesma `TS2339` no BFF.
    - titulo: Aceitar imports com extensão .ts e encadear as rotas
      texto: Acrescente a opção abaixo ao `tsconfig.json` do microfrontend, que já tem `noEmit`. Depois, substitua `routes.ts` pela versão encadeada, sem anotação de retorno.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/tsconfig.json e bffs/endereco/src/routes.ts (alteração)
        commit: '2179313'
        linhas:
        - '// mfes/endereco/tsconfig.json: dentro de compilerOptions, depois de noEmit'
        - '    "allowImportingTsExtensions": true,'
        - ''
        - // bffs/endereco/src/routes.ts
        - import { Hono } from 'hono'
        - import { getEndereco, putEndereco } from './legacyBackend.ts'
        - import type { Endereco } from './legacyBackend.ts'
        - import { validateEndereco } from './validation.ts'
        - import type { BffEnv } from './types.ts'
        - ''
        - export function createRoutes() {
        - '  return new Hono<BffEnv>()'
        - '    .get(''/usuario/endereco'', (c) => {'
        - '      return c.json(getEndereco())'
        - '    })'
        - '    .put(''/usuario/endereco'', async (c) => {'
        - '      const body = (await c.req.json()) as Endereco'
        - '      const validation = validateEndereco(body)'
        - '      if (!validation.ok) {'
        - '        return c.json({ error: ''invalid_request'', message: validation.message }, 400)'
        - '      }'
        - '      return c.json(putEndereco(validation.value))'
        - '    })'
        - '}'
      efeito:
      - extensoes_ts
      - rotas_encadeadas
    - titulo: Conferir os dois lados
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx vitest run)
        - (cd mfes/endereco && npx vitest run)
      sucesso: Os dois `tsc` sem mensagens, `Tests 9 passed (9)` no BFF e `Tests 11 passed (11)` no microfrontend.
    - titulo: Renomear de novo
      editor:
        rotulo: terminal
        linhas:
        - perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
        - (cd mfes/endereco && npm run build)
      efeito: renomeado
      sucesso: Quatro erros no `tsc` do microfrontend, entre eles `Argument of type '"numero"' is not assignable`, `Tests 11 passed (11)` no Vitest e o `npm run build` interrompido pelo `tsc`.
    - titulo: Desfazer e conferir o bundle
      editor:
        rotulo: terminal
        linhas:
        - git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
        - (cd mfes/endereco && npm run build)
        - grep -c -e validateEndereco -e 'Praça da Sé' mfes/endereco/dist/endereco.js
      efeito: '!renomeado'
      sucesso: '`dist/endereco.js  296.05 kB`, o mesmo tamanho do commit de referência, e `0` ocorrências de código do BFF no bundle.'
  - tipo: terminal
    titulo: terminal · frontend-react
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: (cd bffs/endereco && npm ci)
      saida: "added 69 packages, and audited 70 packages in 945ms\n\n19 packages are looking for funding\n  run `npm fund` for details\n\n9 vulnerabilities (5 moderate, 4 high)\n\nTo address all issues, run:\n  npm audit fix\n\nRun `npm audit` for details."
      origem: executado
    - entrada: (cd mfes/endereco && npm ci)

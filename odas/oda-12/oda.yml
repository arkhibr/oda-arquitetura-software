- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que um time encontraria com o contrato de tipos entre um BFF, serviço de back-end dedicado à tela, e o microfrontend que o consome, a partir de saídas do laboratório e de mudanças no BFF feitas com o contrato aplicado. O bloco abaixo resume os conceitos que os incidentes usam, e em cada incidente você escolhe a causa para ver a explicação e a correção.
  - tipo: conceito
    titulo: Conceitos usados nos incidentes
    texto: O contrato de tipos é o `contract.ts` do BFF, que exporta pelo Hono RPC o tipo das rotas, e o microfrontend o importa com `import type`, que traz só tipos e desaparece do JavaScript gerado. O MSW (Mock Service Worker) é a biblioteca que simula as respostas HTTP nos testes do microfrontend, e o `client<Endereco>` é a chamada que declara pelo tipo genérico o formato esperado da resposta. A esteira de integração contínua é a sequência automática de instalação, conferência de tipos, testes e build que roda a cada mudança, e o `Pick` é o utilitário do TypeScript que monta um tipo com só alguns campos de outro.
  - tipo: incidente
    titulo: Campo vazio na tela depois de um deploy do BFF
    origem: executado
    rotulo_saida: log
    saida: "$ perl -pi -e 's/\\bnumero\\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts\n$ (cd bffs/endereco && npx vitest run)\n Test Files  3 passed (3)\n      Tests  9 passed (9)\n$ (cd mfes/endereco && npx tsc --noEmit)\n$ (cd mfes/endereco && npx vitest run)\n Test Files  4 passed (4)\n      Tests  11 passed (11)"
    pergunta: Sem o contrato, o BFF publica a renomeação e o campo Número da tela aparece vazio. Por que nenhuma verificação acusou a quebra?
    correcao: Derivar o tipo do microfrontend das rotas do BFF, como no laboratório, para que o `tsc` do build compare os dois lados.
    alternativas:
    - texto: O Gateway removeu o campo.
      correta: false
      explicacao: O Gateway repassa o corpo sem conhecer os campos.
    - texto: O microfrontend compara a resposta com a própria cópia do tipo, e o MSW dos testes dele simula o contrato antigo.
      correta: true
      explicacao: O `client<Endereco>` afirma o formato sem conferi-lo em execução.
    - texto: Os testes do BFF não cobrem a rota.
      correta: false
      explicacao: O `routes.test.ts` confere o corpo do `GET`, e foi renomeado junto.
  - tipo: incidente
    titulo: Rotas que chegam como unknown
    origem: executado
    rotulo_saida: log
    saida: 'src/contract.ts(8,58): error TS2339: Property ''usuario'' does not exist on type ''unknown''.'
    pergunta: O `contract.ts` está certo e o BFF responde em `/usuario/endereco`. Por que o tipo não tem a propriedade `usuario`?
    correcao: Remover a anotação de retorno e encadear as rotas, para que o tipo inferido acumule cada `.get` e `.put`.
    alternativas:
    - texto: O `hono/client` não foi instalado.
      correta: false
      explicacao: Sem o pacote, o erro seria `TS2307`, como no incidente seguinte.
    - texto: O caminho da rota tem barra no início.
      correta: false
      explicacao: O cliente do Hono transforma `/usuario/endereco` em `usuario.endereco`.
    - texto: '`createRoutes` declara o retorno como `Hono<BffEnv>`, um tipo sem rotas, e as chamadas `router.get` separadas não alteram o tipo de `router`.'
      correta: true
      explicacao: O passo 9 resolve o erro sem mudar o comportamento, e os 9 testes do BFF continuam passando.
  - tipo: incidente
    titulo: Esteira do microfrontend sem as dependências do BFF
    origem: executado
    rotulo_saida: log
    saida: '../../bffs/endereco/src/contract.ts(1,44): error TS2307: Cannot find module ''hono/client'' or its corresponding type declarations.

      ../../bffs/endereco/src/routes.ts(1,22): error TS2307: Cannot find module ''hono'' or its corresponding type declarations.

      ../../bffs/endereco/src/routes.ts(9,32): error TS7006: Parameter ''c'' implicitly has an ''any'' type.

      ../../bffs/endereco/src/routes.ts(12,38): error TS7006: Parameter ''c'' implicitly has an ''any'' type.'
    pergunta: A esteira do microfrontend passou a falhar na checagem de tipos, sem nenhuma mudança no código. O que falta?
    correcao: Acrescentar à esteira do microfrontend a instalação das dependências do BFF, `(cd bffs/endereco && npm ci)`, antes do `npm run build`.
    alternativas:
    - texto: O `node_modules` do BFF, de onde o TypeScript resolve `hono` e `hono/client` para os arquivos do BFF.
      correta: true
      explicacao: A ADR-017 do repositório já previa essa dependência de build e registrou a instalação das dependências do BFF como passo permanente da esteira do microfrontend.
    - texto: O `hono` no `package.json` do microfrontend.
      correta: false
      explicacao: Os imports partem de arquivos do BFF e são resolvidos a partir da pasta do BFF.
    - texto: O BFF no ar durante o build.
      correta: false
      explicacao: A checagem lê arquivos e não faz chamadas ao BFF.
  - tipo: incidente
    titulo: Campo novo que derruba o microfrontend
    origem: executado
    rotulo_saida: log
    saida: "../../bffs/endereco/src/validation.ts(19,22): error TS2741: Property 'complemento' is missing in type '{ cep: string; logradouro: string; numero: string; }' but required in type 'Endereco'.\nsrc/__tests__/EnderecoForm.test.tsx(8,26): error TS2741: Property 'complemento' is missing in type '{ cep: string; logradouro: string; numero: string; }' but required in type '{ cep: string; logradouro: string; numero: string; complemento: string; }'.\nsrc/__tests__/EnderecoForm.test.tsx(15,26): error TS2741: Property 'complemento' is missing in type '{ cep: string; logradouro: string; numero: string; }' but required in type '{ cep: string; logradouro: string; numero: string; complemento: string; }'.\nsrc/EnderecoApp.tsx(12,85): error TS2345: Argument of type '{ cep: string; logradouro: string; numero: string; }' is not assignable to parameter of type 'SetStateAction<{ cep: string; logradouro: string; numero: string; complemento: string; } | null>'.\n  Property 'complemento' is missing in type '{ cep: string; logradouro: string; numero: string; }' but required in type '{ cep: string; logradouro: string; numero: string; complemento: string; }'."
    pergunta: O BFF acrescentou `complemento` ao endereço, e o microfrontend nem usa o campo. Por que o `tsc` do microfrontend falha?
    correcao: Separar o tipo da resposta do tipo dos objetos que o microfrontend monta, por exemplo com `Pick<EnderecoResposta, 'cep' | 'logradouro' | 'numero'>` para o formulário e o valor de recuperação.
    alternativas:
    - texto: O `register` exige que todo campo tenha um `input`.
      correta: false
      explicacao: Os erros apontam objetos literais, e não o formulário.
    - texto: O microfrontend monta objetos `Endereco` à mão, no valor de recuperação de `EnderecoApp.tsx` e nos testes, e o tipo derivado passou a exigir o campo novo.
      correta: true
      explicacao: A mesma mudança também quebra o `validation.ts` do BFF, que monta o endereço validado.
    - texto: O contrato só aceita campos já existentes no commit de referência.
      correta: false
      explicacao: O tipo é inferido a cada compilação.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: conceito
    titulo: Termos das perguntas
    texto: O BFF é o serviço de back-end dedicado ao microfrontend, a parte da interface com build e deploy próprios. O Hono é o framework web do BFF, e o cliente `hc` chama as rotas com os tipos derivados delas pelo Hono RPC. O `import type` traz de outro módulo só tipos, e o bundle é o arquivo JavaScript publicado do microfrontend. O `tsc` é o compilador TypeScript, o Vitest é o framework de testes, e o MSW simula as respostas HTTP nos testes.
  - tipo: quiz
    perguntas:
    - enunciado: Que problema o contrato de tipos pelo Hono RPC resolve?
      alternativas:
      - texto: A latência entre microfrontend e BFF.
        correta: false
        explicacao: As chamadas continuam pelo mesmo HTTP, e a ADR-017 do repositório preserva esse transporte.
      - texto: O tamanho do bundle.
        correta: false
        explicacao: O bundle não muda.
      - texto: A divergência silenciosa entre o tipo declarado no microfrontend e a resposta real do BFF.
        correta: true
        explicacao: Sem o contrato, a quebra só aparece em execução.
    - enunciado: Por que o encadeamento das rotas é necessário?
      alternativas:
      - texto: Porque cada chamada encadeada devolve um tipo que acumula a rota, e a anotação genérica descarta essa informação.
        correta: true
        explicacao: Sem isso, o cliente `hc` vê `unknown`.
      - texto: Porque o Hono não aceita rotas registradas em chamadas separadas.
        correta: false
        explicacao: As rotas funcionam nos dois estilos, e só o tipo muda.
      - texto: Porque o Gateway exige.
        correta: false
        explicacao: O Gateway não lê os tipos do BFF.
    - enunciado: O que o `import type` garante?
      alternativas:
      - texto: Que os testes do microfrontend confiram tipos.
        correta: false
        explicacao: O Vitest continua sem conferir tipos.
      - texto: Que nenhum código do BFF entre no bundle do microfrontend.
        correta: true
        explicacao: O bundle ficou com os mesmos 296,05 kB e sem trechos do BFF.
      - texto: Que o BFF esteja no ar no build.
        correta: false
        explicacao: O build não chama o BFF.
    - enunciado: Por que os testes do microfrontend passaram depois da renomeação, mesmo com o contrato?
      alternativas:
      - texto: O contrato só vale em produção.
        correta: false
        explicacao: O contrato é checado em toda compilação.
      - texto: A renomeação não chegou ao BFF.
        correta: false
        explicacao: O `tsc` do microfrontend acusou a renomeação na mesma execução.
      - texto: O Vitest não roda o `tsc`, e o MSW do microfrontend responde com o formato antigo.
        correta: true
        explicacao: A detecção acontece no `tsc --noEmit` do `npm run build`.
    - enunciado: Que custo o contrato de tipos pelo Hono RPC impõe ao microfrontend?
      alternativas:
      - texto: O build do microfrontend passa a depender do código e das dependências instaladas do BFF.
        correta: true
        explicacao: A autonomia de execução fica preservada e a de build é cedida em parte.
      - texto: O microfrontend passa a chamar o BFF sem o Gateway.
        correta: false
        explicacao: O caminho das requisições não muda.
      - texto: Duas dependências novas de RPC.
        correta: false
        explicacao: Esse era o custo do tRPC, descartado.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A renomeação no BFF passou por todos os testes e pelo `tsc` antes da prova de conceito.
    - Cada erro de compilação do caminho até o contrato foi lido e resolvido.
    - A mesma renomeação parou o `npm run build` do microfrontend depois da prova de conceito.
    - O bundle continuou sem código do BFF.
    - A dependência de build entre microfrontend e BFF está clara.

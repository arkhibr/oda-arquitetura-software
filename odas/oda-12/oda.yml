id: '12'
titulo: Contrato de tipos via Hono RPC
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é impedir que uma quebra de contrato entre um BFF (Backend for Frontend) e o microfrontend que o consome chegue ao portal sem aviso, fazendo o compilador detectá-la. No `frontend-react`, o microfrontend de endereço declara à mão o formato da resposta do BFF, e uma renomeação no BFF passa por todos os testes e pelo compilador TypeScript (`tsc`) dos dois lados, de modo que o erro só apareceria com o portal em uso. Você vai aplicar a proposta de tipos compartilhados pelo Hono RPC (Remote Procedure Call) até que a mesma renomeação pare o build do microfrontend, sem levar código do BFF ao bundle.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Contrato e quebra de contrato
      definicao: Contrato é o formato combinado de uma resposta, com os campos, os nomes e os tipos de cada um. Há quebra de contrato quando quem produz a resposta muda esse formato, por exemplo renomeando um campo, sem que quem a consome seja ajustado.
    - termo: BFF (Backend for Frontend)
      definicao: Serviço de back-end dedicado a uma interface específica, que adapta os dados dos sistemas internos ao formato de que essa interface precisa. O BFF de endereço, em `bffs/endereco/`, atende o microfrontend de endereço.
      referencia:
        rotulo: Microsoft Learn · Backends para Frontends
        url: https://learn.microsoft.com/pt-br/azure/architecture/patterns/backends-for-frontends
    - termo: Microfrontend
      definicao: Parte da interface do portal com build e deploy próprios, que o shell carrega numa rota enquanto o usuário navega. O microfrontend de endereço fica em `mfes/endereco/` e chama o BFF de endereço pelo Gateway.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: TypeScript e o compilador tsc
      definicao: O TypeScript acrescenta tipos estáticos ao JavaScript, e o compilador `tsc` confere esses tipos antes da execução. Os erros vêm com códigos como `TS2339`, propriedade inexistente no tipo, e `TS2741`, propriedade obrigatória ausente.
      referencia:
        rotulo: TypeScript · Everyday Types
        url: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
    - termo: Hono e Hono RPC (Remote Procedure Call)
      definicao: O Hono é o framework web do Gateway e dos BFFs. O Hono RPC é o recurso dele que deriva do próprio código das rotas um tipo com caminho, método e resposta de cada uma, que o cliente `hc` usa para chamar o servidor com os tipos conferidos pelo compilador.
      referencia:
        rotulo: Hono · RPC
        url: https://hono.dev/docs/guides/rpc
    - termo: Build e bundle
      definicao: O build transforma o código-fonte em arquivos prontos para o navegador, e o bundle é o arquivo JavaScript que resulta dele. O build do microfrontend roda o `tsc` antes de gerar o bundle.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas consideradas e as consequências. A ADR-009 define o contrato técnico entre shell, microfrontend e BFF, e a ADR-017 propõe os tipos compartilhados pelo Hono RPC.
      referencia:
        rotulo: Architectural Decision Records (ADRs)
        url: https://adr.github.io/
    - termo: import type
      definicao: Forma de importação do TypeScript que traz só tipos de outro módulo. Ela existe apenas para o compilador e desaparece do JavaScript gerado, de modo que nenhum código do BFF entra no bundle do microfrontend.
      referencia:
        rotulo: TypeScript · Modules
        url: https://www.typescriptlang.org/docs/handbook/2/modules.html
    - termo: Alias de caminho
      definicao: Nome curto configurado no `tsconfig.json`, no campo `paths`, que o compilador traduz para uma pasta do projeto. O laboratório cria um alias para que o microfrontend importe o `contract.ts` do BFF sem um caminho relativo longo.
      referencia:
        rotulo: TypeScript · Modules - Reference
        url: https://www.typescriptlang.org/docs/handbook/modules/reference.html
    - termo: Tipo genérico e anotação de tipo
      definicao: Um tipo genérico recebe outros tipos como parâmetro, como `Hono<BffEnv>`. Escrever essa anotação no retorno de uma função faz o compilador usar o tipo declarado e descartar o tipo mais detalhado que ele inferiria das rotas encadeadas.
      referencia:
        rotulo: TypeScript · Generics
        url: https://www.typescriptlang.org/docs/handbook/2/generics.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS. No portal, cada microfrontend é publicado num bucket do S3, emulado pelo LocalStack em desenvolvimento.
      referencia:
        rotulo: AWS · O que é o Amazon S3?
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Esteira de integração contínua (CI)
      definicao: Sequência automática de verificações, como instalação, conferência de tipos, testes e build, que roda a cada mudança enviada ao repositório. Com o contrato compartilhado, a esteira do microfrontend passa a precisar do código e das dependências do BFF.
      referencia:
        rotulo: GitHub Docs · Noções básicas sobre GitHub Actions
        url: https://docs.github.com/pt/actions/about-github-actions/understanding-github-actions
    - termo: tRPC
      definicao: Biblioteca que gera chamadas tipadas entre cliente e servidor TypeScript. A ADR-017 a descartou porque exigiria duas dependências novas e agruparia chamadas, o que quebraria a auditoria por rota feita no Gateway.
    - termo: Vitest
      definicao: Framework de testes para projetos JavaScript e TypeScript integrado ao Vite, usado nos testes do BFF e do microfrontend.
      referencia:
        rotulo: Vitest · Getting Started
        url: https://vitest.dev/guide/
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta as requisições HTTP e devolve respostas simuladas. Os testes do microfrontend usam respostas simuladas e por isso não percebem a mudança feita no BFF.
      referencia:
        rotulo: Mock Service Worker · Introduction
        url: https://mswjs.io/docs/
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a dessincronia silenciosa descrita na ADR-017 e por que a ADR-009 duplica tipos entre microfrontend e BFF.
    - Expor o tipo das rotas do BFF num `contract.ts` e consumi-lo no microfrontend com `import type` e alias de caminho.
    - 'Explicar por que a anotação `: Hono<BffEnv>` apaga o tipo das rotas e por que o encadeamento o preserva.'
    - Detectar na compilação do microfrontend a renomeação de um campo no BFF.
    - Reconhecer a nova dependência de build entre microfrontend e BFF e o que fica fora do bundle.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O laboratório altera o BFF e o microfrontend de endereço e não precisa de nenhum serviço no ar. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL, com o `perl` que acompanha o Git.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba explica por que uma mudança de formato num BFF pode chegar ao portal sem nenhum aviso e como o compilador TypeScript pode passar a detectá-la. Os blocos abaixo ensinam contrato e quebra de contrato, BFF e microfrontend, o compilador `tsc`, o Hono RPC e o tipo que carrega as rotas, o `import type` e o alias de caminho, e depois o comparativo põe lado a lado a cópia manual do tipo e o tipo derivado do BFF. A ADR do fim registra a proposta do repositório, que publica o tipo das rotas no BFF sem levar código dele ao bundle do microfrontend.
  - tipo: conceito
    titulo: Contrato e quebra de contrato
    texto: Contrato é o formato combinado de uma resposta, com os campos, os nomes e os tipos de cada um, que quem consome pode esperar de quem produz. Há quebra de contrato quando quem produz muda esse formato, por exemplo renomeando um campo, sem que quem consome seja ajustado, e a quebra é silenciosa quando nenhum teste nem compilação a acusa.
  - tipo: conceito
    titulo: BFF, microfrontend e a cópia local do tipo
    texto: O BFF (Backend for Frontend) é o serviço de back-end dedicado a uma interface, e o BFF de endereço, em `bffs/endereco/`, atende o microfrontend de endereço, a parte da interface em `mfes/endereco/` com build e deploy próprios. Para manter cada microfrontend autônomo, o repositório faz cada um guardar uma cópia local dos tipos que recebe, e nenhuma compilação compara essa cópia com o tipo do BFF.
  - tipo: conceito
    titulo: TypeScript e o compilador tsc
    texto: O TypeScript acrescenta tipos estáticos ao JavaScript, e o compilador `tsc` confere esses tipos antes da execução, apontando erros com códigos como `TS2339`, propriedade inexistente no tipo, e `TS2741`, propriedade obrigatória ausente. O build do microfrontend roda o `tsc --noEmit` antes do `vite build`, e por isso um erro de tipo impede que o bundle, o arquivo JavaScript publicado, seja gerado.
  - tipo: conceito
    titulo: Tipo que carrega as rotas
    texto: 'O Hono é o framework web do Gateway e dos BFFs, e o Hono RPC (Remote Procedure Call) é o recurso dele que deriva do próprio código das rotas um tipo com caminho, método e resposta de cada uma, usado pelo cliente `hc` para chamar o servidor com tipos conferidos pelo compilador. Cada `.get` e cada `.put` encadeados devolvem uma instância do Hono cujo tipo acumula caminho, método e resposta. Uma anotação de retorno com um tipo genérico, tipo que recebe outros tipos como parâmetro, como `: Hono<BffEnv>`, troca esse tipo pelo tipo genérico, sem rotas, e o cliente `hc` passa a enxergar `unknown`.'
  - tipo: conceito
    titulo: Dependência de build sem dependência de execução
    texto: O `import type` é a forma de importação do TypeScript que traz só tipos de outro módulo, e o alias de caminho é um nome curto configurado no `paths` do `tsconfig.json` que o compilador traduz para uma pasta. O `import type` existe apenas para o compilador e desaparece no JavaScript gerado. O microfrontend continua a ser publicado sozinho no S3, e a esteira de integração contínua, sequência automática de verificações a cada mudança, passa a precisar do código e do `node_modules` do BFF para checar os tipos.
  - tipo: comparativo
    colunas:
    - Cópia manual do tipo
    - Tipo derivado do BFF
    linhas:
    - dimensao: Onde o formato é declarado
      valores:
      - 'Duas vezes: no BFF e em `EnderecoForm.tsx`'
      - Uma vez, no BFF, e inferido das rotas
    - dimensao: Renomeação no BFF
      valores:
      - Passa pela compilação e quebra a tela em execução
      - Para o `tsc` e o `npm run build` do microfrontend
    - dimensao: Build do microfrontend
      valores:
      - Precisa só do próprio pacote
      - Precisa do código e das dependências do BFF instaladas
    - dimensao: Bundle publicado
      valores:
      - Só o código do microfrontend
      - O mesmo, porque o `import type` é apagado
  - tipo: adr
    id: ADR-017
    titulo: Contrato de tipos entre MFE e BFF via Hono RPC
    status: Proposta
    contexto: Cada microfrontend mantém uma cópia manual do contrato de resposta do BFF, e nenhum sinal de compilação avisa quando o BFF muda o formato.
    decisao: Cada BFF exporta o tipo das rotas num `contract.ts`, consumido pelo microfrontend com `import type` e alias de caminho, sem pacote publicado.
    alternativas: tRPC, com duas dependências novas e chamadas agrupadas que quebrariam a auditoria por rota do Gateway, e manter os tipos duplicados.
    consequencias: Erro de compilação quando o BFF muda um campo, ao custo de encadear as rotas dos BFFs e de instalar as dependências do BFF na esteira do microfrontend.
  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: 'Esta parte da aba mostra os dois lados do contrato de endereço, o formato de resposta combinado entre o serviço e a tela: no BFF, serviço de back-end dedicado ao microfrontend, em `bffs/endereco/src/`, o tipo da resposta e as rotas do Hono, framework web do BFF, e no microfrontend, em `mfes/endereco/src/`, os tipos copiados à mão e a chamada que os usa. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam por que hoje nenhuma mudança no BFF chega ao compilador do microfrontend.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/endereco/src/legacyBackend.ts
    commit: '2179313'
    linhas:
    - export interface Endereco {
    - '  cep: string'
    - '  logradouro: string'
    - '  numero: string'
    - '}'
    - ''
    - 'const ENDERECO_FIXO: Endereco = {'
    - '  cep: ''01001000'','
    - '  logradouro: ''Praça da Sé'','
    - '  numero: ''1'','
    - '}'
    anotacoes:
    - linha: 1
      texto: Formato declarado no BFF.
    - linha: 10
      texto: Valor fixo devolvido pelo `GET`.
    contexto: O `bffs/endereco/src/legacyBackend.ts` simula o back-end legado do BFF de endereço e declara o tipo `Endereco` que o BFF devolve. O trecho abaixo mostra esse tipo e o endereço fixo que o `GET` responde, o lado do servidor no contrato de tipos desta ODA.
  - tipo: editor
    rotulo: arquivo
    caminho: bffs/endereco/src/routes.ts
    commit: '2179313'
    linhas:
    - 'export function createRoutes(): Hono<BffEnv> {'
    - '  const router = new Hono<BffEnv>()'
    - ''
    - '  router.get(''/usuario/endereco'', (c) => {'
    - '    return c.json(getEndereco())'
    - '  })'
    - ''
    - '  router.put(''/usuario/endereco'', async (c) => {'
    - '    const body = (await c.req.json()) as Endereco'
    - '    const validation = validateEndereco(body)'
    - '    if (!validation.ok) {'
    - '      return c.json({ error: ''invalid_request'', message: validation.message }, 400)'
    - '    }'
    - '    return c.json(putEndereco(validation.value))'
    - '  })'
    - ''
    - '  return router'
    - '}'
    anotacoes:
    - linha: 7
      texto: A anotação de retorno apaga o tipo das rotas registradas abaixo.
    - linha: 10
      texto: Rotas registradas por chamadas separadas, sem encadeamento.
    - linha: 23
      texto: O objeto devolvido tem as rotas em execução, mas o tipo declarado não as conhece.
    inicio: 7
    contexto: O `bffs/endereco/src/routes.ts` cria as rotas Hono do BFF de endereço. O trecho abaixo registra o `GET` e o `PUT` em chamadas separadas e declara o retorno como `Hono<BffEnv>`, e essa forma faz o tipo exportado perder as rotas, informação de que o Hono RPC precisa para gerar o cliente tipado.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/EnderecoForm.tsx
    commit: '2179313'
    linhas:
    - import { useForm } from 'react-hook-form'
    - ''
    - export interface Endereco {
    - '  cep: string'
    - '  logradouro: string'
    - '  numero: string'
    - '}'
    - ''
    - 'export function EnderecoForm({ initial, onSubmit }: { initial: Endereco; onSubmit: (e: Endereco) => void }) {'
    - '  const { register, handleSubmit } = useForm<Endereco>({ defaultValues: initial })'
    - '  return ('
    - '    <form onSubmit={handleSubmit((data) => onSubmit(data))} className="flex max-w-md flex-col gap-4">'
    - '      <label className="flex flex-col gap-1">CEP<input {...register(''cep'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Logradouro<input {...register(''logradouro'')} className="rounded border p-2" /></label>'
    - '      <label className="flex flex-col gap-1">Número<input {...register(''numero'')} className="rounded border p-2" /></label>'
    anotacoes:
    - linha: 3
      texto: Cópia manual do formato do BFF, sem ligação com o original.
    - linha: 15
      texto: O `register` só aceita chaves de `Endereco`, e por isso acusa uma chave que deixa de existir.
    contexto: O `mfes/endereco/src/EnderecoForm.tsx` é o formulário React do microfrontend de endereço. O trecho abaixo declara à mão o tipo `Endereco`, uma cópia do formato do BFF sem ligação com o original, e usa esse tipo nos campos do formulário.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/EnderecoApp.tsx
    commit: '2179313'
    linhas:
    - '  useEffect(() => {'
    - '    client<Endereco>(''/usuario/endereco'').then(setEndereco).catch(() => setEndereco({ cep: '''', logradouro: '''', numero: '''' }))'
    - '    // eslint-disable-next-line react-hooks/exhaustive-deps'
    - '  }, [])'
    anotacoes:
    - linha: 12
      texto: O genérico `<Endereco>` afirma o formato da resposta sem conferi-lo.
    inicio: 11
    contexto: O `mfes/endereco/src/EnderecoApp.tsx` é o componente principal do microfrontend de endereço, que busca os dados no BFF e exibe o formulário. O trecho abaixo faz o `GET` em `/usuario/endereco` e afirma pelo genérico `<Endereco>` o formato da resposta, sem nenhuma conferência contra o tipo do BFF.
  - tipo: editor
    rotulo: arquivo
    caminho: mfes/endereco/src/contract.ts
    commit: '2179313'
    linhas:
    - // Contrato publicado pelo shell (ADR-009). Cópia local para manter o MFE autônomo.
    - export interface MfeMountContext {
    - '  apiUrl: string'
    - '  token: string | null'
    - '  onUnauthorized: () => void'
    - '  basePath: string'
    - '}'
    anotacoes:
    - linha: 1
      texto: A mesma estratégia de cópia local vale para o contrato com o shell.
    contexto: O `mfes/endereco/src/contract.ts` é a cópia local, dentro do microfrontend, do contrato de montagem publicado pelo shell. O arquivo aparece inteiro e mostra que o microfrontend usa a mesma estratégia de cópia manual também no contrato com o shell.
  - tipo: faixa
    estilo: dica
    texto: A ADR-017 do repositório, que propõe derivar o tipo do microfrontend das rotas do BFF, está com status de proposta e registra no cabeçalho que nenhum código foi alterado para ela. O laboratório executa a prova de conceito no BFF de endereço, que tem duas rotas, porque a tabela de riscos da ADR-017 indica esse BFF como primeiro passo, antes do BFF de empréstimo.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o caminho de um tipo do BFF, serviço de back-end do microfrontend, até o build do microfrontend com o Hono RPC, recurso que deriva das rotas um tipo com caminho, método e resposta. O bloco abaixo resume os termos das etapas, e depois você classifica o resultado de cada mudança no BFF antes e depois da prova de conceito.
  - tipo: conceito
    titulo: Termos das etapas
    texto: O `createRoutes` é a função do BFF que registra as rotas no Hono, e o `contract.ts` é o arquivo novo que exporta o tipo delas como `AppType`. O `InferResponseType` é o utilitário do cliente do Hono que extrai desse tipo a resposta de uma rota. O alias de caminho é o nome curto configurado no `paths` do `tsconfig.json`, e o `tsc --noEmit` é o compilador TypeScript conferindo tipos sem gerar arquivos, enquanto o Vitest, framework de testes do repositório, executa os testes sem conferir tipos.
  - tipo: fluxo
    titulo: Do encadeamento de rotas ao erro no build do microfrontend
    etapas:
    - titulo: Rotas encadeadas
      descricao: '`createRoutes` devolve `new Hono<BffEnv>().get(...).put(...)`, e o TypeScript infere o tipo com as duas rotas e as respostas de cada uma.'
    - titulo: contract.ts
      descricao: '`AppType` recebe o tipo de `createRoutes`, e `InferResponseType` extrai a resposta 200 do `GET /usuario/endereco`.'
    - titulo: Alias no microfrontend
      descricao: O `paths` do `tsconfig.json` leva `@bff-endereco/contract` ao arquivo do BFF, e o `hono` é resolvido a partir de `bffs/endereco/node_modules`.
    - titulo: Tipo derivado
      descricao: '`Endereco` passa a ser `EnderecoResposta`, e o `register(''numero'')` e os objetos montados à mão são conferidos contra o formato do BFF.'
    - titulo: Build
      descricao: '`npm run build` roda `tsc --noEmit` antes do `vite build`, e uma divergência para a esteira antes de gerar o bundle.'
  - tipo: classificador
    enunciado: O comando indicado termina com erro ou sem erro?
    categorias:
    - id: erro
      rotulo: Termina com erro
    - id: ok
      rotulo: Termina sem erro
    itens:
    - texto: Sem o contrato, o BFF renomeia `numero`, e o microfrontend roda `npx tsc --noEmit`
      categoria: ok
      explicacao: A cópia manual do tipo continua com `numero`.
    - texto: Com o contrato, o BFF renomeia `numero`, e o microfrontend roda `npx tsc --noEmit`
      categoria: erro
      explicacao: Quatro erros, um em `register('numero')` e três em objetos com `numero`.
    - texto: Com o contrato e a renomeação, o microfrontend roda `npx vitest run`
      categoria: ok
      explicacao: O Vitest não confere tipos, e os 11 testes passam.
    - texto: 'Com o contrato, o BFF acrescenta `complemento: string` ao endereço, e o microfrontend roda `npx tsc --noEmit`'
      categoria: erro
      explicacao: Os objetos montados à mão no microfrontend passam a não ter o campo obrigatório, com `TS2741`.
    - texto: 'Com o contrato, o BFF devolve `consultadoEm: new Date()`, e o microfrontend guarda um `Date` nesse campo'
      categoria: erro
      explicacao: O tipo inferido é `string`, porque a resposta JSON serializa a data como texto.
    - texto: Com o contrato, o microfrontend roda `npx tsc --noEmit` numa esteira sem `bffs/endereco/node_modules`
      categoria: erro
      explicacao: O `hono/client` não é encontrado, com `TS2307`.
    - texto: Com o contrato, o microfrontend roda `npm run build`, sem renomeação no BFF
      categoria: ok
      explicacao: O bundle tem os mesmos 296,05 kB do commit de referência.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é transformar uma quebra de contrato silenciosa, a mudança de formato no BFF que nenhum teste acusa, num erro de compilação do microfrontend, ligando o tipo que ele usa às rotas do BFF, o serviço de back-end que ele consome. Os passos 1 a 4 mostram a renomeação passando pelos testes e pelo `tsc`, os passos 5 a 10 aplicam a prova de conceito com o Hono RPC, recurso que deriva das rotas um tipo com caminho, método e resposta, acompanhando cada erro de compilação, e os passos 11 e 12 repetem a quebra e conferem que o bundle não leva código do BFF. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: faixa
    estilo: objetivo
    problema: O microfrontend de endereço declara à mão, em `mfes/endereco/src/EnderecoForm.tsx`, o formato da resposta do BFF de endereço. Quando o BFF renomeia `numero` para `numeroDoImovel`, os testes e o `tsc` dos dois lados continuam passando, porque cada lado confere o código contra a própria cópia do tipo.
    impacto: A quebra de contrato só aparece com o portal em uso, quando a tela recebe o número do imóvel num campo que ela não lê. Nenhuma etapa da esteira avisa a equipe do microfrontend antes da publicação.
    mecanismo: O BFF passa a exportar num `contract.ts` o tipo derivado das próprias rotas pelo Hono RPC, com as rotas encadeadas e sem anotação de retorno, para que o tipo guarde caminho, método e resposta. O microfrontend importa esse tipo com `import type` por um alias de caminho no `tsconfig.json`, o que leva o tipo ao compilador sem levar código do BFF ao bundle.
    comprovacao: Repetida a mesma renomeação, o `tsc` do microfrontend acusa quatro erros, entre eles `Argument of type '"numero"' is not assignable`, e o `npm run build` para. Desfeita a renomeação, o bundle tem `296.05 kB`, o mesmo tamanho do commit de referência, com `0` ocorrências de código do BFF.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Instalar as dependências
      texto: No microfrontend, o `npm ci` deste commit falha porque o `package-lock.json` está fora de sincronia. O `npm install --no-save` instala sem alterar o lock.
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/endereco && npm ci)
        - (cd mfes/endereco && npm install --no-save)
      sucesso: '`added 69 packages` no BFF e `added 227 packages` no microfrontend, com `git status` sem alterações.'
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - (cd bffs/endereco && npx vitest run)
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
      sucesso: '`Tests 9 passed (9)` no BFF, o `tsc` do microfrontend sem mensagens e `Tests 11 passed (11)` no microfrontend.'
    - titulo: Renomear o campo no BFF
      texto: O comando troca `numero` por `numeroDoImovel` no BFF, inclusive nos testes, como faria quem renomeia o campo com cuidado do lado do BFF.
      editor:
        rotulo: terminal
        linhas:
        - perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
        - (cd bffs/endereco && npx vitest run)
        - (cd bffs/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
      efeito: renomeado
      sucesso: '`Tests 9 passed (9)`, os dois `tsc` sem mensagens e `Tests 11 passed (11)`: nenhum comando acusa a quebra.'
    - titulo: Desfazer a renomeação
      editor:
        rotulo: terminal
        linhas:
        - git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
      efeito: '!renomeado'
      sucesso: '`git status` sem alterações.'
    - titulo: Apontar o microfrontend para o contrato
      texto: Acrescente o alias ao `tsconfig.json` do microfrontend e troque a interface `Endereco` de `EnderecoForm.tsx` pelo tipo importado.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/tsconfig.json e src/EnderecoForm.tsx (alteração)
        commit: '2179313'
        linhas:
        - '// mfes/endereco/tsconfig.json: dentro de compilerOptions'
        - '    "paths": {'
        - '      "@/*": ["./src/*"],'
        - '      "@bff-endereco/contract": ["../../bffs/endereco/src/contract.ts"]'
        - '    }'
        - ''
        - '// mfes/endereco/src/EnderecoForm.tsx: no lugar da interface Endereco'
        - import type { EnderecoResposta } from '@bff-endereco/contract'
        - ''
        - export type Endereco = EnderecoResposta
      efeito: alias_criado
    - titulo: Ver o tipo faltar
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
      sucesso: '`TS2307`: o módulo `@bff-endereco/contract` ainda não existe.'
    - titulo: Criar o contrato no BFF
      texto: 'Crie o arquivo abaixo. Ele não tem código de execução: só tipos derivados de `createRoutes`.'
      editor:
        rotulo: arquivo
        caminho: bffs/endereco/src/contract.ts (novo)
        commit: '2179313'
        linhas:
        - import type { hc, InferResponseType } from 'hono/client'
        - import type { createRoutes } from './routes.ts'
        - ''
        - export type AppType = ReturnType<typeof createRoutes>
        - ''
        - type Cliente = ReturnType<typeof hc<AppType>>
        - ''
        - export type EnderecoResposta = InferResponseType<Cliente['usuario']['endereco']['$get'], 200>
      efeito: contrato_criado
    - titulo: Ler os erros do contrato
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx tsc --noEmit)
      sucesso: Duas mensagens `TS5097` nos imports `.ts` do BFF e `Property 'usuario' does not exist on type 'unknown'` no microfrontend, e a mesma `TS2339` no BFF.
    - titulo: Aceitar imports com extensão .ts e encadear as rotas
      texto: Acrescente a opção abaixo ao `tsconfig.json` do microfrontend, que já tem `noEmit`. Depois, substitua `routes.ts` pela versão encadeada, sem anotação de retorno.
      editor:
        rotulo: arquivo
        caminho: mfes/endereco/tsconfig.json e bffs/endereco/src/routes.ts (alteração)
        commit: '2179313'
        linhas:
        - '// mfes/endereco/tsconfig.json: dentro de compilerOptions, depois de noEmit'
        - '    "allowImportingTsExtensions": true,'
        - ''
        - // bffs/endereco/src/routes.ts
        - import { Hono } from 'hono'
        - import { getEndereco, putEndereco } from './legacyBackend.ts'
        - import type { Endereco } from './legacyBackend.ts'
        - import { validateEndereco } from './validation.ts'
        - import type { BffEnv } from './types.ts'
        - ''
        - export function createRoutes() {
        - '  return new Hono<BffEnv>()'
        - '    .get(''/usuario/endereco'', (c) => {'
        - '      return c.json(getEndereco())'
        - '    })'
        - '    .put(''/usuario/endereco'', async (c) => {'
        - '      const body = (await c.req.json()) as Endereco'
        - '      const validation = validateEndereco(body)'
        - '      if (!validation.ok) {'
        - '        return c.json({ error: ''invalid_request'', message: validation.message }, 400)'
        - '      }'
        - '      return c.json(putEndereco(validation.value))'
        - '    })'
        - '}'
      efeito:
      - extensoes_ts
      - rotas_encadeadas
    - titulo: Conferir os dois lados
      editor:
        rotulo: terminal
        linhas:
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx tsc --noEmit)
        - (cd bffs/endereco && npx vitest run)
        - (cd mfes/endereco && npx vitest run)
      sucesso: Os dois `tsc` sem mensagens, `Tests 9 passed (9)` no BFF e `Tests 11 passed (11)` no microfrontend.
    - titulo: Renomear de novo
      editor:
        rotulo: terminal
        linhas:
        - perl -pi -e 's/\bnumero\b/numeroDoImovel/g' bffs/endereco/src/*.ts bffs/endereco/src/__tests__/*.ts
        - (cd mfes/endereco && npx tsc --noEmit)
        - (cd mfes/endereco && npx vitest run)
        - (cd mfes/endereco && npm run build)
      efeito: renomeado
      sucesso: Quatro erros no `tsc` do microfrontend, entre eles `Argument of type '"numero"' is not assignable`, `Tests 11 passed (11)` no Vitest e o `npm run build` interrompido pelo `tsc`.
    - titulo: Desfazer e conferir o bundle
      editor:
        rotulo: terminal
        linhas:
        - git checkout -- bffs/endereco/src/legacyBackend.ts bffs/endereco/src/validation.ts bffs/endereco/src/__tests__
        - (cd mfes/endereco && npm run build)
        - grep -c -e validateEndereco -e 'Praça da Sé' mfes/endereco/dist/endereco.js
      efeito: '!renomeado'
      sucesso: '`dist/endereco.js  296.05 kB`, o mesmo tamanho do commit de referência, e `0` ocorrências de código do BFF no bundle.'

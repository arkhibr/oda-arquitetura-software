    - titulo: Escrever o teste de Trusted Types
      texto: 'Crie o arquivo abaixo, um teste do Playwright, ferramenta que controla um navegador real. Ele registra as violações desde o início da página e confere o boot e dois sinks, os pontos que transformam texto em código: um `innerHTML` e um `script.src` de outra origem.'

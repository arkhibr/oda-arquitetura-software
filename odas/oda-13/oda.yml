- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta situações que um time encontraria com essa política, a partir do relatório real do portal, da entrega ao coletor e de duas páginas de teste servidas com variantes da política de produção. Escolha a causa de cada uma para ver a explicação e a correção.
  - tipo: incidente
    titulo: Coletor que nunca registra relatórios
    origem: executado
    rotulo_saida: log
    saida: 'adicionado {"type":"csp-violation","destination":"csp-endpoint","status":"Queued","body":{"effectiveDirective":"require-trusted-types-for","disposition":"report","sample":"ServiceWorkerContainer register|/mockServiceWorker.js","sourceFile":"http://localhost:5173/node_modules/.vite/deps/msw_browser.js","lineNumber":2657}}

      atualizado Pending tentativas concluídas: 0

      atualizado Queued tentativas concluídas: 0


      $ curl -s -i -X POST -H ''Content-Type: application/reports+json'' -d ''[]'' http://localhost:5173/__csp-report | head -1

      HTTP/1.1 404 Not Found'
    pergunta: O `SECURITY.md` diz que o handler do MSW registra os relatórios com `[csp-report]`. Por que o prefixo nunca aparece no console?
    correcao: Atender `/__csp-report` no próprio servidor do Vite, com um plugin que registre o corpo e responda 204, ou apontar `Reporting-Endpoints` para um coletor real.
    alternativas:
    - texto: O MSW não foi iniciado.
      correta: false
      explicacao: A própria violação vem do registro do Service Worker do MSW.
    - texto: O navegador envia o relatório pela Reporting API, fora do `fetch` da página, e o Service Worker do MSW não intercepta esse envio. O Vite responde 404.
      correta: true
      explicacao: O relatório voltou à fila com zero tentativas concluídas.
    - texto: O relatório só é enviado em produção.
      correta: false
      explicacao: O navegador enfileirou e tentou enviar o relatório em desenvolvimento.
  - tipo: incidente
    titulo: 'Origem blob: dada como indispensável'
    origem: executado
    rotulo_saida: log
    saida: '# script-src com e sem blob:, ambos com nonce e strict-dynamic

      /com-blob {"inlineSemNonce":"não executou","violacoes":["script-src-elem inline"],"importBlob":"carregou 1"}

      /sem-blob {"inlineSemNonce":"não executou","violacoes":["script-src-elem inline"],"importBlob":"carregou 1"}'
    pergunta: O `SECURITY.md` diz que `blob:` não pode sair do `script-src`. O que mostra a página de teste no Chromium?
    correcao: Registrar no `SECURITY.md` que, nos navegadores com `strict-dynamic`, `blob:` é ignorado e serve de reserva para navegadores sem suporte a essa diretiva.
    alternativas:
    - texto: Sem `blob:`, o microfrontend não carrega.
      correta: false
      explicacao: A importação carregou nas duas variantes.
    - texto: Com `blob:`, o script inline também executa.
      correta: false
      explicacao: O script inline foi bloqueado nas duas variantes.
    - texto: O `import()` do `Blob` carregou nas duas políticas, porque o `strict-dynamic` faz o navegador ignorar as origens listadas, `blob:` incluída.
      correta: true
      explicacao: O script inline sem nonce foi bloqueado nas duas, apesar do `'unsafe-inline'`.
  - tipo: incidente
    titulo: Relatório com a linha 2657 de um arquivo do Vite
    origem: executado
    rotulo_saida: log
    saida: adicionado {"type":"csp-violation","destination":"csp-endpoint","status":"Queued","body":{"effectiveDirective":"require-trusted-types-for","disposition":"report","sample":"ServiceWorkerContainer register|/mockServiceWorker.js","sourceFile":"http://localhost:5173/node_modules/.vite/deps/msw_browser.js","lineNumber":2657}}
    pergunta: O relatório aponta `msw_browser.js`, linha 2657. Onde fica o código responsável?
    correcao: Ler o `sourceFile` como pista e localizar a chamada no pacote original, aqui o `worker.start()` de `src/main.tsx`, que registra o Service Worker do MSW.
    alternativas:
    - texto: No pacote `msw`, pré-processado pelo Vite em `node_modules/.vite/deps`, chamado pelo `worker.start()` do boot de desenvolvimento.
      correta: true
      explicacao: A amostra `ServiceWorkerContainer register|/mockServiceWorker.js` identifica o sink e a URL.
    - texto: Num microfrontend carregado do LocalStack.
      correta: false
      explicacao: O arquivo é servido pelo Vite na origem do shell.
    - texto: No `nginx.conf.template`.
      correta: false
      explicacao: O Nginx só envia o cabeçalho e não executa JavaScript.
  - tipo: incidente
    titulo: Política default que aprova qualquer URL
    origem: codigo
    rotulo_saida: arquivo
    saida: 'createScriptURL: (url) => url'
    pergunta: Uma equipe propõe esta política `default` para acabar com os relatórios. Qual é o problema?
    correcao: Manter uma lista fechada de URLs na mesma origem e devolver `null` para as demais, como no laboratório.
    alternativas:
    - texto: O nome `default` é proibido pelo cabeçalho.
      correta: false
      explicacao: '`trusted-types default` permite exatamente esse nome.'
    - texto: Ela aprova toda string atribuída a `script.src`, inclusive de outra origem, e o terceiro teste do laboratório deixaria de ver a violação de `cdn.exemplo.com`.
      correta: true
      explicacao: A política `default` é aplicada a todas as atribuições sem objeto confiável.
    - texto: Ela quebra o MSW.
      correta: false
      explicacao: O MSW receberia a URL aprovada.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Que problema o `strict-dynamic` resolve na política de produção?
      alternativas:
      - texto: Porque os buckets não têm HTTPS.
        correta: false
        explicacao: A validação do manifesto exige HTTPS em produção.
      - texto: Porque o `strict-dynamic` libera também as conexões de API.
        correta: false
        explicacao: O `connect-src` continua explícito.
      - texto: Porque os scripts carregados por um script com nonce herdam a confiança, e a lista de buckets cresceria a cada microfrontend.
        correta: true
        explicacao: É o argumento da ADR-012.
    - enunciado: 'O que significa `disposition: report` num relatório?'
      alternativas:
      - texto: Que a política estava em Report-Only e a ação continuou.
        correta: true
        explicacao: Com enforcement, a disposição seria `enforce` e a ação seria bloqueada.
      - texto: Que o relatório já foi entregue.
        correta: false
        explicacao: A entrega aparece no `status` da Reporting API.
      - texto: Que a violação é de CSP de recursos.
        correta: false
        explicacao: A diretiva aparece em `effectiveDirective`.
    - enunciado: Por que a política do laboratório se chama `default`?
      alternativas:
      - texto: Porque o Vite exige.
        correta: false
        explicacao: O Vite só envia o cabeçalho.
      - texto: Porque o cabeçalho só permite esse nome, e o navegador a aplica às strings atribuídas aos sinks.
        correta: true
        explicacao: Políticas com outros nomes exigiriam mudar `trusted-types`.
      - texto: Porque é o nome usado pelo MSW.
        correta: false
        explicacao: O MSW não cria políticas.
    - enunciado: O que acontecerá com `element.innerHTML = texto` quando Trusted Types passar a enforcement?
      alternativas:
      - texto: O texto será sanitizado automaticamente.
        correta: false
        explicacao: A sanitização exige uma política com `createHTML`.
      - texto: Nada muda.
        correta: false
        explicacao: Enforcement bloqueia o que hoje é reportado.
      - texto: A atribuição lançará exceção, porque a política do laboratório não converte HTML.
        correta: true
        explicacao: O segundo teste confere que essa atribuição continua reportada.
    - enunciado: Por que o relatório nunca chegou ao handler do MSW?
      alternativas:
      - texto: A Reporting API envia o relatório fora da página, e o Service Worker não o intercepta.
        correta: true
        explicacao: O Vite respondeu 404.
      - texto: O handler tem um erro de sintaxe.
        correta: false
        explicacao: O handler nunca é chamado.
      - texto: O relatório foi descartado pelo `strict-dynamic`.
        correta: false
        explicacao: A política de desenvolvimento nem usa `strict-dynamic`.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O efeito de nonce, `strict-dynamic` e `default-src 'none'` está claro.
    - O relatório do MSW foi lido e ligado ao código que o produziu.
    - O teste de Trusted Types falhou antes da política `default` e passou depois.
    - A política aprova só a URL do Service Worker na mesma origem.
    - A falha de entrega dos relatórios em desenvolvimento foi identificada.

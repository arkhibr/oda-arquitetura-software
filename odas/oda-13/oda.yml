- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o caminho do relatório que o navegador monta quando a página viola a política de segurança, desde a atribuição que viola a regra até o coletor que deveria recebê-lo. Acompanhe as etapas e depois classifique o efeito de cada diretiva da CSP de produção, cabeçalho com que o servidor diz ao navegador o que a página pode carregar e para onde pode se conectar.
  - tipo: conceito
    titulo: O que acontece no caminho do relatório
    texto: O MSW, biblioteca que simula o back-end em desenvolvimento, funciona por um Service Worker, script que o navegador registra para interceptar as requisições da página. A política de desenvolvimento exige Trusted Types, recurso que obriga os sinks de script, como o endereço passado a `register`, a receber objetos aprovados por uma política da aplicação, e sem política `default` a string comum é uma violação. Como a política está em Report-Only, que só reporta, o registro continua, e a Reporting API, mecanismo do navegador que envia os relatórios em segundo plano, tenta entregá-lo ao destino `csp-endpoint`.
  - tipo: fluxo
    titulo: Da atribuição ao coletor
    etapas:
    - titulo: Atribuição
      descricao: O MSW registra o Service Worker passando a string `/mockServiceWorker.js` ao método `register`, na linha 2657 do bundle pré-processado pelo Vite.
    - titulo: Verificação
      descricao: O navegador procura uma política `default` para converter a string e, como ela não existe, registra a violação `require-trusted-types-for`.
    - titulo: Disposição
      descricao: 'Com `disposition: report`, o registro do Service Worker continua e o evento `securitypolicyviolation` é disparado na página.'
    - titulo: Fila
      descricao: A Reporting API põe o relatório na fila do destino `csp-endpoint` e o envia em lote, fora do JavaScript da página.
    - titulo: Entrega
      descricao: O `POST` vai para `/__csp-report` no Vite, que responde 404, e o relatório volta à fila com zero tentativas concluídas.
  - tipo: conceito
    titulo: As diretivas do classificador
    texto: 'Na produção, a CSP está em bloqueio e combina um nonce, valor aleatório por requisição que só os scripts do HTML conhecem, com o `strict-dynamic`, que estende a confiança aos scripts carregados por eles e faz o navegador ignorar o `''unsafe-inline''`. A diretiva `connect-src` limita os destinos do `fetch`, `frame-ancestors ''none''` impede que outro site embuta o portal num `<iframe>`, `img-src ''self'' data: blob:` libera imagens da própria origem e embutidas, e `base-uri ''self''` impede que um `<base href>` mude a origem dos caminhos relativos. A exigência de Trusted Types fica num cabeçalho Report-Only separado.'
  - tipo: classificador
    enunciado: Na política de produção, o que acontece em cada caso?
    categorias:
    - id: bloqueia
      rotulo: Bloqueia
    - id: reporta
      rotulo: Só reporta
    - id: permite
      rotulo: Permite
    itens:
    - texto: '`<script>` inline injetado sem nonce'
      categoria: bloqueia
      explicacao: Com nonce e `strict-dynamic`, o navegador ignora o `'unsafe-inline'` da diretiva.
    - texto: '`import()` de uma URL `blob:` feito por `main.tsx`'
      categoria: permite
      explicacao: O `strict-dynamic` cobre scripts carregados por um script confiável.
    - texto: '`element.innerHTML = dadosDoUsuario`'
      categoria: reporta
      explicacao: Trusted Types está no cabeçalho Report-Only.
    - texto: '`fetch` para uma origem fora de `${CSP_CONNECT_SRC}`'
      categoria: bloqueia
      explicacao: '`connect-src` está em bloqueio, e o `strict-dynamic` não vale para conexões.'
    - texto: Portal embutido num `<iframe>` de outro site
      categoria: bloqueia
      explicacao: '`frame-ancestors ''none''`.'
    - texto: Imagem `data:` no shell
      categoria: permite
      explicacao: '`img-src ''self'' data: blob:`.'
    - texto: '`<base href>` apontando para outro domínio'
      categoria: bloqueia
      explicacao: '`base-uri ''self''`.'
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é deixar o portal compatível com a exigência de Trusted Types, recurso do navegador que recusa strings comuns nos pontos que transformam texto em código, para que ela possa passar de relatório a bloqueio e fechar o caminho do XSS baseado em DOM, ataque em que um texto do atacante passa a executar como script na página. Os passos 1 e 2 sobem o servidor de desenvolvimento e conferem o coletor de relatórios de violação, os passos 3 a 7 escrevem o teste, mostram a violação do boot e a eliminam com uma política `default`, função que o navegador chama para aprovar ou recusar cada string, que aprova só a URL do Service Worker do MSW, a biblioteca que simula o back-end em desenvolvimento, e o passo 8 confere tipos e lint. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: faixa
    estilo: objetivo
    problema: O portal escreve strings em sinks, os pontos do navegador que transformam texto em código, como `innerHTML` e `script.src`, e é por eles que entra o XSS baseado em DOM. A exigência de Trusted Types que fecha esse caminho está só em Report-Only, modo que reporta sem bloquear, no `nginx.conf.template` e no `vite.config.ts`. O próprio boot de desenvolvimento viola a exigência, porque o MSW registra o Service Worker passando a string `/mockServiceWorker.js` ao `register` e nenhuma política `default` aprova esse valor.
    impacto: Um XSS baseado em DOM executa script de terceiros na sessão do cliente, com acesso ao que a página mostra e às chamadas que ela faz em nome dele. Enquanto o boot gerar violação, a exigência não pode passar a bloqueio, porque o navegador bloquearia o registro do Service Worker e o portal de desenvolvimento ficaria sem o back-end simulado do MSW.
    mecanismo: Um teste no Playwright, ferramenta que controla um navegador real, escrito antes, registra as violações desde o início da página. A política `default` de Trusted Types criada em `src/shared/lib/trustedTypes.ts` aprova só a URL do Service Worker do MSW na mesma origem e devolve `null` para qualquer outro valor, e o `src/main.tsx` a registra antes de `prepare()`, que inicia o MSW.
    comprovacao: O teste novo falha primeiro com `1 failed` e `2 passed`, com `ServiceWorkerContainer register|/mockServiceWorker.js` na lista de violações do boot, e passa depois com `3 passed`, junto de `4 passed` com o `csp.spec.ts` existente. Os outros dois testes mostram que um `innerHTML` e um `script.src` de outra origem continuam gerando violação, porque a política não os aprova, e o `tsc` e o `eslint src/` terminam sem mensagens.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'

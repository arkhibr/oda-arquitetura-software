id: '13'
titulo: Segurança no navegador
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é proteger o portal contra o XSS baseado em DOM, ataque que executa script de terceiros na sessão do cliente, avaliando o código contra uma política de segurança de conteúdo estrita, a Content Security Policy (CSP), e interpretando os relatórios de violação que o navegador envia. O `frontend-react` executa código de outras origens, e a exigência de Trusted Types, que fecha o caminho do XSS baseado em DOM, continua só em modo de relatório porque o próprio boot de desenvolvimento a viola. Você vai ler a política de produção diretiva por diretiva, interpretar o relatório que o boot gera e deixar o portal compatível com essa exigência por meio de uma política `default` restrita, com o teste escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: CSP (Content Security Policy)
      definicao: Cabeçalho HTTP com que o servidor informa ao navegador de quais origens a página pode carregar scripts, estilos e imagens e para onde ela pode abrir conexões. O navegador bloqueia o que a política não autoriza e pode enviar um relatório de cada violação a um endereço configurado.
      referencia:
        rotulo: MDN · Utilizando Políticas de Segurança de Conteúdo
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
    - termo: Diretiva
      definicao: Cada regra de uma CSP, formada por um nome e uma lista de valores. `script-src` diz de onde vêm os scripts, `connect-src` diz para onde a página pode abrir conexões, `default-src 'none'` proíbe tudo o que outra diretiva não liberar, `frame-ancestors` diz quem pode embutir a página num `<iframe>` e `base-uri` limita o elemento `<base>`.
      referencia:
        rotulo: MDN · Content-Security-Policy
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
    - termo: Trusted Types
      definicao: Recurso do navegador que, quando a CSP traz `require-trusted-types-for 'script'`, recusa strings comuns nos pontos da página que interpretam texto como código ou como endereço de script e passa a exigir objetos criados por uma política registrada pela aplicação. Ele protege contra o XSS baseado em DOM.
      referencia:
        rotulo: MDN · Trusted Types API
        url: https://developer.mozilla.org/en-US/docs/Web/API/Trusted_Types_API
    - termo: Política default de Trusted Types
      definicao: Política registrada com o nome `default`, que o navegador chama automaticamente sempre que uma string comum é atribuída a um sink. Ela devolve o valor aprovado ou `null`, e o `null` faz o navegador recusar a atribuição.
    - termo: Sink
      definicao: Propriedade ou função do navegador que transforma texto em código executável ou em endereço de script, como `innerHTML`, `script.src` e `eval`. Uma string maliciosa que chega a um sink pode executar código na página.
    - termo: Relatório de violação e Reporting API
      definicao: Quando uma diretiva é violada, o navegador dispara o evento `securitypolicyviolation` na página e monta um relatório com a diretiva, o arquivo e a linha. A Reporting API envia esse relatório em segundo plano ao endereço declarado no cabeçalho `Reporting-Endpoints`, aqui o destino `csp-endpoint`.
      referencia:
        rotulo: MDN · Reporting API
        url: https://developer.mozilla.org/en-US/docs/Web/API/Reporting_API
    - termo: Enforcement e Report-Only
      definicao: 'Em enforcement, enviada no cabeçalho `Content-Security-Policy`, a política bloqueia o que viola. Em Report-Only, enviada no cabeçalho `Content-Security-Policy-Report-Only`, a política só reporta a violação e deixa a ação continuar, o que aparece no relatório como `disposition: report`.'
      referencia:
        rotulo: MDN · Content-Security-Policy-Report-Only
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy-Report-Only
    - termo: Nonce
      definicao: Valor aleatório gerado a cada requisição, gravado no cabeçalho da CSP e no atributo `nonce` dos scripts da página. Só os scripts que trazem o nonce da requisição executam, e um script injetado por um atacante não o conhece.
      referencia:
        rotulo: MDN · nonce
        url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/nonce
    - termo: strict-dynamic
      definicao: Valor da diretiva `script-src` que estende a confiança de um script autorizado pelo nonce aos scripts que ele carregar. Com ele, o navegador ignora as listas de origens e o `'unsafe-inline'` da mesma diretiva.
      referencia:
        rotulo: 'MDN · Content-Security-Policy: script-src'
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/script-src
    - termo: Playwright e Chromium
      definicao: O Playwright é uma ferramenta que controla um navegador real para testar a aplicação de ponta a ponta. O Chromium é o navegador de código aberto em que se baseia o Google Chrome, e o Playwright baixa uma versão própria dele com `npx playwright install chromium`.
      referencia:
        rotulo: Playwright · Installation
        url: https://playwright.dev/docs/intro
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta as requisições HTTP da página e devolve respostas simuladas definidas em handlers. No `frontend-react`, os handlers ficam em `src/mocks/`, e o MSW só é iniciado em desenvolvimento, pelo `worker.start()` de `src/main.tsx`.
      referencia:
        rotulo: Mock Service Worker · Introduction
        url: https://mswjs.io/docs/
    - termo: Service Worker
      definicao: Script que o navegador registra para uma origem e executa separado da página, capaz de interceptar as requisições que a página faz. O MSW funciona no navegador por meio de um Service Worker, o arquivo `/mockServiceWorker.js`.
      referencia:
        rotulo: MDN · API do Service Worker
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Service_Worker_API
    - termo: Shell e microfrontend
      definicao: O shell é a aplicação React da pasta `src/` que cuida do login, do layout e das rotas e carrega os microfrontends em tempo de execução. Um microfrontend é uma parte da interface com build e deploy próprios, cujo bundle o shell baixa de um bucket de outra origem.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas consideradas e as consequências. A ADR-012 trata da CSP estrita e a ADR-013 trata de Trusted Types e da Reporting API.
      referencia:
        rotulo: Architectural Decision Records (ADRs)
        url: https://adr.github.io/
    - termo: Nginx e Vite
      definicao: O Nginx é o servidor web que entrega o shell compilado em produção e envia a CSP de produção. O Vite é a ferramenta de build e o servidor de desenvolvimento do shell, na porta 5173, e envia a política de desenvolvimento.
      referencia:
        rotulo: Vite · Getting Started
        url: https://vite.dev/guide/
    - termo: XSS (Cross-Site Scripting) baseado em DOM
      definicao: Ataque em que um texto controlado pelo atacante chega a um sink e passa a executar como script na página da vítima, com o acesso que a sessão dela tem. No XSS baseado em DOM, o caminho todo acontece no JavaScript do navegador, sem passar pelo servidor.
      referencia:
        rotulo: OWASP · DOM Based XSS
        url: https://owasp.org/www-community/attacks/DOM_Based_XSS
    - termo: envsubst
      definicao: Comando que substitui variáveis de ambiente num arquivo de texto. Na imagem de produção, ele preenche as variáveis `CSP_` do modelo de configuração do Nginx quando o contêiner inicia.
    - termo: HMR (Hot Module Replacement)
      definicao: Recurso do servidor de desenvolvimento do Vite que troca no navegador o módulo alterado sem recarregar a página. Ele depende de script inline e de `eval`, e por isso a política de desenvolvimento os libera.
      referencia:
        rotulo: Vite · HMR API
        url: https://vite.dev/guide/api-hmr
    - termo: Hash SHA-256 e URL `blob:`
      definicao: O hash SHA-256 é um resumo do conteúdo do bundle, conferido contra o manifesto antes da execução. A URL `blob:` aponta para dados guardados na memória do navegador, e o shell importa o bundle conferido por uma URL desse tipo.
      referencia:
        rotulo: 'MDN · blob: URLs'
        url: https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Schemes/blob
    - termo: LocalStack
      definicao: Emulador dos serviços da AWS que roda num contêiner Docker na sua máquina. O `frontend-react` usa o S3 do LocalStack para hospedar os bundles dos microfrontends em desenvolvimento.
      referencia:
        rotulo: LocalStack · Overview
        url: https://docs.localstack.cloud/getting-started/
    - termo: TypeScript e ESLint
      definicao: O compilador do TypeScript, `tsc`, confere os tipos do código, e o ESLint aplica regras de estilo e de arquitetura. O último passo do laboratório roda os dois para garantir que a política nova não introduz erros.
      referencia:
        rotulo: ESLint · Getting Started
        url: https://eslint.org/docs/latest/use/getting-started
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar o papel do nonce, do `strict-dynamic` e de `default-src 'none'` na política de produção.
    - Separar a CSP de recursos, em enforcement, da política de Trusted Types, em Report-Only.
    - Ler um relatório de violação e localizar o código que o produziu.
    - Registrar uma política `default` de Trusted Types com lista fechada de URLs, com o teste escrito antes.
    - Verificar se o relatório chega ao coletor configurado.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. Os testes usam o Chromium do Playwright, instalado com `npx playwright install chromium`, e os comandos usam a sintaxe do bash ou do zsh, no Git Bash ou no WSL no Windows.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica como o navegador decide o que a página do portal pode executar e para onde ela pode se conectar, a partir de duas camadas de política que o `frontend-react` envia em cabeçalhos HTTP. Os blocos abaixo ensinam a CSP e as diretivas, a diferença entre bloquear e só reportar, o ataque que Trusted Types previne, a política `default` e o relatório de violação, e depois o comparativo mostra como o Nginx, servidor web de produção, e o Vite, servidor de desenvolvimento, enviam políticas diferentes. As duas ADRs do fim registram por que o repositório escolheu esse desenho.
  - tipo: conceito
    titulo: CSP (Content Security Policy) e diretivas
    texto: 'A CSP é um cabeçalho HTTP com que o servidor diz ao navegador de onde a página pode carregar scripts, estilos e imagens e para onde ela pode abrir conexões. A política é uma lista de diretivas, cada uma com um nome e os valores permitidos: `script-src` diz de onde vêm os scripts, `connect-src` diz para onde o `fetch` pode ir, `img-src` cobre as imagens e `default-src ''none''` proíbe tudo o que outra diretiva não liberar. No `frontend-react`, a CSP importa porque o shell, a aplicação React que hospeda o portal, executa microfrontends baixados de outra origem em tempo de execução.'
    analogia: 'A CSP funciona como a lista de visitantes autorizados na portaria de um prédio, entregue pelo síndico a cada visita: o porteiro, que é o navegador, barra quem não está na lista.'
  - tipo: conceito
    titulo: Bloqueio (enforcement) e Report-Only
    texto: 'A mesma política pode ser enviada de dois jeitos. No cabeçalho `Content-Security-Policy`, ela é aplicada com bloqueio, chamado de enforcement, e o navegador impede o que a política proíbe. No cabeçalho `Content-Security-Policy-Report-Only`, ela só reporta: o navegador deixa a ação continuar e registra a violação, o que permite medir o impacto de uma regra antes de ligá-la. No portal de produção, a CSP de recursos está em bloqueio e a exigência de Trusted Types está em Report-Only.'
  - tipo: conceito
    titulo: XSS baseado em DOM e sinks
    texto: Sink é uma propriedade ou função do navegador que transforma texto em código executável ou em endereço de script, como `innerHTML`, `script.src` e `eval`. No XSS (Cross-Site Scripting) baseado em DOM, um texto controlado pelo atacante chega a um desses sinks pelo próprio JavaScript da página e passa a executar como script, com o acesso que a sessão do cliente tem. A CSP de recursos não impede esse caminho, porque o código que escreve no sink já foi autorizado a rodar.
  - tipo: conceito
    titulo: Trusted Types e a política default
    texto: 'Trusted Types é o recurso do navegador que fecha esse caminho. Com a diretiva `require-trusted-types-for ''script''`, os sinks de script deixam de aceitar strings comuns e passam a exigir objetos criados por uma política registrada pela aplicação. Uma política com o nome `default` é chamada automaticamente pelo navegador a cada string atribuída a um sink: ela devolve o valor aprovado ou `null`, e o `null` faz o navegador recusar a atribuição.'
  - tipo: conceito
    titulo: Relatório de violação
    texto: Quando uma diretiva é violada, o navegador dispara o evento `securitypolicyviolation` na página e monta um relatório com a diretiva violada, o arquivo, a linha e a disposição, que é `report` em Report-Only e `enforce` em bloqueio. A Reporting API, mecanismo do navegador que envia esses relatórios em segundo plano, os entrega ao endereço declarado no cabeçalho `Reporting-Endpoints`, aqui com o nome `csp-endpoint`. É por esse relatório que o time descobre que código viola a política antes de passar a bloquear.
  - tipo: conceito
    titulo: Nonce e strict-dynamic
    texto: O nonce é um valor aleatório gerado a cada requisição. O Nginx o grava no cabeçalho da CSP e no atributo `nonce` dos scripts do HTML, e só os scripts que trazem o nonce da requisição executam, de modo que um script injetado por um atacante não o conhece. Com `strict-dynamic`, valor da diretiva `script-src`, os scripts carregados por um script confiável herdam a confiança, e o navegador ignora as listas de origem e o `'unsafe-inline'` da mesma diretiva.
  - tipo: comparativo
    colunas:
    - Produção (Nginx)
    - Desenvolvimento (Vite)
    linhas:
    - dimensao: CSP de recursos
      valores:
      - Bloqueio, com nonce por requisição e `strict-dynamic`
      - Report-Only, com `'unsafe-inline'` e `'unsafe-eval'` para a troca de módulos sem recarga da página (HMR)
    - dimensao: Trusted Types
      valores:
      - Cabeçalho Report-Only separado
      - Na mesma política Report-Only
    - dimensao: Coletor
      valores:
      - '`${CSP_REPORT_URI}`, variável preenchida pelo `envsubst` quando o contêiner inicia'
      - '`/__csp-report`, que o Vite não atende'
    - dimensao: Arquivo
      valores:
      - '`nginx.conf.template`, repetido nos três blocos `location`, as seções que configuram cada caminho servido'
      - '`vite.config.ts`, em `server.headers`'
  - tipo: adr
    id: ADR-012
    titulo: Content Security Policy estrito e baseline de segurança
    status: Proposed
    contexto: O shell importa microfrontends de buckets de outra origem em tempo de execução, e listar cada bucket no `script-src` daria uma lista frágil e crescente.
    decisao: '`strict-dynamic` com nonce por requisição, aplicado pelo Nginx em produção, e política Report-Only no Vite em desenvolvimento.'
    alternativas: Lista de origens de bucket no `script-src` e hashes de script, inviáveis com bundles carregados dinamicamente.
    consequencias: Só o que o shell originou executa, e as origens de API continuam a exigir `connect-src` explícito.
  - tipo: adr
    id: ADR-013
    titulo: Trusted Types e Reporting API em Report-Only
    status: Proposed
    contexto: A CSP de recursos não impede que código autorizado escreva dados não confiáveis em sinks como `innerHTML`, `script.src` ou `eval`.
    decisao: Trusted Types em Report-Only, com relatórios enviados pela Reporting API ao endpoint `csp-endpoint`.
    alternativas: Bloqueio imediato, que derrubaria microfrontends com HTML cru, e nenhuma defesa contra o XSS baseado em DOM.
    consequencias: Visibilidade das violações antes de bloquear, ao custo de manter um coletor e de migrar cada microfrontend antes do bloqueio.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra onde o repositório define e testa a CSP, cabeçalho HTTP com que o servidor diz ao navegador de onde a página pode carregar scripts e para onde pode se conectar: o `nginx.conf.template`, configuração do servidor web de produção, o `vite.config.ts`, configuração do servidor de desenvolvimento, o coletor de relatórios de violação do MSW, biblioteca que simula o back-end em desenvolvimento, e o carregamento de microfrontends, as partes do portal baixadas de outra origem. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam cada diretiva e o caminho dos relatórios de violação.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: nginx.conf.template
    commit: '2179313'
    linhas:
    - server {
    - '    listen 80;'
    - '    root /usr/share/nginx/html;'
    - '    index index.html;'
    - ''
    - '    # Nonce único por requisição (fonte: $request_id). Ver SECURITY.md / risco R4.'
    - '    set $csp_nonce $request_id;'
    - ''
    - '    gzip on;'
    - '    gzip_vary on;'
    - '    gzip_types text/plain text/css application/javascript application/json image/svg+xml;'
    - ''
    - '    # Bloco de cabeçalhos de segurança — repetido em cada location (sem herança no add_header).'
    - '    # $csp_nonce é variável de runtime do Nginx (NÃO sofre envsubst, pois o filtro é ^CSP_).'
    - '    # ${CSP_CONNECT_SRC} e ${CSP_REPORT_URI} são substituídos por envsubst no boot do container.'
    anotacoes:
    - linha: 7
      texto: O nonce, valor que autoriza os scripts da página, é o identificador da requisição, diferente a cada `GET`.
    - linha: 14
      texto: O filtro do `envsubst`, comando que preenche variáveis de ambiente quando o contêiner inicia, preserva as variáveis do próprio Nginx.
    contexto: O `nginx.conf.template` é o modelo de configuração do Nginx, servidor web que entrega o shell compilado no contêiner de produção, e o `envsubst` preenche as variáveis `CSP_` quando o contêiner inicia. O trecho abaixo define o nonce, valor aleatório que autoriza os scripts da página, de cada requisição a partir do `$request_id` e explica quais variáveis o `envsubst` substitui.
  - tipo: editor
    rotulo: arquivo
    caminho: nginx.conf.template
    commit: '2179313'
    linhas:
    - '    location = /index.html {'
    - '        add_header Cache-Control "no-cache, no-store, must-revalidate" always;'
    - '        add_header Content-Security-Policy "default-src ''none''; script-src ''nonce-$csp_nonce'' ''strict-dynamic'' blob: https: ''unsafe-inline''; style-src ''self'' ''nonce-$csp_nonce''; img-src ''self'' data: blob:; font-src ''self''; connect-src ''self'' ${CSP_CONNECT_SRC}; worker-src ''self''; manifest-src ''self''; base-uri ''self''; form-action ''self''; frame-ancestors ''none''; object-src ''none''; upgrade-insecure-requests; report-to csp-endpoint" always;'
    - '        add_header Content-Security-Policy-Report-Only "require-trusted-types-for ''script''; trusted-types default; report-to csp-endpoint" always;'
    - '        add_header Reporting-Endpoints "csp-endpoint=\"${CSP_REPORT_URI}\"" always;'
    - '        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;'
    - '        add_header X-Content-Type-Options "nosniff" always;'
    - '        add_header Referrer-Policy "strict-origin-when-cross-origin" always;'

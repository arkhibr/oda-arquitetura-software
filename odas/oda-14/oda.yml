- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que um time encontraria ao escolher e manter testes, a partir de saídas do laboratório e de uma verificação feita depois da mudança no ESLint, ferramenta de análise estática do código. O bloco abaixo resume os conceitos que os incidentes usam, e em cada incidente você escolhe a causa para ver a explicação e a correção.
  - tipo: conceito
    titulo: Conceitos usados nos incidentes
    texto: O ESLint do shell usa a regra `boundaries/dependencies`, que classifica cada arquivo num elemento, como `shared` ou `features`, pelo primeiro padrão de caminho que casa com ele, e diz que elementos podem importar quais. Essas camadas seguem o Feature-Sliced Design, metodologia que organiza o código em camadas com dependência num único sentido. O `HttpResponse.html` é o utilitário do MSW que monta uma resposta HTML, e o benchmark da ordenação mede a função `resolveLoadOrder`, que usa o algoritmo de Kahn para pôr cada microfrontend depois das dependências que ele declara.
  - tipo: incidente
    titulo: Portal que não inicia num ambiente novo
    origem: executado
    rotulo_saida: log
    saida: "     × segue sem erro quando o servidor devolve o index.html no lugar do config.json 2ms\nAssertionError: promise rejected \"Error: [config] /config.json inválido: Sy…\" instead of resolving\nCaused by: Error: [config] /config.json inválido: SyntaxError: Unexpected token '<', \"<!doctype \"... is not valid JSON\nCaused by: SyntaxError: Unexpected token '<', \"<!doctype \"... is not valid JSON\n      Tests  1 failed | 3 passed (4)"
    pergunta: A imagem foi publicada sem `config.json`, e o portal mostra a tela de falha de boot. O que aconteceu?
    correcao: Conferir o `content-type` antes de ler o corpo, como no passo 4, ou servir `config.json` com um `location` próprio que responda 404 quando o arquivo falta.
    alternativas:
    - texto: O `config.json` estava com vírgula sobrando.
      correta: false
      explicacao: O arquivo não existia no ambiente.
    - texto: O Nginx devolveu o `index.html` com status 200, e o `loadConfig` tentou lê-lo como JSON.
      correta: true
      explicacao: O teste reproduz a resposta do `try_files` com `HttpResponse.html`.
    - texto: O navegador bloqueou o `fetch` pela CSP.
      correta: false
      explicacao: O `connect-src 'self'` permite a própria origem.
  - tipo: incidente
    titulo: Lint recusando o teste com MSW
    origem: executado
    rotulo_saida: log
    saida: "> frontend-react@0.0.0 lint\n> eslint src/\n\n\n./src/shared/config/__tests__/config.test.ts\n  3:24  error  Dependencies to elements of type \"mocks\" are not allowed in elements of type \"shared\". Denied by rule at index 0  boundaries/dependencies\n\n✖ 1 problem (1 error, 0 warnings)"
    pergunta: Por que a regra de fronteiras recusa um arquivo de teste?
    correcao: Declarar os arquivos de `__tests__` como um elemento próprio, como no passo 6, e manter a regra para o código de produção.
    alternativas:
    - texto: O MSW não pode ser usado em testes de unidade.
      correta: false
      explicacao: O `test-setup.ts` inicia o MSW para todos os testes.
    - texto: O alias `@` não funciona no ESLint.
      correta: false
      explicacao: O erro cita o tipo de elemento, que o plugin resolveu pelo alias.
    - texto: O padrão `src/shared/**` também casa com `src/shared/config/__tests__`, e `shared` não pode importar nada.
      correta: true
      explicacao: A regra de índice 0 é a de `shared`, com `disallow` para todos os tipos.
  - tipo: incidente
    titulo: Fronteira aberta para todo o shared
    origem: executado
    rotulo_saida: log
    saida: "# src/shared/lib/vazamento.ts, arquivo de produção criado só para a verificação\nimport { server } from '@/mocks/server'\n\n$ npm run lint\n  1:24  error  Dependencies to elements of type \"mocks\" are not allowed in elements of type \"shared\". Denied by rule at index 1  boundaries/dependencies\n✖ 1 problem (1 error, 0 warnings)"
    pergunta: Depois do passo 6, um arquivo de produção em `shared` consegue importar os mocks?
    correcao: Manter o padrão do elemento `tests` restrito a `__tests__`, que deixa o código de produção sob a regra de `shared`.
    alternativas:
    - texto: Não. Só os arquivos dentro de `__tests__` casam com o elemento `tests`, e o arquivo de produção continua classificado como `shared`.
      correta: true
      explicacao: O erro agora cita a regra de índice 1, porque a regra de `tests` entrou na posição 0.
    - texto: Sim, porque a regra de `tests` permite tudo.
      correta: false
      explicacao: A regra vale só para o elemento `tests`.
    - texto: Sim, porque o `src/mocks` virou parte de `shared`.
      correta: false
      explicacao: Os elementos não mudaram de tipo.
  - tipo: incidente
    titulo: Vazão que cai mais que o tamanho cresce
    origem: executado
    rotulo_saida: log
    saida: "   · 10 microfrontends dependentes de um núcleo    881,414.88  0.0010  0.1121  0.0011  0.0011  0.0014  0.0015  0.0019  ±0.17%   440708\n   · 100 microfrontends dependentes de um núcleo    65,432.44  0.0141  0.1245  0.0153  0.0153  0.0174  0.0211  0.0712  ±0.23%    32717\n   · 1000 microfrontends dependentes de um núcleo    1,847.53  0.5080  0.8579  0.5413  0.5420  0.6787  0.7472  0.8579  ±0.48%      924"
    pergunta: De 100 para 1000 microfrontends, a vazão caiu cerca de 35 vezes. O que indica essa queda?
    correcao: Acrescentar o dependente à lista existente com `push`, como no passo 10. O `queue.shift()` é o próximo candidato, com um índice de leitura no lugar da remoção.
    alternativas:
    - texto: O Vitest limita o número de amostras para entradas grandes.
      correta: false
      explicacao: A vazão é medida por tempo, e o número de amostras acompanha a vazão.
    - texto: 'Trabalho repetido proporcional ao tamanho: o spread copia a lista de dependentes do núcleo a cada microfrontend acrescentado.'
      correta: true
      explicacao: Com `push`, a linha de 1000 ficou `3.56x` mais rápida.
    - texto: Ruído da medição.
      correta: false
      explicacao: A comparação sem mudança ficou entre `0.96x` e `1.05x`.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: conceito
    titulo: Termos das perguntas
    texto: O MSW é a biblioteca que intercepta as requisições HTTP nos testes e responde com handlers, e o `vi.stubGlobal('fetch')` do Vitest troca a função `fetch` inteira por uma substituta. O `afterEach` do Vitest executa uma função depois de cada teste, e o `beforeAll` e o `afterAll` executam antes e depois do arquivo inteiro. A lista `boundaries/elements` do ESLint, ferramenta de análise estática, define os padrões de caminho que classificam os arquivos nas camadas do shell, e o `--compare` do `vitest bench` mostra cada medição nova ao lado da linha de base gravada antes, com um valor entre colchetes e uma seta.
  - tipo: quiz
    perguntas:
    - enunciado: Por que o teste do `loadConfig` usa MSW e não `vi.stubGlobal('fetch')`?
      alternativas:
      - texto: Porque `vi.stubGlobal` não funciona com `jsdom`.
        correta: false
        explicacao: Os testes de `loginRequest` usam `vi.stubGlobal` no mesmo ambiente.
      - texto: Porque o MSW deixa o teste mais rápido.
        correta: false
        explicacao: A escolha é de fidelidade, e não de tempo.
      - texto: Para que o `fetch` real do código rode, com URL, status, cabeçalhos e corpo controlados na camada de rede.
        correta: true
        explicacao: O `content-type` do `HttpResponse.html` é o que o passo 4 confere.
    - enunciado: O que o `afterEach(() => server.resetHandlers())` garante?
      alternativas:
      - texto: Que um handler acrescentado com `server.use` não vaze para o teste seguinte.
        correta: true
        explicacao: Cada teste do laboratório define a própria resposta.
      - texto: Que o servidor seja reiniciado a cada teste.
        correta: false
        explicacao: O servidor fica no ar do `beforeAll` ao `afterAll`.
      - texto: Que as requisições sem handler falhem.
        correta: false
        explicacao: Isso depende de `onUnhandledRequest`, configurado como `warn`.
    - enunciado: Por que o elemento `tests` precisa vir primeiro em `boundaries/elements`?
      alternativas:
      - texto: Porque o ESLint lê os testes antes do código.
        correta: false
        explicacao: A classificação vale por arquivo.
      - texto: Porque o plugin usa o primeiro padrão que casa, e `src/shared/**` também casaria com o teste.
        correta: true
        explicacao: Na última posição, o teste continuaria classificado como `shared`.
      - texto: Porque a ordem é alfabética.
        correta: false
        explicacao: A ordem é a da lista.
    - enunciado: Como ler `[3.56x] ⇑` na comparação?
      alternativas:
      - texto: A função ficou 3,56 vezes mais lenta.
        correta: false
        explicacao: A seta para baixo indicaria perda.
      - texto: O erro relativo foi de 3,56%.
        correta: false
        explicacao: O erro relativo aparece na coluna `rme`.
      - texto: A medição nova teve 3,56 vezes a vazão da linha de base.
        correta: true
        explicacao: A seta para cima indica ganho.
    - enunciado: O que o benchmark do laboratório não responde?
      alternativas:
      - texto: Quanto tempo o boot leva no navegador sob rede lenta.
        correta: true
        explicacao: Essa pergunta cabe ao projeto `perf` do Playwright, descrito em `docs/performance/`.
      - texto: Como a ordenação escala com o tamanho do manifesto.
        correta: false
        explicacao: É exatamente o que os três tamanhos medem.
      - texto: Se a mudança melhorou a vazão.
        correta: false
        explicacao: O `--compare` mostra a razão.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Cada pergunta do classificador tem um nível de teste justificado.
    - O teste com MSW falhou com o HTML e passou depois da correção.
    - O lint aceita os testes e continua a barrar o código de produção.
    - O benchmark mostrou custo superlinear antes da correção.
    - A comparação depois da correção foi lida contra o ruído medido sem mudança.

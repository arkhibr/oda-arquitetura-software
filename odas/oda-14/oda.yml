id: '14'
titulo: Estratégia de testes e medição de desempenho
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é escolher o nível de teste que responde a cada pergunta sobre o portal e usar dois deles para encontrar defeitos que a suíte atual não mostra, um teste com rede simulada e um benchmark. O `frontend-react` combina Vitest, Playwright e MSW (Mock Service Worker), e nenhum teste existente cobre o `config.json` ausente atrás do Nginx, que derruba o boot do portal, nem o custo da ordenação dos microfrontends, que cresce mais rápido que o manifesto. Você vai escrever o teste com MSW que revela e corrige a falha do boot e o benchmark que justifica e mede a correção da ordenação.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Níveis de teste
      definicao: O teste unitário exercita uma função ou um componente isolado, o de integração exercita várias partes juntas com a rede simulada e o de ponta a ponta usa a aplicação inteira num navegador real. Cada nível responde a uma pergunta diferente e tem custo e velocidade diferentes.
      referencia:
        rotulo: martinfowler.com · The Practical Test Pyramid
        url: https://martinfowler.com/articles/practical-test-pyramid.html
    - termo: Rede simulada
      definicao: Técnica de teste em que as requisições HTTP são atendidas por respostas definidas no próprio teste, sem servidor real. O código testado chama o `fetch` normalmente e recebe a resposta escolhida pelo teste.
    - termo: Benchmark
      definicao: Medição repetida do tempo de execução de um trecho de código, feita para comparar versões ou tamanhos de entrada. O `vitest bench` informa a vazão em `hz`, execuções por segundo, e o erro relativo em `rme`, e a opção `--compare` compara a medição atual com uma gravada antes.
      referencia:
        rotulo: Vitest · Benchmarking
        url: https://vitest.dev/guide/benchmarking
    - termo: Vitest
      definicao: Framework de testes para projetos JavaScript e TypeScript integrado ao Vite, que roda os testes unitários e de integração do shell e os benchmarks.
      referencia:
        rotulo: Vitest · Getting Started
        url: https://vitest.dev/guide/
    - termo: Playwright
      definicao: Ferramenta que controla um navegador real para testar a aplicação de ponta a ponta, com navegação, cliques e leitura da página.
      referencia:
        rotulo: Playwright · Installation
        url: https://playwright.dev/docs/intro
    - termo: MSW (Mock Service Worker)
      definicao: Biblioteca que intercepta as requisições HTTP e devolve respostas definidas em handlers, tanto no Node.js, nos testes do Vitest, quanto no navegador. O `src/test-setup.ts` inicia o servidor do MSW para os testes, e o `server.use` acrescenta handlers que valem só até o fim de um teste.
      referencia:
        rotulo: Mock Service Worker · Introduction
        url: https://mswjs.io/docs/
    - termo: config.json
      definicao: Arquivo de configuração que o shell baixa ao iniciar, com valores que mudam por ambiente sem novo build, como a URL base da API e a cor primária do portal. O `loadConfig`, em `src/shared/config/index.ts`, ignora o arquivo quando ele falta e recai nas variáveis de ambiente do Vite.
    - termo: Nginx e fallback para o index.html
      definicao: O Nginx é o servidor web que entrega o shell em produção. Para que as rotas da SPA funcionem, a diretiva `try_files` devolve o `index.html` sempre que o arquivo pedido não existe, e isso inclui o `/config.json` ausente.
      referencia:
        rotulo: nginx.org · ngx_http_core_module, try_files
        url: https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
    - termo: Microfrontend e manifesto
      definicao: Um microfrontend é uma parte da interface com build e deploy próprios, carregada pelo shell em tempo de execução. O manifesto `public/mfe-manifest.json` lista os microfrontends e as dependências que cada um declara em `dependsOn`.
      referencia:
        rotulo: martinfowler.com · Micro Frontends
        url: https://martinfowler.com/articles/micro-frontends.html
    - termo: Custo superlinear
      definicao: Custo que cresce mais rápido que o tamanho da entrada. Se a entrada fica dez vezes maior e a vazão cai bem mais que dez vezes, há trabalho repetido proporcional ao tamanho da entrada.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas consideradas e as consequências. A ADR-005 define a tática de testes do repositório.
      referencia:
        rotulo: Architectural Decision Records (ADRs)
        url: https://adr.github.io/
    - termo: Jest e Cypress
      definicao: São ferramentas de teste para JavaScript, o Jest para testes unitários e o Cypress para testes de ponta a ponta. A ADR-005 as avaliou e preferiu Vitest e Playwright.
    - termo: Esteira de integração contínua (CI)
      definicao: Sequência automática de verificações, como instalação, conferência de tipos, testes e build, que roda a cada mudança enviada ao repositório.
      referencia:
        rotulo: GitHub Docs · Noções básicas sobre GitHub Actions
        url: https://docs.github.com/pt/actions/about-github-actions/understanding-github-actions
    - termo: Algoritmo de Kahn
      definicao: Algoritmo que ordena itens com dependências de modo que cada item venha depois de todos aqueles de que depende, a chamada ordenação topológica. O `dependencyResolver.ts` do shell o usa para decidir a ordem de carga dos microfrontends.
    - termo: ESLint e a regra de fronteiras
      definicao: O ESLint aplica regras de análise estática ao código. No shell, a regra `boundaries/dependencies` proíbe importações que atravessem as camadas do Feature-Sliced Design na direção não permitida, como o código de produção importar `@/mocks/server`.
      referencia:
        rotulo: ESLint · Getting Started
        url: https://eslint.org/docs/latest/use/getting-started
    - termo: DOM (Document Object Model)
      definicao: Representação da página em memória como uma árvore de elementos, que o JavaScript lê e altera para mudar o que aparece na tela.
      referencia:
        rotulo: MDN · Modelo de Objeto de Documento (DOM)
        url: https://developer.mozilla.org/pt-BR/docs/Web/API/Document_Object_Model
    - termo: CSP (Content Security Policy)
      definicao: Cabeçalho HTTP com que o servidor informa ao navegador de quais origens a página pode carregar scripts e outros recursos.
      referencia:
        rotulo: MDN · Utilizando Políticas de Segurança de Conteúdo
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Escolher entre teste unitário, de integração com MSW, ponta a ponta e benchmark para cada pergunta.
    - Variar a resposta de rede num teste com `server.use`, sem substituir o `fetch`.
    - Corrigir o `loadConfig` para o caso do `index.html` devolvido no lugar do `config.json`, com o teste escrito antes.
    - Escrever um benchmark com tamanhos crescentes e reconhecer custo superlinear.
    - Comparar medições com `--compare` e separar ganho real de ruído.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: Node.js 22.12 ou superior e o repositório `frontend-react` no commit `2179313`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. Nenhum serviço precisa estar no ar, porque o laboratório roda só testes, lint e benchmarks em processo. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. Todas as abas se referem ao commit `2179313`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `frontend-react` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/frontend-react
        - cd frontend-react
    - titulo: Fixar o commit `2179313`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 2179313
    - titulo: Instalar as dependências
      texto: 'O comando instala as dependências da raiz do repositório sem alterar o `package-lock.json`. Em Linux e no WSL, o `npm ci` deste commit termina com `Missing: @emnapi/core@1.11.3 from lock file`, porque o arquivo de lock não traz um pacote exigido nessas plataformas. Os microfrontends, o Gateway e os BFFs têm dependências próprias, que o laboratório instala quando precisa delas.'
      editor:
        rotulo: terminal
        linhas:
        - npm install --no-save
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: node --version
      saida: v24.16.0
      origem: exemplo
      dica: Qualquer versão a partir da 22.12 atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o Node
      comando: node --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica o que cada ferramenta de teste do `frontend-react` mede e como escolher o nível de teste que responde a cada pergunta sobre o portal. Os blocos abaixo ensinam os níveis de teste, o Vitest, o Playwright, o MSW e a rede simulada, os handlers e o `server.use`, o benchmark e a escala dele e o `config.json` com o fallback do Nginx, e depois o comparativo associa perguntas a níveis e ferramentas. A ADR do fim registra a tática de testes que o repositório adotou.
  - tipo: conceito
    titulo: Níveis de teste
    texto: O teste unitário exercita uma função ou um componente isolado, o de integração exercita várias partes juntas com a rede simulada e o de ponta a ponta usa a aplicação inteira num navegador real. Cada nível responde a um tipo de pergunta e tem custo e velocidade próprios, e escolher o nível errado produz um teste lento demais ou que não enxerga o defeito.
  - tipo: conceito
    titulo: Vitest, Playwright e MSW
    texto: O Vitest é o framework de testes do repositório, integrado ao Vite, que roda os testes unitários e de integração e também os benchmarks com `vitest bench`, sem rede, renderização nem carga. O Playwright controla um navegador real para os testes de ponta a ponta. O MSW (Mock Service Worker) é a biblioteca que intercepta as requisições HTTP e devolve respostas definidas no próprio teste, tanto no Node.js, nos testes do Vitest, quanto no navegador, o que permite simular a rede sem substituir o `fetch` do código testado.
  - tipo: conceito
    titulo: Handlers do MSW e server.use
    texto: Handler é a função do MSW que decide a resposta de uma requisição a um endereço. O `src/test-setup.ts` inicia o servidor do MSW antes de cada arquivo e chama `resetHandlers` depois de cada teste. Um teste acrescenta handlers próprios com `server.use`, que valem só até o fim daquele teste.
  - tipo: conceito
    titulo: Escala de um benchmark
    texto: Benchmark é a medição repetida do tempo de execução de um trecho de código, e o `vitest bench` informa a vazão em `hz`, execuções por segundo, e o erro relativo em `rme`. Medir a mesma função com entradas de tamanho 10, 100 e 1000 mostra como o custo cresce. Se a vazão cai cerca de dez vezes a cada passo, o custo é linear, e uma queda bem maior indica custo superlinear, trabalho repetido proporcional ao tamanho da entrada.
  - tipo: conceito
    titulo: config.json e o fallback do Nginx
    texto: O `config.json` é o arquivo de configuração que o shell, a aplicação que hospeda o portal, baixa ao iniciar, com valores que mudam por ambiente sem novo build. O Nginx, servidor web que entrega o shell em produção, usa a diretiva `try_files` para devolver o `index.html` sempre que o arquivo pedido não existe, o que faz as rotas da aplicação de página única funcionarem e também alcança o `/config.json` ausente.
  - tipo: comparativo
    colunas:
    - Pergunta
    - Nível e ferramenta
    linhas:
    - dimensao: A regra de negócio está certa?
      valores:
      - Uma função pura dá o resultado esperado
      - Unitário, com Vitest
    - dimensao: O código reage bem a cada resposta da rede?
      valores:
      - O `loadConfig` com 200, 404, JSON inválido e HTML
      - Integração em Node, com Vitest e MSW
    - dimensao: O fluxo funciona no navegador?
      valores:
      - Login, carga de microfrontend e cabeçalhos de CSP
      - Ponta a ponta, com Playwright
    - dimensao: Quanto custa e como escala?
      valores:
      - Vazão do `resolveLoadOrder` com 10, 100 e 1000 itens
      - Micro-benchmark, com `vitest bench`
  - tipo: adr
    id: ADR-005
    titulo: Tática de testes
    status: Proposed
    contexto: O projeto precisa de testes unitários e de integração, de ponta a ponta e com API simulada, e o Vite dificulta o uso do Jest.
    decisao: Vitest para unidade e integração, Playwright para ponta a ponta, MSW para a rede e `vitest bench` para micro-benchmarks.
    alternativas: Jest com Cypress e MSW, que exige transpilação extra e é mais lento em CI, e não testar.
    consequencias: Três ferramentas para aprender, com o mesmo código de produção exercitado sob respostas controladas.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os arquivos do shell, a aplicação que hospeda o portal, que o laboratório testa e mede: a preparação dos testes com o MSW, biblioteca que simula a rede nos testes, em `src/test-setup.ts`, o carregamento do `config.json`, configuração do ambiente lida no boot, o fallback do Nginx, servidor web de produção, que interfere nele, a ordenação dos microfrontends, as partes da interface carregadas pelo shell, e um benchmark existente, medição repetida do tempo de uma função, que serve de modelo. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os comportamentos que os testes e os benchmarks precisam capturar.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `frontend-react`, que contém o portal web em React, com o shell, os microfrontends, o Gateway de API e os BFFs. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `2179313`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: frontend-react no GitHub, commit 2179313
      url: https://github.com/arkhibr/frontend-react/tree/2179313
  - tipo: editor
    rotulo: arquivo
    caminho: src/test-setup.ts
    commit: '2179313'
    linhas:
    - import '@testing-library/jest-dom'
    - import { beforeAll, afterEach, afterAll } from 'vitest'
    - import { server } from './mocks/server'
    - ''
    - 'beforeAll(() => server.listen({ onUnhandledRequest: ''warn'' }))'
    - afterEach(() => server.resetHandlers())
    - afterAll(() => server.close())
    anotacoes:
    - linha: 5
      texto: Requisições sem handler geram aviso, e não falha.
    - linha: 6
      texto: Remove os handlers acrescentados com `server.use`.
    contexto: O `src/test-setup.ts` é o arquivo de preparação que o Vitest carrega antes dos testes do shell. O arquivo aparece inteiro e liga o servidor do MSW durante a execução, o que define como os testes respondem às requisições HTTP.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/config/index.ts
    commit: '2179313'
    linhas:
    - 'export async function loadConfig(): Promise<void> {'
    - '  let data: AppConfig'
    - ''
    - '  try {'
    - '    const res = await fetch(''/config.json'')'
    - '    if (!res.ok) return'
    - '    data = (await res.json()) as AppConfig'
    - '  } catch (err) {'
    - '    if (err instanceof SyntaxError) {'
    - '      throw new Error(`[config] /config.json inválido: ${String(err)}`, { cause: err })'
    - '    }'
    - '    // Arquivo ausente ou erro de rede — usa variáveis de ambiente como fallback'
    - '    return'
    - '  }'
    - ''
    - '  _config = data'
    - ''
    - '  const root = document.documentElement'
    - '  if (data.primaryColor) root.style.setProperty(''--color-primary'', data.primaryColor)'
    - '  if (data.secondaryColor) root.style.setProperty(''--color-secondary'', data.secondaryColor)'
    - '}'
    anotacoes:
    - linha: 45
      texto: URL relativa, resolvida contra o `location` do `jsdom` nos testes.
    - linha: 46
      texto: 'Status de erro: segue com as variáveis de ambiente.'
    - linha: 47
      texto: Qualquer corpo com status 200 é lido como JSON.
    - linha: 50
      texto: JSON inválido derruba o boot com a tela de falha do `main.tsx`.
    inicio: 41
    contexto: O `src/shared/config/index.ts` carrega o `/config.json` do ambiente quando o shell inicia. O trecho abaixo é a função `loadConfig`, com os três desfechos que os testes precisam cobrir, o status de erro, o JSON válido e o JSON inválido.
  - tipo: editor
    rotulo: arquivo
    caminho: nginx.conf.template
    commit: '2179313'
    linhas:
    - '    location / {'
    - '        try_files $uri $uri/ /index.html;'
    anotacoes:
    - linha: 45
      texto: Caminho sem arquivo recebe o `index.html` com status 200.
    inicio: 44
    contexto: O `nginx.conf.template` é o modelo de configuração do Nginx que serve o shell compilado em produção. As duas linhas abaixo mostram o fallback da aplicação de página única, que responde com o `index.html` e status 200 a qualquer caminho sem arquivo, inclusive ao `/config.json` ausente.
  - tipo: editor
    rotulo: arquivo
    caminho: src/app/mfe/dependencyResolver.ts
    commit: '2179313'
    linhas:
    - 'export function resolveLoadOrder(mfes: MfeEntry[]): MfeEntry[] {'
    - '  const byId = new Map(mfes.map((m) => [m.id, m]))'
    - '  const indegree = new Map(mfes.map((m) => [m.id, m.dependsOn.length]))'
    - '  const dependents = new Map<string, string[]>()'
    - ''
    - '  for (const m of mfes) {'
    - '    for (const dep of m.dependsOn) {'
    - '      dependents.set(dep, [...(dependents.get(dep) ?? []), m.id])'
    - '    }'
    - '  }'
    - ''
    - '  const queue = mfes.filter((m) => indegree.get(m.id) === 0).map((m) => m.id)'
    - '  const ordered: MfeEntry[] = []'
    - ''
    - '  while (queue.length > 0) {'
    - '    const id = queue.shift() as string'
    - '    ordered.push(byId.get(id) as MfeEntry)'
    - '    for (const dependent of dependents.get(id) ?? []) {'
    - '      const next = (indegree.get(dependent) as number) - 1'
    - '      indegree.set(dependent, next)'
    - '      if (next === 0) queue.push(dependent)'
    - '    }'
    - '  }'
    - ''
    - '  if (ordered.length !== mfes.length) {'
    - '    const remaining = mfes.filter((m) => !ordered.includes(m)).map((m) => m.id)'
    - '    throw new Error(`[mfe-manifest] ciclo de dependência detectado entre: ${remaining.join('', '')}`)'
    - '  }'
    - ''
    - '  return ordered'
    - '}'
    anotacoes:
    - linha: 14
      texto: Copia a lista inteira a cada dependente acrescentado.
    - linha: 22
      texto: O `shift` também percorre o array a cada retirada.
    inicio: 7
    contexto: O `src/app/mfe/dependencyResolver.ts` ordena os microfrontends do manifesto pelo algoritmo de Kahn, para que cada um carregue depois das dependências que declara. O trecho abaixo é a função `resolveLoadOrder`, com as cópias de lista e o `shift` que tornam o custo da ordenação maior que o necessário.
  - tipo: editor
    rotulo: arquivo
    caminho: src/shared/lib/validators/validators.bench.ts
    commit: '2179313'
    linhas:
    - // src/shared/lib/validators/validators.bench.ts
    - // Micro-benchmarks de desempenho das funções puras de validação.
    - '// Rode com: npm run bench (na raiz). Ver ADR-005.'
    - import { bench, describe } from 'vitest'
    - import { isValidCPF } from './cpf'
    - import { isValidEmail } from './email'
    - ''
    - describe('isValidCPF', () => {
    - '  bench(''CPF válido'', () => {'
    - '    isValidCPF(''529.982.247-25'')'
    - '  })'
    - '  bench(''CPF inválido (dígito verificador errado)'', () => {'
    - '    isValidCPF(''529.982.247-24'')'
    - '  })'
    - '  bench(''CPF malformado (tamanho errado)'', () => {'
    - '    isValidCPF(''123'')'
    - '  })'
    - '})'
    anotacoes:
    - linha: 9
      texto: Cada `bench` mede uma chamada isolada, repetida até a vazão estabilizar.
    contexto: O `src/shared/lib/validators/validators.bench.ts` reúne os micro-benchmarks do Vitest para as funções de validação do shell, rodados com `npm run bench` na raiz. O trecho abaixo serve de modelo para o benchmark que o laboratório escreve.
  - tipo: faixa
    estilo: dica
    texto: 'Nenhum teste de unidade do commit varia respostas com `server.use`: os testes de `shared` e `features` substituem o `fetch` com `vi.stubGlobal`. A regra `boundaries/dependencies` do `eslint.config.ts` não deixa essas camadas importar `src/mocks`, e o passo 6 do laboratório trata disso.'
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o boot do shell, a aplicação que hospeda o portal, quando o `config.json`, arquivo de configuração do ambiente, falta atrás do Nginx, servidor web de produção que devolve o `index.html` no lugar. O bloco abaixo resume os termos das etapas e do classificador, e depois você classifica o nível de teste adequado para cada pergunta.
  - tipo: conceito
    titulo: Termos das etapas e do classificador
    texto: O `loadConfig` é a função do shell que lê o `config.json`, e o `try_files` é a diretiva do Nginx que devolve o `index.html` para caminhos sem arquivo. O `content-type` é o cabeçalho HTTP que diz o formato do corpo da resposta, como `application/json` ou `text/html`. No classificador, o teste unitário exercita uma função isolada, o de integração com MSW controla as respostas de rede, o de ponta a ponta usa o servidor e o navegador reais e o benchmark mede custo e escala, e o `--compare` do `vitest bench` compara uma medição com outra gravada antes.
  - tipo: fluxo
    titulo: Boot do shell sem config.json atrás do Nginx
    etapas:
    - titulo: Requisição
      descricao: O `main.tsx` chama `loadConfig`, que pede `/config.json` ao Nginx.
    - titulo: Fallback
      descricao: O arquivo não existe, e o `location /` aplica `try_files`, que devolve o `index.html` com status 200.
    - titulo: Leitura
      descricao: O `res.ok` é verdadeiro, e o `res.json()` encontra `<!doctype` e lança `SyntaxError`.
    - titulo: Falha de boot
      descricao: O `loadConfig` transforma o erro em `[config] /config.json inválido`, e o `main.tsx` mostra a tela de falha.
    - titulo: Depois da correção
      descricao: O `content-type` `text/html` faz o `loadConfig` seguir com as variáveis de ambiente, como o comentário do arquivo promete.
  - tipo: classificador
    enunciado: Qual é o nível de teste adequado para cada pergunta?
    categorias:
    - id: unit
      rotulo: Unitário
    - id: msw
      rotulo: Integração com MSW
    - id: e2e
      rotulo: Ponta a ponta
    - id: bench
      rotulo: Benchmark
    itens:
    - texto: O `isValidCPF` recusa o dígito verificador errado?
      categoria: unit
      explicacao: Função pura, sem rede nem DOM.
    - texto: O `loadConfig` segue sem erro quando recebe HTML?
      categoria: msw
      explicacao: A resposta de rede varia, e o código de produção faz o `fetch` de verdade.
    - texto: O Nginx envia a CSP com o nonce gravado no HTML?
      categoria: e2e
      explicacao: Depende do servidor e do navegador reais.
    - texto: O `resolveLoadOrder` aguenta 1000 microfrontends?
      categoria: bench
      explicacao: A pergunta é de custo e de escala.
    - texto: A ordem devolvida respeita o `dependsOn`?
      categoria: unit
      explicacao: O `dependencyResolver.test.ts` já cobre ordem e ciclo.
    - texto: O login redireciona para o painel?
      categoria: e2e
      explicacao: O `tests/e2e/auth/login.spec.ts` percorre o fluxo no navegador.
    - texto: O `parseToken` ficou mais lento depois de uma mudança?
      categoria: bench
      explicacao: O `tokenParser.bench.ts` já existe e aceita `--compare`.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é evitar que um ambiente sem `config.json`, o arquivo de configuração lido no boot, derrube o portal e reduzir o custo superlinear, que cresce mais rápido que a entrada, da ordenação dos microfrontends, com um teste e um benchmark que comprovam cada mudança. Os passos 1 a 7 cobrem o teste com MSW, biblioteca que simula a rede nos testes, a correção do `loadConfig` e a regra de fronteiras do ESLint entre as camadas do shell, e os passos 8 a 11 cobrem o benchmark e a correção da ordenação. Os passos rodam na raiz do repositório `frontend-react` no commit `2179313`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: faixa
    estilo: objetivo
    problema: O `loadConfig`, em `src/shared/config/index.ts`, ignora o `public/config.json` quando a resposta não é 200, e atrás do Nginx um arquivo ausente volta como `index.html` com status 200 por causa do `try_files`, e a leitura do JSON lança `SyntaxError`. Além disso, o `dependencyResolver.ts` copia a lista de dependentes a cada dependência acrescentada, e o custo da ordenação dos microfrontends cresce mais rápido que o manifesto.
    impacto: Em produção, um ambiente publicado sem `config.json` mostra a tela de falha de boot no lugar do portal, e os testes existentes não cobrem esse caso. O custo superlinear da ordenação pesa no boot de cada página à medida que o manifesto ganha microfrontends.
    mecanismo: Um teste de integração com MSW, escrito antes, troca a resposta de `/config.json` com `server.use` e devolve HTML com status 200, como o Nginx faria, e o `loadConfig` passa a ignorar respostas cujo `content-type` não é JSON. A regra de fronteiras do ESLint ganha um elemento próprio para os testes, e um benchmark com manifestos de 10, 100 e 1000 microfrontends mede a ordenação antes e depois de acrescentar o dependente sem copiar a lista.
    comprovacao: O teste novo falha com `Unexpected token '<', "<!doctype "... is not valid JSON` e passa depois, a suíte termina com `Tests 103 passed (103)` e o `tsc` e o `eslint src/` ficam sem mensagens. Na linha de 1000 microfrontends, o `--compare` mostra `[3.56x]`, e os testes de `src/app/mfe` continuam com `Tests 31 passed (31)`.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/frontend-react`, entre na pasta criada e rode `git checkout 2179313`. Num clone novo, instale as dependências da raiz com `npm install --no-save`, porque o `npm ci` deste commit falha com um pacote ausente do `package-lock.json`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `2179313` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As dependências instaladas continuam no lugar, porque o Git ignora `node_modules`.'
  - tipo: passos
    itens:
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run
      sucesso: '`Tests 99 passed (99)`.'
    - titulo: Escrever o teste do loadConfig
      texto: Crie o arquivo abaixo. Cada teste troca a resposta de `/config.json` com `server.use`, e o último devolve HTML com status 200, como o `try_files` do Nginx.
      editor:
        rotulo: arquivo
        caminho: src/shared/config/__tests__/config.test.ts (novo)
        commit: '2179313'
        linhas:
        - import { describe, expect, it } from 'vitest'
        - import { http, HttpResponse } from 'msw'
        - import { server } from '@/mocks/server'
        - import { getApiUrl, getMfeAllowedOrigins, loadConfig } from '../index'
        - ''
        - describe('loadConfig', () => {
        - '  it(''aplica a URL da API, as origens de microfrontend e a cor do config.json'', async () => {'
        - '    server.use(http.get(''/config.json'', () => HttpResponse.json({'
        - '      apiUrl: ''http://localhost:4000'', primaryColor: ''#047857'', mfeAllowedOrigins: [''http://localhost:4566''],'
        - '    })))'
        - ''
        - '    await loadConfig()'
        - ''
        - '    expect(getApiUrl()).toBe(''http://localhost:4000'')'
        - '    expect(getMfeAllowedOrigins()).toEqual([''http://localhost:4566''])'
        - '    expect(document.documentElement.style.getPropertyValue(''--color-primary'')).toBe(''#047857'')'
        - '  })'
        - ''
        - '  it(''falha rápido quando o config.json não é JSON válido'', async () => {'
        - '    server.use(http.get(''/config.json'', () => new HttpResponse(''{ apiUrl:'', { headers: { ''Content-Type'': ''application/json'' } })))'
        - ''
        - '    await expect(loadConfig()).rejects.toThrow(''[config] /config.json inválido'')'
        - '  })'
        - ''
        - '  it(''segue sem erro quando o config.json não existe'', async () => {'
        - '    server.use(http.get(''/config.json'', () => new HttpResponse(null, { status: 404 })))'
        - ''
        - '    await expect(loadConfig()).resolves.toBeUndefined()'
        - '  })'
        - ''
        - '  it(''segue sem erro quando o servidor devolve o index.html no lugar do config.json'', async () => {'
        - '    server.use(http.get(''/config.json'', () => HttpResponse.html(''<!doctype html><div id="root"></div>'')))'
        - ''
        - '    await expect(loadConfig()).resolves.toBeUndefined()'
        - '  })'
        - '})'
      efeito: teste_config
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/shared/config
      sucesso: '`Tests 1 failed | 3 passed (4)`, com `Unexpected token ''<'', "<!doctype "... is not valid JSON`.'
    - titulo: Conferir o tipo do conteúdo
      editor:
        rotulo: arquivo
        caminho: src/shared/config/index.ts (alteração)
        commit: '2179313'
        linhas:
        - '// src/shared/config/index.ts: depois de if (!res.ok) return'
        - '    // Atrás do try_files do Nginx, um config.json ausente chega como index.html com 200.'
        - '    if (!res.headers.get(''content-type'')?.includes(''json'')) return'
      efeito: config_corrigido
    - titulo: Ver o teste passar e rodar o lint
      editor:
        rotulo: terminal
        linhas:
        - npx vitest run src/shared/config
        - npx vitest run
        - npx tsc --noEmit -p tsconfig.app.json && npm run lint
      sucesso: '`Tests 4 passed (4)`, a suíte com `Tests 103 passed (103)` e um erro `boundaries/dependencies` no import de `@/mocks/server`.'
    - titulo: Declarar os testes como elemento próprio
      texto: Os arquivos de `__tests__` não vão para o bundle, e o elemento `tests` permite que importem os handlers do MSW. O elemento entra primeiro, porque o plugin usa o primeiro padrão que casa com o arquivo.
      editor:
        rotulo: arquivo
        caminho: eslint.config.ts (alteração)
        commit: '2179313'
        linhas:
        - '// eslint.config.ts: primeiro item de boundaries/elements'
        - '        { type: ''tests'',    pattern: ''src/**/__tests__/**'' },'
        - ''
        - '// eslint.config.ts: primeira regra de boundaries/dependencies'
        - '          { from: { type: ''tests'' },    allow: { to: { type: ''*'' } } },'
      efeito: fronteira_testes
    - titulo: Rodar o lint de novo
      editor:
        rotulo: terminal
        linhas:
        - npx tsc --noEmit -p tsconfig.app.json && npm run lint
      sucesso: O `tsc` e o `eslint src/` terminam sem mensagens.
    - titulo: Escrever o benchmark da ordenação
      texto: Crie o arquivo abaixo, ao lado do código. Ele mede o mesmo manifesto em estrela com 10, 100 e 1000 microfrontends.
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/dependencyResolver.bench.ts (novo)
        commit: '2179313'
        linhas:
        - // src/app/mfe/dependencyResolver.bench.ts
        - // Micro-benchmark da ordenação dos microfrontends no boot do shell.
        - '// Rode com: npm run bench (na raiz). Ver ADR-005.'
        - import { bench, describe } from 'vitest'
        - import { resolveLoadOrder } from './dependencyResolver'
        - import type { MfeEntry } from './types'
        - ''
        - 'function manifestoEmEstrela(total: number): MfeEntry[] {'
        - '  const base = { name: ''MFE'', state: ''active'' as const, url: ''http://localhost:4566/mfes/x.js'', integrity: ''sha256-x'', route: ''/x'' }'
        - '  const nucleo = { ...base, id: ''nucleo'', dependsOn: [] }'
        - '  const demais = Array.from({ length: total - 1 }, (_, i) => ({ ...base, id: `mfe-${i}`, dependsOn: [''nucleo''] }))'
        - '  return [nucleo, ...demais]'
        - '}'
        - ''
        - const pequeno = manifestoEmEstrela(10)
        - const medio = manifestoEmEstrela(100)
        - const grande = manifestoEmEstrela(1000)
        - ''
        - describe('resolveLoadOrder', () => {
        - '  bench(''10 microfrontends dependentes de um núcleo'', () => {'
        - '    resolveLoadOrder(pequeno)'
        - '  })'
        - '  bench(''100 microfrontends dependentes de um núcleo'', () => {'
        - '    resolveLoadOrder(medio)'
        - '  })'
        - '  bench(''1000 microfrontends dependentes de um núcleo'', () => {'
        - '    resolveLoadOrder(grande)'
        - '  })'
        - '})'
      efeito: bench_criado
    - titulo: Medir e guardar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - npx vitest bench --run src/app/mfe --outputJson /tmp/bench-ordem.json
        - npx vitest bench --run src/app/mfe --compare /tmp/bench-ordem.json
      sucesso: A vazão cai cerca de 13 vezes de 10 para 100 e cerca de 35 vezes de 100 para 1000, e a comparação sem mudança fica perto de `1.00x`.
    - titulo: Acrescentar sem copiar a lista
      editor:
        rotulo: arquivo
        caminho: src/app/mfe/dependencyResolver.ts (alteração)
        commit: '2179313'
        linhas:
        - '// src/app/mfe/dependencyResolver.ts: no lugar da linha com o spread'
        - '      const lista = dependents.get(dep)'
        - '      if (lista) lista.push(m.id)'
        - '      else dependents.set(dep, [m.id])'
      efeito: resolver_corrigido
    - titulo: Comparar e conferir o comportamento
      editor:
        rotulo: terminal
        linhas:
        - npx vitest bench --run src/app/mfe --compare /tmp/bench-ordem.json
        - npx vitest run src/app/mfe
        - npx vitest run
      sucesso: '`[3.56x]` na linha de 1000 microfrontends, `Tests 31 passed (31)` em `src/app/mfe` e a suíte com `Tests 103 passed (103)`.'

- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os quatro incidentes partem de saídas do laboratório e de uma execução do shell no navegador contra a imagem.
  - tipo: incidente
    titulo: Contêiner que serve páginas e fica unhealthy
    origem: executado
    rotulo_saida: log
    saida: '$ docker inspect --format ''{{.State.Health.Status}}'' portal-oda15

      unhealthy


      $ docker exec portal-oda15 sh -c ''getent hosts localhost; wget …''

      ::1               localhost  localhost

      localhost: código 1

      wget: can''t connect to remote host: Connection refused

      127.0.0.1: código 0'
    pergunta: O `curl` do host recebe as páginas, e o Docker marca o contêiner como `unhealthy`. Por quê?
    correcao: Chamar `127.0.0.1` no healthcheck, como no passo 7, ou acrescentar `listen [::]:80;` ao template do Nginx.
    alternativas:
    - texto: O healthcheck roda antes de o Nginx subir.
      correta: false
      explicacao: As falhas continuam a cada 30 segundos.
    - texto: Dentro da imagem Alpine, `localhost` resolve para `::1`, e o Nginx só escuta em IPv4.
      correta: true
      explicacao: O mesmo `wget` com `127.0.0.1` termina com código 0.
    - texto: O `index.html` não existe na imagem.
      correta: false
      explicacao: O `curl` do host recebe a página.
  - tipo: incidente
    titulo: Esteira verde com erro de tipo
    origem: executado
    rotulo_saida: log
    saida: '$ printf "export const porta: number = ''oitenta''

      " > src/shared/lib/erroDeTipo.ts

      $ npx tsc --noEmit


      $ npx tsc -b

      src/shared/lib/erroDeTipo.ts(1,14): error TS2322: Type ''string'' is not assignable to type ''number''.'
    pergunta: Por que a etapa de TypeScript da esteira não acusa o erro?
    correcao: Trocar a etapa por `npx tsc -b`, que segue as referências, ou por `npx tsc --noEmit -p tsconfig.app.json`.
    alternativas:
    - texto: O arquivo novo está fora de `include`.
      correta: false
      explicacao: O `tsc -b` encontrou o arquivo em `src/`.
    - texto: O `skipLibCheck` ignora erros em `src/`.
      correta: false
      explicacao: A opção vale só para arquivos `.d.ts`.
    - texto: 'O `tsconfig.json` da raiz tem `files: []` e só referências, que o `tsc` sem `-b` não segue.'
      correta: true
      explicacao: O `npm run build` usa `tsc -b` e acusa o mesmo erro.
  - tipo: incidente
    titulo: Imagem de produção que não inicia com o manifesto local
    origem: executado
    rotulo_saida: log
    saida: 'Falha ao iniciar o portal:

      Error: [mfe-manifest] mfes[0].url deve usar HTTPS'
    pergunta: A imagem roda localmente, e o portal mostra a tela de falha de boot. O que aconteceu?
    correcao: Testar a imagem com um manifesto de URLs HTTPS, ou validar localmente com o servidor de desenvolvimento, em que `localhost` com HTTP é aceito.
    alternativas:
    - texto: O build de produção exige HTTPS nas URLs dos microfrontends, e o manifesto aponta para `http://localhost:4566`.
      correta: true
      explicacao: A regra está descrita no item (c) da seção 4 do `SECURITY.md`.
    - texto: A CSP bloqueou o `main.tsx`.
      correta: false
      explicacao: O navegador não registrou nenhuma violação na carga.
    - texto: O `config.json` não foi copiado.
      correta: false
      explicacao: O `config.json` responde 200 com `application/json`.
  - tipo: incidente
    titulo: Lock que funciona numa máquina e falha na esteira
    origem: executado
    rotulo_saida: log
    saida: "#5 [build 1/6] FROM docker.io/library/node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293\n#5 [build 1/6] FROM docker.io/library/node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293\n#5 [build 1/6] FROM docker.io/library/node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293\n#5 [build 1/6] FROM docker.io/library/node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293\n#8 [build 2/6] WORKDIR /app\n#9 [build 3/6] COPY package*.json ./\n#10 [build 4/6] RUN npm ci --prefer-offline\n#10 0.852 npm error code EUSAGE\n#10 0.852 npm error `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync. Please update your lock file with `npm install` before continuing.\n#10 0.852 npm error Missing: @emnapi/core@1.11.3 from lock file\n#10 0.852 npm error Missing: @emnapi/runtime@1.11.3 from lock file\n#10 0.852 npm error Missing: @emnapi/wasi-threads@1.2.3 from lock file\n#10 ERROR: process \"/bin/sh -c npm ci --prefer-offline\" did not complete successfully: exit code: 1\n > [build 4/6] RUN npm ci --prefer-offline:"
    pergunta: Quem tinha `node_modules` instalado continuava a trabalhar normalmente. Por que a esteira e a imagem param?
    correcao: Rodar `npm install --package-lock-only`, conferir o diff e versionar o lock, como no passo 3.
    alternativas:
    - texto: O Docker não tem acesso à internet.
      correta: false
      explicacao: O erro é de validação do lock, antes de qualquer download.
    - texto: O `npm ci` instala a partir do lock e recusa um lock sem os pacotes opcionais que o `package.json` atual exige.
      correta: true
      explicacao: O `npm install` local não falha, porque reescreve o lock quando ele diverge do `package.json`.
    - texto: O Node 20 da imagem não roda o Vite.
      correta: false
      explicacao: Com o lock corrigido, o mesmo Node 20 compila o shell.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que a imagem do shell tem dois estágios?
      alternativas:
      - texto: Para rodar os testes dentro da imagem.
        correta: false
        explicacao: Os testes ficam na esteira.
      - texto: Para ter duas versões do Nginx.
        correta: false
        explicacao: Só o segundo estágio tem Nginx.
      - texto: Para compilar com Node e entregar só o `dist/` numa imagem Nginx enxuta.
        correta: true
        explicacao: A imagem final tem 76,5 MB, sem Node nem `node_modules`.
    - enunciado: Como mudar o `connect-src` de um ambiente sem gerar outra imagem?
      alternativas:
      - texto: Passando `CSP_CONNECT_SRC` no `docker run`, que o `envsubst` aplica ao template no boot.
        correta: true
        explicacao: O laboratório passa duas origens com `-e`.
      - texto: Mudando `VITE_API_BASE_URL`.
        correta: false
        explicacao: Essa variável é de build.
      - texto: Editando o `index.html` no contêiner.
        correta: false
        explicacao: A CSP vem do cabeçalho do Nginx.
    - enunciado: Por que o nonce muda a cada requisição?
      alternativas:
      - texto: Porque o navegador sorteia o nonce.
        correta: false
        explicacao: O navegador só confere o nonce.
      - texto: Porque vem de `$request_id`, gravado no HTML pelo `sub_filter` e no cabeçalho pelo `add_header`.
        correta: true
        explicacao: As duas requisições do passo 8 tiveram nonces diferentes.
      - texto: Porque o build gera um nonce novo a cada deploy.
        correta: false
        explicacao: O build grava só o marcador `**CSP_NONCE**`.
    - enunciado: O que o `npm ci` garante que o `npm install` não garante?
      alternativas:
      - texto: Que as dependências estejam sem vulnerabilidades.
        correta: false
        explicacao: O `npm audit` continua a listar vulnerabilidades.
      - texto: Que a instalação seja mais rápida.
        correta: false
        explicacao: A diferença é de reprodutibilidade.
      - texto: Que a instalação corresponda exatamente ao lock, sem alterá-lo.
        correta: true
        explicacao: Por isso o lock precisa estar versionado e sincronizado.
    - enunciado: Que estado o orquestrador vê com o healthcheck original?
      alternativas:
      - texto: '`unhealthy`, depois de três falhas, embora o Nginx sirva as páginas.'
        correta: true
        explicacao: Um orquestrador tiraria a instância do tráfego.
      - texto: '`healthy`, porque o `curl` do host funciona.'
        correta: false
        explicacao: O healthcheck roda dentro do contêiner.
      - texto: Nenhum, porque o Dockerfile não declara healthcheck.
        correta: false
        explicacao: O Dockerfile declara `HEALTHCHECK`.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Cada etapa do Quality Gate foi executada localmente.
    - O lock foi sincronizado e o `npm ci` e o `docker build` passaram.
    - A cobertura de branches passou do limite com o teste do `loadConfig`.
    - A etapa de tipos passou a conferir os arquivos com `tsc -b`.
    - A imagem ficou `healthy` e serviu a CSP com nonce por requisição.

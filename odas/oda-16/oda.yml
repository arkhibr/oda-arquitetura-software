- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula a API sem executar o projeto. Envie as requisições abaixo, capturadas com a API no ar, e depois classifique cada pasta de `src/` pelo padrão arquitetural que ela segue.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: 'As requisições usam o login em `/api/v1/auth/login`, que devolve um JWT (JSON Web Token), um token assinado que o cliente envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas dos Pedidos. No classificador, Clean Architecture designa a organização do Catálogo em subprojetos por camada, com o domínio no centro e os repositórios do EF Core, a biblioteca de acesso a banco da Microsoft, atrás de interfaces da camada Application. Vertical Slice designa a organização dos Pedidos, com uma pasta por caso de uso, e o Pix reúne um servidor que simula a API Pix do Banco Central do Brasil (BCB) e um cliente de console com HttpClient tipado, uma classe de acesso HTTP dedicada a uma única API, e políticas de resiliência, como novas tentativas e tempo limite.'

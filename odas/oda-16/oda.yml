- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é deixar o build e a suíte de testes confiáveis, porque no commit de referência a solução não compila e o resumo do `dotnet test` esconde um projeto inteiro de testes que não rodou. Os passos 1 a 7 clonam o repositório, apontam os testes de Pedidos para o Catálogo e excluem da compilação da API os arquivos gerados pelos outros projetos, e os passos 8 a 10 sobem a API, chamam os três contextos e leem a estrutura de pastas. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: O laboratório usa o `dotnet`, a ferramenta de linha de comando do .NET SDK, para compilar, testar e rodar a API, e o `setup.sh`, script do repositório que confere o SDK, restaura os pacotes NuGet e compila a solução em Release. Os erros `CS0234` e `CS0246` vêm do compilador C# e indicam namespace ou tipo inexistente, e o `MSB3030` vem do MSBuild, o motor de compilação, e indica um arquivo ausente no momento da cópia para a saída. As pastas `bin/` e `obj/` guardam o resultado de cada compilação, o build incremental reaproveita esse resultado nas execuções seguintes, e a propriedade `DefaultItemExcludes` do `.csproj` retira arquivos da lista que o projeto compila e copia. Com a API no ar, o JWT (JSON Web Token) obtido no login autoriza as chamadas aos Pedidos, e o Swagger publica em JSON a lista de caminhos da API.
  - tipo: faixa
    estilo: objetivo
    problema: No commit `702145a`, o `tests/Pedidos.Tests/Pedidos.Tests.csproj` referencia `src/Produtos/Produtos.Domain`, pasta removida no refactor `d378512`, e a compilação da solução para com `CS0234`. O `ProdutosAPI.csproj` usa o SDK Web, que trata como conteúdo os `.json` dos `bin/` e `obj/` dos outros projetos, e o build incremental falha em parte das execuções com `MSB3030`.
    impacto: Com o projeto de Pedidos fora da compilação, o `dotnet test` imprime só duas linhas `Aprovado!`, e quem confere apenas essas linhas aceita uma suíte com 47 testes que não rodaram. A falha intermitente de cópia faz o mesmo código passar numa execução e falhar na seguinte, e isso tira a confiança no build antes de qualquer estudo de arquitetura.
    mecanismo: A referência quebrada é trocada pelo projeto `Catalogo.Domain`, com o `using` correspondente no `ProdutoTestBuilder.cs`. A propriedade `DefaultItemExcludes` do `ProdutosAPI.csproj` passa a excluir `tests/**` e os `bin/` e `obj/` dos subprojetos, e as chamadas aos endpoints com e sem JWT conferem os três contextos no ar.
    comprovacao: O `dotnet test` passa a imprimir três linhas `Aprovado!`, com 7, 47 e 143 testes, e o `setup.sh` termina com `Compilação com êxito.` em execuções seguidas, com 0 arquivos de `tests/` na saída. Com a API no ar, a saúde e o Catálogo respondem 200, os Pedidos respondem 401 sem token e 200 com token, e o Swagger lista 18 caminhos.
  - tipo: passos
    itens:
    - titulo: Conferir o SDK e clonar
      editor:
        rotulo: terminal
        linhas:
        - dotnet --version
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
        - git checkout 702145a
      sucesso: '`10.0.401` ou outra versão 10.0, e `HEAD is now at 702145a`.'
    - titulo: Rodar o setup
      editor:
        rotulo: terminal
        linhas:
        - bash setup.sh
      sucesso: '`FALHA da compilação.`, com `error CS0234` em `ProdutoTestBuilder.cs`.'
    - titulo: Encontrar a referência quebrada
      editor:
        rotulo: terminal
        linhas:
        - grep -n 'Produtos.Domain' tests/Pedidos.Tests/Pedidos.Tests.csproj; ls src/Produtos
        - git log --oneline -1 -- src/Produtos
      sucesso: A referência a `src/Produtos/Produtos.Domain` na linha 31, a pasta inexistente e o commit `d378512`.
    - titulo: Apontar os testes para o Catálogo
      texto: Troque a referência do projeto e o `using` do builder. O `Produto` do Catálogo tem o mesmo `Criar` que o builder usa.
      editor:
        rotulo: arquivo
        caminho: tests/Pedidos.Tests (alteração)
        commit: 702145a
        linhas:
        - <!-- tests/Pedidos.Tests/Pedidos.Tests.csproj -->
        - '    <ProjectReference Include="../../src/Catalogo/Catalogo.Domain/Catalogo.Domain.csproj" />'
        - ''
        - // tests/Pedidos.Tests/Builders/ProdutoTestBuilder.cs, linha 1
        - using ProdutosAPI.Catalogo.Domain;
      efeito: ref_corrigida
    - titulo: Rodar o setup e os testes
      editor:
        rotulo: terminal
        linhas:
        - bash setup.sh
        - dotnet test
      sucesso: Três linhas `Aprovado!`, com 7, 47 e 143 testes. O `setup.sh` pode terminar com `MSB3030` em parte das execuções.
    - titulo: Contar o conteúdo copiado
      texto: Rode o `setup.sh` duas ou três vezes seguidas e conte os `.json` de outros projetos dentro da saída da API.
      editor:
        rotulo: terminal
        linhas:
        - find bin/Release/net10.0 -path '*/tests/*' -name '*.json' | wc -l; find bin/Release/net10.0 -path '*/src/*' -name '*.json' | wc -l
      sucesso: Centenas de arquivos de `tests/` e de `src/` copiados para `bin/Release/net10.0`.
    - titulo: Excluir os bin e obj dos outros projetos
      texto: Acrescente a propriedade abaixo, apague as pastas `bin/` e `obj/` e rode o `setup.sh` algumas vezes.
      editor:
        rotulo: arquivo
        caminho: ProdutosAPI.csproj (alteração)
        commit: 702145a
        linhas:
        - '<!-- ProdutosAPI.csproj: dentro do primeiro PropertyGroup -->'
        - '    <!-- O SDK Web inclui todo *.json abaixo da raiz como conteúdo; os bin/obj dos outros projetos não são da API. -->'
        - '    <DefaultItemExcludes>$(DefaultItemExcludes);tests/**;src/*/*/bin/**;src/*/*/obj/**</DefaultItemExcludes>'
      efeito: conteudo_excluido
      sucesso: '`Compilação com êxito.` em todas as execuções e `0` arquivos de `tests/` na saída.'
    - titulo: Subir a API
      editor:
        rotulo: terminal
        linhas:
        - dotnet run --launch-profile http
      sucesso: '`Now listening on: http://localhost:5000` e `Hosting environment: Development`.'
    - titulo: Percorrer os contextos
      texto: Noutro terminal, chame a saúde, o Catálogo, os Pedidos sem e com token, o Swagger e a rota do `setup.sh`.
      editor:
        rotulo: terminal
        linhas:
        - curl -s -w ' %{http_code}\n' http://localhost:5000/health
        - curl -s 'http://localhost:5000/api/v1/catalogo/produtos?pageSize=2' | head -c 700; echo
        - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:5000/api/v1/pedidos
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'curl -s -w '' %{http_code}\n'' -H "Authorization: Bearer $TOKEN" http://localhost:5000/api/v1/pedidos'
        - curl -s http://localhost:5000/swagger/v1/swagger.json | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=sorted(d["paths"]); print(len(ps), "caminhos"); [print(p) for p in ps]'
        - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:5000/api/v1/produtos
      sucesso: '`200` na saúde e no Catálogo, `401` nos Pedidos sem token, `200` com token, `18 caminhos` no Swagger e `404` na rota do `setup.sh`.'
    - titulo: Ler a estrutura
      editor:
        rotulo: terminal
        linhas:
        - ls src/Catalogo src/Pedidos src/Pix
      sucesso: Subprojetos por camada no Catálogo, pastas por caso de uso nos Pedidos e dois projetos no Pix.

id: '16'
titulo: Ambiente .NET 10 e os três bounded contexts
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é colocar a API `net-minimal-api` para rodar na sua máquina e reconhecer o padrão arquitetural de cada um dos três bounded contexts (contextos delimitados) dela, Catálogo, Pedidos e Pix, num ambiente em que o build e os testes sejam confiáveis. No commit de referência, o `setup.sh` não termina, porque o projeto de testes de Pedidos referencia uma pasta removida num refactor e o build incremental falha de forma intermitente com `MSB3030`, e o resumo do `dotnet test` parece verde com 47 testes fora da execução. Você vai corrigir as duas falhas de build, subir a API e ligar cada contexto ao padrão que a estrutura de pastas revela.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: .NET 10 e .NET SDK (Software Development Kit)
      definicao: O .NET é a plataforma de desenvolvimento da Microsoft na qual a API roda, e o 10 é a versão usada pelo repositório. O SDK é o pacote instalado na máquina que traz o compilador e o comando `dotnet`, usado para compilar, rodar e testar os projetos.
      referencia:
        rotulo: Microsoft Learn · Introdução ao .NET
        url: https://learn.microsoft.com/pt-br/dotnet/core/introduction
    - termo: Bounded context (contexto delimitado)
      definicao: Conceito do Domain-Driven Design que delimita a parte do sistema dentro da qual um modelo e o seu vocabulário têm um único significado. No `net-minimal-api`, Catálogo, Pedidos e Pix são três bounded contexts, cada um com pastas, rotas e testes próprios.
      referencia:
        rotulo: martinfowler.com · Bounded Context
        url: https://martinfowler.com/bliki/BoundedContext.html
    - termo: ASP.NET Core
      definicao: Framework da Microsoft para aplicações web e APIs sobre o .NET. Ele recebe cada requisição HTTP, passa a requisição pela cadeia de middlewares e entrega o resultado ao endpoint correspondente.
      referencia:
        rotulo: Microsoft Learn · Visão geral do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/introduction-to-aspnet-core
    - termo: Pix e BCB (Banco Central do Brasil)
      definicao: O Pix é o sistema de pagamentos instantâneos criado e regulado pelo Banco Central do Brasil, o BCB. O contexto Pix do repositório tem um servidor que simula a API Pix do BCB e um cliente que consome essa API.
      referencia:
        rotulo: Banco Central do Brasil · Pix
        url: https://www.bcb.gov.br/estabilidadefinanceira/pix
    - termo: Servidor simulado (mock server)
      definicao: Programa que imita a API de um sistema externo e responde como ele, para que o cliente possa ser desenvolvido e testado sem acesso ao sistema real. No repositório, o projeto `src/Pix/Pix.MockServer` cumpre esse papel para a API Pix.
    - termo: Suíte de testes e xUnit
      definicao: A suíte é o conjunto de testes automatizados do repositório, e o xUnit é o framework de testes que os projetos de teste usam. O `dotnet test` compila os projetos de teste, roda os testes e imprime uma linha de resumo por projeto, com aprovados, falhas e ignorados.
      referencia:
        rotulo: xUnit.net
        url: https://xunit.net/
    - termo: Solução (`.slnx`) e projeto (`.csproj`)
      definicao: O arquivo de projeto `.csproj` descreve um programa ou uma biblioteca .NET, com os arquivos que entram na compilação, os pacotes usados e as referências a outros projetos. O arquivo de solução, aqui o `ProdutosAPI.slnx`, agrupa vários projetos para que `dotnet build` e `dotnet test` os percorram juntos.
      referencia:
        rotulo: Microsoft Learn · Visão geral do SDK de projeto do .NET
        url: https://learn.microsoft.com/pt-br/dotnet/core/project-sdk/overview
    - termo: NuGet
      definicao: Gerenciador de pacotes do .NET, que baixa as bibliotecas declaradas no `.csproj` com `PackageReference`. O `dotnet build` restaura esses pacotes antes de compilar e guarda uma cópia num cache local da máquina.
      referencia:
        rotulo: Microsoft Learn · O que é o NuGet
        url: https://learn.microsoft.com/pt-br/nuget/what-is-nuget
    - termo: MSBuild e SDK Web
      definicao: O MSBuild é o motor de compilação que o `dotnet build` usa para ler o `.csproj` e decidir o que compilar e o que copiar para a pasta de saída. O SDK Web, declarado como `Microsoft.NET.Sdk.Web` no `ProdutosAPI.csproj`, é o conjunto de regras do MSBuild para aplicações ASP.NET Core e trata como conteúdo os arquivos `.json` das subpastas do projeto.
      referencia:
        rotulo: Microsoft Learn · MSBuild
        url: https://learn.microsoft.com/pt-br/visualstudio/msbuild/msbuild
    - termo: Erros `CS0234`, `CS0246` e `MSB3030`
      definicao: 'Os códigos que começam com `CS` vêm do compilador C#: o `CS0234` indica que um namespace ou tipo não existe dentro do namespace citado, e o `CS0246` indica que um tipo não foi encontrado, em geral por falta de `using` ou de referência de projeto. O `MSB3030` vem do MSBuild e indica que um arquivo marcado para cópia não foi encontrado no momento da cópia.'
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: Swagger e OpenAPI
      definicao: OpenAPI é a especificação que descreve as rotas, os parâmetros e as respostas de uma API HTTP num documento JSON. O Swagger, instalado no repositório pelo pacote Swashbuckle, gera esse documento a partir do código e oferece uma página web para explorar e chamar as rotas em desenvolvimento.
      referencia:
        rotulo: Microsoft Learn · Suporte a OpenAPI no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/openapi/overview
    - termo: Clean Architecture
      definicao: Estilo de arquitetura em camadas concêntricas em que o domínio e as regras de aplicação ficam no centro e não dependem de banco, framework ou interface com o usuário. As dependências entre projetos apontam sempre para dentro, e no Catálogo isso se traduz nos subprojetos Domain, Application, Infrastructure e API.
      referencia:
        rotulo: Microsoft Learn · Arquiteturas comuns de aplicativos web
        url: https://learn.microsoft.com/pt-br/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures
    - termo: Vertical Slice Architecture (arquitetura de fatias verticais)
      definicao: Estilo de organização em que todo o código de um caso de uso, como requisição, validação, handler e endpoint, fica numa mesma pasta, chamada fatia. Nos Pedidos do `net-minimal-api`, cada operação, como `CreatePedido` ou `CancelPedido`, é uma fatia com pasta própria.
    - termo: Minimal API (API mínima)
      definicao: Forma de declarar endpoints HTTP no ASP.NET Core com chamadas como `app.MapGet` e `app.MapPost`, que associam uma rota a uma função, sem classes de controller. É o estilo usado em toda a API `net-minimal-api`.
      referencia:
        rotulo: Microsoft Learn · Visão geral das APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/overview
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional da Microsoft, que traduz classes C# em tabelas e consultas LINQ em SQL. No repositório, ele grava os dados no SQLite e atende as operações de escrita.
      referencia:
        rotulo: Microsoft Learn · Visão geral do Entity Framework Core
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: Kestrel
      definicao: 'Servidor web embutido no ASP.NET Core, que abre a porta e recebe as conexões HTTP da API. A mensagem `Now listening on: http://localhost:5000` é escrita quando ele começa a aceitar conexões.'
      referencia:
        rotulo: Microsoft Learn · Servidor web Kestrel no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/servers/kestrel
    - termo: Receptor AirPlay (AirTunes)
      definicao: 'Serviço do macOS que recebe áudio e vídeo de outros aparelhos da Apple e escuta na porta 5000, a mesma da API. As respostas dele trazem o cabeçalho `Server: AirTunes` e podem ser confundidas com as da API quando ela está parada.'
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Preparar o .NET 10 e executar o `setup.sh` e a suíte de testes.
    - Ler um erro de compilação de solução e chegar ao projeto que o causa.
    - Reconhecer quando uma suíte parece verde com um projeto de testes fora da execução.
    - Subir a API e exercitar o Catálogo, os Pedidos com JWT e o Swagger.
    - Identificar Clean Architecture híbrida, Vertical Slice e servidor simulado nas pastas de `src/`.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: O .NET SDK 10, o Git e o `curl`, com o Python 3 para listar os caminhos do Swagger. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL. No macOS, a porta 5000 também é usada pelo Receptor AirPlay, como mostra o Diagnóstico.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba explica por que o repositório `net-minimal-api` tem três organizações de código diferentes. Ele resolve o mesmo problema, uma API REST (o estilo de API HTTP em que cada recurso tem um endereço e as operações usam os métodos do protocolo) com persistência, validação e testes, em três bounded contexts, partes do sistema com modelo e vocabulário próprios, cada um com um grau diferente de estrutura. Os blocos abaixo explicam primeiro cada conceito, e o quadro seguinte compara os três contextos.
  - tipo: conceito
    titulo: API em ASP.NET Core com Minimal APIs
    texto: A API do repositório é um programa ASP.NET Core, o framework web da Microsoft sobre o .NET 10, que recebe requisições HTTP e devolve JSON. As rotas são declaradas no estilo Minimal API, com chamadas como `app.MapGet` que associam um caminho a uma função, sem classes de controller. O `Program.cs` da raiz monta os serviços e as rotas dos três contextos, e é por ele que a leitura do código começa.
  - tipo: conceito
    titulo: Clean Architecture no Catálogo
    texto: Organização em camadas concêntricas em que o domínio e as regras de aplicação ficam no centro e não dependem de banco nem de framework, com as referências entre projetos apontando para dentro. No Catálogo, isso aparece como quatro subprojetos, Domain, Application, Infrastructure e API, e o repositório chama o padrão de híbrido porque a camada de API organiza os endpoints por recurso.
  - tipo: conceito
    titulo: Vertical Slice nos Pedidos
    texto: Organização por caso de uso, em que a requisição, a validação, o handler, que é a classe que executa a operação, e o endpoint de uma operação ficam juntos numa pasta, chamada fatia. Os Pedidos seguem esse padrão, com pastas como `src/Pedidos/CreatePedido` e `src/Pedidos/CancelPedido`, e cada fatia muda sem tocar nas outras.
  - tipo: conceito
    titulo: Servidor simulado no Pix
    texto: O Pix é o sistema de pagamentos instantâneos do Banco Central do Brasil, e o contexto Pix do repositório tem dois projetos. O `Pix.MockServer` é um servidor que imita a API Pix do Banco Central, e o `Pix.ClientDemo` é um programa de console que consome essa API com um HttpClient tipado e políticas de resiliência, o que permite estudar a integração sem acesso ao sistema real.
  - tipo: conceito
    titulo: Bounded context
    texto: Um bounded context é a fronteira dentro da qual um modelo e o seu vocabulário valem sem ambiguidade. No repositório, cada contexto tem pasta, rotas e testes próprios, e o `Produto` do Catálogo é uma entidade diferente do item de um pedido.
  - tipo: conceito
    titulo: Solução e projetos
    texto: O `ProdutosAPI.slnx` lista onze projetos, e o `dotnet build` e o `dotnet test` sem argumento percorrem todos. A API é o `ProdutosAPI.csproj` da raiz, que compila `src/Pedidos` e `src/Shared` e referencia os subprojetos do Catálogo.
  - tipo: comparativo
    colunas:
    - Catálogo
    - Pedidos
    - Pix
    linhas:
    - dimensao: Padrão
      valores:
      - Clean Architecture híbrida
      - Vertical Slice com domínio rico
      - Servidor simulado e cliente HTTP resiliente
    - dimensao: Organização
      valores:
      - Subprojetos Domain, Application, Infrastructure e API
      - Uma pasta por caso de uso
      - 'Dois projetos: `Pix.MockServer` e `Pix.ClientDemo`'
    - dimensao: Rotas
      valores:
      - '`/api/v1/catalogo/*`, sem token na leitura'
      - '`/api/v1/pedidos/*`, com JWT'
      - Processo separado, sem rota na API
    - dimensao: Registro
      valores:
      - Métodos `Map...Endpoints` chamados no `Program.cs`
      - '`IEndpoint` descoberto por reflection'
      - Próprio `Program.cs`
  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: Esta parte da aba mostra, no commit `702145a`, a montagem da API, o contrato de auto-registro dos endpoints dos Pedidos e as duas origens das falhas de build que o laboratório corrige. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: conceito
    titulo: 📘 Conceitos usados no código
    texto: O `Program.cs` é o ponto de entrada da API, onde os serviços são registrados na injeção de dependência, o mecanismo do ASP.NET Core que entrega a cada classe os objetos de que ela precisa, e onde as rotas são mapeadas. Um grupo de rotas, criado com `MapGroup`, dá a vários endpoints o mesmo prefixo, como `/api/v1/catalogo`, e `IEndpoint` é a interface que cada fatia dos Pedidos implementa para declarar as próprias rotas, encontrada por reflection, a leitura dos tipos do programa em tempo de execução. O arquivo `.csproj` descreve um projeto .NET e lista em `ProjectReference` os projetos de que ele depende, e o SDK Web, declarado no `ProdutosAPI.csproj`, trata como conteúdo copiado para a saída os arquivos `.json` das subpastas. O Swagger é a página que documenta as rotas da API a partir do código.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - ''
    - var v1 = app.MapGroup("/api/v1");
    - var catalogo = v1.MapGroup("/catalogo");
    - catalogo.MapProdutoEndpoints();
    - catalogo.MapCategoriaEndpoints();
    - catalogo.MapVarianteEndpoints();
    - catalogo.MapAtributoEndpoints();
    - catalogo.MapMidiaEndpoints();
    - ''
    - // Slices de Pedidos (IEndpoint)
    - app.MapRegisteredEndpoints();
    - ''
    - // Health check simples
    - app.MapGet("/health", () => Results.Ok(new { status = "healthy" }))
    - '    .WithName("Health")'
    - '    .AllowAnonymous();'
    - ''
    anotacoes:
    - linha: 255
      texto: Grupo de rotas versionado, base do Catálogo.
    - linha: 257
      texto: 'Catálogo: cada recurso registra as rotas por um método de extensão.'
    - linha: 264
      texto: 'Pedidos: registra todas as classes que implementam `IEndpoint`.'
    inicio: 254
    contexto: O `Program.cs` da raiz é o ponto de entrada da API, onde os serviços são registrados e as rotas dos três bounded contexts são montadas. O trecho abaixo mapeia as rotas, com o Catálogo dentro do grupo `/api/v1/catalogo` e os Pedidos registrados pela interface `IEndpoint`.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Common/IEndpoint.cs
    commit: 702145a
    linhas:
    - namespace ProdutosAPI.Shared.Common;
    - ''
    - public interface IEndpoint
    - '{'
    - '    void MapEndpoints(IEndpointRouteBuilder app);'
    - '}'
    anotacoes:
    - linha: 5
      texto: Cada fatia de Pedidos declara as próprias rotas.
    contexto: O `src/Shared/Common/IEndpoint.cs` define o contrato comum que cada fatia do contexto de Pedidos implementa para declarar as próprias rotas. O arquivo inteiro aparece abaixo e tem um único método, `MapEndpoints`, que o `Program.cs` chama para cada fatia registrada.
  - tipo: editor
    rotulo: arquivo
    caminho: tests/Pedidos.Tests/Pedidos.Tests.csproj
    commit: 702145a
    linhas:
    - '  <ItemGroup>'
    - '    <ProjectReference Include="../../ProdutosAPI.csproj" />'
    - '    <ProjectReference Include="../../src/Produtos/Produtos.Domain/Produtos.Domain.csproj" />'
    - '  </ItemGroup>'
    anotacoes:
    - linha: 31
      texto: Projeto removido no refactor `d378512`.
    inicio: 29
    contexto: O `tests/Pedidos.Tests/Pedidos.Tests.csproj` é o arquivo de projeto dos testes do contexto de Pedidos. O trecho abaixo lista as referências de projeto, entre elas `src/Produtos/Produtos.Domain/Produtos.Domain.csproj`, caminho que não existe neste commit e que faz a compilação da solução falhar.
  - tipo: editor
    rotulo: arquivo
    caminho: ProdutosAPI.csproj
    commit: 702145a
    linhas:
    - <Project Sdk="Microsoft.NET.Sdk.Web">
    - ''
    - '  <PropertyGroup>'
    - '    <TargetFramework>net10.0</TargetFramework>'
    - '    <Nullable>enable</Nullable>'
    - '    <ImplicitUsings>enable</ImplicitUsings>'
    - '    <RootNamespace>ProdutosAPI</RootNamespace>'
    - '    <AssemblyName>ProdutosAPI</AssemblyName>'
    - '    <Version>2.0.0</Version>'
    - '    <Description>API REST de Produtos com Minimal API e .NET 10</Description>'
    - '  </PropertyGroup>'
    - ''
    - '  <ItemGroup>'
    - '    <!-- Exclude test projects from main build -->'
    - '    <Compile Remove="tests/ProdutosAPI.Tests/**" />'
    - '    <Compile Remove="tests/Pedidos.Tests/**" />'
    - '    <Compile Remove="tests/Pix.MockServer.Tests/**" />'
    - '    <!-- Exclude new sub-projects (compiled separately, referenced via ProjectReference) -->'
    - '    <Compile Remove="src/Produtos/**" />'
    - '    <Compile Remove="src/Catalogo/Catalogo.Domain/**" />'
    - '    <Compile Remove="src/Catalogo/Catalogo.Application/**" />'
    - '    <Compile Remove="src/Catalogo/Catalogo.Infrastructure/**" />'
    - '    <Compile Remove="src/Catalogo/Catalogo.API/**" />'
    - '    <Compile Remove="src/Catalogo/Catalogo.ClientDemo/**" />'
    - '    <Compile Remove="src/Pix/**" />'
    - '  </ItemGroup>'
    anotacoes:
    - linha: 1
      texto: O SDK Web inclui como conteúdo os `*.json` de todas as subpastas.
    - linha: 15
      texto: Remove os testes da compilação, mas não do conteúdo.
    contexto: O `ProdutosAPI.csproj` da raiz é o arquivo de projeto da API, com o SDK Web, as exclusões de compilação e as referências aos projetos do Catálogo e aos pacotes NuGet. O arquivo inteiro aparece abaixo porque a falha de build que o laboratório corrige depende do que ele exclui da compilação e do que o SDK Web continua incluindo como conteúdo.
  - tipo: editor
    rotulo: arquivo
    caminho: setup.sh
    commit: 702145a
    linhas:
    - echo ""
    - echo -e "${GREEN}=========================================="
    - 'echo "Próximo passo: dotnet run"'
    - echo "===========================================${NC}"
    - echo ""
    - echo "Após inicializar, acesse:"
    - 'echo "  📡 API:     http://localhost:5000/api/v1/produtos"'
    - 'echo "  📚 Swagger: http://localhost:5000"'
    - echo ""
    anotacoes:
    - linha: 50

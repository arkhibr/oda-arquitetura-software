      dica: Arquivos `.json` dos `bin/` e `obj/` de outros projetos, copiados para a saída da API.
    cenarios:
    - rotulo: Setup
      comando: bash setup.sh
    - rotulo: Testes
      comando: dotnet test
    - rotulo: Conteúdo copiado
      comando: find bin/Release/net10.0 -path '*/tests/*' -name '*.json' | wc -l; find bin/Release/net10.0 -path '*/src/*' -name '*.json' | wc -l
    - rotulo: Pedidos sem token
      comando: curl -s -o /dev/null -w '%{http_code}\n' http://localhost:5000/api/v1/pedidos
    - rotulo: Caminhos do Swagger
      comando: curl -s http://localhost:5000/swagger/v1/swagger.json | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=sorted(d["paths"]); print(len(ps), "caminhos"); [print(p) for p in ps]'
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que alguém encontraria ao preparar o ambiente, a partir de saídas do laboratório e de uma chamada feita com a API parada. Escolha a causa de cada uma para ver a explicação e a correção.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A suíte de testes é o conjunto de projetos de teste que o `dotnet test` compila e executa, com uma linha de resumo por projeto, e um projeto que não compila não aparece nesse resumo. O SDK Web, regra de compilação do `ProdutosAPI.csproj`, copia para a saída da API os `.json` de todas as subpastas, e o `MSB3030` é o erro do MSBuild para um arquivo que deixou de existir antes da cópia. O Receptor AirPlay é um serviço do macOS que escuta na porta 5000 e se identifica no cabeçalho `Server` como `AirTunes`, e o Kestrel é o servidor web embutido no ASP.NET Core, que ocupa essa porta quando a API está no ar.
  - tipo: incidente
    titulo: Suíte verde com 47 testes a menos
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test

      ./tests/Pedidos.Tests/Builders/ProdutoTestBuilder.cs(1,19): error CS0234: O nome de tipo ou namespace "Produtos" não existe no namespace "ProdutosAPI" (você está sem uma referência de assembly?) [./tests/Pedidos.Tests/Pedidos.Tests.csproj]

      ./tests/Pedidos.Tests/Builders/ProdutoTestBuilder.cs(47,12): error CS0246: O nome do tipo ou do namespace "Produto" não pode ser encontrado (está faltando uma diretiva using ou uma referência de assembly?) [./tests/Pedidos.Tests/Pedidos.Tests.csproj]

      Aprovado!  – Com falha:     0, Aprovado:     7, Ignorado:     0, Total:     7, Duração: 233 ms - Pix.MockServer.Tests.dll (net10.0)

      Aprovado!  – Com falha:     0, Aprovado:   143, Ignorado:     0, Total:   143, Duração: 1 s - ProdutosAPI.Tests.dll (net10.0)'
    pergunta: As duas linhas de resumo dizem `Aprovado!`. A suíte está verde?
    correcao: Conferir que cada projeto de teste da solução tem uma linha de resumo e tratar `error CS` como falha da suíte, como a esteira faz pelo código de saída.
    alternativas:
    - texto: Sim, porque os erros são só avisos de compilação.
      correta: false
      explicacao: '`CS0234` e `CS0246` são erros, e o projeto não gera a DLL.'
    - texto: Não. O projeto `Pedidos.Tests` não compilou, e os 47 testes dele não rodaram, embora os outros dois projetos tenham passado.
      correta: true
      explicacao: Depois da correção, a terceira linha aparece com 47 aprovados.
    - texto: Sim, porque nenhum teste falhou.
      correta: false
      explicacao: Teste que não roda não falha, e o comando termina com erro.
  - tipo: incidente
    titulo: Build que falha uma vez sim, outra não
    origem: executado
    rotulo_saida: log
    saida: "~/.dotnet/sdk/10.0.401/Microsoft.Common.CurrentVersion.targets(5455,5): error MSB3030: não foi possível copiar o arquivo \"./tests/ProdutosAPI.Tests/bin/Release/net10.0/MvcTestingAppManifest.json\" porque ele não foi encontrado. [./tests/ProdutosAPI.Tests/ProdutosAPI.Tests.csproj]\n\n$ find bin/Release/net10.0 -path '*/tests/*' -name '*.json' | wc -l; find bin/Release/net10.0 -path '*/src/*' -name '*.json' | wc -l\n     313\n     154"
    pergunta: Sem mudança no código, o `setup.sh` alterna entre êxito e `MSB3030`. Qual é a causa?
    correcao: Excluir `tests/**` e os `bin/` e `obj/` dos subprojetos dos itens padrão do `ProdutosAPI.csproj`, como no passo 7.
    alternativas:
    - texto: O disco está cheio.
      correta: false
      explicacao: O build do zero passa nas três tentativas.
    - texto: O NuGet baixa pacotes diferentes a cada execução.
      correta: false
      explicacao: O erro é de cópia de arquivo, depois da restauração.
    - texto: O SDK Web inclui como conteúdo os `.json` de todas as subpastas, e a API copia para a própria saída os arquivos gerados pelos outros projetos, que mudam durante o build.
      correta: true
      explicacao: Os caminhos do erro repetem `bin/Release/net10.0/tests/...` várias vezes.
  - tipo: incidente
    titulo: 403 do AirTunes na porta da API
    origem: executado
    rotulo_saida: log
    saida: '$ curl -s -i http://localhost:5000/health

      HTTP/1.1 403 Forbidden

      Content-Length: 0

      Server: AirTunes/980.77.5'
    pergunta: Com a API parada, o `curl` recebe 403, e não conexão recusada. Quem respondeu?
    correcao: Desligar o Receptor AirPlay nos Ajustes do macOS ou usar outra porta, com `dotnet run --urls http://localhost:5080`.
    alternativas:
    - texto: O Receptor AirPlay do macOS, que escuta na porta 5000 de todas as interfaces.
      correta: true
      explicacao: Com a API no ar, o Kestrel atende `localhost` e responde no lugar dele.
    - texto: A API, recusando o acesso sem token.
      correta: false
      explicacao: A API não estava no ar, e `/health` não exige token.
    - texto: O Swagger.
      correta: false
      explicacao: O cabeçalho `Server` identifica o AirTunes.
  - tipo: incidente
    titulo: URL do setup.sh que devolve 404
    origem: executado
    rotulo_saida: log
    saida: "$ bash setup.sh\nPróximo passo: dotnet run\n  \U0001F4E1 API:     http://localhost:5000/api/v1/produtos\n  \U0001F4DA Swagger: http://localhost:5000\n\n$ curl -s -o /dev/null -w '%{http_code}\\n' http://localhost:5000/api/v1/produtos\n404"
    pergunta: Por que a URL que o próprio `setup.sh` sugere devolve 404?
    correcao: Atualizar o `setup.sh` para `/api/v1/catalogo/produtos`, e o link de instalação para o .NET 10.
    alternativas:
    - texto: O banco está vazio.
      correta: false
      explicacao: A lista vazia viria com 200.
    - texto: O refactor `d378512` moveu as rotas de produtos para `/api/v1/catalogo`, e o `setup.sh` não foi atualizado.
      correta: true
      explicacao: O Swagger lista `/api/v1/catalogo/produtos` e nenhuma rota `/api/v1/produtos`.
    - texto: A rota exige token.
      correta: false
      explicacao: Rota protegida devolveria 401.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Nas perguntas abaixo, Vertical Slice é a organização por caso de uso dos Pedidos, com uma pasta por operação, e `MapRegisteredEndpoints` é o método que mapeia as rotas de toda classe que implementa `IEndpoint`. A reflection é a leitura dos tipos de um assembly, a unidade compilada de um projeto .NET, em tempo de execução, e o Swagger é a página que documenta as rotas da API. O `DefaultItemExcludes` é a propriedade do `.csproj` que retira arquivos da compilação e do conteúdo copiado, e o restore do NuGet é a etapa que baixa os pacotes declarados no projeto.
  - tipo: quiz
    perguntas:
    - enunciado: Qual contexto usa Vertical Slice?
      alternativas:
      - texto: Catálogo.
        correta: false
        explicacao: O Catálogo separa camadas em subprojetos.
      - texto: Pix.
        correta: false
        explicacao: O Pix tem um servidor simulado e um cliente.
      - texto: Pedidos, com uma pasta por caso de uso.
        correta: true
        explicacao: '`CreatePedido`, `GetPedido`, `ListPedidos`, `AddItemPedido` e `CancelPedido`.'
    - enunciado: Como os endpoints de Pedidos chegam à API?
      alternativas:
      - texto: Pelo `MapRegisteredEndpoints`, que registra as classes que implementam `IEndpoint`.
        correta: true
        explicacao: A descoberta é por reflection no assembly da API.
      - texto: Por um método `Map...Endpoints` por recurso.
        correta: false
        explicacao: Esse é o caminho do Catálogo.
      - texto: Pelo Swagger.
        correta: false
        explicacao: O Swagger só documenta.
    - enunciado: Por que `dotnet test` mostrou só duas linhas de resumo no commit de referência?
      alternativas:
      - texto: Porque os testes de Pedidos exigem a API no ar.
        correta: false
        explicacao: Eles rodam em memória.
      - texto: Porque o terceiro projeto de testes não compilou.
        correta: true
        explicacao: A referência a `Produtos.Domain` aponta para uma pasta removida.
      - texto: Porque o projeto de Pedidos não tem testes.
        correta: false
        explicacao: Depois da correção, ele roda 47.
    - enunciado: O que a propriedade `DefaultItemExcludes` resolve?
      alternativas:
      - texto: Exclui os testes da solução.
        correta: false
        explicacao: Os três projetos continuam a rodar.
      - texto: Acelera o restore do NuGet.
        correta: false
        explicacao: Afeta itens do projeto, e não pacotes.
      - texto: Impede que a API trate como conteúdo os arquivos de `tests/` e dos `bin/` e `obj/` dos subprojetos.
        correta: true
        explicacao: A contagem caiu de 313 para 0 nos testes.
    - enunciado: Que rota do Catálogo responde sem token?
      alternativas:
      - texto: '`GET /api/v1/catalogo/produtos`.'
        correta: true
        explicacao: A leitura do Catálogo é pública.
      - texto: '`GET /api/v1/pedidos`.'
        correta: false
        explicacao: Pedidos devolve 401 sem token.
      - texto: '`GET /api/v1/produtos`.'
        correta: false
        explicacao: Essa rota não existe mais.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O `setup.sh` terminou com `Compilação com êxito.` em execuções seguidas.
    - Os três projetos de teste rodaram, com 7, 47 e 143 aprovados.
    - A API respondeu na porta 5000, com Pedidos protegidos por JWT.
    - Cada pasta de `src/` está ligada ao padrão que segue.
    - As duas falhas de build do commit de referência foram explicadas.

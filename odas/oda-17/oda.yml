- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: 'Esta aba simula, sem executar nada, como um endpoint descoberto por reflection chega à tabela de rotas da API. Acompanhe as etapas e depois classifique onde cada decisão deve ficar: no endpoint, no grupo ou no `Program.cs`.'
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Nas etapas abaixo, um serviço transitório é um registro da injeção de dependência que cria uma instância nova a cada vez que o serviço é pedido, e o Dapper é a biblioteca de acesso a dados com SQL escrito à mão que o repositório de leitura usa para contar os pedidos. O 401 é o status HTTP de requisição sem autenticação válida, devolvido antes de o handler rodar, e a tag do Swagger é o rótulo que agrupa as rotas na página de documentação da API. No classificador, o grupo é o route group criado por `MapGroup`, e a fatia é a pasta de um caso de uso com o próprio endpoint.
  - tipo: fluxo
    titulo: Da classe à rota
    etapas:
    - titulo: Inicialização
      descricao: '`AddEndpointsFromAssembly` lista os tipos do assembly e registra cada `IEndpoint` como serviço transitório.'
    - titulo: Grupo
      descricao: Depois da refatoração, o `Program.cs` cria `v1.MapGroup("/pedidos")` com tag e `RequireAuthorization`.
    - titulo: Mapeamento
      descricao: '`MapRegisteredEndpoints` resolve as fatias e passa o grupo para cada `MapEndpoints`.'
    - titulo: Rota
      descricao: '`app.MapGet("/contagem")` dentro do grupo vira `GET /api/v1/pedidos/contagem`, com a autorização herdada.'
    - titulo: Requisição
      descricao: Sem token, a autenticação responde 401 antes do handler, e com token o repositório Dapper conta os pedidos.
  - tipo: classificador
    enunciado: Onde cada decisão deve ficar depois da refatoração?
    categorias:
    - id: grupo
      rotulo: No grupo
    - id: fatia
      rotulo: Na fatia
    itens:
    - texto: Prefixo `/api/v1/pedidos`
      categoria: grupo
      explicacao: A versão pertence à API, e muda numa linha.
    - texto: Exigência de token
      categoria: grupo
      explicacao: Toda rota de Pedidos exige JWT, e uma fatia nova herda a regra.
    - texto: Caminho `/{id:int}/cancelar`
      categoria: fatia
      explicacao: É parte do caso de uso.
    - texto: Nome `ContarPedidos` da rota
      categoria: fatia
      explicacao: Cada rota tem nome único.
    - texto: Tag `Pedidos` do Swagger
      categoria: grupo
      explicacao: Vale para todas as fatias do contexto.
    - texto: Tipo de resposta `ContagemPedidosResponse`
      categoria: fatia
      explicacao: É o contrato daquele endpoint.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fechar a brecha de autorização que a auto-descoberta abre nos Pedidos, levando a exigência de token e o prefixo de versão das fatias para um grupo de rotas que vale para todas. Os passos 1 a 5 criam o endpoint de contagem com o teste escrito antes e mostram que ele responde sem token, e os passos 6 a 9 tiram o prefixo das fatias, criam o grupo `v1.MapGroup("/pedidos")` com autorização e conferem o resultado com a API no ar. Os passos rodam na raiz do repositório `net-minimal-api` no commit `702145a`, preparado como indica a faixa Antes de começar, logo abaixo.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: O laboratório escreve testes de integração, que sobem a API em memória e fazem requisições HTTP a ela, antes de mudar o código, e a falha inicial mostra o que precisa mudar. `IEndpointRouteBuilder` é a interface comum a quem pode mapear rotas, implementada tanto pela `WebApplication`, o objeto da aplicação criado no `Program.cs`, quanto pelo grupo criado por `MapGroup`, e por isso a extensão passa a aceitá-la. O `MSB3030` é um erro do MSBuild, o motor de compilação do .NET, que indica um arquivo ausente no momento da cópia para a saída, e apagar as pastas `bin/` e `obj/` força uma compilação do zero.
  - tipo: faixa
    estilo: objetivo
    problema: Nos Pedidos, cada fatia escreve a rota completa, com `/api/v1/pedidos`, e repete `.RequireAuthorization()` dentro do próprio `MapEndpoints`. A auto-descoberta de `AddEndpointsFromAssembly` registra qualquer classe que implemente `IEndpoint` sem aplicar política nenhuma, e a extensão `MapRegisteredEndpoints` só aceita uma `WebApplication`, o que impede passar um grupo a ela.
    impacto: Uma fatia nova que esqueça o `.RequireAuthorization()` fica pública, e a revisão do `Program.cs` não mostra a falha, porque a fatia não aparece ali. A versão repetida em cada arquivo torna a troca de versão uma edição em todas as fatias, e é por isso que a ADR-0012, ao adotar o versionamento por route groups, descarta o prefixo escrito em cada endpoint.
    mecanismo: O laboratório cria a fatia `ContarPedidos` com três testes de integração escritos antes, um deles sem token. Em seguida, tira o prefixo das seis fatias, muda a extensão para aceitar qualquer `IEndpointRouteBuilder` e cria no `Program.cs` o grupo `v1.MapGroup("/pedidos")` com tag e `RequireAuthorization`, de modo que toda fatia herde a regra.
    comprovacao: Antes do grupo, o teste sem token falha com `found HttpStatusCode.OK`, e depois dele os 3 testes novos passam junto com os 13 de integração anteriores, num total de 16 nos Pedidos e 146 na suíte. Com a API no ar, a contagem responde 401 sem token e `{"total":0}` com token, e o Swagger lista `/api/v1/pedidos/contagem`.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'

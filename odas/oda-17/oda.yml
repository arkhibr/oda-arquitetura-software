- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os quatro incidentes partem de saídas do laboratório e de trechos do código de registro das fatias.
  - tipo: incidente
    titulo: Rota nova aberta sem token
    origem: executado
    rotulo_saida: log
    saida: "  Com falha ProdutosAPI.Tests.Integration.Pedidos.ContarPedidosTests.GET_Contagem_SemAutenticacao_Retorna401 [740 ms]\n   Expected response.StatusCode to be HttpStatusCode.Unauthorized {value: 401}, but found HttpStatusCode.OK {value: 200}.\nCom falha! – Com falha:     1, Aprovado:     2, Ignorado:     0, Total:     3, Duração: 863 ms - ProdutosAPI.Tests.dll (net10.0)"
    pergunta: A fatia nova foi descoberta e responde. Por que ela atende sem token, se todas as outras exigem JWT?
    correcao: Aplicar `RequireAuthorization` no grupo dos Pedidos, como no passo 7, para que toda fatia herde a regra.
    alternativas:
    - texto: A auto-descoberta registra a fatia como anônima.
      correta: false
      explicacao: A descoberta não aplica nenhuma política.
    - texto: A exigência de token está em cada fatia, e a nova não repetiu `.RequireAuthorization()`.
      correta: true
      explicacao: Depois do grupo, a mesma classe responde 401 sem token.
    - texto: O `Program.cs` só protege as rotas que conhece.
      correta: false
      explicacao: O `Program.cs` não protege nenhuma rota de Pedidos no commit.
  - tipo: incidente
    titulo: Grupo que não compila com a extensão original
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/Common/EndpointExtensions.cs:30

      public static WebApplication MapRegisteredEndpoints(this WebApplication app)'
    pergunta: Por que `v1.MapGroup("/pedidos").MapRegisteredEndpoints()` não compila sem mudar a extensão?
    correcao: Declarar a extensão sobre `IEndpointRouteBuilder` e resolver as fatias por `app.ServiceProvider`.
    alternativas:
    - texto: Os grupos não aceitam endpoints descobertos por reflection.
      correta: false
      explicacao: O grupo aceita qualquer mapeamento.
    - texto: O `MapGroup` exige um nome de rota.
      correta: false
      explicacao: O grupo só exige o prefixo.
    - texto: A extensão é declarada para `WebApplication`, e o `RouteGroupBuilder` não é uma `WebApplication`.
      correta: true
      explicacao: Os dois implementam `IEndpointRouteBuilder`.
  - tipo: incidente
    titulo: Fatia que some sem erro
    origem: codigo
    rotulo_saida: arquivo
    saida: 'endpointTypes = assembly

      .GetTypes()

      .Where(t => t is { IsAbstract: false, IsInterface: false }

      && t.IsAssignableTo(typeof(IEndpoint)));'
    pergunta: Uma equipe cria `ContarPedidosEndpoint` dentro do projeto `Catalogo.API`. O que acontece na inicialização?
    correcao: Manter as fatias no assembly da API ou passar os demais assemblies a `AddEndpointsFromAssembly`, e cobrir cada rota nova com um teste de integração.
    alternativas:
    - texto: Nada é registrado e nenhum erro aparece, porque a varredura só olha o assembly de `Program`.
      correta: true
      explicacao: É a falha silenciosa que a ADR-0009 registra como consequência negativa.
    - texto: A API não inicia.
      correta: false
      explicacao: A varredura simplesmente não encontra o tipo.
    - texto: A rota é registrada duas vezes.
      correta: false
      explicacao: A classe nem é encontrada.
  - tipo: incidente
    titulo: Refatoração sem rede de testes
    origem: executado
    rotulo_saida: log
    saida: '# antes

      Aprovado!  – Com falha:     0, Aprovado:    13, Ignorado:     0, Total:    13, Duração: 800 ms - ProdutosAPI.Tests.dll (net10.0)


      # depois

      Aprovado!  – Com falha:     0, Aprovado:    16, Ignorado:     0, Total:    16, Duração: 824 ms - ProdutosAPI.Tests.dll (net10.0)'
    pergunta: A refatoração mudou o caminho de cinco fatias. O que garante que as rotas antigas continuam as mesmas?
    correcao: Rodar a integração de Pedidos antes e depois, e manter os testes que chamam cada rota pelo caminho completo.
    alternativas:
    - texto: O Swagger, que recusa caminhos duplicados.
      correta: false
      explicacao: O Swagger só descreve as rotas que existem.
    - texto: Os 13 testes de integração, que chamam `/api/v1/pedidos/...` pelo caminho completo e passaram antes e depois.
      correta: true
      explicacao: Os 3 testes novos somam 16.
    - texto: O compilador, que confere os caminhos.
      correta: false
      explicacao: Caminhos são texto e não são conferidos na compilação.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: O que precisa mudar no `Program.cs` para uma fatia nova de Pedidos?
      alternativas:
      - texto: Uma chamada `MapContarPedidos()`.
        correta: false
        explicacao: Esse é o modelo do Catálogo.
      - texto: Um controller.
        correta: false
        explicacao: O projeto não usa controllers.
      - texto: Nada, se a fatia não exigir um handler novo registrado no DI.
        correta: true
        explicacao: A contagem usa o repositório já registrado.
    - enunciado: Por que o grupo resolve a rota aberta?
      alternativas:
      - texto: Porque a autorização aplicada ao grupo vale para todo endpoint mapeado nele.
        correta: true
        explicacao: A fatia nova herdou a regra sem mudar.
      - texto: Porque o grupo exige HTTPS.
        correta: false
        explicacao: O grupo não muda o protocolo.
      - texto: Porque o grupo desliga a auto-descoberta.
        correta: false
        explicacao: A descoberta continua.
    - enunciado: Por que a ADR-0012 descarta o prefixo em cada endpoint?
      alternativas:
      - texto: Porque o Swagger não aceita.
        correta: false
        explicacao: O Swagger listava as rotas normalmente.
      - texto: Porque repete a versão e torna a mudança de versão trabalhosa.
        correta: true
        explicacao: Os Pedidos repetiam `/api/v1/pedidos` cinco vezes.
      - texto: Porque é mais lento.
        correta: false
        explicacao: O roteamento é o mesmo.
    - enunciado: Que consequência negativa da ADR-0009 o laboratório tornou visível?
      alternativas:
      - texto: A reflection deixa a API lenta em produção.
        correta: false
        explicacao: A varredura roda só na inicialização.
      - texto: As fatias não podem ter testes.
        correta: false
        explicacao: A fatia nova tem três.
      - texto: A fatia existe sem aparecer no ponto de entrada, e uma política esquecida nela passa sem revisão.
        correta: true
        explicacao: O teste sem token foi o primeiro a notar.
    - enunciado: Quantas mudanças de código o grupo exigiu nas fatias existentes?
      alternativas:
      - texto: Só o caminho de cada `Map`, com a assinatura de `MapEndpoints` intacta.
        correta: true
        explicacao: O grupo também é um `IEndpointRouteBuilder`.
      - texto: Uma interface nova por fatia.
        correta: false
        explicacao: A interface continua a mesma.
      - texto: Nenhuma.
        correta: false
        explicacao: Sem tirar o prefixo, as rotas ficariam com `/api/v1/pedidos` duas vezes.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A fatia nova foi descoberta sem mudança no `Program.cs`.
    - O teste sem token falhou antes do grupo e passou depois.
    - Os Pedidos ficaram sob `v1.MapGroup("/pedidos")`, com autorização no grupo.
    - Os 13 testes de integração anteriores continuaram passando.
    - A falha silenciosa da descoberta por assembly está clara.

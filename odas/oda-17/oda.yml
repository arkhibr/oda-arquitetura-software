id: '17'
titulo: 'Minimal API: endpoints, auto-descoberta e versionamento'
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é registrar endpoints de uma Minimal API por auto-descoberta e organizá-los em grupos de rota versionados, porque a forma atual dos Pedidos deixa uma fatia nova nascer sem exigir token sem que nada no `Program.cs` mostre isso. No `net-minimal-api`, os Pedidos registram os endpoints por reflection e repetem em cada fatia o prefixo `/api/v1/pedidos` e o `RequireAuthorization`, e o Catálogo já usa um route group versionado. Você vai acrescentar um endpoint sem tocar no `Program.cs`, mostrar que ele responde sem token e levar os Pedidos para um grupo que aplica o prefixo e a autenticação a todos.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Minimal API (API mínima)
      definicao: Forma de declarar endpoints HTTP no ASP.NET Core com chamadas como `app.MapGet` e `app.MapPost`, que associam uma rota a uma função, sem classes de controller. É o estilo usado em toda a API `net-minimal-api`.
      referencia:
        rotulo: Microsoft Learn · Visão geral das APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/overview
    - termo: ASP.NET Core
      definicao: Framework da Microsoft para aplicações web e APIs sobre o .NET. Ele recebe cada requisição HTTP, passa a requisição pela cadeia de middlewares e entrega o resultado ao endpoint correspondente.
      referencia:
        rotulo: Microsoft Learn · Visão geral do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/introduction-to-aspnet-core
    - termo: Route group (grupo de rotas)
      definicao: Recurso das Minimal APIs, criado com `MapGroup`, que dá a um conjunto de endpoints o mesmo prefixo de rota e as mesmas exigências, como autorização e tags do Swagger. O Catálogo usa o grupo `/api/v1/catalogo`, montado dentro do grupo de versão `/api/v1`.
      referencia:
        rotulo: Microsoft Learn · Manipuladores de rotas e grupos de rotas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/route-handlers
    - termo: Versionamento de API
      definicao: Prática de incluir a versão do contrato no endereço ou nos cabeçalhos, como o `/v1` de `/api/v1`, para que uma mudança incompatível possa ser publicada numa versão nova sem quebrar os clientes da anterior. A ADR-0012 do repositório faz isso com route groups e descarta a biblioteca `Asp.Versioning.Http`.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, a decisão tomada, as alternativas descartadas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`, e esta ODA as usa como registro das escolhas que o código mostra.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Bounded context (contexto delimitado)
      definicao: Conceito do Domain-Driven Design que delimita a parte do sistema dentro da qual um modelo e o seu vocabulário têm um único significado. No `net-minimal-api`, Catálogo, Pedidos e Pix são três bounded contexts, cada um com pastas, rotas e testes próprios.
      referencia:
        rotulo: martinfowler.com · Bounded Context
        url: https://martinfowler.com/bliki/BoundedContext.html
    - termo: Vertical Slice Architecture (arquitetura de fatias verticais)
      definicao: Estilo de organização em que todo o código de um caso de uso, como requisição, validação, handler e endpoint, fica numa mesma pasta, chamada fatia. Nos Pedidos do `net-minimal-api`, cada operação, como `CreatePedido` ou `CancelPedido`, é uma fatia com pasta própria.
    - termo: Reflection (reflexão)
      definicao: Recurso do .NET que permite ao programa examinar os próprios tipos em tempo de execução, por exemplo para listar as classes de um assembly que implementam uma interface. É o mecanismo que `AddEndpointsFromAssembly` usa para encontrar os endpoints dos Pedidos.
      referencia:
        rotulo: Microsoft Learn · Reflexão no .NET
        url: https://learn.microsoft.com/pt-br/dotnet/fundamentals/reflection/reflection
    - termo: Assembly
      definicao: Unidade compilada do .NET, normalmente um arquivo `.dll`, que contém os tipos de um projeto e os metadados com as referências a outros assemblies. Cada projeto `.csproj` do repositório gera um assembly.
    - termo: Injeção de dependência (DI) e contêiner
      definicao: Técnica em que uma classe recebe pronto, normalmente pelo construtor ou pelos parâmetros do endpoint, o objeto de que precisa. No ASP.NET Core, o contêiner cria esses objetos a partir dos registros feitos com `AddScoped`, `AddTransient` ou `AddSingleton` na inicialização, e um tipo sem registro não chega a quem o pede.
      referencia:
        rotulo: Microsoft Learn · Injeção de dependência no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/dependency-injection
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: Princípio aberto/fechado (Open/Closed)
      definicao: Princípio de projeto segundo o qual um módulo deve aceitar comportamento novo por extensão, sem que o código existente precise ser alterado. Na auto-descoberta de endpoints, uma fatia nova entra na API sem mudança no `Program.cs`.
    - termo: Controller MVC
      definicao: Classe que agrupa ações HTTP no estilo MVC (Model-View-Controller) do ASP.NET Core, com uma rota por método. É a alternativa às Minimal APIs, e o repositório não a usa.
    - termo: Rate limiting (limitação de taxa)
      definicao: Controle que limita quantas requisições um cliente pode fazer num intervalo e responde 429 quando o limite é ultrapassado. No ASP.NET Core, as políticas são registradas na inicialização e aplicadas às rotas ou aos grupos.
      referencia:
        rotulo: Microsoft Learn · Middleware de limitação de taxa
        url: https://learn.microsoft.com/pt-br/aspnet/core/performance/rate-limit
    - termo: Swagger e OpenAPI
      definicao: OpenAPI é a especificação que descreve as rotas, os parâmetros e as respostas de uma API HTTP num documento JSON. O Swagger, instalado no repositório pelo pacote Swashbuckle, gera esse documento a partir do código e oferece uma página web para explorar e chamar as rotas em desenvolvimento.
      referencia:
        rotulo: Microsoft Learn · Suporte a OpenAPI no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/openapi/overview
    - termo: Handler
      definicao: Classe que executa um caso de uso a partir de um comando ou de uma consulta, chamando o domínio e os repositórios. Nas fatias de Pedidos, o endpoint recebe a requisição, chama o handler e traduz o resultado dele em resposta HTTP.
    - termo: Repositório
      definicao: Classe que esconde o acesso a dados atrás de uma interface com operações como buscar e gravar, para que o domínio e os handlers não dependam do banco. No repositório, as interfaces de escrita usam o EF Core e as de leitura usam o Dapper.
    - termo: Dapper
      definicao: Biblioteca leve de acesso a dados para .NET que executa SQL escrito à mão e preenche objetos com o resultado. No Catálogo, ela atende os repositórios de leitura, e o EF Core atende os de escrita.
    - termo: Teste de integração
      definicao: Teste que sobe a API em memória e faz requisições HTTP a ela, conferindo status e corpo, com banco e serviços configurados como na aplicação. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests/Integration` e usam a `ApiFactory` para criar a API de teste.
      referencia:
        rotulo: Microsoft Learn · Testes de integração no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: Teste escrito antes da mudança
      definicao: Prática de escrever primeiro o teste que descreve o comportamento desejado, vê-lo falhar e só depois mudar o código até ele passar. A falha inicial confirma que o teste realmente verifica a mudança e não passaria por acaso.
    - termo: Erros `CS0234`, `CS0246` e `MSB3030`
      definicao: 'Os códigos que começam com `CS` vêm do compilador C#: o `CS0234` indica que um namespace ou tipo não existe dentro do namespace citado, e o `CS0246` indica que um tipo não foi encontrado, em geral por falta de `using` ou de referência de projeto. O `MSB3030` vem do MSBuild e indica que um arquivo marcado para cópia não foi encontrado no momento da cópia.'
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar como `AddEndpointsFromAssembly` e `MapRegisteredEndpoints` descobrem as fatias.
    - Criar uma fatia nova com o teste de integração escrito antes, sem alterar o `Program.cs`.
    - Reconhecer o risco de cada fatia repetir prefixo de versão e autorização.
    - Aplicar aos Pedidos um route group versionado, como o grupo `/api/v1/catalogo` que o Catálogo já usa.
    - Conferir que a refatoração manteve os 13 testes de integração anteriores.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: .NET SDK 10 e o repositório `net-minimal-api` no commit `702145a`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. Os comandos rodam na raiz do `net-minimal-api`, com a sintaxe do bash ou do zsh, e no Windows devem ser executados no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica duas técnicas de organização de endpoints numa Minimal API, o estilo do ASP.NET Core em que cada rota é declarada por uma chamada como `app.MapGet`. A primeira é a auto-descoberta, em que cada endpoint implementa uma interface e é encontrado por reflection na inicialização, sem registro manual no `Program.cs`, e a segunda são os route groups, que dão a vários endpoints o mesmo prefixo de versão e as mesmas exigências. Os blocos abaixo explicam cada conceito, e as duas ADRs do repositório que adotaram essas técnicas aparecem no fim como registro da decisão.
  - tipo: conceito
    titulo: Endpoint e Minimal API
    texto: Um endpoint é a combinação de método HTTP e caminho que a API atende, como `GET /api/v1/pedidos/{id}`, junto com a função que produz a resposta. Na Minimal API, essa associação é feita por chamadas como `app.MapGet` e `app.MapPost`, sem classes de controller, e por isso algum código precisa chamar esses métodos para cada rota existir.
  - tipo: conceito
    titulo: Auto-descoberta por reflection
    texto: Reflection é o recurso do .NET que permite ao programa listar os próprios tipos em tempo de execução. Nos Pedidos, `AddEndpointsFromAssembly` usa esse recurso para encontrar no assembly da API, a DLL gerada pelo projeto, toda classe concreta que implementa `IEndpoint` e registrá-la, e `MapRegisteredEndpoints` pede a cada uma que mapeie as próprias rotas. O ganho é acrescentar uma fatia sem mudar o `Program.cs`, e o custo é que a descoberta não aplica política nenhuma às rotas encontradas.
  - tipo: conceito
    titulo: Injeção de dependência (DI)
    texto: Mecanismo do ASP.NET Core em que um contêiner cria os objetos de que cada classe precisa a partir de registros feitos na inicialização, com métodos como `AddScoped` e `AddTransient`. As fatias descobertas são registradas nesse contêiner, e os handlers delas, as classes que executam cada operação, também precisam estar registrados para chegar ao endpoint.
  - tipo: conceito
    titulo: Versionamento de API
    texto: Prática de incluir a versão do contrato no caminho, como o `/v1` de `/api/v1`, para publicar uma mudança incompatível numa versão nova sem quebrar os clientes da anterior. Quando cada endpoint escreve a versão no próprio caminho, mudar de versão exige editar todos eles, e um grupo de rotas concentra a versão num único lugar.
  - tipo: conceito
    titulo: Route group
    texto: '`MapGroup` cria um `RouteGroupBuilder` com prefixo próprio, e tudo que se aplica ao grupo, como tags do Swagger, autorização e rate limiting (limite de requisições por intervalo), vale para cada endpoint mapeado nele. O grupo também implementa `IEndpointRouteBuilder`, e por isso as fatias o recebem sem mudar de assinatura.'
  - tipo: conceito
    titulo: Open/Closed na prática
    texto: Com a auto-descoberta, uma fatia nova entra sem que o ponto de entrada mude, e o código que existe continua fechado para alteração. O custo é que nada no `Program.cs` mostra a fatia, e uma política esquecida nela não aparece em nenhuma revisão do ponto de entrada.
  - tipo: comparativo
    colunas:
    - Catálogo
    - Pedidos no commit
    linhas:
    - dimensao: Registro
      valores:
      - '`catalogo.MapProdutoEndpoints()` e afins no `Program.cs`'
      - '`app.MapRegisteredEndpoints()`, sem citar as fatias'
    - dimensao: Prefixo de versão
      valores:
      - '`v1.MapGroup("/catalogo")`, uma vez'
      - '`/api/v1/pedidos` escrito em cada um dos cinco endpoints'
    - dimensao: Autorização
      valores:
      - Por endpoint, com `RequireAuthorization` ou `AllowAnonymous`
      - Por endpoint, com `RequireAuthorization` repetido
    - dimensao: Opção da ADR-0012
      valores:
      - Opção B, route groups
      - Opção C, prefixo em cada endpoint, descartada pela ADR
  - tipo: adr
    id: ADR-0009
    titulo: Minimal API com Auto-Discovery de Endpoints via Reflexão
    status: accepted
    contexto: Com Vertical Slice nos Pedidos, cada fatia define o próprio endpoint, e o `Program.cs` cresceria a cada funcionalidade.
    decisao: Interface `IEndpoint` com o método `MapEndpoints`, registrada no DI por reflection e mapeada por `MapRegisteredEndpoints`.
    alternativas: Registro manual no `Program.cs` e controllers MVC.
    consequencias: Fatia nova sem mudar o ponto de entrada, ao custo de um mecanismo opaco e de falhas que podem passar sem aviso.
  - tipo: adr
    id: ADR-0012
    titulo: Versionamento de API via Route Groups Manuais
    status: accepted
    contexto: O Catálogo precisava de versão explícita, e a versão pertence à API, e não a cada recurso.
    decisao: Um grupo `/api/v1` com o subgrupo `/catalogo`, criados por `MapGroup` e passados como `RouteGroupBuilder` a cada conjunto de endpoints.
    alternativas: Biblioteca `Asp.Versioning.Http` e prefixo escrito em cada endpoint.
    consequencias: Zero dependências e troca de versão numa linha, sem suporte a duas versões simultâneas.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, o código que descobre os endpoints, um endpoint dos Pedidos e o grupo versionado do Catálogo. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Nos trechos abaixo, um assembly é a unidade compilada de um projeto .NET, e `IEndpoint` é a interface com o método `MapEndpoints` que cada fatia dos Pedidos implementa para declarar as próprias rotas. Uma fatia é a pasta de um caso de uso, com o endpoint e o handler, a classe que executa a operação, e os repositórios são as classes de acesso a dados que os handlers usam. `MapGroup` cria um route group, conjunto de rotas com prefixo e exigências comuns, e `RequireAuthorization` exige um JWT (JSON Web Token) válido para a rota responder.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Common/EndpointExtensions.cs
    commit: 702145a
    linhas:
    - '    public static IServiceCollection AddEndpointsFromAssembly('
    - '        this IServiceCollection services, Assembly assembly)'
    - '    {'
    - '        IEnumerable<Type> endpointTypes;'
    - '        try'
    - '        {'
    - '            endpointTypes = assembly'
    - '                .GetTypes()'
    - '                .Where(t => t is { IsAbstract: false, IsInterface: false }'
    - '                            && t.IsAssignableTo(typeof(IEndpoint)));'
    - '        }'
    - '        catch (Exception ex)'
    - '        {'
    - '            throw new InvalidOperationException('
    - '                $"Failed to scan assembly ''{assembly.FullName}'' for IEndpoint implementations.", ex);'
    - '        }'
    - ''
    - '        foreach (var type in endpointTypes)'
    - '            services.AddTransient(typeof(IEndpoint), type);'
    - ''
    - '        return services;'
    - '    }'
    - ''
    - '    public static WebApplication MapRegisteredEndpoints(this WebApplication app)'
    - '    {'
    - '        var endpoints = app.Services.GetServices<IEndpoint>();'
    - '        foreach (var endpoint in endpoints)'
    - '            endpoint.MapEndpoints(app);'
    - ''
    - '        return app;'
    - '    }'
    anotacoes:
    - linha: 16
      texto: Toda classe concreta que implementa `IEndpoint` no assembly da API.
    - linha: 25
      texto: Cada fatia vira um serviço registrado sob a mesma interface.
    - linha: 30
      texto: Só aceita a aplicação inteira, e não um grupo.
    - linha: 34
      texto: Cada fatia mapeia as próprias rotas.
    inicio: 7
    contexto: O `src/Shared/Common/EndpointExtensions.cs` contém os dois métodos de extensão que implementam a auto-descoberta dos endpoints do contexto de Pedidos. O trecho abaixo mostra a varredura do assembly em busca de classes que implementam `IEndpoint`, o registro de cada uma na injeção de dependência e o mapeamento das rotas de todas elas na aplicação.
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - builder.Services.AddValidatorsFromAssemblyContaining<Program>();
    - ''
    - // Registrar slices de Pedidos via scan automático
    - builder.Services.AddEndpointsFromAssembly(typeof(Program).Assembly);
    - ''
    - '// Repositórios de Pedidos (CQRS: Dapper para leitura, EF Core para escrita)'
    - builder.Services.AddScoped<IPedidoQueryRepository, PedidoQueryRepository>();
    - builder.Services.AddScoped<IPedidoCommandRepository, PedidoCommandRepository>();
    - ''
    - // Handlers dos slices de Pedidos
    - builder.Services.AddScoped<CreatePedidoHandler>();
    - builder.Services.AddScoped<GetPedidoHandler>();
    - builder.Services.AddScoped<ListPedidosHandler>();
    - builder.Services.AddScoped<AddItemHandler>();
    - builder.Services.AddScoped<CancelPedidoHandler>();
    anotacoes:
    - linha: 88
      texto: Varre o assembly da API, onde ficam as fatias de Pedidos.
    - linha: 95
      texto: Os handlers, ao contrário dos endpoints, são registrados um a um.
    inicio: 85
    contexto: O `Program.cs` da raiz é o ponto de entrada da API, onde os serviços dos três bounded contexts são registrados. O trecho abaixo chama a varredura de endpoints sobre o assembly da API e registra, um a um, os handlers das fatias de Pedidos e os repositórios que eles usam.
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - var v1 = app.MapGroup("/api/v1");
    - var catalogo = v1.MapGroup("/catalogo");
    - catalogo.MapProdutoEndpoints();
    - catalogo.MapCategoriaEndpoints();
    - catalogo.MapVarianteEndpoints();
    - catalogo.MapAtributoEndpoints();
    - catalogo.MapMidiaEndpoints();
    - ''
    - // Slices de Pedidos (IEndpoint)
    - app.MapRegisteredEndpoints();
    - ''
    anotacoes:
    - linha: 256
      texto: Grupo do Catálogo, abaixo do grupo de versão.
    - linha: 264
      texto: Pedidos fora do grupo `v1`.
    inicio: 255
    contexto: Este segundo trecho do `Program.cs` é a parte que monta as rotas da aplicação. Ele cria o grupo de versão `/api/v1` com o subgrupo do Catálogo e, fora desse grupo, mapeia os endpoints de Pedidos descobertos pela varredura.
  - tipo: editor

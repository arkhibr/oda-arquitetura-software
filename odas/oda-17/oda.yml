      - endpoint_criado
      - grupo_aplicado
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     3, Ignorado:     0, Total:     3, Duração: 851 ms - ProdutosAPI.Tests.dll (net10.0)'
      origem: executado
    - entrada: dotnet test tests/ProdutosAPI.Tests --filter ContarPedidosTests
      condicao:
      - teste_contagem
      - endpoint_criado
      saida: "  Com falha ProdutosAPI.Tests.Integration.Pedidos.ContarPedidosTests.GET_Contagem_SemAutenticacao_Retorna401 [740 ms]\n   Expected response.StatusCode to be HttpStatusCode.Unauthorized {value: 401}, but found HttpStatusCode.OK {value: 200}.\nCom falha! – Com falha:     1, Aprovado:     2, Ignorado:     0, Total:     3, Duração: 863 ms - ProdutosAPI.Tests.dll (net10.0)"
      origem: executado
      dica: A fatia foi descoberta sem mudar o `Program.cs`, e a rota nova ficou aberta sem token.

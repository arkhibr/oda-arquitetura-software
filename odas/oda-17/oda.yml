    - entrada: curl -s http://localhost:5000/swagger/v1/swagger.json | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(p) for p in sorted(d["paths"]) if "pedidos" in p]'
      condicao: grupo_aplicado

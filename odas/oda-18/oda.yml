id: '18'
titulo: Desenho de API REST e contratos JSON
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é avaliar os recursos, os códigos de status e os payloads de uma API REST (Representational State Transfer) contra os dois guias de API do próprio repositório, porque contratos que mudam de um contexto para outro ou que ignoram parâmetros sem aviso levam o cliente a tratar erros e resultados de forma errada. No `net-minimal-api`, você vai sondar criação, validação, paginação, exclusão e cancelamento no Catálogo e nos Pedidos, e encontrar, entre outros casos, um filtro de status inexistente que devolve todos os pedidos. No fim, você terá um quadro de onde a API segue ou diverge dos guias, com evidência de cada item, e a divergência do filtro corrigida com o teste escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: REST (Representational State Transfer)
      definicao: Estilo de arquitetura para APIs HTTP em que cada recurso tem um endereço próprio e as operações usam os métodos do protocolo, como GET para ler, POST para criar e DELETE para remover. Os guias do repositório acrescentam regras próprias, como substantivos no plural e paginação obrigatória.
      referencia:
        rotulo: MDN · REST
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/REST
    - termo: Código de status HTTP
      definicao: 'Número de três dígitos que a resposta HTTP traz para indicar o resultado: a faixa 2xx indica sucesso, a 4xx indica erro do cliente e a 5xx indica falha do servidor. Os códigos mais citados aqui são 200, 201, 204, 400, 401, 404, 422 e 500.'
      referencia:
        rotulo: MDN · Códigos de status de respostas HTTP
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status
    - termo: Payload
      definicao: Corpo de uma requisição ou de uma resposta HTTP, que nesta API vem sempre em JSON.
    - termo: Paginação
      definicao: Divisão de uma lista longa em páginas, pedidas por parâmetros como `page` e `pageSize`, com metadados na resposta que informam a página atual, o tamanho e o total de itens.
    - termo: Cabeçalho `Location`
      definicao: Cabeçalho que a resposta `201 Created` traz com o endereço do recurso recém-criado, para que o cliente possa buscá-lo em seguida.
      referencia:
        rotulo: MDN · Location
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Headers/Location
    - termo: Problem Details (`application/problem+json`)
      definicao: Formato padronizado pela RFC 9457 para respostas de erro de APIs HTTP, com campos como `type`, `title`, `status` e `detail`, e um tipo de conteúdo próprio, `application/problem+json`. O ASP.NET Core produz esse formato com `Results.Problem` e `Results.ValidationProblem`.
      referencia:
        rotulo: IETF · RFC 9457, Problem Details for HTTP APIs
        url: https://datatracker.ietf.org/doc/html/rfc9457
    - termo: '`ValidationProblem`'
      definicao: Resposta do ASP.NET Core no formato Problem Details para erros de validação, com status 400 e um objeto `errors` que lista as mensagens de cada campo. Os Pedidos usam essa resposta, e o Catálogo usa um `ErrorResponse` próprio com status 422.
    - termo: Bounded context (contexto delimitado)
      definicao: Conceito do Domain-Driven Design que delimita a parte do sistema dentro da qual um modelo e o seu vocabulário têm um único significado. No `net-minimal-api`, Catálogo, Pedidos e Pix são três bounded contexts, cada um com pastas, rotas e testes próprios.
      referencia:
        rotulo: martinfowler.com · Bounded Context
        url: https://martinfowler.com/bliki/BoundedContext.html
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: ASP.NET Core
      definicao: Framework da Microsoft para aplicações web e APIs sobre o .NET. Ele recebe cada requisição HTTP, passa a requisição pela cadeia de middlewares e entrega o resultado ao endpoint correspondente.
      referencia:
        rotulo: Microsoft Learn · Visão geral do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/introduction-to-aspnet-core
    - termo: Minimal API (API mínima)
      definicao: Forma de declarar endpoints HTTP no ASP.NET Core com chamadas como `app.MapGet` e `app.MapPost`, que associam uma rota a uma função, sem classes de controller. É o estilo usado em toda a API `net-minimal-api`.
      referencia:
        rotulo: Microsoft Learn · Visão geral das APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/overview
    - termo: Teste escrito antes da mudança
      definicao: Prática de escrever primeiro o teste que descreve o comportamento desejado, vê-lo falhar e só depois mudar o código até ele passar. A falha inicial confirma que o teste realmente verifica a mudança e não passaria por acaso.
    - termo: Enum, `Enum.TryParse` e `Enum.IsDefined`
      definicao: Um enum é um tipo C# com um conjunto fixo de valores nomeados, como `StatusPedido`, com `Rascunho`, `Confirmado` e `Cancelado`. O `Enum.TryParse` converte um texto num valor do enum e aceita também números que não correspondem a nenhum membro, e o `Enum.IsDefined` confere se o valor convertido existe no enum.
      referencia:
        rotulo: Microsoft Learn · Tipos de enumeração em C#
        url: https://learn.microsoft.com/pt-br/dotnet/csharp/language-reference/builtin-types/enum
    - termo: Middleware de tratamento de exceções
      definicao: Middleware global do repositório, em `src/Shared/Middleware/ExceptionHandlingMiddleware.cs`, que captura as exceções não tratadas e as converte numa resposta JSON com o status de cada tipo de exceção. Uma exceção que não tem ramo próprio vira 500 com mensagem genérica.
    - termo: Ambiente de execução (`Development`, `Production`, `Testing`)
      definicao: Nome que o ASP.NET Core lê da variável `ASPNETCORE_ENVIRONMENT` para ajustar o comportamento da aplicação. Os perfis do `Properties/launchSettings.json`, como o `http` usado com `dotnet run --launch-profile http`, definem `Development`, a ausência da variável leva a `Production`, e os testes do repositório rodam no ambiente `Testing`, definido pela `ApiFactory`.
      referencia:
        rotulo: Microsoft Learn · Ambientes de runtime do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/environments
    - termo: Teste de integração
      definicao: Teste que sobe a API em memória e faz requisições HTTP a ela, conferindo status e corpo, com banco e serviços configurados como na aplicação. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests/Integration` e usam a `ApiFactory` para criar a API de teste.
      referencia:
        rotulo: Microsoft Learn · Testes de integração no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros de exemplo que a API grava no banco ao iniciar, pelo `DbSeeder` do Catálogo, para que haja produtos e categorias desde a primeira execução. Apagar o `produtos-api.db` faz a API recriar o banco com esses dados na próxima vez que subir.
    - termo: SQLite
      definicao: Banco de dados relacional que guarda tudo num único arquivo e roda dentro do próprio processo da aplicação. A API usa o arquivo `produtos-api.db`, na raiz do repositório, e o cria ao iniciar quando ele não existe.
      referencia:
        rotulo: SQLite · About SQLite
        url: https://www.sqlite.org/about.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, a decisão tomada, as alternativas descartadas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`, e esta ODA as usa como registro das escolhas que o código mostra.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Erros `CS0234`, `CS0246` e `MSB3030`
      definicao: 'Os códigos que começam com `CS` vêm do compilador C#: o `CS0234` indica que um namespace ou tipo não existe dentro do namespace citado, e o `CS0246` indica que um tipo não foi encontrado, em geral por falta de `using` ou de referência de projeto. O `MSB3030` vem do MSBuild e indica que um arquivo marcado para cópia não foi encontrado no momento da cópia.'
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Avaliar recursos, verbos e códigos de status contra a tabela do `MELHORES-PRATICAS-API.md`.
    - Comparar os envelopes de paginação e de erro do Catálogo e dos Pedidos.
    - Separar divergência da API, divergência do guia e comportamento silencioso.
    - Fazer o filtro de status de Pedidos recusar valores inexistentes, com o teste escrito antes.
    - Montar um quadro de avaliação com evidência de cada item.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: .NET SDK 10 e o repositório `net-minimal-api` no commit `702145a`, obtido como mostra o bloco Como ter o código na sua máquina, logo abaixo. O laboratório usa dois terminais na raiz do `net-minimal-api`, um para a API e outro para as chamadas, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba resume as regras dos dois guias de API do repositório `net-minimal-api`, que servem de referência para a sondagem desta ODA. O `MELHORES-PRATICAS-API.md` fixa substantivos no plural, o método HTTP como verbo, paginação obrigatória e uma tabela de status por situação, e o `JSON-COMPLEXO-E-BOAS-PRATICAS.md` pede erros em `application/problem+json`, um formato padronizado de resposta de erro, com mensagens por campo. Os blocos abaixo explicam primeiro esses conceitos, e o quadro seguinte compara o Catálogo e os Pedidos.
  - tipo: conceito
    titulo: API REST
    texto: REST (Representational State Transfer) é o estilo de API HTTP em que cada recurso tem um endereço próprio, como `/api/v1/catalogo/produtos`, e as operações usam os métodos do protocolo, com GET para ler, POST para criar, PUT para alterar e DELETE para remover. Os guias do repositório acrescentam a esse estilo regras próprias, como nomes de recurso no plural e paginação obrigatória nas listagens.
  - tipo: conceito
    titulo: Código de status HTTP
    texto: Número de três dígitos que a resposta traz para indicar o resultado. O 201 indica recurso criado, com o cabeçalho `Location` apontando para ele, o 204 indica sucesso sem corpo, o 400 e o 422 indicam erro do cliente, o 404 indica recurso inexistente e o 500 indica falha do servidor, e a sondagem compara o status recebido com o que a tabela do guia prevê para cada situação.
  - tipo: conceito
    titulo: Paginação
    texto: Divisão de uma listagem em páginas, pedidas pelos parâmetros `page` e `pageSize`, com metadados na resposta que informam a página, o tamanho usado e o total de itens. O cliente só percebe que o servidor trocou o tamanho pedido se ler esses metadados.
  - tipo: conceito
    titulo: Problem Details e `ValidationProblem`
    texto: Problem Details é o formato da RFC 9457 para respostas de erro, com campos como `type`, `title`, `status` e `detail` e o tipo de conteúdo `application/problem+json`. O `ValidationProblem` do ASP.NET Core usa esse formato para erros de validação, com status 400 e um objeto `errors` que lista as mensagens de cada campo, e o Catálogo responde com um `ErrorResponse` próprio, de status 422.
  - tipo: conceito
    titulo: 400 ou 422
    texto: O guia reserva o 400 para a requisição que não pode ser lida e o 422 para a requisição bem formada que viola uma regra. Os Pedidos usam o `ValidationProblem` padrão do ASP.NET, que responde 400 também para a regra violada, e o contrato do mesmo erro muda conforme o contexto.
  - tipo: conceito
    titulo: Comportamento silencioso
    texto: Um parâmetro que a API corrige ou ignora sem avisar faz o cliente acreditar que recebeu o que pediu. Um `pageSize=1000` que volta como 20, ou um `status` desconhecido que devolve a lista inteira, só aparece para quem lê os metadados da resposta.
  - tipo: comparativo
    colunas:
    - Catálogo
    - Pedidos
    linhas:
    - dimensao: Validação de entrada
      valores:
      - 422 com todas as mensagens num `detail` e `errors` vazio
      - 400 `ValidationProblem`, com mensagens por campo
    - dimensao: Envelope de lista
      valores:
      - '`data` e `pagination` com `page`, `pageSize`, `totalItems` e `totalPages`'
      - '`data`, `total`, `page` e `pageSize` no mesmo nível'
    - dimensao: Recurso inexistente
      valores:
      - 404 com `ErrorResponse`
      - 404 com `{ error }`
    - dimensao: Limite de página
      valores:
      - '`pageSize` acima de 100 vira 20'
      - '`pageSize` limitado entre 1 e 100'
  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: Esta parte da aba mostra, no commit `702145a`, os retornos de criação e validação nos dois contextos, o tratamento do filtro de status e o exemplo do guia, que são a base da sondagem. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: conceito
    titulo: 📘 Conceitos usados no código
    texto: Nos trechos abaixo, o `ErrorResponse` é a classe de erro do Catálogo, o cabeçalho `Location` traz o endereço do recurso criado numa resposta 201, e `application/problem+json` é o tipo de conteúdo do formato padronizado de erro da RFC 9457. O handler é a classe que executa a consulta de listagem, `StatusPedido` é o enum, tipo C# com valores fixos, que lista os status de um pedido, e `Results.Problem` produz uma resposta de erro nesse formato, aqui com status 500.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
    commit: 702145a
    linhas:
    - '        CriarProdutoRequest request, IProdutoService service,'
    - '        IValidator<CriarProdutoRequest> validator)'
    - '    {'
    - '        var validation = await validator.ValidateAsync(request);'
    - '        if (!validation.IsValid)'
    - '            return Results.UnprocessableEntity(new ErrorResponse'
    - '            {'
    - '                Status = 422, Title = "Validação falhou",'
    - '                Detail = string.Join("; ", validation.Errors.Select(e => e.ErrorMessage)),'
    - '                Type = "https://api.example.com/errors/validation"'
    - '            });'
    - '        var produto = await service.CriarProdutoAsync(request);'
    - '        return Results.Created($"/api/v1/catalogo/produtos/{produto.Id}", produto);'
    anotacoes:

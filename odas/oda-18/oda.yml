    contexto: O `ProdutoEndpoints.cs` fica no projeto `Catalogo.API` e reúne as rotas e os handlers HTTP de produtos do contexto de Catálogo. O trecho abaixo é o método de criação, que responde 422 com o `ErrorResponse` do Catálogo quando a validação falha e 201 com o cabeçalho `Location` quando o produto é gravado.

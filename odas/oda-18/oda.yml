- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Esta aba apresenta quatro situações que um time encontraria ao revisar essa API, a partir da sondagem e de uma chamada feita depois da correção. Escolha a causa de cada uma para ver a explicação e a correção.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Nas situações abaixo, `application/problem+json` é o tipo de conteúdo do formato padronizado de erro da RFC 9457, e `errors` é o objeto desse formato com as mensagens por campo. `StatusPedido` é um enum, tipo C# com os valores fixos `Rascunho`, `Confirmado` e `Cancelado`, o `Enum.TryParse` converte texto ou número num valor do enum, e o `Enum.IsDefined` confere se o valor convertido é um desses membros. O cabeçalho `Location` é o endereço do recurso criado que a resposta 201 devolve, e um redirecionamento é a resposta que manda o cliente para outro endereço.
  - tipo: incidente
    titulo: Cliente que trata dois formatos de erro
    origem: executado
    rotulo_saida: log
    saida: '$ produto inválido

      {"type":"https://api.example.com/errors/validation","title":"Validação falhou","status":422,"detail":"Nome é obrigatório; Nome deve ter no mínimo 3 caracteres; Descrição deve ter no mínimo 10 caracteres; Preço deve ser maior que zero; Categoria é obrigatória; Categoria inválida; Estoque não pode ser negativo; Email inválido","instance":"","errors":{}}

      422


      $ pedido sem itens

      {"type":"https://tools.ietf.org/html/rfc9110#section-15.5.1","title":"One or more validation errors occurred.","status":400,"errors":{"Itens":["Pedido deve conter ao menos um item."]}}

      400'
    pergunta: Um aplicativo móvel usa as duas partes da API. Que problema ele enfrenta ao mostrar erros de validação?
    correcao: Escolher um contrato de validação para a API inteira, com o status e o formato de `errors` por campo, e registrar a escolha numa ADR (Architecture Decision Record, documento curto que registra uma decisão de arquitetura e o motivo dela).
    alternativas:
    - texto: Os Pedidos não devolvem mensagem.
      correta: false
      explicacao: A mensagem está em `errors.Itens`.
    - texto: O Catálogo responde 422 com as mensagens num texto único, e os Pedidos respondem 400 com mensagens por campo, e o cliente precisa de dois tratamentos.
      correta: true
      explicacao: O guia de JSON pede mensagens por campo no `ValidationProblem`.
    - texto: Nenhum, porque os dois usam `problem+json`.
      correta: false
      explicacao: Os campos `status` e `errors` mudam de significado.
  - tipo: incidente
    titulo: Relatório com pedidos de todos os status
    origem: executado
    rotulo_saida: log
    saida: '$ GET /api/v1/pedidos?status=Qualquer

      ,"status":"Rascunho","total":4500.0,"criadoEm":"2026-11-02T00:19:12.118438","confirmadoEm":null,"canceladoEm":null,"motivoCancelamento":null,"itens":[{"produtoId":1,"nomeProduto":"Notebook Dell XPS 13","precoUnitario":4500.0,"quantidade":1,"subtotal":4500.0}]}],"total":1,"page":1,"pageSize":20}

      200'
    pergunta: Um relatório pede `status=Cancelados` e mostra pedidos em rascunho. O que aconteceu?
    correcao: Recusar o status inexistente com 400, como no passo 7.
    alternativas:
    - texto: O banco ignora o filtro de status.
      correta: false
      explicacao: Com `status=Cancelado`, a consulta filtra.
    - texto: O cache devolveu a lista anterior.
      correta: false
      explicacao: A listagem não usa cache.
    - texto: O nome no plural não converte para o enum, e o handler descarta o filtro sem avisar.
      correta: true
      explicacao: Depois da correção, a mesma chamada recebe 400 com os valores aceitos.
  - tipo: incidente
    titulo: Status numérico aceito
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Pedidos/ListPedidos/ListPedidosQuery.cs:21-22

      if (!string.IsNullOrWhiteSpace(query.Status)

      && Enum.TryParse<StatusPedido>(query.Status, true, out var parsed))'
    pergunta: Por que o teste com `status=7` falhava mesmo que o código já usasse `TryParse`?
    correcao: Conferir o valor com `Enum.IsDefined` depois do `TryParse`.
    alternativas:
    - texto: O `Enum.TryParse` aceita qualquer número inteiro e devolve um valor fora dos membros do enum.
      correta: true
      explicacao: A consulta procurava o status `7` e voltava vazia, ou a lista inteira com o descarte do filtro.
    - texto: O `7` é convertido em `Cancelado`.
      correta: false
      explicacao: O enum tem só os valores 0, 1 e 2.
    - texto: O `TryParse` ignora maiúsculas.
      correta: false
      explicacao: Isso explica `rascunho`, e não o número.
  - tipo: incidente
    titulo: Exemplo do guia que gera 404
    origem: codigo
    rotulo_saida: arquivo
    saida: 'docs/guias/MELHORES-PRATICAS-API.md:335

      return Results.Created($"/api/v1/produtos/{produto.Id}", produto);'
    pergunta: Uma equipe copia o exemplo do guia para um recurso novo do Catálogo. O que o cliente recebe ao seguir o `Location`?
    correcao: Atualizar o exemplo do guia para `/api/v1/catalogo/produtos/{id}`, como o código já faz.
    alternativas:
    - texto: 401, porque a rota exige token.
      correta: false
      explicacao: A rota não existe.
    - texto: 404, porque `/api/v1/produtos` deixou de existir na migração para o Catálogo.
      correta: true
      explicacao: O `setup.sh` ainda sugere essa rota.
    - texto: O produto, porque a API redireciona.
      correta: false
      explicacao: Não há redirecionamento configurado.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Nas perguntas abaixo, o 400 é o status de requisição que não pode ser lida, e o 422 é o status de requisição bem formada que viola uma regra, como define a tabela do guia de API do repositório. `ValidationProblem` é a resposta padrão de validação do ASP.NET Core, com status 400 e mensagens por campo, `Results.Problem` produz uma resposta de erro com status 500, e o middleware de exceções é o componente que transforma exceções não tratadas em respostas JSON no ambiente `Development`, o modo de execução local.
  - tipo: quiz
    perguntas:
    - enunciado: Pela tabela do guia, que status cabe a um JSON que não pode ser lido?
      alternativas:
      - texto: '422.'
        correta: false
        explicacao: O 422 é para requisição bem formada que viola regra.
      - texto: '500.'
        correta: false
        explicacao: O erro é do cliente.
      - texto: '400.'
        correta: true
        explicacao: A API responde 500, uma divergência.
    - enunciado: Que métrica mostra que o `pageSize=1000` foi trocado?
      alternativas:
      - texto: O `pagination.pageSize` da resposta, que volta 20.
        correta: true
        explicacao: Nenhum cabeçalho ou aviso informa a troca.
      - texto: O status 206.
        correta: false
        explicacao: A resposta é 200.
      - texto: Um erro 400.
        correta: false
        explicacao: A API não recusa o valor.
    - enunciado: Por que a correção usa `ValidationProblem`?
      alternativas:
      - texto: Porque o `Results.Problem` não compila.
        correta: false
        explicacao: Compila, e responderia 500.
      - texto: Para seguir o contrato de validação que os Pedidos já usam na criação, com a mensagem em `errors.status`.
        correta: true
        explicacao: O cliente trata o filtro como trata a criação.
      - texto: Porque o guia exige 400 para filtros.
        correta: false
        explicacao: O guia não trata filtros.
    - enunciado: O que separa uma divergência do guia de um guia desatualizado?
      alternativas:
      - texto: A data do commit.
        correta: false
        explicacao: A classificação depende do conteúdo.
      - texto: O status da resposta.
        correta: false
        explicacao: Os dois casos podem ter qualquer status.
      - texto: Na divergência, o código contraria a regra, e no guia desatualizado é o exemplo que contraria o código atual.
        correta: true
        explicacao: O `Location` do código está certo, e o do guia, não.
    - enunciado: O que o cancelamento sem corpo revelou?
      alternativas:
      - texto: Que a falha de leitura do corpo vira 500, como no JSON ilegível.
        correta: true
        explicacao: No ambiente de desenvolvimento, o middleware de exceções responde com 500.
      - texto: Que o pedido já estava cancelado.
        correta: false
        explicacao: As duas chamadas falharam antes do handler.
      - texto: Que o cancelamento exige outro token.
        correta: false
        explicacao: O token era o mesmo das outras chamadas.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A sondagem cobriu criação, validação, paginação, exclusão e cancelamento nos dois contextos.
    - Cada resultado foi classificado com a saída como evidência.
    - O teste do filtro falhou antes da validação e passou depois.
    - O status inexistente passou a receber 400 com os valores aceitos.
    - As divergências restantes ficaram registradas no quadro.

id: '18'
titulo: Desenho de API REST e contratos JSON
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O repositório traz dois guias de boas práticas de API, e esta ODA confronta a API real com eles. A sondagem percorre criação, validação, paginação, exclusão e cancelamento nos dois contextos, registra onde a API segue ou diverge dos guias e corrige uma das divergências com o teste escrito antes.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Avaliar recursos, verbos e códigos de status contra a tabela do `MELHORES-PRATICAS-API.md`.
    - Comparar os envelopes de paginação e de erro do Catálogo e dos Pedidos.
    - Separar divergência da API, divergência do guia e comportamento silencioso.
    - Fazer o filtro de status de Pedidos recusar valores inexistentes, com o teste escrito antes.
    - Montar um quadro de avaliação com evidência de cada item.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: A ODA 17. O laboratório usa dois terminais na raiz do `net-minimal-api`, um para a API e outro para as chamadas, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · duas validações, dois contratos
    comandos:
    - entrada: 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
      saida: ''
      origem: executado
    - entrada: 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":"","descricao":"x","preco":-1,"categoria":"","estoque":-5,"contatoEmail":"nao-e-email"}'' http://localhost:5000/api/v1/catalogo/produtos'
      saida: '{"type":"https://api.example.com/errors/validation","title":"Validação falhou","status":422,"detail":"Nome é obrigatório; Nome deve ter no mínimo 3 caracteres; Descrição deve ter no mínimo 10 caracteres; Preço deve ser maior que zero; Categoria é obrigatória; Categoria inválida; Estoque não pode ser negativo; Email inválido","instance":"","errors":{}}

        422'
      origem: executado
    - entrada: 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[]}'' http://localhost:5000/api/v1/pedidos'
      saida: '{"type":"https://tools.ietf.org/html/rfc9110#section-15.5.1","title":"One or more validation errors occurred.","status":400,"errors":{"Itens":["Pedido deve conter ao menos um item."]}}

        400'
      origem: executado
    cenarios:
    - rotulo: Produto inválido
      comando: 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":"","descricao":"x","preco":-1,"categoria":"","estoque":-5,"contatoEmail":"nao-e-email"}'' http://localhost:5000/api/v1/catalogo/produtos'
    - rotulo: Pedido sem itens
      comando: 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[]}'' http://localhost:5000/api/v1/pedidos'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: O `MELHORES-PRATICAS-API.md` fixa substantivos no plural, o verbo no protocolo, paginação obrigatória e uma tabela de status por situação. O `JSON-COMPLEXO-E-BOAS-PRATICAS.md` acrescenta erros em `application/problem+json`, com mensagens por campo.
  - tipo: comparativo
    colunas:
    - Catálogo
    - Pedidos
    linhas:
    - dimensao: Validação de entrada
      valores:
      - 422 com todas as mensagens num `detail` e `errors` vazio
      - 400 `ValidationProblem`, com mensagens por campo
    - dimensao: Envelope de lista
      valores:
      - '`data` e `pagination` com `page`, `pageSize`, `totalItems` e `totalPages`'
      - '`data`, `total`, `page` e `pageSize` no mesmo nível'
    - dimensao: Recurso inexistente
      valores:
      - 404 com `ErrorResponse`
      - 404 com `{ error }`
    - dimensao: Limite de página
      valores:
      - '`pageSize` acima de 100 vira 20'
      - '`pageSize` limitado entre 1 e 100'
  - tipo: conceito
    titulo: 400 ou 422
    texto: O guia reserva o 400 para a requisição que não pode ser lida e o 422 para a requisição bem formada que viola uma regra. Os Pedidos usam o `ValidationProblem` padrão do ASP.NET, que responde 400 também para a regra violada, e o contrato do mesmo erro muda conforme o contexto.
  - tipo: conceito
    titulo: Comportamento silencioso
    texto: Um parâmetro que a API corrige ou ignora sem avisar faz o cliente acreditar que recebeu o que pediu. Um `pageSize=1000` que volta como 20, ou um `status` desconhecido que devolve a lista inteira, só aparece para quem lê os metadados da resposta.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `702145a`, os retornos de criação e validação nos dois contextos, o tratamento do filtro e o exemplo do guia. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
    commit: 702145a
    linhas:
    - '        CriarProdutoRequest request, IProdutoService service,'
    - '        IValidator<CriarProdutoRequest> validator)'
    - '    {'
    - '        var validation = await validator.ValidateAsync(request);'
    - '        if (!validation.IsValid)'
    - '            return Results.UnprocessableEntity(new ErrorResponse'
    - '            {'
    - '                Status = 422, Title = "Validação falhou",'
    - '                Detail = string.Join("; ", validation.Errors.Select(e => e.ErrorMessage)),'
    - '                Type = "https://api.example.com/errors/validation"'
    - '            });'
    - '        var produto = await service.CriarProdutoAsync(request);'
    - '        return Results.Created($"/api/v1/catalogo/produtos/{produto.Id}", produto);'
    anotacoes:
    - linha: 85
      texto: 422 com o `ErrorResponse` próprio do Catálogo.
    - linha: 92
      texto: O `Location` aponta para a rota atual.
    inicio: 80
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CreatePedido/CreatePedidoEndpoint.cs
    commit: 702145a
    linhas:
    - '            CancellationToken ct) =>'
    - '        {'
    - '            var validation = await validator.ValidateAsync(cmd, ct);'
    - '            if (!validation.IsValid)'
    - '                return Results.ValidationProblem(validation.ToDictionary());'
    - ''
    - '            var result = await handler.HandleAsync(cmd, ct);'
    - '            return result.IsSuccess'
    - '                ? Results.Created($"/api/v1/pedidos/{result.Value!.Id}", result.Value)'
    - '                : Results.BadRequest(new { error = result.Error });'
    anotacoes:
    - linha: 19
      texto: 400 com as mensagens por campo.
    - linha: 24
      texto: Erro de domínio com um objeto anônimo, sem `problem+json`.
    inicio: 15
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/ListPedidos/ListPedidosQuery.cs
    commit: 702145a
    linhas:
    - '    public async Task<Result<ListPedidosResponse>> HandleAsync('
    - '        ListPedidosQuery query, CancellationToken ct = default)'
    - '    {'
    - '        var pageSize = Math.Clamp(query.PageSize, 1, 100);'
    - '        var page = Math.Max(query.Page, 1);'
    - ''
    - '        StatusPedido? statusEnum = null;'
    - '        if (!string.IsNullOrWhiteSpace(query.Status)'
    - '            && Enum.TryParse<StatusPedido>(query.Status, true, out var parsed))'
    - '        {'
    - '            statusEnum = parsed;'
    - '        }'
    - ''
    - '        var (data, total) = await repository.ListarAsync(page, pageSize, statusEnum, ct);'
    - ''
    - '        return Result<ListPedidosResponse>.Ok('
    - '            new ListPedidosResponse(data.ToList(), total, page, pageSize));'
    - '    }'
    anotacoes:
    - linha: 17
      texto: Limite de página aplicado sem aviso.
    - linha: 22
      texto: Status que não converte é descartado, e a consulta segue sem filtro.
    inicio: 14
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/ListPedidos/ListPedidosEndpoint.cs
    commit: 702145a
    linhas:
    - '            var result = await handler.HandleAsync('
    - '                new ListPedidosQuery(page, pageSize, status), ct);'
    - '            return result.IsSuccess'
    - '                ? Results.Ok(result.Value)'
    - '                : Results.Problem("Erro ao listar pedidos.");'
    anotacoes:
    - linha: 20
      texto: Uma falha do handler viraria 500.
    inicio: 16
  - tipo: editor
    rotulo: arquivo
    caminho: docs/guias/MELHORES-PRATICAS-API.md
    commit: 702145a
    linhas:
    - '```csharp'
    - // 201 Created — POST de produto bem-sucedido
    - return Results.Created($"/api/v1/produtos/{produto.Id}", produto);
    - ''
    - // 204 No Content — DELETE bem-sucedido
    anotacoes:
    - linha: 335
      texto: Exemplo com a rota anterior à migração para `/api/v1/catalogo`.
    inicio: 333
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Envie as requisições da sondagem, com respostas capturadas na API do commit de referência, e classifique cada resultado em relação aos guias.
  - tipo: console-api
    cenarios:
    - rotulo: Criar produto
      requisicao:
        metodo: POST
        url: http://localhost:5000/api/v1/catalogo/produtos
        cabecalhos:
          Authorization: Bearer <token>
        corpo:
          nome: Teclado Mecânico
          descricao: Teclado com switches azuis para uso diário
          preco: 350.0
          categoria: Eletrônicos
          estoque: 10
          contatoEmail: vendas@exemplo.com
      resposta:
        status: 201
        corpo: 'Location: /api/v1/catalogo/produtos/9'
      origem: executado
    - rotulo: Produto inválido
      requisicao:
        metodo: POST
        url: http://localhost:5000/api/v1/catalogo/produtos
        cabecalhos:
          Authorization: Bearer <token>
        corpo:
          nome: ''
          preco: -1
      resposta:
        status: 422
        corpo: '{"type":"https://api.example.com/errors/validation","title":"Validação falhou","status":422,"detail":"Nome é obrigatório; Nome deve ter no mínimo 3 caracteres; Descrição deve ter no mínimo 10 caracteres; Preço deve ser maior que zero; Categoria é obrigatória; Categoria inválida; Estoque não pode ser negativo; Email inválido","instance":"","errors":{}}'
      origem: executado
      nota: Corpo enviado resumido. As oito mensagens ficam no `detail`, e `errors` vem vazio.
    - rotulo: JSON ilegível
      requisicao:
        metodo: POST
        url: http://localhost:5000/api/v1/catalogo/produtos
        corpo: '{"nome":'
      resposta:
        status: 500
        corpo: '{"type":"https://example.com/errors/internal-server-error","title":"Internal Server Error","status":500,"detail":"Um erro interno ocorreu ao processar sua requisição","instance":"/api/v1/catalogo/produtos","errors":{}}'
      origem: executado
    - rotulo: Pedido sem itens
      requisicao:
        metodo: POST
        url: http://localhost:5000/api/v1/pedidos
        cabecalhos:
          Authorization: Bearer <token>
        corpo:
          itens: []
      resposta:
        status: 400
        corpo: '{"type":"https://tools.ietf.org/html/rfc9110#section-15.5.1","title":"One or more validation errors occurred.","status":400,"errors":{"Itens":["Pedido deve conter ao menos um item."]}}'
      origem: executado
    - rotulo: Status inexistente
      requisicao:
        metodo: GET
        url: http://localhost:5000/api/v1/pedidos?status=Qualquer
        cabecalhos:
          Authorization: Bearer <token>
      resposta:
        status: 200
        corpo: ',"status":"Rascunho","total":4500.0,"criadoEm":"2026-11-02T00:19:12.118438","confirmadoEm":null,"canceladoEm":null,"motivoCancelamento":null,"itens":[{"produtoId":1,"nomeProduto":"Notebook Dell XPS 13","precoUnitario":4500.0,"quantidade":1,"subtotal":4500.0}]}],"total":1,"page":1,"pageSize":20}'
      origem: executado
      nota: 'Saída final do corpo: a lista inteira, sem filtro.'
    - rotulo: Cancelar sem corpo
      requisicao:
        metodo: POST
        url: http://localhost:5000/api/v1/pedidos/1/cancelar
        cabecalhos:
          Authorization: Bearer <token>
      resposta:
        status: 500
      origem: executado
  - tipo: classificador
    enunciado: Como cada resultado se compara aos guias?
    categorias:
    - id: segue
      rotulo: Segue o guia
    - id: diverge
      rotulo: A API diverge
    - id: guia
      rotulo: O guia está desatualizado
    - id: silencio
      rotulo: Comportamento silencioso
    itens:
    - texto: '`201` com `Location: /api/v1/catalogo/produtos/9`'
      categoria: segue
      explicacao: Criação com o endereço do recurso novo.
    - texto: Exemplo do guia com `Results.Created($"/api/v1/produtos/...")`
      categoria: guia
      explicacao: O código usa `/api/v1/catalogo/produtos`.
    - texto: '`500` para JSON ilegível'
      categoria: diverge
      explicacao: A tabela do guia diz 400.
    - texto: '`pageSize=1000` que volta como 20'
      categoria: silencio
      explicacao: Só os metadados mostram a troca.
    - texto: '`204` e depois `404` ao excluir o mesmo produto'
      categoria: segue
      explicacao: DELETE bem-sucedido sem corpo, e recurso inativo como inexistente.
    - texto: 422 do Catálogo com `errors` vazio
      categoria: diverge
      explicacao: O guia de JSON pede mensagens por campo.
    - texto: '`status=Qualquer` que devolve a lista inteira'
      categoria: silencio
      explicacao: O filtro desconhecido é descartado sem aviso.
    - texto: '`setup.sh` que sugere `/api/v1/produtos`'
      categoria: guia
      explicacao: Mesma rota antiga, vista na ODA 16.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos na raiz do `net-minimal-api`. Os passos 1 a 4 fazem a sondagem e montam o quadro de avaliação, e os passos 5 a 8 corrigem o filtro de status com o teste escrito antes.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir a API e obter um token
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db
        - dotnet run --launch-profile http
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
      sucesso: '`Now listening on: http://localhost:5000` e a variável `TOKEN` preenchida.'
    - titulo: Sondar o Catálogo
      editor:
        rotulo: terminal
        linhas:
        - 'curl -s -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":"Teclado Mecânico","descricao":"Teclado com switches azuis para uso diário","preco":350.0,"categoria":"Eletrônicos","estoque":10,"contatoEmail":"vendas@exemplo.com"}'' http://localhost:5000/api/v1/catalogo/produtos | tr -d ''\r'' | grep -i -E ''^HTTP|^location'''
        - 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":"","descricao":"x","preco":-1,"categoria":"","estoque":-5,"contatoEmail":"nao-e-email"}'' http://localhost:5000/api/v1/catalogo/produtos'
        - 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":'' http://localhost:5000/api/v1/catalogo/produtos'
        - curl -s 'http://localhost:5000/api/v1/catalogo/produtos?pageSize=1000' | grep -o '"pagination":{[^}]*}'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X DELETE -H "Authorization: Bearer $TOKEN" http://localhost:5000/api/v1/catalogo/produtos/2'
      sucesso: '`201`, `422`, `500`, `"pageSize":20` e `204`.'
    - titulo: Sondar os Pedidos
      editor:
        rotulo: terminal
        linhas:
        - 'curl -s -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":1,"quantidade":1}]}'' http://localhost:5000/api/v1/pedidos | tr -d ''\r'' | grep -i -E ''^HTTP|^location|^\{'''
        - 'curl -s -w ''\n%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[]}'' http://localhost:5000/api/v1/pedidos'
        - 'curl -s -w ''\n%{http_code}\n'' -H "Authorization: Bearer $TOKEN" ''http://localhost:5000/api/v1/pedidos?pageSize=0'''
        - 'curl -s -w ''\n%{http_code}\n'' -H "Authorization: Bearer $TOKEN" ''http://localhost:5000/api/v1/pedidos?status=Qualquer'''
        - 'curl -s -w '' %{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" http://localhost:5000/api/v1/pedidos/1/cancelar'
      sucesso: '`201` com `Location`, `400` com `errors.Itens`, `"pageSize":1`, `200` com a lista inteira e `500` no cancelamento.'
    - titulo: Montar o quadro de avaliação
      texto: Para cada chamada, anote o status recebido, o que o guia prevê e a classificação da Simulação. Guarde a saída do terminal como evidência de cada linha.
    - titulo: Escrever o teste do filtro
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/Pedidos/FiltroStatusTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using FluentAssertions;
        - using Microsoft.AspNetCore.Mvc;
        - using ProdutosAPI.Pedidos.CreatePedido;
        - using ProdutosAPI.Pedidos.ListPedidos;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration.Pedidos;
        - ''
        - 'public class FiltroStatusTests : IClassFixture<ApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public FiltroStatusTests(ApiFactory factory)'
        - '    {'
        - '        _client = factory.CreateClient();'
        - '    }'
        - ''
        - '    private async Task AuthenticateAsync()'
        - '    {'
        - '        var token = await AuthHelper.ObterTokenAsync(_client);'
        - '        _client.DefaultRequestHeaders.Authorization ='
        - '            new AuthenticationHeaderValue("Bearer", token);'
        - '    }'
        - ''
        - '    [Theory]'
        - '    [InlineData("Qualquer")]'
        - '    [InlineData("7")]'
        - '    public async Task GET_Pedidos_StatusInexistente_Retorna400(string status)'
        - '    {'
        - '        await AuthenticateAsync();'
        - ''
        - '        var response = await _client.GetAsync($"/api/v1/pedidos?status={status}");'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.BadRequest);'
        - '        var problema = await response.Content.ReadFromJsonAsync<ValidationProblemDetails>();'
        - '        problema!.Errors.Should().ContainKey("status");'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task GET_Pedidos_StatusValido_FiltraSemDiferenciarMaiusculas()'
        - '    {'
        - '        await AuthenticateAsync();'
        - '        await _client.PostAsJsonAsync("/api/v1/pedidos", new CreatePedidoCommand([new(1, 1)]));'
        - ''
        - '        var response = await _client.GetAsync("/api/v1/pedidos?status=rascunho");'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.OK);'
        - '        var lista = await response.Content.ReadFromJsonAsync<ListPedidosResponse>();'
        - '        lista!.Data.Should().OnlyContain(p => p.Status == "Rascunho");'
        - '    }'
        - '}'
      efeito: teste_filtro
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter FiltroStatusTests
      sucesso: '`Com falha: 2, Aprovado: 1`, com `found HttpStatusCode.OK` para `Qualquer` e para `7`.'
    - titulo: Validar o status
      texto: Faça o handler recusar o valor inexistente e o endpoint responder com `ValidationProblem`, o mesmo contrato da criação de pedidos.
      editor:
        rotulo: arquivo
        caminho: src/Pedidos/ListPedidos (alteração)
        commit: 702145a
        linhas:
        - '// src/Pedidos/ListPedidos/ListPedidosQuery.cs: no lugar do if que lê o status'
        - '        if (!string.IsNullOrWhiteSpace(query.Status))'
        - '        {'
        - '            // TryParse aceita qualquer número; IsDefined recusa os que não são um status.'
        - '            if (!Enum.TryParse<StatusPedido>(query.Status, true, out var parsed) || !Enum.IsDefined(parsed))'
        - '                return Result<ListPedidosResponse>.Fail('
        - '                    $"Status ''{query.Status}'' inválido. Use {string.Join(", ", Enum.GetNames<StatusPedido>())}.");'
        - '            statusEnum = parsed;'
        - '        }'
        - ''
        - '// src/Pedidos/ListPedidos/ListPedidosEndpoint.cs: no ramo de falha'
        - '                : Results.ValidationProblem(new Dictionary<string, string[]> { ["status"] = [result.Error!] });'
      efeito: filtro_validado
    - titulo: Ver o teste passar e conferir com a API
      texto: Reinicie a API e repita a chamada com o status inexistente.
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter FiltroStatusTests
        - dotnet test tests/ProdutosAPI.Tests
        - 'curl -s -w ''\n%{http_code}\n'' -H "Authorization: Bearer $TOKEN" ''http://localhost:5000/api/v1/pedidos?status=Qualquer'''
      sucesso: '`Aprovado: 3`, a suíte com `Aprovado: 146` e `400` com a mensagem `Status ''Qualquer'' inválido. Use Rascunho, Confirmado, Cancelado.`'
  - tipo: terminal
    titulo: terminal · net-minimal-api
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: dotnet run --launch-profile http
      saida: 'Now listening on: http://localhost:5000

        Application started. Press Ctrl+C to shut down.


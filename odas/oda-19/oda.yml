id: '19'
titulo: Clean Architecture híbrida no Catálogo
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O Catálogo divide o código em quatro subprojetos, e a Clean Architecture exige que as dependências apontem para dentro, em direção ao domínio. Esta ODA lê o grafo de referências, transforma a regra em testes de arquitetura e corrige a única seta que aponta para fora: a camada de API referencia a Infrastructure só para registrar repositórios.'
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar a responsabilidade de Domain, Application, Infrastructure e API no Catálogo.
    - Ler o grafo de referências dos subprojetos e a direção de cada seta.
    - Escrever testes que falham quando uma camada passa a depender de outra que não deveria.
    - Mover o registro dos repositórios para a raiz de composição, sem a API conhecer a Infrastructure.
    - Reconhecer onde o `DbContext` do Catálogo fica e o que isso custa.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: A ODA 17. Os comandos rodam na raiz do `net-minimal-api`, com a sintaxe do bash ou do zsh, e no Windows devem rodar no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · grafo do Catálogo
    comandos:
    - entrada: for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
      saida: '== Catalogo.Domain

        == Catalogo.Application

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.Infrastructure

        ../Catalogo.Application/Catalogo.Application.csproj

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.API

        ../Catalogo.Application/Catalogo.Application.csproj

        ../Catalogo.Infrastructure/Catalogo.Infrastructure.csproj'
      origem: executado
    - entrada: grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
      saida: 'src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs:5:using ProdutosAPI.Catalogo.Infrastructure.Queries;

        src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs:6:using ProdutosAPI.Catalogo.Infrastructure.Repositories;'
      origem: executado
    cenarios:
    - rotulo: Referências dos subprojetos
      comando: for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
    - rotulo: Usos da Infrastructure na API
      comando: grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'A ADR-0001 faz Clean Architecture e Vertical Slice coexistirem em contextos diferentes, e a ADR-0011 detalha o Catálogo: camadas da Clean Architecture embaixo e um arquivo por grupo de endpoints em cima. A regra de dependência diz que o código de dentro não conhece o de fora.'
  - tipo: comparativo
    colunas:
    - Responsabilidade
    - Conhece
    linhas:
    - dimensao: Catalogo.Domain
      valores:
      - Entidades, value objects e regras, como `Produto.Criar`
      - Só o .NET
    - dimensao: Catalogo.Application
      valores:
      - Serviços, DTOs, validadores e as interfaces de repositório
      - Domain
    - dimensao: Catalogo.Infrastructure
      valores:
      - Repositórios EF Core de escrita, consultas Dapper de leitura e seed
      - Application e Domain
    - dimensao: Catalogo.API
      valores:
      - Endpoints por recurso, rate limiting e registro dos serviços
      - Application, e no commit também a Infrastructure
    - dimensao: ProdutosAPI (host)
      valores:
      - '`Program.cs`, `AppDbContext` e migrations'
      - Todos os subprojetos
  - tipo: conceito
    titulo: Inversão de dependência
    texto: A Application declara `IProdutoCommandRepository` e a Infrastructure o implementa, e por isso a seta de referência vai da Infrastructure para a Application. O serviço de produto chama a interface e não sabe se do outro lado há EF Core, Dapper ou um dublê de teste.
  - tipo: conceito
    titulo: Raiz de composição
    texto: Algum ponto do sistema precisa conhecer as implementações para registrá-las no DI, e esse ponto é o host, que já referencia tudo. Quando o registro fica na camada de API, ela passa a depender da Infrastructure, embora nenhum endpoint use as classes dela.
  - tipo: adr
    id: ADR-0001
    titulo: Coexistência de Clean Architecture e Vertical Slice Architecture
    status: accepted
    contexto: Contextos com regras simples e mudança frequente convivem com contextos de regras complexas e necessidade de testes isolados.
    decisao: Vertical Slice nos Pedidos e Clean Architecture, em camadas, no Catálogo.
    alternativas: Um único padrão para toda a aplicação.
    consequencias: Comparação dos padrões no mesmo código, com carga cognitiva maior para quem contribui.
  - tipo: adr
    id: ADR-0011
    titulo: 'Arquitetura Híbrida: Clean Architecture nas Camadas + Vertical Slice na API'
    status: accepted
    contexto: O Catálogo passou a ter cinco recursos com regras de domínio ricas, e a estrutura plana anterior não escalava.
    decisao: Domain, Application e Infrastructure em Clean Architecture, e um arquivo por grupo de endpoints na API.
    alternativas: Clean Architecture pura e Vertical Slice pura.
    consequencias: Domínio reutilizado por todos os endpoints, com risco de misturar responsabilidades se a disciplina de camadas não for mantida.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo mostram, no commit `702145a`, as referências da API, o registro no DI, a interface de dados da Application e o contexto EF Core do host. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Catalogo.API.csproj
    commit: 702145a
    linhas:
    - '  <ItemGroup>'
    - '    <ProjectReference Include="../Catalogo.Application/Catalogo.Application.csproj" />'
    - '    <ProjectReference Include="../Catalogo.Infrastructure/Catalogo.Infrastructure.csproj" />'
    - '  </ItemGroup>'
    anotacoes:
    - linha: 14
      texto: Seta da API para a Infrastructure.
    inicio: 12
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs

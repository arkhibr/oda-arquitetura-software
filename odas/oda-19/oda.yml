    inicio: 24
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Acompanhe a criação de um produto pelas camadas e classifique onde cada peça deve ficar.
  - tipo: fluxo
    titulo: POST /api/v1/catalogo/produtos pelas camadas
    etapas:
    - titulo: API
      descricao: '`CriarProduto` recebe o `CriarProdutoRequest`, roda o validador do FluentValidation e chama `IProdutoService`.'
    - titulo: Application
      descricao: '`ProdutoService` chama `Produto.Criar` e, com sucesso, `IProdutoCommandRepository`, sem conhecer a implementação.'
    - titulo: Domain
      descricao: '`Produto.Criar` confere nome, e-mail, preço e estoque e devolve `Result<Produto>`.'
    - titulo: Infrastructure
      descricao: '`EfProdutoCommandRepository` usa `ICatalogoContext` para adicionar o produto e salvar.'
    - titulo: Host
      descricao: O `AppDbContext` implementa `ICatalogoContext` e grava no SQLite, com o mapeamento EF Core do host.
  - tipo: classificador
    enunciado: Em que camada cada peça deve ficar?
    categorias:
    - id: domain
      rotulo: Domain
    - id: application
      rotulo: Application
    - id: infra
      rotulo: Infrastructure
    - id: host
      rotulo: Host
    itens:
    - texto: Regra de que o preço deve ser maior que zero
      categoria: domain
      explicacao: Invariante da entidade.
    - texto: Interface `IProdutoQueryRepository`
      categoria: application
      explicacao: Quem usa declara o contrato.
    - texto: Consulta SQL com Dapper para a listagem
      categoria: infra
      explicacao: Detalhe de acesso a dados.
    - texto: '`services.AddScoped<IProdutoCommandRepository, EfProdutoCommandRepository>()`'
      categoria: host
      explicacao: 'Composição: quem conhece as implementações. No laboratório, a extensão fica na Infrastructure e é chamada pelo host.'
    - texto: '`CriarProdutoValidator`'
      categoria: application
      explicacao: Validação de entrada do caso de uso.
    - texto: '`DbSet<Produto>` e as migrations'
      categoria: host
      explicacao: No commit, o `AppDbContext` e as migrations ficam em `src/Shared/Data`.
    - texto: Value object `PrecoProduto`
      categoria: domain
      explicacao: Fica em `Catalogo.Domain/ValueObjects`.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos na raiz do `net-minimal-api`. Os passos 1 a 4 leem o grafo e escrevem os testes de arquitetura, e os passos 5 a 7 movem o registro para a raiz de composição e conferem o resultado.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Ler o grafo de referências
      editor:
        rotulo: terminal
        linhas:
        - for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
        - grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
      sucesso: Domain sem referências, Application para Domain, Infrastructure para Application e Domain, e API para Application e Infrastructure, com os `using` em `CatalogoServiceExtensions.cs`.
    - titulo: Rodar a linha de base
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 143`.'
    - titulo: Escrever os testes de arquitetura
      texto: Crie o arquivo abaixo. Ele lê as referências que o compilador gravou em cada assembly, que só incluem os assemblies cujos tipos o código usa.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Unit/Arquitetura/DependenciasCatalogoTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Reflection;
        - using FluentAssertions;
        - using ProdutosAPI.Catalogo.API.Extensions;
        - using ProdutosAPI.Catalogo.Application.Services;
        - using ProdutosAPI.Catalogo.Domain;
        - using ProdutosAPI.Catalogo.Infrastructure.Repositories;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Unit.Arquitetura;
        - ''
        - public class DependenciasCatalogoTests
        - '{'
        - '    private static readonly Assembly Domain = typeof(Produto).Assembly;'
        - '    private static readonly Assembly Application = typeof(ProdutoService).Assembly;'
        - '    private static readonly Assembly Infrastructure = typeof(EfProdutoCommandRepository).Assembly;'
        - '    private static readonly Assembly Api = typeof(CatalogoServiceExtensions).Assembly;'
        - ''
        - '    private static IEnumerable<string> Referencias(Assembly assembly) =>'
        - '        assembly.GetReferencedAssemblies().Select(a => a.Name!);'
        - ''
        - '    [Fact]'
        - '    public void Domain_NaoReferenciaOutrasCamadasNemBibliotecas()'
        - '    {'
        - '        Referencias(Domain).Should().OnlyContain(nome => nome == "System.Runtime" || nome.StartsWith("System."));'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void Application_ConheceSoODomain()'
        - '    {'
        - '        Referencias(Application).Should().Contain(Domain.GetName().Name)'
        - '            .And.NotContain(new[] { Infrastructure.GetName().Name!, "Microsoft.EntityFrameworkCore", "Dapper" });'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void Infrastructure_ImplementaAsInterfacesDaApplication()'
        - '    {'
        - '        Referencias(Infrastructure).Should().Contain(Application.GetName().Name);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void Api_NaoDependeDaInfrastructure()'
        - '    {'
        - '        Referencias(Api).Should().NotContain(Infrastructure.GetName().Name);'
        - '    }'
        - '}'
      efeito: teste_arquitetura
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter DependenciasCatalogoTests
      sucesso: '`Com falha: 1, Aprovado: 3`, com `Catalogo.Infrastructure` na lista de referências da API.'
    - titulo: Criar o registro na Infrastructure
      editor:
        rotulo: arquivo
        caminho: src/Catalogo/Catalogo.Infrastructure/InfrastructureServiceExtensions.cs (novo)
        commit: 702145a
        linhas:
        - using Microsoft.Extensions.DependencyInjection;
        - using ProdutosAPI.Catalogo.Application.Repositories;
        - using ProdutosAPI.Catalogo.Infrastructure.Queries;
        - using ProdutosAPI.Catalogo.Infrastructure.Repositories;
        - ''
        - namespace ProdutosAPI.Catalogo.Infrastructure;
        - ''
        - public static class InfrastructureServiceExtensions
        - '{'
        - '    public static IServiceCollection AddCatalogoInfrastructure(this IServiceCollection services)'
        - '    {'
        - '        services.AddScoped<IProdutoQueryRepository, DapperProdutoQueryRepository>();'
        - '        services.AddScoped<IProdutoCommandRepository, EfProdutoCommandRepository>();'
        - '        services.AddScoped<ICategoriaQueryRepository, DapperCategoriaQueryRepository>();'
        - '        services.AddScoped<ICategoriaCommandRepository, EfCategoriaCommandRepository>();'
        - '        services.AddScoped<IVarianteQueryRepository, DapperVarianteQueryRepository>();'
        - '        services.AddScoped<IVarianteCommandRepository, EfVarianteCommandRepository>();'
        - '        services.AddScoped<IAtributoRepository, EfAtributoRepository>();'
        - '        services.AddScoped<IMidiaRepository, EfMidiaRepository>();'
        - '        return services;'
        - '    }'
        - '}'
    - titulo: Tirar a Infrastructure da API
      texto: Faça as três mudanças abaixo. O host continua a referenciar a Infrastructure pelo `ProdutosAPI.csproj`.
      editor:
        rotulo: arquivo
        caminho: Catalogo.API.csproj, CatalogoServiceExtensions.cs e Program.cs (alteração)
        commit: 702145a
        linhas:
        - '<!-- src/Catalogo/Catalogo.API/Catalogo.API.csproj: remova a linha -->'
        - <ProjectReference Include="../Catalogo.Infrastructure/Catalogo.Infrastructure.csproj" />
        - ''
        - '// src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs:'
        - // remova os dois using de Infrastructure, o using de Application.Repositories
        - // e as oito linhas services.AddScoped<I...Repository, ...>()
        - ''
        - '// Program.cs: junto aos using e depois de builder.Services.AddCatalogo();'
        - using ProdutosAPI.Catalogo.Infrastructure;
        - builder.Services.AddCatalogoInfrastructure();
      efeito: registro_movido
    - titulo: Conferir o grafo e os testes
      editor:
        rotulo: terminal
        linhas:
        - for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
        - grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
        - dotnet test tests/ProdutosAPI.Tests --filter DependenciasCatalogoTests
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: 'A API aponta só para a Application, o `grep` não encontra usos, `Aprovado: 4` e `Aprovado: 147`.'
  - tipo: terminal
    titulo: terminal · net-minimal-api
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
      condicao: registro_movido
      saida: '== Catalogo.Domain

        == Catalogo.Application

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.Infrastructure

        ../Catalogo.Application/Catalogo.Application.csproj

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.API

        ../Catalogo.Application/Catalogo.Application.csproj'
      origem: executado
    - entrada: for p in Domain Application Infrastructure API; do echo "== Catalogo.$p"; dotnet list src/Catalogo/Catalogo.$p reference | tail -n +3; done
      saida: '== Catalogo.Domain

        == Catalogo.Application

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.Infrastructure

        ../Catalogo.Application/Catalogo.Application.csproj

        ../Catalogo.Domain/Catalogo.Domain.csproj

        == Catalogo.API

        ../Catalogo.Application/Catalogo.Application.csproj

        ../Catalogo.Infrastructure/Catalogo.Infrastructure.csproj'
      origem: executado
      dica: A API é a única camada que aponta para a Infrastructure.
    - entrada: grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
      condicao: registro_movido
      saida: ''
      origem: executado
      dica: Nenhum uso da Infrastructure na API.
    - entrada: grep -rn 'using ProdutosAPI.Catalogo.Infrastructure' src/Catalogo/Catalogo.API
      saida: 'src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs:5:using ProdutosAPI.Catalogo.Infrastructure.Queries;

        src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs:6:using ProdutosAPI.Catalogo.Infrastructure.Repositories;'
      origem: executado
      dica: O único arquivo da API que usa a Infrastructure é o registro no DI.
    - entrada: dotnet test tests/ProdutosAPI.Tests --filter DependenciasCatalogoTests
      condicao:
      - teste_arquitetura
      - registro_movido
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     4, Ignorado:     0, Total:     4, Duração: 8 ms - ProdutosAPI.Tests.dll (net10.0)'
      origem: executado

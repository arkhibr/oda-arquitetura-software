- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os incidentes partem de saídas do laboratório e de trechos do código de dados do Catálogo.
  - tipo: incidente
    titulo: Vinte e seis testes com 500 depois da mudança
    origem: executado
    rotulo_saida: log
    saida: "# dotnet test\n  Com falha ProdutosAPI.Tests.Endpoints.ProdutoEndpointsTests.GET_Produto_NaoRequerAutenticacao [1 s]\n   Expected response.StatusCode to be HttpStatusCode.OK {value: 200}, but found HttpStatusCode.InternalServerError {value: 500}.\nCom falha! – Com falha:    26, Aprovado:   121, Ignorado:     0, Total:   147, Duração: 1 s - ProdutosAPI.Tests.dll (net10.0)\n\n# dotnet run, ambiente Development\nUnhandled exception. System.AggregateException: Some services are not able to be constructed (Error while validating the service descriptor 'ServiceType: ProdutosAPI.Catalogo.Application.Services.IProdutoService Lifetime: Scoped ImplementationType: ProdutosAPI.Catalogo.Application.Services.ProdutoSe\n ---> System.InvalidOperationException: Error while validating the service descriptor 'ServiceType: ProdutosAPI.Catalogo.Application.Services.IProdutoService Lifetime: Scoped ImplementationType: ProdutosAPI.Catalogo.Application.Services.ProdutoService': Unable to resolve service for type 'ProdutosAP\n ---> System.InvalidOperationException: Unable to resolve service for type 'ProdutosAPI.Catalogo.Application.Repositories.IProdutoQueryRepository' while attempting to activate 'ProdutosAPI.Catalogo.Application.Services.ProdutoService'."
    pergunta: Depois do passo 6, a equipe esquece de chamar `AddCatalogoInfrastructure()` no `Program.cs`. Por que a API não sobe em desenvolvimento, e os testes só recebem 500?
    correcao: Manter a chamada no `Program.cs` e ligar `ValidateOnBuild` também no ambiente `Testing`, para que a suíte pare na inicialização como a API em desenvolvimento.
    alternativas:
    - texto: Os testes de arquitetura quebraram os outros.
      correta: false
      explicacao: Eles só leem metadados dos assemblies.
    - texto: Em `Development`, o ASP.NET valida o DI ao construir a aplicação e para na ausência dos repositórios. Os testes usam o ambiente `Testing`, sem essa validação, e o erro só aparece quando um endpoint pede o serviço.
      correta: true
      explicacao: A suíte teve 26 falhas, todas com 500 vindo do middleware de exceções.
    - texto: O compilador não percebe o erro porque a API não referencia mais a Infrastructure.
      correta: false
      explicacao: 'O código compila: o erro é de registro em tempo de execução.'
  - tipo: incidente
    titulo: Referência que o teste não enxerga
    origem: codigo
    rotulo_saida: arquivo
    saida: 'tests/ProdutosAPI.Tests/Unit/Arquitetura/DependenciasCatalogoTests.cs

      assembly.GetReferencedAssemblies().Select(a => a.Name!);'
    pergunta: Se a linha `ProjectReference` da API para a Infrastructure voltasse, sem nenhum uso no código, o teste da API falharia?
    correcao: Complementar o teste com uma verificação do `.csproj`, ou com uma ferramenta de regras de arquitetura que leia os projetos, se a referência declarada também precisar ser proibida.
    alternativas:
    - texto: Sim, porque o MSBuild copia a DLL.
      correta: false
      explicacao: A cópia não altera os metadados de referência.
    - texto: Sim, porque `GetReferencedAssemblies` lê o `.csproj`.
      correta: false
      explicacao: O método lê os metadados do assembly compilado.
    - texto: Não. O compilador só grava no assembly as referências cujos tipos o código usa, e uma referência sem uso não aparece.
      correta: true
      explicacao: O teste protege a dependência real, e o passo 6 remove também a declarada.
  - tipo: incidente
    titulo: Catálogo sem o próprio DbContext
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/Data/AppDbContext.cs:9-22

      public class AppDbContext : DbContext, ICatalogoContext

      {

      public AppDbContext(DbContextOptions<AppDbContext> options) : base(options)

      {

      }

      // DbSets

      public DbSet<Produto> Produtos => Set<Produto>();

      public DbSet<Categoria> Categorias => Set<Categoria>();

      public DbSet<Variante> Variantes => Set<Variante>();

      public DbSet<Atributo> Atributos => Set<Atributo>();

      public DbSet<Midia> Midias => Set<Midia>();

      public DbSet<Pedido> Pedidos => Set<Pedido>();

      public DbSet<PedidoItem> PedidoItens => Set<PedidoItem>();'
    pergunta: Uma equipe quer publicar o Catálogo como serviço separado. O que falta nos quatro subprojetos?
    correcao: Levar um `CatalogoDbContext` e as migrations do Catálogo para a Infrastructure, separando o esquema dos Pedidos.
    alternativas:
    - texto: O contexto EF Core e as migrations, que ficam no host e misturam tabelas do Catálogo e dos Pedidos.
      correta: true
      explicacao: A Infrastructure só conhece a interface `ICatalogoContext`.
    - texto: Os endpoints.
      correta: false
      explicacao: Os endpoints estão em `Catalogo.API`.
    - texto: As interfaces de repositório.
      correta: false
      explicacao: Elas estão em `Catalogo.Application`.
  - tipo: incidente
    titulo: IQueryable na fronteira da Application
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Catalogo/Catalogo.Application/Interfaces/ICatalogoContext.cs:7-11

      IQueryable<Produto> Produtos { get; }

      IQueryable<Categoria> Categorias { get; }

      IQueryable<Variante> Variantes { get; }

      IQueryable<Atributo> Atributos { get; }

      IQueryable<Midia> Midias { get; }'
    pergunta: Que risco a interface traz para a regra de dependência?
    correcao: Restringir o uso de `ICatalogoContext` à Infrastructure e manter na Application só as interfaces de repositório, com operações nomeadas.
    alternativas:
    - texto: Nenhum, porque é uma interface.
      correta: false
      explicacao: A interface carrega o comportamento do provedor de consulta.
    - texto: Uma consulta LINQ escrita na Application só é traduzida pelo EF Core em execução, e um método sem tradução falha longe de onde foi escrito.
      correta: true
      explicacao: No commit, só a Infrastructure usa a interface.
    - texto: O `IQueryable` obriga a Application a referenciar o EF Core.
      correta: false
      explicacao: '`IQueryable` é do .NET, e o teste confirma que a Application não referencia o EF Core.'
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Para onde apontam as dependências na Clean Architecture?
      alternativas:
      - texto: Para a Infrastructure.
        correta: false
        explicacao: A Infrastructure é a camada de fora.
      - texto: Para a API.
        correta: false
        explicacao: A API depende da Application.
      - texto: Para dentro, em direção ao domínio.
        correta: true
        explicacao: O Domain não conhece nenhuma outra camada.
    - enunciado: Por que a Infrastructure referencia a Application?
      alternativas:
      - texto: Porque implementa as interfaces de repositório que a Application declara.
        correta: true
        explicacao: É a inversão de dependência.
      - texto: Porque chama os serviços da Application.
        correta: false
        explicacao: Os repositórios não chamam serviços.
      - texto: Porque a Application precisa do Dapper.
        correta: false
        explicacao: A Application não referencia o Dapper.
    - enunciado: Por que o registro dos repositórios saiu da API?
      alternativas:
      - texto: Porque deixava a API mais lenta.
        correta: false
        explicacao: A mudança é de dependência, e não de desempenho.
      - texto: Porque era o único motivo da referência da API para a Infrastructure, e a composição cabe ao host.
        correta: true
        explicacao: Nenhum endpoint usa as classes da Infrastructure.
      - texto: Porque o DI não aceita registros em bibliotecas.
        correta: false
        explicacao: A extensão nova está numa biblioteca.
    - enunciado: O que o teste de arquitetura lê?
      alternativas:
      - texto: Os arquivos `.csproj`.
        correta: false
        explicacao: O `.csproj` não é lido em execução.
      - texto: As rotas da API.
        correta: false
        explicacao: O teste não sobe a API.
      - texto: As referências gravadas no assembly compilado de cada camada.
        correta: true
        explicacao: Só entram as referências cujos tipos o código usa.
    - enunciado: Qual consequência negativa da ADR-0011 os testes ajudam a conter?
      alternativas:
      - texto: O risco de misturar responsabilidades se a disciplina de camadas não for mantida.
        correta: true
        explicacao: Uma referência nova fora da regra falha na suíte.
      - texto: O número maior de arquivos.
        correta: false
        explicacao: Os testes não mudam o número de arquivos.
      - texto: A necessidade de entender dois padrões.
        correta: false
        explicacao: Esse custo continua.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A responsabilidade de cada subprojeto do Catálogo está clara.
    - O grafo de referências foi lido antes e depois da mudança.
    - O teste da API falhou antes da mudança e passou depois.
    - A API deixou de referenciar a Infrastructure, e a suíte teve 147 aprovações.
    - A posição do `AppDbContext` no host foi identificada.

    - linha: 5
      texto: Contrato de dados declarado na Application.
    - linha: 7
      texto: Expõe consultas LINQ, e não só operações de repositório.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Data/AppDbContext.cs
    commit: 702145a
    linhas:
    - using Microsoft.EntityFrameworkCore;
    - using ProdutosAPI.Pedidos.Domain;
    - using ProdutosAPI.Catalogo.Application.Interfaces;

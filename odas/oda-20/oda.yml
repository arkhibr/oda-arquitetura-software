id: '20'
titulo: Vertical Slice e comparativo com Clean Architecture
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é comparar a organização por camada técnica com a organização por caso de uso e implementar um caso de uso novo como fatia vertical, porque é ao acrescentar uma funcionalidade que o custo de cada padrão aparece. No `net-minimal-api`, o agregado `Pedido` já tem o método `Confirmar()`, com três regras de negócio, mas a API não expõe essa operação, e o cliente não tem como confirmar um pedido. Você vai comparar Pedidos com Catálogo e criar a confirmação de pedido como uma fatia com comando, handler, endpoint e teste de integração.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Clean Architecture
      definicao: Estilo de arquitetura em camadas concêntricas em que o domínio e as regras de aplicação ficam no centro e não dependem de banco, framework ou interface com o usuário. As dependências entre projetos apontam sempre para dentro, e no Catálogo isso se traduz nos subprojetos Domain, Application, Infrastructure e API.
      referencia:
        rotulo: Microsoft Learn · Arquiteturas comuns de aplicativos web
        url: https://learn.microsoft.com/pt-br/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures
    - termo: Vertical Slice Architecture (arquitetura de fatias verticais)
      definicao: Estilo de organização em que todo o código de um caso de uso, como requisição, validação, handler e endpoint, fica numa mesma pasta, chamada fatia. Nos Pedidos do `net-minimal-api`, cada operação, como `CreatePedido` ou `CancelPedido`, é uma fatia com pasta própria.
    - termo: Bounded context (contexto delimitado)
      definicao: Conceito do Domain-Driven Design que delimita a parte do sistema dentro da qual um modelo e o seu vocabulário têm um único significado. No `net-minimal-api`, Catálogo, Pedidos e Pix são três bounded contexts, cada um com pastas, rotas e testes próprios.
      referencia:
        rotulo: martinfowler.com · Bounded Context
        url: https://martinfowler.com/bliki/BoundedContext.html
    - termo: Agregado e raiz do agregado
      definicao: Agregado é um grupo de objetos do domínio tratado como uma unidade de consistência, e a raiz é o único objeto do grupo que o código de fora pode chamar. O `Pedido` é a raiz do agregado de pedido, e os `PedidoItem` só mudam por meio dos métodos dele.
      referencia:
        rotulo: martinfowler.com · DDD Aggregate
        url: https://martinfowler.com/bliki/DDD_Aggregate.html
    - termo: Comando
      definicao: Objeto que representa a intenção de mudar o estado do sistema e carrega os dados necessários para isso, como o `CancelPedidoCommand`. O handler da fatia recebe o comando e executa a operação.
    - termo: Handler
      definicao: Classe que executa um caso de uso a partir de um comando ou de uma consulta, chamando o domínio e os repositórios. Nas fatias de Pedidos, o endpoint recebe a requisição, chama o handler e traduz o resultado dele em resposta HTTP.
    - termo: Repositório
      definicao: Classe que esconde o acesso a dados atrás de uma interface com operações como buscar e gravar, para que o domínio e os handlers não dependam do banco. No repositório, as interfaces de escrita usam o EF Core e as de leitura usam o Dapper.
    - termo: Minimal API (API mínima)
      definicao: Forma de declarar endpoints HTTP no ASP.NET Core com chamadas como `app.MapGet` e `app.MapPost`, que associam uma rota a uma função, sem classes de controller. É o estilo usado em toda a API `net-minimal-api`.
      referencia:
        rotulo: Microsoft Learn · Visão geral das APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/overview
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, a decisão tomada, as alternativas descartadas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`, e esta ODA as usa como registro das escolhas que o código mostra.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Value object (objeto de valor)
      definicao: Objeto do domínio definido apenas pelo valor que carrega, sem identidade própria, e que valida esse valor na criação. No Catálogo, `PrecoProduto` e `EstoqueProduto` são value objects, e um preço inválido não chega a existir.
      referencia:
        rotulo: Microsoft Learn · Implementando objetos de valor
        url: https://learn.microsoft.com/pt-br/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/implement-value-objects
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional da Microsoft, que traduz classes C# em tabelas e consultas LINQ em SQL. No repositório, ele grava os dados no SQLite e atende as operações de escrita.
      referencia:
        rotulo: Microsoft Learn · Visão geral do Entity Framework Core
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: Dapper
      definicao: Biblioteca leve de acesso a dados para .NET que executa SQL escrito à mão e preenche objetos com o resultado. No Catálogo, ela atende os repositórios de leitura, e o EF Core atende os de escrita.
    - termo: FluentValidation
      definicao: Biblioteca de validação para .NET em que as regras de uma requisição ficam numa classe validadora, como `CriarProdutoValidator`, escrita com métodos encadeados. A ADR-0010 do repositório registra o uso dela para validar a entrada.
    - termo: Padrão Result (`Result` e `Result<T>`)
      definicao: Tipo de retorno que informa sucesso ou falha de forma explícita, com `IsSuccess`, o valor em caso de sucesso e a mensagem em `Error` em caso de falha. No repositório, `Result` e `Result<T>` são records definidos em `src/Shared/Common/Result.cs` e em `Catalogo.Domain/Common/Result.cs`, e a ADR-0003 registra o uso deles para erros de domínio.
    - termo: Injeção de dependência (DI) e contêiner
      definicao: Técnica em que uma classe recebe pronto, normalmente pelo construtor ou pelos parâmetros do endpoint, o objeto de que precisa. No ASP.NET Core, o contêiner cria esses objetos a partir dos registros feitos com `AddScoped`, `AddTransient` ou `AddSingleton` na inicialização, e um tipo sem registro não chega a quem o pede.
      referencia:
        rotulo: Microsoft Learn · Injeção de dependência no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/dependency-injection
    - termo: Reflection (reflexão)
      definicao: Recurso do .NET que permite ao programa examinar os próprios tipos em tempo de execução, por exemplo para listar as classes de um assembly que implementam uma interface. É o mecanismo que `AddEndpointsFromAssembly` usa para encontrar os endpoints dos Pedidos.
      referencia:
        rotulo: Microsoft Learn · Reflexão no .NET
        url: https://learn.microsoft.com/pt-br/dotnet/fundamentals/reflection/reflection
    - termo: Assembly
      definicao: Unidade compilada do .NET, normalmente um arquivo `.dll`, que contém os tipos de um projeto e os metadados com as referências a outros assemblies. Cada projeto `.csproj` do repositório gera um assembly.
    - termo: Vinculação de parâmetros (parameter binding)
      definicao: 'Regra pela qual a Minimal API decide de onde vem cada parâmetro do endpoint: da rota, da query string, dos cabeçalhos, do contêiner de serviços ou do corpo. Um parâmetro de tipo complexo que não é serviço registrado é lido do corpo da requisição, e a falta de corpo gera 400.'
      referencia:
        rotulo: Microsoft Learn · Associação de parâmetros em APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/parameter-binding
    - termo: AutoMapper
      definicao: Biblioteca que copia os dados de um objeto para outro, como de uma entidade para um DTO, a partir de configurações de mapeamento declaradas uma vez.
    - termo: DTO (Data Transfer Object)
      definicao: Objeto simples que só carrega os dados que entram ou saem da API, sem regras de negócio, como `CriarProdutoRequest`.
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: Idempotência e `IdempotencyMiddleware`
      definicao: Uma operação é idempotente quando repeti-la produz o mesmo efeito de executá-la uma vez. O `IdempotencyMiddleware` do repositório guarda a resposta das requisições POST, PUT e PATCH que trazem o cabeçalho `Idempotency-Key` e devolve a mesma resposta quando a chave chega de novo.
      referencia:
        rotulo: MDN · Idempotente
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Idempotent
    - termo: Teste de integração
      definicao: Teste que sobe a API em memória e faz requisições HTTP a ela, conferindo status e corpo, com banco e serviços configurados como na aplicação. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests/Integration` e usam a `ApiFactory` para criar a API de teste.
      referencia:
        rotulo: Microsoft Learn · Testes de integração no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: Suíte de testes e xUnit
      definicao: A suíte é o conjunto de testes automatizados do repositório, e o xUnit é o framework de testes que os projetos de teste usam. O `dotnet test` compila os projetos de teste, roda os testes e imprime uma linha de resumo por projeto, com aprovados, falhas e ignorados.
      referencia:
        rotulo: xUnit.net
        url: https://xunit.net/
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Diferenciar a organização por camada técnica, usada no Catálogo, da organização por caso de uso, usada em Pedidos.
    - Rastrear o caminho de uma requisição de cancelamento de pedido, do endpoint ao agregado.
    - Comparar o custo de uma mudança nos dois padrões a partir do quadro de `docs/01-ARQUITETURA.md`.
    - Implementar o caso de uso de confirmação de pedido como uma nova fatia vertical, com teste de integração.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários o .NET 10 SDK, como indica o README do repositório, e o Git. O laboratório usa o repositório `arkhibr/net-minimal-api` no commit `702145a`.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba compara as duas organizações presentes no repositório `net-minimal-api`: o Catálogo, em `src/Catalogo/`, agrupa o código por camada técnica, e os Pedidos, em `src/Pedidos/`, agrupam por caso de uso, com tudo de uma operação na mesma pasta. As duas árvores abaixo reproduzem essas pastas no commit `702145a`, e os itens marcados como novos são os arquivos que o laboratório cria. Clique numa pasta ou num arquivo para ver a responsabilidade dele.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: As pastas e os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste, e cada caminho parte da raiz desse repositório no commit `702145a`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: arvores
    esquerda:
      titulo: Catálogo · Clean Architecture híbrida
      nos:
      - caminho: src/Catalogo/
        descricao: Bounded context dividido em quatro subprojetos, um por camada técnica.
      - caminho: src/Catalogo/Catalogo.Domain/
        descricao: Entidades e value objects, sem dependência de outras camadas.
      - caminho: src/Catalogo/Catalogo.Domain/Produto.cs
        descricao: Entidade com método de fábrica `Produto.Criar` que aplica as regras do produto.
      - caminho: src/Catalogo/Catalogo.Application/
        descricao: Serviços de aplicação, DTOs, validadores e interfaces de repositório.
      - caminho: src/Catalogo/Catalogo.Application/Services/ProdutoService.cs
        descricao: Orquestra a criação e a consulta de produtos para vários endpoints.
      - caminho: src/Catalogo/Catalogo.Infrastructure/
        descricao: Implementações dos repositórios, com EF Core na escrita e Dapper na leitura.
      - caminho: src/Catalogo/Catalogo.Infrastructure/Repositories/EfProdutoCommandRepository.cs
        descricao: Grava produtos com EF Core.
      - caminho: src/Catalogo/Catalogo.API/
        descricao: Endpoints da Minimal API, um arquivo por grupo de recursos.
      - caminho: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
        descricao: Mapeia as rotas de produto e valida a entrada com FluentValidation.
    direita:
      titulo: Pedidos · Vertical Slice
      nos:
      - caminho: src/Pedidos/
        descricao: Bounded context organizado por caso de uso, com uma pasta por operação.
      - caminho: src/Pedidos/CancelPedido/
        descricao: 'Fatia completa do cancelamento: comando, handler e endpoint juntos.'
      - caminho: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
        descricao: Comando e handler que carregam o agregado e aplicam a regra.
      - caminho: src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs
        descricao: Rota da fatia, com tradução do `Result` em código HTTP.
      - caminho: src/Pedidos/CreatePedido/
        descricao: Fatia de criação, com o próprio validador.
      - caminho: src/Pedidos/Domain/
        descricao: Agregado `Pedido` compartilhado pelas fatias do contexto.
      - caminho: src/Pedidos/Domain/Pedido.cs
        descricao: Regras de `Confirmar()` e `Cancelar()`, que devolvem `Result` sem lançar exceção.
      - caminho: src/Pedidos/Repositories/
        descricao: Interfaces de escrita (EF Core) e de leitura (Dapper) usadas pelas fatias.
  - tipo: comparativo
    colunas:
    - Catálogo (Clean Architecture)
    - Pedidos (Vertical Slice)
    linhas:
    - dimensao: Localização de um novo endpoint
      valores:
      - Quatro subprojetos diferentes
      - Uma pasta isolada
    - dimensao: Acréscimo de um campo
      valores:
      - Domain, Application (DTO, validador e serviço), Infrastructure e API
      - Domain e a fatia específica
    - dimensao: Tratamento de erro
      valores:
      - Exceção e middleware global
      - Padrão `Result`, sem exceção para erro de negócio
    - dimensao: Teste unitário
      valores:
      - Serviço testado com repositório substituído
      - Agregado testado diretamente, sem infraestrutura
    - dimensao: Custo inicial
      valores:
      - Alto, com quatro projetos, interfaces e repositórios
      - Baixo, com uma pasta por funcionalidade
  - tipo: conceito
    titulo: Camada técnica ou caso de uso
    texto: Na Clean Architecture, o código de um recurso se distribui por camadas e a dependência aponta da API para o domínio. Na Vertical Slice, o código de um caso de uso fica junto e depende apenas do agregado e das interfaces de repositório do contexto.
    analogia: O Catálogo funciona como uma fábrica organizada por setores, em que cada pedido passa por todos os setores. Pedidos funciona como uma oficina por encomenda, em que cada bancada monta um produto completo.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Caminho de uma requisição em cada contexto
    mermaid: "flowchart LR\n    subgraph Catálogo\n        A[ProdutoEndpoints] --> B[ProdutoService]\n        B --> C[IProdutoCommandRepository]\n        C --> D[(EF Core)]\n    end\n    subgraph Pedidos\n        E[CancelPedidoEndpoint] --> F[CancelPedidoHandler]\n        F --> G[IPedidoCommandRepository]\n        F --> H[Pedido.Cancelar]\n        G --> I[(EF Core)]\n    end"
  - tipo: adr
    id: ADR-0001
    titulo: Coexistência de Clean Architecture e Vertical Slice Architecture
    status: accepted
    contexto: Os engenheiros lidam com domínios de complexidade variada, e o projeto precisava escolher o padrão de base.
    decisao: Coexistência intencional dos dois padrões em contextos distintos, com Pedidos em Vertical Slice e Catálogo em Clean Architecture.
    alternativas: Vertical Slice para toda a aplicação e Clean Architecture para toda a aplicação, descartadas porque impediriam a comparação lado a lado.
    consequencias: A comparação em contexto real é o ganho principal, e a carga cognitiva para novos contribuidores aumenta.
  - tipo: adr
    id: ADR-0011
    titulo: Arquitetura híbrida no Catálogo
    status: accepted
    contexto: O Catálogo passou a ter cinco recursos com regras de domínio ricas, e a estrutura plana anterior não escalava.
    decisao: Domain, Application e Infrastructure em Clean Architecture, com a camada de API no estilo Vertical Slice, descrita na ADR como um arquivo por endpoint. No código do commit de referência, cada arquivo de `Endpoints/` reúne os endpoints de um recurso.
    alternativas: Clean Architecture pura, com alto custo para endpoints simples, e Vertical Slice pura, com duplicação de domínio.
    consequencias: Domínio e aplicação são reutilizados por todos os endpoints, ao custo de mais arquivos e do risco de mistura de responsabilidades.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, a fatia de cancelamento dos Pedidos, que serve de modelo para a fatia nova, e o mecanismo que registra os endpoints e os handlers. Clique nos marcadores numerados para ler a explicação de cada linha.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
    commit: 702145a
    linhas:
    - using ProdutosAPI.Shared.Common;
    - using ProdutosAPI.Pedidos.Common;
    - using ProdutosAPI.Pedidos.Repositories;
    - ''
    - namespace ProdutosAPI.Pedidos.CancelPedido;
    - ''
    - public record CancelPedidoRequest(string Motivo);
    - ''
    - public record CancelPedidoCommand(int PedidoId, string Motivo);
    - ''
    - public class CancelPedidoHandler(IPedidoCommandRepository repository)
    - '{'
    - '    public async Task<Result<PedidoResponse>> HandleAsync('
    - '        CancelPedidoCommand cmd, CancellationToken ct = default)'
    - '    {'
    - '        var pedido = await repository.ObterPorIdAsync(cmd.PedidoId, ct);'
    - ''
    - '        if (pedido is null)'
    - '            return Result<PedidoResponse>.Fail("Pedido não encontrado.");'
    - ''
    - '        var resultado = pedido.Cancelar(cmd.Motivo);'
    - '        if (!resultado.IsSuccess)'
    - '            return Result<PedidoResponse>.Fail(resultado.Error!);'
    - ''
    - '        await repository.SaveChangesAsync(ct);'
    - '        return Result<PedidoResponse>.Ok(PedidoResponse.From(pedido));'
    - '    }'
    - '}'
    anotacoes:
    - linha: 16
      texto: O handler carrega o agregado pelo repositório de escrita, implementado com EF Core.
    - linha: 21
      texto: A regra de negócio fica no agregado, e o handler apenas repassa o `Result`.
    - linha: 25
      texto: A gravação acontece só depois que a regra aceitou a operação.

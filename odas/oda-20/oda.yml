      sucesso: '`Aprovado: 3` e `Com falha: 0` (ou `Passed: 3` em sistema configurado em inglês).'
    - titulo: Criar o comando e o handler da fatia
      texto: Crie a pasta `src/Pedidos/ConfirmarPedido/` e o arquivo abaixo.

id: '20'
titulo: Vertical Slice e comparativo com Clean Architecture
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O agregado `Pedido` já tem o método `Confirmar()`, com três regras de negócio, mas a API não expõe essa operação. Nesta ODA, a confirmação de pedido é implementada como uma nova fatia vertical, depois de comparar a organização de Pedidos com a do Catálogo.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Diferenciar a organização por camada técnica, usada no Catálogo, da organização por caso de uso, usada em Pedidos.
    - Rastrear o caminho de uma requisição de cancelamento de pedido, do endpoint ao agregado.
    - Comparar o custo de uma mudança nos dois padrões a partir do quadro de `docs/01-ARQUITETURA.md`.
    - Implementar o caso de uso de confirmação de pedido como uma nova fatia vertical, com teste de integração.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários o .NET 10 SDK, como indica o README do repositório, e o Git. O laboratório usa o repositório `arkhibr/net-minimal-api` no commit `702145a`.
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende. A versão exibida é a da máquina em que a ODA foi produzida.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: O repositório reúne três bounded contexts na mesma API .NET 10, cada um organizado por um padrão diferente. Clique nas pastas para ver a responsabilidade de cada uma.
  - tipo: arvores
    esquerda:
      titulo: Catálogo · Clean Architecture híbrida
      nos:
      - caminho: src/Catalogo/
        descricao: Bounded context dividido em quatro subprojetos, um por camada técnica.
      - caminho: src/Catalogo/Catalogo.Domain/
        descricao: Entidades e value objects, sem dependência de outras camadas.
      - caminho: src/Catalogo/Catalogo.Domain/Produto.cs
        descricao: Entidade com método de fábrica `Produto.Criar` que aplica as regras do produto.
      - caminho: src/Catalogo/Catalogo.Application/
        descricao: Serviços de aplicação, DTOs, validadores e interfaces de repositório.
      - caminho: src/Catalogo/Catalogo.Application/Services/ProdutoService.cs
        descricao: Orquestra a criação e a consulta de produtos para vários endpoints.
      - caminho: src/Catalogo/Catalogo.Infrastructure/
        descricao: Implementações dos repositórios, com EF Core na escrita e Dapper na leitura.
      - caminho: src/Catalogo/Catalogo.Infrastructure/Repositories/EfProdutoCommandRepository.cs
        descricao: Grava produtos com EF Core.
      - caminho: src/Catalogo/Catalogo.API/
        descricao: Endpoints da Minimal API, um arquivo por grupo de recursos.
      - caminho: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
        descricao: Mapeia as rotas de produto e valida a entrada com FluentValidation.
    direita:
      titulo: Pedidos · Vertical Slice
      nos:
      - caminho: src/Pedidos/
        descricao: Bounded context organizado por caso de uso, com uma pasta por operação.
      - caminho: src/Pedidos/CancelPedido/
        descricao: 'Fatia completa do cancelamento: comando, handler e endpoint juntos.'
      - caminho: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
        descricao: Comando e handler que carregam o agregado e aplicam a regra.
      - caminho: src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs
        descricao: Rota da fatia, com tradução do `Result` em código HTTP.
      - caminho: src/Pedidos/CreatePedido/
        descricao: Fatia de criação, com o próprio validador.
      - caminho: src/Pedidos/Domain/
        descricao: Agregado `Pedido` compartilhado pelas fatias do contexto.
      - caminho: src/Pedidos/Domain/Pedido.cs
        descricao: Regras de `Confirmar()` e `Cancelar()`, que devolvem `Result` sem lançar exceção.
      - caminho: src/Pedidos/Repositories/
        descricao: Interfaces de escrita (EF Core) e de leitura (Dapper) usadas pelas fatias.
  - tipo: comparativo
    colunas:
    - Catálogo (Clean Architecture)
    - Pedidos (Vertical Slice)
    linhas:
    - dimensao: Localização de um novo endpoint
      valores:
      - Quatro subprojetos diferentes
      - Uma pasta isolada
    - dimensao: Acréscimo de um campo
      valores:
      - Domain, Application (DTO, validador e serviço), Infrastructure e API
      - Domain e a fatia específica
    - dimensao: Tratamento de erro
      valores:
      - Exceção e middleware global
      - Padrão `Result`, sem exceção para erro de negócio
    - dimensao: Teste unitário
      valores:
      - Serviço testado com repositório substituído
      - Agregado testado diretamente, sem infraestrutura
    - dimensao: Custo inicial
      valores:
      - Alto, com quatro projetos, interfaces e repositórios
      - Baixo, com uma pasta por funcionalidade
  - tipo: conceito
    titulo: Camada técnica ou caso de uso
    texto: Na Clean Architecture, o código de um recurso se distribui por camadas e a dependência aponta da API para o domínio. Na Vertical Slice, o código de um caso de uso fica junto e depende apenas do agregado e das interfaces de repositório do contexto.
    analogia: O Catálogo funciona como uma fábrica organizada por setores, em que cada pedido passa por todos os setores. Pedidos funciona como uma oficina por encomenda, em que cada bancada monta um produto completo.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Caminho de uma requisição em cada contexto
    mermaid: "flowchart LR\n    subgraph Catálogo\n        A[ProdutoEndpoints] --> B[ProdutoService]\n        B --> C[IProdutoCommandRepository]\n        C --> D[(EF Core)]\n    end\n    subgraph Pedidos\n        E[CancelPedidoEndpoint] --> F[CancelPedidoHandler]\n        F --> G[IPedidoCommandRepository]\n        F --> H[Pedido.Cancelar]\n        G --> I[(EF Core)]\n    end"
  - tipo: adr
    id: ADR-0001
    titulo: Coexistência de Clean Architecture e Vertical Slice Architecture
    status: accepted
    contexto: Os engenheiros lidam com domínios de complexidade variada, e o projeto precisava escolher o padrão de base.
    decisao: Coexistência intencional dos dois padrões em contextos distintos, com Pedidos em Vertical Slice e Catálogo em Clean Architecture.
    alternativas: Vertical Slice para toda a aplicação e Clean Architecture para toda a aplicação, descartadas porque impediriam a comparação lado a lado.
    consequencias: A comparação em contexto real é o ganho principal, e a carga cognitiva para novos contribuidores aumenta.
  - tipo: adr
    id: ADR-0011
    titulo: Arquitetura híbrida no Catálogo
    status: accepted
    contexto: O Catálogo passou a ter cinco recursos com regras de domínio ricas, e a estrutura plana anterior não escalava.
    decisao: Domain, Application e Infrastructure em Clean Architecture, com a camada de API no estilo Vertical Slice, descrita na ADR como um arquivo por endpoint. No código do commit de referência, cada arquivo de `Endpoints/` reúne os endpoints de um recurso.
    alternativas: Clean Architecture pura, com alto custo para endpoints simples, e Vertical Slice pura, com duplicação de domínio.
    consequencias: Domínio e aplicação são reutilizados por todos os endpoints, ao custo de mais arquivos e do risco de mistura de responsabilidades.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo são do commit `702145a`. Clique nos marcadores numerados para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
    commit: 702145a
    linhas:
    - using ProdutosAPI.Shared.Common;
    - using ProdutosAPI.Pedidos.Common;
    - using ProdutosAPI.Pedidos.Repositories;
    - ''
    - namespace ProdutosAPI.Pedidos.CancelPedido;
    - ''
    - public record CancelPedidoRequest(string Motivo);
    - ''
    - public record CancelPedidoCommand(int PedidoId, string Motivo);
    - ''
    - public class CancelPedidoHandler(IPedidoCommandRepository repository)
    - '{'
    - '    public async Task<Result<PedidoResponse>> HandleAsync('
    - '        CancelPedidoCommand cmd, CancellationToken ct = default)'
    - '    {'
    - '        var pedido = await repository.ObterPorIdAsync(cmd.PedidoId, ct);'
    - ''
    - '        if (pedido is null)'
    - '            return Result<PedidoResponse>.Fail("Pedido não encontrado.");'
    - ''
    - '        var resultado = pedido.Cancelar(cmd.Motivo);'
    - '        if (!resultado.IsSuccess)'
    - '            return Result<PedidoResponse>.Fail(resultado.Error!);'
    - ''
    - '        await repository.SaveChangesAsync(ct);'
    - '        return Result<PedidoResponse>.Ok(PedidoResponse.From(pedido));'
    - '    }'
    - '}'
    anotacoes:
    - linha: 16
      texto: O handler carrega o agregado pelo repositório de escrita, implementado com EF Core.
    - linha: 21
      texto: A regra de negócio fica no agregado, e o handler apenas repassa o `Result`.
    - linha: 25
      texto: A gravação acontece só depois que a regra aceitou a operação.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs
    commit: 702145a
    linhas:
    - using ProdutosAPI.Shared.Common;
    - using ProdutosAPI.Pedidos.Common;
    - ''
    - namespace ProdutosAPI.Pedidos.CancelPedido;
    - ''
    - 'public class CancelPedidoEndpoint : IEndpoint'
    - '{'
    - '    public void MapEndpoints(IEndpointRouteBuilder app)'
    - '    {'
    - '        app.MapPost("/api/v1/pedidos/{id:int}/cancelar", async ('
    - '            int id,'
    - '            CancelPedidoRequest request,'
    - '            CancelPedidoHandler handler,'
    - '            CancellationToken ct) =>'
    - '        {'
    - '            var cmd = new CancelPedidoCommand(id, request.Motivo);'
    - '            var result = await handler.HandleAsync(cmd, ct);'
    - ''
    - '            if (!result.IsSuccess)'
    - '            {'
    - '                return result.Error!.Contains("não encontrado", StringComparison.OrdinalIgnoreCase)'
    - '                    ? Results.NotFound(new { error = result.Error })'
    - '                    : Results.BadRequest(new { error = result.Error });'
    - '            }'
    - '            return Results.Ok(result.Value);'
    - '        })'
    - '        .WithName("CancelarPedido")'
    - '        .WithTags("Pedidos")'
    - '        .WithSummary("Cancelar pedido")'
    - '        .Produces<PedidoResponse>(StatusCodes.Status200OK)'
    - '        .Produces(StatusCodes.Status400BadRequest)'
    - '        .Produces(StatusCodes.Status404NotFound)'
    - '        .RequireAuthorization();'
    - '    }'
    - '}'
    anotacoes:
    - linha: 13
      texto: O handler vem do contêiner de injeção de dependência, porque está registrado em `Program.cs`.
    - linha: 21
      texto: A escolha entre 404 e 400 depende do texto da mensagem de erro de domínio.
    - linha: 33
      texto: Sem esta linha, o endpoint executa sem token. A aba Diagnóstico mostra o efeito.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Common/IEndpoint.cs
    commit: 702145a
    linhas:
    - namespace ProdutosAPI.Shared.Common;
    - ''
    - public interface IEndpoint
    - '{'
    - '    void MapEndpoints(IEndpointRouteBuilder app);'
    - '}'
    anotacoes:
    - linha: 5
      texto: Cada fatia implementa este contrato para declarar as próprias rotas.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Common/EndpointExtensions.cs
    commit: 702145a
    linhas:
    - '    public static WebApplication MapRegisteredEndpoints(this WebApplication app)'
    - '    {'
    - '        var endpoints = app.Services.GetServices<IEndpoint>();'
    - '        foreach (var endpoint in endpoints)'
    - '            endpoint.MapEndpoints(app);'
    - ''
    - '        return app;'
    - '    }'
    anotacoes:
    - linha: 32
      texto: Recupera todos os endpoints registrados por `AddEndpointsFromAssembly`.
    - linha: 34
      texto: Cada fatia mapeia a própria rota na inicialização da API.
    inicio: 30
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - // Handlers dos slices de Pedidos
    - builder.Services.AddScoped<CreatePedidoHandler>();
    - builder.Services.AddScoped<GetPedidoHandler>();
    - builder.Services.AddScoped<ListPedidosHandler>();
    - builder.Services.AddScoped<AddItemHandler>();
    - builder.Services.AddScoped<CancelPedidoHandler>();
    anotacoes:
    - linha: 99
      texto: Os handlers são registrados um a um, enquanto os endpoints são descobertos por reflexão.
    inicio: 94
  - tipo: faixa
    estilo: dica
    texto: A fatia nova precisa de uma linha em `Program.cs` para o handler, mas não precisa registrar a rota, que é descoberta pela implementação de `IEndpoint`.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Percorra os dois fluxos etapa por etapa e depois envie requisições pelo console de API. Os códigos de status vêm da execução dos testes de integração do repositório.
  - tipo: fluxo
    titulo: Cancelamento em Pedidos (Vertical Slice)
    etapas:
    - titulo: Descoberta dos endpoints
      descricao: Na inicialização, `AddEndpointsFromAssembly` procura no assembly todas as classes concretas que implementam `IEndpoint` e registra cada uma no contêiner.
      codigo:
        arquivo: Program.cs
        commit: 702145a
        linhas:
        - // Registrar slices de Pedidos via scan automático
        - builder.Services.AddEndpointsFromAssembly(typeof(Program).Assembly);
        destaque:
        - 2
    - titulo: Mapeamento da rota
      descricao: '`MapRegisteredEndpoints` obtém os endpoints registrados e chama `MapEndpoints` de cada um, e é assim que `CancelPedidoEndpoint` declara a rota de cancelamento.'
      codigo:
        arquivo: src/Shared/Common/EndpointExtensions.cs
        commit: 702145a
        linhas:
        - var endpoints = app.Services.GetServices<IEndpoint>();
        - foreach (var endpoint in endpoints)
        - '    endpoint.MapEndpoints(app);'
        destaque:
        - 3
    - titulo: Vinculação dos parâmetros
      descricao: A Minimal API lê `id` da rota, `request` do corpo JSON e obtém `CancelPedidoHandler` do contêiner, porque o tipo está registrado como serviço.
      codigo:
        arquivo: src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs
        commit: 702145a
        linhas:
        - app.MapPost("/api/v1/pedidos/{id:int}/cancelar", async (
        - '    int id,'
        - '    CancelPedidoRequest request,'
        - '    CancelPedidoHandler handler,'
        - '    CancellationToken ct) =>'
        destaque:
        - 2
        - 3
        - 4
    - titulo: Carga do agregado
      descricao: O handler busca o pedido pelo repositório de escrita e devolve falha quando o pedido não existe.
      codigo:
        arquivo: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
        commit: 702145a
        linhas:
        - var pedido = await repository.ObterPorIdAsync(cmd.PedidoId, ct);
        - ''
        - if (pedido is null)
        - '    return Result<PedidoResponse>.Fail("Pedido não encontrado.");'
        destaque:
        - 1
        - 3
        - 4
    - titulo: Regra de negócio no agregado
      descricao: '`Pedido.Cancelar` recusa pedido já cancelado e motivo vazio, e o handler repassa a falha sem lançar exceção.'
      codigo:
        arquivo: src/Pedidos/CancelPedido/CancelPedidoCommand.cs
        commit: 702145a
        linhas:
        - var resultado = pedido.Cancelar(cmd.Motivo);
        - if (!resultado.IsSuccess)
        - '    return Result<PedidoResponse>.Fail(resultado.Error!);'
        - ''
        - await repository.SaveChangesAsync(ct);
        destaque:
        - 1
        - 5
    - titulo: Tradução em resposta HTTP
      descricao: O endpoint converte a falha em 404 ou 400 conforme a mensagem e devolve 200 com o pedido quando a operação tem sucesso.
      codigo:
        arquivo: src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs
        commit: 702145a
        linhas:
        - if (!result.IsSuccess)
        - '{'
        - '    return result.Error!.Contains("não encontrado", StringComparison.OrdinalIgnoreCase)'
        - '        ? Results.NotFound(new { error = result.Error })'
        - '        : Results.BadRequest(new { error = result.Error });'
        - '}'
        - return Results.Ok(result.Value);
        destaque:
        - 3
        - 4
        - 5
        - 7
  - tipo: fluxo
    titulo: Criação de produto no Catálogo (Clean Architecture)
    etapas:
    - titulo: Registro dos serviços
      descricao: '`AddCatalogo` registra a interface do serviço de aplicação e as duas implementações de repositório, uma de escrita com EF Core e outra de leitura com Dapper.'
      codigo:
        arquivo: src/Catalogo/Catalogo.API/Extensions/CatalogoServiceExtensions.cs
        commit: 702145a
        linhas:
        - services.AddScoped<IProdutoService, ProdutoService>();
        - services.AddScoped<IProdutoQueryRepository, DapperProdutoQueryRepository>();
        - services.AddScoped<IProdutoCommandRepository, EfProdutoCommandRepository>();
        destaque:
        - 1
        - 3
    - titulo: Mapeamento da rota
      descricao: Em `Program.cs`, o grupo `/api/v1/catalogo` recebe as rotas de produto, e `ProdutoEndpoints` associa o `POST` ao método `CriarProduto`.
      codigo:
        arquivo: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
        commit: 702145a
        linhas:
        - var group = catalogoGroup.MapGroup("/produtos")
        - '    .WithTags("Catálogo - Produtos");'
        - ''
        - group.MapPost("/", CriarProduto).WithName("CriarProduto")
        destaque:
        - 1
        - 4
    - titulo: Validação na camada de API
      descricao: O endpoint valida a requisição com FluentValidation e responde 422 quando há erro de entrada, antes de chamar a aplicação.
      codigo:
        arquivo: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
        commit: 702145a
        linhas:
        - var validation = await validator.ValidateAsync(request);
        - if (!validation.IsValid)
        - '    return Results.UnprocessableEntity(new ErrorResponse'
        destaque:
        - 1
        - 3
    - titulo: Regra no domínio
      descricao: O serviço de aplicação cria a entidade pelo método de fábrica `Produto.Criar`, e uma falha de domínio vira exceção, tratada pelo middleware global.
      codigo:
        arquivo: src/Catalogo/Catalogo.Application/Services/ProdutoService.cs
        commit: 702145a
        linhas:
        - var resultado = Produto.Criar(
        - '    request.Nome, request.Descricao, request.Preco,'
        - '    request.Categoria, request.Estoque, request.ContatoEmail);'
        - if (!resultado.IsSuccess) throw new InvalidOperationException(resultado.Error);
        destaque:
        - 1
        - 4
    - titulo: Persistência na infraestrutura
      descricao: O serviço grava a entidade pela interface de escrita, implementada com EF Core na camada Infrastructure.
      codigo:
        arquivo: src/Catalogo/Catalogo.Application/Services/ProdutoService.cs
        commit: 702145a
        linhas:
        - var produto = await _commandRepo.AdicionarAsync(resultado.Value!);
        - '_logger.LogInformation("Produto criado. ID: {ProductId}", produto.Id);'
        - return _mapper.Map<ProdutoResponse>(produto);
        destaque:
        - 1
    - titulo: Resposta HTTP
      descricao: O endpoint devolve 201 com o endereço do novo recurso e o DTO montado pelo AutoMapper.
      codigo:
        arquivo: src/Catalogo/Catalogo.API/Endpoints/Produtos/ProdutoEndpoints.cs
        commit: 702145a
        linhas:
        - var produto = await service.CriarProdutoAsync(request);
        - return Results.Created($"/api/v1/catalogo/produtos/{produto.Id}", produto);
        destaque:
        - 2
  - tipo: console-api
    cenarios:
    - rotulo: Cancelar pedido inexistente
      requisicao:
        metodo: POST
        url: /api/v1/pedidos/99999/cancelar
        cabecalhos: &id001
          Authorization: Bearer <token obtido em /api/v1/auth/login>
          Content-Type: application/json
        corpo:
          motivo: Teste
      resposta:
        status: 404
        corpo:
          error: Pedido não encontrado.
      origem: codigo
      nota: O corpo foi montado a partir de `CancelPedidoEndpoint.cs`. O código 404 foi confirmado na execução do teste `POST_Cancelar_PedidoInexistente_Retorna404`.
    - rotulo: Cancelar sem motivo
      requisicao:
        metodo: POST
        url: /api/v1/pedidos/<id>/cancelar
        cabecalhos: *id001
        corpo:
          motivo: ''
      resposta:
        status: 400
        corpo:
          error: Motivo do cancelamento é obrigatório.
      origem: codigo
      nota: O corpo foi montado a partir de `Pedido.Cancelar`. O código 400 foi confirmado na execução do teste `POST_Cancelar_SemMotivo_Retorna400`.
    - rotulo: Cancelar com motivo
      requisicao:
        metodo: POST
        url: /api/v1/pedidos/<id>/cancelar
        cabecalhos: *id001
        corpo:
          motivo: Desistência do cliente
      resposta:
        status: 200
        corpo:
          status: Cancelado
          motivoCancelamento: Desistência do cliente
      origem: executado
      nota: Resposta resumida aos campos conferidos pelo teste `POST_Cancelar_ComMotivo_Retorna200ECancela`, que confirmou o código 200, o status e o motivo.
    - rotulo: Cancelar sem token
      requisicao:
        metodo: POST
        url: /api/v1/pedidos/99999/cancelar
        cabecalhos:
          Content-Type: application/json
        corpo:
          motivo: Teste
      resposta:
        status: 401
      origem: codigo
      nota: O endpoint declara `.RequireAuthorization()`. O mesmo comportamento foi executado na fatia de confirmação, com resposta 401.
  - tipo: classificador
    enunciado: Associe cada arquivo à forma de organização a que ele pertence.
    categorias:
    - id: camada
      rotulo: Camada do Catálogo
    - id: fatia
      rotulo: Fatia de Pedidos
    - id: compartilhado
      rotulo: Infraestrutura compartilhada
    itens:
    - texto: '`src/Catalogo/Catalogo.Application/Services/ProdutoService.cs`'
      categoria: camada
      explicacao: O serviço de aplicação pertence à camada Application do Catálogo e atende vários endpoints.
    - texto: '`src/Catalogo/Catalogo.Infrastructure/Queries/DapperProdutoQueryRepository.cs`'
      categoria: camada
      explicacao: O repositório de leitura com Dapper fica na camada Infrastructure.
    - texto: '`src/Catalogo/Catalogo.Domain/ValueObjects/SKU.cs`'
      categoria: camada
      explicacao: O value object pertence à camada Domain do Catálogo.
    - texto: '`src/Pedidos/CancelPedido/CancelPedidoEndpoint.cs`'
      categoria: fatia
      explicacao: O endpoint fica dentro da pasta do caso de uso de cancelamento.
    - texto: '`src/Pedidos/CreatePedido/CreatePedidoValidator.cs`'
      categoria: fatia
      explicacao: O validador fica junto ao comando e ao endpoint da fatia de criação.
    - texto: '`src/Pedidos/ListPedidos/ListPedidosQuery.cs`'
      categoria: fatia
      explicacao: A consulta pertence à fatia de listagem.
    - texto: '`src/Shared/Common/IEndpoint.cs`'
      categoria: compartilhado
      explicacao: O contrato de auto-registro é usado por todas as fatias.
    - texto: '`src/Shared/Middleware/IdempotencyMiddleware.cs`'
      categoria: compartilhado
      explicacao: O middleware de idempotência atua sobre todas as requisições, independentemente do contexto.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no seu computador ou no terminal simulado abaixo. O passo 7 altera o resultado dos testes no terminal simulado, como acontece no projeto real.
  - tipo: passos
    itens:
    - titulo: Clonar o repositório no commit de referência
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
        - git checkout 702145a
    - titulo: Confirmar o ambiente com os testes de cancelamento
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter CancelPedidoTests
      sucesso: '`Aprovado: 3` e `Com falha: 0` (ou `Passed: 3` em sistema configurado em inglês).'
    - titulo: Criar o comando e o handler da fatia
      texto: Crie a pasta `src/Pedidos/ConfirmarPedido/` e o arquivo abaixo.
      editor:
        rotulo: arquivo
        caminho: src/Pedidos/ConfirmarPedido/ConfirmarPedidoCommand.cs (novo)
        commit: 702145a
        linhas:
        - using ProdutosAPI.Shared.Common;
        - using ProdutosAPI.Pedidos.Common;
        - using ProdutosAPI.Pedidos.Repositories;
        - ''
        - namespace ProdutosAPI.Pedidos.ConfirmarPedido;
        - ''
        - public record ConfirmarPedidoCommand(int PedidoId);
        - ''
        - public class ConfirmarPedidoHandler(IPedidoCommandRepository repository)
        - '{'
        - '    public async Task<Result<PedidoResponse>> HandleAsync('
        - '        ConfirmarPedidoCommand cmd, CancellationToken ct = default)'
        - '    {'
        - '        var pedido = await repository.ObterPorIdAsync(cmd.PedidoId, ct);'
        - ''
        - '        if (pedido is null)'
        - '            return Result<PedidoResponse>.Fail("Pedido não encontrado.");'
        - ''
        - '        var resultado = pedido.Confirmar();'
        - '        if (!resultado.IsSuccess)'
        - '            return Result<PedidoResponse>.Fail(resultado.Error!);'
        - ''
        - '        await repository.SaveChangesAsync(ct);'
        - '        return Result<PedidoResponse>.Ok(PedidoResponse.From(pedido));'
        - '    }'
        - '}'
    - titulo: Criar o endpoint da fatia
      texto: O endpoint segue o padrão do cancelamento, sem corpo na requisição.
      editor:
        rotulo: arquivo
        caminho: src/Pedidos/ConfirmarPedido/ConfirmarPedidoEndpoint.cs (novo)
        commit: 702145a
        linhas:
        - using ProdutosAPI.Shared.Common;
        - using ProdutosAPI.Pedidos.Common;
        - ''
        - namespace ProdutosAPI.Pedidos.ConfirmarPedido;
        - ''
        - 'public class ConfirmarPedidoEndpoint : IEndpoint'
        - '{'
        - '    public void MapEndpoints(IEndpointRouteBuilder app)'
        - '    {'
        - '        app.MapPost("/api/v1/pedidos/{id:int}/confirmar", async ('
        - '            int id,'
        - '            ConfirmarPedidoHandler handler,'
        - '            CancellationToken ct) =>'
        - '        {'
        - '            var result = await handler.HandleAsync(new ConfirmarPedidoCommand(id), ct);'
        - ''
        - '            if (!result.IsSuccess)'
        - '            {'
        - '                return result.Error!.Contains("não encontrado", StringComparison.OrdinalIgnoreCase)'
        - '                    ? Results.NotFound(new { error = result.Error })'
        - '                    : Results.BadRequest(new { error = result.Error });'
        - '            }'
        - '            return Results.Ok(result.Value);'
        - '        })'
        - '        .WithName("ConfirmarPedido")'
        - '        .WithTags("Pedidos")'
        - '        .WithSummary("Confirmar pedido")'
        - '        .Produces<PedidoResponse>(StatusCodes.Status200OK)'
        - '        .Produces(StatusCodes.Status400BadRequest)'
        - '        .Produces(StatusCodes.Status404NotFound)'
        - '        .RequireAuthorization();'
        - '    }'
        - '}'
    - titulo: Criar o teste de integração
      texto: O terceiro teste confere também a mensagem de domínio, para não aceitar um 400 produzido por outro motivo.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/Pedidos/ConfirmarPedidoTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using FluentAssertions;
        - using ProdutosAPI.Pedidos.Common;
        - using ProdutosAPI.Pedidos.CreatePedido;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration.Pedidos;
        - ''
        - 'public class ConfirmarPedidoTests : IClassFixture<ApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public ConfirmarPedidoTests(ApiFactory factory)'
        - '    {'
        - '        _client = factory.CreateClient();'
        - '    }'
        - ''
        - '    private async Task AuthenticateAsync()'
        - '    {'
        - '        var token = await AuthHelper.ObterTokenAsync(_client);'
        - '        _client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", token);'
        - '    }'
        - ''
        - '    private async Task<PedidoResponse> CriarPedidoAsync()'
        - '    {'
        - '        var create = await _client.PostAsJsonAsync("/api/v1/pedidos", new CreatePedidoCommand([new(1, 1)]));'
        - '        return (await create.Content.ReadFromJsonAsync<PedidoResponse>())!;'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Confirmar_PedidoInexistente_Retorna404()'
        - '    {'
        - '        await AuthenticateAsync();'
        - '        var response = await _client.PostAsync("/api/v1/pedidos/99999/confirmar", null);'
        - '        response.StatusCode.Should().Be(HttpStatusCode.NotFound);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Confirmar_PedidoEmRascunho_Retorna200EConfirma()'
        - '    {'
        - '        await AuthenticateAsync();'
        - '        var pedido = await CriarPedidoAsync();'
        - ''
        - '        var response = await _client.PostAsync($"/api/v1/pedidos/{pedido.Id}/confirmar", null);'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.OK);'
        - '        var confirmado = await response.Content.ReadFromJsonAsync<PedidoResponse>();'
        - '        confirmado!.Status.Should().Be("Confirmado");'
        - '        confirmado.ConfirmadoEm.Should().NotBeNull();'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Confirmar_DuasVezes_Retorna400()'
        - '    {'
        - '        await AuthenticateAsync();'
        - '        var pedido = await CriarPedidoAsync();'
        - '        await _client.PostAsync($"/api/v1/pedidos/{pedido.Id}/confirmar", null);'
        - ''
        - '        var response = await _client.PostAsync($"/api/v1/pedidos/{pedido.Id}/confirmar", null);'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.BadRequest);'
        - '        var corpo = await response.Content.ReadAsStringAsync();'
        - '        corpo.Should().Contain("Apenas pedidos em rascunho podem ser confirmados.");'
        - '    }'
        - '}'
    - titulo: Rodar os testes da fatia antes do registro
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter ConfirmarPedidoTests
      texto: 'O resultado esperado no commit de referência é `Com falha: 3`, com respostas 400 de corpo vazio.'
    - titulo: Registrar o handler em Program.cs
      texto: Acrescente `using ProdutosAPI.Pedidos.ConfirmarPedido;` no topo e a linha abaixo logo após o registro de `CancelPedidoHandler`.
      menu: Program.cs → bloco "Handlers dos slices de Pedidos"
      editor:
        rotulo: arquivo
        caminho: Program.cs (alteração)
        commit: 702145a
        linhas:
        - builder.Services.AddScoped<ConfirmarPedidoHandler>();
      efeito: handler_registrado
    - titulo: Rodar a fatia e a suíte completa
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter ConfirmarPedidoTests
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 3` para a fatia e `Aprovado: 146`, sem falhas, para a suíte.'

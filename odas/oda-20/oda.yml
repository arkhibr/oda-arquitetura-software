  - tipo: faixa
    estilo: erro
    sintoma: Todas as chamadas ao novo endpoint retornam 400 com corpo vazio, sem exceção na inicialização.
    causa: O handler não foi registrado. A Minimal API lê do corpo da requisição o parâmetro cujo tipo não é serviço registrado, e a ausência de corpo produz 400.

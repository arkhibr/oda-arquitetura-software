- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é expor a confirmação de pedido pela API como uma fatia vertical completa, porque a regra já existe no agregado e falta o caminho HTTP até ela, e mostrar o que uma fatia nova ainda exige do `Program.cs`. Os passos 1 e 2 clonam o repositório e conferem o ambiente, os passos 3 a 6 criam o comando, o handler, o endpoint e o teste, e os passos 7 e 8 registram o handler e rodam a suíte. O terminal simulado responde aos mesmos comandos, e o passo 7 muda o resultado dos testes como no projeto real.
  - tipo: faixa
    estilo: objetivo
    problema: O agregado `Pedido` tem o método `Confirmar()`, que confere o status, a existência de itens e o valor mínimo, mas nenhuma fatia de `src/Pedidos` expõe essa operação pela API. Uma fatia nova depende de duas peças que falham de formas diferentes, porque o endpoint é descoberto por reflection e o handler precisa ser registrado à mão no `Program.cs`.
    impacto: Sem a rota, o cliente não consegue tirar um pedido do status Rascunho. Se o handler não for registrado, a Minimal API tenta ler esse parâmetro do corpo e responde 400 com corpo vazio, e um teste que confere só o status aceita esse 400 como se fosse a regra de domínio.
    mecanismo: O laboratório cria a pasta `src/Pedidos/ConfirmarPedido/` com o comando, o handler e o endpoint no formato da fatia de cancelamento, com `.RequireAuthorization()` na rota. Três testes de integração, um deles conferindo a mensagem de domínio, são escritos antes do registro, e o handler entra no `Program.cs` com `AddScoped`.
    comprovacao: Antes do registro, os três testes da fatia falham com respostas 400 de corpo vazio, e depois dele passam, com a suíte `ProdutosAPI.Tests` em 146 aprovações e nenhuma falha. A comparação com o Catálogo fica registrada no caminho de cada requisição, na aba Simulação, e no quadro de `docs/01-ARQUITETURA.md`.

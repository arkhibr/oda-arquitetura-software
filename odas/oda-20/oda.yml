- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Cada incidente mostra uma saída real obtida durante a produção desta ODA. Escolha a causa para ver a explicação e a correção.
  - tipo: incidente
    titulo: Confirmação responde 400 quando o esperado é 200
    origem: executado
    saida: "  Com falha ProdutosAPI.Tests.Integration.Pedidos.ConfirmarPedidoTests.POST_Confirmar_PedidoEmRascunho_Retorna200EConfirma [18 ms]\n  Mensagem de erro:\n   Expected response.StatusCode to be HttpStatusCode.OK {value: 200}, but found HttpStatusCode.BadRequest {value: 400}."
    pergunta: Qual é a causa mais provável?
    correcao: Registrar `ConfirmarPedidoHandler` com `AddScoped` em `Program.cs`.
    alternativas:
    - texto: O token expirou.
      correta: false
      explicacao: Token ausente ou inválido gera 401.
    - texto: O handler não está registrado, e a Minimal API tenta ler o parâmetro do corpo da requisição.
      correta: true
      explicacao: Pela regra de precedência de vinculação, o parâmetro que não é serviço registrado é lido do corpo, e a falta de corpo gera 400.
    - texto: A rota não foi descoberta por `MapRegisteredEndpoints`.
      correta: false
      explicacao: Rota não mapeada responderia 404, e não 400.
    - texto: O pedido já estava confirmado.
      correta: false
      explicacao: Essa falha traria a mensagem de domínio no corpo, e o pedido foi criado no próprio teste.
  - tipo: incidente
    titulo: Endpoint responde sem token
    origem: executado
    saida: 'Chamada sem token a POST /api/v1/pedidos/99999/confirmar

      com .RequireAuthorization():  STATUS=401

      sem .RequireAuthorization():  STATUS=404'
    pergunta: Por que a chamada sem token não recebeu 401?
    correcao: Manter `.RequireAuthorization()` em todo endpoint de Pedidos, como nas fatias existentes.
    alternativas:
    - texto: O pedido 99999 não existe, e o 404 tem precedência sobre o 401.
      correta: false
      explicacao: A autenticação é verificada antes de o endpoint executar, e com a linha presente a resposta foi 401.
    - texto: O middleware de idempotência bloqueou a chamada.
      correta: false
      explicacao: O middleware de idempotência não produz 404.
    - texto: A linha `.RequireAuthorization()` foi omitida, e o endpoint executa sem autenticação.
      correta: true
      explicacao: Com a linha presente, a mesma chamada recebeu 401 no commit de referência.
  - tipo: incidente
    titulo: Teste aprovado com a fatia quebrada
    origem: executado
    saida: 'Com falha! – Com falha:     2, Aprovado:     1, Ignorado:     0, Total:     3, Duração: 765 ms - ProdutosAPI.Tests.dll (net10.0)'
    pergunta: Com o handler sem registro, o teste `POST_Confirmar_DuasVezes_Retorna400` passou. Por quê?
    correcao: Conferir também a mensagem de domínio no corpo da resposta, como no teste do laboratório.
    alternativas:
    - texto: O teste conferia apenas o código 400, e o 400 veio da falha de vinculação, e não da regra de domínio.
      correta: true
      explicacao: Depois do reforço com a mensagem `Apenas pedidos em rascunho podem ser confirmados.`, o teste passou a falhar sem o registro.
    - texto: O pedido realmente estava confirmado.
      correta: false
      explicacao: Sem o handler, nenhuma confirmação chegou a ser executada.
    - texto: O teste foi ignorado pelo filtro.
      correta: false
      explicacao: O resumo mostra 3 testes executados, com 1 aprovado.
  - tipo: incidente
    titulo: Testes que passam sem chamar a API
    origem: codigo
    rotulo_saida: log
    saida: "    [Fact]\n    public async Task PATCH_CancelPedido_WithValidReasonAndStatus_ShouldReturn204NoContent()\n    {\n        // Arrange\n        var pedidoId = 1;\n        var endpoint = $\"/api/v1/pedidos/{pedidoId}/cancelar\";\n\n        // Act - Futura implementação com HttpClient\n        var statusCode = 204;\n\n        // Assert\n        statusCode.Should().Be(204);\n    }"
    pergunta: O que está errado neste teste de `tests/Pedidos.Tests/Endpoints/CancelPedidoEndpointTests.cs`?
    correcao: Usar como modelo os testes de `tests/ProdutosAPI.Tests/Integration/Pedidos/`, que chamam a API em memória com `ApiFactory`.
    alternativas:
    - texto: O teste deveria usar `Assert.Equal`.
      correta: false
      explicacao: A biblioteca de asserção não muda o fato de que nada da API é exercitado.
    - texto: O teste atribui o código a uma variável e confere a própria variável, sem chamar a API.
      correta: true
      explicacao: Além disso, o teste descreve `PATCH` com 204, enquanto o endpoint real é `POST` e responde 200, 400 ou 404.
    - texto: Falta o atributo `[Fact]`.
      correta: false
      explicacao: O atributo está presente, e o teste é executado.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Qual afirmação diferencia corretamente as duas organizações do repositório?
      alternativas:
      - texto: Pedidos não tem domínio, porque cada fatia contém sua própria regra de negócio.
        correta: false
        explicacao: Pedidos tem o agregado `Pedido` em `src/Pedidos/Domain/`, compartilhado pelas fatias.
      - texto: O Catálogo não usa Vertical Slice em nenhuma parte.
        correta: false
        explicacao: A ADR-0011 organiza a camada de API do Catálogo no estilo Vertical Slice.
      - texto: O Catálogo distribui um recurso por camadas técnicas, e Pedidos agrupa tudo de um caso de uso numa pasta.
        correta: true
        explicacao: É a diferença registrada na ADR-0001 e no quadro de `docs/01-ARQUITETURA.md`.
    - enunciado: No cancelamento de um pedido inexistente, onde nasce a resposta 404?
      alternativas:
      - texto: No endpoint, que traduz a falha "Pedido não encontrado." devolvida pelo handler.
        correta: true
        explicacao: O handler retorna `Result.Fail` e o endpoint escolhe `Results.NotFound` pela mensagem.
      - texto: No agregado, que lança uma exceção capturada pelo middleware.
        correta: false
        explicacao: Pedidos usa o padrão `Result` e não lança exceção para erro de negócio.
      - texto: No repositório, que retorna 404 diretamente.
        correta: false
        explicacao: O repositório retorna `null`, e quem decide a resposta HTTP é o endpoint.
    - enunciado: Segundo o quadro de `docs/01-ARQUITETURA.md`, o que muda ao acrescentar um campo em cada contexto?
      alternativas:
      - texto: Em Pedidos a mudança exige alterar todas as fatias.
        correta: false
        explicacao: Somente a fatia afetada e o contrato de resposta comum mudam.
      - texto: No Catálogo a mudança atravessa Domain, Application, Infrastructure e API, e em Pedidos fica no domínio e na fatia afetada.
        correta: true
        explicacao: É a linha "Quando adicionar campo" do quadro comparativo.
      - texto: Nos dois contextos a mudança se limita ao domínio.
        correta: false
        explicacao: DTOs, validadores e respostas também mudam, em quantidade diferente em cada padrão.
    - enunciado: Depois de criar a fatia `ConfirmarPedido`, todas as chamadas retornam 400 com corpo vazio. Qual é a causa mais provável?
      alternativas:
      - texto: O endpoint não foi descoberto por `MapRegisteredEndpoints`.
        correta: false
        explicacao: Endpoint não mapeado responderia 404, e não 400.
      - texto: O pedido já estava confirmado.
        correta: false
        explicacao: Essa falha traria a mensagem de domínio no corpo, e o corpo está vazio.
      - texto: O handler não foi registrado no contêiner, e a Minimal API tenta ler o parâmetro do corpo da requisição.
        correta: true
        explicacao: A regra de precedência lê do corpo o parâmetro que não é serviço registrado, e a falta de corpo gera 400.
    - enunciado: Pela precedência de vinculação da Minimal API, de onde vem um parâmetro de tipo complexo que não está registrado como serviço?
      alternativas:
      - texto: Do corpo da requisição.
        correta: true
        explicacao: É a regra 6 da seção "Binding Precedence" da documentação da Microsoft, depois da verificação de serviço registrado.
      - texto: Da query string.
        correta: false
        explicacao: A query string é usada para tipos simples, como string ou tipos com `TryParse`.
      - texto: Do contêiner, que cria a instância automaticamente.
        correta: false
        explicacao: O contêiner só fornece tipos registrados.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A fatia `ConfirmarPedido` foi criada com comando, handler e endpoint.
    - O handler foi registrado em `Program.cs`.
    - Os 3 testes de confirmação passam.
    - A suíte `ProdutosAPI.Tests` passa com 146 testes.
    - As diferenças entre Catálogo e Pedidos estão claras.

id: '21'
titulo: 'DDD tático: domínio rico seletivo, value objects e agregado'
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é decidir onde vale a pena modelar regras no próprio domínio e garantir que um agregado proteja essas regras em qualquer sequência de operações, porque uma invariante conferida só na parcela nova deixa o sistema vender mais do que tem em estoque. O caso de estudo é o pedido da API `net-minimal-api`, que aceita oito unidades de um produto com estoque cinco quando elas chegam em duas chamadas de quatro. Você vai reproduzir a falha pela API e corrigi-la dentro do agregado, com um teste de unidade escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: DDD (Domain-Driven Design)
      definicao: Abordagem de projeto de software que organiza o código em torno do modelo do negócio e da linguagem usada pelos especialistas do domínio. A parte tática do DDD trata dos blocos de construção desse modelo, como entidade, value object e agregado.
      referencia:
        rotulo: Microsoft Learn · Criando um modelo de domínio de microsserviço
        url: https://learn.microsoft.com/pt-br/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-domain-model
    - termo: Agregado e raiz do agregado
      definicao: Agregado é um grupo de objetos do domínio tratado como uma unidade de consistência, e a raiz é o único objeto do grupo que o código de fora pode chamar. O `Pedido` é a raiz do agregado de pedido, e os `PedidoItem` só mudam por meio dos métodos dele.
      referencia:
        rotulo: martinfowler.com · DDD Aggregate
        url: https://martinfowler.com/bliki/DDD_Aggregate.html
    - termo: Invariante
      definicao: Regra de negócio que precisa valer depois de qualquer operação sobre o objeto, e não só na criação, como a quantidade de um item não passar do estoque disponível.
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, a decisão tomada, as alternativas descartadas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`, e esta ODA as usa como registro das escolhas que o código mostra.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: Domínio rico e domínio anêmico
      definicao: No domínio rico, as entidades guardam as regras de negócio nos próprios métodos. No domínio anêmico, elas só carregam dados, e as regras ficam em serviços, e a ADR-0015 do repositório escolhe domínio rico só para Produto, Categoria e Variante.
      referencia:
        rotulo: martinfowler.com · Anemic Domain Model
        url: https://martinfowler.com/bliki/AnemicDomainModel.html
    - termo: CRUD
      definicao: Sigla de Create, Read, Update e Delete, as quatro operações básicas sobre um registro. Um recurso tratado como CRUD só grava e lê dados, sem regras de domínio próprias, e a ADR-0015 trata assim os recursos Atributo e Mídia.
      referencia:
        rotulo: MDN · CRUD
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/CRUD
    - termo: Value object (objeto de valor)
      definicao: Objeto do domínio definido apenas pelo valor que carrega, sem identidade própria, e que valida esse valor na criação. No Catálogo, `PrecoProduto` e `EstoqueProduto` são value objects, e um preço inválido não chega a existir.
      referencia:
        rotulo: Microsoft Learn · Implementando objetos de valor
        url: https://learn.microsoft.com/pt-br/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/implement-value-objects
    - termo: Entidade
      definicao: Objeto do domínio que tem identidade própria, um `Id` que permanece o mesmo enquanto os outros dados mudam. `Produto` e `PedidoItem` são entidades no repositório.
    - termo: Fronteira de consistência
      definicao: Limite do que um agregado consegue garantir sozinho numa operação. Uma regra que envolve dois agregados, como pedidos diferentes disputando o mesmo estoque de `Produto`, fica fora da fronteira de cada um e precisa de outro mecanismo.
    - termo: '`sealed record`'
      definicao: Tipo C# que compara instâncias pelo valor dos campos, e o `sealed` impede que outras classes herdem dele. A ADR-0004 do repositório usa `sealed record` com construtor privado para os value objects.
      referencia:
        rotulo: Microsoft Learn · Tipos de registro em C#
        url: https://learn.microsoft.com/pt-br/dotnet/csharp/fundamentals/types/records
    - termo: Padrão Result (`Result` e `Result<T>`)
      definicao: Tipo de retorno que informa sucesso ou falha de forma explícita, com `IsSuccess`, o valor em caso de sucesso e a mensagem em `Error` em caso de falha. No repositório, `Result` e `Result<T>` são records definidos em `src/Shared/Common/Result.cs` e em `Catalogo.Domain/Common/Result.cs`, e a ADR-0003 registra o uso deles para erros de domínio.
    - termo: Reidratação (`Reconstituir`)
      definicao: Recriação de um objeto do domínio a partir dos dados já gravados no banco. Nos value objects do Catálogo, `Criar` serve para dados novos e `Reconstituir` é usado na leitura do banco.
    - termo: DataAnnotations
      definicao: Atributos do .NET, como `[Required]` e `[Range]`, que declaram regras de validação diretamente nas propriedades de uma classe. A ADR-0004 os cita como alternativa descartada aos value objects.
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional da Microsoft, que traduz classes C# em tabelas e consultas LINQ em SQL. No repositório, ele grava os dados no SQLite e atende as operações de escrita.
      referencia:
        rotulo: Microsoft Learn · Visão geral do Entity Framework Core
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: '`DbContext`'
      definicao: Classe do EF Core que representa a sessão com o banco, expõe as tabelas como `DbSet` e grava as mudanças com `SaveChanges`. No repositório, o `AppDbContext`, em `src/Shared/Data`, atende o Catálogo e os Pedidos.
    - termo: Teste de unidade
      definicao: Teste que exercita uma classe isolada, como o agregado `Pedido`, sem subir a API nem acessar o banco. Ele roda em milissegundos e aponta a regra exata que falhou.
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros de exemplo que a API grava no banco ao iniciar, pelo `DbSeeder` do Catálogo, para que haja produtos e categorias desde a primeira execução. Apagar o `produtos-api.db` faz a API recriar o banco com esses dados na próxima vez que subir.
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: Transação
      definicao: Conjunto de operações no banco que é gravado inteiro ou descartado inteiro, de modo que nenhum outro acesso veja o estado intermediário.
    - termo: Migrations
      definicao: Arquivos gerados pelo EF Core que descrevem, em C#, cada mudança no esquema do banco, para que ela seja aplicada de forma versionada. A API aplica as migrations pendentes ao iniciar, fora do ambiente de testes.
      referencia:
        rotulo: Microsoft Learn · Visão geral das migrações
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: Erros `CS0234`, `CS0246` e `MSB3030`
      definicao: 'Os códigos que começam com `CS` vêm do compilador C#: o `CS0234` indica que um namespace ou tipo não existe dentro do namespace citado, e o `CS0246` indica que um tipo não foi encontrado, em geral por falta de `using` ou de referência de projeto. O `MSB3030` vem do MSBuild e indica que um arquivo marcado para cópia não foi encontrado no momento da cópia.'
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Explicar por que a ADR-0015 dá domínio rico a Produto, Categoria e Variante e CRUD a Atributo e Mídia.
    - Reconhecer value object, entidade e agregado no código do Catálogo e dos Pedidos.
    - Encontrar uma invariante que o agregado não protege e reproduzi-la pela API.
    - Corrigir a invariante dentro do agregado, com o teste de unidade escrito antes.
    - Distinguir a regra que o agregado pode garantir da que exige outro agregado.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: O .NET SDK 10, o Git e o `curl`. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa dois terminais na raiz do repositório, um para a API e outro para as chamadas, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta os três blocos do DDD tático usados no código: value object, entidade e agregado, e o critério para decidir quando cada um compensa. No repositório, a ADR-0004 registra o formato dos value objects e a ADR-0015 registra a escolha recurso a recurso.'
  - tipo: comparativo
    colunas:
    - Value object
    - Entidade
    - Agregado
    linhas:
    - dimensao: Exemplo
      valores:
      - '`PrecoProduto`, `EstoqueProduto`'
      - '`Produto`, `PedidoItem`'
      - '`Pedido` com os seus `PedidoItem`'
    - dimensao: Identidade
      valores:
      - 'Nenhuma: igualdade pelo valor'
      - '`Id` próprio'
      - A raiz, `Pedido`, é a única porta de entrada
    - dimensao: Mudança
      valores:
      - 'Imutável: troca-se o valor'
      - Métodos com `Result`
      - Só pelos métodos da raiz, como `AdicionarItem`
    - dimensao: Regra que protege
      valores:
      - Preço maior que zero
      - Estoque não negativo
      - Até 20 itens, até 999 por item, estoque e status
  - tipo: conceito
    titulo: Invariante
    texto: Uma invariante é uma regra que precisa valer depois de qualquer operação, e não só na primeira. Quando o agregado confere a parcela nova e esquece o que já tinha, a regra vale na criação e falha na segunda chamada.
  - tipo: conceito
    titulo: Fronteira de consistência
    texto: O `Pedido` recebe o `Produto` para conferir o estoque, mas não muda o estoque do produto. Duas instâncias de `Pedido` podem, cada uma, caber no estoque e juntas ultrapassá-lo, porque essa regra atravessa dois agregados.
  - tipo: adr
    id: ADR-0004
    titulo: Value Objects como Sealed Records
    status: accepted
    contexto: Preço, categoria, estoque e descrição têm regras de validade próprias, e repeti-las em validadores, serviços e entidades duplicaria código.
    decisao: '`sealed record` com construtor privado, `Criar` que devolve `Result<T>` e `Reconstituir` para o EF Core.'
    alternativas: Tipos primitivos validados no serviço e DTOs com DataAnnotations.
    consequencias: Não há como criar um `PrecoProduto` inválido, ao custo de conversões explícitas no `AppDbContext`.
  - tipo: adr
    id: ADR-0015
    titulo: 'Domínio Rico Seletivo: Complexidade onde ela Importa'
    status: accepted
    contexto: Aplicar DDD completo aos cinco recursos do Catálogo seria complexidade desnecessária.
    decisao: Produto, Categoria e Variante com domínio rico, e Atributo e Mídia como CRUD.
    alternativas: DDD completo para todos e CRUD puro para todos.
    consequencias: Invariantes críticas protegidas no domínio, e regras que dependem do banco, como a hierarquia de categorias, ficam no serviço.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra onde cada regra está escrita, para que você localize a brecha antes do laboratório: um value object, a consulta de estoque do produto e o método `AdicionarItem` do agregado `Pedido`, no commit `702145a`. Clique nos marcadores para ler a explicação de cada linha.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.Domain/ValueObjects/PrecoProduto.cs
    commit: 702145a
    linhas:
    - public sealed record PrecoProduto
    - '{'
    - '    public const decimal Minimo = 0.01m;'
    - '    private PrecoProduto(decimal value) => Value = value;'
    - '    public decimal Value { get; }'
    - ''
    - '    public static Result<PrecoProduto> Criar(decimal value)'
    - '    {'
    - '        if (value < Minimo)'
    - '            return Result<PrecoProduto>.Fail("Preço deve ser maior que zero.");'
    - '        return Result<PrecoProduto>.Ok(new PrecoProduto(value));'
    - '    }'
    - ''
    - '    public static PrecoProduto Reconstituir(decimal value)'
    - '    {'
    - '        var result = Criar(value);'
    - '        if (!result.IsSuccess || result.Value is null)'
    - '            throw new InvalidOperationException(result.Error);'
    - '        return result.Value;'
    - '    }'
    anotacoes:
    - linha: 8
      texto: 'Construtor privado: só `Criar` e `Reconstituir` constroem.'
    - linha: 11
      texto: A validação devolve `Result`, sem exceção.
    - linha: 22
      texto: Na reidratação, um dado inválido no banco vira exceção.
    inicio: 5
    contexto: O `PrecoProduto.cs` é o value object de preço da camada de domínio do Catálogo, em `src/Catalogo/Catalogo.Domain/ValueObjects`. O trecho abaixo mostra o construtor privado e os dois caminhos de criação, o `Criar`, que devolve `Result` para entrada inválida, e o `Reconstituir`, que lança exceção quando o banco traz um valor inválido.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.Domain/Produto.cs
    commit: 702145a
    linhas:
    - '    public bool TemEstoqueDisponivel(int qtd) => Ativo && Estoque.Value >= qtd;'
    anotacoes:
    - linha: 136
      texto: Pergunta sobre uma quantidade, sem reservar nada.
    inicio: 136
    contexto: O `Produto.cs` é a entidade de produto do domínio do Catálogo, que guarda o estoque e o estado ativo. A linha abaixo é o `TemEstoqueDisponivel`, que só responde se há quantidade suficiente e não reserva nem baixa estoque.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/Domain/Pedido.cs
    commit: 702145a
    linhas:
    - '    public Result AdicionarItem(Produto produto, int quantidade)'
    - '    {'
    - '        if (Status != StatusPedido.Rascunho)'
    - '            return Result.Fail("Itens só podem ser adicionados a pedidos em rascunho.");'
    - ''
    - '        if (quantidade < 1 || quantidade > 999)'
    - '            return Result.Fail("Quantidade deve estar entre 1 e 999.");'
    - ''
    - '        if (!produto.TemEstoqueDisponivel(quantidade))'
    - '            return Result.Fail($"Produto ''{produto.Nome}'' sem estoque suficiente.");'
    - ''
    - '        var existente = _itens.FirstOrDefault(i => i.ProdutoId == produto.Id);'
    - '        if (existente is not null)'
    - '        {'
    - '            existente.IncrementarQuantidade(quantidade);'
    - '        }'
    - '        else'
    - '        {'
    - '            if (_itens.Count >= MaxItensPorPedido)'
    - '                return Result.Fail($"Pedido não pode ter mais de {MaxItensPorPedido} itens distintos.");'
    - ''
    - '            _itens.Add(PedidoItem.Criar(produto, quantidade));'
    - '        }'
    - ''
    - '        RecalcularTotal();'
    - '        return Result.Ok();'
    - '    }'
    anotacoes:
    - linha: 31
      texto: Limite conferido só para a parcela nova.
    - linha: 34
      texto: Estoque conferido só para a parcela nova.
    - linha: 40
      texto: A soma acontece depois das verificações.
    - linha: 44
      texto: Limite de itens distintos, protegido pela raiz.
    inicio: 26
    contexto: O `src/Pedidos/Domain/Pedido.cs` é o agregado de pedido, a raiz que controla os itens e o total do contexto de Pedidos. O trecho abaixo é o `AdicionarItem`, que confere o limite de quantidade e o estoque só para a parcela nova antes de somá-la a um item existente, e é nessa ordem que fica a brecha que o laboratório explora.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/Domain/PedidoItem.cs
    commit: 702145a
    linhas:
    - '    internal void IncrementarQuantidade(int adicional)'
    - '    {'
    - '        if (adicional <= 0)'
    - '            throw new InvalidOperationException("Quantidade adicional deve ser positiva.");'
    - '        if (Quantidade + adicional > 999)'
    - '            throw new InvalidOperationException("Quantidade máxima por item é 999.");'
    - '        Quantidade += adicional;'
    - '    }'
    anotacoes:
    - linha: 31
      texto: O item protege o limite com exceção, e não com `Result`.
    inicio: 26
    contexto: O `src/Pedidos/Domain/PedidoItem.cs` é a entidade de item do pedido, criada e alterada só pelo agregado `Pedido`. O trecho abaixo é o `IncrementarQuantidade`, que protege o limite de 999 unidades com exceção, um tratamento diferente do `Result` usado pelo agregado.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/Domain/Pedido.cs
    commit: 702145a
    linhas:
    - '    public Result Confirmar()'
    - '    {'
    - '        if (Status != StatusPedido.Rascunho)'
    - '            return Result.Fail("Apenas pedidos em rascunho podem ser confirmados.");'
    - ''
    - '        if (!_itens.Any())'
    - '            return Result.Fail("Pedido precisa ter ao menos um item.");'
    - ''
    - '        if (Total < ValorMinimoConfirmacao)'
    - '            return Result.Fail("Valor mínimo para confirmação é R$ 10,00.");'
    - ''
    - '        Status = StatusPedido.Confirmado;'
    - '        ConfirmadoEm = DateTime.UtcNow;'
    - '        return Result.Ok();'
    - '    }'
    anotacoes:
    - linha: 54
      texto: Confirmar não toca no estoque do produto.
    inicio: 54
    contexto: Este segundo trecho do agregado `Pedido` é o método `Confirmar`, que muda o pedido de rascunho para confirmado. Ele confere o status, a existência de itens e o valor mínimo, e não altera o estoque do produto.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: 'Esta aba simula, sem executar nada, o caminho de duas chamadas de quatro unidades por dentro do agregado, até o pedido terminar com oito unidades de um produto com estoque cinco. Depois, classifique cada regra do sistema pelo lugar em que ela deve ficar: value object, agregado, serviço com acesso ao banco ou nenhum, no caso dos recursos tratados como CRUD.'
  - tipo: fluxo
    titulo: Duas chamadas de quatro unidades, estoque cinco
    etapas:
    - titulo: Criação
      descricao: '`POST /api/v1/pedidos` com quatro unidades: `AdicionarItem` confere `4 ≤ 999` e `TemEstoqueDisponivel(4)`, e cria o item.'
    - titulo: Segunda chamada
      descricao: '`POST /api/v1/pedidos/1/itens` com mais quatro: as mesmas verificações valem para 4, e não para 8.'
    - titulo: Soma
      descricao: '`IncrementarQuantidade(4)` leva o item a 8, e `RecalcularTotal` dá R$ 36.000,00.'
    - titulo: Persistência
      descricao: O repositório grava o pedido com 8 unidades, e a resposta é 200.
    - titulo: Depois da correção
      descricao: A raiz calcula a quantidade final antes das regras, e a segunda chamada recebe 400 com `sem estoque suficiente`.
  - tipo: classificador
    enunciado: Pela ADR-0015 e pelo código, onde cada regra fica?
    categorias:
    - id: vo
      rotulo: Value object
    - id: agregado
      rotulo: Agregado ou entidade
    - id: servico
      rotulo: Serviço com banco
    - id: crud
      rotulo: 'Sem regra: CRUD'
    itens:
    - texto: Preço maior que zero
      categoria: vo
      explicacao: '`PrecoProduto.Criar`.'
    - texto: Até 20 itens distintos por pedido
      categoria: agregado
      explicacao: '`Pedido.MaxItensPorPedido`.'
    - texto: Categoria com no máximo dois níveis
      categoria: servico
      explicacao: A ADR-0015 registra que a regra precisa consultar o banco.
    - texto: Nome e valor de um atributo
      categoria: crud
      explicacao: Atributo é CRUD pela ADR-0015.
    - texto: Só pedidos em rascunho recebem itens
      categoria: agregado
      explicacao: Primeira verificação de `AdicionarItem`.
    - texto: Estoque não negativo
      categoria: vo
      explicacao: '`EstoqueProduto`.'
    - texto: URL e tipo de uma mídia
      categoria: crud
      explicacao: Mídia é CRUD pela ADR-0015.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer o agregado `Pedido` conferir estoque e limite de quantidade sobre a quantidade final do item, porque hoje ele confere cada parcela isolada e aceita um pedido acima do estoque. Os passos 1 e 2 sobem a API com o banco de exemplo e reproduzem a brecha por `curl`, os passos 3 a 6 escrevem os testes de unidade e corrigem `Pedido.AdicionarItem`, e o passo 7 repete as chamadas. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: Em `src/Pedidos/Domain/Pedido.cs`, o `AdicionarItem` confere o limite de 999 unidades e o estoque do produto só para a quantidade da parcela nova, e soma essa parcela ao item existente depois das verificações. Quando a soma passa de 999, quem a percebe é o `PedidoItem.IncrementarQuantidade`, que lança exceção fora do padrão `Result` usado pelo agregado.
    impacto: Duas chamadas de quatro unidades deixam o pedido com oito unidades de um produto com estoque cinco, e a API responde 200. A exceção do limite chegaria ao middleware de tratamento de exceções como 500, uma falha do servidor para um erro que é do cliente.
    mecanismo: Dois testes de unidade escritos antes conferem a soma contra o estoque e contra o limite de 999. A correção, feita na raiz do agregado, procura o item existente antes das regras e confere estoque e limite com a quantidade final, sem mudar o handler nem o endpoint.
    comprovacao: 'Antes da correção, os dois testes falham, um com `found True` e outro com `System.InvalidOperationException : Quantidade máxima por item é 999.`, e depois passam, com a suíte em 145 aprovações. Com a API reiniciada, a segunda chamada recebe 400 com `Produto ''Notebook Dell XPS 13'' sem estoque suficiente.`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir a API com o banco do seed
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db && dotnet run --launch-profile http
      sucesso: '`Now listening on: http://localhost:5000`.'
    - titulo: Pedir oito unidades em duas chamadas
      texto: Noutro terminal, obtenha o token, crie um pedido com quatro unidades do produto 1 e acrescente mais quatro.
      editor:
        rotulo: terminal
        linhas:
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":1,"quantidade":4}]}'' http://localhost:5000/api/v1/pedidos'
        - curl -s http://localhost:5000/api/v1/catalogo/produtos/1 | grep -o '"estoque":[0-9]*'
        - 'curl -s -w '' %{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"produtoId":1,"quantidade":4}'' http://localhost:5000/api/v1/pedidos/1/itens'
      sucesso: '`201`, `"estoque":5` e `"quantidade":8` com `200`.'
    - titulo: Escrever os testes das invariantes
      texto: Crie o arquivo abaixo, ao lado de `PedidoTests.cs`. Os dois testes conferem a soma no estoque e no limite de 999.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Unit/Domain/PedidoInvariantesTests.cs (novo)
        commit: 702145a
        linhas:
        - using FluentAssertions;
        - using ProdutosAPI.Pedidos.Domain;
        - using ProdutosAPI.Tests.Builders;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Unit.Domain;
        - ''
        - public class PedidoInvariantesTests
        - '{'
        - '    [Fact]'
        - '    public void AdicionarItem_MesmoProdutoDuasVezes_NaoUltrapassaOEstoque()'
        - '    {'
        - '        var produto = ProdutoBuilder.Padrao().ComEstoque(5).Build();'
        - '        var pedido = Pedido.Criar();'
        - '        pedido.AdicionarItem(produto, 4);'
        - ''
        - '        var resultado = pedido.AdicionarItem(produto, 4);'
        - ''
        - '        resultado.IsSuccess.Should().BeFalse();'
        - '        pedido.Itens.Single().Quantidade.Should().Be(4);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void AdicionarItem_SomaAcimaDe999_DevolveFalhaSemExcecao()'
        - '    {'
        - '        var produto = ProdutoBuilder.Padrao().ComEstoque(5000).Build();'
        - '        var pedido = Pedido.Criar();'
        - '        pedido.AdicionarItem(produto, 999);'
        - ''
        - '        var resultado = pedido.AdicionarItem(produto, 1);'
        - ''
        - '        resultado.IsSuccess.Should().BeFalse();'
        - '        pedido.Itens.Single().Quantidade.Should().Be(999);'
        - '    }'
        - '}'
      efeito: teste_invariantes
    - titulo: Ver os testes falharem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter PedidoInvariantesTests
      sucesso: '`Com falha: 2`, com `found True` e `System.InvalidOperationException : Quantidade máxima por item é 999.`'
    - titulo: Conferir a quantidade final
      texto: Em `AdicionarItem`, procure o item antes das regras e confira estoque e limite com a soma.
      editor:
        rotulo: arquivo
        caminho: src/Pedidos/Domain/Pedido.cs (alteração)
        commit: 702145a
        linhas:
        - '// src/Pedidos/Domain/Pedido.cs: em AdicionarItem, no lugar da verificação de estoque'
        - '        var existente = _itens.FirstOrDefault(i => i.ProdutoId == produto.Id);'
        - '        // As regras valem para a quantidade final do item, e não só para a parcela nova.'
        - '        var quantidadeFinal = (existente?.Quantidade ?? 0) + quantidade;'
        - '        if (quantidadeFinal > 999)'
        - '            return Result.Fail("Quantidade máxima por item é 999.");'
        - ''
        - '        if (!produto.TemEstoqueDisponivel(quantidadeFinal))'
        - '            return Result.Fail($"Produto ''{produto.Nome}'' sem estoque suficiente.");'
        - ''
        - '        if (existente is not null)'
      efeito: invariante_corrigida
    - titulo: Ver os testes passarem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter PedidoInvariantesTests
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 2` e `Aprovado: 145`.'
    - titulo: Repetir pela API
      texto: Reinicie a API e repita as chamadas do passo 2.
      editor:
        rotulo: terminal
        linhas:
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":1,"quantidade":4}]}'' http://localhost:5000/api/v1/pedidos'
        - 'curl -s -w '' %{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"produtoId":1,"quantidade":4}'' http://localhost:5000/api/v1/pedidos/1/itens'
      sucesso: '`{"error":"Produto ''Notebook Dell XPS 13'' sem estoque suficiente."}` com `400`.'

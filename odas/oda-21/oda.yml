- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria em produção com esse domínio, cada uma com a saída ou o trecho de código que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Pedido com mais unidades que o estoque
    origem: executado
    rotulo_saida: log
    saida: '$ estoque do produto 1

      "estoque":5


      $ mais quatro unidades no pedido 1, que já tinha quatro

      {"id":1,"status":"Rascunho","total":36000.0,"criadoEm":"2026-11-02T00:34:43.790497","confirmadoEm":null,"canceladoEm":null,"motivoCancelamento":null,"itens":[{"produtoId":1,"nomeProduto":"Notebook Dell XPS 13","precoUnitario":4500.0,"quantidade":8,"subtotal":36000.0}]} 200'
    pergunta: Cada chamada pediu quatro unidades de um produto com cinco. Por que o pedido ficou com oito?
    correcao: Conferir estoque e limite com a quantidade final do item, dentro do agregado, como no passo 5.
    alternativas:
    - texto: O endpoint de itens não passa pelo agregado.
      correta: false
      explicacao: O handler chama `AdicionarItem` do `Pedido`.
    - texto: O agregado conferiu cada parcela contra o estoque, e só depois somou ao item existente.
      correta: true
      explicacao: A verificação usava `quantidade`, e não a soma.
    - texto: O estoque foi reposto entre as chamadas.
      correta: false
      explicacao: O produto continuou com estoque 5.
  - tipo: incidente
    titulo: Exceção que escapa do Result
    origem: executado
    rotulo_saida: log
    saida: "  Com falha ProdutosAPI.Tests.Unit.Domain.PedidoInvariantesTests.AdicionarItem_SomaAcimaDe999_DevolveFalhaSemExcecao [2 ms]\n   System.InvalidOperationException : Quantidade máxima por item é 999."
    pergunta: Por que o limite de 999 aparece como exceção, se o agregado usa `Result` em todas as outras regras?
    correcao: Conferir o limite na raiz antes de chamar o item, e manter a exceção do item só como guarda de programação.
    alternativas:
    - texto: O `Result` não suporta números grandes.
      correta: false
      explicacao: O `Result` só carrega sucesso e mensagem.
    - texto: O xUnit transforma falhas em exceção.
      correta: false
      explicacao: A exceção vem de `PedidoItem.IncrementarQuantidade`.
    - texto: A raiz conferiu `1 ≤ 999` para a parcela, e quem descobriu a soma acima do limite foi o item, que lança exceção.
      correta: true
      explicacao: Pela API, a exceção chegaria ao middleware como 500.
  - tipo: incidente
    titulo: Dois pedidos confirmados com o mesmo estoque
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/Pedidos/Domain/Pedido.cs:54-68\n    public Result Confirmar()\n    {\n        if (Status != StatusPedido.Rascunho)\n            return Result.Fail(\"Apenas pedidos em rascunho podem ser confirmados.\");\n\n        if (!_itens.Any())\n            return Result.Fail(\"Pedido precisa ter ao menos um item.\");\n\n        if (Total < ValorMinimoConfirmacao)\n            return Result.Fail(\"Valor mínimo para confirmação é R$ 10,00.\");\n\n        Status = StatusPedido.Confirmado;\n        ConfirmadoEm = DateTime.UtcNow;\n        return Result.Ok();\n    }"
    pergunta: Depois da correção, dois clientes criam e confirmam pedidos de cinco notebooks cada. O que impede a venda de dez?
    correcao: Reservar ou baixar o estoque do `Produto` na confirmação, na mesma transação, ou por um processo que trate a falha de reserva, porque a regra atravessa dois agregados.
    alternativas:
    - texto: 'Nada no código: `Confirmar` não altera o estoque, e cada pedido só confere o estoque disponível no momento.'
      correta: true
      explicacao: O `Pedido` não é dono do estoque do `Produto`.
    - texto: O agregado `Pedido`, que recusa o segundo.
      correta: false
      explicacao: Cada pedido é uma instância separada e não vê o outro.
    - texto: O value object `EstoqueProduto`.
      correta: false
      explicacao: O estoque não muda, e o valor continua 5.
  - tipo: incidente
    titulo: Leitura que falha por dado antigo
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/Catalogo/Catalogo.Domain/ValueObjects/PrecoProduto.cs:18-24\n    public static PrecoProduto Reconstituir(decimal value)\n    {\n        var result = Criar(value);\n        if (!result.IsSuccess || result.Value is null)\n            throw new InvalidOperationException(result.Error);\n        return result.Value;\n    }"
    pergunta: Um produto antigo foi gravado no banco com preço 0, antes da regra. O que acontece ao listá-lo?
    correcao: Corrigir os dados com uma migration antes de endurecer a regra, ou fazer `Reconstituir` aceitar o valor gravado e deixar a regra para as mudanças.
    alternativas:
    - texto: O produto é ignorado na lista.
      correta: false
      explicacao: Não há filtro de produtos inválidos.
    - texto: A reidratação chama `Criar`, recebe falha e lança `InvalidOperationException`, e a leitura falha.
      correta: true
      explicacao: A ADR-0004 diz que `Reconstituir` não revalida, e o código revalida.
    - texto: O produto aparece com preço 0.
      correta: false
      explicacao: '`Reconstituir` recusa o valor.'
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que Atributo e Mídia não têm value objects?
      alternativas:
      - texto: Porque o EF Core não mapeia value objects.
        correta: false
        explicacao: O `AppDbContext` mapeia os do Produto.
      - texto: Porque são entidades sem `Id`.
        correta: false
        explicacao: Os dois têm `Id`.
      - texto: Porque a ADR-0015 não encontrou invariantes de negócio que justificassem o custo.
        correta: true
        explicacao: São CRUD de nome e valor e de URL e tipo.
    - enunciado: Onde a correção deve ficar?
      alternativas:
      - texto: Na raiz do agregado, `Pedido.AdicionarItem`, que conhece os itens existentes.
        correta: true
        explicacao: O handler e o endpoint não precisam mudar.
      - texto: No validador do endpoint.
        correta: false
        explicacao: O validador não conhece os itens já gravados.
      - texto: No banco, com uma constraint.
        correta: false
        explicacao: O estoque fica noutra tabela, e a regra é de domínio.
    - enunciado: O que caracteriza um value object em C# neste projeto?
      alternativas:
      - texto: Uma interface.
        correta: false
        explicacao: Value objects carregam valor.
      - texto: '`sealed record` com construtor privado e `Criar` que devolve `Result`.'
        correta: true
        explicacao: É a decisão da ADR-0004.
      - texto: Uma classe com `Id` e setters públicos.
        correta: false
        explicacao: Isso descreve uma entidade anêmica.
    - enunciado: Por que o agregado `Pedido` não consegue impedir sozinho a venda acima do estoque entre pedidos diferentes?
      alternativas:
      - texto: Porque o `Pedido` não tem `Id`.
        correta: false
        explicacao: O `Pedido` tem `Id`.
      - texto: Porque a regra está errada.
        correta: false
        explicacao: A regra está certa, e o problema é de fronteira.
      - texto: Porque o estoque pertence a outro agregado, o `Produto`, e o `Pedido` só o consulta.
        correta: true
        explicacao: A regra atravessa a fronteira de consistência.
    - enunciado: Qual teste falhava por exceção, e não por asserção?
      alternativas:
      - texto: O da soma acima de 999.
        correta: true
        explicacao: A exceção veio de `IncrementarQuantidade`.
      - texto: O do estoque.
        correta: false
        explicacao: Esse falhou com `found True`.
      - texto: Os dois.
        correta: false
        explicacao: Só um lançou exceção.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A decisão da ADR-0015 para cada recurso do Catálogo está clara.
    - A brecha de estoque foi reproduzida pela API antes da correção.
    - Os dois testes falharam antes da correção e passaram depois.
    - A API passou a recusar o segundo lote com 400.
    - A regra que atravessa dois agregados foi identificada.

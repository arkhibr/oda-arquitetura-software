id: '22'
titulo: 'Erros e validação: Result, FluentValidation e exceções'
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é separar três tipos de erro numa API, a requisição que o servidor não consegue ler, a regra de negócio violada e a falha inesperada, e dar a cada um um status e um formato de resposta próprios, porque um erro do cliente reportado como falha do servidor confunde o cliente e o monitoramento. Na API `net-minimal-api`, um JSON ilegível recebe 500 em `Development` e 400 sem corpo em `Production`, e o mesmo erro aparece com duas respostas conforme o ambiente. Você vai fazer os dois ambientes responderem 400 em `application/problem+json`, com o teste escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Erro de entrada, erro de domínio e erro inesperado
      definicao: O erro de entrada é a requisição que o servidor não consegue ler ou que não passa na validação. O erro de domínio é a regra de negócio violada por uma requisição legível, e o erro inesperado é a falha que ninguém previu, como um bug ou o banco fora do ar.
    - termo: Código de status HTTP
      definicao: 'Número de três dígitos que a resposta HTTP traz para indicar o resultado: a faixa 2xx indica sucesso, a 4xx indica erro do cliente e a 5xx indica falha do servidor. Os códigos mais citados aqui são 200, 201, 204, 400, 401, 404, 422 e 500.'
      referencia:
        rotulo: MDN · Códigos de status de respostas HTTP
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status
    - termo: Problem Details (`application/problem+json`)
      definicao: Formato padronizado pela RFC 9457 para respostas de erro de APIs HTTP, com campos como `type`, `title`, `status` e `detail`, e um tipo de conteúdo próprio, `application/problem+json`. O ASP.NET Core produz esse formato com `Results.Problem` e `Results.ValidationProblem`.
      referencia:
        rotulo: IETF · RFC 9457, Problem Details for HTTP APIs
        url: https://datatracker.ietf.org/doc/html/rfc9457
    - termo: Teste escrito antes da mudança
      definicao: Prática de escrever primeiro o teste que descreve o comportamento desejado, vê-lo falhar e só depois mudar o código até ele passar. A falha inicial confirma que o teste realmente verifica a mudança e não passaria por acaso.
    - termo: Padrão Result (`Result` e `Result<T>`)
      definicao: Tipo de retorno que informa sucesso ou falha de forma explícita, com `IsSuccess`, o valor em caso de sucesso e a mensagem em `Error` em caso de falha. No repositório, `Result` e `Result<T>` são records definidos em `src/Shared/Common/Result.cs` e em `Catalogo.Domain/Common/Result.cs`, e a ADR-0003 registra o uso deles para erros de domínio.
    - termo: FluentValidation
      definicao: Biblioteca de validação para .NET em que as regras de uma requisição ficam numa classe validadora, como `CriarProdutoValidator`, escrita com métodos encadeados. A ADR-0010 do repositório registra o uso dela para validar a entrada.
    - termo: Middleware de tratamento de exceções
      definicao: Middleware global do repositório, em `src/Shared/Middleware/ExceptionHandlingMiddleware.cs`, que captura as exceções não tratadas e as converte numa resposta JSON com o status de cada tipo de exceção. Uma exceção que não tem ramo próprio vira 500 com mensagem genérica.
    - termo: Ambiente de execução (`Development`, `Production`, `Testing`)
      definicao: Nome que o ASP.NET Core lê da variável `ASPNETCORE_ENVIRONMENT` para ajustar o comportamento da aplicação. Os perfis do `Properties/launchSettings.json`, como o `http` usado com `dotnet run --launch-profile http`, definem `Development`, a ausência da variável leva a `Production`, e os testes do repositório rodam no ambiente `Testing`, definido pela `ApiFactory`.
      referencia:
        rotulo: Microsoft Learn · Ambientes de runtime do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/environments
    - termo: '`BadHttpRequestException` e `ThrowOnBadRequest`'
      definicao: '`BadHttpRequestException` é a exceção que o ASP.NET Core lança quando não consegue ler a requisição, por exemplo um JSON truncado no corpo. A opção `ThrowOnBadRequest`, de `RouteHandlerOptions`, decide se essa exceção é lançada ou se o framework responde 400 sem corpo, e ela vem ligada só em `Development`.'
      referencia:
        rotulo: Microsoft Learn · Tratar erros em APIs mínimas e no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/error-handling
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura, com o contexto, a decisão tomada, as alternativas descartadas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`, e esta ODA as usa como registro das escolhas que o código mostra.
      referencia:
        rotulo: adr.github.io · Architectural Decision Records
        url: https://adr.github.io/
    - termo: ASP.NET Core
      definicao: Framework da Microsoft para aplicações web e APIs sobre o .NET. Ele recebe cada requisição HTTP, passa a requisição pela cadeia de middlewares e entrega o resultado ao endpoint correspondente.
      referencia:
        rotulo: Microsoft Learn · Visão geral do ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/introduction-to-aspnet-core
    - termo: Minimal API (API mínima)
      definicao: Forma de declarar endpoints HTTP no ASP.NET Core com chamadas como `app.MapGet` e `app.MapPost`, que associam uma rota a uma função, sem classes de controller. É o estilo usado em toda a API `net-minimal-api`.
      referencia:
        rotulo: Microsoft Learn · Visão geral das APIs mínimas
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/minimal-apis/overview
    - termo: Stack trace (pilha de chamadas)
      definicao: Lista dos métodos que estavam em execução quando uma exceção foi lançada. Ela ajuda a depurar, mas expõe detalhes internos da implementação se for devolvida ao cliente.
    - termo: Cabeçalho `Content-Type`
      definicao: Cabeçalho que informa o tipo do corpo da mensagem HTTP, como `application/json` ou `application/problem+json`. O cliente usa esse valor para decidir como ler o corpo.
      referencia:
        rotulo: MDN · Content-Type
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Headers/Content-Type
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros de exemplo que a API grava no banco ao iniciar, pelo `DbSeeder` do Catálogo, para que haja produtos e categorias desde a primeira execução. Apagar o `produtos-api.db` faz a API recriar o banco com esses dados na próxima vez que subir.
    - termo: SQLite
      definicao: Banco de dados relacional que guarda tudo num único arquivo e roda dentro do próprio processo da aplicação. A API usa o arquivo `produtos-api.db`, na raiz do repositório, e o cria ao iniciar quando ele não existe.
      referencia:
        rotulo: SQLite · About SQLite
        url: https://www.sqlite.org/about.html
    - termo: JWT (JSON Web Token)
      definicao: 'Formato de token assinado que carrega, em JSON, a identidade do usuário e a validade do acesso. A API emite o token em `/api/v1/auth/login`, e o cliente o envia no cabeçalho `Authorization: Bearer <token>` para acessar as rotas protegidas, como as de Pedidos.'
      referencia:
        rotulo: Microsoft Learn · Autenticação de portador JWT no ASP.NET Core
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: FluentAssertions
      definicao: Biblioteca de asserções para testes .NET em que a verificação é escrita como `valor.Should().Be(esperado)`. Os testes do repositório a usam junto com o xUnit.
    - termo: Operador `?.` (null-conditional)
      definicao: Operador do C# que só acessa o membro à direita quando o objeto à esquerda não é nulo. Quando o objeto é nulo, a expressão inteira à direita deixa de ser avaliada e devolve nulo.
    - termo: '`ValidateAndThrow` e `ValidationException`'
      definicao: Método do FluentValidation que valida o objeto e lança `ValidationException` quando há erro. Os endpoints do repositório validam com `Validate` e respondem sem lançar, e por isso nenhum código de `src/` produz essa exceção.
    - termo: '`ValidationProblem`'
      definicao: Resposta do ASP.NET Core no formato Problem Details para erros de validação, com status 400 e um objeto `errors` que lista as mensagens de cada campo. Os Pedidos usam essa resposta, e o Catálogo usa um `ErrorResponse` próprio com status 422.
    - termo: Erros `CS0234`, `CS0246` e `MSB3030`
      definicao: 'Os códigos que começam com `CS` vêm do compilador C#: o `CS0234` indica que um namespace ou tipo não existe dentro do namespace citado, e o `CS0246` indica que um tipo não foi encontrado, em geral por falta de `using` ou de referência de projeto. O `MSB3030` vem do MSBuild e indica que um arquivo marcado para cópia não foi encontrado no momento da cópia.'
    - termo: '`git stash` e `detached HEAD`'
      definicao: O `git stash` guarda as alterações locais numa pilha e deixa a pasta como no último commit, e o `git stash pop` as devolve. O `detached HEAD` é o estado em que o Git fica depois de `git checkout <commit>`, apontando para um commit e não para um branch.
      referencia:
        rotulo: Git · git-stash
        url: https://git-scm.com/docs/git-stash
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Classificar um erro como de entrada, de domínio ou inesperado, e dizer quem deve tratá-lo.
    - Explicar como `Result`, validação e middleware de exceções dividem o trabalho na API.
    - Reconhecer uma resposta que muda de status conforme o ambiente.
    - Mapear `BadHttpRequestException` para 400 em `application/problem+json`, com o teste escrito antes.
    - Identificar uma asserção que passa sem conferir nada.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git e do `curl`. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba define os três tipos de erro e o ponto da API que deve tratar cada um. No repositório, a ADR-0003 registra o uso de `Result` para os erros de domínio e a ADR-0010 registra o FluentValidation para a entrada.
  - tipo: comparativo
    colunas:
    - Quem detecta
    - Resposta esperada
    linhas:
    - dimensao: 'Erro de entrada: JSON ilegível, tipo errado, corpo ausente'
      valores:
      - O framework, ao ler o corpo, ou o validador
      - 400 com problem details, ou 422 para requisição legível que viola uma regra de formato
    - dimensao: 'Erro de domínio: produto inexistente, pedido já cancelado'
      valores:
      - O agregado ou o handler, com `Result`
      - 400, 404, 409 ou 422, conforme a regra, com a mensagem da regra
    - dimensao: 'Falha inesperada: banco fora do ar, erro de programação'
      valores:
      - 'Ninguém: a exceção sobe até o middleware'
      - 500 com mensagem genérica, sem detalhes internos
  - tipo: conceito
    titulo: Result para o esperado, exceção para o inesperado
    texto: Uma regra de negócio violada faz parte do fluxo normal e volta como `Result.Fail`, que o endpoint transforma num status. A exceção fica para o que ninguém previu, e o middleware a transforma em 500 sem expor a mensagem interna.
  - tipo: conceito
    titulo: ThrowOnBadRequest
    texto: Quando o ASP.NET não consegue ler o corpo de um endpoint mínimo, ele lança `BadHttpRequestException` se a opção `ThrowOnBadRequest`, de `RouteHandlerOptions`, estiver ligada, e responde 400 sem corpo se estiver desligada. A opção vem ligada só em `Development`, e é isso que faz o mesmo erro ter duas respostas.
  - tipo: adr
    id: ADR-0003
    titulo: Padrão Result<T> para Erros de Domínio
    status: accepted
    contexto: Operações de domínio podem falhar por regras de negócio, e exceções interrompem o fluxo e carregam custo de stack trace.
    decisao: '`Result<T>` como retorno explícito, com `IsSuccess`, `Value` e `Error`.'
    alternativas: Exceções de domínio e `null` para ausência.
    consequencias: O chamador é obrigado a tratar a falha, e o uso diferente entre Catálogo e Pedidos aumenta a carga cognitiva.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os dois pontos que decidem a resposta de um erro, no commit `702145a`: o endpoint que traduz um `Result` com falha e o middleware que trata as exceções. Clique nos marcadores para ler a explicação de cada linha.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CreatePedido/CreatePedidoEndpoint.cs
    commit: 702145a
    linhas:
    - '            CancellationToken ct) =>'
    - '        {'
    - '            var validation = await validator.ValidateAsync(cmd, ct);'
    - '            if (!validation.IsValid)'
    - '                return Results.ValidationProblem(validation.ToDictionary());'
    - ''
    - '            var result = await handler.HandleAsync(cmd, ct);'
    - '            return result.IsSuccess'
    - '                ? Results.Created($"/api/v1/pedidos/{result.Value!.Id}", result.Value)'
    - '                : Results.BadRequest(new { error = result.Error });'
    anotacoes:
    - linha: 19
      texto: 'Erro de entrada legível: o validador encontrou campos inválidos.'
    - linha: 24
      texto: 'Erro de domínio: o handler devolveu `Result` com falha.'
    inicio: 15
    contexto: O `CreatePedidoEndpoint.cs` registra a rota `POST /api/v1/pedidos`, a fatia vertical de Pedidos que cria um pedido em status Rascunho. O trecho abaixo é o corpo da rota, que valida o comando com o FluentValidation, chama o handler e traduz o `Result` em `201`, em `ValidationProblem` ou em `400`, e por isso decide a resposta dos erros previstos.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Middleware/ExceptionHandlingMiddleware.cs
    commit: 702145a
    linhas:
    - '    public async Task InvokeAsync(HttpContext context)'
    - '    {'
    - '        try'
    - '        {'
    - '            await _next(context);'
    - '        }'
    - '        catch (Exception ex)'
    - '        {'
    - '            _logger.LogError(ex, "Exceção não tratada na requisição");'
    - '            await HandleExceptionAsync(context, ex);'
    - '        }'
    - '    }'
    - ''
    - '    private static Task HandleExceptionAsync(HttpContext context, Exception exception)'
    - '    {'
    - '        context.Response.ContentType = "application/json";'
    - ''
    - '        var response = new ErrorResponse'
    - '        {'
    - '            Instance = context.Request.Path'
    - '        };'
    - ''
    - '        // Tratar diferentes tipos de exceções'
    - '        switch (exception)'
    - '        {'
    - '            case ValidationException validationEx:'
    - '                // Exceção de validação do FluentValidation'
    - '                // Referência: Melhores-Praticas-API.md - Seção "Validação de Dados"'
    - '                context.Response.StatusCode = StatusCodes.Status422UnprocessableEntity;'
    - '                response.Status = StatusCodes.Status422UnprocessableEntity;'
    - '                response.Title = "Validation Failed";'
    - '                response.Type = "https://example.com/errors/validation-error";'
    - '                response.Detail = "One or more validation errors occurred.";'
    - ''
    - '                foreach (var failure in validationEx.Errors.GroupBy(e => e.PropertyName))'
    - '                {'
    - '                    response.Errors[failure.Key] = failure.Select(e => e.ErrorMessage).ToList();'
    - '                }'
    - '                break;'
    - ''
    - '            case KeyNotFoundException:'
    - '                // Recurso não encontrado'
    - '                // Referência: Melhores-Praticas-API.md - Seção "HTTP Status Codes"'
    - '                context.Response.StatusCode = StatusCodes.Status404NotFound;'
    - '                response.Status = StatusCodes.Status404NotFound;'
    - '                response.Title = "Not Found";'
    - '                response.Type = "https://example.com/errors/not-found";'
    - '                response.Detail = exception.Message;'
    - '                break;'
    - ''
    - '            case ArgumentException:'
    - '                // Argumento inválido'
    - '                context.Response.StatusCode = StatusCodes.Status400BadRequest;'
    - '                response.Status = StatusCodes.Status400BadRequest;'
    - '                response.Title = "Bad Request";'
    - '                response.Type = "https://example.com/errors/bad-request";'
    - '                response.Detail = exception.Message;'
    - '                break;'
    - ''
    - '            case UnauthorizedAccessException:'
    - '                // Acesso não autorizado'
    - '                context.Response.StatusCode = StatusCodes.Status401Unauthorized;'
    - '                response.Status = StatusCodes.Status401Unauthorized;'
    - '                response.Title = "Unauthorized";'
    - '                response.Type = "https://example.com/errors/unauthorized";'
    - '                response.Detail = "Autenticação necessária";'
    - '                break;'
    - ''
    - '            default:'
    - '                // Erro genérico do servidor'
    - '                // Referência: Melhores-Praticas-API.md - Seção "Tratamento de Erros"'
    - '                // NÃO expor stack trace em produção'
    - '                context.Response.StatusCode = StatusCodes.Status500InternalServerError;'
    - '                response.Status = StatusCodes.Status500InternalServerError;'
    - '                response.Title = "Internal Server Error";'
    - '                response.Type = "https://example.com/errors/internal-server-error";'
    - '                response.Detail = "Um erro interno ocorreu ao processar sua requisição";'
    - '                break;'
    - '        }'
    - ''
    - '        return context.Response.WriteAsJsonAsync(response);'
    - '    }'
    anotacoes:
    - linha: 29
      texto: Qualquer exceção não tratada chega aqui.
    - linha: 38
      texto: Tipo definido antes da escrita do corpo.
    - linha: 48
      texto: Ramo para exceções do FluentValidation.
    - linha: 63
      texto: Não há ramo para `BadHttpRequestException`, que cai no `default`.
    - linha: 91
      texto: Tudo que não foi previsto vira 500.
    - linha: 103
      texto: Escreve o corpo em JSON.
    inicio: 23
    contexto: O `ExceptionHandlingMiddleware.cs` é o middleware global da API que captura as exceções não tratadas e devolve respostas padronizadas. O trecho abaixo mostra o `try` em volta do restante do pipeline e o `switch` que escolhe o status de cada tipo de exceção, o ponto que define a resposta dos erros que nenhum endpoint previu.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o caminho de uma requisição com JSON ilegível nos dois ambientes, antes e depois da correção. Depois, classifique cada situação pelo tipo de erro, para fixar quem deve tratá-la.
  - tipo: fluxo
    titulo: POST com corpo ilegível
    etapas:
    - titulo: Leitura do corpo
      descricao: O ASP.NET tenta desserializar `{"nome":` em `CriarProdutoRequest` e encontra um objeto JSON sem fim.
    - titulo: Production, antes
      descricao: 'Com `ThrowOnBadRequest` desligado, o framework responde 400 com `Content-Length: 0`, sem passar pelo middleware.'
    - titulo: Development, antes
      descricao: Com a opção ligada, o framework lança `BadHttpRequestException`, e o middleware, sem ramo para ela, responde 500.
    - titulo: Depois
      descricao: A opção fica ligada em todo ambiente, e o ramo novo responde 400 com título e detalhe próprios.
    - titulo: Escrita
      descricao: O `WriteAsJsonAsync` recebe `application/problem+json` como tipo de conteúdo, e o cabeçalho chega ao cliente com esse valor.
  - tipo: classificador
    enunciado: Que tipo de erro é cada situação?
    categorias:
    - id: entrada
      rotulo: Erro de entrada
    - id: dominio
      rotulo: Erro de domínio
    - id: inesperado
      rotulo: Falha inesperada
    itens:
    - texto: Corpo `{"nome":` num POST de produto
      categoria: entrada
      explicacao: O servidor não consegue ler a requisição.
    - texto: Pedido com o produto 99999, que não existe
      categoria: dominio
      explicacao: A requisição é legível e viola uma regra do pedido.
    - texto: Cancelar um pedido já cancelado
      categoria: dominio
      explicacao: '`Pedido.Cancelar` devolve `Result.Fail`.'
    - texto: Banco SQLite apagado com a API no ar
      categoria: inesperado
      explicacao: Ninguém trata, e a exceção sobe ao middleware.
    - texto: '`preco` enviado como texto, `"caro"`'
      categoria: entrada
      explicacao: O tipo do campo não converte.
    - texto: Pedido sem itens
      categoria: entrada
      explicacao: O validador recusa a requisição antes do domínio.
    - texto: '`NullReferenceException` num handler'
      categoria: inesperado
      explicacao: Bug, com resposta 500 genérica.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é dar ao corpo ilegível a mesma resposta em todos os ambientes, 400 em `application/problem+json`, porque hoje o desenvolvimento registra uma falha de servidor e a produção devolve 400 sem corpo nem explicação. Os passos 1 e 2 mostram a diferença entre os ambientes, os passos 3 a 6 escrevem os testes e mudam o `Program.cs` e o middleware, e o passo 7 repete as chamadas nos dois ambientes. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: Quando o ASP.NET Core não consegue ler o corpo de um endpoint mínimo, a opção `ThrowOnBadRequest`, ligada só em `Development`, decide entre lançar `BadHttpRequestException` e responder 400 sem corpo. O `ExceptionHandlingMiddleware.cs` não tem ramo para essa exceção, que cai no `default` e vira 500, e o `WriteAsJsonAsync` sem `contentType` grava `application/json` por cima do tipo definido antes.
    impacto: O mesmo JSON truncado aparece como falha do servidor no monitoramento de desenvolvimento e como 400 sem corpo em produção, e o cliente não recebe nenhuma explicação do erro. Um alerta de 500 para um erro do cliente leva a equipe a investigar o servidor sem motivo.
    mecanismo: O laboratório liga `ThrowOnBadRequest` em todos os ambientes, acrescenta ao middleware um ramo para `BadHttpRequestException` que responde 400 com título e detalhe e passa `application/problem+json` no próprio `WriteAsJsonAsync`. Os testes de integração, escritos antes, conferem o status e o tipo de conteúdo de dois erros de entrada e mantêm o erro de domínio, que continua tratado pelo `Result` do handler.
    comprovacao: 'Antes da mudança, dois testes falham com `Expected tipo to be "application/problem+json", but found <null>.`, e depois os três passam, com a suíte em 146 aprovações. Com a API em `Development` e em `Production`, o JSON ilegível recebe `HTTP/1.1 400 Bad Request` com `Content-Type: application/problem+json` e o título `Requisição inválida`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Enviar JSON ilegível em Development
      texto: Suba a API num terminal e, noutro, obtenha o token e envie o corpo truncado. Encerre a API com Ctrl+C no fim.
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db
        - ASPNETCORE_ENVIRONMENT=Development dotnet run --no-launch-profile --urls http://localhost:5000
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'curl -s -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":'' http://localhost:5000/api/v1/catalogo/produtos | tr -d ''\r'' | grep -i -E ''^HTTP|^content-type|^content-length|^\{'''
        - 'curl -s -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":99999,"quantidade":1}]}'' http://localhost:5000/api/v1/pedidos | tr -d ''\r'' | grep -i -E ''^HTTP|^content-type|^\{'''
      sucesso: '`HTTP/1.1 500 Internal Server Error` no JSON ilegível e `400` com `{"error":"Produto 99999 não encontrado."}` no pedido.'
    - titulo: Repetir em Production
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db
        - ASPNETCORE_ENVIRONMENT=Production dotnet run --no-launch-profile --urls http://localhost:5000
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' http://localhost:5000/api/v1/auth/login | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'curl -s -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"nome":'' http://localhost:5000/api/v1/catalogo/produtos | tr -d ''\r'' | grep -i -E ''^HTTP|^content-type|^content-length|^\{'''
      sucesso: '`HTTP/1.1 400 Bad Request` com `Content-Length: 0`.'
    - titulo: Escrever os testes de erro de entrada
      texto: Crie o arquivo abaixo. Ele confere o status e o tipo de conteúdo dos dois erros de entrada e mantém o erro de domínio como está.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/ErrosDeEntradaTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Text;
        - using FluentAssertions;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration;
        - ''
        - 'public class ErrosDeEntradaTests : IClassFixture<ApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public ErrosDeEntradaTests(ApiFactory factory)'

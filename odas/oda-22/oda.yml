- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que aparecem ao tratar erros nessa API, cada uma com a saída ou o trecho de código que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Erro do cliente que vira alerta de servidor
    origem: executado
    rotulo_saida: log
    saida: '# Development

      HTTP/1.1 500 Internal Server Error

      Content-Type: application/json; charset=utf-8

      {"type":"https://example.com/errors/internal-server-error","title":"Internal Server Error","status":500,"detail":"Um erro interno ocorreu ao processar sua requisição","instance":"/api/v1/catalogo/produtos","errors":{}}


      # Production

      HTTP/1.1 400 Bad Request

      Content-Length: 0'
    pergunta: O monitoramento de desenvolvimento registra 500, e o de produção registra 400 sem corpo, para o mesmo JSON truncado. Por quê?
    correcao: Ligar `ThrowOnBadRequest` em todo ambiente e tratar `BadHttpRequestException` no middleware, como no passo 5.
    alternativas:
    - texto: O Swagger muda a leitura do corpo em desenvolvimento.
      correta: false
      explicacao: O Swagger só documenta as rotas.
    - texto: Só em `Development` o framework lança `BadHttpRequestException`, e o middleware, sem ramo para ela, a trata como falha inesperada.
      correta: true
      explicacao: Em `Production`, o framework responde direto, sem chegar ao middleware.
    - texto: O banco de produção recusa o JSON.
      correta: false
      explicacao: O erro acontece antes de qualquer acesso ao banco.
  - tipo: incidente
    titulo: Teste verde que não confere nada
    origem: executado
    rotulo_saida: log
    saida: 'response.Content.Headers.ContentType?.MediaType.Should().Be("application/problem+json");

      response.Content.Headers.ContentType?.MediaType.Should().Be("application/problem+json");


      $ dotnet test tests/ProdutosAPI.Tests --filter ErrosDeEntradaTests

      Aprovado!  – Com falha:     0, Aprovado:     3, Ignorado:     0, Total:     3, Duração: 685 ms - ProdutosAPI.Tests.dll (net10.0)'
    pergunta: Com essa asserção, os três testes passaram antes de qualquer correção. Por quê?
    correcao: Guardar o valor numa variável e chamar `Should()` sobre ela, como na versão do passo 3.
    alternativas:
    - texto: O FluentAssertions ignora cabeçalhos.
      correta: false
      explicacao: A versão com variável confere o cabeçalho.
    - texto: A API já respondia `problem+json`.
      correta: false
      explicacao: 'O `curl` mostrou `Content-Length: 0`, sem tipo de conteúdo.'
    - texto: Com o cabeçalho nulo, o operador `?.` interrompe a expressão inteira, e o `Should().Be(...)` nunca é chamado.
      correta: true
      explicacao: Com a variável, a mesma verificação falha com `found <null>`.
  - tipo: incidente
    titulo: Tipo de conteúdo que não muda
    origem: executado
    rotulo_saida: log
    saida: "  Com falha ProdutosAPI.Tests.Integration.ErrosDeEntradaTests.POST_Cancelar_SemCorpo_Retorna400ComProblemDetails [26 ms]\n   Expected tipo to be \"application/problem+json\" with a length of 24, but \"application/json\" has a length of 16, differs near \"jso\" (index 12).\n  Com falha ProdutosAPI.Tests.Integration.ErrosDeEntradaTests.POST_Produto_JsonIlegivel_Retorna400ComProblemDetails [5 ms]\n   Expected tipo to be \"application/problem+json\" with a length of 24, but \"application/json\" has a length of 16, differs near \"jso\" (index 12).\nCom falha! – Com falha:     2, Aprovado:     1, Ignorado:     0, Total:     3, Duração: 712 ms - ProdutosAPI.Tests.dll (net10.0)"
    pergunta: O middleware definiu `context.Response.ContentType = "application/problem+json"`, e o cliente recebeu `application/json`. O que aconteceu?
    correcao: Passar o tipo de conteúdo no próprio `WriteAsJsonAsync`, como no passo 5.
    alternativas:
    - texto: O `WriteAsJsonAsync` sem `contentType` grava `application/json` ao escrever o corpo, por cima do valor definido antes.
      correta: true
      explicacao: O status já saía certo nesse estado, e só o tipo divergia.
    - texto: O navegador troca o tipo.
      correta: false
      explicacao: O teste roda sem navegador.
    - texto: O `problem+json` não é um tipo válido.
      correta: false
      explicacao: É o tipo da RFC 9457 para problem details.
  - tipo: incidente
    titulo: Ramo de validação que nunca executa
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/Middleware/ExceptionHandlingMiddleware.cs:48-51

      case ValidationException validationEx:

      // Exceção de validação do FluentValidation

      // Referência: Melhores-Praticas-API.md - Seção "Validação de Dados"

      context.Response.StatusCode = StatusCodes.Status422UnprocessableEntity;'
    pergunta: Nenhum arquivo de `src/` lança `ValidationException` nem chama `ValidateAndThrow`. Que consequência isso tem?
    correcao: Remover o ramo ou adotar `ValidateAndThrow` de forma consistente, e registrar a escolha.
    alternativas:
    - texto: O FluentValidation lança sozinho.
      correta: false
      explicacao: Só o `ValidateAndThrow` lança, e ninguém o chama.
    - texto: O ramo 422 do middleware nunca executa, e quem lê o código conclui que a validação passa por ele, quando ela é feita nos endpoints.
      correta: true
      explicacao: O Catálogo responde 422 com `Results.UnprocessableEntity`, e os Pedidos, 400 com `ValidationProblem`.
    - texto: Toda validação vira 500.
      correta: false
      explicacao: Os endpoints validam e respondem sem lançar.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Quem deve tratar um JSON que não pode ser lido?
      alternativas:
      - texto: O agregado, com `Result.Fail`.
        correta: false
        explicacao: O agregado nunca é chamado.
      - texto: O banco, com uma constraint.
        correta: false
        explicacao: A requisição para antes do banco.
      - texto: A borda da API, com 400, antes de qualquer regra de negócio.
        correta: true
        explicacao: O domínio nem chega a receber a requisição.
    - enunciado: Por que o mesmo erro tinha dois status?
      alternativas:
      - texto: Porque `ThrowOnBadRequest` vem ligado só em `Development`.
        correta: true
        explicacao: Em produção, o framework respondia direto.
      - texto: Porque produção usa HTTPS.
        correta: false
        explicacao: As chamadas foram em HTTP nos dois.
      - texto: Porque o seed muda.
        correta: false
        explicacao: O erro acontece antes do banco.
    - enunciado: Que resposta uma falha inesperada deve ter?
      alternativas:
      - texto: '400.'
        correta: false
        explicacao: O cliente não errou.
      - texto: 500 com mensagem genérica, e o detalhe só no log.
        correta: true
        explicacao: O `default` do middleware faz isso.
      - texto: 500 com a stack trace.
        correta: false
        explicacao: A stack expõe a implementação.
    - enunciado: Por que o erro de domínio do pedido não mudou?
      alternativas:
      - texto: Porque o middleware ignora Pedidos.
        correta: false
        explicacao: O middleware vale para todas as rotas.
      - texto: Porque o teste não chama Pedidos.
        correta: false
        explicacao: O terceiro teste chama `POST /api/v1/pedidos`.
      - texto: 'Porque não é exceção: o handler devolve `Result` com falha, e o endpoint escolhe o status.'
        correta: true
        explicacao: O middleware só trata exceções.
    - enunciado: Como evitar a asserção que passa sem conferir?
      alternativas:
      - texto: 'Não usar `?.` antes de `Should()`: guardar o valor e verificar a variável.'
        correta: true
        explicacao: O teste corrigido mostrou `found <null>`.
      - texto: Rodar os testes duas vezes.
        correta: false
        explicacao: O resultado seria o mesmo.
      - texto: Usar `Assert.True`.
        correta: false
        explicacao: Com `?.`, qualquer chamada seria pulada.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os três tipos de erro e quem trata cada um estão claros.
    - A diferença entre `Development` e `Production` foi reproduzida.
    - Os testes falharam antes da correção e passaram depois.
    - Os dois ambientes passaram a responder 400 em `application/problem+json`.
    - O erro de domínio continuou com a resposta do handler.

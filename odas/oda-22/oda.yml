        - ''
        - '        var response = await _client.PostAsync("/api/v1/pedidos", Json("{\"itens\":[{\"produtoId\":99999,\"quantidade\":1}]}"));'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.BadRequest);'
        - '        (await response.Content.ReadAsStringAsync()).Should().Contain("error");'
        - '    }'
        - '}'
      efeito: teste_erros
    - titulo: Ver os testes falharem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter ErrosDeEntradaTests
      sucesso: '`Com falha: 2, Aprovado: 1`, com `Expected tipo to be "application/problem+json", but found <null>.`'
    - titulo: Ligar a exceção e tratar o erro de entrada
      texto: Faça as três mudanças abaixo no `Program.cs` e no middleware.
      editor:
        rotulo: arquivo
        caminho: Program.cs e src/Shared/Middleware/ExceptionHandlingMiddleware.cs (alteração)
        commit: 702145a
        linhas:
        - '// Program.cs: depois de builder.Services.AddAuthorization();'
        - // Corpo ilegível vira exceção em todo ambiente, e o middleware decide a resposta
        - // (sem isso, só Development lança; os demais respondem 400 sem corpo).
        - builder.Services.Configure<Microsoft.AspNetCore.Routing.RouteHandlerOptions>(o => o.ThrowOnBadRequest = true);
        - ''
        - '// src/Shared/Middleware/ExceptionHandlingMiddleware.cs: novo case, antes de KeyNotFoundException'
        - '            case BadHttpRequestException badRequest:'
        - '                // Erro de entrada: o corpo ou um parâmetro não pôde ser lido'
        - '                context.Response.StatusCode = badRequest.StatusCode;'
        - '                response.Status = badRequest.StatusCode;'
        - '                response.Title = "Requisição inválida";'
        - '                response.Type = "https://example.com/errors/bad-request";'
        - '                response.Detail = "O corpo ou um parâmetro da requisição não pôde ser lido.";'
        - '                break;'
        - ''
        - '// ExceptionHandlingMiddleware.cs: apague a linha context.Response.ContentType = "application/json";'
        - '// e troque a última linha por:'
        - '        // WriteAsJsonAsync sem contentType grava application/json por cima do valor definido antes.'
        - '        return context.Response.WriteAsJsonAsync(response, options: null, contentType: "application/problem+json");'
      efeito: erros_mapeados

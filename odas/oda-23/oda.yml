- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que aparecem ao manter escrita, leitura e esquema nesse projeto, cada uma com a saída que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional (ORM) da Microsoft para .NET, que traduz consultas escritas em C# para SQL e acompanha as mudanças nos objetos para gravá-las no banco. Na API, ela cuida das escritas e das migrations.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: LINQ (Language Integrated Query)
      definicao: Recurso do C# para escrever consultas como expressões da própria linguagem, como `Where` e `AnyAsync`. O EF Core traduz essas expressões para SQL durante a execução, e uma expressão que ele não sabe traduzir gera erro nesse momento.
      referencia:
        rotulo: 'Microsoft Learn: avaliação de consultas no cliente e no servidor'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/client-eval
    - termo: Value object (objeto de valor)
      definicao: Objeto do domínio definido apenas pelos seus valores, sem identidade própria, e por isso dois value objects com os mesmos valores são iguais. Na API, o SKU é um value object que o EF Core grava como texto por meio de uma conversão.
      referencia:
        rotulo: 'Martin Fowler: Value Object'
        url: https://martinfowler.com/bliki/ValueObject.html
    - termo: SKU (Stock Keeping Unit)
      definicao: Código que identifica de forma única um item de estoque. Na API, cada variante de produto, como uma cor ou um tamanho, tem um SKU próprio, como `MOUSE-ROSA`.
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros que a aplicação insere num banco novo para que ele já tenha dados de exemplo. Na API, o seed roda depois das migrations e cria, entre outros, o produto 2 usado no laboratório.
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, serviços e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests` e sobem a API com a classe `ApiFactory`.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a subir quando o modelo tem mudanças que nenhuma migration descreve, o aviso `PendingModelChangesWarning`.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, como criar uma tabela ou trocar um índice, com um método `Up` que aplica a mudança e um `Down` que a desfaz. As migrations são aplicadas em ordem, e o histórico delas fica gravado no próprio banco.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: Esteira de CI (integração contínua)
      definicao: Processo automático que compila e testa o código a cada alteração enviada ao repositório, antes de ela ser incorporada. O Diagnóstico sugere incluir nela a verificação de mudanças de modelo sem migration.
      referencia:
        rotulo: 'Martin Fowler: Continuous Integration'
        url: https://martinfowler.com/articles/continuousIntegration.html
    - termo: Exclusão lógica (soft delete)
      definicao: Técnica em que excluir um registro apenas marca uma coluna, como `Ativo` ou `Ativa`, com falso, e a linha continua na tabela. Toda consulta e toda regra de unicidade precisa então decidir se considera ou não as linhas marcadas.
      referencia:
        rotulo: 'Microsoft Learn: filtros de consulta globais no EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/filters
    - termo: Índice único e índice filtrado
      definicao: Um índice único impede que duas linhas tenham a mesma combinação de valores nas colunas indexadas. Um índice filtrado, chamado de índice parcial no SQLite, só considera as linhas que atendem a uma condição, como `WHERE Ativa = 1`.
      referencia:
        rotulo: 'SQLite: partial indexes'
        url: https://www.sqlite.org/partialindex.html
  - tipo: incidente
    titulo: Nenhuma variante pode ser criada
    origem: executado
    rotulo_saida: log
    saida: '$ POST /api/v1/catalogo/variantes

      {"type":"https://example.com/errors/internal-server-error","title":"Internal Server Error","status":500,"detail":"Um erro interno ocorreu ao processar sua requisição","instance":"/api/v1/catalogo/variantes","errors":{}} 500


      # log da API

      System.InvalidOperationException: The LINQ expression ''DbSet<Variante>()'
    pergunta: Por que toda criação de variante falha, se o código compila e o teste de unidade do domínio passa?
    correcao: Comparar o value object inteiro, `v.Sku == alvo`, que o EF Core traduz pela conversão, como no passo 5.
    alternativas:
    - texto: O produto 2 não existe.
      correta: false
      explicacao: O produto 2 vem do seed.
    - texto: A consulta acessa `v.Sku.Valor`, que não é coluna, e o EF Core só descobre que não consegue traduzir quando executa a consulta.
      correta: true
      explicacao: O compilador vê LINQ válido, e a tradução para SQL acontece em execução.
    - texto: O SKU `MOUSE-ROSA` tem formato inválido.
      correta: false
      explicacao: Um SKU inválido daria 422 pela validação do domínio.
  - tipo: incidente
    titulo: Testes verdes e API que não sobe
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test tests/ProdutosAPI.Tests --filter VarianteSkuTests

      Aprovado!  – Com falha:     0, Aprovado:     3, Ignorado:     0, Total:     3, Duração: 712 ms - ProdutosAPI.Tests.dll (net10.0)


      $ dotnet run --launch-profile http

      Unhandled exception. System.InvalidOperationException: An error was generated for warning ''Microsoft.EntityFrameworkCore.Migrations.PendingModelChangesWarning'': The model for context ''AppDbContext'' has pending changes. Add a new migration before updating the d'
    pergunta: Depois do passo 7, os testes passam e a API não inicia. O que separa os dois?
    correcao: Gerar a migration a cada mudança de modelo, como no passo 9, e rodar `dotnet ef migrations has-pending-model-changes` na esteira.
    alternativas:
    - texto: Os testes usam outro banco de dados.
      correta: false
      explicacao: Os dois usam SQLite.
    - texto: A API precisa de outra versão do EF Core.
      correta: false
      explicacao: A versão é a mesma nos dois.
    - texto: Os testes criam o banco com `EnsureCreated`, a partir do modelo, e a API aplica migrations com `Migrate()`, que recusa um modelo sem migration.
      correta: true
      explicacao: O `ApiFactory` chama `db.Database.EnsureCreated()`.
  - tipo: incidente
    titulo: Atributos de um produto excluído
    origem: executado
    rotulo_saida: log
    saida: '$ excluir produto

      204

      $ obter produto

      404

      $ atributos do produto

      [{"id":1,"produtoId":1,"chave":"cor","valor":"prata","dataCriacao":"2026-11-02T00:48:01.186504"}] 200

      $ novo atributo no produto excluído

      {"id":2,"produtoId":1,"chave":"garantia","valor":"2 anos","dataCriacao":"2026-11-02T00:48:01.324264Z"} 201

      $ registro no banco

      1|Notebook Dell XPS 13|0'
    pergunta: O produto 1 responde 404, e os atributos dele continuam aparecendo e aceitando novos registros. Por quê?
    correcao: Conferir o produto ativo nas operações de atributo e de mídia, ou filtrar pelo produto na consulta, porque a exclusão lógica não se propaga sozinha.
    alternativas:
    - texto: Os repositórios de atributo filtram só por `ProdutoId`, e a exclusão lógica muda apenas a linha do produto.
      correta: true
      explicacao: O produto continua no banco com `Ativo = 0`, e os atributos não sabem disso.
    - texto: O `DELETE` falhou.
      correta: false
      explicacao: O `DELETE` respondeu 204, e o banco mostra `Ativo = 0`.
    - texto: Os atributos ficam em cache.
      correta: false
      explicacao: O atributo novo foi gravado depois do `DELETE`.
  - tipo: incidente
    titulo: Unicidade que ignora a exclusão
    origem: executado
    rotulo_saida: log
    saida: "  Com falha ProdutosAPI.Tests.Integration.Catalogo.VarianteSkuTests.POST_Variante_SkuDeVarianteDesativada_PodeSerReusado [46 ms]\n   Expected response.StatusCode to be HttpStatusCode.Created {value: 201}, but found HttpStatusCode.InternalServerError {value: 500}.\nCom falha! – Com falha:     1, Aprovado:     2, Ignorado:     0, Total:     3, Duração: 749 ms - ProdutosAPI.Tests.dll (net10.0)"
    pergunta: Com a consulta corrigida, por que recriar o SKU de uma variante desativada ainda recebe 500?
    correcao: Filtrar o índice único por `Ativa = 1` e gerar a migration, como nos passos 7 e 9.
    alternativas:
    - texto: O SKU precisa mudar de caixa.
      correta: false
      explicacao: O SKU é normalizado em maiúsculas pelo value object.
    - texto: A aplicação ignora as variantes inativas, e o índice único do banco as conta, e por isso recusa a inserção.
      correta: true
      explicacao: O índice filtrado alinha as duas regras.
    - texto: A desativação apaga a variante.
      correta: false
      explicacao: A linha continua com `Ativa = 0`.

  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.Infrastructure/Repositories/EfVarianteCommandRepository.cs
    commit: 702145a
    linhas:
    - 'public class EfVarianteCommandRepository(ICatalogoContext context) : IVarianteCommandRepository'
    - '{'
    - '    public Task<Variante?> ObterPorIdAsync(int id) =>'
    - '        context.Variantes.FirstOrDefaultAsync(v => v.Id == id && v.Ativa);'
    - ''
    - '    public async Task<Variante> AdicionarAsync(Variante variante)'
    - '    {'
    - '        context.AddVariante(variante);'
    - '        await context.SaveChangesAsync();'
    - '        return variante;'
    - '    }'
    - ''
    - '    public async Task SaveChangesAsync() => await context.SaveChangesAsync();'
    - ''
    - '    public async Task<bool> SkuExisteParaProdutoAsync(int produtoId, string sku) =>'
    - '        await context.Variantes.AnyAsync(v => v.ProdutoId == produtoId && v.Sku.Valor == sku && v.Ativa);'
    - '}'
    anotacoes:
    - linha: 11
      texto: Leitura feita pelo lado de escrita, já com o filtro de ativas.
    - linha: 23
      texto: '`v.Sku.Valor` não existe como coluna, e o EF Core não traduz o acesso.'
    inicio: 8
    contexto: O `EfVarianteCommandRepository.cs` é o repositório do lado de escrita das variantes de produto, implementado com o EF Core no módulo de Catálogo. O trecho abaixo contém a busca por id e a consulta `SkuExisteParaProdutoAsync`, que compara `v.Sku.Valor` e é a consulta que falha na criação de variantes.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/Data/AppDbContext.cs
    commit: 702145a
    linhas:
    - '            entity.Property(v => v.Sku)'
    - '                .IsRequired()'
    - '                .HasMaxLength(20)'
    - '                .HasConversion(sku => sku.Valor, valor => SKU.Reconstituir(valor))'

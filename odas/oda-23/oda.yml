id: '23'
titulo: CQRS com EF Core e Dapper, migrations e soft delete
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: 'O objetivo desta ODA é corrigir dois defeitos de acesso a dados que impedem o cadastro de variantes de produto na API `net-minimal-api`: toda criação de variante recebe 500, porque o EF Core não consegue traduzir uma consulta LINQ para SQL, e o SKU (Stock Keeping Unit, o código de estoque) de uma variante excluída não pode ser reaproveitado, porque o índice único do banco também conta as linhas desativadas pela exclusão lógica. Os dois defeitos mostram que a escrita com EF Core, a leitura com Dapper, a exclusão lógica e as migrations precisam seguir as mesmas regras. Você vai corrigir a consulta de escrita, filtrar o índice pelas variantes ativas e gerar a migration que leva a mudança ao banco, com o teste escrito antes.'
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, como criar uma tabela ou trocar um índice, com um método `Up` que aplica a mudança e um `Down` que a desfaz. As migrations são aplicadas em ordem, e o histórico delas fica gravado no próprio banco.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: Exclusão lógica (soft delete)
      definicao: Técnica em que excluir um registro apenas marca uma coluna, como `Ativo` ou `Ativa`, com falso, e a linha continua na tabela. Toda consulta e toda regra de unicidade precisa então decidir se considera ou não as linhas marcadas.
      referencia:
        rotulo: 'Microsoft Learn: filtros de consulta globais no EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/filters
    - termo: SKU (Stock Keeping Unit)
      definicao: Código que identifica de forma única um item de estoque. Na API, cada variante de produto, como uma cor ou um tamanho, tem um SKU próprio, como `MOUSE-ROSA`.
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional (ORM) da Microsoft para .NET, que traduz consultas escritas em C# para SQL e acompanha as mudanças nos objetos para gravá-las no banco. Na API, ela cuida das escritas e das migrations.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: Dapper
      definicao: Biblioteca .NET que executa SQL escrito à mão e converte as linhas do resultado em objetos, sem rastrear mudanças. Na API, ela atende as consultas de leitura.
    - termo: LINQ (Language Integrated Query)
      definicao: Recurso do C# para escrever consultas como expressões da própria linguagem, como `Where` e `AnyAsync`. O EF Core traduz essas expressões para SQL durante a execução, e uma expressão que ele não sabe traduzir gera erro nesse momento.
      referencia:
        rotulo: 'Microsoft Learn: avaliação de consultas no cliente e no servidor'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/client-eval
    - termo: Índice único e índice filtrado
      definicao: Um índice único impede que duas linhas tenham a mesma combinação de valores nas colunas indexadas. Um índice filtrado, chamado de índice parcial no SQLite, só considera as linhas que atendem a uma condição, como `WHERE Ativa = 1`.
      referencia:
        rotulo: 'SQLite: partial indexes'
        url: https://www.sqlite.org/partialindex.html
    - termo: dotnet-ef
      definicao: Ferramenta de linha de comando do EF Core que gera, lista e aplica migrations, instalada como ferramenta local do repositório pelo arquivo `dotnet-tools.json`.
      referencia:
        rotulo: 'Microsoft Learn: referência da CLI do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/cli/dotnet
    - termo: SQLite
      definicao: Banco de dados relacional que guarda tudo num único arquivo e roda dentro do próprio processo da aplicação, sem servidor separado. A API grava os dados no arquivo `produtos-api.db`.
      referencia:
        rotulo: 'SQLite: about SQLite'
        url: https://www.sqlite.org/about.html
    - termo: JWT (JSON Web Token) e token Bearer
      definicao: 'Token assinado que a API emite no login e que o cliente envia no cabeçalho `Authorization: Bearer <token>` para provar quem é. O laboratório obtém esse token antes de criar variantes.'
      referencia:
        rotulo: 'IETF: RFC 7519, JSON Web Token'
        url: https://datatracker.ietf.org/doc/html/rfc7519
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`.
      referencia:
        rotulo: 'ADR GitHub: Architectural Decision Records'
        url: https://adr.github.io/
    - termo: CQRS (Command Query Responsibility Segregation)
      definicao: Padrão que separa o modelo usado para alterar dados, os comandos, do modelo usado para lê-los, as consultas. Na API, a separação aparece como repositórios de comando com EF Core e repositórios de consulta com Dapper.
      referencia:
        rotulo: 'Martin Fowler: CQRS'
        url: https://martinfowler.com/bliki/CQRS.html
    - termo: Repositório (padrão Repository)
      definicao: Classe que concentra o acesso a dados de uma entidade atrás de métodos com nomes do domínio, como `SkuExisteParaProdutoAsync`, e isola o resto do código da forma como o banco é consultado.
      referencia:
        rotulo: 'Martin Fowler: Repository'
        url: https://martinfowler.com/eaaCatalog/repository.html
    - termo: Value object (objeto de valor)
      definicao: Objeto do domínio definido apenas pelos seus valores, sem identidade própria, e por isso dois value objects com os mesmos valores são iguais. Na API, o SKU é um value object que o EF Core grava como texto por meio de uma conversão.
      referencia:
        rotulo: 'Martin Fowler: Value Object'
        url: https://martinfowler.com/bliki/ValueObject.html
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros que a aplicação insere num banco novo para que ele já tenha dados de exemplo. Na API, o seed roda depois das migrations e cria, entre outros, o produto 2 usado no laboratório.
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a subir quando o modelo tem mudanças que nenhuma migration descreve, o aviso `PendingModelChangesWarning`.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, serviços e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests` e sobem a API com a classe `ApiFactory`.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: Esteira de CI (integração contínua)
      definicao: Processo automático que compila e testa o código a cada alteração enviada ao repositório, antes de ela ser incorporada. O Diagnóstico sugere incluir nela a verificação de mudanças de modelo sem migration.
      referencia:
        rotulo: 'Martin Fowler: Continuous Integration'
        url: https://martinfowler.com/articles/continuousIntegration.html
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar por que a API usa EF Core para escrever e Dapper para ler, e o custo de manter os dois.
    - Reconhecer uma consulta LINQ que o EF Core não consegue traduzir para SQL.
    - Explicar a exclusão lógica e as consultas que precisam respeitá-la.
    - Gerar e aplicar uma migration com o `dotnet-ef`.
    - Distinguir o banco criado pelos testes do banco que a API cria com as migrations.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git, do `curl` e, para conferir o índice, do `sqlite3`. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. Os comandos usam a sintaxe do bash ou do zsh, e no Windows devem rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba explica como a API `net-minimal-api` separa a escrita e a leitura de dados, como a exclusão lógica funciona e de onde vem o esquema do banco. Os blocos abaixo definem cada conceito antes do comparativo entre os dois lados, e as duas ADRs (registros de decisão de arquitetura) do fim mostram o que o repositório decidiu sobre a divisão entre EF Core e Dapper e sobre a exclusão lógica.
  - tipo: conceito
    titulo: Separação entre escrita e leitura (CQRS)
    texto: O CQRS, sigla de Command Query Responsibility Segregation, separa o código que altera dados, os comandos, do código que os lê, as consultas. Na API, cada entidade tem um repositório de comando, como `IVarianteCommandRepository`, e um repositório de consulta, como `IVarianteQueryRepository`, cada um com a própria ferramenta de acesso ao banco. A separação permite escolher a melhor ferramenta para cada lado, e o custo é manter as duas de acordo com o mesmo esquema.
  - tipo: conceito
    titulo: EF Core e Dapper
    texto: O EF Core (Entity Framework Core) é a biblioteca de mapeamento objeto-relacional da Microsoft, que traduz consultas em C# para SQL, acompanha as mudanças nos objetos e gera as migrations. O Dapper executa SQL escrito à mão e converte as linhas em objetos, sem rastrear mudanças. Na API, o EF Core atende os repositórios de comando, e o Dapper atende os de consulta.
  - tipo: conceito
    titulo: Consultas LINQ traduzidas para SQL
    texto: O LINQ (Language Integrated Query) permite escrever consultas como expressões do C#, como `AnyAsync(v => v.ProdutoId == id)`. O EF Core só traduz essas expressões para SQL quando a consulta executa, e uma expressão que acessa algo que não é coluna, como uma propriedade dentro de um value object, objeto do domínio definido só pelos seus valores, falha nesse momento, mesmo com o código compilando sem erro.
  - tipo: conceito
    titulo: Exclusão lógica
    texto: Na exclusão lógica, excluir um produto ou uma variante muda a coluna `Ativo` ou `Ativa` para falso, e o registro continua no banco para auditoria e para os pedidos antigos. Toda consulta e toda regra de unicidade precisa então decidir se considera ou não os registros inativos.
  - tipo: conceito
    titulo: Índice único e índice filtrado
    texto: Um índice único faz o banco recusar duas linhas com a mesma combinação de valores, aqui produto e SKU (Stock Keeping Unit, o código de estoque da variante). Um índice filtrado, chamado de índice parcial no SQLite, aplica a regra só às linhas que atendem a uma condição, como `WHERE Ativa = 1`, e é assim que uma regra de unicidade passa a respeitar a exclusão lógica.
  - tipo: conceito
    titulo: Migrations, EnsureCreated e Migrate
    texto: Uma migration é uma classe gerada pelo EF Core que descreve uma mudança no esquema do banco. A API cria e atualiza o banco com `Database.Migrate()`, que aplica as migrations em ordem, e os testes de integração, que exercitam a API real com o banco, usam `EnsureCreated`, que monta o banco direto do modelo atual e ignora as migrations. Por isso um teste verde não garante que exista migration para a mudança.
  - tipo: comparativo
    colunas:
    - Escrita (comandos)
    - Leitura (consultas)
    linhas:
    - dimensao: Ferramenta
      valores:
      - EF Core, com rastreamento de mudanças
      - Dapper, com SQL escrito à mão
    - dimensao: Interface
      valores:
      - '`IVarianteCommandRepository`'
      - '`IVarianteQueryRepository`'
    - dimensao: Risco típico
      valores:
      - LINQ que não traduz para SQL e só falha em execução
      - Filtro esquecido, como `Ativa = 1`
    - dimensao: Acompanha o esquema
      valores:
      - Pelas migrations geradas do modelo
      - Pelo SQL, revisado à mão a cada mudança
  - tipo: adr
    id: ADR-0002
    titulo: 'CQRS: EF Core para Escrita e Dapper para Leitura'
    status: accepted
    contexto: Escritas se beneficiam de ORM e rastreamento, e leituras com filtros e paginação pedem controle do SQL.
    decisao: EF Core nos repositórios de comando e Dapper nos repositórios de consulta.
    alternativas: EF Core para tudo e Dapper para tudo.
    consequencias: Leituras explícitas e escritas concisas, com dois mecanismos de acesso para manter.
  - tipo: adr
    id: ADR-0005
    titulo: Soft Delete para Deleção Lógica de Produtos
    status: accepted
    contexto: Produtos excluídos precisam continuar no banco para auditoria e para os pedidos que os referenciam.
    decisao: Coluna `Ativo`, com todas as consultas filtrando `Ativo = 1`.
    alternativas: Remoção física, tabela de histórico e tabelas temporais.
    consequencias: Registros preservados, e cada consulta que esquece o filtro expõe dados inativos.
  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: Esta parte da aba mostra, no commit `702145a`, a consulta de escrita que falha, o mapeamento do SKU como value object e o índice único do banco, que juntos explicam as duas falhas do laboratório. Clique nos marcadores para ler a explicação de cada linha.

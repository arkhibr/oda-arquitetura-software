- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o caminho de um SKU desativado e recriado em cada estado do laboratório, para separar o que a aplicação confere do que o banco confere. Depois, classifique cada consulta pelo modo como trata os registros excluídos.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: SKU (Stock Keeping Unit)
      definicao: Código que identifica de forma única um item de estoque. Na API, cada variante de produto, como uma cor ou um tamanho, tem um SKU próprio, como `MOUSE-ROSA`.
    - termo: Exclusão lógica (soft delete)
      definicao: Técnica em que excluir um registro apenas marca uma coluna, como `Ativo` ou `Ativa`, com falso, e a linha continua na tabela. Toda consulta e toda regra de unicidade precisa então decidir se considera ou não as linhas marcadas.
      referencia:
        rotulo: 'Microsoft Learn: filtros de consulta globais no EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/filters
    - termo: Value object (objeto de valor)
      definicao: Objeto do domínio definido apenas pelos seus valores, sem identidade própria, e por isso dois value objects com os mesmos valores são iguais. Na API, o SKU é um value object que o EF Core grava como texto por meio de uma conversão.
      referencia:
        rotulo: 'Martin Fowler: Value Object'
        url: https://martinfowler.com/bliki/ValueObject.html
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional (ORM) da Microsoft para .NET, que traduz consultas escritas em C# para SQL e acompanha as mudanças nos objetos para gravá-las no banco. Na API, ela cuida das escritas e das migrations.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: Índice único e índice filtrado
      definicao: Um índice único impede que duas linhas tenham a mesma combinação de valores nas colunas indexadas. Um índice filtrado, chamado de índice parcial no SQLite, só considera as linhas que atendem a uma condição, como `WHERE Ativa = 1`.
      referencia:
        rotulo: 'SQLite: partial indexes'
        url: https://www.sqlite.org/partialindex.html
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, como criar uma tabela ou trocar um índice, com um método `Up` que aplica a mudança e um `Down` que a desfaz. As migrations são aplicadas em ordem, e o histórico delas fica gravado no próprio banco.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: Dapper
      definicao: Biblioteca .NET que executa SQL escrito à mão e converte as linhas do resultado em objetos, sem rastrear mudanças. Na API, ela atende as consultas de leitura.
  - tipo: fluxo
    titulo: Reaproveitar o SKU MOUSE-ROSA
    etapas:
    - titulo: Criação
      descricao: '`VarianteService` pergunta a `SkuExisteParaProdutoAsync` se o SKU já existe. No commit, a pergunta falha com `could not be translated`, e a resposta é 500.'
    - titulo: Consulta corrigida
      descricao: Comparando o value object inteiro, o EF Core gera `WHERE ProdutoId = 2 AND Sku = 'MOUSE-ROSA' AND Ativa = 1`, e a criação responde 201.
    - titulo: Desativação
      descricao: '`DELETE /api/v1/catalogo/variantes/1` muda `Ativa` para 0, e a linha continua na tabela.'
    - titulo: Recriação
      descricao: A aplicação não encontra SKU ativo e grava, e o índice único, que vale para todas as linhas, recusa a inserção.
    - titulo: Índice filtrado
      descricao: Com `WHERE Ativa = 1` no índice, gravado pela migration, a linha desativada não disputa o SKU, e a recriação responde 201.
  - tipo: classificador
    enunciado: Como cada operação trata os registros excluídos no commit de referência?
    categorias:
    - id: respeita
      rotulo: Respeita a exclusão
    - id: ignora
      rotulo: Ignora a exclusão
    itens:
    - texto: '`GET /api/v1/catalogo/produtos/1` depois do `DELETE`'
      categoria: respeita
      explicacao: Responde 404, com `Ativo = 1` no SQL.
    - texto: '`GET /api/v1/catalogo/atributos?produtoId=1` depois do `DELETE` do produto'
      categoria: ignora
      explicacao: Os atributos do produto excluído continuam listados.
    - texto: '`POST /api/v1/catalogo/atributos` para o produto excluído'
      categoria: ignora
      explicacao: Responde 201 e grava o atributo.
    - texto: Listagem de variantes ativas de um produto
      categoria: respeita
      explicacao: '`Ativa = 1` no SQL do Dapper.'
    - texto: Índice único de produto e SKU
      categoria: ignora
      explicacao: Conta também as variantes desativadas.
    - texto: Verificação de SKU no serviço
      categoria: respeita
      explicacao: Filtra `v.Ativa` na consulta.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer a criação de variantes voltar a funcionar e liberar o SKU das variantes excluídas, corrigindo a consulta que o EF Core não traduz e filtrando o índice único pelas variantes ativas por meio de uma migration. Os passos 1 e 2 reproduzem a falha pela API, os passos 3 a 7 escrevem o teste e mudam consulta e modelo, e os passos 8 a 10 geram a migration e conferem o banco. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, como criar uma tabela ou trocar um índice, com um método `Up` que aplica a mudança e um `Down` que a desfaz. As migrations são aplicadas em ordem, e o histórico delas fica gravado no próprio banco.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: SKU (Stock Keeping Unit)
      definicao: Código que identifica de forma única um item de estoque. Na API, cada variante de produto, como uma cor ou um tamanho, tem um SKU próprio, como `MOUSE-ROSA`.
    - termo: EF Core (Entity Framework Core)
      definicao: Biblioteca de mapeamento objeto-relacional (ORM) da Microsoft para .NET, que traduz consultas escritas em C# para SQL e acompanha as mudanças nos objetos para gravá-las no banco. Na API, ela cuida das escritas e das migrations.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: LINQ (Language Integrated Query)
      definicao: Recurso do C# para escrever consultas como expressões da própria linguagem, como `Where` e `AnyAsync`. O EF Core traduz essas expressões para SQL durante a execução, e uma expressão que ele não sabe traduzir gera erro nesse momento.
      referencia:
        rotulo: 'Microsoft Learn: avaliação de consultas no cliente e no servidor'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/client-eval
    - termo: Índice único e índice filtrado
      definicao: Um índice único impede que duas linhas tenham a mesma combinação de valores nas colunas indexadas. Um índice filtrado, chamado de índice parcial no SQLite, só considera as linhas que atendem a uma condição, como `WHERE Ativa = 1`.
      referencia:
        rotulo: 'SQLite: partial indexes'
        url: https://www.sqlite.org/partialindex.html
    - termo: JWT (JSON Web Token) e token Bearer
      definicao: 'Token assinado que a API emite no login e que o cliente envia no cabeçalho `Authorization: Bearer <token>` para provar quem é. O laboratório obtém esse token antes de criar variantes.'
      referencia:
        rotulo: 'IETF: RFC 7519, JSON Web Token'
        url: https://datatracker.ietf.org/doc/html/rfc7519
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, serviços e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests` e sobem a API com a classe `ApiFactory`.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a subir quando o modelo tem mudanças que nenhuma migration descreve, o aviso `PendingModelChangesWarning`.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: dotnet-ef
      definicao: Ferramenta de linha de comando do EF Core que gera, lista e aplica migrations, instalada como ferramenta local do repositório pelo arquivo `dotnet-tools.json`.
      referencia:
        rotulo: 'Microsoft Learn: referência da CLI do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/cli/dotnet
    - termo: SQLite
      definicao: Banco de dados relacional que guarda tudo num único arquivo e roda dentro do próprio processo da aplicação, sem servidor separado. A API grava os dados no arquivo `produtos-api.db`.
      referencia:
        rotulo: 'SQLite: about SQLite'
        url: https://www.sqlite.org/about.html
  - tipo: faixa
    estilo: objetivo
    problema: Em `EfVarianteCommandRepository.cs`, a consulta `SkuExisteParaProdutoAsync` compara `v.Sku.Valor`, que não é coluna, e o EF Core recusa a tradução com `could not be translated`. Em `AppDbContext.cs`, o índice único `idx_variante_produto_sku` vale para todas as linhas, inclusive as variantes desativadas com `Ativa = 0`.
    impacto: Nenhuma variante de produto pode ser criada, porque toda tentativa responde 500. Depois da primeira correção, o SKU de uma variante excluída continua bloqueado, e a exclusão lógica passa a impedir um cadastro que o negócio permite.
    mecanismo: O laboratório aplica três mecanismos, na ordem. A consulta passa a comparar o value object inteiro, `v.Sku == alvo`, que o EF Core traduz pela conversão de valor, o índice ganha o filtro `Ativa = 1`, que restringe a unicidade às variantes ativas, e uma migration gerada com o `dotnet-ef` leva o índice novo ao banco.
    comprovacao: 'O teste `VarianteSkuTests` falha com três respostas 500 antes da correção e passa com `Aprovado: 3` depois, com a suíte inteira em `Aprovado: 146`. Pela API, criar, desativar e recriar o mesmo SKU responde 201, 204 e 201, e o `sqlite3` mostra o índice com `WHERE Ativa = 1`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir a API com o banco do seed
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db && dotnet run --launch-profile http
      sucesso: '`Now listening on: http://localhost:5000`.'

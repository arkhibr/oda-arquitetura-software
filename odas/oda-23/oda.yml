        - 'curl -s -w '' %{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"produtoId":2,"sku":"MOUSE-ROSA","descricao":"Cor rosa","precoAdicional":10,"estoque":3}'' http://localhost:5000/api/v1/catalogo/variantes'
      sucesso: '500, e no log `System.InvalidOperationException: The LINQ expression ''DbSet<Variante>()`.'
    - titulo: Escrever o teste do SKU
      texto: 'Crie o arquivo abaixo, com três casos: SKU novo, SKU repetido e SKU de uma variante desativada.'
      editor:
        rotulo: arquivo

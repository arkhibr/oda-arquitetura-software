        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a subir quando o modelo tem mudanças que nenhuma migration descreve, o aviso `PendingModelChangesWarning`.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: Exclusão lógica (soft delete)
      definicao: Técnica em que excluir um registro apenas marca uma coluna, como `Ativo` ou `Ativa`, com falso, e a linha continua na tabela. Toda consulta e toda regra de unicidade precisa então decidir se considera ou não as linhas marcadas.
      referencia:
        rotulo: 'Microsoft Learn: filtros de consulta globais no EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/querying/filters
  - tipo: quiz
    perguntas:
    - enunciado: Por que a API usa Dapper na leitura?
      alternativas:
      - texto: Porque o EF Core não lê dados.
        correta: false
        explicacao: O lado de escrita também lê pelo EF Core.
      - texto: Porque o Dapper cria as migrations.
        correta: false
        explicacao: As migrations são do EF Core.
      - texto: Para escrever e revisar o SQL das consultas de listagem.
        correta: true
        explicacao: A escrita fica com o EF Core e o rastreamento de mudanças.
    - enunciado: Quando o EF Core descobre que não consegue traduzir uma consulta?
      alternativas:
      - texto: Na execução da consulta.
        correta: true
        explicacao: Por isso o erro aparece como 500 numa requisição.
      - texto: Na compilação.
        correta: false
        explicacao: O compilador só vê uma expressão LINQ.
      - texto: Na migration.
        correta: false
        explicacao: A migration não executa consultas da aplicação.
    - enunciado: O que o filtro `WHERE Ativa = 1` no índice faz?
      alternativas:
      - texto: Acelera a exclusão.
        correta: false
        explicacao: O efeito é sobre a unicidade.
      - texto: Aplica a unicidade só às variantes ativas.
        correta: true
        explicacao: A variante desativada libera o SKU.
      - texto: Apaga as variantes inativas.
        correta: false
        explicacao: As linhas continuam na tabela.
    - enunciado: Por que um teste de integração verde não garante a migration?
      alternativas:
      - texto: Porque os testes não usam banco.
        correta: false
        explicacao: Eles usam SQLite.
      - texto: Porque migrations só valem em produção.
        correta: false
        explicacao: A API aplica as migrations em todo ambiente.
      - texto: Porque o banco dos testes vem de `EnsureCreated`, do modelo atual.
        correta: true
        explicacao: A API usa `Migrate()`.
    - enunciado: Qual custo da exclusão lógica o laboratório tornou visível?
      alternativas:
      - texto: Cada consulta e cada regra de unicidade precisa decidir o que fazer com os registros inativos.
        correta: true
        explicacao: O índice e os atributos não tinham decidido.
      - texto: O banco fica mais lento.
        correta: false
        explicacao: O laboratório não mediu desempenho.
      - texto: Os pedidos antigos quebram.
        correta: false
        explicacao: A exclusão lógica existe justamente para preservá-los.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A divisão entre escrita com EF Core e leitura com Dapper está clara.
    - A consulta de SKU passou a ser traduzida, e a criação de variante respondeu 201.
    - O índice único passou a considerar só as variantes ativas.
    - A migration foi gerada, e a API voltou a iniciar.
    - As operações que ignoram a exclusão lógica foram identificadas.

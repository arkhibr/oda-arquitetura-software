    cenarios:
    - rotulo: Tentativas de login
      comando: 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
    - rotulo: Login pelo IPv6
      comando: 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
    - rotulo: 25 pedidos
      comando: 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
    - rotulo: Testes de limite
      comando: dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
    - rotulo: Expiração do token
      comando: 'for s in 600 -120 -600; do printf ''%s: '' $s; curl -s -o /dev/null -w ''%{http_code}\n'' -H "Authorization: Bearer $(python3 token.py $s)" http://localhost:5000/api/v1/pedidos; done'
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que aparecem ao proteger essa API, cada uma com a saída que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Um cliente bloqueia a leitura de todos
    origem: executado
    rotulo_saida: log
    saida: "# cliente 127.0.0.1\n  60 200\n   1 429\n\n# cliente ::1, primeira chamada\nHTTP/1.1 429 Too Many Requests\nRetry-After: 60\n{\"erro\":\"Too Many Requests\",\"mensagem\":\"Limite de requisições excedido. Tente novamente em breve.\"}"
    pergunta: O segundo cliente não tinha feito nenhuma chamada. Por que recebeu 429?
    correcao: Registrar a leitura com `AddPolicy` e `RateLimitPartition` por IP, como a política de login do passo 6.
    alternativas:
    - texto: O `Retry-After` vale para todos os clientes.
      correta: false
      explicacao: O cabeçalho só informa a espera ao cliente recusado.
    - texto: A política `leitura` tem um contador único para a API inteira, e o primeiro cliente gastou as 60 permissões do minuto.
      correta: true
      explicacao: Um robô de raspagem derruba a leitura de todos os usuários.
    - texto: Os dois clientes têm o mesmo IP.
      correta: false
      explicacao: Um chegou por IPv4, e o outro, por IPv6.
  - tipo: incidente
    titulo: Senhas testadas sem limite
    origem: executado
    rotulo_saida: log
    saida: "$ trinta tentativas de login com senhas erradas\n  30 401"
    pergunta: Por que nenhuma das trinta tentativas foi recusada por excesso?
    correcao: Aplicar uma política particionada por IP ao login, como nos passos 6 e 8.
    alternativas:
    - texto: O limite só conta tentativas com senha certa.
      correta: false
      explicacao: Não havia limite nenhum na rota.
    - texto: O JWT impede tentativas de senha.
      correta: false
      explicacao: O login é a rota que emite o token.
    - texto: O endpoint de login é anônimo e não declara nenhuma política, e as três políticas do Catálogo só valem onde são pedidas.
      correta: true
      explicacao: Depois do laboratório, a sexta tentativa recebe 429.
  - tipo: incidente
    titulo: Token vencido que ainda abre a API
    origem: executado
    rotulo_saida: log
    saida: "válido: 200 \noutra chave: 401 WWW-Authenticate: Bearer error=\"invalid_token\", error_description=\"The signature key was not found\"\n\nvencido há 2 min: 200 \nvencido há 10 min: 401 WWW-Authenticate: Bearer error=\"invalid_token\", error_description=\"The token expired at '11/02/2026 00:48:58'\""
    pergunta: Por que o token vencido há 2 minutos recebeu 200?
    correcao: Definir `ClockSkew` em `TokenValidationParameters` com a tolerância aceita, como `TimeSpan.FromSeconds(30)`.
    alternativas:
    - texto: A validação de expiração tolera cinco minutos de diferença de relógio, e o padrão não foi alterado no `Program.cs`.
      correta: true
      explicacao: O token vencido há 10 minutos recebeu 401 com `The token expired at`.
    - texto: A API não confere a expiração.
      correta: false
      explicacao: '`ValidateLifetime = true` e o token de 10 minutos foi recusado.'
    - texto: O token foi renovado automaticamente.
      correta: false
      explicacao: A API não tem renovação de token.
  - tipo: incidente
    titulo: Limite que não soma entre instâncias
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/Catalogo/Catalogo.API/Extensions/RateLimitingExtensions.cs:33-40\n            // Política 1: leitura — fixed window, 60 req/min\n            options.AddFixedWindowLimiter(\"leitura\", opt =>\n            {\n                opt.Window = TimeSpan.FromMinutes(1);\n                opt.PermitLimit = 60;\n                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;\n                opt.QueueLimit = 0;\n            });"
    pergunta: A API passa a rodar em três instâncias atrás de um balanceador. Quantas leituras por minuto a API inteira aceita?
    correcao: Aplicar o limite num ponto comum, como o gateway, ou num contador compartilhado, como o Redis, se o limite precisa valer para o conjunto.
    alternativas:
    - texto: 20, porque o balanceador divide o limite.
      correta: false
      explicacao: O balanceador não conhece o limite.
    - texto: Até 180, porque cada instância tem o próprio contador na memória do processo.
      correta: true
      explicacao: A ADR-0013 registra essa limitação.
    - texto: 60, porque o limite é da API.
      correta: false
      explicacao: Os contadores não são compartilhados.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que a política de login é particionada por IP?
      alternativas:
      - texto: Para acelerar o login.
        correta: false
        explicacao: A partição não muda a velocidade.
      - texto: Porque o login exige token.
        correta: false
        explicacao: O login é anônimo.
      - texto: Para que as tentativas de um cliente não bloqueiem o login dos outros.
        correta: true
        explicacao: O cliente IPv6 entrou enquanto o IPv4 recebia 429.
    - enunciado: Que algoritmo admite uma rajada na virada do minuto?
      alternativas:
      - texto: A janela fixa.
        correta: true
        explicacao: O contador zera de uma vez no início de cada janela.
      - texto: A janela deslizante.
        correta: false
        explicacao: Ela descarta segmentos aos poucos.
      - texto: O balde de tokens.
        correta: false
        explicacao: Ele limita pela reposição dos tokens.
    - enunciado: Que resposta um cliente recebe ao exceder um limite?
      alternativas:
      - texto: '503.'
        correta: false
        explicacao: A API está disponível.
      - texto: 429 com o cabeçalho `Retry-After`.
        correta: true
        explicacao: O `OnRejected` grava o cabeçalho e o corpo.
      - texto: '401.'
        correta: false
        explicacao: 401 é falta de autenticação.
    - enunciado: Por que um token vencido há 2 minutos foi aceito?
      alternativas:
      - texto: Porque a chave é a mesma.
        correta: false
        explicacao: A chave confere a assinatura, e não a validade.
      - texto: Porque o emissor é a própria API.
        correta: false
        explicacao: O emissor não afeta a expiração.
      - texto: Pela tolerância padrão de cinco minutos de relógio.
        correta: true
        explicacao: O `ClockSkew` não foi configurado.
    - enunciado: Por que os testes de limite usam duas classes?
      alternativas:
      - texto: Para que cada classe tenha a própria API de teste e os contadores não interfiram.
        correta: true
        explicacao: O `IClassFixture` cria uma instância por classe.
      - texto: Porque o xUnit exige uma classe por teste.
        correta: false
        explicacao: Uma classe pode ter vários testes.
      - texto: Para rodar em paralelo mais rápido.
        correta: false
        explicacao: O motivo é o isolamento dos contadores.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O que o JWT confere e a tolerância de relógio estão claros.
    - O contador compartilhado da leitura foi demonstrado com dois clientes.
    - Os testes falharam antes das políticas e passaram depois.
    - O login passou a recusar a sexta tentativa por IP, e os pedidos, o 21º por minuto.
    - O limite por processo e o efeito de várias instâncias estão claros.

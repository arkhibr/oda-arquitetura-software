- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, a sequência de tentativas de login de dois clientes antes e depois da política particionada. Depois, classifique a política adequada a cada rota.
  - tipo: fluxo
    titulo: Dois clientes tentam entrar
    etapas:
    - titulo: 'Antes: cliente A'
      descricao: 'O cliente em `127.0.0.1` envia trinta senhas erradas em um minuto, e cada uma recebe 401: nada limita a rota.'
    - titulo: 'Depois: cliente A'
      descricao: A política `login` cria a partição `127.0.0.1` com cinco permissões. As cinco primeiras recebem 401, e as demais, 429.
    - titulo: 'Depois: cliente B'
      descricao: O cliente em `::1` cai noutra partição, com cinco permissões próprias, e entra com a senha certa.
    - titulo: Virada da janela
      descricao: Um minuto depois do início da janela, a partição de A volta a ter cinco permissões.
    - titulo: Leitura, para comparar
      descricao: 'A política `leitura` não tem partição: quando A gasta as 60 leituras, B recebe 429 na primeira chamada.'
  - tipo: classificador
    enunciado: Que política cabe a cada rota?
    categorias:
    - id: login
      rotulo: login, por IP
    - id: escrita
      rotulo: escrita
    - id: leitura
      rotulo: leitura
    - id: criacao
      rotulo: criacao-produto
    itens:
    - texto: '`POST /api/v1/auth/login`'
      categoria: login
      explicacao: Rota anônima, alvo de tentativa de senha.
    - texto: '`POST /api/v1/pedidos`'
      categoria: escrita
      explicacao: Mutação autenticada, como as escritas do Catálogo.
    - texto: '`GET /api/v1/catalogo/produtos`'
      categoria: leitura
      explicacao: Leitura pública.
    - texto: '`POST /api/v1/catalogo/produtos`'
      categoria: criacao
      explicacao: Criação de produto, com balde de cinco tokens.
    - texto: '`POST /api/v1/pedidos/{id}/cancelar`'
      categoria: escrita
      explicacao: Mutação de pedido.
    - texto: '`GET /api/v1/catalogo/categorias/{id}`'
      categoria: leitura
      explicacao: Leitura pública.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é limitar as tentativas de login por cliente e os pedidos por minuto, e conferir a expiração do token. Os passos 1 a 3 sobem a API e medem o comportamento atual, os passos 4 a 7 escrevem os testes e acrescentam as políticas, e os passos 8 e 9 repetem a medição e testam tokens montados à mão. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir a API
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db && dotnet run --launch-profile http
      sucesso: '`Now listening on: http://localhost:5000`.'
    - titulo: Medir login e pedidos
      texto: Noutro terminal, envie trinta senhas erradas pelo IPv4, entre com a senha certa pelo IPv6 e crie 25 pedidos.
      editor:
        rotulo: terminal
        linhas:
        - 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'' | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      sucesso: '`30 401`, `200` e `25 201`: nenhuma recusa por excesso.'
    - titulo: Medir a leitura com dois clientes
      texto: Reinicie a API, faça 61 leituras pelo IPv4 e uma pelo IPv6.
      editor:
        rotulo: terminal
        linhas:
        - for i in $(seq 1 61); do curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5000/api/v1/catalogo/produtos; done | sort | uniq -c
        - curl -s -i 'http://[::1]:5000/api/v1/catalogo/produtos' | tr -d '\r' | grep -E '^HTTP|^Retry-After|^\{"erro'
      sucesso: '`60 200` e `1 429` no IPv4, e `429` com `Retry-After` na primeira leitura do IPv6.'
    - titulo: Escrever os testes de limite
      texto: Crie o arquivo abaixo, com duas classes para que cada uma tenha a própria API de teste e os próprios contadores.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/LimitesDeAbusoTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using FluentAssertions;
        - using ProdutosAPI.Pedidos.CreatePedido;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration;
        - ''
        - 'public class LoginLimiteTests : IClassFixture<RateLimitingApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public LoginLimiteTests(RateLimitingApiFactory factory) => _client = factory.CreateClient();'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Login_TentativasSeguidas_Retorna429()'
        - '    {'
        - '        var codigos = new List<HttpStatusCode>();'
        - '        for (var i = 0; i < 4; i++)'
        - '        {'
        - '            var r = await _client.PostAsJsonAsync("/api/v1/auth/login", new { email = "admin@example.com", senha = $"chute{i}" });'
        - '            codigos.Add(r.StatusCode);'
        - '        }'
        - ''
        - '        codigos.Should().Equal(HttpStatusCode.Unauthorized, HttpStatusCode.Unauthorized, HttpStatusCode.Unauthorized, HttpStatusCode.TooManyRequests);'
        - '    }'
        - '}'
        - ''
        - 'public class PedidosLimiteTests : IClassFixture<RateLimitingApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public PedidosLimiteTests(RateLimitingApiFactory factory) => _client = factory.CreateClient();'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Pedidos_AcimaDoLimiteDeEscrita_Retorna429()'
        - '    {'
        - '        var token = await AuthHelper.ObterTokenAsync(_client);'
        - '        _client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", token);'
        - ''
        - '        var codigos = new List<HttpStatusCode>();'
        - '        for (var i = 0; i < 4; i++)'
        - '            codigos.Add((await _client.PostAsJsonAsync("/api/v1/pedidos", new CreatePedidoCommand([new(2, 1)]))).StatusCode);'
        - ''
        - '        codigos.Last().Should().Be(HttpStatusCode.TooManyRequests);'
        - '    }'
        - '}'
      efeito: teste_limites
    - titulo: Ver os testes falharem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
      sucesso: '`Com falha: 2`, com `differs at index 3` no login e `found HttpStatusCode.Created` nos pedidos.'
    - titulo: Criar a política de login e aplicar as políticas
      texto: Faça as mudanças abaixo. A política de login é particionada por IP, e os pedidos passam a usar a política `escrita` que já existe.
      editor:
        rotulo: arquivo
        caminho: RateLimitingExtensions.cs, AuthEndpoints.cs, endpoints de Pedidos e RateLimitingApiFactory.cs (alteração)
        commit: 702145a
        linhas:
        - // src/Catalogo/Catalogo.API/Extensions/RateLimitingExtensions.cs
        - '// 1. Em AddCatalogoRateLimiting, depois da política criacao-produto:'
        - '            // Política 4: login — fixed window por IP, 5 tentativas/min'
        - '            AdicionarPoliticaLogin(options, 5);'
        - ''
        - '// 2. Novo método na classe:'
        - '    // Particionada por IP: as tentativas de um cliente não consomem a cota dos outros.'
        - '    private static void AdicionarPoliticaLogin(RateLimiterOptions options, int limite) =>'
        - '        options.AddPolicy("login", context => RateLimitPartition.GetFixedWindowLimiter('
        - '            context.Connection.RemoteIpAddress?.ToString() ?? "desconhecido",'
        - '            _ => new FixedWindowRateLimiterOptions { Window = TimeSpan.FromMinutes(1), PermitLimit = limite, QueueLimit = 0 }));'
        - ''
        - '// 3. Em AddCatalogoRateLimitingWithLimits, novo parâmetro e a mesma política no fim:'
        - '        int leituraLimit, int escritaLimit, int criacaoProdutoLimit, int loginLimit = 10000)'
        - '            AdicionarPoliticaLogin(options, loginLimit);'
        - ''
        - '// src/Catalogo/Catalogo.API/Endpoints/Auth/AuthEndpoints.cs: no fim do MapPost("/login")'
        - '            .AllowAnonymous()'
        - '            .RequireRateLimiting("login");'
        - ''
        - '// CreatePedidoEndpoint.cs, AddItemEndpoint.cs e CancelPedidoEndpoint.cs: no fim do Map'
        - '        .RequireAuthorization()'
        - '        .RequireRateLimiting("escrita");'
        - ''
        - // tests/ProdutosAPI.Tests/Integration/RateLimitingApiFactory.cs
        - '        services.AddCatalogoRateLimitingWithLimits(leituraLimit: 3, escritaLimit: 3, criacaoProdutoLimit: 2, loginLimit: 3);'
      efeito: limites_aplicados
    - titulo: Ver os testes passarem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 2` e a suíte com `Aprovado: 145`.'
    - titulo: Medir de novo
      texto: Reinicie a API e repita as chamadas do passo 2.
      editor:
        rotulo: terminal
        linhas:
        - 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'' | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      sucesso: '`5 401` e `25 429` no IPv4, `200` no IPv6, e `20 201` e `5 429` nos pedidos.'
    - titulo: Testar a expiração do token
      texto: Salve o script abaixo como `token.py` na raiz do repositório, para montar tokens com a chave de `appsettings.json` e a validade que você escolher, em segundos. Com a API no ar, gere e use um token válido por 10 minutos, um vencido há 2 minutos e um vencido há 10 minutos.
      editor:
        rotulo: arquivo
        caminho: token.py (novo, só para o teste)
        commit: 702145a
        linhas:
        - '"""Gera um JWT HS256 para a API: python3 oda24-token.py <segundos até expirar> [chave]."""'
        - import base64, hashlib, hmac, json, sys, time
        - 'b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=").decode()'
        - chave = sys.argv[2] if len(sys.argv) > 2 else "MinhaChaveSuperSecretaDePeloMenos32BytesAki123!"
        - 'corpo = {"sub": "admin_id", "iss": "ProdutosAPI", "aud": "TodosOsClientes", "exp": int(time.time()) + int(sys.argv[1])}'
        - 'base = b64(json.dumps({"alg": "HS256", "typ": "JWT"}).encode()) + "." + b64(json.dumps(corpo).encode())'
        - print(base + "." + b64(hmac.new(chave.encode(), base.encode(), hashlib.sha256).digest()))
        - ''
        - '# no terminal:'
        - 'for s in 600 -120 -600; do printf ''%s: '' $s; curl -s -o /dev/null -w ''%{http_code}\n'' -H "Authorization: Bearer $(python3 token.py $s)" http://localhost:5000/api/v1/pedidos; done'
      sucesso: '`600: 200`, `-120: 200` e `-600: 401`.'
  - tipo: terminal
    titulo: terminal · net-minimal-api
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"

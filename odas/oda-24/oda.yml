    - entrada: for i in $(seq 1 61); do curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5000/api/v1/catalogo/produtos; done | sort | uniq -c
      saida: "  60 200\n   1 429"
      origem: executado
    - entrada: curl -s -i 'http://[::1]:5000/api/v1/catalogo/produtos' | tr -d '\r' | grep -E '^HTTP|^Retry-After|^\{"erro'
      saida: 'HTTP/1.1 429 Too Many Requests

        Retry-After: 60

        {"erro":"Too Many Requests","mensagem":"Limite de requisições excedido. Tente novamente em breve."}'
      origem: executado
      dica: 'Este cliente não fez nenhuma leitura antes: o contador de leitura é um só para todos.'
    - entrada: 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'' | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
      saida: ''
      origem: executado
    - entrada: 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      condicao: limites_aplicados
      saida: "  20 201\n   5 429"
      origem: executado
      dica: A política `escrita` admite 20 por minuto.
    - entrada: 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      saida: '  25 201'
      origem: executado
      dica: 'Vinte e cinco pedidos em sequência: as rotas de Pedidos não têm política.'
    - entrada: 'for s in 600 -120 -600; do printf ''%s: '' $s; curl -s -o /dev/null -w ''%{http_code}\n'' -H "Authorization: Bearer $(python3 token.py $s)" http://localhost:5000/api/v1/pedidos; done'
      saida: '600: 200

        -120: 200

        -600: 401'
      origem: executado
      dica: O token vencido há 120 segundos ainda passa. Veja o Diagnóstico.
    - entrada: dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
      condicao:

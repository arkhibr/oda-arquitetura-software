id: '24'
titulo: Segurança da API com JWT e rate limiting
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O objetivo desta ODA é aprender a proteger uma API em duas frentes: a autenticação por token JWT, que diz quem pode chamar cada rota, e o rate limiting, que limita quantas vezes uma rota pode ser chamada por minuto. Na API `net-minimal-api`, o login aceita trinta senhas erradas seguidas, os pedidos não têm limite, e você vai criar uma política de login por IP e aplicar a política de escrita aos pedidos, com o teste escrito antes.'
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que a API confere num token JWT e o que acontece quando a conferência falha.
    - Escolher entre janela fixa, janela deslizante e balde de tokens para cada tipo de rota.
    - Reconhecer uma política sem partição, em que um cliente consome a cota de todos.
    - Criar uma política de login particionada por IP e aplicá-la, com o teste escrito antes.
    - Identificar rotas sem política e a tolerância de relógio na expiração do token.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git, do `curl` e do Python 3, usado para montar tokens de teste. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e a faixa do Laboratório mostra como obtê-lo. O laboratório chama a API por `127.0.0.1` e por `[::1]` para simular dois clientes, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · trinta senhas erradas
    comandos:
    - entrada: rm -f produtos-api.db && dotnet run --launch-profile http
      saida: 'Now listening on: http://localhost:5000

        Application started. Press Ctrl+C to shut down.

        Hosting environment: Development'
      origem: executado
      dica: 'Reinicie a API antes de cada bloco de chamadas: os contadores ficam na memória do processo.'
    - entrada: 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
      saida: '  30 401'
      origem: executado
    cenarios:
    - rotulo: Subir a API
      comando: rm -f produtos-api.db && dotnet run --launch-profile http
    - rotulo: Trinta tentativas de login
      comando: 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as duas proteções e como escolher o algoritmo de limite para cada rota. No repositório, a ADR-0007 registra o uso de JWT com credenciais em configuração, e a ADR-0013 registra as três políticas de rate limiting do Catálogo.
  - tipo: comparativo
    colunas:
    - Como conta
    - Uso na API
    linhas:
    - dimensao: Janela fixa
      valores:
      - Zera o contador a cada minuto cheio, e admite rajada na virada
      - '`leitura`, 60 por minuto, e `login`, 5 por minuto por IP'
    - dimensao: Janela deslizante
      valores:
      - Divide o minuto em seis segmentos e descarta os mais antigos
      - '`escrita`, 20 por minuto'
    - dimensao: Balde de tokens
      valores:
      - Gasta um token por chamada e repõe os tokens por período
      - '`criacao-produto`, 5 por minuto'
    - dimensao: Particionada
      valores:
      - Um contador por chave, como o IP ou o usuário
      - Só a política `login`, depois do laboratório
  - tipo: conceito
    titulo: O que o JWT prova
    texto: A API aceita o token se a assinatura confere com a chave, se o emissor e a audiência são os esperados e se ele não venceu. A validação de expiração tolera, por padrão, cinco minutos de diferença de relógio entre quem emitiu e quem valida.
  - tipo: conceito
    titulo: Partição
    texto: Uma política registrada com `AddFixedWindowLimiter` tem um contador único para toda a API, e o cliente que esgota a cota bloqueia todos os outros. Com `AddPolicy` e `RateLimitPartition`, cada chave ganha o próprio contador, e o limite passa a valer por cliente.
  - tipo: adr
    id: ADR-0013
    titulo: Rate Limiting no Servidor com Três Políticas Diferenciadas
    status: accepted
    contexto: O Catálogo expõe leituras públicas e escritas protegidas, com padrões de tráfego e de risco diferentes.
    decisao: 'Três políticas nativas do ASP.NET: `leitura`, `escrita` e `criacao-produto`.'
    alternativas: Uma política global e uma biblioteca externa com limites por IP e por usuário.
    consequencias: Sem dependências externas, com contadores por processo, que não se somam entre instâncias.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, a validação do token, as políticas de limite e duas rotas que não usam nenhuma delas. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - var jwtKey = builder.Configuration["Jwt:Key"] ?? "MinhaChaveSuperSecretaDePeloMenos32BytesAki123!";
    - builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
    - '    .AddJwtBearer(options =>'
    - '    {'
    - '        options.TokenValidationParameters = new TokenValidationParameters'
    - '        {'
    - '            ValidateIssuer = true,'
    - '            ValidateAudience = true,'
    - '            ValidateLifetime = true,'
    - '            ValidateIssuerSigningKey = true,'
    - '            ValidIssuer = builder.Configuration["Jwt:Issuer"] ?? "ProdutosAPI",'
    - '            ValidAudience = builder.Configuration["Jwt:Audience"] ?? "TodosOsClientes",'
    - '            IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(jwtKey))'
    - '        };'
    - '    });'
    anotacoes:
    - linha: 137
      texto: Confere a expiração, com a tolerância padrão de relógio.
    - linha: 141
      texto: A mesma chave assina e valida, lida de `appsettings.json`.
    inicio: 129
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Extensions/RateLimitingExtensions.cs
    commit: 702145a
    linhas:
    - '            // Política 1: leitura — fixed window, 60 req/min'
    - '            options.AddFixedWindowLimiter("leitura", opt =>'
    - '            {'
    - '                opt.Window = TimeSpan.FromMinutes(1);'
    - '                opt.PermitLimit = 60;'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    - ''
    - '            // Política 2: escrita — sliding window, 20 req/min'
    - '            options.AddSlidingWindowLimiter("escrita", opt =>'
    - '            {'
    - '                opt.Window = TimeSpan.FromMinutes(1);'
    - '                opt.SegmentsPerWindow = 6;'
    - '                opt.PermitLimit = 20;'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    - ''
    - '            // Política 3: criação de produto — token bucket, 5 req/min'
    - '            options.AddTokenBucketLimiter("criacao-produto", opt =>'
    - '            {'
    - '                opt.TokenLimit = 5;'
    - '                opt.TokensPerPeriod = 5;'
    - '                opt.ReplenishmentPeriod = TimeSpan.FromMinutes(1);'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    anotacoes:
    - linha: 34
      texto: Contador único, compartilhado por todos os clientes.
    - linha: 43
      texto: Janela deslizante de seis segmentos.
    - linha: 53
      texto: Balde de cinco tokens por minuto.
    inicio: 33
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Endpoints/Auth/AuthEndpoints.cs
    commit: 702145a
    linhas:
    - '        group.MapPost("/login", Login).WithName("UserLogin")'
    - '            .Accepts<LoginRequest>("application/json")'
    - '            .Produces<AuthResponse>(StatusCodes.Status200OK)'
    - '            .Produces(StatusCodes.Status401Unauthorized)'
    - '            .AllowAnonymous();'
    anotacoes:
    - linha: 21
      texto: O login é anônimo e não tem política de limite.
    inicio: 17
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CreatePedido/CreatePedidoEndpoint.cs
    commit: 702145a
    linhas:
    - '        .WithName("CriarPedido")'
    - '        .WithTags("Pedidos")'
    - '        .WithSummary("Criar pedido")'
    - '        .WithDescription("Cria um novo pedido em status Rascunho com os itens fornecidos")'
    - '        .Accepts<CreatePedidoCommand>("application/json")'
    - '        .Produces<PedidoResponse>(StatusCodes.Status201Created)'
    - '        .Produces(StatusCodes.Status400BadRequest)'
    - '        .Produces(StatusCodes.Status422UnprocessableEntity)'

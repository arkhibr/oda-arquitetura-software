      origem: executado
    - entrada: dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
      condicao: teste_limites
      saida: "  Com falha ProdutosAPI.Tests.Integration.LoginLimiteTests.POST_Login_TentativasSeguidas_Retorna429 [841 ms]\n   Expected codigos to be equal to {HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.TooManyRequests {value: 429}}, but {HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.Unauthorized {value: 401}, HttpStatusCode.Unauthorized {value: 401}} differs at index 3.\n   at FluentAssertions.Execution.GivenSelectorExtensions.AssertCollectionsHaveSameItems[TActual,TExpected](GivenSelector`1 givenSelector, ICollection`1 expected, Func`3 findIndex)\n  Com falha ProdutosAPI.Tests.Integration.PedidosLimiteTests.POST_Pedidos_AcimaDoLimiteDeEscrita_Retorna429 [921 ms]\n   Expected codigos.Last() to be HttpStatusCode.TooManyRequests {value: 429}, but found HttpStatusCode.Created {value: 201}.\nCom falha! – Com falha:     2, Aprovado:     0, Ignorado:     0, Total:     2, Duração: 921 ms - ProdutosAPI.Tests.dll (net10.0)"
      origem: executado
      dica: A quarta tentativa de login recebe 401, e o quarto pedido recebe 201.
    - entrada: dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
      saida: Nenhum teste corresponde ao filtro de testcase `FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests` determinado no ./tests/ProdutosAPI.Tests/bin/Debug/net10.0/ProdutosAPI.Tests.dll
      origem: executado

id: '24'
titulo: Segurança da API com JWT e rate limiting
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O objetivo desta ODA é fechar duas brechas de proteção da API `net-minimal-api`: o login aceita trinta senhas erradas seguidas, o que deixa a API exposta a ataques de força bruta, e as rotas de pedidos não têm limite, o que permite a um único cliente criar pedidos sem teto. A proteção combina a autenticação por token JWT (JSON Web Token), que diz quem pode chamar cada rota, e o rate limiting, que limita quantas vezes cada cliente pode chamá-la por minuto. Você vai criar uma política de login particionada por IP, aplicar a política de escrita aos pedidos e medir a tolerância de relógio na expiração do token, com o teste escrito antes.'
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: JWT (JSON Web Token)
      definicao: Token em formato JSON, assinado por quem o emite, que carrega informações como o usuário, o emissor, a audiência e a data de expiração. A API emite o token no login e confere a assinatura e esses campos a cada chamada protegida.
      referencia:
        rotulo: 'IETF: RFC 7519, JSON Web Token'
        url: https://datatracker.ietf.org/doc/html/rfc7519
    - termo: Autenticação por token Bearer
      definicao: 'Esquema em que o cliente envia o token no cabeçalho `Authorization: Bearer <token>` e a API aceita a chamada se o token for válido. Uma rota marcada com `RequireAuthorization` recusa com 401 a chamada sem token válido.'
      referencia:
        rotulo: 'Microsoft Learn: autenticação JWT Bearer no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/configure-jwt-bearer-authentication
    - termo: Rate limiting (limitação de taxa)
      definicao: Mecanismo que limita quantas requisições um cliente, ou a API inteira, pode fazer num intervalo de tempo e recusa as excedentes. No ASP.NET Core, as políticas de limite são registradas com nome e só valem nas rotas que as pedem com `RequireRateLimiting`.
      referencia:
        rotulo: 'Microsoft Learn: middleware de limitação de taxa no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/performance/rate-limit
    - termo: Ataque de força bruta
      definicao: Tentativa de descobrir uma senha enviando muitas combinações seguidas à rota de login. Limitar as tentativas por cliente é uma das defesas recomendadas.
      referencia:
        rotulo: 'OWASP: Authentication Cheat Sheet'
        url: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    - termo: Janela fixa, janela deslizante e balde de tokens
      definicao: São três algoritmos de limite. A janela fixa conta as requisições num intervalo que zera de uma vez, a janela deslizante divide o intervalo em segmentos que expiram aos poucos, e o balde de tokens consome um token por requisição e repõe os tokens num ritmo constante.
      referencia:
        rotulo: 'Microsoft Learn: algoritmos de limitação de taxa'
        url: https://learn.microsoft.com/pt-br/aspnet/core/performance/rate-limit
    - termo: Partição de limite
      definicao: Divisão do limite por uma chave, como o IP do cliente, em que cada chave ganha o próprio contador. Sem partição, um único contador vale para todos os clientes, e quem esgota a cota bloqueia os demais.
    - termo: IPv4, IPv6 e endereço de loopback
      definicao: IPv4 e IPv6 são as duas versões do protocolo de endereçamento da internet. O endereço de loopback aponta para a própria máquina, `127.0.0.1` no IPv4 e `::1` no IPv6, e o laboratório usa os dois para simular dois clientes com IPs diferentes.
      referencia:
        rotulo: 'MDN: IPv6'
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/IPv6
    - termo: HTTP 429 e cabeçalho Retry-After
      definicao: O status 429 Too Many Requests indica que o cliente passou do limite de requisições. O cabeçalho `Retry-After` informa quantos segundos o cliente deve esperar antes de tentar de novo.
      referencia:
        rotulo: 'MDN: 429 Too Many Requests'
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status/429
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`.
      referencia:
        rotulo: 'ADR GitHub: Architectural Decision Records'
        url: https://adr.github.io/
    - termo: Emissor, audiência e chave simétrica
      definicao: O emissor (`iss`) identifica quem gerou o token e a audiência (`aud`) identifica para quem ele foi gerado, e a API confere os dois. Com chave simétrica, a mesma chave secreta assina e valida o token, e na API ela fica no `appsettings.json`.
    - termo: Tolerância de relógio (clock skew)
      definicao: Margem de tempo que a validação aceita entre o relógio de quem emitiu o token e o de quem valida. No .NET, a propriedade `ClockSkew` vale cinco minutos por padrão, e por isso um token vencido há menos que isso ainda é aceito.
      referencia:
        rotulo: 'Microsoft Learn: TokenValidationParameters.ClockSkew'
        url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters.clockskew
    - termo: xUnit e IClassFixture
      definicao: O xUnit é o framework de testes usado no repositório. Uma classe de teste que declara `IClassFixture<T>` recebe uma instância de `T` criada uma vez para a classe, e no laboratório cada classe ganha assim a própria API de teste, com contadores próprios.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: Balanceador de carga
      definicao: Componente que recebe as requisições e as distribui entre várias instâncias da mesma aplicação. Como cada instância da API guarda os contadores de limite na própria memória, o limite total cresce com o número de instâncias.
    - termo: Gateway de API e Redis
      definicao: Um gateway de API é um ponto de entrada único na frente dos serviços, onde regras como o limite de requisições podem valer para todas as instâncias. O Redis é um banco de dados em memória usado com frequência para guardar contadores compartilhados entre instâncias.
      referencia:
        rotulo: 'microservices.io: API Gateway'
        url: https://microservices.io/patterns/apigateway.html
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que a API confere num token JWT e o que acontece quando a conferência falha.
    - Escolher entre janela fixa, janela deslizante e balde de tokens para cada tipo de rota.
    - Reconhecer uma política sem partição, em que um cliente consome a cota de todos.
    - Criar uma política de login particionada por IP e aplicá-la, com o teste escrito antes.
    - Identificar rotas sem política e a tolerância de relógio na expiração do token.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git, do `curl` e do Python 3, usado para montar tokens de teste. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório chama a API por `127.0.0.1` e por `[::1]` para simular dois clientes, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as duas proteções e como escolher o algoritmo de limite para cada rota. No repositório, a ADR-0007 registra o uso de JWT com credenciais em configuração, e a ADR-0013 registra as três políticas de rate limiting do Catálogo.
  - tipo: comparativo
    colunas:
    - Como conta
    - Uso na API
    linhas:
    - dimensao: Janela fixa
      valores:
      - Zera o contador a cada minuto cheio, e admite rajada na virada
      - '`leitura`, 60 por minuto, e `login`, 5 por minuto por IP'
    - dimensao: Janela deslizante
      valores:
      - Divide o minuto em seis segmentos e descarta os mais antigos
      - '`escrita`, 20 por minuto'
    - dimensao: Balde de tokens
      valores:
      - Gasta um token por chamada e repõe os tokens por período
      - '`criacao-produto`, 5 por minuto'
    - dimensao: Particionada
      valores:
      - Um contador por chave, como o IP ou o usuário
      - Só a política `login`, depois do laboratório
  - tipo: conceito
    titulo: O que o JWT prova
    texto: A API aceita o token se a assinatura confere com a chave, se o emissor e a audiência são os esperados e se ele não venceu. A validação de expiração tolera, por padrão, cinco minutos de diferença de relógio entre quem emitiu e quem valida.
  - tipo: conceito
    titulo: Partição
    texto: Uma política registrada com `AddFixedWindowLimiter` tem um contador único para toda a API, e o cliente que esgota a cota bloqueia todos os outros. Com `AddPolicy` e `RateLimitPartition`, cada chave ganha o próprio contador, e o limite passa a valer por cliente.
  - tipo: adr
    id: ADR-0013
    titulo: Rate Limiting no Servidor com Três Políticas Diferenciadas
    status: accepted
    contexto: O Catálogo expõe leituras públicas e escritas protegidas, com padrões de tráfego e de risco diferentes.
    decisao: 'Três políticas nativas do ASP.NET: `leitura`, `escrita` e `criacao-produto`.'
    alternativas: Uma política global e uma biblioteca externa com limites por IP e por usuário.
    consequencias: Sem dependências externas, com contadores por processo, que não se somam entre instâncias.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, a validação do token, as políticas de limite e duas rotas que não usam nenhuma delas. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - var jwtKey = builder.Configuration["Jwt:Key"] ?? "MinhaChaveSuperSecretaDePeloMenos32BytesAki123!";
    - builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
    - '    .AddJwtBearer(options =>'
    - '    {'
    - '        options.TokenValidationParameters = new TokenValidationParameters'
    - '        {'
    - '            ValidateIssuer = true,'
    - '            ValidateAudience = true,'
    - '            ValidateLifetime = true,'
    - '            ValidateIssuerSigningKey = true,'
    - '            ValidIssuer = builder.Configuration["Jwt:Issuer"] ?? "ProdutosAPI",'
    - '            ValidAudience = builder.Configuration["Jwt:Audience"] ?? "TodosOsClientes",'
    - '            IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(jwtKey))'
    - '        };'
    - '    });'
    anotacoes:
    - linha: 137
      texto: Confere a expiração, com a tolerância padrão de relógio.
    - linha: 141
      texto: A mesma chave assina e valida, lida de `appsettings.json`.
    inicio: 129
    contexto: O `Program.cs` da raiz monta a aplicação, registrando os serviços e o pipeline HTTP da API. O trecho abaixo configura a autenticação JWT Bearer com os parâmetros de validação do token, entre eles a expiração e a chave simétrica lida da configuração.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Extensions/RateLimitingExtensions.cs
    commit: 702145a
    linhas:
    - '            // Política 1: leitura — fixed window, 60 req/min'
    - '            options.AddFixedWindowLimiter("leitura", opt =>'
    - '            {'
    - '                opt.Window = TimeSpan.FromMinutes(1);'
    - '                opt.PermitLimit = 60;'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    - ''
    - '            // Política 2: escrita — sliding window, 20 req/min'
    - '            options.AddSlidingWindowLimiter("escrita", opt =>'
    - '            {'
    - '                opt.Window = TimeSpan.FromMinutes(1);'
    - '                opt.SegmentsPerWindow = 6;'
    - '                opt.PermitLimit = 20;'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    - ''
    - '            // Política 3: criação de produto — token bucket, 5 req/min'
    - '            options.AddTokenBucketLimiter("criacao-produto", opt =>'
    - '            {'
    - '                opt.TokenLimit = 5;'
    - '                opt.TokensPerPeriod = 5;'
    - '                opt.ReplenishmentPeriod = TimeSpan.FromMinutes(1);'
    - '                opt.QueueProcessingOrder = QueueProcessingOrder.OldestFirst;'
    - '                opt.QueueLimit = 0;'
    - '            });'
    anotacoes:
    - linha: 34
      texto: Contador único, compartilhado por todos os clientes.
    - linha: 43
      texto: Janela deslizante de seis segmentos.
    - linha: 53
      texto: Balde de cinco tokens por minuto.
    inicio: 33
    contexto: O `RateLimitingExtensions.cs` registra no ASP.NET Core o limitador de requisições da API, com a resposta `429` e o cabeçalho `Retry-After`. O trecho abaixo declara as três políticas nomeadas, `leitura` em janela fixa, `escrita` em janela deslizante e `criacao-produto` em balde de tokens, que as rotas precisam referenciar para ter limite.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Catalogo/Catalogo.API/Endpoints/Auth/AuthEndpoints.cs
    commit: 702145a
    linhas:
    - '        group.MapPost("/login", Login).WithName("UserLogin")'
    - '            .Accepts<LoginRequest>("application/json")'
    - '            .Produces<AuthResponse>(StatusCodes.Status200OK)'
    - '            .Produces(StatusCodes.Status401Unauthorized)'
    - '            .AllowAnonymous();'
    anotacoes:
    - linha: 21
      texto: O login é anônimo e não tem política de limite.
    inicio: 17
    contexto: O `AuthEndpoints.cs` registra o grupo de rotas `/api/v1/auth`, que emite o token JWT a partir de e-mail e senha. O trecho abaixo é o registro da rota `POST /login`, que aceita chamadas anônimas e não declara política de limite, o que deixa as tentativas de senha sem teto.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pedidos/CreatePedido/CreatePedidoEndpoint.cs
    commit: 702145a
    linhas:
    - '        .WithName("CriarPedido")'
    - '        .WithTags("Pedidos")'
    - '        .WithSummary("Criar pedido")'
    - '        .WithDescription("Cria um novo pedido em status Rascunho com os itens fornecidos")'
    - '        .Accepts<CreatePedidoCommand>("application/json")'
    - '        .Produces<PedidoResponse>(StatusCodes.Status201Created)'
    - '        .Produces(StatusCodes.Status400BadRequest)'
    - '        .Produces(StatusCodes.Status422UnprocessableEntity)'
    - '        .RequireAuthorization();'
    anotacoes:
    - linha: 34
      texto: Exige token e não tem política de limite.
    inicio: 26
    contexto: O `CreatePedidoEndpoint.cs` registra a rota `POST /api/v1/pedidos`, que cria um pedido em status Rascunho. O trecho abaixo são os metadados da rota, que exigem token com `RequireAuthorization` e não chamam `RequireRateLimiting`, e por isso a criação de pedidos fica sem limite de requisições.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, a sequência de tentativas de login de dois clientes antes e depois da política particionada. Depois, classifique a política adequada a cada rota.
  - tipo: fluxo
    titulo: Dois clientes tentam entrar
    etapas:
    - titulo: 'Antes: cliente A'
      descricao: 'O cliente em `127.0.0.1` envia trinta senhas erradas em um minuto, e cada uma recebe 401: nada limita a rota.'
    - titulo: 'Depois: cliente A'
      descricao: A política `login` cria a partição `127.0.0.1` com cinco permissões. As cinco primeiras recebem 401, e as demais, 429.
    - titulo: 'Depois: cliente B'
      descricao: O cliente em `::1` cai noutra partição, com cinco permissões próprias, e entra com a senha certa.
    - titulo: Virada da janela
      descricao: Um minuto depois do início da janela, a partição de A volta a ter cinco permissões.
    - titulo: Leitura, para comparar
      descricao: 'A política `leitura` não tem partição: quando A gasta as 60 leituras, B recebe 429 na primeira chamada.'
  - tipo: classificador
    enunciado: Que política cabe a cada rota?
    categorias:
    - id: login
      rotulo: login, por IP
    - id: escrita
      rotulo: escrita
    - id: leitura
      rotulo: leitura
    - id: criacao
      rotulo: criacao-produto
    itens:
    - texto: '`POST /api/v1/auth/login`'
      categoria: login
      explicacao: Rota anônima, alvo de tentativa de senha.
    - texto: '`POST /api/v1/pedidos`'
      categoria: escrita
      explicacao: Mutação autenticada, como as escritas do Catálogo.
    - texto: '`GET /api/v1/catalogo/produtos`'
      categoria: leitura
      explicacao: Leitura pública.
    - texto: '`POST /api/v1/catalogo/produtos`'
      categoria: criacao
      explicacao: Criação de produto, com balde de cinco tokens.
    - texto: '`POST /api/v1/pedidos/{id}/cancelar`'
      categoria: escrita
      explicacao: Mutação de pedido.
    - texto: '`GET /api/v1/catalogo/categorias/{id}`'
      categoria: leitura
      explicacao: Leitura pública.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é mitigar a tentativa de senhas por força bruta e o excesso de pedidos, limitando as tentativas de login por IP e os pedidos por minuto, e medir até quando um token vencido continua aceito. Os passos 1 a 3 sobem a API e medem o comportamento atual, os passos 4 a 7 escrevem os testes e acrescentam as políticas, e os passos 8 e 9 repetem a medição e testam tokens montados à mão. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: Em `AuthEndpoints.cs`, a rota `POST /api/v1/auth/login` é anônima e não declara política de limite, e as rotas de Pedidos, como a de `CreatePedidoEndpoint.cs`, exigem token sem chamar `RequireRateLimiting`. A validação do token, no `Program.cs`, mantém a tolerância de relógio padrão de cinco minutos.
    impacto: Um atacante pode testar senhas sem limite numa tentativa de força bruta, e um cliente autenticado pode criar pedidos sem teto. Um token vencido há menos de cinco minutos ainda abre a API.
    mecanismo: O laboratório cria a política `login`, registrada com `AddPolicy` e `RateLimitPartition` por IP, com cinco tentativas por minuto para cada cliente, e aplica às rotas de Pedidos a política `escrita`, de janela deslizante, que já existe no Catálogo. Por fim, monta tokens à mão com validades diferentes para medir a tolerância de relógio (`ClockSkew`).
    comprovacao: 'Os testes de limite falham antes das políticas e passam depois, com `Aprovado: 2` e a suíte em `Aprovado: 145`. A medição repetida mostra `5 401` e `25 429` no IPv4, `200` no IPv6, e `20 201` e `5 429` nos pedidos, e os tokens montados respondem `600: 200`, `-120: 200` e `-600: 401`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir a API
      editor:
        rotulo: terminal
        linhas:
        - rm -f produtos-api.db && dotnet run --launch-profile http
      sucesso: '`Now listening on: http://localhost:5000`.'
    - titulo: Medir login e pedidos
      texto: Noutro terminal, envie trinta senhas erradas pelo IPv4, entre com a senha certa pelo IPv6 e crie 25 pedidos.
      editor:
        rotulo: terminal
        linhas:
        - 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'' | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      sucesso: '`30 401`, `200` e `25 201`: nenhuma recusa por excesso.'
    - titulo: Medir a leitura com dois clientes
      texto: Reinicie a API, faça 61 leituras pelo IPv4 e uma pelo IPv6.
      editor:
        rotulo: terminal
        linhas:
        - for i in $(seq 1 61); do curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5000/api/v1/catalogo/produtos; done | sort | uniq -c
        - curl -s -i 'http://[::1]:5000/api/v1/catalogo/produtos' | tr -d '\r' | grep -E '^HTTP|^Retry-After|^\{"erro'
      sucesso: '`60 200` e `1 429` no IPv4, e `429` com `Retry-After` na primeira leitura do IPv6.'
    - titulo: Escrever os testes de limite
      texto: Crie o arquivo abaixo, com duas classes para que cada uma tenha a própria API de teste e os próprios contadores.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/LimitesDeAbusoTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using FluentAssertions;
        - using ProdutosAPI.Pedidos.CreatePedido;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration;
        - ''
        - 'public class LoginLimiteTests : IClassFixture<RateLimitingApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public LoginLimiteTests(RateLimitingApiFactory factory) => _client = factory.CreateClient();'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Login_TentativasSeguidas_Retorna429()'
        - '    {'
        - '        var codigos = new List<HttpStatusCode>();'
        - '        for (var i = 0; i < 4; i++)'
        - '        {'
        - '            var r = await _client.PostAsJsonAsync("/api/v1/auth/login", new { email = "admin@example.com", senha = $"chute{i}" });'
        - '            codigos.Add(r.StatusCode);'
        - '        }'
        - ''
        - '        codigos.Should().Equal(HttpStatusCode.Unauthorized, HttpStatusCode.Unauthorized, HttpStatusCode.Unauthorized, HttpStatusCode.TooManyRequests);'
        - '    }'
        - '}'
        - ''
        - 'public class PedidosLimiteTests : IClassFixture<RateLimitingApiFactory>'
        - '{'
        - '    private readonly HttpClient _client;'
        - ''
        - '    public PedidosLimiteTests(RateLimitingApiFactory factory) => _client = factory.CreateClient();'
        - ''
        - '    [Fact]'
        - '    public async Task POST_Pedidos_AcimaDoLimiteDeEscrita_Retorna429()'
        - '    {'
        - '        var token = await AuthHelper.ObterTokenAsync(_client);'
        - '        _client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", token);'
        - ''
        - '        var codigos = new List<HttpStatusCode>();'
        - '        for (var i = 0; i < 4; i++)'
        - '            codigos.Add((await _client.PostAsJsonAsync("/api/v1/pedidos", new CreatePedidoCommand([new(2, 1)]))).StatusCode);'
        - ''
        - '        codigos.Last().Should().Be(HttpStatusCode.TooManyRequests);'
        - '    }'
        - '}'
      efeito: teste_limites
    - titulo: Ver os testes falharem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
      sucesso: '`Com falha: 2`, com `differs at index 3` no login e `found HttpStatusCode.Created` nos pedidos.'
    - titulo: Criar a política de login e aplicar as políticas
      texto: Faça as mudanças abaixo. A política de login é particionada por IP, e os pedidos passam a usar a política `escrita` que já existe.
      editor:
        rotulo: arquivo
        caminho: RateLimitingExtensions.cs, AuthEndpoints.cs, endpoints de Pedidos e RateLimitingApiFactory.cs (alteração)
        commit: 702145a
        linhas:
        - // src/Catalogo/Catalogo.API/Extensions/RateLimitingExtensions.cs
        - '// 1. Em AddCatalogoRateLimiting, depois da política criacao-produto:'
        - '            // Política 4: login — fixed window por IP, 5 tentativas/min'
        - '            AdicionarPoliticaLogin(options, 5);'
        - ''
        - '// 2. Novo método na classe:'
        - '    // Particionada por IP: as tentativas de um cliente não consomem a cota dos outros.'
        - '    private static void AdicionarPoliticaLogin(RateLimiterOptions options, int limite) =>'
        - '        options.AddPolicy("login", context => RateLimitPartition.GetFixedWindowLimiter('
        - '            context.Connection.RemoteIpAddress?.ToString() ?? "desconhecido",'
        - '            _ => new FixedWindowRateLimiterOptions { Window = TimeSpan.FromMinutes(1), PermitLimit = limite, QueueLimit = 0 }));'
        - ''
        - '// 3. Em AddCatalogoRateLimitingWithLimits, novo parâmetro e a mesma política no fim:'
        - '        int leituraLimit, int escritaLimit, int criacaoProdutoLimit, int loginLimit = 10000)'
        - '            AdicionarPoliticaLogin(options, loginLimit);'
        - ''
        - '// src/Catalogo/Catalogo.API/Endpoints/Auth/AuthEndpoints.cs: no fim do MapPost("/login")'
        - '            .AllowAnonymous()'
        - '            .RequireRateLimiting("login");'
        - ''
        - '// CreatePedidoEndpoint.cs, AddItemEndpoint.cs e CancelPedidoEndpoint.cs: no fim do Map'
        - '        .RequireAuthorization()'
        - '        .RequireRateLimiting("escrita");'
        - ''
        - // tests/ProdutosAPI.Tests/Integration/RateLimitingApiFactory.cs
        - '        services.AddCatalogoRateLimitingWithLimits(leituraLimit: 3, escritaLimit: 3, criacaoProdutoLimit: 2, loginLimit: 3);'
      efeito: limites_aplicados
    - titulo: Ver os testes passarem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter "FullyQualifiedName~LoginLimiteTests|FullyQualifiedName~PedidosLimiteTests"
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 2` e a suíte com `Aprovado: 145`.'
    - titulo: Medir de novo
      texto: Reinicie a API e repita as chamadas do passo 2.
      editor:
        rotulo: terminal
        linhas:
        - 'for i in $(seq 1 30); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"chute''$i''"}'' http://127.0.0.1:5000/api/v1/auth/login; done | sort | uniq -c'
        - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
        - 'TOKEN=$(curl -s -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'' | sed -E ''s/.*"token":"([^"]+)".*/\1/'')'
        - 'for i in $(seq 1 25); do curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"itens":[{"produtoId":2,"quantidade":1}]}'' http://127.0.0.1:5000/api/v1/pedidos; done | sort | uniq -c'
      sucesso: '`5 401` e `25 429` no IPv4, `200` no IPv6, e `20 201` e `5 429` nos pedidos.'
    - titulo: Testar a expiração do token
      texto: Salve o script abaixo como `token.py` na raiz do repositório, para montar tokens com a chave de `appsettings.json` e a validade que você escolher, em segundos. Com a API no ar, gere e use um token válido por 10 minutos, um vencido há 2 minutos e um vencido há 10 minutos.
      editor:
        rotulo: arquivo
        caminho: token.py (novo, só para o teste)
        commit: 702145a
        linhas:
        - '"""Gera um JWT HS256 para a API: python3 oda24-token.py <segundos até expirar> [chave]."""'
        - import base64, hashlib, hmac, json, sys, time
        - 'b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=").decode()'
        - chave = sys.argv[2] if len(sys.argv) > 2 else "MinhaChaveSuperSecretaDePeloMenos32BytesAki123!"
        - 'corpo = {"sub": "admin_id", "iss": "ProdutosAPI", "aud": "TodosOsClientes", "exp": int(time.time()) + int(sys.argv[1])}'
        - 'base = b64(json.dumps({"alg": "HS256", "typ": "JWT"}).encode()) + "." + b64(json.dumps(corpo).encode())'
        - print(base + "." + b64(hmac.new(chave.encode(), base.encode(), hashlib.sha256).digest()))
        - ''
        - '# no terminal:'
        - 'for s in 600 -120 -600; do printf ''%s: '' $s; curl -s -o /dev/null -w ''%{http_code}\n'' -H "Authorization: Bearer $(python3 token.py $s)" http://localhost:5000/api/v1/pedidos; done'
      sucesso: '`600: 200`, `-120: 200` e `-600: 401`.'

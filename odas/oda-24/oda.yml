    - entrada: 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@example.com","senha":"senha123"}'' ''http://[::1]:5000/api/v1/auth/login'''
      condicao: limites_aplicados

- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria com esse mecanismo em produção, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Pedido novo que nunca foi criado
    origem: executado
    rotulo_saida: log
    saida: '$ post pedido-123 ''{"itens":[{"produtoId":3,"quantidade":5}]}''

      HTTP/1.1 201 Created

      {"id":1,"status":"Rascunho","total":450.0,"criadoEm":"…","confirmadoEm":null,"canceladoEm":null,"motivoCancelamento":null,"itens":[{"produtoId":2,"nomeProduto":"Mouse Logitech MX Master 3S","precoUnitario":450.0,"quantidade":1,"subtotal":450.0}]}


      $ total de pedidos

      "total":1'
    pergunta: O aplicativo reaproveitou a chave por engano num pedido com outro produto, recebeu 201 e mostrou sucesso. O que aconteceu?
    correcao: Guardar a impressão digital do corpo com a resposta e recusar com 409 quando ela não confere.
    alternativas:
    - texto: O cache expirou.
      correta: false
      explicacao: O cache dura 24 horas.
    - texto: A API reconheceu a chave e devolveu a resposta do primeiro pedido, sem olhar o corpo, e o pedido novo não existe.
      correta: true
      explicacao: O corpo da resposta traz o produto 2, e o pedido enviado era do produto 3.
    - texto: A API criou o segundo pedido com o id 1.
      correta: false
      explicacao: O total continuou em 1.
  - tipo: incidente
    titulo: Cinco pedidos de um clique
    origem: executado
    rotulo_saida: log
    saida: '$ cinco reenvios simultâneos com a chave corrida-1

      5 respostas HTTP/1.1 201 Created


      $ total de pedidos

      "total":6'
    pergunta: Por que a chave não impediu a duplicação?
    correcao: Serializar as requisições com a mesma chave, com uma trava por chave e nova leitura do cache depois de obtê-la.
    alternativas:
    - texto: Cada requisição usou uma chave diferente.
      correta: false
      explicacao: As cinco usaram `corrida-1`.
    - texto: O cache não guarda respostas 201.
      correta: false
      explicacao: Qualquer 2xx é guardado.
    - texto: As cinco consultaram o cache antes de qualquer uma gravar a resposta, e todas executaram o handler.
      correta: true
      explicacao: Com a trava, o total sobe só de 1 para 2.
  - tipo: incidente
    titulo: Chave compartilhada entre usuários
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/Middleware/IdempotencyMiddleware.cs:49-50

      var keyString = idempotencyKey.ToString();

      var cacheKey = $"Idempotency_{keyString}";'
    pergunta: Dois usuários diferentes geram por coincidência a mesma chave `pedido-123`. O que o segundo recebe?
    correcao: Incluir o usuário autenticado, o método e a rota na chave do cache, como na versão do passo 6.
    alternativas:
    - texto: O pedido do primeiro usuário, porque a chave do cache é só o valor do cabeçalho.
      correta: true
      explicacao: Além do pedido errado, a resposta expõe dados de outro usuário.
    - texto: Um erro 403.
      correta: false
      explicacao: O middleware não confere o dono da chave.
    - texto: Um pedido novo.
      correta: false
      explicacao: A chave já está no cache.
  - tipo: incidente
    titulo: Reenvio depois de um deploy
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/Middleware/IdempotencyMiddleware.cs:17

      private readonly IMemoryCache _cache;'
    pergunta: Um cliente reenvia um pedido logo depois de um deploy que reiniciou a API. O que acontece?
    correcao: Guardar as chaves num armazenamento durável e comum às instâncias, como Redis ou uma tabela no banco, com a mesma regra de impressão digital.
    alternativas:
    - texto: O cliente recebe a resposta antiga do disco.
      correta: false
      explicacao: O cache não é gravado em disco.
    - texto: O pedido é criado de novo, porque o `IMemoryCache` perdeu as chaves no reinício.
      correta: true
      explicacao: A ADR-0006 registra a limitação, e a trava em memória do laboratório tem o mesmo limite entre instâncias.
    - texto: A API devolve 409.
      correta: false
      explicacao: Não há registro da chave depois do reinício.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Quando uma operação é idempotente?
      alternativas:
      - texto: Quando ela é rápida.
        correta: false
        explicacao: Desempenho não define idempotência.
      - texto: Quando não exige token.
        correta: false
        explicacao: Autenticação é outra garantia.
      - texto: Quando executá-la várias vezes tem o mesmo efeito que executá-la uma vez.
        correta: true
        explicacao: A resposta pode se repetir, e o efeito não se acumula.
    - enunciado: Para que serve a impressão digital do corpo?
      alternativas:
      - texto: Para recusar a reutilização da chave numa operação diferente.
        correta: true
        explicacao: O 409 avisa o cliente do erro.
      - texto: Para cifrar o pedido.
        correta: false
        explicacao: O hash não é guardado como corpo.
      - texto: Para acelerar o cache.
        correta: false
        explicacao: O objetivo é a correção do contrato.
    - enunciado: O que a trava por chave resolve?
      alternativas:
      - texto: O escopo por usuário.
        correta: false
        explicacao: O escopo vem da composição da chave.
      - texto: A corrida entre verificar o cache e executar o handler.
        correta: true
        explicacao: As requisições seguintes esperam e leem a resposta guardada.
      - texto: A perda do cache em reinícios.
        correta: false
        explicacao: A trava também fica em memória.
    - enunciado: Por que a repetição precisa devolver o `Location`?
      alternativas:
      - texto: Porque o HTTP exige o cabeçalho em toda resposta.
        correta: false
        explicacao: O `Location` acompanha o 201.
      - texto: Porque o cache precisa dele para a chave.
        correta: false
        explicacao: A chave não usa o `Location`.
      - texto: Porque o cliente usa o cabeçalho para chegar ao recurso criado, e a repetição deve ser igual à resposta original.
        correta: true
        explicacao: No commit, a repetição vinha sem ele.
    - enunciado: Que limite continua depois do laboratório?
      alternativas:
      - texto: Cache e travas em memória, perdidos em reinícios e separados por instância.
        correta: true
        explicacao: Exige um armazenamento comum para valer em produção.
      - texto: A repetição continua sem `Location`.
        correta: false
        explicacao: O teste confere o cabeçalho.
      - texto: A mesma chave com outro corpo continua aceita.
        correta: false
        explicacao: A resposta passou a ser 409.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O contrato do `Idempotency-Key` está claro nos três casos.
    - As três falhas foram reproduzidas pela API antes da correção.
    - O teste falhou antes da troca do middleware e passou depois.
    - Cinco reenvios simultâneos passaram a criar um pedido.
    - O limite do cache em memória está claro.

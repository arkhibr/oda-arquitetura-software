      saida: "      HTTP POST /pix/v1/cobrancas -> 201 em 59ms\n      HTTP GET /pix/v1/cobrancas/1a3a6f1ef0bc4d31a1f95942fd5dcd52 -> 200 em 3ms\n      HTTP POST /pix/v1/cobrancas/1a3a6f1ef0bc4d31a1f95942fd5dcd52/simular-liquidacao -> 200 em 1ms\n      HTTP POST /pix/v1/devolucoes -> 201 em 4ms\n      HTTP GET /pix/v1/devolucoes/62a244730c51473c96d47641ac82f71a -> 200 em 1ms\nStatus cobrança final: CONCLUIDA\nDevolução: 62a244730c51473c96d47641ac82f71a\nStatus devolução final: DEVOLVIDA"
      origem: executado
      dica: O cenário completo do cliente, com cobrança, liquidação e devolução.
    - entrada: 'dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -oE "Attempt: ''[0-9]''|Unhandled.*"'
      saida: 'Attempt: ''0''

        Attempt: ''1''

        Attempt: ''2''

        Attempt: ''3''

        Unhandled exception. System.Net.Http.HttpRequestException: Connection refused (localhost:5099)'
      origem: executado
      dica: 'Com o servidor parado. A falha aparece depois de cerca de 11 segundos: a tentativa 0 e mais três, com espera crescente entre elas.'
    cenarios:
    - rotulo: Sem certificado
      comando: curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
    - rotulo: Devolução dev-1
      comando: devolver dev-1 60
    - rotulo: Outro valor
      comando: devolver dev-1 70
    - rotulo: Teste
      comando: dotnet test tests/Pix.MockServer.Tests --filter DevolucaoIdempotenciaTests
    - rotulo: Cliente
      comando: dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'
    - rotulo: Servidor parado
      comando: 'dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -oE "Attempt: ''[0-9]''|Unhandled.*"'
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta cinco situações que um time encontraria ao integrar com a API Pix, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Conexão recusada sem resposta HTTP
    origem: executado
    rotulo_saida: log
    saida: '$ curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token

      curl: (56) Recv failure: Connection reset by peer'
    pergunta: Um sistema novo chama o servidor Pix e recebe só esse erro, sem status HTTP. O que aconteceu?
    correcao: Configurar o cliente com o certificado emitido pela autoridade aceita, como faz o `MutualTlsHttpHandlerFactory` com o `client.pfx`.
    alternativas:
    - texto: Faltou o token OAuth2.
      correta: false
      explicacao: Sem token, a resposta é 401.
    - texto: O Kestrel exige certificado de cliente e encerrou a conexão no handshake, antes de a aplicação ver a requisição.
      correta: true
      explicacao: Com o mesmo comando e `--cert`, o servidor responde em JSON.
    - texto: O servidor está fora do ar.
      correta: false
      explicacao: Fora do ar, o erro seria `Connection refused`.
  - tipo: incidente
    titulo: Duas devoluções de um pedido
    origem: executado
    rotulo_saida: log
    saida: "$ devolver dev-1 60\nHTTP/1.1 201 Created\n  \"devolucaoId\": \"50454c6d7172408e9778c499e237821c\",\n\n$ devolver dev-1 60\nHTTP/1.1 201 Created\n  \"devolucaoId\": \"fd60f2c53e6143c3b6149452d47375b3\","
    pergunta: O cliente repetiu a devolução com a mesma chave depois de um tempo esgotado, e o recebedor devolveu duas vezes. Por quê?
    correcao: Ler o `Idempotency-Key` no endpoint de devolução e guardar a chave com a impressão digital do corpo, como no passo 7.
    alternativas:
    - texto: O cliente mandou chaves diferentes.
      correta: false
      explicacao: As duas chamadas usaram `dev-1`.
    - texto: A segunda chamada foi para outra cobrança.
      correta: false
      explicacao: A função `devolver` usa o mesmo `$TXID`.
    - texto: O endpoint de devolução ignora a chave e cria uma devolução a cada chamada.
      correta: true
      explicacao: Os dois `devolucaoId` são diferentes, e as cobranças já tinham esse controle.
  - tipo: incidente
    titulo: Cliente que parou depois da correção do servidor
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'\n      HTTP POST /pix/v1/cobrancas -> 201 em 35ms\n      HTTP GET /pix/v1/cobrancas/96d6c1e3bddb44d6aaccbb4d08188fbe -> 200 em 1ms\n      HTTP POST /pix/v1/cobrancas/96d6c1e3bddb44d6aaccbb4d08188fbe/simular-liquidacao -> 200 em 0ms\n      HTTP POST /pix/v1/devolucoes -> 400 em 1ms\nUnhandled exception. System.Net.Http.HttpRequestException: Response status code does not indicate success: 400 (Bad Request)."
    pergunta: O servidor passou a exigir a chave na devolução, e o cliente de demonstração parou. Qual é a causa?
    correcao: Incluir `/pix/v1/devolucoes` na condição do `IdempotencyKeyHandler`, como no passo 12.
    alternativas:
    - texto: O handler do cliente só acrescenta a chave nos caminhos de cobrança.
      correta: true
      explicacao: A cobrança e a liquidação passaram, e só a devolução recebeu 400.
    - texto: A política de resiliência esgotou as tentativas.
      correta: false
      explicacao: A política padrão não repete 400.
    - texto: O certificado do cliente venceu.
      correta: false
      explicacao: As chamadas anteriores passaram pelo mesmo handshake.
  - tipo: incidente
    titulo: Devoluções acima do valor pago
    origem: executado
    rotulo_saida: log
    saida: '$ quatro devoluções da cobrança de 100

      HTTP/1.1 201 Created

      HTTP/1.1 201 Created

      HTTP/1.1 201 Created

      HTTP/1.1 201 Created


      soma: 60 + 60 + 70 + 60 = 250'
    pergunta: Com chaves diferentes, a correção de idempotência continua aceitando devoluções que somam mais que a cobrança. Qual regra falta?
    correcao: Somar as devoluções já feitas para o `txid` e recusar a nova quando o total passar do valor original da cobrança.
    alternativas:
    - texto: O servidor arredonda os valores.
      correta: false
      explicacao: Os valores são inteiros e chegam como `decimal`.
    - texto: A validação compara cada devolução com o valor da cobrança, sem somar as anteriores.
      correta: true
      explicacao: O `PixValidation.ValidateDevolucao` recebe só o valor máximo e o valor pedido.
    - texto: A idempotência deveria impedir chaves diferentes.
      correta: false
      explicacao: Chaves diferentes são operações diferentes por definição.
  - tipo: incidente
    titulo: Pipeline diferente da decisão registrada
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Pix/Pix.ClientDemo/Program.cs:44

      .AddStandardResilienceHandler();'
    pergunta: A ADR-0014 descreve 5 s por tentativa e um disjuntor que abre com 50% de falhas em no mínimo 5 chamadas e fica aberto 15 s. O que o cliente usa?
    correcao: Configurar as opções no `AddStandardResilienceHandler(options => ...)` com os valores da ADR, ou atualizar a ADR para os valores padrão.
    alternativas:
    - texto: Os valores da ADR, lidos do `appsettings.json`.
      correta: false
      explicacao: O `appsettings.json` do cliente não tem seção de resiliência.
    - texto: Nenhuma política, porque falta o pacote.
      correta: false
      explicacao: O passo 13 mostra as quatro tentativas.
    - texto: 'Os valores padrão da biblioteca: 10 s por tentativa e disjuntor com 10% de falhas, 100 chamadas e 5 s aberto.'
      correta: true
      explicacao: A chamada não recebe opções, e os valores foram lidos de `HttpStandardResilienceOptions` na versão 10.0.0.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: O que o mTLS acrescenta ao TLS comum?
      alternativas:
      - texto: O cliente também apresenta certificado, e o servidor identifica quem chama antes de qualquer HTTP.
        correta: true
        explicacao: Sem o certificado, o `curl` não recebeu resposta HTTP.
      - texto: A troca do token OAuth2 por certificado.
        correta: false
        explicacao: O servidor exige os dois.
      - texto: Criptografia mais forte no corpo.
        correta: false
        explicacao: A cifra é a mesma do TLS.
    - enunciado: Por que a política padrão de resiliência exige cuidado com POST?
      alternativas:
      - texto: Porque POST não tem tempo limite.
        correta: false
        explicacao: O tempo por tentativa vale para todos os métodos.
      - texto: Porque ela repete falhas de conexão e tempo esgotado em qualquer método, e o servidor pode já ter concluído a operação.
        correta: true
        explicacao: O passo 13 mostrou quatro envios do mesmo POST.
      - texto: Porque ela nunca repete POST.
        correta: false
        explicacao: O token foi pedido quatro vezes.
    - enunciado: Por que o `IdempotencyKeyHandler` precisa ficar antes do handler de resiliência?
      alternativas:
      - texto: Para cifrar a chave.
        correta: false
        explicacao: A chave vai em texto no cabeçalho, dentro do TLS.
      - texto: Para o servidor gerar a chave.
        correta: false
        explicacao: Quem gera a chave é o cliente.
      - texto: Para que todas as tentativas levem a mesma chave e o servidor as reconheça como uma operação.
        correta: true
        explicacao: Se a chave fosse gerada a cada tentativa, cada uma seria uma operação nova.
    - enunciado: Para que serve o prefixo `devolucao:` na chave guardada?
      alternativas:
      - texto: Para separar as chaves de devolução das de cobrança no mesmo repositório.
        correta: true
        explicacao: O teste original usa a mesma chave na cobrança e na devolução.
      - texto: Para o cliente saber o tipo da operação.
        correta: false
        explicacao: O prefixo fica só no servidor.
      - texto: Para a chave expirar mais cedo.
        correta: false
        explicacao: O repositório em memória não expira chaves.
    - enunciado: Que regra continua faltando depois do laboratório?
      alternativas:
      - texto: A chave na devolução.
        correta: false
        explicacao: O servidor passou a exigi-la.
      - texto: O limite da soma das devoluções ao valor da cobrança.
        correta: true
        explicacao: No commit, quatro devoluções somaram 60 + 60 + 70 + 60 = 250.
      - texto: A exigência de token na devolução.
        correta: false
        explicacao: O `MockSecurityValidator` já exige o token.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A chamada sem certificado falhou no handshake, e a chamada com certificado recebeu resposta da API.
    - A devolução duplicada pela mesma chave foi reproduzida antes da correção.
    - O teste falhou antes da correção do servidor e passou depois.
    - O cliente de demonstração passou a enviar a chave na devolução.
    - As quatro tentativas da política de resiliência foram vistas com o servidor parado.

  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `702145a`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.MockServer/Program.cs
    commit: 702145a
    linhas:
    - '        options.ListenLocalhost(5099, listenOptions =>'
    - '        {'
    - '            listenOptions.UseHttps(httpsOptions =>'
    - '            {'
    - '                httpsOptions.ServerCertificate = X509CertificateLoader.LoadPkcs12FromFile('
    - '                    mtlsBundle.ServerCertificatePath,'
    - '                    mtlsBundle.CertificatePassword,'
    - '                    X509KeyStorageFlags.Exportable);'
    - '                httpsOptions.ClientCertificateMode = ClientCertificateMode.RequireCertificate;'
    - '                httpsOptions.CheckCertificateRevocation = false;'
    - '                httpsOptions.ClientCertificateValidation = (certificate, _, _) =>'
    - '                    PixMtlsCertificateStore.ValidateClientCertificate('
    - '                        certificate,'
    - '                        mtlsBundle.CaCertificatePath,'
    - '                        mtlsBundle.ExpectedClientSubject);'
    anotacoes:
    - linha: 28
      texto: Sem certificado de cliente, o handshake não termina.
    - linha: 30
      texto: Aceita só certificados assinados pela autoridade de `certs/pix/ca.cer`.
    inicio: 20
    contexto: O `Program.cs` do `Pix.MockServer` monta o servidor que simula a API Pix, com rotas de token, cobranças e devoluções na porta 5099. O trecho abaixo configura o Kestrel com HTTPS, exige certificado de cliente e valida esse certificado contra a autoridade certificadora de `certs/pix/ca.cer`, o que define o mTLS da integração.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.ClientDemo/Program.cs
    commit: 702145a
    linhas:
    - builder.Services.AddHttpClient<PixProcessingClient>((sp, client) =>
    - '{'
    - '    var options = sp.GetRequiredService<Microsoft.Extensions.Options.IOptions<PixClientOptions>>().Value;'
    - '    client.BaseAddress = new Uri(options.BaseUrl);'
    - '    client.DefaultRequestHeaders.Accept.Add(new MediaTypeWithQualityHeaderValue("application/json"));'
    - '})'
    - .ConfigurePrimaryHttpMessageHandler(MutualTlsHttpHandlerFactory.Create)
    - .AddHttpMessageHandler<CorrelationIdHandler>()
    - .AddHttpMessageHandler<IdempotencyKeyHandler>()
    - .AddHttpMessageHandler<RequestLoggingHandler>()
    - .AddStandardResilienceHandler();
    anotacoes:
    - linha: 40
      texto: O handler da rede carrega o `client.pfx`.
    - linha: 42
      texto: Põe a chave antes da política de resiliência, e por isso cada nova tentativa reaproveita a mesma chave.
    - linha: 44

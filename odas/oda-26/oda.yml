    - titulo: Trocar o serviço de devolução
      texto: Substitua o arquivo pela versão abaixo. Ela guarda a chave com o prefixo `devolucao:` e a impressão digital do corpo, e serializa as criações com uma trava.
      editor:
        rotulo: arquivo
        caminho: src/Pix/Pix.MockServer/Application/DevolucaoService.cs (substituição)
        commit: 702145a
        linhas:
        - using System.Security.Cryptography;
        - using System.Text;
        - using System.Text.Json;
        - using Pix.MockServer.Contracts;
        - using Pix.MockServer.Domain;
        - ''
        - namespace Pix.MockServer.Application;
        - ''
        - public interface IDevolucaoService
        - '{'
        - '    DevolucaoCreateOutcome? Create(CriarDevolucaoRequest request, string idempotencyKey, string correlationId);'
        - '    DevolucaoResponse? Get(string devolucaoId);'
        - '}'
        - ''
        - public sealed record DevolucaoCreateOutcome(DevolucaoResponse? Response, bool IsIdempotentReplay, bool IsConflict);
        - ''
        - public sealed class DevolucaoService(
        - '    ICobrancaRepository cobrancaRepository,'
        - '    IDevolucaoRepository devolucaoRepository,'
        - '    IIdempotencyRepository idempotencyRepository,'
        - '    TimeProvider timeProvider) : IDevolucaoService'
        - '{'
        - '    private readonly Lock _trava = new();'
        - ''
        - '    public DevolucaoCreateOutcome? Create(CriarDevolucaoRequest request, string idempotencyKey, string correlationId)'
        - '    {'
        - '        // O prefixo separa as chaves de devolução das chaves de cobrança no mesmo repositório.'
        - '        var chave = $"devolucao:{idempotencyKey}";'
        - '        var fingerprint = BuildFingerprint(request);'
        - ''
        - '        lock (_trava)'
        - '        {'
        - '            if (idempotencyRepository.TryGet(chave, out var existente) && existente is not null)'
        - '            {'
        - '                return existente.Fingerprint == fingerprint'
        - '                    ? new DevolucaoCreateOutcome(Get(existente.ResourceId), true, false)'
        - '                    : new DevolucaoCreateOutcome(null, false, true);'
        - '            }'
        - ''
        - '            var response = CreateNova(request, correlationId);'
        - '            if (response is not null)'
        - '            {'
        - '                idempotencyRepository.Upsert(new IdempotencyEntry(chave, fingerprint, response.DevolucaoId, timeProvider.GetUtcNow()));'
        - '            }'
        - ''
        - '            return response is null ? null : new DevolucaoCreateOutcome(response, false, false);'
        - '        }'
        - '    }'
        - ''
        - '    private DevolucaoResponse? CreateNova(CriarDevolucaoRequest request, string correlationId)'
        - '    {'
        - '        if (!cobrancaRepository.TryGet(request.Txid, out var cobranca) || cobranca is null)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        if (cobranca.Status != CobrancaStatus.Concluida)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        var now = timeProvider.GetUtcNow();'
        - '        var devolucaoId = Guid.NewGuid().ToString("N");'
        - '        var entity = new DevolucaoEntity'
        - '        {'
        - '            DevolucaoId = devolucaoId,'
        - '            Request = request,'
        - '            SolicitadaEm = now,'
        - '            Status = DevolucaoStatus.EmProcessamento,'
        - '            LiquidadaEm = null,'
        - '            CorrelationId = correlationId,'
        - '            OrigemAtualizacao = "MOCK_SERVER"'
        - '        };'
        - ''
        - '        entity.Status = DevolucaoStatus.Devolvida;'
        - '        entity.LiquidadaEm = now.AddSeconds(2);'
        - '        entity.OrigemAtualizacao = "SIMULADOR";'
        - ''
        - '        devolucaoRepository.Upsert(entity);'
        - '        return ToResponse(entity);'
        - '    }'
        - ''
        - '    public DevolucaoResponse? Get(string devolucaoId)'
        - '    {'
        - '        if (!devolucaoRepository.TryGet(devolucaoId, out var entity) || entity is null)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        return ToResponse(entity);'
        - '    }'
        - ''
        - '    private static string BuildFingerprint(CriarDevolucaoRequest request)'
        - '    {'
        - '        var json = JsonSerializer.Serialize(request, JsonContext.Default.CriarDevolucaoRequest);'
        - '        return Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(json)));'
        - '    }'
        - ''
        - '    private static DevolucaoResponse ToResponse(DevolucaoEntity entity)'
        - '        => new('
        - '            entity.DevolucaoId,'
        - '            entity.Status,'
        - '            entity.SolicitadaEm,'
        - '            entity.LiquidadaEm,'
        - '            entity.Request.Motivo,'
        - '            new RastreabilidadeResponse('
        - '                entity.Request.Txid,'
        - '                entity.Request.EndToEndId,'
        - '                entity.LiquidadaEm ?? entity.SolicitadaEm,'
        - '                entity.OrigemAtualizacao),'
        - '            entity.CorrelationId);'
        - '}'
    - titulo: Exigir a chave no endpoint
      texto: Registre o tipo no contexto de JSON e troque o trecho do endpoint de devolução.
      editor:
        rotulo: arquivo
        caminho: JsonContext.cs e Program.cs do Pix.MockServer (alteração)
        commit: 702145a
        linhas:
        - '// src/Pix/Pix.MockServer/Application/JsonContext.cs: abaixo do atributo de CriarCobrancaRequest'
        - '[JsonSerializable(typeof(CriarDevolucaoRequest))]'
        - ''
        - '// src/Pix/Pix.MockServer/Program.cs: no MapPost("/devolucoes"), logo depois da validação de segurança'
        - '    if (!context.Request.Headers.TryGetValue("Idempotency-Key", out var idempotencyKey) || string.IsNullOrWhiteSpace(idempotencyKey))'
        - '    {'
        - '        return Results.ValidationProblem(new Dictionary<string, string[]>'
        - '        {'
        - '            ["Idempotency-Key"] = ["Header Idempotency-Key é obrigatório."]'
        - '        }, extensions: BuildExtensions(context, correlationId));'
        - '    }'
        - ''
        - '// no mesmo endpoint, no lugar de: var devolucao = devolucaoService.Create(request, correlationId);'
        - '    var outcome = devolucaoService.Create(request, idempotencyKey.ToString(), correlationId);'
        - '    if (outcome is { IsConflict: true })'
        - '    {'
        - '        return Results.Conflict(new'
        - '        {'
        - '            title = "Conflito de idempotência",'
        - '            detail = "A mesma chave de idempotência foi usada com payload diferente.",'
        - '            traceId = context.TraceIdentifier,'
        - '            correlationId'
        - '        });'
        - '    }'
        - ''
        - '    if (outcome is { IsIdempotentReplay: true })'
        - '    {'
        - '        return Results.Ok(outcome.Response);'
        - '    }'
        - ''
        - '    var devolucao = outcome?.Response;'
      efeito: servidor_corrigido

id: '26'
titulo: Integrações externas resilientes e Pix com mTLS
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é impedir que as novas tentativas automáticas de um cliente HTTP dupliquem uma devolução de dinheiro numa integração com a API Pix, protegida por certificado de cliente e token OAuth2. No repositório `net-minimal-api`, o `Pix.MockServer` simula a API Pix com mTLS (TLS mútuo, em que cliente e servidor apresentam certificados) e cria uma devolução nova a cada chamada, e o `Pix.ClientDemo` usa o `AddStandardResilienceHandler`, que repete chamadas que falham, inclusive um POST, sem enviar chave de idempotência nas devoluções. Você vai provar o handshake mTLS com o `curl`, reproduzir a devolução duplicada e corrigir o servidor e o cliente com o teste escrito antes.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Pix
      definicao: Meio de pagamento instantâneo do Banco Central do Brasil, em que as instituições trocam mensagens pela API Pix. Nesta ODA aparecem a cobrança, que é o pedido de pagamento identificado por um `txid`, a liquidação, que é o pagamento da cobrança, e a devolução, que é o retorno de parte ou de todo o valor pago.
      referencia:
        rotulo: 'Banco Central do Brasil: Pix'
        url: https://www.bcb.gov.br/estabilidadefinanceira/pix
    - termo: TLS (Transport Layer Security) e handshake
      definicao: O TLS é o protocolo que cifra a conexão do HTTPS. O handshake é a negociação inicial da conexão, em que o servidor apresenta o certificado e as duas partes combinam as chaves, antes de qualquer cabeçalho HTTP ser enviado.
      referencia:
        rotulo: 'MDN: TLS'
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/TLS
    - termo: mTLS (TLS mútuo)
      definicao: Variante do TLS em que o cliente também apresenta um certificado durante o handshake, e o servidor recusa a conexão se esse certificado não for assinado pela autoridade esperada. A API Pix do Banco Central exige mTLS, e o `Pix.MockServer` simula essa exigência.
      referencia:
        rotulo: 'Microsoft Learn: certificados de cliente no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/certauth
    - termo: OAuth2 e client credentials
      definicao: OAuth2 é o protocolo de autorização em que o cliente obtém um token de acesso num servidor de autorização e o envia nas chamadas à API. No fluxo client credentials, um sistema obtém o token com o próprio identificador e segredo, sem usuário humano envolvido.
      referencia:
        rotulo: 'IETF: RFC 6749, seção 4.4, Client Credentials Grant'
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-4.4
    - termo: Política de resiliência e AddStandardResilienceHandler
      definicao: Política de resiliência é o conjunto de regras que um cliente HTTP aplica para tolerar falhas temporárias, como tempo limite, novas tentativas e disjuntor. O `AddStandardResilienceHandler`, da biblioteca Microsoft.Extensions.Http.Resilience, registra um pipeline padrão com essas regras em volta de cada chamada.
      referencia:
        rotulo: 'Microsoft Learn: criar aplicativos HTTP resilientes'
        url: https://learn.microsoft.com/pt-br/dotnet/core/resilience/http-resilience
    - termo: Idempotência e chave de idempotência
      definicao: Uma operação é idempotente quando repeti-la tem o mesmo efeito que executá-la uma vez. A chave de idempotência, enviada no cabeçalho `Idempotency-Key`, permite ao servidor reconhecer que uma requisição é a repetição de outra e devolver o resultado da primeira.
      referencia:
        rotulo: 'MDN: idempotente'
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Idempotent
    - termo: Kestrel
      definicao: Servidor web embutido nas aplicações ASP.NET Core, que recebe as conexões HTTP e HTTPS. No `Pix.MockServer`, é a configuração do Kestrel que exige o certificado do cliente.
      referencia:
        rotulo: 'Microsoft Learn: servidor web Kestrel'
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/servers/kestrel
    - termo: Autoridade certificadora (CA)
      definicao: Entidade que assina certificados, de modo que quem confia nela confia também nos certificados que ela assinou. No laboratório, o servidor gera a própria autoridade em `certs/pix/` e só aceita certificados de cliente assinados por ela.
      referencia:
        rotulo: 'MDN: certificate authority'
        url: https://developer.mozilla.org/en-US/docs/Glossary/Certificate_authority
    - termo: Formatos DER, PEM e PFX
      definicao: São formatos de arquivo de certificado. O DER é binário, o PEM é o mesmo conteúdo codificado em texto entre linhas `-----BEGIN CERTIFICATE-----`, e o PFX, também chamado PKCS#12, guarda o certificado junto com a chave privada, protegido por senha.
    - termo: Novas tentativas com espera exponencial e variação aleatória
      definicao: Estratégia em que o cliente repete uma chamada que falhou e dobra a espera a cada tentativa, somando uma variação aleatória, o jitter, para que muitos clientes não repitam ao mesmo tempo.
    - termo: Disjuntor (circuit breaker)
      definicao: Mecanismo que, depois de uma proporção de falhas, para de enviar chamadas a um serviço por um intervalo e falha na hora, para dar tempo ao serviço de se recuperar.
      referencia:
        rotulo: 'Martin Fowler: CircuitBreaker'
        url: https://martinfowler.com/bliki/CircuitBreaker.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas e as consequências. O repositório guarda as ADRs em `docs/ADRs/`.
      referencia:
        rotulo: 'ADR GitHub: Architectural Decision Records'
        url: https://adr.github.io/
    - termo: Servidor simulado (mock server)
      definicao: Servidor que imita a API de um parceiro para desenvolvimento e testes, sem acesso ao serviço real. O `Pix.MockServer` é uma Minimal API própria do repositório, e WireMock.Net e Mockoon são ferramentas prontas com o mesmo propósito.
    - termo: Polly
      definicao: Biblioteca .NET de resiliência que implementa novas tentativas, tempo limite e disjuntor, e sobre a qual a Microsoft.Extensions.Http.Resilience é construída.
    - termo: DelegatingHandler e cliente HTTP tipado
      definicao: Um `DelegatingHandler` é um elo da cadeia de processamento do `HttpClient`, que pode alterar a requisição antes de passá-la ao próximo elo, como o `IdempotencyKeyHandler` faz com o cabeçalho. Um cliente HTTP tipado é uma classe, como o `PixProcessingClient`, registrada com o próprio `HttpClient` e a própria cadeia de handlers.
      referencia:
        rotulo: 'Microsoft Learn: IHttpClientFactory e handlers de saída'
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/http-requests
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, serviços e serialização, por meio de requisições HTTP. No repositório, os testes do servidor Pix ficam em `tests/Pix.MockServer.Tests`.
    - termo: Identificador de correlação
      definicao: Valor único enviado num cabeçalho de cada requisição para que os logs do cliente e do servidor sobre a mesma operação possam ser ligados entre si.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que o mTLS acrescenta ao TLS comum e onde o Kestrel exige o certificado do cliente.
    - Obter um token OAuth2 por client credentials e chamar a API com certificado e token.
    - Descrever o pipeline do `AddStandardResilienceHandler` e por que ele também repete um POST.
    - Tornar a criação de devolução idempotente no servidor, com o teste escrito antes.
    - Fazer o cliente enviar `Idempotency-Key` em toda escrita que a política de resiliência pode repetir.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git, do `curl` e do `openssl`. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa dois terminais na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as três proteções de uma chamada à API Pix, o meio de pagamento instantâneo do Banco Central, e o que acontece quando o cliente HTTP repete uma chamada sozinho. Os blocos abaixo definem cada conceito antes do comparativo entre as proteções, e as duas ADRs (registros de decisão de arquitetura) do fim mostram que o repositório decidiu simular a API Pix num servidor próprio com mTLS e usar a biblioteca Microsoft.Extensions.Http.Resilience no cliente.
  - tipo: conceito
    titulo: Pix e a API Pix
    texto: O Pix é o meio de pagamento instantâneo do Banco Central do Brasil, e as instituições trocam as mensagens dele pela API Pix. Nesta ODA aparecem a cobrança, pedido de pagamento identificado por um `txid`, a liquidação, que é o pagamento da cobrança, e a devolução, que retorna parte ou todo o valor pago. O `Pix.MockServer` do repositório simula essa API para estudo.
  - tipo: conceito
    titulo: TLS e handshake
    texto: O TLS (Transport Layer Security) é o protocolo que cifra a conexão do HTTPS. O handshake é a negociação inicial da conexão, em que o servidor apresenta o certificado, assinado por uma autoridade certificadora em que o cliente confia, e as duas partes combinam as chaves antes de qualquer cabeçalho HTTP ser enviado.
  - tipo: conceito
    titulo: mTLS
    texto: No TLS comum, só o servidor apresenta certificado. No mTLS, o TLS mútuo, o cliente também apresenta o seu durante o handshake, e o servidor recusa a conexão se o certificado não for assinado pela autoridade esperada, o que ocorre antes de qualquer cabeçalho HTTP chegar à aplicação.
  - tipo: conceito
    titulo: OAuth2 por client credentials
    texto: 'O OAuth2 é o protocolo de autorização em que o cliente obtém um token de acesso e o envia nas chamadas à API no cabeçalho `Authorization: Bearer`. No fluxo client credentials, um sistema obtém o token com o próprio identificador e segredo, sem usuário humano, e no `Pix.MockServer` o token vem da rota `/oauth/token`.'
  - tipo: conceito
    titulo: Pipeline padrão de resiliência
    texto: O `AddStandardResilienceHandler` envolve cada chamada com tempo total de 30 s, tempo por tentativa de 10 s, três novas tentativas com espera exponencial a partir de 2 s e variação aleatória, e um disjuntor, que suspende as chamadas por um intervalo depois de muitas falhas, que abre com 10% de falhas em 30 s e no mínimo 100 chamadas. As novas tentativas valem para falha de conexão, tempo esgotado, 408, 429 e respostas 5xx, em qualquer método HTTP.
  - tipo: conceito
    titulo: Por que a nova tentativa exige idempotência
    texto: Quando a resposta não chega a tempo, o cliente não sabe se o servidor executou a operação. Repetir uma leitura não muda nada, mas repetir a criação de uma devolução só é seguro se a operação for idempotente, isto é, se o servidor reconhecer a repetição pela chave enviada no cabeçalho `Idempotency-Key` e devolver o resultado da primeira execução.
  - tipo: comparativo
    colunas:
    - O que garante
    - No Pix.MockServer
    linhas:
    - dimensao: TLS do servidor
      valores:
      - O cliente sabe que fala com o servidor certo
      - Certificado `server.pfx`, assinado pela autoridade de `ca.cer`
    - dimensao: mTLS
      valores:
      - O servidor sabe qual sistema chama, antes de qualquer HTTP
      - '`ClientCertificateMode.RequireCertificate` no Kestrel'
    - dimensao: OAuth2
      valores:
      - A chamada tem permissão para a operação
      - Token Bearer de `/oauth/token` por client credentials
    - dimensao: Idempotency-Key
      valores:
      - Repetir a escrita não repete o efeito
      - Só nas cobranças, no commit `702145a`
  - tipo: adr
    id: ADR-0008
    titulo: PIX Mock Server Customizado com mTLS
    status: accepted
    contexto: A API Pix do Banco Central exige mTLS, e o curso não tem credenciais reais para usá-la.
    decisao: Minimal API própria com Kestrel exigindo certificado de cliente, OAuth2 simulado e idempotência por impressão digital do corpo.
    alternativas: WireMock.Net e ferramentas externas como o Mockoon.
    consequencias: Handshake mTLS completo para estudo, com o custo de manter um servidor e de gerar e rotacionar certificados de desenvolvimento.
  - tipo: adr
    id: ADR-0014
    titulo: Resiliência de Cliente HTTP com Microsoft.Extensions.Http.Resilience
    status: accepted
    contexto: Sem resiliência, o cliente falha no primeiro erro transitório e reconecta sem espera, o que aumenta a carga no servidor.
    decisao: Pipeline da biblioteca Microsoft.Extensions.Http.Resilience com tempo por tentativa, novas tentativas com espera exponencial, disjuntor e tempo total.
    alternativas: Novas tentativas manuais com `Thread.Sleep` e Polly usado diretamente.
    consequencias: Respeito ao `Retry-After` e variação aleatória das esperas, com um pacote externo a mais e disjuntor separado por instância.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, onde o servidor exige o certificado, como o cliente monta a cadeia de handlers e por que a devolução fica sem proteção contra repetição. Clique nos marcadores para ler a explicação de cada linha.

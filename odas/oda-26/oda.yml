id: '26'
titulo: Integrações externas resilientes e Pix com mTLS
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é fazer um cliente HTTP chamar uma API Pix com certificado de cliente e token OAuth2, e garantir que as novas tentativas automáticas desse cliente não dupliquem uma devolução de dinheiro. No repositório `net-minimal-api`, o `Pix.MockServer` simula a API Pix com mTLS, e o `Pix.ClientDemo` usa o `AddStandardResilienceHandler`, que repete a chamada que falha, inclusive um POST. Você vai provar o handshake mTLS com o `curl`, reproduzir uma devolução duplicada pela mesma chave de idempotência e corrigir o servidor e o cliente com o teste escrito antes.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que o mTLS acrescenta ao TLS comum e onde o Kestrel exige o certificado do cliente.
    - Obter um token OAuth2 por client credentials e chamar a API com certificado e token.
    - Descrever o pipeline do `AddStandardResilienceHandler` e por que ele também repete um POST.
    - Tornar a criação de devolução idempotente no servidor, com o teste escrito antes.
    - Fazer o cliente enviar `Idempotency-Key` em toda escrita que a política de resiliência pode repetir.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10, do Git, do `curl` e do `openssl`. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e a faixa do Laboratório mostra como obtê-lo. O laboratório usa dois terminais na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: terminal
    titulo: terminal · bater à porta do servidor Pix
    comandos:
    - entrada: dotnet run --project src/Pix/Pix.MockServer
      saida: 'Now listening on: https://localhost:5099

        Application started. Press Ctrl+C to shut down.

        Hosting environment: Production'
      origem: executado
      dica: 'Na primeira execução, o servidor gera os certificados em `certs/pix/`. Reinicie-o depois de cada troca de código: as cobranças e as chaves ficam na memória do processo.'
    - entrada: openssl x509 -inform DER -in certs/pix/ca.cer -out certs/pix/ca.pem
      saida: ''
      origem: executado
      dica: O `ca.cer` está em DER, e o `curl` espera a autoridade certificadora em PEM.
    - entrada: curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
      saida: 'curl: (56) Recv failure: Connection reset by peer'
      origem: executado
      dica: O texto do erro muda conforme a versão do `curl`, e também aparece `(52) Empty reply from server`. Nos dois casos, o servidor fechou a conexão porque não recebeu certificado do cliente.
    - entrada: pix() { curl -sS --http1.1 --cacert certs/pix/ca.pem --cert certs/pix/client.pfx:pix-demo-123 --cert-type P12 "$@"; }
      saida: ''
      origem: executado
      dica: A função `pix` chama o `curl` com o certificado do cliente e a senha `pix-demo-123`, e repassa os demais argumentos.
    - entrada: 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
      saida: ''
      origem: executado
    - entrada: 'pix -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Idempotency-Key: x'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas'
      saida: '401'
      origem: executado
      dica: Com certificado e sem token, o handshake passa e a API responde 401.
    - entrada: dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'
      saida: "      HTTP POST /pix/v1/cobrancas -> 201 em 59ms\n      HTTP GET /pix/v1/cobrancas/1a3a6f1ef0bc4d31a1f95942fd5dcd52 -> 200 em 3ms\n      HTTP POST /pix/v1/cobrancas/1a3a6f1ef0bc4d31a1f95942fd5dcd52/simular-liquidacao -> 200 em 1ms\n      HTTP POST /pix/v1/devolucoes -> 201 em 4ms\n      HTTP GET /pix/v1/devolucoes/62a244730c51473c96d47641ac82f71a -> 200 em 1ms\nStatus cobrança final: CONCLUIDA\nDevolução: 62a244730c51473c96d47641ac82f71a\nStatus devolução final: DEVOLVIDA"
      origem: executado
      dica: O cenário completo do cliente, com cobrança, liquidação e devolução.
    cenarios:
    - rotulo: Sem certificado
      comando: curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
    - rotulo: Com certificado e sem token
      comando: 'pix -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Idempotency-Key: x'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas'
    - rotulo: Cliente de demonstração
      comando: dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as três proteções de uma chamada à API Pix e o que acontece quando o cliente repete uma chamada sozinho. No repositório, a ADR-0008 registra a escolha do servidor simulado com mTLS, e a ADR-0014 registra a escolha da biblioteca de resiliência.
  - tipo: comparativo
    colunas:
    - O que garante
    - No Pix.MockServer
    linhas:
    - dimensao: TLS do servidor
      valores:
      - O cliente sabe que fala com o servidor certo
      - Certificado `server.pfx`, assinado pela autoridade de `ca.cer`
    - dimensao: mTLS
      valores:
      - O servidor sabe qual sistema chama, antes de qualquer HTTP
      - '`ClientCertificateMode.RequireCertificate` no Kestrel'
    - dimensao: OAuth2
      valores:
      - A chamada tem permissão para a operação
      - Token Bearer de `/oauth/token` por client credentials
    - dimensao: Idempotency-Key
      valores:
      - Repetir a escrita não repete o efeito
      - Só nas cobranças, no commit `702145a`
  - tipo: conceito
    titulo: mTLS
    texto: No TLS comum, só o servidor apresenta certificado. No mTLS, o cliente também apresenta o seu durante o handshake, e o servidor recusa a conexão se o certificado não for assinado pela autoridade esperada, o que ocorre antes de qualquer cabeçalho HTTP chegar à aplicação.
  - tipo: conceito
    titulo: Pipeline padrão de resiliência
    texto: O `AddStandardResilienceHandler` envolve cada chamada com tempo total de 30 s, tempo por tentativa de 10 s, três novas tentativas com espera exponencial a partir de 2 s e variação aleatória, e um disjuntor que abre com 10% de falhas em 30 s e no mínimo 100 chamadas. As novas tentativas valem para falha de conexão, tempo esgotado, 408, 429 e respostas 5xx, em qualquer método HTTP.
  - tipo: conceito
    titulo: Por que a nova tentativa exige idempotência
    texto: Quando a resposta não chega a tempo, o cliente não sabe se o servidor executou a operação. Repetir uma leitura não muda nada, mas repetir a criação de uma devolução só é seguro se o servidor reconhecer a repetição pela chave e devolver o resultado da primeira execução.
  - tipo: adr
    id: ADR-0008
    titulo: PIX Mock Server Customizado com mTLS
    status: accepted
    contexto: A API Pix do Banco Central exige mTLS, e o curso não tem credenciais reais para usá-la.
    decisao: Minimal API própria com Kestrel exigindo certificado de cliente, OAuth2 simulado e idempotência por impressão digital do corpo.
    alternativas: WireMock.Net e ferramentas externas como o Mockoon.
    consequencias: Handshake mTLS completo para estudo, com o custo de manter um servidor e de gerar e rotacionar certificados de desenvolvimento.
  - tipo: adr
    id: ADR-0014
    titulo: Resiliência de Cliente HTTP com Microsoft.Extensions.Http.Resilience
    status: accepted
    contexto: Sem resiliência, o cliente falha no primeiro erro transitório e reconecta sem espera, o que aumenta a carga no servidor.
    decisao: Pipeline da biblioteca Microsoft.Extensions.Http.Resilience com tempo por tentativa, novas tentativas com espera exponencial, disjuntor e tempo total.
    alternativas: Novas tentativas manuais com `Thread.Sleep` e Polly usado diretamente.
    consequencias: Respeito ao `Retry-After` e variação aleatória das esperas, com um pacote externo a mais e disjuntor separado por instância.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Esta aba mostra, no commit `702145a`, onde o servidor exige o certificado, como o cliente monta a cadeia de handlers e por que a devolução fica sem proteção contra repetição. Clique nos marcadores para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.MockServer/Program.cs
    commit: 702145a
    linhas:
    - '        options.ListenLocalhost(5099, listenOptions =>'
    - '        {'
    - '            listenOptions.UseHttps(httpsOptions =>'
    - '            {'
    - '                httpsOptions.ServerCertificate = X509CertificateLoader.LoadPkcs12FromFile('
    - '                    mtlsBundle.ServerCertificatePath,'
    - '                    mtlsBundle.CertificatePassword,'
    - '                    X509KeyStorageFlags.Exportable);'
    - '                httpsOptions.ClientCertificateMode = ClientCertificateMode.RequireCertificate;'
    - '                httpsOptions.CheckCertificateRevocation = false;'
    - '                httpsOptions.ClientCertificateValidation = (certificate, _, _) =>'
    - '                    PixMtlsCertificateStore.ValidateClientCertificate('
    - '                        certificate,'
    - '                        mtlsBundle.CaCertificatePath,'
    - '                        mtlsBundle.ExpectedClientSubject);'
    anotacoes:
    - linha: 28
      texto: Sem certificado de cliente, o handshake não termina.
    - linha: 30
      texto: Aceita só certificados assinados pela autoridade de `certs/pix/ca.cer`.
    inicio: 20
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.ClientDemo/Program.cs
    commit: 702145a
    linhas:
    - builder.Services.AddHttpClient<PixProcessingClient>((sp, client) =>
    - '{'
    - '    var options = sp.GetRequiredService<Microsoft.Extensions.Options.IOptions<PixClientOptions>>().Value;'
    - '    client.BaseAddress = new Uri(options.BaseUrl);'
    - '    client.DefaultRequestHeaders.Accept.Add(new MediaTypeWithQualityHeaderValue("application/json"));'
    - '})'
    - .ConfigurePrimaryHttpMessageHandler(MutualTlsHttpHandlerFactory.Create)
    - .AddHttpMessageHandler<CorrelationIdHandler>()
    - .AddHttpMessageHandler<IdempotencyKeyHandler>()
    - .AddHttpMessageHandler<RequestLoggingHandler>()
    - .AddStandardResilienceHandler();
    anotacoes:
    - linha: 40
      texto: O handler da rede carrega o `client.pfx`.
    - linha: 42
      texto: Põe a chave antes da política de resiliência, e por isso cada nova tentativa reaproveita a mesma chave.
    - linha: 44
      texto: Registrado por último, fica mais perto da rede e repete o envio do mesmo pedido HTTP.
    inicio: 34
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.ClientDemo/Client/Handlers/IdempotencyKeyHandler.cs
    commit: 702145a
    linhas:
    - '        if (request.Method == HttpMethod.Post &&'
    - '            request.RequestUri is not null &&'
    - '            request.RequestUri.AbsolutePath.Contains("/pix/v1/cobrancas", StringComparison.OrdinalIgnoreCase) &&'
    - '            !request.Headers.Contains("Idempotency-Key"))'
    - '        {'
    - '            request.Headers.Add("Idempotency-Key", Guid.NewGuid().ToString("N"));'
    - '        }'
    anotacoes:
    - linha: 9
      texto: Só os caminhos de cobrança recebem a chave.
    inicio: 7
  - tipo: editor
    rotulo: arquivo
    caminho: src/Pix/Pix.MockServer/Program.cs
    commit: 702145a
    linhas:
    - '    var validation = PixValidation.ValidateDevolucao(request, cobranca.ValorOriginal);'
    - '    if (validation.Count > 0)'
    - '    {'
    - '        return Results.ValidationProblem(validation, extensions: BuildExtensions(context, correlationId));'
    - '    }'
    - ''
    - '    var devolucao = devolucaoService.Create(request, correlationId);'
    anotacoes:
    - linha: 224
      texto: O endpoint de devolução não lê o `Idempotency-Key` e cria uma devolução a cada chamada.
    inicio: 218
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, uma devolução cuja resposta demora mais que o tempo por tentativa, antes e depois da correção. Depois, classifique se cada chamada pode ser repetida pela política de resiliência.
  - tipo: fluxo
    titulo: Devolução com resposta atrasada
    etapas:
    - titulo: Envio
      descricao: O cliente envia a devolução de 60 da cobrança, e o `IdempotencyKeyHandler` acrescenta a chave quando cobre o caminho.
    - titulo: Execução no servidor
      descricao: O servidor cria a devolução, mas a resposta demora mais de 10 s para chegar ao cliente.
    - titulo: Nova tentativa
      descricao: A política cancela a tentativa por tempo esgotado e, depois da espera, envia o mesmo POST de novo.
    - titulo: Antes da correção
      descricao: O servidor não lê a chave e cria a segunda devolução, e o recebedor devolve 120, o dobro do valor pedido.
    - titulo: Depois da correção
      descricao: O servidor encontra `devolucao:` mais a chave com a mesma impressão digital e devolve 200 com o mesmo `devolucaoId`.
  - tipo: classificador
    enunciado: A política de resiliência pode repetir esta chamada sem risco?
    categorias:
    - id: segura
      rotulo: Pode repetir
    - id: chave
      rotulo: Só com Idempotency-Key
    - id: inutil
      rotulo: Repetir não resolve
    itens:
    - texto: GET da cobrança depois de tempo esgotado
      categoria: segura
      explicacao: Uma leitura não muda o estado do servidor.
    - texto: POST de devolução depois de tempo esgotado
      categoria: chave
      explicacao: O servidor pode ter criado a devolução antes de a resposta se perder.
    - texto: POST de cobrança depois de uma resposta 503
      categoria: chave
      explicacao: O servidor já exige a chave nas cobranças.
    - texto: POST de token com conexão recusada
      categoria: segura
      explicacao: Um token novo não altera cobranças nem devoluções.
    - texto: POST de devolução que recebeu 400
      categoria: inutil
      explicacao: O erro está no pedido, e a política padrão não repete 400.
    - texto: Chamada sem certificado de cliente
      categoria: inutil
      explicacao: A política repete a falha de conexão, mas todas as tentativas falham pelo mesmo motivo.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é chamar o servidor Pix com mTLS e OAuth2 e tornar seguras as novas tentativas de uma devolução, no servidor e no cliente. Os passos 1 a 4 provam o handshake e reproduzem a devolução duplicada, os passos 5 a 10 escrevem o teste e corrigem o servidor, e os passos 11 a 13 corrigem o cliente e mostram a política de resiliência repetindo uma chamada. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir o servidor Pix
      texto: No primeiro terminal, suba o servidor simulado e deixe-o rodando.
      editor:
        rotulo: terminal
        linhas:
        - dotnet run --project src/Pix/Pix.MockServer
      sucesso: '`Now listening on: https://localhost:5099` e os quatro arquivos em `certs/pix/`.'
    - titulo: Provar o mTLS
      texto: No segundo terminal, converta a autoridade certificadora, chame sem certificado, defina a função `pix` e obtenha o token.
      editor:
        rotulo: terminal
        linhas:
        - openssl x509 -inform DER -in certs/pix/ca.cer -out certs/pix/ca.pem
        - curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
        - pix() { curl -sS --http1.1 --cacert certs/pix/ca.pem --cert certs/pix/client.pfx:pix-demo-123 --cert-type P12 "$@"; }
        - 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
      sucesso: Erro do `curl` na chamada sem certificado e nenhuma saída nos outros comandos.
    - titulo: Criar o corpo da cobrança
      editor:
        rotulo: arquivo
        caminho: cobranca.json (novo, na raiz do repositório)
        commit: 702145a
        linhas:
        - '{'
        - '  "calendario": { "expiracao": 3600 },'
        - '  "devedor": {'
        - '    "nome": "Cliente Exemplo",'
        - '    "cpfCnpj": "12345678901",'
        - '    "endereco": { "logradouro": "Rua A", "numero": "100", "cidade": "Sao Paulo", "uf": "SP", "cep": "01001000" }'
        - '  },'
        - '  "recebedor": { "nome": "Empresa", "ispb": "12345678", "agencia": "0001", "conta": "99999", "tipoConta": "CACC" },'
        - '  "valor": { "original": 100, "abatimento": 0, "desconto": 0, "juros": 0, "multa": 0 },'
        - '  "chavePix": "chave-pix-demo",'
        - '  "solicitacaoPagador": "Pagamento demo",'
        - '  "split": [],'
        - '  "infoAdicionais": []'
        - '}'
    - titulo: Criar, liquidar e devolver
      texto: Confira o 401 sem token, crie a cobrança de 100, simule o pagamento, defina a função `devolver` e peça quatro devoluções.
      editor:
        rotulo: terminal
        linhas:
        - 'pix -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Idempotency-Key: x'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas'
        - 'TXID=$(pix -X POST -H "Authorization: Bearer $TOKEN" -H ''Idempotency-Key: cob-1'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas | sed -nE ''s/.*"txid": "([^"]+)".*/\1/p'')'
        - 'pix -X POST -H "Authorization: Bearer $TOKEN" https://localhost:5099/pix/v1/cobrancas/$TXID/simular-liquidacao | grep ''"status"'' | head -1'
        - 'devolver() { pix -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' ${1:+-H "Idempotency-Key: $1"} -d "{\"txid\":\"$TXID\",\"endToEndId\":\"E2E12345678901234567\",\"valor\":$2,\"natureza\":\"ORIGINAL\",\"motivo\":\"Teste\"}" https://localhost:5099/pix/v1/devolucoes | tr -d ''\r'' | grep -E ''^HTTP|"devolucaoId"|"title"''; }'
        - devolver dev-1 60
        - devolver dev-1 60
        - devolver dev-1 70
        - devolver "" 60
      sucesso: '`401`, `"status": "CONCLUIDA"` e quatro respostas 201 com `devolucaoId` diferentes, que somam 60 + 60 + 70 + 60 = 250.'
    - titulo: Escrever o teste de idempotência da devolução
      editor:
        rotulo: arquivo
        caminho: tests/Pix.MockServer.Tests/DevolucaoIdempotenciaTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using System.Text.Json;
        - using FluentAssertions;
        - using Pix.MockServer.Contracts;
        - using Xunit;
        - ''
        - namespace Pix.MockServer.Tests;
        - ''
        - 'public sealed class DevolucaoIdempotenciaTests(PixMockServerFactory factory) : IClassFixture<PixMockServerFactory>'
        - '{'
        - '    [Fact]'
        - '    public async Task MesmaChaveMesmoPayload_DeveDevolverAMesmaDevolucao()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - '        var chave = $"dev-{Guid.NewGuid():N}";'
        - '        var request = Devolucao(txid, 60m);'
        - ''
        - '        var primeira = await PostDevolucaoAsync(client, chave, request);'
        - '        var repetida = await PostDevolucaoAsync(client, chave, request);'
        - ''
        - '        primeira.StatusCode.Should().Be(HttpStatusCode.Created);'
        - '        repetida.StatusCode.Should().Be(HttpStatusCode.OK);'
        - '        var idPrimeira = (await primeira.Content.ReadFromJsonAsync<DevolucaoResponse>())!.DevolucaoId;'
        - '        var idRepetida = (await repetida.Content.ReadFromJsonAsync<DevolucaoResponse>())!.DevolucaoId;'
        - '        idRepetida.Should().Be(idPrimeira);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task MesmaChavePayloadDiferente_DeveRetornar409()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - '        var chave = $"dev-{Guid.NewGuid():N}";'
        - ''
        - '        var primeira = await PostDevolucaoAsync(client, chave, Devolucao(txid, 60m));'
        - '        var outra = await PostDevolucaoAsync(client, chave, Devolucao(txid, 70m));'
        - ''
        - '        primeira.StatusCode.Should().Be(HttpStatusCode.Created);'
        - '        outra.StatusCode.Should().Be(HttpStatusCode.Conflict);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task SemChave_DeveRetornar400()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - ''
        - '        var response = await PostDevolucaoAsync(client, null, Devolucao(txid, 60m));'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.BadRequest);'
        - '    }'
        - ''
        - '    private async Task<(HttpClient Client, string Txid)> PrepararCobrancaLiquidadaAsync()'
        - '    {'
        - '        var client = factory.CreateClient();'
        - '        client.DefaultRequestHeaders.Add("X-MTLS-Client-Cert", "demo-certificado-cliente");'
        - '        var token = await client.PostAsJsonAsync("/oauth/token",'
        - '            new OAuthTokenRequest("pix-demo-client", "pix-demo-secret", "client_credentials"));'
        - '        var accessToken = (await token.Content.ReadFromJsonAsync<OAuthTokenResponse>())!.AccessToken;'
        - '        client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", accessToken);'
        - ''
        - '        using var criar = new HttpRequestMessage(HttpMethod.Post, "/pix/v1/cobrancas")'
        - '        {'
        - '            Content = JsonContent.Create(Cobranca())'
        - '        };'
        - '        criar.Headers.Add("Idempotency-Key", Guid.NewGuid().ToString("N"));'
        - '        var cobranca = await (await client.SendAsync(criar)).Content.ReadFromJsonAsync<CobrancaResponse>();'
        - '        await client.PostAsync($"/pix/v1/cobrancas/{cobranca!.Txid}/simular-liquidacao", null);'
        - '        return (client, cobranca.Txid);'
        - '    }'
        - ''
        - '    private static Task<HttpResponseMessage> PostDevolucaoAsync(HttpClient client, string? chave, CriarDevolucaoRequest request)'
        - '    {'
        - '        var message = new HttpRequestMessage(HttpMethod.Post, "/pix/v1/devolucoes")'
        - '        {'
        - '            Content = JsonContent.Create(request)'
        - '        };'
        - '        if (chave is not null)'
        - '        {'
        - '            message.Headers.Add("Idempotency-Key", chave);'
        - '        }'
        - ''
        - '        return client.SendAsync(message);'
        - '    }'
        - ''
        - '    private static CriarDevolucaoRequest Devolucao(string txid, decimal valor)'
        - '        => new(txid, "E2E12345678901234567", valor, "ORIGINAL", "Teste", new Dictionary<string, JsonElement>());'
        - ''
        - '    private static CriarCobrancaRequest Cobranca()'

    - termo: Identificador de correlação
      definicao: Valor único enviado num cabeçalho de cada requisição para que os logs do cliente e do servidor sobre a mesma operação possam ser ligados entre si.
    - termo: Idempotência e chave de idempotência
      definicao: Uma operação é idempotente quando repeti-la tem o mesmo efeito que executá-la uma vez. A chave de idempotência, enviada no cabeçalho `Idempotency-Key`, permite ao servidor reconhecer que uma requisição é a repetição de outra e devolver o resultado da primeira.
      referencia:

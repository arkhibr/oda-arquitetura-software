    - titulo: Repetir as devoluções
      texto: Reinicie o servidor, obtenha o token, crie e liquide outra cobrança e repita as quatro devoluções.
      editor:
        rotulo: terminal
        linhas:
        - 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
        - 'TXID=$(pix -X POST -H "Authorization: Bearer $TOKEN" -H ''Idempotency-Key: cob-1'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas | sed -nE ''s/.*"txid": "([^"]+)".*/\1/p'')'
        - 'pix -X POST -H "Authorization: Bearer $TOKEN" https://localhost:5099/pix/v1/cobrancas/$TXID/simular-liquidacao | grep ''"status"'' | head -1'
        - devolver dev-1 60
        - devolver dev-1 60
        - devolver dev-1 70
        - devolver "" 60
      sucesso: 201 e depois 200 com o mesmo `devolucaoId`, 409 no outro valor e 400 sem a chave.

- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, uma devolução cuja resposta demora mais que o tempo por tentativa, antes e depois da correção. Depois, classifique se cada chamada pode ser repetida pela política de resiliência.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: Pix
      definicao: Meio de pagamento instantâneo do Banco Central do Brasil, em que as instituições trocam mensagens pela API Pix. Nesta ODA aparecem a cobrança, que é o pedido de pagamento identificado por um `txid`, a liquidação, que é o pagamento da cobrança, e a devolução, que é o retorno de parte ou de todo o valor pago.
      referencia:
        rotulo: 'Banco Central do Brasil: Pix'
        url: https://www.bcb.gov.br/estabilidadefinanceira/pix
    - termo: Idempotência e chave de idempotência
      definicao: Uma operação é idempotente quando repeti-la tem o mesmo efeito que executá-la uma vez. A chave de idempotência, enviada no cabeçalho `Idempotency-Key`, permite ao servidor reconhecer que uma requisição é a repetição de outra e devolver o resultado da primeira.
      referencia:
        rotulo: 'MDN: idempotente'
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Idempotent
    - termo: Política de resiliência e AddStandardResilienceHandler
      definicao: Política de resiliência é o conjunto de regras que um cliente HTTP aplica para tolerar falhas temporárias, como tempo limite, novas tentativas e disjuntor. O `AddStandardResilienceHandler`, da biblioteca Microsoft.Extensions.Http.Resilience, registra um pipeline padrão com essas regras em volta de cada chamada.
      referencia:
        rotulo: 'Microsoft Learn: criar aplicativos HTTP resilientes'
        url: https://learn.microsoft.com/pt-br/dotnet/core/resilience/http-resilience
    - termo: Novas tentativas com espera exponencial e variação aleatória
      definicao: Estratégia em que o cliente repete uma chamada que falhou e dobra a espera a cada tentativa, somando uma variação aleatória, o jitter, para que muitos clientes não repitam ao mesmo tempo.
  - tipo: fluxo
    titulo: Devolução com resposta atrasada
    etapas:
    - titulo: Envio
      descricao: O cliente envia a devolução de 60 da cobrança, e o `IdempotencyKeyHandler` acrescenta a chave quando cobre o caminho.
    - titulo: Execução no servidor
      descricao: O servidor cria a devolução, mas a resposta demora mais de 10 s para chegar ao cliente.
    - titulo: Nova tentativa
      descricao: A política cancela a tentativa por tempo esgotado e, depois da espera, envia o mesmo POST de novo.
    - titulo: Antes da correção
      descricao: O servidor não lê a chave e cria a segunda devolução, e o recebedor devolve 120, o dobro do valor pedido.
    - titulo: Depois da correção
      descricao: O servidor encontra `devolucao:` mais a chave com a mesma impressão digital e devolve 200 com o mesmo `devolucaoId`.
  - tipo: classificador
    enunciado: A política de resiliência pode repetir esta chamada sem risco?
    categorias:
    - id: segura
      rotulo: Pode repetir
    - id: chave
      rotulo: Só com Idempotency-Key
    - id: inutil
      rotulo: Repetir não resolve
    itens:
    - texto: GET da cobrança depois de tempo esgotado
      categoria: segura
      explicacao: Uma leitura não muda o estado do servidor.
    - texto: POST de devolução depois de tempo esgotado
      categoria: chave
      explicacao: O servidor pode ter criado a devolução antes de a resposta se perder.
    - texto: POST de cobrança depois de uma resposta 503
      categoria: chave
      explicacao: O servidor já exige a chave nas cobranças.
    - texto: POST de token com conexão recusada
      categoria: segura
      explicacao: Um token novo não altera cobranças nem devoluções.
    - texto: POST de devolução que recebeu 400
      categoria: inutil
      explicacao: O erro está no pedido, e a política padrão não repete 400.
    - texto: Chamada sem certificado de cliente
      categoria: inutil
      explicacao: A política repete a falha de conexão, mas todas as tentativas falham pelo mesmo motivo.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é eliminar o risco de devolução em dobro quando a política de resiliência repete um POST, fazendo o servidor reconhecer a chave de idempotência da devolução e o cliente enviá-la, depois de provar o handshake mTLS e o token OAuth2. Os passos 1 a 4 provam o handshake e reproduzem a devolução duplicada, os passos 5 a 10 escrevem o teste e corrigem o servidor, e os passos 11 a 13 corrigem o cliente e mostram a política de resiliência repetindo uma chamada. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: mTLS (TLS mútuo)
      definicao: Variante do TLS em que o cliente também apresenta um certificado durante o handshake, e o servidor recusa a conexão se esse certificado não for assinado pela autoridade esperada. A API Pix do Banco Central exige mTLS, e o `Pix.MockServer` simula essa exigência.
      referencia:
        rotulo: 'Microsoft Learn: certificados de cliente no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/security/authentication/certauth
    - termo: OAuth2 e client credentials
      definicao: OAuth2 é o protocolo de autorização em que o cliente obtém um token de acesso num servidor de autorização e o envia nas chamadas à API. No fluxo client credentials, um sistema obtém o token com o próprio identificador e segredo, sem usuário humano envolvido.
      referencia:
        rotulo: 'IETF: RFC 6749, seção 4.4, Client Credentials Grant'
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-4.4
    - termo: Pix
      definicao: Meio de pagamento instantâneo do Banco Central do Brasil, em que as instituições trocam mensagens pela API Pix. Nesta ODA aparecem a cobrança, que é o pedido de pagamento identificado por um `txid`, a liquidação, que é o pagamento da cobrança, e a devolução, que é o retorno de parte ou de todo o valor pago.
      referencia:
        rotulo: 'Banco Central do Brasil: Pix'
        url: https://www.bcb.gov.br/estabilidadefinanceira/pix
    - termo: Política de resiliência e AddStandardResilienceHandler
      definicao: Política de resiliência é o conjunto de regras que um cliente HTTP aplica para tolerar falhas temporárias, como tempo limite, novas tentativas e disjuntor. O `AddStandardResilienceHandler`, da biblioteca Microsoft.Extensions.Http.Resilience, registra um pipeline padrão com essas regras em volta de cada chamada.
      referencia:
        rotulo: 'Microsoft Learn: criar aplicativos HTTP resilientes'
        url: https://learn.microsoft.com/pt-br/dotnet/core/resilience/http-resilience
    - termo: Servidor simulado (mock server)
      definicao: Servidor que imita a API de um parceiro para desenvolvimento e testes, sem acesso ao serviço real. O `Pix.MockServer` é uma Minimal API própria do repositório, e WireMock.Net e Mockoon são ferramentas prontas com o mesmo propósito.
    - termo: Autoridade certificadora (CA)
      definicao: Entidade que assina certificados, de modo que quem confia nela confia também nos certificados que ela assinou. No laboratório, o servidor gera a própria autoridade em `certs/pix/` e só aceita certificados de cliente assinados por ela.
      referencia:
        rotulo: 'MDN: certificate authority'
        url: https://developer.mozilla.org/en-US/docs/Glossary/Certificate_authority
    - termo: Formatos DER, PEM e PFX
      definicao: São formatos de arquivo de certificado. O DER é binário, o PEM é o mesmo conteúdo codificado em texto entre linhas `-----BEGIN CERTIFICATE-----`, e o PFX, também chamado PKCS#12, guarda o certificado junto com a chave privada, protegido por senha.
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, serviços e serialização, por meio de requisições HTTP. No repositório, os testes do servidor Pix ficam em `tests/Pix.MockServer.Tests`.
    - termo: Idempotência e chave de idempotência
      definicao: Uma operação é idempotente quando repeti-la tem o mesmo efeito que executá-la uma vez. A chave de idempotência, enviada no cabeçalho `Idempotency-Key`, permite ao servidor reconhecer que uma requisição é a repetição de outra e devolver o resultado da primeira.
      referencia:
        rotulo: 'MDN: idempotente'
        url: https://developer.mozilla.org/pt-BR/docs/Glossary/Idempotent
    - termo: Novas tentativas com espera exponencial e variação aleatória
      definicao: Estratégia em que o cliente repete uma chamada que falhou e dobra a espera a cada tentativa, somando uma variação aleatória, o jitter, para que muitos clientes não repitam ao mesmo tempo.
  - tipo: faixa
    estilo: objetivo
    problema: No `Program.cs` do `Pix.MockServer`, a rota `POST /devolucoes` não lê o cabeçalho `Idempotency-Key` e cria uma devolução a cada chamada. No cliente, o `IdempotencyKeyHandler.cs` só acrescenta a chave aos caminhos de cobrança, e o `AddStandardResilienceHandler` repete falhas de conexão, tempo esgotado e respostas 5xx em qualquer método HTTP, inclusive no POST.
    impacto: Quando a resposta de uma devolução se perde, a nova tentativa automática cria outra devolução, e o recebedor recebe de volta o dobro do valor pedido, como mostra a simulação com 60 devolvidos duas vezes. Numa integração Pix real, o erro movimenta dinheiro de verdade.
    mecanismo: O laboratório prova primeiro o mTLS e o token OAuth2 com o `curl`. Depois torna a devolução idempotente no servidor, guardando a chave com o prefixo `devolucao:` e a impressão digital do corpo sob uma trava, e faz o `IdempotencyKeyHandler` incluir `/pix/v1/devolucoes`, para que todas as tentativas da política de resiliência levem a mesma chave.
    comprovacao: 'O teste de idempotência da devolução falha com `Com falha: 3` antes da correção e passa com `Aprovado: 3`, com a suíte em `Aprovado: 10`. Pela API, a mesma chave responde 201 e depois 200 com o mesmo `devolucaoId`, outro valor recebe 409, a falta de chave recebe 400, e o cliente de demonstração termina com `Status devolução final: DEVOLVIDA`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Subir o servidor Pix
      texto: No primeiro terminal, suba o servidor simulado e deixe-o rodando.
      editor:
        rotulo: terminal
        linhas:
        - dotnet run --project src/Pix/Pix.MockServer
      sucesso: '`Now listening on: https://localhost:5099` e os quatro arquivos em `certs/pix/`.'
    - titulo: Provar o mTLS
      texto: No segundo terminal, converta a autoridade certificadora, chame sem certificado, defina a função `pix` e obtenha o token.
      editor:
        rotulo: terminal
        linhas:
        - openssl x509 -inform DER -in certs/pix/ca.cer -out certs/pix/ca.pem
        - curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
        - pix() { curl -sS --http1.1 --cacert certs/pix/ca.pem --cert certs/pix/client.pfx:pix-demo-123 --cert-type P12 "$@"; }
        - 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
      sucesso: Erro do `curl` na chamada sem certificado e nenhuma saída nos outros comandos.
    - titulo: Criar o corpo da cobrança
      editor:
        rotulo: arquivo
        caminho: cobranca.json (novo, na raiz do repositório)
        commit: 702145a
        linhas:
        - '{'
        - '  "calendario": { "expiracao": 3600 },'
        - '  "devedor": {'
        - '    "nome": "Cliente Exemplo",'
        - '    "cpfCnpj": "12345678901",'
        - '    "endereco": { "logradouro": "Rua A", "numero": "100", "cidade": "Sao Paulo", "uf": "SP", "cep": "01001000" }'
        - '  },'
        - '  "recebedor": { "nome": "Empresa", "ispb": "12345678", "agencia": "0001", "conta": "99999", "tipoConta": "CACC" },'
        - '  "valor": { "original": 100, "abatimento": 0, "desconto": 0, "juros": 0, "multa": 0 },'
        - '  "chavePix": "chave-pix-demo",'
        - '  "solicitacaoPagador": "Pagamento demo",'
        - '  "split": [],'
        - '  "infoAdicionais": []'
        - '}'
    - titulo: Criar, liquidar e devolver
      texto: Confira o 401 sem token, crie a cobrança de 100, simule o pagamento, defina a função `devolver` e peça quatro devoluções.
      editor:
        rotulo: terminal
        linhas:
        - 'pix -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Idempotency-Key: x'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas'
        - 'TXID=$(pix -X POST -H "Authorization: Bearer $TOKEN" -H ''Idempotency-Key: cob-1'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas | sed -nE ''s/.*"txid": "([^"]+)".*/\1/p'')'
        - 'pix -X POST -H "Authorization: Bearer $TOKEN" https://localhost:5099/pix/v1/cobrancas/$TXID/simular-liquidacao | grep ''"status"'' | head -1'
        - 'devolver() { pix -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' ${1:+-H "Idempotency-Key: $1"} -d "{\"txid\":\"$TXID\",\"endToEndId\":\"E2E12345678901234567\",\"valor\":$2,\"natureza\":\"ORIGINAL\",\"motivo\":\"Teste\"}" https://localhost:5099/pix/v1/devolucoes | tr -d ''\r'' | grep -E ''^HTTP|"devolucaoId"|"title"''; }'
        - devolver dev-1 60
        - devolver dev-1 60
        - devolver dev-1 70
        - devolver "" 60
      sucesso: '`401`, `"status": "CONCLUIDA"` e quatro respostas 201 com `devolucaoId` diferentes, que somam 60 + 60 + 70 + 60 = 250.'
    - titulo: Escrever o teste de idempotência da devolução
      editor:
        rotulo: arquivo
        caminho: tests/Pix.MockServer.Tests/DevolucaoIdempotenciaTests.cs (novo)
        commit: 702145a
        linhas:
        - using System.Net;
        - using System.Net.Http.Headers;
        - using System.Net.Http.Json;
        - using System.Text.Json;
        - using FluentAssertions;
        - using Pix.MockServer.Contracts;
        - using Xunit;
        - ''
        - namespace Pix.MockServer.Tests;
        - ''
        - 'public sealed class DevolucaoIdempotenciaTests(PixMockServerFactory factory) : IClassFixture<PixMockServerFactory>'
        - '{'
        - '    [Fact]'
        - '    public async Task MesmaChaveMesmoPayload_DeveDevolverAMesmaDevolucao()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - '        var chave = $"dev-{Guid.NewGuid():N}";'
        - '        var request = Devolucao(txid, 60m);'
        - ''
        - '        var primeira = await PostDevolucaoAsync(client, chave, request);'
        - '        var repetida = await PostDevolucaoAsync(client, chave, request);'
        - ''
        - '        primeira.StatusCode.Should().Be(HttpStatusCode.Created);'
        - '        repetida.StatusCode.Should().Be(HttpStatusCode.OK);'
        - '        var idPrimeira = (await primeira.Content.ReadFromJsonAsync<DevolucaoResponse>())!.DevolucaoId;'
        - '        var idRepetida = (await repetida.Content.ReadFromJsonAsync<DevolucaoResponse>())!.DevolucaoId;'
        - '        idRepetida.Should().Be(idPrimeira);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task MesmaChavePayloadDiferente_DeveRetornar409()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - '        var chave = $"dev-{Guid.NewGuid():N}";'
        - ''
        - '        var primeira = await PostDevolucaoAsync(client, chave, Devolucao(txid, 60m));'
        - '        var outra = await PostDevolucaoAsync(client, chave, Devolucao(txid, 70m));'
        - ''
        - '        primeira.StatusCode.Should().Be(HttpStatusCode.Created);'
        - '        outra.StatusCode.Should().Be(HttpStatusCode.Conflict);'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public async Task SemChave_DeveRetornar400()'
        - '    {'
        - '        var (client, txid) = await PrepararCobrancaLiquidadaAsync();'
        - ''
        - '        var response = await PostDevolucaoAsync(client, null, Devolucao(txid, 60m));'
        - ''
        - '        response.StatusCode.Should().Be(HttpStatusCode.BadRequest);'
        - '    }'
        - ''
        - '    private async Task<(HttpClient Client, string Txid)> PrepararCobrancaLiquidadaAsync()'
        - '    {'
        - '        var client = factory.CreateClient();'
        - '        client.DefaultRequestHeaders.Add("X-MTLS-Client-Cert", "demo-certificado-cliente");'
        - '        var token = await client.PostAsJsonAsync("/oauth/token",'
        - '            new OAuthTokenRequest("pix-demo-client", "pix-demo-secret", "client_credentials"));'
        - '        var accessToken = (await token.Content.ReadFromJsonAsync<OAuthTokenResponse>())!.AccessToken;'
        - '        client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", accessToken);'
        - ''
        - '        using var criar = new HttpRequestMessage(HttpMethod.Post, "/pix/v1/cobrancas")'
        - '        {'
        - '            Content = JsonContent.Create(Cobranca())'
        - '        };'
        - '        criar.Headers.Add("Idempotency-Key", Guid.NewGuid().ToString("N"));'
        - '        var cobranca = await (await client.SendAsync(criar)).Content.ReadFromJsonAsync<CobrancaResponse>();'
        - '        await client.PostAsync($"/pix/v1/cobrancas/{cobranca!.Txid}/simular-liquidacao", null);'
        - '        return (client, cobranca.Txid);'
        - '    }'
        - ''
        - '    private static Task<HttpResponseMessage> PostDevolucaoAsync(HttpClient client, string? chave, CriarDevolucaoRequest request)'
        - '    {'
        - '        var message = new HttpRequestMessage(HttpMethod.Post, "/pix/v1/devolucoes")'
        - '        {'
        - '            Content = JsonContent.Create(request)'
        - '        };'
        - '        if (chave is not null)'
        - '        {'
        - '            message.Headers.Add("Idempotency-Key", chave);'
        - '        }'
        - ''
        - '        return client.SendAsync(message);'
        - '    }'
        - ''
        - '    private static CriarDevolucaoRequest Devolucao(string txid, decimal valor)'
        - '        => new(txid, "E2E12345678901234567", valor, "ORIGINAL", "Teste", new Dictionary<string, JsonElement>());'
        - ''
        - '    private static CriarCobrancaRequest Cobranca()'
        - '        => new('
        - '            new CalendarioRequest(3600),'
        - '            new DevedorRequest("Cliente Exemplo", "12345678901",'
        - '                new EnderecoRequest("Rua A", "100", "Sao Paulo", "SP", "01001000")),'
        - '            new RecebedorRequest("Empresa", "12345678", "0001", "99999", "CACC"),'
        - '            new ValorRequest(100m, 0m, 0m, 0m, 0m),'
        - '            "chave-pix-demo",'
        - '            "Pagamento demo",'
        - '            [],'
        - '            [],'
        - '            new Dictionary<string, JsonElement>());'
        - '}'
      efeito: teste_devolucao
    - titulo: Ver o teste falhar
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/Pix.MockServer.Tests --filter DevolucaoIdempotenciaTests
      sucesso: '`Com falha: 3`, todas com `but found HttpStatusCode.Created`.'
    - titulo: Trocar o serviço de devolução
      texto: Substitua o arquivo pela versão abaixo. Ela guarda a chave com o prefixo `devolucao:` e a impressão digital do corpo, e serializa as criações com uma trava.
      editor:
        rotulo: arquivo
        caminho: src/Pix/Pix.MockServer/Application/DevolucaoService.cs (substituição)
        commit: 702145a
        linhas:
        - using System.Security.Cryptography;
        - using System.Text;
        - using System.Text.Json;
        - using Pix.MockServer.Contracts;
        - using Pix.MockServer.Domain;
        - ''
        - namespace Pix.MockServer.Application;
        - ''
        - public interface IDevolucaoService
        - '{'
        - '    DevolucaoCreateOutcome? Create(CriarDevolucaoRequest request, string idempotencyKey, string correlationId);'
        - '    DevolucaoResponse? Get(string devolucaoId);'
        - '}'
        - ''
        - public sealed record DevolucaoCreateOutcome(DevolucaoResponse? Response, bool IsIdempotentReplay, bool IsConflict);
        - ''
        - public sealed class DevolucaoService(
        - '    ICobrancaRepository cobrancaRepository,'
        - '    IDevolucaoRepository devolucaoRepository,'
        - '    IIdempotencyRepository idempotencyRepository,'
        - '    TimeProvider timeProvider) : IDevolucaoService'
        - '{'
        - '    private readonly Lock _trava = new();'
        - ''
        - '    public DevolucaoCreateOutcome? Create(CriarDevolucaoRequest request, string idempotencyKey, string correlationId)'
        - '    {'
        - '        // O prefixo separa as chaves de devolução das chaves de cobrança no mesmo repositório.'
        - '        var chave = $"devolucao:{idempotencyKey}";'
        - '        var fingerprint = BuildFingerprint(request);'
        - ''
        - '        lock (_trava)'
        - '        {'
        - '            if (idempotencyRepository.TryGet(chave, out var existente) && existente is not null)'
        - '            {'
        - '                return existente.Fingerprint == fingerprint'
        - '                    ? new DevolucaoCreateOutcome(Get(existente.ResourceId), true, false)'
        - '                    : new DevolucaoCreateOutcome(null, false, true);'
        - '            }'
        - ''
        - '            var response = CreateNova(request, correlationId);'
        - '            if (response is not null)'
        - '            {'
        - '                idempotencyRepository.Upsert(new IdempotencyEntry(chave, fingerprint, response.DevolucaoId, timeProvider.GetUtcNow()));'
        - '            }'
        - ''
        - '            return response is null ? null : new DevolucaoCreateOutcome(response, false, false);'
        - '        }'
        - '    }'
        - ''
        - '    private DevolucaoResponse? CreateNova(CriarDevolucaoRequest request, string correlationId)'
        - '    {'
        - '        if (!cobrancaRepository.TryGet(request.Txid, out var cobranca) || cobranca is null)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        if (cobranca.Status != CobrancaStatus.Concluida)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        var now = timeProvider.GetUtcNow();'
        - '        var devolucaoId = Guid.NewGuid().ToString("N");'
        - '        var entity = new DevolucaoEntity'
        - '        {'
        - '            DevolucaoId = devolucaoId,'
        - '            Request = request,'
        - '            SolicitadaEm = now,'
        - '            Status = DevolucaoStatus.EmProcessamento,'
        - '            LiquidadaEm = null,'
        - '            CorrelationId = correlationId,'
        - '            OrigemAtualizacao = "MOCK_SERVER"'
        - '        };'
        - ''
        - '        entity.Status = DevolucaoStatus.Devolvida;'
        - '        entity.LiquidadaEm = now.AddSeconds(2);'
        - '        entity.OrigemAtualizacao = "SIMULADOR";'
        - ''
        - '        devolucaoRepository.Upsert(entity);'
        - '        return ToResponse(entity);'
        - '    }'
        - ''
        - '    public DevolucaoResponse? Get(string devolucaoId)'
        - '    {'
        - '        if (!devolucaoRepository.TryGet(devolucaoId, out var entity) || entity is null)'
        - '        {'
        - '            return null;'
        - '        }'
        - ''
        - '        return ToResponse(entity);'
        - '    }'
        - ''
        - '    private static string BuildFingerprint(CriarDevolucaoRequest request)'
        - '    {'
        - '        var json = JsonSerializer.Serialize(request, JsonContext.Default.CriarDevolucaoRequest);'
        - '        return Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(json)));'
        - '    }'
        - ''
        - '    private static DevolucaoResponse ToResponse(DevolucaoEntity entity)'
        - '        => new('
        - '            entity.DevolucaoId,'
        - '            entity.Status,'
        - '            entity.SolicitadaEm,'
        - '            entity.LiquidadaEm,'
        - '            entity.Request.Motivo,'
        - '            new RastreabilidadeResponse('
        - '                entity.Request.Txid,'
        - '                entity.Request.EndToEndId,'
        - '                entity.LiquidadaEm ?? entity.SolicitadaEm,'
        - '                entity.OrigemAtualizacao),'
        - '            entity.CorrelationId);'
        - '}'
    - titulo: Exigir a chave no endpoint
      texto: Registre o tipo no contexto de JSON e troque o trecho do endpoint de devolução.
      editor:
        rotulo: arquivo
        caminho: JsonContext.cs e Program.cs do Pix.MockServer (alteração)
        commit: 702145a
        linhas:
        - '// src/Pix/Pix.MockServer/Application/JsonContext.cs: abaixo do atributo de CriarCobrancaRequest'
        - '[JsonSerializable(typeof(CriarDevolucaoRequest))]'
        - ''
        - '// src/Pix/Pix.MockServer/Program.cs: no MapPost("/devolucoes"), logo depois da validação de segurança'
        - '    if (!context.Request.Headers.TryGetValue("Idempotency-Key", out var idempotencyKey) || string.IsNullOrWhiteSpace(idempotencyKey))'
        - '    {'
        - '        return Results.ValidationProblem(new Dictionary<string, string[]>'
        - '        {'
        - '            ["Idempotency-Key"] = ["Header Idempotency-Key é obrigatório."]'
        - '        }, extensions: BuildExtensions(context, correlationId));'
        - '    }'
        - ''
        - '// no mesmo endpoint, no lugar de: var devolucao = devolucaoService.Create(request, correlationId);'
        - '    var outcome = devolucaoService.Create(request, idempotencyKey.ToString(), correlationId);'
        - '    if (outcome is { IsConflict: true })'
        - '    {'
        - '        return Results.Conflict(new'
        - '        {'
        - '            title = "Conflito de idempotência",'
        - '            detail = "A mesma chave de idempotência foi usada com payload diferente.",'
        - '            traceId = context.TraceIdentifier,'
        - '            correlationId'
        - '        });'
        - '    }'
        - ''
        - '    if (outcome is { IsIdempotentReplay: true })'
        - '    {'
        - '        return Results.Ok(outcome.Response);'
        - '    }'
        - ''
        - '    var devolucao = outcome?.Response;'
      efeito: servidor_corrigido
    - titulo: Ver o teste passar
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/Pix.MockServer.Tests --filter DevolucaoIdempotenciaTests
        - dotnet test tests/Pix.MockServer.Tests
      sucesso: '`Aprovado: 3` e a suíte com `Aprovado: 10`.'
    - titulo: Repetir as devoluções
      texto: Reinicie o servidor, obtenha o token, crie e liquide outra cobrança e repita as quatro devoluções.
      editor:
        rotulo: terminal
        linhas:
        - 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
        - 'TXID=$(pix -X POST -H "Authorization: Bearer $TOKEN" -H ''Idempotency-Key: cob-1'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas | sed -nE ''s/.*"txid": "([^"]+)".*/\1/p'')'
        - 'pix -X POST -H "Authorization: Bearer $TOKEN" https://localhost:5099/pix/v1/cobrancas/$TXID/simular-liquidacao | grep ''"status"'' | head -1'
        - devolver dev-1 60
        - devolver dev-1 60
        - devolver dev-1 70
        - devolver "" 60
      sucesso: 201 e depois 200 com o mesmo `devolucaoId`, 409 no outro valor e 400 sem a chave.
    - titulo: Rodar o cliente de demonstração
      editor:
        rotulo: terminal
        linhas:
        - dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'
      sucesso: '`POST /pix/v1/devolucoes -> 400` e `Unhandled exception`: o cliente não envia a chave na devolução.'
    - titulo: Pôr a chave na devolução
      texto: Troque a condição do handler do cliente e rode o cliente de novo.
      editor:
        rotulo: arquivo
        caminho: src/Pix/Pix.ClientDemo/Client/Handlers/IdempotencyKeyHandler.cs (alteração)
        commit: 702145a
        linhas:
        - '// src/Pix/Pix.ClientDemo/Client/Handlers/IdempotencyKeyHandler.cs: no lugar da linha com Contains("/pix/v1/cobrancas", ...)'
        - '            (request.RequestUri.AbsolutePath.StartsWith("/pix/v1/cobrancas", StringComparison.OrdinalIgnoreCase) ||'
        - '             request.RequestUri.AbsolutePath.StartsWith("/pix/v1/devolucoes", StringComparison.OrdinalIgnoreCase)) &&'
        - ''
        - '// no terminal:'
        - dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -E 'HTTP (GET|POST)|Unhandled|final|Devolução:'
      efeito: cliente_corrigido
      sucesso: '`POST /pix/v1/devolucoes -> 201` e `Status devolução final: DEVOLVIDA`.'
    - titulo: Ver a política repetir a chamada
      texto: Pare o servidor com Ctrl+C no primeiro terminal e rode o cliente.
      editor:
        rotulo: terminal
        linhas:
        - 'dotnet run --project src/Pix/Pix.ClientDemo 2>&1 | grep -oE "Attempt: ''[0-9]''|Unhandled.*"'
      sucesso: '`Attempt: ''0''` a `Attempt: ''3''` e `Connection refused`: o POST do token foi enviado quatro vezes.'
  - tipo: terminal
    titulo: terminal · net-minimal-api
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: dotnet run --project src/Pix/Pix.MockServer
      saida: 'Now listening on: https://localhost:5099

        Application started. Press Ctrl+C to shut down.

        Hosting environment: Production'
      origem: executado
      dica: 'Na primeira execução, o servidor gera os certificados em `certs/pix/`. Reinicie-o depois de cada troca de código: as cobranças e as chaves ficam na memória do processo.'
    - entrada: openssl x509 -inform DER -in certs/pix/ca.cer -out certs/pix/ca.pem
      saida: ''
      origem: executado
      dica: O `ca.cer` está em DER, e o `curl` espera a autoridade certificadora em PEM.
    - entrada: curl -sS --http1.1 --cacert certs/pix/ca.pem -X POST https://localhost:5099/oauth/token
      saida: 'curl: (56) Recv failure: Connection reset by peer'
      origem: executado
      dica: O texto do erro muda conforme a versão do `curl`, e também aparece `(52) Empty reply from server`. Nos dois casos, o servidor fechou a conexão porque não recebeu certificado do cliente.
    - entrada: pix() { curl -sS --http1.1 --cacert certs/pix/ca.pem --cert certs/pix/client.pfx:pix-demo-123 --cert-type P12 "$@"; }
      saida: ''
      origem: executado
      dica: A função `pix` chama o `curl` com o certificado do cliente e a senha `pix-demo-123`, e repassa os demais argumentos.
    - entrada: 'TOKEN=$(pix -X POST -H ''Content-Type: application/json'' -d ''{"client_id":"pix-demo-client","client_secret":"pix-demo-secret","grant_type":"client_credentials"}'' https://localhost:5099/oauth/token | sed -nE ''s/.*"access_token": "([^"]+)".*/\1/p'')'
      saida: ''
      origem: executado
    - entrada: 'pix -o /dev/null -w ''%{http_code}\n'' -X POST -H ''Idempotency-Key: x'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas'
      saida: '401'
      origem: executado
      dica: Com certificado e sem token, o handshake passa e a API responde 401.
    - entrada: 'TXID=$(pix -X POST -H "Authorization: Bearer $TOKEN" -H ''Idempotency-Key: cob-1'' -H ''Content-Type: application/json'' -d @cobranca.json https://localhost:5099/pix/v1/cobrancas | sed -nE ''s/.*"txid": "([^"]+)".*/\1/p'')'
      saida: ''
      origem: executado
      dica: Crie antes o `cobranca.json` do passo 3 na raiz do repositório.
    - entrada: 'pix -X POST -H "Authorization: Bearer $TOKEN" https://localhost:5099/pix/v1/cobrancas/$TXID/simular-liquidacao | grep ''"status"'' | head -1'
      saida: '  "status": "CONCLUIDA",'
      origem: executado
    - entrada: 'devolver() { pix -i -X POST -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' ${1:+-H "Idempotency-Key: $1"} -d "{\"txid\":\"$TXID\",\"endToEndId\":\"E2E12345678901234567\",\"valor\":$2,\"natureza\":\"ORIGINAL\",\"motivo\":\"Teste\"}" https://localhost:5099/pix/v1/devolucoes | tr -d ''\r'' | grep -E ''^HTTP|"devolucaoId"|"title"''; }'
      saida: ''
      origem: executado
      dica: A função `devolver` recebe a chave e o valor. Com a chave vazia, a chamada vai sem o cabeçalho `Idempotency-Key`.
    - entrada: devolver dev-1 60
      condicao:
      - servidor_corrigido
      - '!dev_corrigida_feita'
      saida: "HTTP/1.1 201 Created\n  \"devolucaoId\": \"e5678129797e4a8ca12d67f880f3c87d\","
      origem: executado
      efeito: dev_corrigida_feita
    - entrada: devolver dev-1 60
      condicao: servidor_corrigido
      saida: "HTTP/1.1 200 OK\n  \"devolucaoId\": \"e5678129797e4a8ca12d67f880f3c87d\","
      origem: executado
      dica: A repetição devolve a mesma devolução, com 200.
    - entrada: devolver dev-1 60

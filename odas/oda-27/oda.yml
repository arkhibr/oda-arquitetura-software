  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - if (builder.Environment.IsEnvironment("Testing"))
    - '{'
    - '    var testDbName = $"TestDb_{Guid.NewGuid():N}.db";'
    - '    var testDbPath = Path.Combine(Path.GetTempPath(), testDbName);'
    - '    builder.Services.AddDbContext<AppDbContext>(options =>'
    - '        options.UseSqlite($"Data Source={testDbPath}"));'
    - '}'
    anotacoes:
    - linha: 54
      texto: Um nome novo a cada host criado, isto é, a cada factory.
    - linha: 55
      texto: O arquivo vai para o diretório temporário, e nenhum código o apaga.
    inicio: 52
    contexto: O `Program.cs` da raiz monta a aplicação e escolhe o banco de dados conforme o ambiente em que a API sobe. O trecho abaixo é o ramo do ambiente `Testing`, que registra um arquivo SQLite com nome aleatório no diretório temporário a cada host criado, e é esse ramo que os testes de API usam.
  - tipo: editor
    rotulo: arquivo
    caminho: Program.cs
    commit: 702145a
    linhas:
    - if (!app.Environment.IsEnvironment("Testing"))
    - '{'
    - '    using var scope = app.Services.CreateScope();'
    - '    var dbContext = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
    - '    dbContext.Database.Migrate();'
    - '    ProdutosAPI.Catalogo.Infrastructure.Data.DbSeeder.Seed(dbContext);'
    - '}'
    anotacoes:
    - linha: 213
      texto: Em Testing, a API não aplica as migrations.
    - linha: 217
      texto: Fora dos testes, o esquema vem das migrations.
    inicio: 213
    contexto: Este trecho pertence ao mesmo `Program.cs` e roda logo depois de a aplicação ser construída. Fora do ambiente `Testing`, ele aplica as migrations com `Database.Migrate()` e roda o seed, e no ambiente de teste ele não faz nada, deixando a preparação do banco para a `ApiFactory`.
  - tipo: editor
    rotulo: arquivo
    caminho: tests/ProdutosAPI.Tests/Integration/ApiFactory.cs
    commit: 702145a
    linhas:
    - '    protected override IHost CreateHost(IHostBuilder builder)'
    - '    {'
    - '        var host = base.CreateHost(builder);'
    - '        using var scope = host.Services.CreateScope();'
    - '        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
    - '        db.Database.EnsureCreated();'
    - '        DbSeeder.Seed(db);'
    - '        return host;'
    - '    }'
    anotacoes:
    - linha: 30
      texto: Nos testes, o esquema vem do modelo, e as migrations nunca rodam.
    - linha: 31
      texto: Os oito produtos do seed entram em cada banco de teste.
    inicio: 25
    contexto: O `ApiFactory.cs` é a `WebApplicationFactory` do projeto de testes, que sobe a API em memória no ambiente `Testing` para os testes de integração. O trecho abaixo é o `CreateHost`, que cria o esquema com `EnsureCreated` a partir do modelo do EF Core e insere os dados do seed em cada banco de teste.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o que acontece quando alguém altera o modelo do EF Core e esquece a migration, com a factory antiga e com a nova. Depois, classifique o que cada técnica de teste prova.

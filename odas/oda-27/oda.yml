id: '27'
titulo: Testes de API com WebApplicationFactory
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: 'O objetivo desta ODA é corrigir dois defeitos da suíte de testes de integração do `net-minimal-api`, que sobe a API real em memória: a `ApiFactory` deixa um arquivo SQLite no diretório temporário a cada classe de teste e nunca o apaga, e monta o esquema com `EnsureCreated`, que ignora as migrations e aprova uma mudança de modelo que derruba a API no deploy. Esses defeitos enchem o disco das máquinas que rodam a suíte e fazem os testes aprovarem um código que a produção recusa. Você vai medir os dois efeitos, escrever os testes que os denunciam e trocar a factory por uma que usa SQLite em memória e `Migrate`.'
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, middlewares, autenticação e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests`.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, com um método que aplica a mudança e outro que a desfaz. A API aplica as migrations em ordem ao subir.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: SQLite e SQLite em memória
      definicao: O SQLite é um banco relacional que roda dentro do processo da aplicação e guarda os dados num arquivo. Com a string de conexão `Data Source=:memory:`, ele guarda o banco na memória da conexão, e o banco deixa de existir quando a conexão fecha.
      referencia:
        rotulo: 'SQLite: in-memory databases'
        url: https://www.sqlite.org/inmemorydb.html
    - termo: Factory de testes (ApiFactory)
      definicao: Classe do projeto de testes que sobe a API para os testes de integração e prepara o banco de cada execução. No repositório, a `ApiFactory` estende a `WebApplicationFactory`.
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a seguir quando o modelo tem mudanças que nenhuma migration descreve.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: WebApplicationFactory e TestServer
      definicao: A `WebApplicationFactory` executa o `Program.cs` da API dentro do processo de teste e troca o Kestrel, o servidor web do ASP.NET Core, por um `TestServer`. O `TestServer` atende o `HttpClient` do teste na memória, sem abrir porta de rede.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: ConfigureTestServices
      definicao: Método da factory de testes que roda depois dos registros de serviços do `Program.cs` e permite remover e substituir serviços só nos testes, como o registro do `AppDbContext`.
    - termo: EF Core (Entity Framework Core), DbContext e modelo
      definicao: O EF Core é a biblioteca de mapeamento objeto-relacional da Microsoft para .NET. O `DbContext`, que no repositório é o `AppDbContext`, representa a sessão com o banco, e o modelo é a descrição das entidades, tabelas e índices que o EF Core monta a partir das classes e do mapeamento.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: Ambiente de execução (Testing)
      definicao: Nome do ambiente em que a aplicação ASP.NET Core roda, como `Development`, `Production` ou `Testing`, que o código consulta para escolher configurações. No repositório, o ambiente `Testing` faz a API usar um banco próprio e não aplicar as migrations.
      referencia:
        rotulo: 'Microsoft Learn: usar vários ambientes no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/fundamentals/environments
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros que a aplicação insere num banco novo para que ele já tenha dados de exemplo. Cada banco de teste do repositório recebe os oito produtos do seed.
    - termo: Snapshot do modelo e HasPendingModelChanges
      definicao: A cada migration, o EF Core grava um snapshot, uma fotografia em código do modelo naquele ponto. O método `HasPendingModelChanges` compara o modelo atual com esse snapshot e indica se existe mudança sem migration, a mesma condição que gera o aviso `PendingModelChangesWarning`.
    - termo: xUnit e IClassFixture
      definicao: O xUnit é o framework de testes do repositório. Uma classe que declara `IClassFixture<T>` recebe uma instância de `T` criada uma vez para a classe, e por isso o repositório cria uma factory, e um banco, por classe de teste.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: Agente de CI (integração contínua)
      definicao: Máquina que executa automaticamente a compilação e os testes a cada alteração enviada ao repositório. Por rodar a suíte muitas vezes, ele acumula os arquivos que os testes deixam no diretório temporário.
      referencia:
        rotulo: 'Martin Fowler: Continuous Integration'
        url: https://martinfowler.com/articles/continuousIntegration.html
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que o `WebApplicationFactory` sobe e por que os testes não abrem porta de rede.
    - Substituir um serviço da API nos testes com `ConfigureTestServices`.
    - Diferenciar `EnsureCreated` de `Migrate` e o que cada um prova sobre o esquema.
    - Isolar o banco de cada classe de teste sem deixar arquivos para trás.
    - Escrever um teste que falha quando o modelo muda sem migration.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10 e do Git. O repositório é o `arkhibr/net-minimal-api` no commit `702145a`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no Git Bash ou no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `net-minimal-api`, que contém a API de catálogo e pedidos em ASP.NET Core Minimal APIs, o simulador de Pix e os projetos de teste. Todas as abas se referem ao commit `702145a`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: net-minimal-api no GitHub, commit 702145a
      url: https://github.com/arkhibr/net-minimal-api/tree/702145a
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `net-minimal-api` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/net-minimal-api
        - cd net-minimal-api
    - titulo: Fixar o commit `702145a`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 702145a
    - titulo: Compilar a API
      texto: O comando baixa os pacotes NuGet e compila a API, e a primeira execução demora mais porque o NuGet preenche o cache local. Neste commit, a compilação da solução inteira falha no projeto `tests/Pedidos.Tests`, que referencia um namespace inexistente, e por isso os laboratórios compilam e testam só os projetos que usam.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build ProdutosAPI.csproj
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: Qualquer versão 10.x atende.
    - entrada: git --version
      saida: git version 2.50.1
      origem: exemplo
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Git
      comando: git --version
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica o que um teste de integração com `WebApplicationFactory` executa de verdade e as duas decisões que definem o banco desses testes, onde ele fica e quem cria o esquema. Os blocos abaixo definem cada conceito antes do comparativo entre `EnsureCreated` e `Migrate`, e o repositório descreve a estratégia de testes no arquivo `docs/05-TESTES.md`.
  - tipo: conceito
    titulo: Teste de integração
    texto: Um teste de integração exercita várias partes reais do sistema juntas, como rotas, middlewares, autenticação e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests`, e cada classe de teste recebe a própria `ApiFactory` pelo `IClassFixture` do xUnit, o framework de testes usado.
  - tipo: conceito
    titulo: WebApplicationFactory
    texto: A `WebApplicationFactory` executa o `Program.cs` da API com o ambiente escolhido e troca o Kestrel, o servidor web do ASP.NET Core, por um `TestServer`, que atende o `HttpClient` do teste na memória. Rotas, middlewares, autenticação, validação e banco são os reais, e só a rede fica de fora.
  - tipo: conceito
    titulo: ConfigureTestServices
    texto: O `ConfigureTestServices` roda depois dos registros do `Program.cs` e permite remover e substituir serviços só nos testes. É o ponto para trocar o banco, um relógio ou um cliente HTTP externo sem condicionais de ambiente no código da API.
  - tipo: conceito
    titulo: Migrations, EnsureCreated e Migrate
    texto: O EF Core (Entity Framework Core), a biblioteca de acesso a dados da API, descreve cada mudança no esquema do banco numa migration. O `Database.Migrate()` aplica as migrations em ordem e se recusa a seguir quando o modelo tem mudança sem migration, e o `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations.
  - tipo: conceito
    titulo: SQLite em memória
    texto: O SQLite é um banco relacional que roda dentro do processo da aplicação e normalmente guarda os dados num arquivo. Com `Data Source=:memory:`, ele guarda o banco na conexão, e o banco deixa de existir quando a conexão fecha, e por isso uma conexão aberta por factory dá a cada classe de teste um banco próprio, descartado com a factory.
  - tipo: comparativo
    colunas:
    - EnsureCreated
    - Migrate
    linhas:
    - dimensao: De onde vem o esquema
      valores:
      - Do modelo atual do `DbContext`
      - Das migrations, em ordem
    - dimensao: Mudança de modelo sem migration
      valores:
      - Passa despercebida
      - Falha com `PendingModelChangesWarning`
    - dimensao: Tabela de histórico
      valores:
      - Não existe
      - '`__EFMigrationsHistory` com cada migration aplicada'
    - dimensao: Usado no commit 702145a
      valores:
      - Na `ApiFactory` dos testes
      - No `Program.cs`, fora do ambiente Testing

      origem: executado
      dica: 'Os 143 testes passam com o modelo alterado: o `EnsureCreated` monta o banco a partir do modelo e ignora as migrations.'
    - entrada: dotnet test tests/ProdutosAPI.Tests
      saida: 'Aprovado!  – Com falha:     0, Aprovado:   143, Ignorado:     0, Total:   143, Duração: 979 ms - ProdutosAPI.Tests.dll (net10.0)'
      origem: executado
    cenarios:
    - rotulo: Contar os bancos
      comando: antes=$(contar); dotnet test tests/ProdutosAPI.Tests > /dev/null; echo "$antes -> $(contar)"
    - rotulo: Suíte
      comando: dotnet test tests/ProdutosAPI.Tests
    - rotulo: Testes do banco
      comando: dotnet test tests/ProdutosAPI.Tests --filter BancoDeTesteTests
    - rotulo: Subir a API
      comando: rm -f produtos-api.db && dotnet run --launch-profile http
    - rotulo: Desfazer

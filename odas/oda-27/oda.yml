- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria com essa suíte de testes, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: Agente de CI (integração contínua)
      definicao: Máquina que executa automaticamente a compilação e os testes a cada alteração enviada ao repositório. Por rodar a suíte muitas vezes, ele acumula os arquivos que os testes deixam no diretório temporário.
      referencia:
        rotulo: 'Martin Fowler: Continuous Integration'
        url: https://martinfowler.com/articles/continuousIntegration.html
    - termo: SQLite e SQLite em memória
      definicao: O SQLite é um banco relacional que roda dentro do processo da aplicação e guarda os dados num arquivo. Com a string de conexão `Data Source=:memory:`, ele guarda o banco na memória da conexão, e o banco deixa de existir quando a conexão fecha.
      referencia:
        rotulo: 'SQLite: in-memory databases'
        url: https://www.sqlite.org/inmemorydb.html
    - termo: Factory de testes (ApiFactory)
      definicao: Classe do projeto de testes que sobe a API para os testes de integração e prepara o banco de cada execução. No repositório, a `ApiFactory` estende a `WebApplicationFactory`.
    - termo: xUnit e IClassFixture
      definicao: O xUnit é o framework de testes do repositório. Uma classe que declara `IClassFixture<T>` recebe uma instância de `T` criada uma vez para a classe, e por isso o repositório cria uma factory, e um banco, por classe de teste.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: Seed (dados iniciais)
      definicao: Conjunto de registros que a aplicação insere num banco novo para que ele já tenha dados de exemplo. Cada banco de teste do repositório recebe os oito produtos do seed.
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a seguir quando o modelo tem mudanças que nenhuma migration descreve.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: Snapshot do modelo e HasPendingModelChanges
      definicao: A cada migration, o EF Core grava um snapshot, uma fotografia em código do modelo naquele ponto. O método `HasPendingModelChanges` compara o modelo atual com esse snapshot e indica se existe mudança sem migration, a mesma condição que gera o aviso `PendingModelChangesWarning`.
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, com um método que aplica a mudança e outro que a desfaz. A API aplica as migrations em ordem ao subir.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: EF Core (Entity Framework Core), DbContext e modelo
      definicao: O EF Core é a biblioteca de mapeamento objeto-relacional da Microsoft para .NET. O `DbContext`, que no repositório é o `AppDbContext`, representa a sessão com o banco, e o modelo é a descrição das entidades, tabelas e índices que o EF Core monta a partir das classes e do mapeamento.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
  - tipo: incidente
    titulo: Diretório temporário cheio de bancos
    origem: executado
    rotulo_saida: log
    saida: '$ antes=$(contar); dotnet test tests/ProdutosAPI.Tests > /dev/null; echo "$antes -> $(contar)"

      282 -> 290'
    pergunta: O agente de CI fica sem espaço depois de semanas de execução. De onde vêm os arquivos `TestDb_*.db`?
    correcao: Usar SQLite em memória com uma conexão por factory e fechá-la no `Dispose`, como no passo 7.
    alternativas:
    - texto: O seed grava um arquivo por produto.
      correta: false
      explicacao: O seed insere linhas no banco da factory.
    - texto: Cada factory cria um banco com nome novo no diretório temporário, e nenhum código o apaga.
      correta: true
      explicacao: São 8 factories por execução, uma por classe de teste com `IClassFixture`.
    - texto: O `dotnet test` guarda uma cópia do banco de produção.
      correta: false
      explicacao: O banco de produção é o `produtos-api.db`, na raiz.
  - tipo: incidente
    titulo: Suíte verde e API que não sobe
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test tests/ProdutosAPI.Tests

      Aprovado!  – Com falha:     0, Aprovado:   143, Ignorado:     0, Total:   143, Duração: 909 ms - ProdutosAPI.Tests.dll (net10.0)


      $ rm -f produtos-api.db && dotnet run --launch-profile http

      System.InvalidOperationException: An error was generated for warning ''Microsoft.EntityFrameworkCore.Migrations.PendingModelChangesWarning'': The model for context ''AppDbContext'' has pending changes. Add a new migration before updating the database. See https://'
    pergunta: A suíte passou no pull request, e a API parou no deploy. Por que os testes não perceberam?
    correcao: Criar o banco de teste com `Migrate` e manter um teste com `HasPendingModelChanges`, como nos passos 5 e 7.
    alternativas:
    - texto: Os testes usam outro `DbContext`.
      correta: false
      explicacao: É o mesmo `AppDbContext`, com outra string de conexão.
    - texto: O SQLite dos testes é de outra versão.
      correta: false
      explicacao: O pacote é o mesmo projeto da API.
    - texto: A factory monta o banco com `EnsureCreated`, a partir do modelo, e as migrations nunca rodam nos testes.
      correta: true
      explicacao: A API roda `Migrate` ao subir e recusa o modelo sem migration.
  - tipo: incidente
    titulo: Migration que o EF Core não enxerga
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test tests/ProdutosAPI.Tests --filter BancoDeTesteTests

      Expected db.Database.GetPendingMigrations() to be empty because o banco de teste precisa ter o mesmo esquema do banco de produção, but found {"20260227173933_AddPedidos", "20260417184630_AddCategorias", "20260417185252_AddVariantes", "20260417185704_AddAtributosEMidias"}.


      $ ls src/Shared/Data/Migrations/*_*.cs | grep -v Designer

      src/Shared/Data/Migrations/20250225000000_CreateInitialSchema.cs

      src/Shared/Data/Migrations/20260227173933_AddPedidos.cs

      src/Shared/Data/Migrations/20260417184630_AddCategorias.cs

      src/Shared/Data/Migrations/20260417185252_AddVariantes.cs

      src/Shared/Data/Migrations/20260417185704_AddAtributosEMidias.cs'
    pergunta: A pasta tem cinco migrations, e o EF Core lista quatro. Por que a `CreateInitialSchema` ficou de fora?
    correcao: Remover o arquivo, porque a `AddPedidos` já cria a tabela `Produtos`, ou restaurar os atributos `[DbContext]` e `[Migration]` com o arquivo `.Designer.cs`.
    alternativas:
    - texto: O arquivo não tem os atributos `[DbContext]` e `[Migration]`, que ficam no `.Designer.cs`, e o EF Core só reconhece classes com eles.
      correta: true
      explicacao: As outras quatro têm o `.Designer.cs` correspondente.
    - texto: A data de 2025 é anterior ao projeto.
      correta: false
      explicacao: O EF Core ordena pelo identificador, sem validar datas.
    - texto: Ela já foi aplicada e por isso não aparece.
      correta: false
      explicacao: O banco de teste não tinha nenhuma migration aplicada.
  - tipo: incidente
    titulo: Falha que não mostra a causa
    origem: codigo
    rotulo_saida: arquivo
    saida: 'tests/ProdutosAPI.Tests/Integration/Pedidos/ListPedidosTests.cs:39-48

      // Create a pedido first so there''s something to list

      await _client.PostAsJsonAsync("/api/v1/pedidos",

      new CreatePedidoCommand([new(1, 1)]));

      var response = await _client.GetAsync("/api/v1/pedidos");

      response.StatusCode.Should().Be(HttpStatusCode.OK);

      var result = await response.Content.ReadFromJsonAsync<ListPedidosResponse>();

      result.Should().NotBeNull();

      result!.Total.Should().BeGreaterThan(0);'
    pergunta: Se o pedido de preparação receber 400, que mensagem o teste mostra?
    correcao: Conferir o status do POST de preparação antes de listar, para que a falha aponte a etapa que quebrou.
    alternativas:
    - texto: Nenhuma, porque o teste passa.
      correta: false
      explicacao: Sem pedido, o total da listagem é zero, e a asserção falha.
    - texto: Que o total deveria ser maior que zero, sem dizer que a criação do pedido falhou.
      correta: true
      explicacao: O resultado do `PostAsJsonAsync` é descartado.
    - texto: O corpo do 400 com o erro de validação.
      correta: false
      explicacao: O teste não lê a resposta do POST.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: WebApplicationFactory e TestServer
      definicao: A `WebApplicationFactory` executa o `Program.cs` da API dentro do processo de teste e troca o Kestrel, o servidor web do ASP.NET Core, por um `TestServer`. O `TestServer` atende o `HttpClient` do teste na memória, sem abrir porta de rede.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a seguir quando o modelo tem mudanças que nenhuma migration descreve.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: SQLite e SQLite em memória
      definicao: O SQLite é um banco relacional que roda dentro do processo da aplicação e guarda os dados num arquivo. Com a string de conexão `Data Source=:memory:`, ele guarda o banco na memória da conexão, e o banco deixa de existir quando a conexão fecha.
      referencia:
        rotulo: 'SQLite: in-memory databases'
        url: https://www.sqlite.org/inmemorydb.html
    - termo: ConfigureTestServices
      definicao: Método da factory de testes que roda depois dos registros de serviços do `Program.cs` e permite remover e substituir serviços só nos testes, como o registro do `AppDbContext`.
    - termo: Snapshot do modelo e HasPendingModelChanges
      definicao: A cada migration, o EF Core grava um snapshot, uma fotografia em código do modelo naquele ponto. O método `HasPendingModelChanges` compara o modelo atual com esse snapshot e indica se existe mudança sem migration, a mesma condição que gera o aviso `PendingModelChangesWarning`.
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, com um método que aplica a mudança e outro que a desfaz. A API aplica as migrations em ordem ao subir.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
  - tipo: quiz
    perguntas:
    - enunciado: O que o `WebApplicationFactory` deixa de fora da API real?
      alternativas:
      - texto: A autenticação.
        correta: false
        explicacao: Os testes de 401 provam que ela roda.
      - texto: O `Program.cs`.
        correta: false
        explicacao: A factory executa o `Program.cs`.
      - texto: 'A rede: o `TestServer` atende o `HttpClient` na memória, sem porta.'
        correta: true
        explicacao: Rotas, middlewares e banco são os da API.
    - enunciado: Por que trocar `EnsureCreated` por `Migrate` na factory?
      alternativas:
      - texto: Para o banco de teste ter o esquema das migrations, o mesmo que a produção recebe.
        correta: true
        explicacao: Assim a suíte recusa um modelo sem migration.
      - texto: Porque `Migrate` é mais rápido.
        correta: false
        explicacao: O motivo é a fidelidade do esquema.
      - texto: Porque `EnsureCreated` não funciona com SQLite.
        correta: false
        explicacao: Funciona, e era usado no commit.
    - enunciado: Por que a conexão SQLite em memória fica aberta durante toda a vida da factory?
      alternativas:
      - texto: Porque o EF Core exige uma conexão aberta.
        correta: false
        explicacao: Com arquivo, o EF Core abre e fecha a conexão sozinho.
      - texto: Porque o banco em memória deixa de existir quando a conexão fecha.
        correta: true
        explicacao: O `Dispose` da factory fecha a conexão e descarta o banco.
      - texto: Para o banco ser compartilhado entre todas as classes.
        correta: false
        explicacao: Cada factory abre a própria conexão.
    - enunciado: Onde a troca do banco deve acontecer?
      alternativas:
      - texto: Num `if` a mais no `Program.cs`.
        correta: false
        explicacao: É a condição de ambiente que o laboratório deixou de depender.
      - texto: Em cada classe de teste.
        correta: false
        explicacao: A factory concentra a configuração.
      - texto: No `ConfigureTestServices` da factory, depois dos registros do `Program.cs`.
        correta: true
        explicacao: O código da API não precisa saber dos testes.
    - enunciado: O que o teste `Migrations_CobremOModeloAtual` impede?
      alternativas:
      - texto: O merge de uma mudança de modelo sem migration.
        correta: true
        explicacao: '`HasPendingModelChanges` compara o modelo com o snapshot das migrations.'
      - texto: Migrations duplicadas.
        correta: false
        explicacao: Ele não compara migrations entre si.
      - texto: Dados de seed errados.
        correta: false
        explicacao: Ele não lê dados.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A suíte original deixou um banco por factory no diretório temporário.
    - A mudança de modelo sem migration passou na suíte original e parou a API.
    - Os testes do banco falharam antes da troca da factory e passaram depois.
    - A suíte com a factory nova não deixou arquivos.
    - A mesma mudança de modelo passou a falhar nos testes.

  - tipo: fluxo
    titulo: Um índice alterado sem migration
    etapas:
    - titulo: Mudança
      descricao: Um desenvolvedor acrescenta `HasFilter` ao índice de SKU da variante e não gera a migration.
    - titulo: Factory antiga
      descricao: O `EnsureCreated` cria o banco com o índice novo, e os 143 testes passam.
    - titulo: Deploy
      descricao: A API chama `Migrate` ao subir, encontra um modelo sem migration e para com `PendingModelChangesWarning`.
    - titulo: Factory nova
      descricao: A factory chama `Migrate`, e a criação do banco de teste falha com o mesmo erro antes do merge.
    - titulo: Correção
      descricao: O desenvolvedor gera a migration, e a suíte e a API voltam a subir com o mesmo esquema.
  - tipo: classificador
    enunciado: O que esta escolha de teste prova?
    categorias:
    - id: prova
      rotulo: Prova
    - id: nao
      rotulo: Não prova
    itens:
    - texto: Com `WebApplicationFactory`, a rota exige token
      categoria: prova
      explicacao: A autenticação real roda no pipeline do `TestServer`.
    - texto: Com `EnsureCreated`, as migrations criam o esquema da produção
      categoria: nao
      explicacao: O esquema vem do modelo, e as migrations nunca rodam.
    - texto: Com `Migrate`, o modelo e as migrations estão de acordo
      categoria: prova
      explicacao: Um modelo sem migration derruba a criação do banco.
    - texto: Com `TestServer`, a API aceita conexões na porta 5000
      categoria: nao
      explicacao: O `TestServer` não abre porta de rede.
    - texto: Com SQLite em memória, uma classe não vê os dados de outra
      categoria: prova
      explicacao: Cada factory tem a própria conexão e, portanto, o próprio banco.
    - texto: Com SQLite, o comportamento é igual ao de outro banco de produção
      categoria: nao
      explicacao: Os testes provam o comportamento no SQLite, que é o banco da API neste repositório.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer a suíte parar de deixar bancos no diretório temporário e passar a recusar mudanças de modelo sem migration, trocando o banco dos testes por um SQLite em memória criado pelas migrations. Os passos 1 a 4 medem os arquivos deixados pela suíte e mostram uma mudança de modelo que a suíte não percebe, os passos 5 a 8 escrevem os testes e trocam a factory, e os passos 9 e 10 repetem a mudança de modelo com a factory nova. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: Teste de integração
      definicao: Teste que exercita várias partes reais do sistema juntas, como rotas, middlewares, autenticação e banco, por meio de requisições HTTP à API. No repositório, esses testes ficam em `tests/ProdutosAPI.Tests`.
      referencia:
        rotulo: 'Microsoft Learn: testes de integração no ASP.NET Core'
        url: https://learn.microsoft.com/pt-br/aspnet/core/test/integration-tests
    - termo: SQLite e SQLite em memória
      definicao: O SQLite é um banco relacional que roda dentro do processo da aplicação e guarda os dados num arquivo. Com a string de conexão `Data Source=:memory:`, ele guarda o banco na memória da conexão, e o banco deixa de existir quando a conexão fecha.
      referencia:
        rotulo: 'SQLite: in-memory databases'
        url: https://www.sqlite.org/inmemorydb.html
    - termo: Migration (migração de esquema)
      definicao: Classe gerada pelo EF Core que descreve uma mudança no esquema do banco, com um método que aplica a mudança e outro que a desfaz. A API aplica as migrations em ordem ao subir.
      referencia:
        rotulo: 'Microsoft Learn: visão geral das migrations do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/migrations/
    - termo: Factory de testes (ApiFactory)
      definicao: Classe do projeto de testes que sobe a API para os testes de integração e prepara o banco de cada execução. No repositório, a `ApiFactory` estende a `WebApplicationFactory`.
    - termo: EnsureCreated e Migrate
      definicao: São duas formas de o EF Core criar o banco. O `EnsureCreated` monta as tabelas direto do modelo atual e ignora as migrations, e o `Database.Migrate()` aplica as migrations pendentes e se recusa a seguir quando o modelo tem mudanças que nenhuma migration descreve.
      referencia:
        rotulo: 'Microsoft Learn: criar e descartar APIs do EF Core'
        url: https://learn.microsoft.com/pt-br/ef/core/managing-schemas/ensure-created
    - termo: Snapshot do modelo e HasPendingModelChanges
      definicao: A cada migration, o EF Core grava um snapshot, uma fotografia em código do modelo naquele ponto. O método `HasPendingModelChanges` compara o modelo atual com esse snapshot e indica se existe mudança sem migration, a mesma condição que gera o aviso `PendingModelChangesWarning`.
    - termo: ConfigureTestServices
      definicao: Método da factory de testes que roda depois dos registros de serviços do `Program.cs` e permite remover e substituir serviços só nos testes, como o registro do `AppDbContext`.
    - termo: EF Core (Entity Framework Core), DbContext e modelo
      definicao: O EF Core é a biblioteca de mapeamento objeto-relacional da Microsoft para .NET. O `DbContext`, que no repositório é o `AppDbContext`, representa a sessão com o banco, e o modelo é a descrição das entidades, tabelas e índices que o EF Core monta a partir das classes e do mapeamento.
      referencia:
        rotulo: 'Microsoft Learn: Entity Framework Core'
        url: https://learn.microsoft.com/pt-br/ef/core/
    - termo: xUnit e IClassFixture
      definicao: O xUnit é o framework de testes do repositório. Uma classe que declara `IClassFixture<T>` recebe uma instância de `T` criada uma vez para a classe, e por isso o repositório cria uma factory, e um banco, por classe de teste.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
  - tipo: faixa
    estilo: objetivo
    problema: No ambiente `Testing`, o `Program.cs` registra um arquivo SQLite com nome aleatório no diretório temporário a cada host criado, e nenhum código o apaga. A `ApiFactory.cs` cria o esquema com `EnsureCreated`, a partir do modelo, e as migrations nunca rodam nos testes.
    impacto: Cada execução da suíte deixa 8 arquivos `TestDb_*.db`, um por factory, e o agente de CI acumula esses arquivos até ficar sem espaço. Uma mudança de modelo sem migration passa nos 143 testes e só aparece no deploy, quando a API para com `PendingModelChangesWarning`.
    mecanismo: O laboratório troca a factory por uma que abre uma conexão SQLite em memória por factory e a fecha no `Dispose`, substitui o registro do `AppDbContext` com `ConfigureTestServices` e cria o esquema com `Migrate`. Um teste novo com `HasPendingModelChanges` passa a acusar mudança de modelo sem migration.
    comprovacao: 'Os testes do banco falham com `Com falha: 2` antes da troca e passam com `Aprovado: 3` depois, com a suíte em `Aprovado: 146` e a mesma contagem de arquivos antes e depois da execução. A mesma mudança de modelo sem migration passa a derrubar 49 testes.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/net-minimal-api`, entre na pasta criada e rode `git checkout 702145a`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `702145a` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` e o banco `produtos-api.db` continuam no lugar, porque o Git os ignora.'
  - tipo: passos
    itens:
    - titulo: Contar os bancos deixados pela suíte
      editor:
        rotulo: terminal
        linhas:
        - contar() { ls "${TMPDIR:-/tmp}"/TestDb_*.db 2>/dev/null | wc -l | tr -d ' '; }
        - antes=$(contar); dotnet test tests/ProdutosAPI.Tests > /dev/null; echo "$antes -> $(contar)"
      sucesso: Dois números, e o segundo é 8 maior que o primeiro.
    - titulo: Alterar o modelo sem migration
      texto: Acrescente a linha do `HasFilter` ao índice e não gere migration.
      editor:
        rotulo: arquivo
        caminho: src/Shared/Data/AppDbContext.cs (alteração temporária)
        commit: 702145a
        linhas:
        - '// src/Shared/Data/AppDbContext.cs: no índice de ProdutoId e Sku da Variante, acrescente a linha do HasFilter'
        - '            entity.HasIndex(v => new { v.ProdutoId, v.Sku })'
        - '                .IsUnique()'
        - '                .HasFilter("Ativa = 1")'
        - '                .HasDatabaseName("idx_variante_produto_sku");'
      efeito: modelo_alterado
    - titulo: Rodar a suíte e a API
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests
        - rm -f produtos-api.db && dotnet run --launch-profile http
      sucesso: '`Aprovado: 143` na suíte e a API parada com `PendingModelChangesWarning`.'
    - titulo: Desfazer a alteração
      editor:
        rotulo: terminal
        linhas:
        - git checkout src/Shared/Data/AppDbContext.cs
      sucesso: '`Updated 1 path from the index`.'
    - titulo: Escrever os testes do banco de teste
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/BancoDeTesteTests.cs (novo)
        commit: 702145a
        linhas:
        - using FluentAssertions;
        - using Microsoft.EntityFrameworkCore;
        - using Microsoft.Extensions.DependencyInjection;
        - using ProdutosAPI.Shared.Data;
        - using Xunit;
        - ''
        - namespace ProdutosAPI.Tests.Integration;
        - ''
        - 'public class BancoDeTesteTests(ApiFactory factory) : IClassFixture<ApiFactory>'
        - '{'
        - '    [Fact]'
        - '    public void Migrations_CobremOModeloAtual()'
        - '    {'
        - '        using var scope = factory.Services.CreateScope();'
        - '        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
        - ''
        - '        db.Database.HasPendingModelChanges().Should().BeFalse("toda mudança no modelo precisa de uma migration");'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void Banco_FoiCriadoPelasMigrations()'
        - '    {'
        - '        using var scope = factory.Services.CreateScope();'
        - '        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
        - ''
        - '        db.Database.GetPendingMigrations().Should().BeEmpty("o banco de teste precisa ter o mesmo esquema do banco de produção");'
        - '    }'
        - ''
        - '    [Fact]'
        - '    public void Banco_FicaNaMemoria()'
        - '    {'
        - '        using var scope = factory.Services.CreateScope();'
        - '        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
        - ''
        - '        db.Database.GetConnectionString().Should().Contain(":memory:", "a suíte não pode deixar arquivos de banco no diretório temporário");'
        - '    }'
        - '}'
      efeito: teste_banco
    - titulo: Ver os testes falharem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter BancoDeTesteTests
      sucesso: '`Com falha: 2`, com o caminho de um `TestDb_*.db` e as 4 migrations pendentes.'
    - titulo: Trocar a factory
      texto: Substitua o arquivo pela versão abaixo. Ela abre uma conexão SQLite em memória por factory, troca o registro do `AppDbContext` com `ConfigureTestServices` e cria o esquema com `Migrate`.
      editor:
        rotulo: arquivo
        caminho: tests/ProdutosAPI.Tests/Integration/ApiFactory.cs (substituição)
        commit: 702145a
        linhas:
        - using Microsoft.AspNetCore.Hosting;
        - using Microsoft.AspNetCore.Mvc.Testing;
        - using Microsoft.AspNetCore.TestHost;
        - using Microsoft.Data.Sqlite;
        - using Microsoft.EntityFrameworkCore;
        - using Microsoft.EntityFrameworkCore.Infrastructure;
        - using Microsoft.Extensions.DependencyInjection;
        - using Microsoft.Extensions.DependencyInjection.Extensions;
        - using Microsoft.Extensions.Hosting;
        - using ProdutosAPI.Catalogo.API.Extensions;
        - using ProdutosAPI.Shared.Data;
        - using ProdutosAPI.Catalogo.Infrastructure.Data;
        - ''
        - namespace ProdutosAPI.Tests.Integration;
        - ''
        - 'public class ApiFactory : WebApplicationFactory<Program>'
        - '{'
        - '    // Um banco SQLite em memória por factory: existe enquanto a conexão estiver aberta'
        - '    private readonly SqliteConnection _conexao = new("Data Source=:memory:");'
        - ''
        - '    protected override void ConfigureWebHost(IWebHostBuilder builder)'
        - '    {'
        - '        builder.UseEnvironment("Testing");'
        - '        // Program.cs pula AddCatalogoRateLimiting() em Testing; cada factory registra seus próprios limites'
        - '        builder.ConfigureServices(AddRateLimiting);'
        - '        builder.ConfigureTestServices(services =>'
        - '        {'
        - '            // Remove o banco em arquivo registrado pelo Program.cs, inclusive a configuração que o EF Core guarda à parte'
        - '            services.RemoveAll<DbContextOptions<AppDbContext>>();'
        - '            services.RemoveAll<IDbContextOptionsConfiguration<AppDbContext>>();'
        - '            _conexao.Open();'
        - '            services.AddDbContext<AppDbContext>(options => options.UseSqlite(_conexao));'
        - '        });'
        - '    }'
        - ''
        - '    // Limites altos para não interferir em testes funcionais existentes'
        - '    protected virtual void AddRateLimiting(IServiceCollection services) =>'
        - '        services.AddCatalogoRateLimitingWithLimits(leituraLimit: 10000, escritaLimit: 10000, criacaoProdutoLimit: 10000);'
        - ''
        - '    protected override IHost CreateHost(IHostBuilder builder)'
        - '    {'
        - '        var host = base.CreateHost(builder);'
        - '        using var scope = host.Services.CreateScope();'
        - '        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();'
        - '        db.Database.Migrate();'
        - '        DbSeeder.Seed(db);'
        - '        return host;'
        - '    }'
        - ''
        - '    protected override void Dispose(bool disposing)'
        - '    {'
        - '        base.Dispose(disposing);'
        - '        if (disposing)'
        - '        {'
        - '            _conexao.Dispose();'
        - '        }'
        - '    }'
        - '}'
      efeito: fabrica_nova
    - titulo: Ver os testes passarem
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests --filter BancoDeTesteTests
        - dotnet test tests/ProdutosAPI.Tests
        - antes=$(contar); dotnet test tests/ProdutosAPI.Tests > /dev/null; echo "$antes -> $(contar)"
      sucesso: '`Aprovado: 3`, a suíte com `Aprovado: 146` e os dois números iguais.'
    - titulo: Alterar o modelo de novo
      texto: Repita a alteração do passo 2 e rode os testes.
      editor:
        rotulo: terminal
        linhas:
        - dotnet test tests/ProdutosAPI.Tests
        - dotnet test tests/ProdutosAPI.Tests --filter BancoDeTesteTests 2>&1 | grep -E '^  Com falha|InvalidOperationException|Com falha!' | cut -c1-200
      efeito: modelo_alterado_de_novo
      sucesso: '`Com falha: 49` na suíte e `PendingModelChangesWarning` nos testes do banco.'
    - titulo: Desfazer e conferir
      editor:
        rotulo: terminal
        linhas:
        - git checkout src/Shared/Data/AppDbContext.cs
        - dotnet test tests/ProdutosAPI.Tests
      sucesso: '`Aprovado: 146`.'

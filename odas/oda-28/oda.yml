id: '28'
titulo: Aspire, LocalStack e testes de integração com nuvem emulada
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é entender como um teste de integração sobe a nuvem emulada e escolher o escopo da fixture, pesando o tempo de cada execução contra o isolamento entre os testes. No repositório `aspire-aws`, cada cenário é um projeto de testes cuja `Fixture` usa o .NET Aspire para subir o LocalStack, que emula serviços da AWS, e cada classe de teste com `IClassFixture` sobe uma cópia nova. Você vai medir o custo de uma classe a mais, compartilhar a fixture entre classes e corrigir o teste que passa a interferir no vizinho.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que o builder de testes do Aspire sobe a partir do projeto `AppHost`.
    - Descrever o caminho de um teste até o LocalStack, pela porta 4566.
    - Diferenciar `IClassFixture` de `ICollectionFixture` pelo número de ambientes que sobem.
    - Reconhecer um teste que depende de estado deixado por outro teste.
    - Explicar por que os cenários rodam um de cada vez.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, exigido pelo `global.json`, do Git e de um Docker em execução. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · rodar o cenário 01
    comandos:
    - entrada: inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     5, Ignorado:     0, Total:     5, Duração: 501 ms - 01-S3.Basic.dll (net10.0)

        14 s'
      origem: executado
      dica: Os testes levam menos de um segundo, e o resto dos 14 s é o Aspire subindo o LocalStack e o PostgreSQL. A primeira execução na máquina demora mais, porque baixa as imagens.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: executado
      dica: Qualquer versão recente serve. Se o comando falhar, o Docker não está em execução.
    cenarios:
    - rotulo: Docker em execução
      comando: docker info --format '{{.ServerVersion}}'
    - rotulo: Rodar o cenário 01
      comando: inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as três peças que separam um teste de um serviço da AWS emulado e o que define quantas vezes o ambiente sobe. No repositório, a ADR-002 registra a escolha do Aspire, a ADR-003 a do LocalStack e a ADR-004 a execução de um cenário por vez.
  - tipo: conceito
    titulo: AppHost
    texto: 'O `src/AppHost/Program.cs` declara os contêineres que o ambiente precisa: o LocalStack na porta 4566 e um PostgreSQL na porta 5433. O teste não roda o AppHost como programa: o builder de testes do Aspire, chamado na `LocalStackFixture`, lê essa declaração e sobe os contêineres dentro do processo de teste.'
  - tipo: conceito
    titulo: LocalStack
    texto: O LocalStack responde na porta 4566 às mesmas chamadas HTTP que a AWS, para os serviços listados na variável `SERVICES`. O SDK da AWS só precisa apontar para `http://localhost:4566`, o que o `AwsClientFactory` faz em cada cliente.
  - tipo: comparativo
    colunas:
    - IClassFixture
    - ICollectionFixture
    linhas:
    - dimensao: Quantas vezes o ambiente sobe
      valores:
      - Uma vez por classe de teste
      - Uma vez por coleção
    - dimensao: Estado entre classes
      valores:
      - 'Separado: cada classe tem o próprio LocalStack'
      - 'Compartilhado: buckets e filas de uma classe aparecem na outra'
    - dimensao: Exigência sobre os testes
      valores:
      - Nomes únicos dentro da classe
      - Nomes únicos em toda a coleção
  - tipo: adr
    id: ADR-004
    titulo: Tática de isolamento entre cenários de teste
    status: proposed
    contexto: Os 16 projetos de teste usam a mesma porta 4566, e dois LocalStack ao mesmo tempo disputariam a porta.
    decisao: 'Porta fixa com execução sequencial: `MaxCpuCount=1` no `test.runsettings` e um lock de arquivo na `LocalStackFixture`.'
    alternativas: Porta aleatória por cenário, rede Docker por cenário e nenhuma proteção.
    consequencias: Comportamento previsível e simples, com a suíte inteira rodando em sequência e sem usar vários núcleos.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra, no commit `50a5344`, os três arquivos que definem o custo e o isolamento dos testes: o AppHost, que declara os contêineres, a `LocalStackFixture`, que sobe esses contêineres antes do primeiro teste de cada classe, e um teste do cenário 01 que depende de o bucket ser exclusivo da classe. Clique nos marcadores para ler a explicação de cada linha.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: src/AppHost/Program.cs
    commit: 50a5344
    linhas:
    - '    builder'
    - '        .AddContainer("localstack", "localstack/localstack", "3.8")'
    - '        .WithEnvironment("AWS_ACCESS_KEY_ID", "test")'
    - '        .WithEnvironment("AWS_DEFAULT_REGION", "us-east-1")'
    - '        .WithEnvironment("AWS_SECRET_ACCESS_KEY", "test")'
    - '        .WithEnvironment("SERVICES", "s3,sqs,sns,dynamodb,lambda,ssm,secretsmanager,events,scheduler,stepfunctions,rds,ecs")'
    - '        .WithEnvironment("LAMBDA_REMOVE_CONTAINERS", "true")'
    - '        .WithEnvironment("LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT", "120")'
    - '        .WithEnvironment("DOCKER_HOST", "unix:///var/run/docker.sock")'
    - '        .WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")'
    - '        .WithHttpEndpoint(port: 4566, targetPort: 4566, name: "gateway", isProxied: false);'

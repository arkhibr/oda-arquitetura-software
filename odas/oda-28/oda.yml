id: '28'
titulo: Aspire, LocalStack e testes de integração com nuvem emulada
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é reduzir o tempo dos testes de integração do repositório `aspire-aws` sem deixar um teste interferir no outro, escolhendo o escopo da fixture que sobe a nuvem emulada. Cada cenário é um projeto de testes cuja `Fixture` usa o .NET Aspire para subir o LocalStack, que emula serviços da AWS (Amazon Web Services), e cada classe de teste com `IClassFixture` sobe uma cópia nova desse ambiente, o que no cenário 01 acrescenta cerca de 20 s por classe. Você vai medir o custo de uma classe a mais, compartilhar a fixture entre as classes com `ICollectionFixture` e corrigir o teste que passa a interferir no vizinho.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Teste de integração
      definicao: Teste que exercita o código junto com os serviços reais de que ele depende, aqui os serviços da AWS emulados num contêiner. No repositório, cada cenário é um projeto de testes desse tipo.
    - termo: Fixture
      definicao: Objeto que prepara o ambiente de que os testes precisam antes de eles rodarem e o descarta depois. No repositório, a `LocalStackFixture` sobe os contêineres e cria os recursos de cada cenário.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: .NET Aspire e AppHost
      definicao: O .NET Aspire é um conjunto de ferramentas da Microsoft para declarar e subir os serviços e contêineres de que uma aplicação distribuída depende. O AppHost é o projeto do Aspire em que essa declaração fica, no repositório em `src/AppHost/Program.cs`.
      referencia:
        rotulo: 'Aspire: what is Aspire'
        url: https://aspire.dev/get-started/what-is-aspire/
    - termo: AWS (Amazon Web Services)
      definicao: Plataforma de computação em nuvem da Amazon, que oferece serviços como armazenamento de arquivos, filas, bancos de dados e funções. Os cenários do repositório testam integrações com esses serviços.
      referencia:
        rotulo: 'AWS: o que é a AWS'
        url: https://aws.amazon.com/pt/what-is-aws/
    - termo: LocalStack
      definicao: Emulador que roda num contêiner Docker e responde, na porta 4566, às mesmas chamadas HTTP que os serviços da AWS. Os testes do repositório falam com ele no lugar da conta real, com credenciais de teste.
      referencia:
        rotulo: 'LocalStack: documentação'
        url: https://docs.localstack.cloud/
    - termo: xUnit, IClassFixture e ICollectionFixture
      definicao: O xUnit é o framework de testes do repositório. Com `IClassFixture<T>`, cada classe de teste recebe uma fixture própria, criada antes do primeiro teste da classe, e com `ICollectionFixture<T>` todas as classes marcadas com a mesma coleção compartilham uma única fixture.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: Docker, contêiner e imagem
      definicao: O Docker executa aplicações em contêineres, processos isolados que trazem tudo de que precisam para rodar. Cada contêiner nasce de uma imagem, como `localstack/localstack`, que o Docker baixa na primeira execução.
      referencia:
        rotulo: 'Docker Docs: what is a container'
        url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
    - termo: PostgreSQL
      definicao: Banco de dados relacional de código aberto. O AppHost do repositório sobe um contêiner do PostgreSQL na porta 5433 em todo cenário, junto com o LocalStack.
      referencia:
        rotulo: 'PostgreSQL: about'
        url: https://www.postgresql.org/about/
    - termo: Amazon S3 e bucket
      definicao: O S3 é o serviço de armazenamento de arquivos da AWS, chamados de objetos e identificados por uma chave. Os objetos ficam em buckets, que são recipientes com nome, e o cenário 01 grava e lista objetos em buckets do LocalStack.
      referencia:
        rotulo: 'AWS: o que é o Amazon S3'
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: ADR (Architecture Decision Record)
      definicao: Documento curto que registra uma decisão de arquitetura com o contexto, a decisão, as alternativas e as consequências. O repositório guarda as ADRs em `docs/architecture/adrs/`.
      referencia:
        rotulo: 'ADR GitHub: Architectural Decision Records'
        url: https://adr.github.io/
    - termo: SDK da AWS para .NET
      definicao: Conjunto de bibliotecas que o código .NET usa para chamar os serviços da AWS, com um cliente por serviço, como o `AmazonS3Client`. No repositório, o `AwsClientFactory` aponta esses clientes para `http://localhost:4566`.
      referencia:
        rotulo: 'AWS: guia do desenvolvedor do SDK para .NET'
        url: https://docs.aws.amazon.com/sdk-for-net/v3/developer-guide/welcome.html
    - termo: AWS Lambda
      definicao: Serviço da AWS que executa funções sob demanda, sem servidor para administrar. O LocalStack executa essas funções em contêineres e por isso precisa acessar o Docker da máquina pelo arquivo `/var/run/docker.sock`.
      referencia:
        rotulo: 'AWS: o que é o AWS Lambda'
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/welcome.html
    - termo: Socket do Docker e Colima
      definicao: O arquivo `/var/run/docker.sock` é o canal pelo qual programas falam com o Docker da máquina. O Colima é uma forma de rodar o Docker no macOS que, por padrão, cria esse canal noutro caminho, e por isso a montagem do AppHost falha com ele.
    - termo: Lock de arquivo
      definicao: Trava obtida ao abrir um arquivo com exclusividade, que faz outro processo esperar até o arquivo ser liberado. A `LocalStackFixture` usa um lock desse tipo para que só um processo de teste ocupe a porta 4566 por vez.
    - termo: Endpoint de saúde (health check)
      definicao: Rota que informa se um serviço está pronto para receber chamadas. A fixture consulta `/_localstack/health` até receber 200, com limite de 120 segundos.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar o que o builder de testes do Aspire sobe a partir do projeto `AppHost`.
    - Descrever o caminho de um teste até o LocalStack, pela porta 4566.
    - Diferenciar `IClassFixture` de `ICollectionFixture` pelo número de ambientes que sobem.
    - Reconhecer um teste que depende de estado deixado por outro teste.
    - Explicar por que os cenários rodam um de cada vez.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, exigido pelo `global.json`, do Git e de um Docker em execução. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica as peças que ligam um teste a um serviço da AWS (Amazon Web Services) emulado na sua máquina e o que define quantas vezes esse ambiente sobe durante a suíte. Os blocos abaixo definem cada conceito antes do comparativo entre os dois escopos de fixture, e a ADR (registro de decisão de arquitetura) do fim mostra por que o repositório decidiu executar um cenário de teste por vez, com a porta 4566 fixa.
  - tipo: conceito
    titulo: Teste de integração e fixture
    texto: Um teste de integração exercita o código junto com os serviços de que ele depende, aqui os serviços da AWS emulados num contêiner. A fixture é o objeto que prepara esse ambiente antes dos testes e o descarta depois, e no repositório a `LocalStackFixture` sobe os contêineres e cria os recursos de cada cenário, com um custo de vários segundos a cada vez que sobe.
  - tipo: conceito
    titulo: LocalStack
    texto: O LocalStack é um emulador que roda num contêiner Docker, um processo isolado que traz tudo de que precisa, e responde na porta 4566 às mesmas chamadas HTTP que a AWS, para os serviços listados na variável `SERVICES`. O SDK da AWS para .NET, conjunto de bibliotecas com um cliente por serviço, só precisa apontar para `http://localhost:4566`, o que o `AwsClientFactory` faz em cada cliente.
  - tipo: conceito
    titulo: .NET Aspire e AppHost
    texto: O .NET Aspire é um conjunto de ferramentas da Microsoft para declarar e subir os serviços e contêineres de que uma aplicação depende. O `src/AppHost/Program.cs` é o AppHost do repositório e declara o LocalStack na porta 4566 e um PostgreSQL na porta 5433. O teste não roda o AppHost como programa, porque o builder de testes do Aspire, chamado na `LocalStackFixture`, lê essa declaração e sobe os contêineres dentro do processo de teste.
  - tipo: conceito
    titulo: IClassFixture e ICollectionFixture
    texto: No xUnit, o framework de testes do repositório, uma classe que declara `IClassFixture<T>` recebe uma fixture própria, criada antes do primeiro teste da classe e descartada depois do último. Com `ICollectionFixture<T>`, todas as classes marcadas com a mesma coleção compartilham uma única fixture, o que poupa a subida do ambiente e faz os testes de classes diferentes enxergarem os mesmos recursos.
  - tipo: comparativo
    colunas:
    - IClassFixture
    - ICollectionFixture
    linhas:
    - dimensao: Quantas vezes o ambiente sobe
      valores:
      - Uma vez por classe de teste
      - Uma vez por coleção
    - dimensao: Estado entre classes
      valores:
      - 'Separado: cada classe tem o próprio LocalStack'
      - 'Compartilhado: buckets e filas de uma classe aparecem na outra'
    - dimensao: Exigência sobre os testes
      valores:
      - Nomes únicos dentro da classe
      - Nomes únicos em toda a coleção
  - tipo: adr
    id: ADR-004
    titulo: Tática de isolamento entre cenários de teste
    status: proposed
    contexto: Os 16 projetos de teste usam a mesma porta 4566, e dois LocalStack ao mesmo tempo disputariam a porta.
    decisao: 'Porta fixa com execução sequencial: `MaxCpuCount=1` no `test.runsettings` e um lock de arquivo na `LocalStackFixture`.'
    alternativas: Porta aleatória por cenário, rede Docker por cenário e nenhuma proteção.
    consequencias: Comportamento previsível e simples, com a suíte inteira rodando em sequência e sem usar vários núcleos.

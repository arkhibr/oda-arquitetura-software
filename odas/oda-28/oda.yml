    - '        var response = await fixture.S3.ListObjectsV2Async(new ListObjectsV2Request'
    - '        {'
    - '            BucketName = "test-bucket-list"'
    - '        });'
    - '        output.WriteLine($"    Objetos encontrados: {string.Join(", ", response.S3Objects.Select(o => o.Key))}");'
    - ''

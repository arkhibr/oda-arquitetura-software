    rotulo_saida: log
    saida: "$ inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\\.|Expected:|Actual:|Aprovado!|Com falha!'; echo \"$(( $(date +%s) - inicio )) s\"\n  Com falha Scenarios.S3.Basic.S3BasicTests.ListObjects_ShouldReturnUploadedKeys [9 ms]\n   Assert.Equal() Failure: Values differ\nExpected: 2\nActual:   3\nCom falha! – Com falha:     1, Aprovado:     5, Ignorado:     0, Total:     6, Duração: 522 ms - 01-S3.Basic.dll (net10.0)\n18 s"
    pergunta: Depois da troca para `ICollectionFixture`, o `ListObjects_ShouldReturnUploadedKeys` encontrou três objetos. De onde veio o terceiro?
    correcao: Dar a cada teste recursos com nome único, como o bucket com `Guid` do passo 5.
    alternativas:
    - texto: Do seed do LocalStack.
      correta: false
      explicacao: O LocalStack sobe sem buckets.
    - texto: Do `PutObject_ShouldStoreKey`, que gravou `c.txt` no `test-bucket-list` do mesmo LocalStack.
      correta: true
      explicacao: Com `IClassFixture`, cada classe tinha o próprio LocalStack, e a colisão de nomes não aparecia.
    - texto: De uma execução anterior do cenário.
      correta: false
      explicacao: O contêiner é descartado ao fim de cada execução.
  - tipo: incidente
    titulo: Suíte que fica mais lenta a cada classe
    origem: executado
    rotulo_saida: log
    saida: '$ inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E ''^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!''; echo "$(( $(date +%s) - inicio )) s"

      Aprovado!  – Com falha:     0, Aprovado:     5, Ignorado:     0, Total:     5, Duração: 501 ms - 01-S3.Basic.dll (net10.0)

      14 s


      $ inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E ''^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!''; echo "$(( $(date +%s) - inicio )) s"

      Aprovado!  – Com falha:     0, Aprovado:     6, Ignorado:     0, Total:     6, Duração: 15 s - 01-S3.Basic.dll (net10.0)

      34 s'
    pergunta: Uma classe com um teste de menos de um segundo acrescentou mais de 15 s à execução. Por quê?
    correcao: Agrupar as classes do cenário numa coleção com `ICollectionFixture` e nomes de recurso únicos.
    alternativas:
    - texto: O teste novo espera o upload terminar.
      correta: false
      explicacao: O upload de um byte leva milissegundos.
    - texto: O lock de porta espera o fim da outra classe.
      correta: false
      explicacao: As classes rodam no mesmo processo, e o lock é por processo.
    - texto: Cada classe com `IClassFixture` sobe e descarta o próprio ambiente com LocalStack e PostgreSQL.
      correta: true
      explicacao: O tempo dos testes é pequeno perto da subida dos contêineres.
  - tipo: incidente
    titulo: Todos os testes falham depois de dois minutos
    origem: executado
    rotulo_saida: log
    saida: '2: [sys] Could not create bind mount source path: ContainerName = localstack-tccabmam, Error = mkdir /var/run/docker.sock: permission denied

      [xUnit.net 00:02:06.93]       System.TimeoutException : LocalStack did not become healthy within 120s.

      [xUnit.net 00:02:06.94]       System.TimeoutException : LocalStack did not become healthy within 120s.

      System.TimeoutException : LocalStack did not become healthy within 120s.'
    pergunta: Num Mac com Colima, todos os cenários falham com essas duas linhas. Qual é a causa?
    correcao: Usar um Docker que exponha `/var/run/docker.sock` ou, para cenários sem Lambda, retirar a montagem do AppHost numa cópia local.
    alternativas:
    - texto: O AppHost monta `/var/run/docker.sock`, que não existe nessa máquina, e o LocalStack nunca sobe.
      correta: true
      explicacao: A espera por `/_localstack/health` termina sem resposta em 120 s.
    - texto: A porta 4566 está ocupada.
      correta: false
      explicacao: O erro é a montagem do arquivo, antes da porta.
    - texto: A imagem do LocalStack não foi baixada.
      correta: false
      explicacao: A mensagem seria de imagem não encontrada.
  - tipo: incidente
    titulo: Dois cenários em dois terminais
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/LocalStackFixture.cs:152-153

      }, timeout: TimeSpan.FromMinutes(15), interval: TimeSpan.FromMilliseconds(250),

      failureMessage: "Timed out waiting for exclusive access to LocalStack port 4566.")'
    pergunta: Um desenvolvedor roda o cenário 01 num terminal e o 02 noutro. O que acontece com o segundo?
    correcao: 'Nenhuma correção: a ADR-004 do repositório decidiu usar a porta 4566 fixa e executar um cenário por vez. Para paralelizar, cada cenário precisaria de porta própria.'
    alternativas:
    - texto: Falha na hora com porta ocupada.
      correta: false
      explicacao: O lock é obtido antes de subir os contêineres.
    - texto: Espera o primeiro liberar o lock de arquivo, por até 15 minutos, e só então sobe o próprio LocalStack.
      correta: true
      explicacao: A porta 4566 é fixa, e o lock impede dois LocalStack ao mesmo tempo.
    - texto: Usa o LocalStack do primeiro.
      correta: false
      explicacao: Cada processo sobe o próprio AppHost.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    itens:
    - termo: .NET Aspire e AppHost
      definicao: O .NET Aspire é um conjunto de ferramentas da Microsoft para declarar e subir os serviços e contêineres de que uma aplicação distribuída depende. O AppHost é o projeto do Aspire em que essa declaração fica, no repositório em `src/AppHost/Program.cs`.
      referencia:
        rotulo: 'Aspire: what is Aspire'
        url: https://aspire.dev/get-started/what-is-aspire/
    - termo: LocalStack
      definicao: Emulador que roda num contêiner Docker e responde, na porta 4566, às mesmas chamadas HTTP que os serviços da AWS. Os testes do repositório falam com ele no lugar da conta real, com credenciais de teste.
      referencia:
        rotulo: 'LocalStack: documentação'
        url: https://docs.localstack.cloud/
    - termo: xUnit, IClassFixture e ICollectionFixture
      definicao: O xUnit é o framework de testes do repositório. Com `IClassFixture<T>`, cada classe de teste recebe uma fixture própria, criada antes do primeiro teste da classe, e com `ICollectionFixture<T>` todas as classes marcadas com a mesma coleção compartilham uma única fixture.
      referencia:
        rotulo: 'xUnit.net: compartilhando contexto entre testes'
        url: https://xunit.net/docs/shared-context
    - termo: Amazon S3 e bucket
      definicao: O S3 é o serviço de armazenamento de arquivos da AWS, chamados de objetos e identificados por uma chave. Os objetos ficam em buckets, que são recipientes com nome, e o cenário 01 grava e lista objetos em buckets do LocalStack.
      referencia:
        rotulo: 'AWS: o que é o Amazon S3'
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Lock de arquivo
      definicao: Trava obtida ao abrir um arquivo com exclusividade, que faz outro processo esperar até o arquivo ser liberado. A `LocalStackFixture` usa um lock desse tipo para que só um processo de teste ocupe a porta 4566 por vez.
  - tipo: quiz
    perguntas:
    - enunciado: O que o builder de testes do Aspire faz com o projeto `AppHost`?
      alternativas:
      - texto: Publica o AppHost na AWS.
        correta: false
        explicacao: Sem `AWS_TARGET=aws`, tudo roda no LocalStack.
      - texto: Gera os testes do cenário.
        correta: false
        explicacao: Os testes são escritos à mão.
      - texto: Lê os contêineres declarados e os sobe dentro do processo de teste.
        correta: true
        explicacao: O teste não precisa rodar o AppHost à parte.
    - enunciado: Quantos LocalStack sobem num cenário com duas classes de teste com `IClassFixture<Fixture>`?
      alternativas:
      - texto: Dois, um depois do outro.
        correta: true
        explicacao: O passo 2 mediu o tempo a mais.
      - texto: Um, compartilhado.
        correta: false
        explicacao: Isso exige `ICollectionFixture`.
      - texto: Dois ao mesmo tempo.
        correta: false
        explicacao: O xUnit do repositório roda uma classe por vez.
    - enunciado: O que muda para os testes quando a fixture passa a ser da coleção?
      alternativas:
      - texto: O LocalStack passa a persistir dados entre execuções.
        correta: false
        explicacao: O contêiner continua descartado ao fim.
      - texto: Os recursos de uma classe aparecem para a outra, e os nomes precisam ser únicos na coleção.
        correta: true
        explicacao: O `test-bucket-list` passou a ser o mesmo nas duas classes.
      - texto: Os testes passam a rodar em paralelo.
        correta: false
        explicacao: O paralelismo continua desligado no `xunit.runner.json`.
    - enunciado: Por que os cenários do repositório rodam um de cada vez?
      alternativas:
      - texto: Porque o LocalStack só aceita um cliente.
        correta: false
        explicacao: Ele atende vários clientes ao mesmo tempo.
      - texto: Porque o Aspire não roda em paralelo.
        correta: false
        explicacao: A limitação vem da porta.
      - texto: Porque todos usam a porta fixa 4566, e só um LocalStack pode ocupá-la.
        correta: true
        explicacao: '`MaxCpuCount=1` e o lock de arquivo garantem a sequência.'
    - enunciado: Qual é a forma robusta de um teste contar objetos num bucket?
      alternativas:
      - texto: Contar num bucket com nome único, que só ele usa.
        correta: true
        explicacao: Assim nenhum vizinho altera a contagem.
      - texto: Rodar o teste antes dos outros.
        correta: false
        explicacao: A ordem dos testes não é um contrato.
      - texto: Apagar todos os buckets no início do teste.
        correta: false
        explicacao: Isso quebraria os testes vizinhos.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O cenário 01 rodou, e a maior parte do tempo foi a subida do ambiente.
    - A classe nova acrescentou o tempo de outro LocalStack.
    - A fixture compartilhada reduziu o tempo e expôs a colisão de nomes.
    - O bucket com nome único fez os seis testes passarem.
    - A razão da execução sequencial dos cenários está clara.

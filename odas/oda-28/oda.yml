    inicio: 45
    contexto: O `S3BasicTests.cs` é a classe de testes do cenário 01, que exercita as operações básicas do S3 contra o LocalStack com uma fixture por classe. O trecho abaixo é o teste de listagem, que grava dois objetos num bucket de nome fixo e espera exatamente dois na listagem, uma contagem que depende de nenhum outro teste usar o mesmo bucket.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o que acontece entre o `dotnet test` e o primeiro teste, com uma e com duas classes de teste. Depois, classifique onde cada recurso precisa de nome único.
  - tipo: fluxo
    titulo: Do `dotnet test` ao primeiro teste
    etapas:
    - titulo: Lock
      descricao: A `Fixture` abre com exclusividade um arquivo no diretório temporário e espera se outro processo de teste o tiver aberto.
    - titulo: Contêineres
      descricao: O Aspire sobe o LocalStack e o PostgreSQL declarados no AppHost.
    - titulo: Saúde
      descricao: A `Fixture` consulta `/_localstack/health` a cada segundo até a resposta 200.
    - titulo: Cenário
      descricao: O `InitializeScenarioAsync` cria o cliente do S3, e os testes da classe rodam um depois do outro.
    - titulo: Segunda classe
      descricao: Com `IClassFixture`, os contêineres são descartados e tudo recomeça para a próxima classe. Com `ICollectionFixture`, a próxima classe usa o mesmo LocalStack.
  - tipo: classificador
    enunciado: Com a `Fixture` compartilhada pela coleção, o recurso precisa de nome único?
    categorias:
    - id: sim
      rotulo: Precisa
    - id: nao
      rotulo: Não precisa
    itens:
    - texto: Bucket criado por dois testes de classes diferentes
      categoria: sim
      explicacao: Os dois testes gravam no mesmo LocalStack.
    - texto: Fila criada pela `Fixture` e lida por todos os testes
      categoria: nao
      explicacao: É um recurso comum de propósito, criado uma vez.
    - texto: Chave de objeto dentro de um bucket com nome único
      categoria: nao
      explicacao: O bucket já separa o teste dos vizinhos.
    - texto: Bucket de um teste que conta os objetos
      categoria: sim
      explicacao: Qualquer objeto de outro teste altera a contagem.
    - texto: Recurso de um cenário rodando em outro processo
      categoria: nao
      explicacao: O lock garante que cada processo tenha um LocalStack só para ele.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é medir quanto custa cada `Fixture` e reduzir esse custo sem deixar um teste interferir no outro. Os passos 1 e 2 medem o cenário 01 com uma e com duas classes, os passos 3 e 4 compartilham a fixture e mostram o teste que quebra, e o passo 5 corrige o teste novo. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: faixa
    estilo: erro
    titulo: ⚠️ Se você usa Colima ou outro Docker sem /var/run/docker.sock
    sintoma: Os testes falham depois de cerca de dois minutos, com a mensagem `LocalStack did not become healthy within 120s`.
    causa: O `src/AppHost/Program.cs` monta o arquivo `/var/run/docker.sock` da máquina no contêiner do LocalStack, e a montagem falha quando o arquivo não existe.
    correcao: Depois do `git stash` da faixa acima, retire a linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")` de `src/AppHost/Program.cs`. A montagem só serve aos cenários com Lambda e não afeta esta ODA.
  - tipo: passos
    itens:
    - titulo: Medir o cenário 01
      editor:
        rotulo: terminal
        linhas:
        - docker info --format '{{.ServerVersion}}'
        - inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      sucesso: 'A versão do Docker, `Aprovado: 5` e cerca de 14 s, conforme a máquina.'
    - titulo: Acrescentar uma classe de teste
      texto: Crie a classe abaixo, que reaproveita o nome de bucket de um teste existente, e meça de novo.
      editor:
        rotulo: arquivo
        caminho: scenarios/01-S3.Basic/S3IsolamentoTests.cs (novo)
        commit: 50a5344
        linhas:
        - using Amazon.S3.Model;
        - using Xunit.Abstractions;
        - ''
        - namespace Scenarios.S3.Basic;
        - ''
        - 'public class S3IsolamentoTests(Fixture fixture, ITestOutputHelper output) : IClassFixture<Fixture>'
        - '{'
        - '    [Fact]'
        - '    public async Task PutObject_ShouldStoreKey()'
        - '    {'
        - '        const string bucket = "test-bucket-list";'
        - '        output.WriteLine($">>> S3.PutBucket: criando bucket ''{bucket}''");'
        - '        await fixture.S3.PutBucketAsync(bucket);'
        - ''
        - '        output.WriteLine(">>> S3.PutObject: fazendo upload de ''c.txt''");'
        - '        await fixture.S3.PutObjectAsync(new PutObjectRequest'
        - '        {'
        - '            BucketName = bucket,'
        - '            Key = "c.txt",'
        - '            ContentBody = "c"'
        - '        });'
        - ''
        - '        var metadata = await fixture.S3.GetObjectMetadataAsync(bucket, "c.txt");'
        - '        Assert.Equal(1, metadata.ContentLength);'
        - '    }'
        - '}'
        - ''
        - '// no terminal:'
        - inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      efeito: classe_nova
      sucesso: '`Aprovado: 6` e cerca de 34 s: outro LocalStack subiu para a classe nova.'
    - titulo: Compartilhar a fixture
      texto: Crie a definição da coleção e marque as duas classes com ela, no lugar do `IClassFixture<Fixture>`.
      editor:
        rotulo: arquivo
        caminho: scenarios/01-S3.Basic/LocalStackCollection.cs (novo)
        commit: 50a5344
        linhas:
        - using Xunit;
        - ''
        - namespace Scenarios.S3.Basic;
        - ''
        - // Uma única Fixture, e portanto um único LocalStack, para todas as classes marcadas com [Collection("LocalStack")]
        - '[CollectionDefinition("LocalStack")]'
        - 'public class LocalStackCollection : ICollectionFixture<Fixture>;'
        - ''
        - '// scenarios/01-S3.Basic/S3BasicTests.cs e S3IsolamentoTests.cs: troque a declaração da classe'
        - '[Collection("LocalStack")]'
        - public class S3BasicTests(Fixture fixture, ITestOutputHelper output)
        - ''
        - '[Collection("LocalStack")]'
        - public class S3IsolamentoTests(Fixture fixture, ITestOutputHelper output)
    - titulo: Medir com a fixture compartilhada
      editor:
        rotulo: terminal
        linhas:
        - inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      efeito: fixture_compartilhada
      sucesso: 'Cerca de 18 s e `Com falha: 1` no `ListObjects_ShouldReturnUploadedKeys`, com `Expected: 2` e `Actual: 3`.'
    - titulo: Dar ao teste novo um bucket próprio
      editor:
        rotulo: arquivo
        caminho: scenarios/01-S3.Basic/S3IsolamentoTests.cs (alteração)
        commit: 50a5344
        linhas:
        - '// scenarios/01-S3.Basic/S3IsolamentoTests.cs: no lugar de const string bucket = "test-bucket-list";'
        - '        // Nome único: com a Fixture compartilhada, outro teste pode usar o mesmo LocalStack'
        - '        var bucket = $"test-bucket-{Guid.NewGuid():N}";'
        - ''
        - '// no terminal:'
        - inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      efeito: nome_unico
      sucesso: '`Aprovado: 6` em cerca de 19 s.'
  - tipo: terminal
    titulo: terminal · aspire-aws
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"
      condicao:
      - classe_nova
      - fixture_compartilhada
      - nome_unico
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     6, Ignorado:     0, Total:     6, Duração: 498 ms - 01-S3.Basic.dll (net10.0)

        19 s'
      origem: executado

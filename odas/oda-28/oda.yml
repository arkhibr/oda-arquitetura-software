    - entrada: inicio=$(date +%s); dotnet test scenarios/01-S3.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|Aprovado!|Com falha!'; echo "$(( $(date +%s) - inicio )) s"

    anotacoes:
    - linha: 11
      texto: A imagem do LocalStack Community, versão fixa.
    - linha: 15
      texto: Só esses serviços respondem.
    - linha: 19
      texto: O LocalStack usa o Docker da máquina para executar funções Lambda.
    - linha: 23
      texto: O PostgreSQL sobe em todo cenário, mesmo nos que não usam banco.
    inicio: 10
    contexto: O `src/AppHost/Program.cs` é o AppHost do .NET Aspire, o programa que declara os contêineres que todos os cenários de teste usam. O trecho abaixo declara o contêiner do LocalStack, com os serviços AWS emulados e o socket do Docker montado, e o contêiner do PostgreSQL, que sobem juntos sempre que o alvo não é a AWS real.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/LocalStackFixture.cs
    commit: 50a5344
    linhas:
    - '        _portLock = await AcquirePortLockAsync().ConfigureAwait(false);'
    - ''
    - '        try'
    - '        {'
    - '            var appHost = await DistributedApplicationTestingBuilder'
    - '                .CreateAsync<Projects.AppHost>()'
    - '                .ConfigureAwait(false);'
    - ''
    - '            _app = await appHost.BuildAsync().ConfigureAwait(false);'
    - '            await _app.StartAsync().ConfigureAwait(false);'
    - '            await WaitForLocalStackAsync().ConfigureAwait(false);'
    - '            await ImprimirUrlDashboardAsync().ConfigureAwait(false);'
    - '            await InitializeScenarioAsync().ConfigureAwait(false);'
    - '            _scenarioInitialized = true;'
    anotacoes:
    - linha: 40
      texto: Espera até nenhum outro processo de teste estar usando a porta 4566.
    - linha: 45
      texto: Lê a declaração do AppHost.
    - linha: 50
      texto: Consulta `/_localstack/health` por até 120 s.
    - linha: 52
      texto: Cada cenário cria aqui os seus clientes e recursos.
    inicio: 40
    contexto: O `LocalStackFixture.cs` é a classe base das fixtures do xUnit que cada cenário estende para preparar o ambiente antes dos testes. O trecho abaixo é o `InitializeAsync` no modo LocalStack, que obtém a trava da porta 4566, sobe o AppHost pelo Aspire, espera o LocalStack responder e cria os recursos do cenário, um custo pago a cada classe de teste.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/01-S3.Basic/S3BasicTests.cs
    commit: 50a5344
    linhas:

    anotacoes:
    - linha: 37
      texto: Guardado cifrado pelo KMS.
    - linha: 44
      texto: Sem esta linha, a leitura não devolve o valor original.
    inicio: 37
    contexto: O mesmo arquivo de testes do cenário 05 tem um teste dedicado aos parâmetros do tipo `SecureString`, que o Parameter Store guarda cifrados. O trecho abaixo grava o parâmetro `/app/secrets/api-key` e o lê com `WithDecryption = true`, opção de que a leitura depende para devolver o valor original.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/06-SecretsManager.Basic/SecretsManagerBasicTests.cs
    commit: 50a5344
    linhas:
    - '        await fixture.SecretsManager.DeleteSecretAsync(new DeleteSecretRequest'
    - '        {'
    - '            SecretId = "myapp/to-delete",'
    - '            ForceDeleteWithoutRecovery = true'
    - '        });'
    - ''
    - '        output.WriteLine(">>> SecretsManager.GetSecretValue: confirmando que ResourceNotFoundException é lançada ao tentar acessar o segredo deletado");'
    - '        await Assert.ThrowsAsync<ResourceNotFoundException>(() =>'
    anotacoes:
    - linha: 69
      texto: Apaga na hora, sem o período de recuperação.
    inicio: 66
    contexto: O `scenarios/06-SecretsManager.Basic/SecretsManagerBasicTests.cs` reúne os testes do cenário 06, que criam, atualizam e removem segredos do Secrets Manager no LocalStack. O trecho abaixo remove um segredo com `ForceDeleteWithoutRecovery = true`, o que apaga o segredo na hora, sem o período de recuperação de 7 dias, e a leitura seguinte recebe `ResourceNotFoundException`.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, a leitura de doze parâmetros com um carregador que pede uma página e com outro que segue o `NextToken`. Depois, classifique em que serviço cada dado da aplicação deve ficar.
  - tipo: fluxo
    titulo: Doze parâmetros sob `/loja`
    etapas:
    - titulo: Primeira chamada
      descricao: O `GetParametersByPath` devolve dez parâmetros e um `NextToken`.
    - titulo: Carregador simples
      descricao: 'Monta a configuração com os dez e para, sem erro: dois parâmetros ficam de fora.'
    - titulo: Segunda chamada
      descricao: O carregador paginado repete a chamada com o `NextToken` e recebe os dois restantes, sem novo token.
    - titulo: Segredo
      descricao: Sem `WithDecryption`, o `/loja/db-senha` chega cifrado e a aplicação tentaria conectar com o texto errado.
    - titulo: Carregador completo
      descricao: Com paginação e `WithDecryption`, a configuração tem os doze valores prontos para uso.
  - tipo: classificador
    enunciado: Onde este dado deve ficar?
    categorias:
    - id: s3
      rotulo: S3
    - id: ssm
      rotulo: Parameter Store
    - id: segredo
      rotulo: Secrets Manager
    itens:
    - texto: Senha do banco que precisa de rotação
      categoria: segredo
      explicacao: O Secrets Manager mantém a versão atual e a anterior durante a rotação.
    - texto: Endereço do banco por ambiente
      categoria: ssm
      explicacao: Configuração comum, organizada por prefixo como `/loja/prod/db-host`.
    - texto: Catálogo de produtos em JSON de 50 MB
      categoria: s3
      explicacao: Um parâmetro padrão aceita até 4 KB, e o S3 guarda objetos grandes.
    - texto: Chave de API de um parceiro
      categoria: segredo
      explicacao: É uma credencial, com troca periódica.
    - texto: Limite de itens por pedido
      categoria: ssm
      explicacao: Um valor de configuração simples.
    - texto: Notas fiscais em PDF
      categoria: s3
      explicacao: Arquivos, não configuração.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é evitar que a aplicação suba com configuração incompleta ou com segredos ilegíveis, fazendo o carregador seguir o `NextToken` da paginação e pedir `WithDecryption` para os `SecureString`. O passo 1 roda o cenário 05, os passos 2 e 3 escrevem o teste e a versão simples do carregador, e os passos 4 e 5 acrescentam a paginação e a decifragem até o teste passar. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: O `GetParametersByPath` do Parameter Store devolve no máximo dez parâmetros por página, com um `NextToken` quando há mais, e devolve os `SecureString` cifrados quando o pedido não traz `WithDecryption = true`. Os testes do cenário 05, em `SsmBasicTests.cs`, leem um prefixo com dois parâmetros numa única chamada, e por isso nenhum desses detalhes aparece neles.
    impacto: Um carregador que faz uma chamada só sobe a aplicação sem os parâmetros além do décimo, sem nenhum erro no log. Sem decifragem, a senha chega como texto cifrado, e a aplicação tenta se conectar com um valor errado.
    mecanismo: O laboratório escreve o carregador em três versões, a simples, com uma chamada, a paginada, que repete o `GetParametersByPath` enquanto houver `NextToken`, e a completa, que acrescenta `WithDecryption = true` ao pedido para que o serviço decifre os `SecureString` com a chave do KMS.
    comprovacao: 'O teste do carregador grava doze parâmetros sob `/loja`, um deles `SecureString`, e falha com `Actual: 10` na versão simples e com `Actual: "kms:alias/aws/ssm:super-secret"` na paginada. Com paginação e decifragem, o teste passa com `Aprovado: 4`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: faixa
    estilo: erro
    titulo: ⚠️ Se você usa Colima ou outro Docker sem /var/run/docker.sock
    sintoma: Os testes falham depois de cerca de dois minutos, com a mensagem `LocalStack did not become healthy within 120s`.
    causa: O `src/AppHost/Program.cs` monta o arquivo `/var/run/docker.sock` da máquina no contêiner do LocalStack, e a montagem falha quando o arquivo não existe.
    correcao: Depois do `git stash` da faixa Antes de começar, na aba Laboratório, retire a linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")` de `src/AppHost/Program.cs`. A montagem só serve aos cenários com Lambda e não afeta esta ODA.
  - tipo: passos
    itens:
    - titulo: Rodar o cenário 05
      editor:
        rotulo: terminal
        linhas:
        - docker info --format '{{.ServerVersion}}'

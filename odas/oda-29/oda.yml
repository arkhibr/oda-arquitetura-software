- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria ao ler configuração e segredos da AWS, cada uma com a saída que a evidencia, obtida no LocalStack do repositório. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Configuração incompleta sem erro
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet test scenarios/05-SSM.Basic 2>&1 | grep -E '^  Com falha|Assert\\.|Expected:|Actual:|Aprovado!|Com falha!' | sed -E 's/ \\[[0-9.]+ m?s\\]//'\n  Com falha Scenarios.SSM.Basic.CarregadorDeConfiguracaoTests.CarregarAsync_DeveTrazerTodosOsParametrosDoPrefixo\n   Assert.Equal() Failure: Values differ\nExpected: 12\nActual:   10\nCom falha! – Com falha:     1, Aprovado:     3, Ignorado:     0, Total:     4, Duração: 15 s - 05-SSM.Basic.dll (net10.0)"
    pergunta: Em produção, a aplicação subiu sem dois parâmetros, e o log não registrou erro. O que aconteceu?
    correcao: Repetir o `GetParametersByPath` com o `NextToken` até ele vir nulo, como no passo 4.
    alternativas:
    - texto: O `Recursive = true` limita a dez níveis.
      correta: false
      explicacao: O limite é de itens por página, não de níveis.
    - texto: O carregador leu só a primeira página, de dez parâmetros, e ignorou o `NextToken`.
      correta: true
      explicacao: A API não avisa que há mais itens além do token na resposta.
    - texto: Dois parâmetros não foram gravados.
      correta: false
      explicacao: O teste gravou os doze antes de ler.
  - tipo: incidente
    titulo: Teste que passa no LocalStack e falha na AWS
    origem: executado
    rotulo_saida: log
    saida: 'GetParameter /loja/segredo, sem WithDecryption

      kms:alias/aws/ssm:super-secret'
    pergunta: Um teste conferia apenas se o valor lido continha `super-secret` e passava no LocalStack. O que acontece contra a AWS?
    correcao: Ler com `WithDecryption = true` e comparar o valor inteiro, como no teste do laboratório.
    alternativas:
    - texto: Passa, porque o valor é o mesmo nos dois.
      correta: false
      explicacao: A AWS não expõe o texto original sem decifrar.
    - texto: Falha por falta de região.
      correta: false
      explicacao: A região já é configurada pelo `AwsClientFactory`.
    - texto: Falha, porque a AWS devolve o valor cifrado, e o LocalStack só acrescenta o prefixo da chave ao texto original.
      correta: true
      explicacao: O emulador simplifica a cifra, e o teste acabou dependendo dessa simplificação.
  - tipo: incidente
    titulo: Segredo que não volta
    origem: executado
    rotulo_saida: log
    saida: 'DeleteSecret loja/db, sem ForceDeleteWithoutRecovery

      GetSecretValue: InvalidRequestException: You can''t perform this operation on the secret because it was marked for deletion.

      CreateSecret loja/db: InvalidRequestException: You can''t create this secret because a secret with this name is already scheduled for deletion.'
    pergunta: Um script apagou e recriou o segredo para trocar o valor, e as duas chamadas falharam. Por quê?
    correcao: Trocar o valor com `PutSecretValue`, que cria uma versão nova, ou restaurar o segredo com `RestoreSecret` durante o período de recuperação.
    alternativas:
    - texto: O `DeleteSecret` agendou a exclusão, e o nome fica reservado até o fim do período de recuperação.
      correta: true
      explicacao: O período mínimo é de 7 dias, e só o `ForceDeleteWithoutRecovery` apaga na hora.
    - texto: O segredo foi apagado e o nome não pode mais ser usado.
      correta: false
      explicacao: Depois do período, o nome volta a ficar livre.
    - texto: O LocalStack não aceita recriar segredos.
      correta: false
      explicacao: Com exclusão forçada, a recriação funciona.
  - tipo: incidente
    titulo: Gravação recusada na troca de ambiente
    origem: executado
    rotulo_saida: log
    saida: 'PutParameter /loja/p01 de novo

      ParameterAlreadyExistsException: The parameter already exists. To overwrite this value, set the overwrite option in the request to true.'
    pergunta: Um script que publica a configuração de um ambiente falhou na segunda execução. Qual é a causa?
    correcao: Passar `Overwrite = true` no `PutParameterRequest` quando a intenção é atualizar o valor.
    alternativas:
    - texto: O limite de parâmetros da conta acabou.
      correta: false
      explicacao: A mensagem fala de parâmetro existente.
    - texto: O parâmetro já existe, e o `PutParameter` só substitui o valor com `Overwrite = true`.
      correta: true
      explicacao: A proteção evita sobrescrever configuração por engano.
    - texto: O nome tem caracteres inválidos.
      correta: false
      explicacao: A primeira execução gravou o mesmo nome.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Como ler todos os parâmetros de um prefixo?
      alternativas:
      - texto: Com uma chamada e `Recursive = true`.
        correta: false
        explicacao: O passo 3 trouxe dez de doze.
      - texto: Aumentando o tempo limite da chamada.
        correta: false
        explicacao: O limite é de itens, não de tempo.
      - texto: Repetindo o `GetParametersByPath` com o `NextToken` até ele vir nulo.
        correta: true
        explicacao: Cada página traz no máximo dez parâmetros.
    - enunciado: O que o `WithDecryption = true` faz?
      alternativas:
      - texto: Pede ao serviço que decifre os `SecureString` com a chave do KMS antes de devolver.
        correta: true
        explicacao: Exige permissão de uso da chave.
      - texto: Cifra a resposta no transporte.
        correta: false
        explicacao: O transporte já usa TLS na AWS.
      - texto: Converte `String` em `SecureString`.
        correta: false
        explicacao: O tipo é definido na gravação.
    - enunciado: Onde fica uma senha de banco com rotação?
      alternativas:
      - texto: Num parâmetro `String`.
        correta: false
        explicacao: Fica sem cifra.
      - texto: No Secrets Manager, que guarda as versões atual e anterior.
        correta: true
        explicacao: O `AWSPREVIOUS` devolveu `a1` depois da troca.
      - texto: Num objeto do S3.
        correta: false
        explicacao: O S3 não faz rotação de credenciais.
    - enunciado: Por que o `DeleteSecret` não apaga o segredo na hora?
      alternativas:
      - texto: Porque a exclusão é assíncrona e leva minutos.
        correta: false
        explicacao: O agendamento é imediato.
      - texto: Porque o segredo continua em uso.
        correta: false
        explicacao: O serviço não verifica uso.
      - texto: Para permitir recuperar um segredo apagado por engano durante o período de recuperação.
        correta: true
        explicacao: O mínimo é de 7 dias.
    - enunciado: Que cuidado o LocalStack exige nos testes de `SecureString`?
      alternativas:
      - texto: Comparar o valor inteiro lido com decifragem, sem depender do formato que o emulador devolve sem decifrar.
        correta: true
        explicacao: O LocalStack devolve o texto original com um prefixo.
      - texto: Desligar a cifra.
        correta: false
        explicacao: O teste precisa exercitar o `SecureString`.
      - texto: Rodar só contra a AWS.
        correta: false
        explicacao: O teste do laboratório roda nos dois.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O cenário 05 rodou contra o LocalStack.
    - O carregador simples perdeu dois de doze parâmetros.
    - A paginação trouxe os doze, e a decifragem corrigiu o segredo.
    - As diferenças entre S3, Parameter Store e Secrets Manager estão claras.
    - O comportamento da exclusão de segredo está claro.

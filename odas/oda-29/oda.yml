id: '29'
titulo: 'Armazenamento e configuração: S3, SSM e Secrets Manager'
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é escrever um carregador de configuração que leia todos os parâmetros de um prefixo do Parameter Store do AWS Systems Manager (SSM), inclusive os cifrados, e descobrir com o teste os dois detalhes da API que fazem um carregador simples perder dados sem erro. A configuração vem dos serviços da Amazon Web Services (AWS) feitos para isso, o Parameter Store e o Secrets Manager, lidos pelo SDK (kit de desenvolvimento) da AWS para .NET contra o LocalStack, emulador local desses serviços, e um carregador que lê só a primeira página ou não decifra os `SecureString` sobe a aplicação com valores faltando ou errados. Você vai rodar o cenário 05 do repositório `aspire-aws`, escrever o teste e o carregador simples e acrescentar a paginação e a decifragem até o teste passar.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: AWS (Amazon Web Services)
      definicao: Plataforma de computação em nuvem da Amazon, que oferece serviços como armazenamento de arquivos, configuração, segredos e filas. Os cenários do repositório testam integrações com esses serviços.
      referencia:
        rotulo: 'AWS: o que é a AWS'
        url: https://aws.amazon.com/pt/what-is-aws/
    - termo: SSM Parameter Store
      definicao: Recurso do AWS Systems Manager (SSM) que guarda parâmetros de configuração com nomes hierárquicos, como `/loja/prod/db-host`. Cada parâmetro é do tipo `String`, `StringList` ou `SecureString`.
      referencia:
        rotulo: 'AWS: Parameter Store'
        url: https://docs.aws.amazon.com/pt_br/systems-manager/latest/userguide/systems-manager-parameter-store.html
    - termo: AWS Secrets Manager
      definicao: Serviço da AWS que guarda credenciais, como senhas de banco e chaves de API, com versões e com suporte a rotação periódica do valor.
      referencia:
        rotulo: 'AWS: o que é o Secrets Manager'
        url: https://docs.aws.amazon.com/pt_br/secretsmanager/latest/userguide/intro.html
    - termo: SDK da AWS para .NET
      definicao: Conjunto de bibliotecas que o código .NET usa para chamar os serviços da AWS, com um cliente por serviço, como o `AmazonSimpleSystemsManagementClient`. No repositório, o `AwsClientFactory` cria esses clientes apontados para o LocalStack.
      referencia:
        rotulo: 'AWS: guia do desenvolvedor do SDK para .NET'
        url: https://docs.aws.amazon.com/sdk-for-net/v3/developer-guide/welcome.html
    - termo: LocalStack
      definicao: Emulador que roda num contêiner Docker e responde, na porta 4566, às mesmas chamadas HTTP que os serviços da AWS. Os testes do repositório falam com ele no lugar da conta real, com credenciais de teste.
      referencia:
        rotulo: 'LocalStack: documentação'
        url: https://docs.localstack.cloud/
    - termo: Amazon S3
      definicao: Serviço de armazenamento de arquivos da AWS, em que cada arquivo é um objeto guardado num bucket. É o serviço indicado para dados grandes, como um catálogo em JSON ou documentos em PDF.
      referencia:
        rotulo: 'AWS: o que é o Amazon S3'
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Paginação e NextToken
      definicao: As operações de listagem da AWS devolvem os resultados em páginas e, quando há mais itens, um `NextToken` que o cliente envia na chamada seguinte. O `GetParametersByPath` devolve no máximo dez parâmetros por página.
      referencia:
        rotulo: 'AWS: GetParametersByPath'
        url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParametersByPath.html
    - termo: SecureString e KMS (Key Management Service)
      definicao: Um parâmetro `SecureString` é guardado cifrado com uma chave do KMS, o serviço de chaves de criptografia da AWS. A leitura só devolve o valor original com `WithDecryption = true` e exige permissão de uso da chave.
      referencia:
        rotulo: 'AWS: como o Parameter Store usa o AWS KMS'
        url: https://docs.aws.amazon.com/pt_br/kms/latest/developerguide/services-parameter-store.html
    - termo: Versões e período de recuperação de um segredo
      definicao: Cada troca de valor de um segredo cria uma versão nova, e os rótulos `AWSCURRENT` e `AWSPREVIOUS` apontam para a atual e a anterior. O `DeleteSecret` agenda a exclusão para depois de um período de recuperação de 7 a 30 dias, e o `ForceDeleteWithoutRecovery` apaga na hora.
      referencia:
        rotulo: 'AWS: excluir um segredo'
        url: https://docs.aws.amazon.com/pt_br/secretsmanager/latest/userguide/manage_delete-secret.html
    - termo: Teste de integração
      definicao: Teste que exercita o código junto com os serviços de que ele depende, aqui os serviços da AWS emulados pelo LocalStack. No repositório, cada cenário é um projeto de testes desse tipo.
    - termo: Docker
      definicao: Plataforma que executa aplicações em contêineres, processos isolados que trazem tudo de que precisam para rodar. O LocalStack e o PostgreSQL dos testes rodam em contêineres Docker.
      referencia:
        rotulo: 'Docker Docs: what is a container'
        url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
    - termo: Rotação de credenciais
      definicao: Troca periódica do valor de uma senha ou chave, feita sem interromper quem a usa, que lê sempre a versão atual. O Secrets Manager mantém a versão anterior disponível durante a troca.
      referencia:
        rotulo: 'AWS: rotação de segredos'
        url: https://docs.aws.amazon.com/pt_br/secretsmanager/latest/userguide/rotating-secrets.html
    - termo: Região e credenciais da AWS
      definicao: Toda chamada à AWS é feita a uma região, como `us-east-1`, e assinada com credenciais de acesso. No LocalStack, a região continua obrigatória na assinatura, e as credenciais de teste `test` são aceitas.
    - termo: Socket do Docker e Colima
      definicao: O arquivo `/var/run/docker.sock` é o canal pelo qual programas falam com o Docker da máquina. O Colima é uma forma de rodar o Docker no macOS que, por padrão, cria esse canal noutro caminho, e por isso a montagem do AppHost falha com ele.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Escolher entre S3, Parameter Store e Secrets Manager para cada tipo de dado de uma aplicação.
    - Ler todos os parâmetros de um prefixo, página por página.
    - Ler um `SecureString` decifrado e explicar o papel do KMS.
    - Explicar as versões de um segredo e o período de recuperação depois da exclusão.
    - Reconhecer onde o LocalStack se comporta diferente da AWS.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, exigido pelo `global.json`, do Git e de um Docker em execução. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica o que cada um dos três serviços guarda e os detalhes de API que importam ao ler configuração. Os três respondem no LocalStack pela mesma porta 4566, com os clientes criados pelo `AwsClientFactory` do repositório.
  - tipo: comparativo
    colunas:
    - Guarda
    - Detalhe que importa
    linhas:
    - dimensao: S3
      valores:
      - Arquivos e objetos de qualquer tamanho, em buckets
      - Lê e grava o objeto inteiro, sem leitura por prefixo com decifragem nem rotação de credenciais
    - dimensao: Parameter Store
      valores:
      - Configuração em árvore de nomes, como `/loja/db-host`
      - Leitura por prefixo em páginas de até dez itens, e `SecureString` cifrado pelo KMS
    - dimensao: Secrets Manager
      valores:
      - Senhas e chaves, com versões
      - '`AWSCURRENT` e `AWSPREVIOUS`, rotação e exclusão com período de recuperação'
  - tipo: conceito
    titulo: Paginação
    texto: As operações de listagem da AWS devolvem uma página e um `NextToken` quando há mais itens. O `GetParametersByPath` devolve no máximo dez parâmetros por página, e quem lê uma página só perde o resto sem nenhum erro.
  - tipo: conceito
    titulo: SecureString
    texto: Um parâmetro `SecureString` é guardado cifrado com uma chave do KMS. A leitura só devolve o valor original com `WithDecryption = true`, e a permissão de decifrar a chave é separada da permissão de ler o parâmetro.
  - tipo: conceito
    titulo: Exclusão de segredo
    texto: O `DeleteSecret` agenda a exclusão para depois de um período de recuperação, de 7 dias no mínimo. Até lá, o segredo não pode ser lido nem recriado com o mesmo nome, a menos que a exclusão use `ForceDeleteWithoutRecovery`.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os arquivos que definem como os testes falam com o Parameter Store e o Secrets Manager: a fábrica de clientes do SDK em `src/Shared`, que aponta todos os clientes para o LocalStack, e os testes dos cenários 05 e 06, que gravam e leem parâmetros e segredos. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam os trechos que importam para o carregador de configuração desta ODA.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/AwsClientFactory.cs
    commit: 50a5344
    linhas:
    - '    private static TConfig Configure<TConfig>(TConfig config, string endpoint)'
    - '        where TConfig : ClientConfig'
    - '    {'
    - '        config.ServiceURL = endpoint;'
    - '        config.AuthenticationRegion = RegionEndpoint.USEast1.SystemName;'
    - '        config.UseHttp = endpoint.StartsWith("http://", StringComparison.OrdinalIgnoreCase);'
    - '        return config;'
    - '    }'
    anotacoes:
    - linha: 96
      texto: Todos os clientes apontam para `http://localhost:4566`.
    - linha: 97
      texto: A região assina as chamadas, e o LocalStack aceita as credenciais `test`.
    inicio: 93
    contexto: O `src/Shared/AwsClientFactory.cs` é a fábrica que cria os clientes do SDK .NET usados por todos os cenários, com as credenciais `test` e o endereço do LocalStack quando a variável `AWS_TARGET` não vale `aws`. O trecho abaixo é o método `Configure`, que define o endereço, a região de assinatura e o uso de HTTP, e é por ele que o carregador desta ODA chega ao Parameter Store local.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/05-SSM.Basic/SsmBasicTests.cs
    commit: 50a5344
    linhas:
    - '        var response = await fixture.SSM.GetParametersByPathAsync(new GetParametersByPathRequest'
    - '        {'
    - '            Path = "/myapp/env",'
    - '            Recursive = true'
    - '        });'
    - '        output.WriteLine($"    Parâmetros encontrados: {string.Join(", ", response.Parameters.Select(p => p.Name))}");'
    - ''
    - '        Assert.Equal(2, response.Parameters.Count);'
    anotacoes:
    - linha: 74
      texto: Inclui os parâmetros dos subníveis do prefixo.
    - linha: 78
      texto: Com dois parâmetros, uma página basta, e a paginação não aparece.
    inicio: 71
    contexto: O `scenarios/05-SSM.Basic/SsmBasicTests.cs` reúne os testes do cenário 05, que gravam e leem parâmetros do SSM Parameter Store no LocalStack. O trecho abaixo lê todos os parâmetros sob o prefixo `/myapp/env` numa única chamada e confere que vieram dois, sem tratar o `NextToken` que a API devolve quando há mais páginas.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/05-SSM.Basic/SsmBasicTests.cs
    commit: 50a5344
    linhas:
    - '            Type = "SecureString"'
    - '        });'
    - ''
    - '        output.WriteLine(">>> SSM.GetParameter: lendo parâmetro com WithDecryption=true para obter o valor em plaintext");'
    - '        var response = await fixture.SSM.GetParameterAsync(new GetParameterRequest'
    - '        {'
    - '            Name = "/app/secrets/api-key",'

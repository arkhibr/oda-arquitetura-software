- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer o fan-out, a distribuição de uma publicação para várias filas, entregar a mensagem a três filas e provar com teste que uma fila sem assinatura fica sem a cópia, a falha silenciosa que o teste passa a revelar. Os passos 1 a 3 clonam o repositório e rodam os cenários de mensageria, os passos 4 a 6 criam e verificam a terceira fila, e os passos 7 a 9 retiram a assinatura, rodam de novo e desfazem as alterações. O terminal simulado responde aos mesmos comandos, e os passos 5, 7 e 9 mudam a saída do cenário 09.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Os cenários de mensageria são os projetos de teste 02, 04, 09 e 10 da pasta `scenarios/`, e cada um tem uma fixture, a classe que cria os recursos no LocalStack, emulador local da AWS, antes dos testes. Na fixture do cenário 09, um laço grava em cada fila a política de acesso, que autoriza o tópico do SNS a enviar mensagens à fila, e chama `SubscribeAsync`, que faz a assinatura da fila no tópico. O `Assert.Single` do xUnit exige que a leitura da fila traga exatamente uma mensagem.
  - tipo: faixa
    estilo: objetivo
    problema: O cenário 09 do `aspire-aws` confere o fan-out com duas filas, e a `Fixture.cs` liga cada fila ao tópico num único laço, que grava a política de acesso e faz a assinatura. Uma fila criada fora desse laço existe, mas não recebe cópia das publicações, e nenhuma etapa do código avisa sobre isso.
    impacto: Num sistema real, um consumidor novo acrescentado sem assinatura deixa de receber eventos sem nenhum erro, e a falta só aparece quando alguém percebe dados ausentes. Um teste que confere cada fila transforma essa falta silenciosa numa falha visível antes da entrega.
    mecanismo: O laboratório acrescenta a terceira fila ao laço de política e assinatura da fixture e estende a verificação do teste para exigir exatamente uma cópia em cada fila. Em seguida, retira a assinatura de propósito, mantendo a fila e a verificação, para observar a falha.
    comprovacao: 'Com a fila no laço, o `dotnet test` do cenário 09 mostra três linhas `Mensagens recebidas: 1` e o teste aprovado. Sem a assinatura, o teste falha em `Assert.Single()` com `Mensagens recebidas: 0` para `fanout-queue-3`.'

id: '30'
titulo: Mensageria com SQS e SNS
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O cenário 09 do `aspire-aws` publica uma mensagem num tópico SNS e confere que duas filas SQS recebem uma cópia cada. Nesta ODA, o cenário ganha uma terceira fila assinante, e a falta de assinatura é provocada de propósito.
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Diferenciar fila (SQS), que entrega cada mensagem a um consumidor, de tópico (SNS), que distribui cópias a todos os assinantes.
    - Explicar o fan-out de SNS para SQS e o papel da política de acesso da fila.
    - Executar os cenários de mensageria contra o LocalStack orquestrado pelo Aspire.
    - Estender o cenário de fan-out com uma nova fila assinante e verificar a entrega.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários o .NET SDK 10.0.103 ou superior, exigido pelo `global.json` do repositório, Git e um Docker em execução que exponha o socket em `/var/run/docker.sock`, como o Docker Desktop.
  - tipo: faixa
    estilo: quebra
    titulo: ⛔ Verificação do laboratório
    texto: Os resultados desta ODA foram obtidos com Colima, que não expõe `/var/run/docker.sock`, numa cópia do repositório com a linha `.WithBindMount("/var/run/docker.sock", ...)` retirada de `src/AppHost/Program.cs`. A alteração não afeta os cenários de mensageria, que não usam Lambda, e o incidente 1 da aba Diagnóstico mostra o erro original.
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Fila e tópico resolvem problemas diferentes, e o fan-out combina os dois. Clique nas pastas para ver onde cada peça está no repositório.
  - tipo: comparativo
    colunas:
    - Fila (Amazon SQS)
    - Tópico (Amazon SNS)
    linhas:
    - dimensao: Destino de cada mensagem
      valores:
      - Um único consumidor processa a mensagem
      - Cada assinante recebe a própria cópia
    - dimensao: Armazenamento
      valores:
      - A mensagem fica na fila até ser recebida e apagada
      - O tópico entrega no momento da publicação e não guarda a mensagem
    - dimensao: Forma de consumo
      valores:
      - O consumidor busca a mensagem com `ReceiveMessageAsync`
      - O SNS envia a mensagem às assinaturas
    - dimensao: Cenário do repositório
      valores:
      - '`02-SQS.Basic`'
      - '`04-SNS.Basic`'
    - dimensao: Papel no fan-out (cenário 09)
      valores:
      - Cada fila recebe e guarda a cópia
      - O tópico distribui a publicação
  - tipo: arvores
    esquerda:
      titulo: Cenários de mensageria
      nos:
      - caminho: scenarios/
        descricao: Um projeto xUnit independente por cenário de integração.
      - caminho: scenarios/02-SQS.Basic/
        descricao: 'Operações básicas de fila: criar, enviar, receber, apagar e fila de mensagens mortas.'
      - caminho: scenarios/04-SNS.Basic/
        descricao: Operações básicas de tópico.
      - caminho: scenarios/09-SNS.SQS.Fanout/
        descricao: Fan-out de um tópico para duas filas.
      - caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        descricao: Cria tópico e filas, grava a política de acesso e faz as assinaturas.
      - caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs
        descricao: Publica uma mensagem e confere uma cópia em cada fila.
      - caminho: scenarios/10-S3.SQS.Notification/
        descricao: Notificação de objeto criado no S3 entregue numa fila.
    direita:
      titulo: Infraestrutura de teste
      nos:
      - caminho: src/
        descricao: Código compartilhado pelos cenários.
      - caminho: src/AppHost/Program.cs
        descricao: Declara os contêineres do LocalStack e do PostgreSQL para o Aspire.
      - caminho: src/Shared/LocalStackFixture.cs
        descricao: Sobe o ambiente, espera o LocalStack ficar saudável e adquire o bloqueio da porta 4566.
      - caminho: src/Shared/AwsClientFactory.cs
        descricao: Cria os clientes do SDK apontando para o LocalStack.
  - tipo: conceito
    titulo: Fan-out de SNS para SQS
    texto: O produtor publica uma vez no tópico, e cada fila assinante recebe a própria cópia, consumida no ritmo de cada consumidor. Para que o SNS consiga gravar na fila, a fila precisa de uma política que autorize `sqs:SendMessage` para o serviço SNS, restrita ao ARN do tópico.
    analogia: O tópico funciona como um aviso enviado a todos os inscritos de uma lista, e a fila funciona como uma caixa postal que guarda a carta até alguém retirá-la.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Fan-out do cenário 09
    mermaid: "flowchart LR\n    T[Teste xUnit] -->|PublishAsync| S((fanout-topic))\n    S -->|cópia| Q1[fanout-queue-1]\n    S -->|cópia| Q2[fanout-queue-2]\n    Q1 -->|ReceiveMessageAsync| R1[Leitura da fila 1]\n    Q2 -->|ReceiveMessageAsync| R2[Leitura da fila 2]"
  - tipo: adr
    id: ADR-003
    titulo: Tática de simulação de serviços AWS
    status: Proposed
    contexto: Os testes precisam de vários serviços AWS, e usar a AWS real em testes automatizados implica custo, credenciais e estado persistente.
    decisao: Usar o LocalStack Community 3.8 com modo duplo, em que `AWS_TARGET=aws` desvia os mesmos testes para a AWS real.
    alternativas: LocalStack Pro, com custo e licença, AWS real em todas as execuções e substitutos em memória do SDK, que não exercitam assinaturas e políticas.
    consequencias: Os cenários rodam sem custo e sem credenciais, e as limitações de Lambda em macOS ARM64 e de Step Functions ficam documentadas.
  - tipo: adr
    id: ADR-004
    titulo: Tática de isolamento entre cenários de teste
    status: Proposed
    contexto: Os projetos de teste compartilham a porta 4566, e dois cenários em paralelo tentariam subir dois contêineres na mesma porta.
    decisao: Porta fixa 4566 com execução sequencial, combinando `MaxCpuCount=1` no `test.runsettings` com um bloqueio de arquivo na `LocalStackFixture`.
    alternativas: Porta aleatória por cenário, rede Docker isolada por cenário e a ausência de mecanismo.
    consequencias: O comportamento fica determinístico, ao custo de uma suíte completa sequencial de cerca de três minutos.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: Os trechos abaixo são do commit `50a5344`. Clique nos marcadores numerados para ler a explicação de cada linha.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs
    commit: 50a5344
    linhas:
    - '    protected override async Task InitializeScenarioAsync()'
    - '    {'
    - '        SNS = AwsClientFactory.SNS();'
    - '        SQS = AwsClientFactory.SQS();'
    - ''
    - '        TopicArn = (await SNS.CreateTopicAsync("fanout-topic")).TopicArn;'
    - '        Queue1Url = (await SQS.CreateQueueAsync("fanout-queue-1")).QueueUrl;'
    - '        Queue2Url = (await SQS.CreateQueueAsync("fanout-queue-2")).QueueUrl;'
    - ''
    - '        foreach (var queueUrl in new[] { Queue1Url, Queue2Url })'
    - '        {'
    - '            var queueArn = (await SQS.GetQueueAttributesAsync(queueUrl, ["QueueArn"])).Attributes["QueueArn"];'
    - ''
    - '            await SQS.SetQueueAttributesAsync(new SetQueueAttributesRequest'
    - '            {'
    - '                QueueUrl = queueUrl,'
    - '                Attributes = new Dictionary<string, string>'
    - '                {'
    - '                    ["Policy"] = BuildQueuePolicy(queueArn, TopicArn)'
    - '                }'
    - '            });'
    - ''
    - '            await SNS.SubscribeAsync(new SubscribeRequest'
    - '            {'
    - '                TopicArn = TopicArn,'
    - '                Protocol = "sqs",'
    - '                Endpoint = queueArn'
    - '            });'
    - '        }'
    - '    }'
    anotacoes:
    - linha: 22
      texto: Cria o tópico e guarda o ARN, usado na política e na assinatura.
    - linha: 26
      texto: O mesmo laço grava a política e faz a assinatura de cada fila. Uma fila fora deste laço não recebe cópias.
    - linha: 35
      texto: Sem a política, o SNS não tem permissão para gravar na fila.
    - linha: 43
      texto: A assinatura liga o tópico à fila pelo ARN da fila.
    inicio: 17
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs
    commit: 50a5344
    linhas:
    - '    private static string BuildQueuePolicy(string queueArn, string topicArn)'
    - '    {'
    - '        return $$"""'
    - '        {'
    - '          "Version": "2012-10-17",'
    - '          "Statement": ['
    - '            {'
    - '              "Sid": "AllowSnsFanout",'
    - '              "Effect": "Allow",'
    - '              "Principal": { "Service": "sns.amazonaws.com" },'
    - '              "Action": "sqs:SendMessage",'
    - '              "Resource": "{{queueArn}}",'
    - '              "Condition": {'
    - '                "ArnEquals": { "aws:SourceArn": "{{topicArn}}" }'
    - '              }'
    - '            }'
    - '          ]'
    - '        }'
    - '        """;'
    - '    }'
    anotacoes:
    - linha: 65
      texto: A única ação concedida é o envio de mensagens para a fila.
    - linha: 68
      texto: A condição restringe a permissão ao tópico do cenário.
    inicio: 55
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs
    commit: 50a5344
    linhas:
    - using Amazon.SQS.Model;
    - using Xunit.Abstractions;
    - ''
    - namespace Scenarios.SNS.SQS.Fanout;
    - ''
    - 'public class SnsSqsFanoutTests(Fixture fixture, ITestOutputHelper output) : IClassFixture<Fixture>'
    - '{'
    - '    [Fact]'
    - '    public async Task Publish_ShouldDeliverMessageToBothQueues()'
    - '    {'
    - '        output.WriteLine($">>> SNS.Publish: publicando ''broadcast event'' no tópico ''{fixture.TopicArn}''");'
    - '        output.WriteLine("    O tópico tem duas filas SQS inscritas — cada publicação entrega uma cópia para cada fila (fanout)");'
    - '        await fixture.SNS.PublishAsync(fixture.TopicArn, "broadcast event");'
    - ''
    - '        foreach (var queueUrl in new[] { fixture.Queue1Url, fixture.Queue2Url })'
    - '        {'
    - '            output.WriteLine($">>> SQS.ReceiveMessage: verificando entrega na fila ''{queueUrl}''");'
    - '            var messages = await fixture.SQS.ReceiveMessageAsync(new ReceiveMessageRequest'
    - '            {'
    - '                QueueUrl = queueUrl,'
    - '                MaxNumberOfMessages = 1,'
    - '                WaitTimeSeconds = 5'
    - '            });'
    - '            output.WriteLine($"    Mensagens recebidas: {messages.Messages.Count}");'
    - ''
    - '            Assert.Single(messages.Messages);'
    - '            Assert.Contains("broadcast event", messages.Messages[0].Body);'
    - '        }'
    - '    }'
    - '}'
    anotacoes:
    - linha: 13
      texto: Uma única publicação no tópico.
    - linha: 22
      texto: Cada leitura espera até 5 segundos por uma mensagem.
    - linha: 26
      texto: Cada fila precisa ter exatamente uma mensagem.
  - tipo: editor
    rotulo: arquivo
    caminho: src/AppHost/Program.cs
    commit: 50a5344
    linhas:
    - '    builder'
    - '        .AddContainer("localstack", "localstack/localstack", "3.8")'
    - '        .WithEnvironment("AWS_ACCESS_KEY_ID", "test")'
    - '        .WithEnvironment("AWS_DEFAULT_REGION", "us-east-1")'
    - '        .WithEnvironment("AWS_SECRET_ACCESS_KEY", "test")'
    - '        .WithEnvironment("SERVICES", "s3,sqs,sns,dynamodb,lambda,ssm,secretsmanager,events,scheduler,stepfunctions,rds,ecs")'
    - '        .WithEnvironment("LAMBDA_REMOVE_CONTAINERS", "true")'
    - '        .WithEnvironment("LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT", "120")'
    - '        .WithEnvironment("DOCKER_HOST", "unix:///var/run/docker.sock")'
    - '        .WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")'
    - '        .WithHttpEndpoint(port: 4566, targetPort: 4566, name: "gateway", isProxied: false);'
    anotacoes:
    - linha: 11
      texto: Versão fixa do LocalStack declarada para o Aspire.
    - linha: 19
      texto: Montagem usada pelo LocalStack para criar contêineres de Lambda. Ela exige que o caminho exista na máquina.
    - linha: 20
      texto: Porta fixa 4566, compartilhada por todos os cenários.
    inicio: 10
  - tipo: faixa
    estilo: dica
    texto: A política de acesso e a assinatura são duas operações separadas. As duas precisam existir para que a fila receba as cópias publicadas no tópico.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Reproduza o fan-out evento por evento e ative as falhas para ver o que acontece com cada mensagem. Depois percorra a preparação feita pela Fixture.
  - tipo: linha-do-tempo
    titulo: Fan-out do cenário 09
    atores:
    - id: teste
      rotulo: Teste (produtor)
    - id: topico
      rotulo: Tópico fanout-topic
    - id: fila1
      rotulo: Fila fanout-queue-1
    - id: fila2
      rotulo: Fila fanout-queue-2
    - id: leitor1
      rotulo: Leitura da fila 1
    - id: leitor2
      rotulo: Leitura da fila 2
    eventos:
    - id: e1
      de: teste
      para: topico
      mensagem: '`PublishAsync` com "broadcast event"'
    - id: e2
      de: topico
      para: fila1
      mensagem: cópia da mensagem para a assinatura da fila 1
      depende: e1
    - id: e3
      de: topico
      para: fila2
      mensagem: cópia da mensagem para a assinatura da fila 2
      depende: e1
    - id: e4
      de: fila1
      para: leitor1
      mensagem: '`ReceiveMessageAsync` recebe a mensagem'
      depende: e2
    - id: e5
      de: fila2
      para: leitor2
      mensagem: '`ReceiveMessageAsync` recebe a mensagem'
      depende: e3
    falhas:
    - id: leitor2-parado
      rotulo: A leitura da fila 2 não é executada
      ator: leitor2
    - id: produtor-parado
      rotulo: O teste não publica a mensagem
      ator: teste
  - tipo: fluxo
    titulo: Preparação do fan-out na Fixture
    etapas:
    - titulo: Criar o tópico
      descricao: A Fixture cria `fanout-topic` e guarda o ARN do tópico.
      codigo:
        arquivo: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        commit: 50a5344
        linhas:
        - TopicArn = (await SNS.CreateTopicAsync("fanout-topic")).TopicArn;
        destaque:
        - 1
    - titulo: Criar as filas
      descricao: Cada fila é criada e tem a URL guardada para a leitura no teste.
      codigo:
        arquivo: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        commit: 50a5344
        linhas:
        - Queue1Url = (await SQS.CreateQueueAsync("fanout-queue-1")).QueueUrl;
        - Queue2Url = (await SQS.CreateQueueAsync("fanout-queue-2")).QueueUrl;
        destaque:
        - 1
        - 2
    - titulo: Obter o ARN da fila
      descricao: A política e a assinatura identificam a fila pelo ARN, e não pela URL.
      codigo:
        arquivo: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        commit: 50a5344
        linhas:
        - var queueArn = (await SQS.GetQueueAttributesAsync(queueUrl, ["QueueArn"])).Attributes["QueueArn"];
        destaque:
        - 1
    - titulo: Gravar a política de acesso
      descricao: A fila passa a aceitar mensagens enviadas pelo SNS a partir deste tópico.
      codigo:
        arquivo: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        commit: 50a5344
        linhas:
        - '["Policy"] = BuildQueuePolicy(queueArn, TopicArn)'
        destaque:
        - 1
    - titulo: Assinar a fila no tópico
      descricao: A partir daqui, cada publicação no tópico gera uma cópia nesta fila.
      codigo:
        arquivo: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        commit: 50a5344
        linhas:
        - await SNS.SubscribeAsync(new SubscribeRequest
        - '{'
        - '    TopicArn = TopicArn,'
        - '    Protocol = "sqs",'
        - '    Endpoint = queueArn'
        - '});'
        destaque:
        - 1
        - 4
        - 5
  - tipo: classificador
    enunciado: Associe cada característica ao serviço que a tem.
    categorias:
    - id: fila
      rotulo: Fila (SQS)
    - id: topico
      rotulo: Tópico (SNS)
    itens:
    - texto: Guarda a mensagem até que um consumidor a receba e apague
      categoria: fila
      explicacao: A retenção é o que permite ao consumidor processar no próprio ritmo.
    - texto: Entrega uma cópia para cada assinante
      categoria: topico
      explicacao: É o comportamento que o cenário 09 confere com duas filas.
    - texto: É lida com `ReceiveMessageAsync`
      categoria: fila
      explicacao: O teste busca as mensagens na fila com essa chamada.
    - texto: Recebe a publicação com `PublishAsync`
      categoria: topico
      explicacao: O teste publica uma única vez no tópico.
    - texto: Precisa de política que autorize `sqs:SendMessage` para o SNS
      categoria: fila
      explicacao: A política é gravada na fila, que é o recurso que recebe as mensagens.
    - texto: Não entrega a mensagem para quem assinar depois da publicação
      categoria: topico
      explicacao: O tópico entrega no momento da publicação e não guarda a mensagem.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Execute os passos no seu computador ou no terminal simulado abaixo. Os passos 5, 7 e 9 alteram a saída do cenário 09 no terminal simulado.
  - tipo: passos
    itens:
    - titulo: Clonar o repositório no commit de referência
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
        - git checkout 50a5344
    - titulo: Executar os quatro cenários de mensageria
      editor:
        rotulo: terminal
        linhas:
        - dotnet test scenarios/02-SQS.Basic/
        - dotnet test scenarios/04-SNS.Basic/
        - dotnet test scenarios/09-SNS.SQS.Fanout/
        - dotnet test scenarios/10-S3.SQS.Notification/
      sucesso: 4 testes aprovados no cenário 02, 3 no cenário 04, 1 no cenário 09 e 1 no cenário 10.
    - titulo: Ver o fan-out com saída detalhada
      editor:
        rotulo: terminal
        linhas:
        - dotnet test scenarios/09-SNS.SQS.Fanout/ --logger "console;verbosity=detailed"
      sucesso: 'Duas linhas `Mensagens recebidas: 1`, uma para cada fila.'
    - titulo: Criar a terceira fila na Fixture
      texto: Em `scenarios/09-SNS.SQS.Fanout/Fixture.cs`, acrescente a propriedade, crie a fila e inclua-a no laço que grava a política e faz a assinatura.
      editor:
        rotulo: arquivo
        caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs (alteração)
        commit: 50a5344
        linhas:
        - public string Queue3Url { get; private set; } = null!;
        - ''
        - Queue3Url = (await SQS.CreateQueueAsync("fanout-queue-3")).QueueUrl;
        - ''
        - foreach (var queueUrl in new[] { Queue1Url, Queue2Url, Queue3Url })
    - titulo: Incluir a terceira fila na verificação
      texto: Em `SnsSqsFanoutTests.cs`, troque o laço de verificação.
      editor:
        rotulo: arquivo
        caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs (alteração)
        commit: 50a5344
        linhas:
        - foreach (var queueUrl in new[] { fixture.Queue1Url, fixture.Queue2Url, fixture.Queue3Url })
      efeito: tres_filas
    - titulo: Rodar o cenário com três filas
      editor:
        rotulo: terminal
        linhas:
        - dotnet test scenarios/09-SNS.SQS.Fanout/ --logger "console;verbosity=detailed"
      sucesso: 'Três linhas `Mensagens recebidas: 1` e o teste aprovado.'
    - titulo: Retirar a terceira fila do laço de assinatura
      texto: Na Fixture, volte o laço para `new[] { Queue1Url, Queue2Url }`, mantendo a fila criada e a verificação no teste.
      efeito: sem_assinatura
    - titulo: Rodar o cenário sem a assinatura
      editor:
        rotulo: terminal
        linhas:
        - dotnet test scenarios/09-SNS.SQS.Fanout/ --logger "console;verbosity=detailed"
      sucesso: 'A falha `Assert.Single() Failure: The collection was empty`, com `Mensagens recebidas: 0` para `fanout-queue-3`.'
    - titulo: Desfazer as alterações
      editor:
        rotulo: terminal
        linhas:
        - git checkout -- scenarios
      efeito:
      - '!tres_filas'
      - '!sem_assinatura'
  - tipo: terminal
    titulo: terminal · aspire-aws
    comandos:
    - entrada: git clone https://github.com/arkhibr/aspire-aws
      saida: Cloning into 'aspire-aws'...
      origem: exemplo
    - entrada: cd aspire-aws
      saida: ''
      origem: exemplo
    - entrada: git checkout 50a5344
      saida: HEAD is now at 50a5344
      origem: exemplo
    - entrada: dotnet test scenarios/02-SQS.Basic/
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     4, Ignorado:     0, Total:     4, Duração: 1 s - 02-SQS.Basic.dll (net10.0)'
      origem: executado
    - entrada: dotnet test scenarios/04-SNS.Basic/
      saida: 'Aprovado!  – Com falha:     0, Aprovado:     3, Ignorado:     0, Total:     3, Duração: 414 ms - 04-SNS.Basic.dll (net10.0)'
      origem: executado

  - tipo: faixa
    estilo: erro
    sintoma: A nova fila é criada, mas não recebe mensagens, e o teste falha em `Assert.Single`.
    causa: A fila não foi inscrita no tópico, e o SNS só copia mensagens para assinaturas existentes no momento da publicação.
    correcao: Incluir a fila no laço que grava a política e chama `SubscribeAsync`.
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: Os dois primeiros incidentes mostram saídas reais obtidas na produção desta ODA. Os dois últimos reproduzem limitações registradas no próprio repositório.
  - tipo: incidente
    titulo: LocalStack não fica saudável
    origem: executado
    rotulo_saida: log
    saida: '2: [sys] Could not create bind mount source path: ContainerName = localstack-tccabmam, Error = mkdir /var/run/docker.sock: permission denied

      [xUnit.net 00:02:06.93]       System.TimeoutException : LocalStack did not become healthy within 120s.

      [xUnit.net 00:02:06.94]       System.TimeoutException : LocalStack did not become healthy within 120s.

      System.TimeoutException : LocalStack did not become healthy within 120s.'
    pergunta: O cenário 02 falha depois de cerca de dois minutos de espera, com essa mensagem no log. Qual é a causa?
    correcao: Usar um Docker que exponha `/var/run/docker.sock` ou, só para cenários sem Lambda, retirar a montagem numa cópia local do AppHost.
    alternativas:
    - texto: A fila não tem política de acesso.
      correta: false
      explicacao: A política só importa depois que o LocalStack está saudável e o cenário cria os recursos.
    - texto: O Docker em uso não expõe o socket no caminho que o AppHost monta no contêiner.
      correta: true
      explicacao: O Aspire precisa que `/var/run/docker.sock` exista na máquina para montar o caminho no contêiner do LocalStack.
    - texto: A imagem do LocalStack ainda está sendo baixada.
      correta: false
      explicacao: O log aponta um erro de montagem, e não de download.
  - tipo: incidente
    titulo: Fila nova sem mensagens
    origem: executado
    saida: "Assert.Single() Failure: The collection was empty\n >>> SNS.Publish: publicando 'broadcast event' no tópico 'arn:aws:sns:us-east-1:000000000000:fanout-topic'\n     O tópico tem duas filas SQS inscritas — cada publicação entrega uma cópia para cada fila (fanout)\n >>> SQS.ReceiveMessage: verificando entrega na fila 'http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/fanout-queue-1'\n     Mensagens recebidas: 1\n >>> SQS.ReceiveMessage: verificando entrega na fila 'http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/fanout-queue-2'\n     Mensagens recebidas: 1\n >>> SQS.ReceiveMessage: verificando entrega na fila 'http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/fanout-queue-3'\n     Mensagens recebidas: 0\n     Com falha: 1"
    pergunta: A terceira fila foi criada e verificada, mas recebeu 0 mensagens. Por quê?
    correcao: Incluir `Queue3Url` no laço da Fixture que grava a política e faz a assinatura.
    alternativas:
    - texto: A espera de 5 segundos foi curta para a terceira fila.
      correta: false
      explicacao: As duas primeiras filas receberam a mensagem no mesmo intervalo.
    - texto: A fila recebeu a mensagem, mas outro consumidor a apagou.
      correta: false
      explicacao: Nenhum outro consumidor lê `fanout-queue-3` no cenário.
    - texto: A fila não foi inscrita no tópico, então nenhuma cópia foi entregue a ela.
      correta: true
      explicacao: Sem assinatura, o SNS não sabe que a fila deve receber a publicação.
  - tipo: incidente
    titulo: Cenários com Lambda ignorados no macOS
    origem: codigo
    rotulo_saida: log
    saida: 'README.md · Limitações conhecidas

      | Lambda no LocalStack 3.8 + macOS ARM64 | 07, 08, 11, 12, 13, 14, 16 | Rodar em Linux/CI ou LocalStack Pro |'
    pergunta: Os cenários 07 e 08 aparecem como ignorados num Mac com processador ARM. Qual é a situação?
    correcao: Executar esses cenários em Linux ou na esteira de CI, como indica o README.
    alternativas:
    - texto: É uma limitação documentada do LocalStack 3.8 em macOS ARM64, e os cenários são marcados como Skip.
      correta: true
      explicacao: A ADR-003 registra a limitação e a marcação por `EnvironmentLimitations.cs`, para evitar falso negativo.
    - texto: Os cenários estão quebrados no commit de referência.
      correta: false
      explicacao: O README indica que eles rodam em Linux e na esteira.
    - texto: Falta instalar o Python na máquina.
      correta: false
      explicacao: O Python só é necessário para editar os handlers das Lambdas.
  - tipo: incidente
    titulo: Cenários em paralelo disputando a porta
    origem: codigo
    rotulo_saida: log
    saida: 'README.md · Limitações conhecidas

      | Porta fixa 4566 | Todos (execução sequencial) | — |'
    pergunta: Dois terminais executam cenários ao mesmo tempo. O que acontece com o segundo?
    correcao: Executar um cenário por vez. Dentro de um mesmo `dotnet test`, o `MaxCpuCount=1` do `test.runsettings` já serializa os cenários.
    alternativas:
    - texto: Ele usa a AWS real automaticamente.
      correta: false
      explicacao: O desvio para a AWS real só acontece com `AWS_TARGET=aws`.
    - texto: Ele espera o bloqueio de arquivo da porta 4566, porque os cenários compartilham a mesma porta.
      correta: true
      explicacao: A `LocalStackFixture` tenta obter o bloqueio a cada 250 ms por até 15 minutos e, ao fim do prazo, falha com `Timed out waiting for exclusive access to LocalStack port 4566.`
    - texto: Ele sobe um segundo LocalStack numa porta livre.
      correta: false
      explicacao: A porta aleatória foi uma alternativa descartada na ADR-004.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Qual afirmação diferencia corretamente SQS e SNS?
      alternativas:
      - texto: O tópico guarda a mensagem até que surja um assinante.
        correta: false
        explicacao: A fila 3 sem assinatura não recebeu cópia, porque o tópico entrega somente às assinaturas existentes no momento da publicação.
      - texto: A fila entrega cada mensagem a todos os consumidores conectados.
        correta: false
        explicacao: Cada mensagem de uma fila é processada por um único consumidor.
      - texto: A fila guarda a mensagem até um consumidor recebê-la, e o tópico copia a mensagem para todos os assinantes no momento da publicação.
        correta: true
        explicacao: 'É o comportamento observado no cenário 09: a cópia só chega às filas inscritas quando a mensagem é publicada.'
    - enunciado: Para que serve a política gravada por `BuildQueuePolicy`?
      alternativas:
      - texto: Autorizar o serviço SNS a enviar mensagens para a fila, apenas quando a origem é o tópico do cenário.
        correta: true
        explicacao: A política concede `sqs:SendMessage` ao principal `sns.amazonaws.com` com a condição `aws:SourceArn` igual ao ARN do tópico.
      - texto: Inscrever a fila no tópico.
        correta: false
        explicacao: A inscrição é feita por `SubscribeAsync`, numa chamada separada.
      - texto: Permitir que o teste leia a fila sem credenciais.
        correta: false
        explicacao: A política trata do envio pelo SNS, e não da leitura pelo teste.
    - enunciado: 'Todos os cenários falham com `LocalStack did not become healthy within 120s` e o log mostra `mkdir /var/run/docker.sock: permission denied`. Qual é a causa?'
      alternativas:
      - texto: A fila não tem política de acesso.
        correta: false
        explicacao: A política só importa depois que o LocalStack está saudável e o cenário cria os recursos.
      - texto: O Docker em uso não expõe o socket no caminho que o AppHost monta no contêiner do LocalStack.
        correta: true
        explicacao: O AppHost declara `.WithBindMount("/var/run/docker.sock", ...)`, e o Aspire precisa que esse caminho exista na máquina.
      - texto: A imagem do LocalStack ainda está sendo baixada.
        correta: false
        explicacao: O log aponta um erro de montagem, e não de download.
    - enunciado: Ao estender o cenário 09, a terceira fila foi criada mas ficou fora do laço da Fixture. O que acontece?
      alternativas:
      - texto: A fila recebe a mensagem, porque está na mesma conta do tópico.
        correta: false
        explicacao: Estar na mesma conta não cria assinatura, e o SNS só entrega para assinantes.
      - texto: O teste passa, porque a verificação ignora filas sem assinatura.
        correta: false
        explicacao: O laço de verificação inclui a fila 3 e exige exatamente uma mensagem.
      - texto: A fila não recebe cópia da publicação, e o teste falha em `Assert.Single`.
        correta: true
        explicacao: Sem política e sem assinatura, o tópico não entrega a mensagem à fila 3, e a leitura volta vazia após 5 segundos.
    - enunciado: Num tópico padrão do SNS, uma fila é inscrita depois que a mensagem foi publicada. O que ela recebe?
      alternativas:
      - texto: Nada referente àquela publicação.
        correta: true
        explicacao: O tópico entrega no momento da publicação e não guarda a mensagem para assinantes futuros.
      - texto: Uma cópia da mensagem, entregue na assinatura.
        correta: false
        explicacao: O SNS não reenvia publicações anteriores à assinatura.
      - texto: Todas as mensagens já publicadas no tópico.
        correta: false
        explicacao: Um tópico padrão do SNS não mantém histórico de mensagens.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os quatro cenários de mensageria passaram.
    - O cenário 09 entregou a mensagem às três filas.
    - A falta de assinatura foi reproduzida e explicada.
    - As alterações foram desfeitas.
    - A diferença entre fila e tópico está clara.

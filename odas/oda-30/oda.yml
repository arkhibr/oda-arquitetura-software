id: '30'
titulo: Mensageria com SQS e SNS
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é diferenciar fila e tópico e garantir que um consumidor novo de um fan-out receba as mensagens, porque uma fila do Amazon SQS (Simple Queue Service) sem assinatura no tópico do Amazon SNS (Simple Notification Service) fica sem nenhuma cópia e sem nenhum erro. No repositório `aspire-aws`, o cenário 09 publica uma mensagem e confere que duas filas recebem uma cópia cada, com os serviços emulados pelo LocalStack. Você vai acrescentar uma terceira fila assinante, estender o teste para conferir cada fila e retirar a assinatura de propósito para ver a falta virar uma falha de teste.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Fila de mensagens
      definicao: Estrutura que guarda mensagens enviadas por um produtor até que um consumidor as leia e as apague. Cada mensagem é processada por um único consumidor, que trabalha no próprio ritmo, e por isso a fila separa quem produz de quem processa.
    - termo: Tópico
      definicao: Canal de publicação em que cada mensagem publicada é copiada para todos os assinantes registrados naquele momento. O tópico não guarda a mensagem, e um assinante registrado depois da publicação não recebe a cópia.
    - termo: Fan-out
      definicao: Padrão de distribuição em que uma única publicação num tópico gera uma cópia em cada fila assinante. Cada fila passa a ter o próprio consumidor, e um consumidor lento não atrasa os demais.
      referencia:
        rotulo: Fanout do Amazon SNS para filas do Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/sns/latest/dg/sns-sqs-as-subscriber.html
    - termo: Amazon SNS (Simple Notification Service)
      definicao: Serviço de tópicos da AWS. O produtor publica uma mensagem no tópico com `PublishAsync`, e o SNS entrega uma cópia a cada assinatura, que pode ser uma fila SQS, uma função Lambda ou um endereço HTTP.
      referencia:
        rotulo: O que é o Amazon SNS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/sns/latest/dg/welcome.html
    - termo: Amazon SQS (Simple Queue Service)
      definicao: Serviço de filas da AWS. O consumidor busca mensagens com `ReceiveMessageAsync` e apaga cada uma depois de processá-la, e a mensagem não apagada volta a ficar disponível depois de um tempo.
      referencia:
        rotulo: O que é o Amazon SQS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
    - termo: Cenário
      definicao: No repositório `aspire-aws`, cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit que exercita uma integração com serviços da AWS. O cenário 09, `09-SNS.SQS.Fanout`, é o fan-out desta ODA.
    - termo: LocalStack
      definicao: Emulador dos serviços da AWS que roda num contêiner Docker e responde na porta 4566. Os cenários criam nele tópicos, filas, buckets e tabelas sem conta na AWS, e o repositório usa a edição gratuita, a Community, na versão 3.8.
      referencia:
        rotulo: Documentação do LocalStack
        url: https://docs.localstack.cloud/overview/
    - termo: Docker e contêiner
      definicao: O Docker executa programas em contêineres, processos isolados que levam consigo as próprias dependências a partir de uma imagem. O LocalStack e o PostgreSQL dos cenários rodam como contêineres na sua máquina.
      referencia:
        rotulo: What is Docker? (documentação do Docker)
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: Socket do Docker (`/var/run/docker.sock`)
      definicao: Arquivo pelo qual programas conversam com o daemon do Docker, o serviço que cria e para os contêineres. O AppHost entrega esse arquivo ao LocalStack para que ele possa criar os contêineres das funções Lambda.
    - termo: Colima
      definicao: Ferramenta que roda o Docker no macOS dentro de uma máquina virtual Linux. Na configuração padrão, ela não cria o arquivo `/var/run/docker.sock`, e por isso a montagem do AppHost falha.
    - termo: AppHost
      definicao: Projeto do .NET Aspire que declara, em C#, os recursos que a aplicação precisa. No repositório, `src/AppHost/Program.cs` declara os contêineres do LocalStack e do PostgreSQL usados por todos os cenários.
      referencia:
        rotulo: What is the AppHost? (documentação do Aspire)
        url: https://learn.microsoft.com/pt-br/dotnet/aspire/fundamentals/app-host-overview
    - termo: Montagem de arquivo do host (bind mount)
      definicao: Configuração que faz um arquivo ou uma pasta da máquina aparecer dentro de um contêiner no mesmo caminho ou em outro. A linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")` do AppHost é uma montagem desse tipo, e ela falha quando o arquivo não existe na máquina.
      referencia:
        rotulo: Bind mounts (documentação do Docker)
        url: https://docs.docker.com/engine/storage/bind-mounts/
    - termo: AWS Lambda
      definicao: Serviço da AWS que executa uma função quando um evento chega, sem servidor administrado por quem escreve a função. Os cenários desta ODA não usam Lambda, e outros cenários do repositório implantam funções em Python no LocalStack.
      referencia:
        rotulo: O que é o AWS Lambda? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/welcome.html
    - termo: .NET Aspire
      definicao: Conjunto de ferramentas da Microsoft para descrever e subir, a partir de um projeto .NET, os serviços e contêineres de que uma aplicação depende. Nos testes do repositório, o Aspire sobe o LocalStack e o PostgreSQL antes de cada cenário.
      referencia:
        rotulo: What is Aspire? (documentação do Aspire)
        url: https://learn.microsoft.com/pt-br/dotnet/aspire/get-started/aspire-overview
    - termo: xUnit
      definicao: Framework de testes automatizados para .NET usado em todos os cenários. O comando `dotnet test` compila o projeto do cenário e roda os métodos marcados como teste.
    - termo: Fixture
      definicao: Classe que o xUnit cria antes dos testes para preparar recursos compartilhados e que descarta no fim. No cenário 09, `Fixture.cs` cria o tópico, as filas, as políticas de acesso e as assinaturas.
      referencia:
        rotulo: Sharing Context between Tests (documentação do xUnit)
        url: https://xunit.net/docs/shared-context
    - termo: Política de acesso de recurso
      definicao: Documento JSON gravado no próprio recurso, como uma fila, que diz quem pode executar quais ações sobre ele. A política da fila do cenário 09 permite ao serviço SNS a ação `sqs:SendMessage`, e só quando a origem é o tópico do cenário.
      referencia:
        rotulo: Políticas baseadas em identidade e em recurso (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/access_policies_identity-vs-resource.html
    - termo: ARN (Amazon Resource Name)
      definicao: Identificador único de um recurso da AWS, no formato `arn:aws:serviço:região:conta:recurso`. A assinatura e a política identificam a fila pelo ARN dela, e a condição `aws:SourceArn` compara o ARN do tópico de origem.
      referencia:
        rotulo: Nomes do recurso da Amazon (ARNs) (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/reference-arns.html
    - termo: Assinatura
      definicao: Registro que liga um tópico do SNS a um destino, como uma fila, criado com `SubscribeAsync`. Sem assinatura, o tópico não entrega cópia ao destino, mesmo que a política de acesso exista.
    - termo: Fila de mensagens mortas (DLQ, dead-letter queue)
      definicao: Fila que recebe as mensagens que falharam repetidas vezes no processamento, para que sejam analisadas sem voltar à fila principal. O cenário 02 cria uma fila desse tipo.
      referencia:
        rotulo: Filas de mensagens não entregues no Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica num bucket. O cenário 10 configura o bucket para enviar a uma fila um aviso de objeto criado.
      referencia:
        rotulo: O que é o Amazon S3? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: PostgreSQL
      definicao: Banco de dados relacional de código aberto. O AppHost declara um contêiner PostgreSQL 16.9, usado pelos cenários que tratam de banco relacional.
    - termo: ADR (Architecture Decision Record)
      definicao: Registro curto de uma decisão de arquitetura, com o contexto, a decisão, as alternativas e as consequências. As decisões sobre o LocalStack e sobre o isolamento dos cenários estão nas ADRs da pasta `docs/architecture/adrs/` do repositório.
      referencia:
        rotulo: Architectural Decision Records (adr.github.io)
        url: https://adr.github.io/
    - termo: Execução sequencial e bloqueio da porta 4566
      definicao: Como todos os cenários usam o LocalStack na porta fixa 4566, o repositório impede dois cenários ao mesmo tempo. O `test.runsettings` define `MaxCpuCount` igual a 1, e a `LocalStackFixture` adquire um bloqueio de arquivo antes de subir o ambiente.
    - termo: Modo duplo (`AWS_TARGET=aws`)
      definicao: Variável de ambiente que desvia os mesmos testes para a AWS real. Sem ela, o AppHost sobe o LocalStack, e os clientes do SDK da AWS apontam para a porta 4566.
    - termo: Teste ignorado (`Skip`) no macOS ARM64
      definicao: Os testes que dependem de Lambda são marcados como ignorados quando o processo de teste roda no macOS com processador ARM64, como os Macs com Apple Silicon. A regra fica em `src/Shared/EnvironmentLimitations.cs`, e esses testes rodam em Linux e na esteira de CI.
    - termo: Esteira de CI (integração contínua)
      definicao: Processo automatizado que compila e testa o código a cada envio ao repositório remoto. O README do `aspire-aws` indica a esteira como o ambiente em que os cenários com Lambda rodam.
      referencia:
        rotulo: Noções básicas sobre GitHub Actions (documentação do GitHub)
        url: https://docs.github.com/pt/actions/about-github-actions/understanding-github-actions
  - tipo: checklist
    titulo: Objetivos desta ODA
    itens:
    - Diferenciar fila (SQS), que entrega cada mensagem a um consumidor, de tópico (SNS), que distribui cópias a todos os assinantes.
    - Explicar o fan-out de SNS para SQS e o papel da política de acesso da fila.
    - Executar os cenários de mensageria contra o LocalStack orquestrado pelo Aspire.
    - Estender o cenário de fan-out com uma nova fila assinante e verificar a entrega.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Pré-requisitos
    texto: São necessários o .NET SDK 10.0.103 ou superior, exigido pelo `global.json` do repositório, Git e um Docker em execução que exponha o socket em `/var/run/docker.sock`, como o Docker Desktop.
  - tipo: faixa
    estilo: erro
    titulo: ⚠️ Se você usa Colima ou outro Docker sem /var/run/docker.sock
    sintoma: Os cenários falham depois de cerca de dois minutos, com a mensagem `LocalStack did not become healthy within 120s`.
    causa: O `src/AppHost/Program.cs` monta o arquivo `/var/run/docker.sock` da máquina no contêiner do LocalStack, e a montagem falha quando o arquivo não existe.
    correcao: Se o arquivo existir na sua máquina, nenhuma ação é necessária. Caso contrário, retire numa cópia local a linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")`, que só é usada pelos cenários com Lambda e não afeta os cenários desta ODA.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba explica a diferença entre fila e tópico, as duas formas da AWS de trocar mensagens entre programas, e o fan-out, a distribuição de uma publicação para várias filas, que combina as duas. Os blocos de conceito vêm primeiro, e as árvores depois reproduzem as pastas do repositório `aspire-aws` no commit `50a5344` que tratam de mensageria, à esquerda os cenários, projetos de teste de cada integração, e à direita a infraestrutura de teste comum a eles. Clique numa pasta ou num arquivo para ver o papel dele.
  - tipo: conceito
    titulo: Fila e tópico
    texto: Uma fila guarda cada mensagem até que um consumidor a leia e a apague, e cada mensagem é processada por um único consumidor, no ritmo dele. Um tópico copia cada mensagem publicada para todos os assinantes registrados naquele momento e não guarda a mensagem para quem assinar depois. Na AWS, as filas são do Amazon SQS (Simple Queue Service) e os tópicos são do Amazon SNS (Simple Notification Service), e o cenário 09 do repositório combina os dois.
  - tipo: conceito
    titulo: Como o repositório testa a mensageria
    texto: Os testes do `aspire-aws` chamam o LocalStack, um emulador dos serviços da AWS que roda num contêiner Docker na porta 4566, e o .NET Aspire sobe esse contêiner a partir do AppHost, o projeto `src/AppHost`. Cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit, e a fixture do cenário é a classe que cria os recursos, como filas e tópicos, antes dos testes. A variável `AWS_TARGET=aws` desvia os mesmos testes para a AWS real, e no macOS com processador ARM64 os testes que dependem de funções Lambda ficam ignorados, porque a execução delas no LocalStack 3.8 não é confiável nesse ambiente.
  - tipo: conceito
    titulo: Política de acesso, ARN e assinatura
    texto: Para o tópico entregar a uma fila, duas configurações separadas precisam existir. A assinatura, criada com `SubscribeAsync`, registra a fila como destino do tópico, e a política de acesso, um documento JSON gravado na fila, autoriza o serviço SNS a executar `sqs:SendMessage` nela. As duas identificam os recursos pelo ARN (Amazon Resource Name), o identificador único de cada recurso da AWS.
  - tipo: conceito
    titulo: Execução sequencial dos cenários
    texto: Todos os cenários usam o mesmo LocalStack na porta fixa 4566, e dois cenários ao mesmo tempo tentariam subir dois contêineres nessa porta. O repositório impede isso com `MaxCpuCount=1` no `test.runsettings`, que faz o `dotnet test` rodar um projeto por vez, e com um bloqueio de arquivo que a `LocalStackFixture` adquire antes de subir o ambiente. A ADR-004 do repositório registra essa escolha, que torna a suíte determinística e a deixa sequencial, com cerca de três minutos.
  - tipo: conceito
    titulo: Outros cenários de mensageria
    texto: O cenário 02 cria uma fila de mensagens mortas, a fila que recebe as mensagens que falharam repetidas vezes, e o cenário 10 recebe numa fila o aviso de objeto criado num bucket do Amazon S3 (Simple Storage Service), o serviço de armazenamento de arquivos da AWS. O AppHost também declara um contêiner PostgreSQL, banco relacional usado por cenários que esta ODA não exercita.
  - tipo: conceito
    titulo: Fan-out de SNS para SQS
    texto: O produtor publica uma vez no tópico, e cada fila assinante recebe a própria cópia, consumida no ritmo de cada consumidor. Para que o SNS consiga gravar na fila, a fila precisa de uma política que autorize `sqs:SendMessage` para o serviço SNS, restrita ao ARN do tópico.
    analogia: O tópico funciona como um aviso enviado a todos os inscritos de uma lista, e a fila funciona como uma caixa postal que guarda a carta até alguém retirá-la.
  - tipo: comparativo
    colunas:
    - Fila (Amazon SQS)
    - Tópico (Amazon SNS)
    linhas:
    - dimensao: Destino de cada mensagem
      valores:
      - Um único consumidor processa a mensagem
      - Cada assinante recebe a própria cópia
    - dimensao: Armazenamento
      valores:
      - A mensagem fica na fila até ser recebida e apagada
      - O tópico entrega no momento da publicação e não guarda a mensagem
    - dimensao: Forma de consumo
      valores:
      - O consumidor busca a mensagem com `ReceiveMessageAsync`
      - O SNS envia a mensagem às assinaturas
    - dimensao: Cenário do repositório
      valores:
      - '`02-SQS.Basic`'
      - '`04-SNS.Basic`'
    - dimensao: Papel no fan-out (cenário 09)
      valores:
      - Cada fila recebe e guarda a cópia
      - O tópico distribui a publicação
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: As pastas e os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit, e cada caminho parte da raiz desse repositório no commit `50a5344`. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: arvores
    esquerda:
      titulo: Cenários de mensageria
      nos:
      - caminho: scenarios/
        descricao: Um projeto xUnit independente por cenário de integração.
      - caminho: scenarios/02-SQS.Basic/
        descricao: 'Operações básicas de fila: criar, enviar, receber, apagar e fila de mensagens mortas.'
      - caminho: scenarios/04-SNS.Basic/
        descricao: Operações básicas de tópico.
      - caminho: scenarios/09-SNS.SQS.Fanout/
        descricao: Fan-out de um tópico para duas filas.
      - caminho: scenarios/09-SNS.SQS.Fanout/Fixture.cs
        descricao: Cria tópico e filas, grava a política de acesso e faz as assinaturas.
      - caminho: scenarios/09-SNS.SQS.Fanout/SnsSqsFanoutTests.cs
        descricao: Publica uma mensagem e confere uma cópia em cada fila.
      - caminho: scenarios/10-S3.SQS.Notification/
        descricao: Notificação de objeto criado no S3 entregue numa fila.
    direita:
      titulo: Infraestrutura de teste
      nos:
      - caminho: src/
        descricao: Código compartilhado pelos cenários.
      - caminho: src/AppHost/Program.cs
        descricao: Declara os contêineres do LocalStack e do PostgreSQL para o Aspire.
      - caminho: src/Shared/LocalStackFixture.cs
        descricao: Sobe o ambiente, espera o LocalStack ficar saudável e adquire o bloqueio da porta 4566.
      - caminho: src/Shared/AwsClientFactory.cs
        descricao: Cria os clientes do SDK apontando para o LocalStack.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Fan-out do cenário 09
    mermaid: "flowchart LR\n    T[Teste xUnit] -->|PublishAsync| S((fanout-topic))\n    S -->|cópia| Q1[fanout-queue-1]\n    S -->|cópia| Q2[fanout-queue-2]\n    Q1 -->|ReceiveMessageAsync| R1[Leitura da fila 1]\n    Q2 -->|ReceiveMessageAsync| R2[Leitura da fila 2]"
  - tipo: adr
    id: ADR-003
    titulo: Tática de simulação de serviços AWS
    status: Proposed
    contexto: Os testes precisam de vários serviços AWS, e usar a AWS real em testes automatizados implica custo, credenciais e estado persistente.
    decisao: Usar o LocalStack Community 3.8 com modo duplo, em que `AWS_TARGET=aws` desvia os mesmos testes para a AWS real.
    alternativas: LocalStack Pro, com custo e licença, AWS real em todas as execuções e substitutos em memória do SDK, que não exercitam assinaturas e políticas.
    consequencias: Os cenários rodam sem custo e sem credenciais, e as limitações de Lambda em macOS ARM64 e de Step Functions ficam documentadas.
  - tipo: adr
    id: ADR-004
    titulo: Tática de isolamento entre cenários de teste
    status: Proposed
    contexto: Os projetos de teste compartilham a porta 4566, e dois cenários em paralelo tentariam subir dois contêineres na mesma porta.
    decisao: Porta fixa 4566 com execução sequencial, combinando `MaxCpuCount=1` no `test.runsettings` com um bloqueio de arquivo na `LocalStackFixture`.
    alternativas: Porta aleatória por cenário, rede Docker isolada por cenário e a ausência de mecanismo.
    consequencias: O comportamento fica determinístico, ao custo de uma suíte completa sequencial de cerca de três minutos.
  - tipo: faixa
    estilo: dica

- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o fan-out, a distribuição de uma publicação para várias filas, evento por evento, da publicação no tópico à leitura em cada fila. Ative as falhas para ver o que acontece com cada mensagem e depois percorra a preparação dos recursos feita antes do teste.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Um tópico do Amazon SNS copia cada mensagem publicada com `PublishAsync` para as filas que o assinam, e cada fila do Amazon SQS guarda a cópia até o consumidor lê-la com `ReceiveMessageAsync`. A fixture, classe que prepara os recursos antes do teste, cria o tópico e as filas, grava em cada fila a política de acesso que autoriza o SNS a usar `sqs:SendMessage` e faz a assinatura da fila no tópico. A política e a assinatura identificam a fila pelo ARN, o identificador único do recurso na AWS, e o teste lê a fila pela URL dela.

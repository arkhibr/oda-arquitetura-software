- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria com esses bancos e esses testes, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A `ConditionExpression` do `UpdateItem` faz o DynamoDB gravar só se a condição for verdadeira. O pool de conexões do Npgsql, driver do PostgreSQL para .NET, guarda conexões abertas para o processo inteiro, e `NpgsqlConnection.ClearAllPools()` as descarta, enquanto `IClassFixture` faz o xUnit criar uma fixture, a classe que prepara recursos, para cada classe de teste. Um teste marcado com `Skip` não roda, a variável `AWS_TARGET=aws` desvia os testes para a AWS real, e o LocalStack Pro é a edição paga do emulador da AWS.
  - tipo: incidente
    titulo: Venda acima do estoque
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet test scenarios/03-DynamoDB.Basic 2>&1 | grep -E '^  Com falha|Assert\\.|Expected:|Actual:|PostgresException|Aprovado!|Com falha!' | sed -E 's/ \\[[0-9.]+ m?s\\]//'\n  Com falha Scenarios.DynamoDB.Basic.ReservaDeEstoqueTests.DezReservasSimultaneas_ComEstoqueCinco_AprovamCinco\n   Assert.Equal() Failure: Values differ\nExpected: 5\nActual:   10\nCom falha! – Com falha:     1, Aprovado:     4, Ignorado:     0, Total:     5, Duração: 21 s - 03-DynamoDB.Basic.dll (net10.0)"
    pergunta: Numa promoção, a loja vendeu dez unidades de um produto com cinco em estoque. O que aconteceu?
    correcao: Trocar a leitura seguida de gravação por um `UpdateItem` com `ConditionExpression`, como no passo 4.
    alternativas:
    - texto: O teste criou dez produtos.
      correta: false
      explicacao: As dez reservas usam o mesmo `id`.
    - texto: As dez reservas leram estoque 5 antes de qualquer gravação, e cada uma gravou o próprio cálculo.
      correta: true
      explicacao: A conferência na aplicação não vê as gravações das outras requisições.
    - texto: O DynamoDB perdeu gravações.
      correta: false
      explicacao: Todas as gravações foram aceitas, e a última venceu.
  - tipo: incidente
    titulo: Primeira consulta que falha na classe nova
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet test scenarios/17-RDS.Basic 2>&1 | grep -E '^  Com falha|Assert\\.|Expected:|Actual:|PostgresException|Aprovado!|Com falha!' | sed -E 's/ \\[[0-9.]+ m?s\\]//'\n  Com falha Scenarios.RDS.Basic.ReservaDeEstoqueSqlTests.DezReservasSimultaneas_ComEstoqueCinco_AprovamCinco\n   Npgsql.PostgresException : 57P01: terminating connection due to administrator command\nCom falha! – Com falha:     1, Aprovado:     5, Ignorado:     3, Total:     9, Duração: 23 s - 17-RDS.Basic.dll (net10.0)"
    pergunta: O teste novo falhou antes de reservar qualquer item, e passa quando roda sozinho. Qual é a causa?
    correcao: Chamar `NpgsqlConnection.ClearAllPools()` no início da fixture, ou compartilhar uma fixture entre as classes.
    alternativas:
    - texto: O PostgreSQL recusou dez conexões simultâneas.
      correta: false
      explicacao: O limite padrão é de cem conexões.
    - texto: A tabela não existe.
      correta: false
      explicacao: O erro seria `42P01`, de relação inexistente.
    - texto: O pool do Npgsql entregou uma conexão aberta com o PostgreSQL da classe anterior, que o Aspire já tinha encerrado.
      correta: true
      explicacao: Cada classe com `IClassFixture` sobe outro PostgreSQL na mesma porta, e o pool é do processo inteiro.
  - tipo: incidente
    titulo: Testes de RDS ignorados
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test scenarios/17-RDS.Basic 2>&1 | grep -E ''^  Com falha|Assert\.|Expected:|Actual:|PostgresException|Aprovado!|Com falha!'' | sed -E ''s/ \[[0-9.]+ m?s\]//''

      Aprovado!  – Com falha:     0, Aprovado:     5, Ignorado:     3, Total:     8, Duração: 46 ms - 17-RDS.Basic.dll (net10.0)


      scenarios/17-RDS.Basic/RdsBasicTests.cs:11

      [Fact(Skip = EnvironmentLimitations.LocalStackRdsApiReason)]'
    pergunta: Três testes do cenário 17 aparecem como ignorados em toda execução. Por quê?
    correcao: Rodar esses testes com `AWS_TARGET=aws` ou com o LocalStack Pro, e manter os testes de dados no PostgreSQL local.
    alternativas:
    - texto: Eles chamam a API de controle do RDS, que o LocalStack Community não oferece, e estão marcados com `Skip`.
      correta: true
      explicacao: O atributo `Skip` desses testes cita a constante `LocalStackRdsApiReason`, que informa que a API de controle do RDS é recurso da edição Pro do LocalStack 3.8.
    - texto: O PostgreSQL não subiu.
      correta: false
      explicacao: Os cinco testes de dados passaram.
    - texto: Eles são lentos e foram desligados.
      correta: false
      explicacao: O motivo está na constante `LocalStackRdsApiReason`.
  - tipo: incidente
    titulo: Asserção que aceita qualquer coisa a mais
    origem: codigo
    rotulo_saida: arquivo
    saida: 'scenarios/03-DynamoDB.Basic/DynamoDbBasicTests.cs:41-47

      var response = await fixture.DynamoDB.ScanAsync(new ScanRequest

      {

      TableName = Fixture.TableName

      });

      output.WriteLine($"    Itens encontrados: {response.Count}");

      Assert.True(response.Count >= 2);'
    pergunta: O teste grava dois itens e confere `Count >= 2`. Que falha ele deixaria passar?
    correcao: Conferir os itens gravados pelo próprio teste, por exemplo filtrando pelo prefixo `scan-`, e comparar com igualdade.
    alternativas:
    - texto: Uma gravação que falhasse.
      correta: false
      explicacao: Essa falha geraria uma exceção no `PutItem`.
    - texto: Um `Scan` que devolvesse itens duplicados ou de outra tabela, porque qualquer contagem acima de dois passa.
      correta: true
      explicacao: O `>=` existe porque outros testes gravam na mesma tabela.
    - texto: Nenhuma, porque o `Scan` sempre devolve a tabela inteira.
      correta: false
      explicacao: O `Scan` também pagina, a cada 1 MB lido.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A `ConditionExpression` é a condição de uma gravação do DynamoDB, e `ConditionalCheckFailedException` é a exceção lançada quando ela é falsa. O pool de conexões guarda conexões abertas do PostgreSQL para reaproveitá-las, e o erro `57P01` indica conexão encerrada pelo servidor. O AppHost é o projeto do .NET Aspire que sobe o PostgreSQL dos testes, e o RDS é o serviço de bancos relacionais da AWS.
  - tipo: quiz
    perguntas:
    - enunciado: Por que ler, conferir e gravar falha com requisições simultâneas?
      alternativas:
      - texto: Porque o DynamoDB não aceita gravações paralelas.
        correta: false
        explicacao: Ele aceitou as dez.
      - texto: Porque o cálculo é feito com `int`.
        correta: false
        explicacao: O tipo não muda o problema.
      - texto: Porque todas podem ler o mesmo valor antes de qualquer gravação.
        correta: true
        explicacao: A conferência usa um valor que já ficou velho.
    - enunciado: O que acontece no DynamoDB quando a `ConditionExpression` é falsa?
      alternativas:
      - texto: O item não muda, e a chamada lança `ConditionalCheckFailedException`.
        correta: true
        explicacao: A reserva trata a exceção como recusa.
      - texto: O item é gravado com o valor antigo.
        correta: false
        explicacao: Nada é gravado.
      - texto: A chamada fica esperando o estoque voltar.
        correta: false
        explicacao: A resposta é imediata.
    - enunciado: Qual é o equivalente em SQL da escrita condicional?
      alternativas:
      - texto: Um índice único no estoque.
        correta: false
        explicacao: O índice não limita valores.
      - texto: Um `UPDATE` com a condição no `WHERE`, conferindo as linhas afetadas.
        correta: true
        explicacao: Zero linhas afetadas significa recusa.
      - texto: Um `SELECT` antes do `UPDATE`.
        correta: false
        explicacao: É a mesma perda de atualização.
    - enunciado: Por que o pool de conexões quebrou na classe nova do cenário 17?
      alternativas:
      - texto: A senha mudou entre as classes.
        correta: false
        explicacao: A string de conexão é a mesma.
      - texto: O PostgreSQL só aceita uma classe de teste.
        correta: false
        explicacao: Com o pool limpo, as duas classes passaram.
      - texto: O pool é do processo e guardava conexões do PostgreSQL que a fixture anterior encerrou.
        correta: true
        explicacao: O erro `57P01` é o de conexão encerrada pelo servidor.
    - enunciado: O que o PostgreSQL do AppHost não substitui no RDS?
      alternativas:
      - texto: A API de controle, que cria, altera e descreve instâncias.
        correta: true
        explicacao: Os três testes dessa API ficam ignorados.
      - texto: As consultas SQL.
        correta: false
        explicacao: O motor PostgreSQL é o mesmo.
      - texto: As transações.
        correta: false
        explicacao: O teste de rollback passa.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - A reserva que lê e grava aprovou dez vendas para cinco unidades.
    - A escrita condicional no DynamoDB aprovou exatamente cinco.
    - O mesmo teste passou no PostgreSQL com a condição no `WHERE`.
    - A falha do pool de conexões entre classes foi entendida e corrigida.
    - O que o LocalStack Community emula do RDS está claro.

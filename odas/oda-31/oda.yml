id: '31'
titulo: 'Dados gerenciados: DynamoDB e RDS'
abas:
- id: objetivos
  titulo: Objetivos
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é impedir que reservas simultâneas vendam mais estoque do que existe, defeito de perda de atualização que testes sequenciais não revelam, comparando como o Amazon DynamoDB e um banco relacional garantem essa regra. No repositório `aspire-aws`, o cenário 03 usa o DynamoDB do LocalStack, e o cenário 17 usa um PostgreSQL no papel do Amazon RDS (Relational Database Service), porque a API de controle do RDS não existe no LocalStack Community. Você vai provar com dez reservas em paralelo que ler o estoque e depois gravar aprova dez vendas para cinco unidades e corrigir a reserva com uma escrita condicional em cada banco.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Amazon DynamoDB
      definicao: Banco NoSQL gerenciado da AWS que guarda itens em tabelas e os localiza pela chave. A tabela declara apenas a chave, e cada item pode ter atributos diferentes, sem colunas fixas.
      referencia:
        rotulo: O que é o Amazon DynamoDB? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Introduction.html
    - termo: Banco relacional
      definicao: Banco que guarda dados em tabelas com colunas e tipos declarados e é consultado em SQL, com junções e transações. Nesta ODA, o banco relacional é o PostgreSQL.
    - termo: Requisições simultâneas (concorrência)
      definicao: Situação em que várias requisições leem e alteram o mesmo dado ao mesmo tempo. O laboratório dispara dez reservas do mesmo produto em paralelo para provocar essa situação.
    - termo: Teste de integração
      definicao: Teste que exercita o código junto com dependências reais, como um banco de dados num contêiner. Os testes desta ODA gravam e leem no DynamoDB do LocalStack e no PostgreSQL.
    - termo: Cenário
      definicao: No repositório `aspire-aws`, cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit que exercita uma integração com serviços da AWS. Esta ODA usa o cenário 03, `03-DynamoDB.Basic`, e o cenário 17, `17-RDS.Basic`.
    - termo: LocalStack e LocalStack Community
      definicao: O LocalStack é um emulador dos serviços da AWS que roda num contêiner Docker e responde na porta 4566. O repositório usa a edição gratuita, a Community, na versão 3.8, que emula o DynamoDB e não oferece a API de controle do RDS, disponível na edição paga, a Pro.
      referencia:
        rotulo: Documentação do LocalStack
        url: https://docs.localstack.cloud/overview/
    - termo: PostgreSQL
      definicao: Banco de dados relacional de código aberto. O AppHost declara um contêiner PostgreSQL 16.9 na porta 5433, que os testes do cenário 17 usam no lugar de uma instância do RDS.
    - termo: Amazon RDS (Relational Database Service)
      definicao: Serviço da AWS que cria e administra instâncias de bancos relacionais, como o PostgreSQL. Os dados são acessados pelo próprio banco, em SQL, e a criação e a configuração das instâncias passam por uma API do serviço.
      referencia:
        rotulo: O que é o Amazon RDS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonRDS/latest/UserGuide/Welcome.html
    - termo: API de controle do RDS
      definicao: Conjunto de chamadas do RDS que cria, altera, descreve e remove instâncias de banco, como `CreateDBInstance`. A fixture do cenário 17 tenta essa chamada e segue sem ela quando o LocalStack Community a recusa.
    - termo: Chave de partição e chave primária
      definicao: No DynamoDB, a chave de partição é o atributo que identifica o item e define onde ele é guardado, e a tabela `items` do cenário 03 usa o atributo `id`. Numa tabela relacional, a chave primária é a coluna ou o conjunto de colunas que identifica cada linha.
      referencia:
        rotulo: Componentes principais do Amazon DynamoDB (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/HowItWorks.CoreComponents.html
    - termo: Perda de atualização
      definicao: Falha de concorrência em que duas requisições leem o mesmo valor, calculam o novo valor na aplicação e gravam, e a segunda gravação apaga o efeito da primeira. Com estoque 5 e dez reservas simultâneas, todas podem ler 5 e aprovar a venda.
      referencia:
        rotulo: Transaction Isolation (documentação do PostgreSQL)
        url: https://www.postgresql.org/docs/current/transaction-iso.html
    - termo: Escrita condicional
      definicao: Gravação que o próprio banco só aplica se uma condição for verdadeira no momento da escrita, numa única operação atômica. No DynamoDB, a condição vai na `ConditionExpression` do `UpdateItem`, e no SQL vai no `WHERE` do `UPDATE`.
      referencia:
        rotulo: Expressões de condição do DynamoDB (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html
    - termo: Operação atômica
      definicao: Operação que o banco executa por inteiro ou não executa, sem que outra requisição veja um estado intermediário. É o que impede duas reservas de usarem a mesma unidade de estoque.
    - termo: '`ConditionalCheckFailedException`'
      definicao: Exceção que o DynamoDB lança quando a condição de uma escrita condicional é falsa. O item não muda, e o código da reserva trata a exceção como recusa.
    - termo: Docker e contêiner
      definicao: O Docker executa programas em contêineres, processos isolados que levam consigo as próprias dependências a partir de uma imagem. O LocalStack e o PostgreSQL dos cenários rodam como contêineres na sua máquina.
      referencia:
        rotulo: What is Docker? (documentação do Docker)
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: WSL (Windows Subsystem for Linux)
      definicao: Recurso do Windows que roda um ambiente Linux dentro do sistema. No Windows, os comandos desta ODA devem rodar nele, porque usam a sintaxe do bash.
      referencia:
        rotulo: O que é o Subsistema do Windows para Linux (Microsoft Learn)
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: '`GetItem`, `Query`, `Scan`, `PutItem` e `UpdateItem`'
      definicao: Operações do DynamoDB. O `GetItem` lê um item pela chave, o `Query` lê itens de uma mesma chave de partição, o `Scan` percorre a tabela inteira em páginas de até 1 MB, o `PutItem` grava o item inteiro e o `UpdateItem` altera atributos de um item.
      referencia:
        rotulo: Trabalhar com itens e atributos no DynamoDB (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/WorkingWithItems.html
    - termo: Transação
      definicao: Conjunto de operações que o banco aplica por inteiro ou desfaz por inteiro. No DynamoDB, o `TransactWriteItems` agrupa até 100 itens, e no PostgreSQL a transação começa com `BEGIN` e termina com `COMMIT` ou `ROLLBACK`.
    - termo: AppHost
      definicao: Projeto do .NET Aspire que declara, em C#, os recursos que a aplicação precisa. No repositório, `src/AppHost/Program.cs` declara os contêineres do LocalStack e do PostgreSQL usados por todos os cenários.
      referencia:
        rotulo: What is the AppHost? (documentação do Aspire)
        url: https://learn.microsoft.com/pt-br/dotnet/aspire/fundamentals/app-host-overview
    - termo: .NET Aspire
      definicao: Conjunto de ferramentas da Microsoft para descrever e subir, a partir de um projeto .NET, os serviços e contêineres de que uma aplicação depende. Nos testes do repositório, o Aspire sobe o LocalStack e o PostgreSQL para os cenários.
      referencia:
        rotulo: What is Aspire? (documentação do Aspire)
        url: https://learn.microsoft.com/pt-br/dotnet/aspire/get-started/aspire-overview
    - termo: ADR (Architecture Decision Record)
      definicao: Registro curto de uma decisão de arquitetura, com o contexto, a decisão, as alternativas e as consequências. A ADR-003, em `docs/architecture/adrs/`, registra o uso do LocalStack Community e as limitações dele.
      referencia:
        rotulo: Architectural Decision Records (adr.github.io)
        url: https://adr.github.io/
    - termo: xUnit e fixture
      definicao: O xUnit é o framework de testes para .NET usado nos cenários. A fixture é a classe que o xUnit cria antes dos testes para preparar recursos compartilhados, como a tabela `items` do cenário 03, e `IClassFixture` liga uma fixture a uma classe de teste.
      referencia:
        rotulo: Sharing Context between Tests (documentação do xUnit)
        url: https://xunit.net/docs/shared-context
    - termo: Cobrança por requisição (`PAY_PER_REQUEST`)
      definicao: Modo de cobrança do DynamoDB em que a tabela não reserva capacidade de leitura e escrita e cobra cada operação. A fixture do cenário 03 cria a tabela nesse modo.
    - termo: Pool de conexões e Npgsql
      definicao: O Npgsql é o driver que liga programas .NET ao PostgreSQL. O pool de conexões guarda conexões abertas para reaproveitá-las, e ele pertence ao processo inteiro, por isso pode entregar uma conexão aberta com um banco que já foi encerrado.
      referencia:
        rotulo: Connection String Parameters, seção Pooling (documentação do Npgsql)
        url: https://www.npgsql.org/doc/connection-string-parameters.html
    - termo: Erro `57P01`
      definicao: Código de erro do PostgreSQL para conexão encerrada por um comando do administrador, `admin_shutdown`. No laboratório, ele aparece quando o pool entrega uma conexão com o PostgreSQL de uma classe de teste anterior, que o Aspire já tinha encerrado.
      referencia:
        rotulo: PostgreSQL Error Codes (documentação do PostgreSQL)
        url: https://www.postgresql.org/docs/current/errcodes-appendix.html
    - termo: Teste ignorado (`Skip`)
      definicao: Teste marcado para não rodar, com o motivo registrado no atributo. Os três testes do cenário 17 que chamam a API de controle do RDS são ignorados, com o motivo na constante `LocalStackRdsApiReason`.
    - termo: Modo duplo (`AWS_TARGET=aws`)
      definicao: Variável de ambiente que desvia os mesmos testes para a AWS real. Sem ela, o AppHost sobe o LocalStack, e os clientes do SDK da AWS apontam para a porta 4566.
    - termo: Socket do Docker e Colima
      definicao: O arquivo `/var/run/docker.sock` é o canal pelo qual programas conversam com o daemon do Docker, e o AppHost o monta no contêiner do LocalStack para os cenários com Lambda. O Colima, ferramenta que roda o Docker no macOS numa máquina virtual Linux, não cria esse arquivo na configuração padrão, e a montagem falha.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar a diferença entre chave de partição no DynamoDB e chave primária numa tabela relacional.
    - Reconhecer a perda de atualização em ler, calcular e gravar.
    - Escrever uma atualização condicional no DynamoDB com `ConditionExpression`.
    - Escrever a mesma regra em SQL com a condição no `WHERE`.
    - Explicar o que o LocalStack Community emula do RDS e o que fica de fora.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, exigido pelo `global.json`, do Git e de um Docker em execução. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito e código
  blocos:
  - tipo: legenda
    texto: Esta aba compara o Amazon DynamoDB, banco NoSQL da AWS que localiza itens pela chave, com um banco relacional, consultado em SQL, e explica por que ler um valor e depois gravá-lo falha quando várias requisições chegam ao mesmo tempo. Os blocos de conceito explicam cada termo antes da tabela que compara os dois bancos.
  - tipo: conceito
    titulo: DynamoDB e banco relacional
    texto: O Amazon DynamoDB guarda itens em tabelas que declaram só a chave, e cada item pode ter atributos diferentes. Ele lê um item pela chave com `GetItem`, lê os itens de uma chave de partição com `Query` e percorre a tabela inteira com `Scan`, e grava com `PutItem`, que substitui o item, ou `UpdateItem`, que altera atributos. Um banco relacional, como o PostgreSQL, declara colunas e tipos no `CREATE TABLE` e aceita consultas livres em SQL, com junções entre tabelas.
  - tipo: conceito
    titulo: Chave de partição e chave primária
    texto: No DynamoDB, a chave de partição é o atributo que identifica o item e define onde ele é guardado, e a tabela `items` do cenário 03 usa o atributo `id`. Numa tabela relacional, a chave primária é a coluna ou o conjunto de colunas que identifica cada linha.
  - tipo: conceito
    titulo: Transação
    texto: Uma transação é um conjunto de operações que o banco aplica por inteiro ou desfaz por inteiro. No DynamoDB, o `TransactWriteItems` agrupa até 100 itens, e no PostgreSQL a transação começa com `BEGIN` e termina com `COMMIT` ou `ROLLBACK`.
  - tipo: conceito
    titulo: LocalStack, AppHost e o RDS
    texto: Os testes chamam o LocalStack, emulador dos serviços da AWS que roda num contêiner Docker, na edição gratuita Community, versão 3.8. Ele emula o DynamoDB e não oferece a API de controle do Amazon RDS (Relational Database Service), as chamadas que criam e administram instâncias de banco. Por isso o AppHost, projeto do .NET Aspire que declara os contêineres dos testes, sobe um PostgreSQL próprio, e o cenário 17 conversa com ele diretamente.
  - tipo: conceito
    titulo: Perda de atualização
    texto: Quando duas requisições leem o mesmo valor, calculam o novo e gravam, a segunda gravação apaga o efeito da primeira. Com estoque 5 e dez reservas de uma unidade, todas podem ler 5 e aprovar a venda.
  - tipo: conceito
    titulo: Escrita condicional
    texto: 'A correção leva a condição para dentro da própria escrita: o banco confere e altera numa única operação atômica. No DynamoDB, a condição falsa gera `ConditionalCheckFailedException`, e no SQL o `UPDATE` afeta zero linhas.'
  - tipo: comparativo
    colunas:
    - DynamoDB
    - PostgreSQL no papel do RDS
    linhas:
    - dimensao: Acesso
      valores:
      - Por chave, com `GetItem`, `Query` e `Scan`
      - Por SQL, com junções e consultas livres
    - dimensao: Esquema
      valores:
      - Só a chave é declarada na tabela
      - Colunas e tipos declarados no `CREATE TABLE`
    - dimensao: Escrita condicional
      valores:
      - '`ConditionExpression` no `UpdateItem`'
      - Condição no `WHERE` do `UPDATE`
    - dimensao: Transação
      valores:
      - '`TransactWriteItems`, até 100 itens'
      - '`BEGIN` e `COMMIT` com qualquer número de linhas'
    - dimensao: No LocalStack Community
      valores:
      - Emulado
      - API de controle indisponível, banco real no contêiner do AppHost
  - tipo: faixa
    estilo: dica
    titulo: 💻 No código
    texto: 'Esta parte da aba mostra os arquivos que preparam os dois bancos comparados nesta ODA: a fixture do cenário 03, classe que cria a tabela do DynamoDB antes dos testes, um teste desse cenário e a fixture do cenário 17, que prepara o PostgreSQL usado no lugar do Amazon RDS, o serviço de bancos relacionais da AWS. O bloco Termos usados nesta aba explica as palavras técnicas dos arquivos, e cada editor traz acima dele o papel do arquivo. Os marcadores numerados ao lado das linhas explicam o que cada cenário prepara e o que os testes existentes deixam sem cobertura.'
  - tipo: conceito
    titulo: 📘 Conceitos usados no código
    texto: A fixture é a classe que o xUnit, framework de testes do .NET, cria antes dos testes para preparar recursos. A tabela do cenário 03 declara só a chave de partição `id`, o atributo que identifica cada item, usa cobrança por requisição, sem capacidade reservada, e só aceita operações quando chega ao estado `ACTIVE`. O `Scan` percorre a tabela inteira, e a API de controle do RDS é o conjunto de chamadas que cria instâncias de banco, ausente no LocalStack Community, a edição gratuita do emulador da AWS.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Objetivos, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/03-DynamoDB.Basic/Fixture.cs
    commit: 50a5344
    linhas:
    - '        await DynamoDB.CreateTableAsync(new CreateTableRequest'
    - '        {'
    - '            TableName = TableName,'
    - '            AttributeDefinitions ='
    - '            ['
    - '                new AttributeDefinition("id", ScalarAttributeType.S)'
    - '            ],'
    - '            KeySchema ='
    - '            ['
    - '                new KeySchemaElement("id", KeyType.HASH)'
    - '            ],'
    - '            BillingMode = BillingMode.PAY_PER_REQUEST'
    - '        });'
    - ''
    - '        await PollingHelper.WaitUntilAsync(async () =>'
    - '        {'
    - '            var table = await DynamoDB.DescribeTableAsync(TableName);'
    - '            return table.Table.TableStatus == TableStatus.ACTIVE;'
    anotacoes:
    - linha: 26
      texto: A tabela só declara a chave de partição `id`.
    - linha: 28
      texto: Cobrança por requisição, sem capacidade reservada.
    - linha: 34
      texto: A criação é assíncrona, e a fixture espera a tabela ficar ativa.
    inicio: 17
    contexto: O `scenarios/03-DynamoDB.Basic/Fixture.cs` é a fixture do cenário 03, a classe que o xUnit cria antes dos testes para preparar a tabela `items` no DynamoDB do LocalStack. O trecho abaixo é o método `InitializeScenarioAsync`, que cria a tabela só com a chave de partição `id`, sem índices nem regras adicionais, e espera o estado `ACTIVE`, de modo que qualquer regra de negócio sobre os itens fica a cargo de quem grava.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/03-DynamoDB.Basic/DynamoDbBasicTests.cs
    commit: 50a5344
    linhas:
    - '        var response = await fixture.DynamoDB.ScanAsync(new ScanRequest'
    - '        {'
    - '            TableName = Fixture.TableName'
    - '        });'
    - '        output.WriteLine($"    Itens encontrados: {response.Count}");'
    - ''
    - '        Assert.True(response.Count >= 2);'
    anotacoes:
    - linha: 47
      texto: O `>=` tolera itens de outros testes na mesma tabela.
    inicio: 41
    contexto: O `scenarios/03-DynamoDB.Basic/DynamoDbBasicTests.cs` reúne os testes do cenário 03, cada um com uma operação do DynamoDB sobre a mesma tabela. O trecho abaixo é o fim do teste de varredura, que lê a tabela inteira com `Scan` e aceita dois itens ou mais, e nenhum teste do arquivo grava o mesmo item a partir de duas requisições concorrentes, o caso que esta ODA acrescenta.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/17-RDS.Basic/Fixture.cs
    commit: 50a5344
    linhas:
    - '            await RDS.CreateDBInstanceAsync(new CreateDBInstanceRequest'
    - '            {'
    - '                DBInstanceIdentifier = NomeInstancia,'
    - '                DBInstanceClass      = "db.t3.micro",'
    - '                Engine               = "postgres",'
    - '                MasterUsername       = "test",'
    - '                MasterUserPassword   = "test",'
    - '                AllocatedStorage     = 20,'
    - '                DBName               = "testdb"'
    - '            });'
    - ''
    - '            // 3. Aguarda status "available" (LocalStack Pro transiciona rapidamente)'
    - '            await PollingHelper.WaitUntilAsync(async () =>'
    - '            {'
    - '                var r = await RDS.DescribeDBInstancesAsync(new DescribeDBInstancesRequest'
    - '                {'
    - '                    DBInstanceIdentifier = NomeInstancia'
    - '                });'
    - '                return r.DBInstances.Count > 0 &&'
    - '                       r.DBInstances[0].DBInstanceStatus == "available";'
    - '            }, timeout: TimeSpan.FromSeconds(30),'
    - '            failureMessage: $"Instância RDS ''{NomeInstancia}'' não ficou ''available'' em 30s.");'
    - ''
    - '            RdsApiAvailable = true;'
    - '        }'
    - '        catch (Amazon.RDS.AmazonRDSException)'
    - '        {'
    - '            // API RDS não disponível no LocalStack Community — testes de plano de controle serão pulados.'
    - '            RdsApiAvailable = false;'
    anotacoes:
    - linha: 42
      texto: A API de controle do RDS, que cria a instância.
    - linha: 67
      texto: No LocalStack Community, a chamada falha, e a fixture segue só com o PostgreSQL.
    inicio: 42
    contexto: O `scenarios/17-RDS.Basic/Fixture.cs` é a fixture do cenário 17, que espera o PostgreSQL declarado no AppHost aceitar conexões e tenta criar uma instância pela API de controle do RDS. O trecho abaixo mostra essa tentativa e o `catch` que segue sem ela quando o LocalStack Community recusa a chamada, motivo pelo qual os testes deste cenário falam direto com o PostgreSQL.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, duas reservas simultâneas do último item em estoque, primeiro com a leitura seguida de gravação e depois com a escrita condicional, a gravação que o banco só aplica se a condição for verdadeira. Depois, classifique cada técnica pelo resultado.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: Na leitura seguida de gravação, a aplicação lê o estoque com `GetItem` ou `SELECT`, calcula o novo valor e grava com `PutItem` ou `UPDATE`, e duas requisições podem ler o mesmo valor antes de qualquer gravação. Na escrita condicional, a condição vai junto da gravação, na `ConditionExpression` do `UpdateItem` do DynamoDB ou no `WHERE` do `UPDATE` em SQL, e o banco confere e altera numa operação atômica, que nenhuma outra requisição vê pela metade.
  - tipo: fluxo
    titulo: Duas reservas do último item
    etapas:
    - titulo: Leituras
      descricao: As reservas A e B leem o produto ao mesmo tempo e encontram estoque 1.
    - titulo: Cálculo
      descricao: As duas concluem que há estoque e calculam o novo valor 0.
    - titulo: Gravações
      descricao: 'A grava 0, e B grava 0 por cima: duas vendas aprovadas para uma unidade.'
    - titulo: Com condição
      descricao: A pede a subtração se o estoque for pelo menos 1, e o banco aplica e deixa 0.
    - titulo: Recusa
      descricao: B pede a mesma operação, a condição é falsa, e o banco recusa sem alterar nada.
  - tipo: classificador
    enunciado: Com dez reservas simultâneas e estoque 5, quantas são aprovadas?
    categorias:
    - id: cinco
      rotulo: Exatamente cinco
    - id: mais
      rotulo: Podem passar de cinco
    itens:
    - texto: '`GetItem`, cálculo na aplicação e `PutItem`'
      categoria: mais
      explicacao: O passo 3 aprovou as dez.
    - texto: '`UpdateItem` com `ConditionExpression` sobre o estoque'
      categoria: cinco
      explicacao: O DynamoDB confere e altera de forma atômica.
    - texto: '`SELECT`, cálculo na aplicação e `UPDATE` sem condição'
      categoria: mais
      explicacao: É a mesma perda de atualização, agora em SQL.
    - texto: '`UPDATE` com `estoque >= @quantidade` no `WHERE`'
      categoria: cinco
      explicacao: O banco trava a linha e reavalia a condição.
    - texto: '`PutItem` com o estoque calculado e sem condição'
      categoria: mais
      explicacao: A última gravação vence.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é eliminar a perda de atualização na reserva de estoque, que aprova dez vendas para cinco unidades, levando a condição para dentro da escrita nos dois bancos e provando a correção com dez reservas simultâneas. Os passos 1 a 4 escrevem o teste no DynamoDB, mostram a versão que lê e grava falhar e corrigem com a escrita condicional, e os passos 5 a 7 repetem o teste no PostgreSQL e corrigem o pool de conexões. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A escrita condicional é a gravação que o banco só aplica se a condição for verdadeira, e ela corrige a perda de atualização, em que duas requisições leem o mesmo valor e a segunda gravação apaga o efeito da primeira. A fixture é a classe que prepara os recursos de uma classe de teste, e o Npgsql, driver que liga o .NET ao PostgreSQL, mantém um pool de conexões, um conjunto de conexões abertas reaproveitadas pelo processo inteiro. O erro `57P01` do PostgreSQL indica conexão encerrada pelo servidor.
  - tipo: faixa
    estilo: objetivo
    problema: Os testes dos cenários 03 e 17 gravam e leem um item por vez, e nenhum deles exercita duas requisições sobre o mesmo dado. Uma reserva de estoque que lê o valor, confere na aplicação e grava o resultado sofre perda de atualização quando as requisições chegam juntas.
    impacto: Com estoque 5 e dez reservas simultâneas, as dez são aprovadas, e a loja vende o dobro do que tem. A falha não aparece em testes sequenciais e só se manifesta sob carga, quando o prejuízo já aconteceu.
    mecanismo: O laboratório escreve primeiro um teste com dez reservas em paralelo, mostra a versão que lê e grava falhando e corrige com escrita condicional, usando a `ConditionExpression` do `UpdateItem` no DynamoDB e a condição `estoque >= @quantidade` no `WHERE` do `UPDATE` no PostgreSQL. No caminho, corrige o erro `57P01` do pool de conexões do Npgsql com `NpgsqlConnection.ClearAllPools()` na fixture.
    comprovacao: 'A versão que lê e grava falha com `Expected: 5` e `Actual: 10`. Com a escrita condicional, o cenário 03 mostra `Aprovado: 5`, e o cenário 17 mostra `Aprovado: 6` e `Ignorado: 3`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: faixa
    estilo: erro
    titulo: ⚠️ Se você usa Colima ou outro Docker sem /var/run/docker.sock
    sintoma: Os testes falham depois de cerca de dois minutos, com a mensagem `LocalStack did not become healthy within 120s`.
    causa: O `src/AppHost/Program.cs` monta o arquivo `/var/run/docker.sock` da máquina no contêiner do LocalStack, e a montagem falha quando o arquivo não existe.
    correcao: Depois do `git stash` da faixa Antes de começar, na aba Laboratório, retire a linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")` de `src/AppHost/Program.cs`. A montagem só serve aos cenários com Lambda e não afeta esta ODA.
  - tipo: passos
    itens:
    - titulo: Rodar o cenário 03
      editor:
        rotulo: terminal
        linhas:
        - docker info --format '{{.ServerVersion}}'
        - dotnet test scenarios/03-DynamoDB.Basic 2>&1 | grep -E '^  Com falha|Assert\.|Expected:|Actual:|PostgresException|Aprovado!|Com falha!' | sed -E 's/ \[[0-9.]+ m?s\]//'
      sucesso: 'A versão do Docker e `Aprovado: 4`.'
    - titulo: Escrever o teste da reserva
      texto: O teste cria um produto com estoque 5, dispara dez reservas de uma unidade ao mesmo tempo e espera cinco aprovadas e estoque 0.
      editor:
        rotulo: arquivo
        caminho: scenarios/03-DynamoDB.Basic/ReservaDeEstoqueTests.cs (novo)
        commit: 50a5344
        linhas:
        - using Amazon.DynamoDBv2.Model;
        - ''
        - namespace Scenarios.DynamoDB.Basic;
        - ''
        - 'public class ReservaDeEstoqueTests(Fixture fixture) : IClassFixture<Fixture>'
        - '{'
        - '    [Fact]'
        - '    public async Task DezReservasSimultaneas_ComEstoqueCinco_AprovamCinco()'
        - '    {'
        - '        var produto = $"produto-{Guid.NewGuid():N}";'
        - '        await fixture.DynamoDB.PutItemAsync(Fixture.TableName, new Dictionary<string, AttributeValue>'
        - '        {'
        - '            ["id"] = new() { S = produto },'
        - '            ["estoque"] = new() { N = "5" }'
        - '        });'
        - ''
        - '        var reservas = await Task.WhenAll(Enumerable.Range(0, 10)'
        - '            .Select(_ => ReservaDeEstoque.ReservarAsync(fixture.DynamoDB, produto, 1)));'
        - ''
        - '        var item = await fixture.DynamoDB.GetItemAsync(Fixture.TableName,'
        - '            new Dictionary<string, AttributeValue> { ["id"] = new() { S = produto } });'
        - '        Assert.Equal(5, reservas.Count(aprovada => aprovada));'
        - '        Assert.Equal("0", item.Item["estoque"].N);'
        - '    }'
        - '}'
    - titulo: Reservar lendo e gravando
      texto: Esta versão lê o estoque, confere na aplicação e grava o valor calculado.
      editor:
        rotulo: arquivo
        caminho: scenarios/03-DynamoDB.Basic/ReservaDeEstoque.cs (novo)
        commit: 50a5344
        linhas:
        - using Amazon.DynamoDBv2;
        - using Amazon.DynamoDBv2.Model;
        - ''
        - namespace Scenarios.DynamoDB.Basic;
        - ''
        - public static class ReservaDeEstoque
        - '{'
        - '    public static async Task<bool> ReservarAsync(IAmazonDynamoDB dynamo, string produto, int quantidade)'
        - '    {'
        - '        var chave = new Dictionary<string, AttributeValue> { ["id"] = new() { S = produto } };'
        - '        var item = await dynamo.GetItemAsync(Fixture.TableName, chave);'
        - '        var estoque = int.Parse(item.Item["estoque"].N);'
        - '        if (estoque < quantidade)'
        - '        {'
        - '            return false;'
        - '        }'
        - ''
        - '        await dynamo.PutItemAsync(Fixture.TableName, new Dictionary<string, AttributeValue>'
        - '        {'
        - '            ["id"] = new() { S = produto },'
        - '            ["estoque"] = new() { N = (estoque - quantidade).ToString() }'
        - '        });'
        - '        return true;'
        - '    }'
        - '}'
        - ''

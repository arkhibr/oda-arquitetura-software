id: '32'
titulo: Funções orientadas a eventos com Lambda
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é impedir que uma mensagem que a função não consegue processar volte à fila e acione a função sem fim, defeito da fila do cenário 08, e testar com segurança efeitos que chegam depois da chamada. No repositório `aspire-aws`, os cenários 07, 08, 11 e 14 ligam funções do AWS Lambda a eventos do Amazon S3 (Simple Storage Service), do Amazon SQS (Simple Queue Service), do Amazon DynamoDB e do Amazon EventBridge no LocalStack e esperam o resultado com um laço de consulta. Você vai rodar os cenários num contêiner Linux, provar com um teste que a mensagem inválida não sai da fila e configurar uma fila de mensagens mortas.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: AWS Lambda
      definicao: Serviço da AWS que executa uma função quando um evento chega, sem servidor administrado por quem escreve a função. Nos cenários desta ODA, as funções são escritas em Python e implantadas no LocalStack.
      referencia:
        rotulo: O que é o AWS Lambda? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/welcome.html
    - termo: Amazon S3 (Simple Storage Service)
      definicao: Serviço de armazenamento de objetos da AWS, em que cada arquivo fica num bucket. No cenário 07, a criação de um objeto no bucket aciona uma função.
      referencia:
        rotulo: O que é o Amazon S3? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Amazon SQS (Simple Queue Service)
      definicao: Serviço de filas da AWS. O consumidor recebe a mensagem e a apaga depois de processá-la, e a mensagem não apagada volta a ficar disponível depois do tempo de visibilidade.
      referencia:
        rotulo: O que é o Amazon SQS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
    - termo: Amazon DynamoDB
      definicao: Banco NoSQL gerenciado da AWS que guarda itens em tabelas e os localiza pela chave. As funções dos cenários gravam nele o resultado que os testes conferem.
      referencia:
        rotulo: O que é o Amazon DynamoDB? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Introduction.html
    - termo: Amazon EventBridge
      definicao: Serviço de barramento de eventos da AWS, em que regras comparam cada evento recebido com um padrão e o encaminham aos alvos, como uma função Lambda. O cenário 14 usa uma regra desse tipo.
      referencia:
        rotulo: O que é o Amazon EventBridge? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/eventbridge/latest/userguide/eb-what-is.html
    - termo: Gatilho
      definicao: Ligação entre uma origem de eventos e uma função Lambda, que faz a função rodar a cada evento. Esta ODA compara quatro gatilhos, S3, SQS, DynamoDB e EventBridge, e o que cada um faz quando a função falha.
    - termo: Efeito assíncrono
      definicao: Resultado que aparece algum tempo depois da chamada que o provocou, sem que a chamada espere por ele. O envio de uma mensagem termina antes de a função gravar no DynamoDB, e o teste precisa esperar o efeito.
    - termo: Mensagem envenenada
      definicao: Mensagem que a função não consegue processar, como um texto que não é JSON, e que faz cada tentativa falhar. Sem limite de recebimentos, ela volta à fila e aciona a função repetidamente.
    - termo: Cenário
      definicao: No repositório `aspire-aws`, cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit que exercita uma integração com serviços da AWS. O laboratório usa o cenário 08, `08-SQS.Lambda.Consumer`.
    - termo: LocalStack
      definicao: Emulador dos serviços da AWS que roda num contêiner Docker e responde na porta 4566. Para executar uma função Lambda, ele cria outro contêiner pelo Docker da máquina.
      referencia:
        rotulo: Documentação do LocalStack
        url: https://docs.localstack.cloud/overview/
    - termo: Laço de consulta (polling) com tempo limite
      definicao: Técnica de teste que consulta uma condição a cada intervalo até ela ficar verdadeira ou até um prazo máximo. No repositório, o `PollingHelper.WaitUntilAsync` faz essa consulta, e o `AssertNeverAsync` confere que algo não acontece dentro do prazo.
    - termo: Fila de mensagens mortas (DLQ, dead-letter queue)
      definicao: Fila comum que recebe as mensagens que falharam repetidas vezes, para que sejam analisadas sem voltar a acionar a função. No laboratório, a `consumer-dlq` recebe a mensagem inválida da `consumer-queue`.
      referencia:
        rotulo: Filas de mensagens não entregues no Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
    - termo: '`RedrivePolicy` e `maxReceiveCount`'
      definicao: Atributo da fila de origem que aponta, pelo ARN, a fila de mensagens mortas e define em `maxReceiveCount` quantas vezes uma mensagem pode ser recebida sem ser apagada. Ao passar desse número, o SQS move a mensagem para a fila de mensagens mortas.
    - termo: ARN (Amazon Resource Name)
      definicao: Identificador único de um recurso da AWS, no formato `arn:aws:serviço:região:conta:recurso`. A `RedrivePolicy` identifica a fila de mensagens mortas pelo ARN dela.
      referencia:
        rotulo: Nomes do recurso da Amazon (ARNs) (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/reference-arns.html
    - termo: Docker, imagem e contêiner
      definicao: O Docker executa programas em contêineres, processos isolados criados a partir de uma imagem, que reúne o sistema e as dependências. O laboratório constrói uma imagem com o .NET SDK 10 e o cliente do Docker e roda os testes num contêiner criado a partir dela com `docker exec`.
      referencia:
        rotulo: What is Docker? (documentação do Docker)
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: Socket do Docker (`/var/run/docker.sock`)
      definicao: Arquivo pelo qual programas conversam com o daemon do Docker, o serviço que cria e para os contêineres. O LocalStack e o contêiner Linux do laboratório recebem esse arquivo para criar contêineres no Docker da máquina.
    - termo: Apple Silicon e ARM64
      definicao: Apple Silicon é a família de processadores dos Macs recentes, com arquitetura ARM64. O repositório ignora os testes com Lambda quando o processo de teste roda no macOS com ARM64, pela regra de `src/Shared/EnvironmentLimitations.cs`.
    - termo: Teste ignorado (`Skip`)
      definicao: 'Teste marcado para não rodar, com o motivo registrado. No macOS com Apple Silicon, o cenário 08 aparece com `Ignorado: 1`, e no contêiner Linux o mesmo teste roda.'
    - termo: Colima
      definicao: Ferramenta que roda o Docker no macOS dentro de uma máquina virtual Linux. O caminho do laboratório com o contêiner Linux foi verificado com o Colima.
    - termo: WSL (Windows Subsystem for Linux)
      definicao: Recurso do Windows que roda um ambiente Linux dentro do sistema. No WSL, os comandos `dotnet test` rodam direto, sem o contêiner do laboratório.
      referencia:
        rotulo: O que é o Subsistema do Windows para Linux (Microsoft Learn)
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: Mapeamento de origem de eventos
      definicao: Recurso do Lambda que lê uma fila ou um stream e invoca a função com lotes de registros. Ele apaga as mensagens do SQS quando a invocação termina com sucesso, e a fixture do cenário 08 usa lote de uma mensagem.
      referencia:
        rotulo: Como o Lambda processa registros de fluxos e filas (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/invocation-eventsourcemapping.html
    - termo: Tempo limite de visibilidade
      definicao: Período em que uma mensagem recebida fica invisível para outros consumidores da fila. Se ela não for apagada nesse período, volta a ficar visível e é entregue de novo, e a `consumer-queue`, criada sem atributos, usa o valor padrão do SQS, de 30 s.
      referencia:
        rotulo: Tempo limite de visibilidade do Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
    - termo: Período de retenção
      definicao: Tempo máximo que o SQS guarda uma mensagem na fila antes de descartá-la. Sem fila de mensagens mortas, a mensagem inválida volta à fila até o fim desse período.
    - termo: DynamoDB Streams e fragmento
      definicao: O DynamoDB Streams registra em ordem as alterações dos itens de uma tabela, divididas em fragmentos. No cenário 11, um mapeamento lê esse stream, e um lote que falha é repetido e bloqueia o fragmento até expirar ou dar certo.
      referencia:
        rotulo: DynamoDB Streams (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Streams.html
    - termo: Inicialização a frio
      definicao: Tempo extra da primeira invocação de uma função, em que o ambiente de execução é criado antes de o código rodar. O tempo limite das asserções assíncronas precisa cobrir esse tempo.
      referencia:
        rotulo: Ciclo de vida do ambiente de execução do Lambda (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/lambda-runtime-environment.html
    - termo: ADR (Architecture Decision Record)
      definicao: Registro curto de uma decisão de arquitetura, com o contexto, a decisão, as alternativas e as consequências. A ADR-005, em `docs/architecture/adrs/`, registra a tática de asserções assíncronas do repositório.
      referencia:
        rotulo: Architectural Decision Records (adr.github.io)
        url: https://adr.github.io/
    - termo: Polly
      definicao: Biblioteca .NET de resiliência, com novas tentativas e tempos limite configuráveis. A ADR-005 a cita entre as alternativas consideradas para as asserções assíncronas.
    - termo: xUnit e fixture
      definicao: O xUnit é o framework de testes para .NET usado nos cenários. A fixture é a classe que o xUnit cria antes dos testes para preparar recursos compartilhados, e a do cenário 08 cria a tabela, implanta a função e prepara a fila.
      referencia:
        rotulo: Sharing Context between Tests (documentação do xUnit)
        url: https://xunit.net/docs/shared-context
    - termo: Handler
      definicao: Função de entrada que o Lambda chama a cada invocação, com o evento como parâmetro. No cenário 08, é a `lambda_handler` de `src/lambdas/sqs_consumer/handler.py`.
    - termo: Idempotência e entrega pelo menos uma vez
      definicao: O SQS padrão entrega cada mensagem pelo menos uma vez, e a mesma mensagem pode chegar duas vezes. Uma gravação idempotente produz o mesmo resultado quando repetida, e por isso a função usa o `messageId` como chave do item.
      referencia:
        rotulo: Filas padrão do Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html
    - termo: '`ReportBatchItemFailures`'
      definicao: Opção do mapeamento de origem de eventos do SQS em que a função devolve a lista das mensagens do lote que falharam. Só essas voltam à fila, e as demais são apagadas.
      referencia:
        rotulo: Tratamento de erros para uma origem de eventos do SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/services-sqs-errorhandling.html
    - termo: LocalStack Pro
      definicao: Edição paga do LocalStack, com serviços e recursos que a edição gratuita, a Community, não oferece. A regra que ignora os testes no macOS não consulta a edição do LocalStack.
    - termo: Esteira de CI (integração contínua)
      definicao: Processo automatizado que compila e testa o código a cada envio ao repositório remoto. O README do `aspire-aws` indica Linux ou CI para os cenários com Lambda.
      referencia:
        rotulo: Noções básicas sobre GitHub Actions (documentação do GitHub)
        url: https://docs.github.com/pt/actions/about-github-actions/understanding-github-actions
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Explicar como um evento chega a uma Lambda em cada um dos quatro gatilhos.
    - Escrever um teste que espera um efeito assíncrono com tempo limite.
    - Explicar o que acontece com uma mensagem do SQS quando a Lambda falha.
    - Configurar uma fila de mensagens mortas com `RedrivePolicy` e `maxReceiveCount`.
    - Rodar testes com Lambda do LocalStack num contêiner Linux.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, do Git e de um Docker em execução que exponha `/var/run/docker.sock`. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. Os testes com Lambda são ignorados no macOS com Apple Silicon, e o laboratório os roda num contêiner Linux. Esse caminho foi verificado com o Colima, e no Linux ou no WSL os comandos `dotnet test` podem rodar direto, sem o contêiner.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba explica como cada gatilho entrega o evento à Lambda e como o teste confirma um efeito que acontece depois. A ADR-005 do repositório registra o uso de um laço de consulta com tempo limite para as asserções assíncronas.
  - tipo: comparativo
    colunas:
    - Como o evento chega
    - Se a Lambda falha
    linhas:
    - dimensao: S3, cenário 07
      valores:
      - O S3 invoca a função a cada objeto criado
      - Até duas novas tentativas, e depois o evento se perde sem destino configurado
    - dimensao: SQS, cenário 08
      valores:
      - Um mapeamento de origem lê a fila e entrega lotes
      - A mensagem volta para a fila depois da visibilidade e é lida de novo
    - dimensao: DynamoDB, cenário 11
      valores:
      - Um mapeamento lê o stream de alterações da tabela
      - O lote é repetido até expirar ou dar certo, e bloqueia o fragmento
    - dimensao: EventBridge, cenário 14
      valores:
      - Uma regra compara o evento e invoca a função
      - Novas tentativas por até 24 horas, sem destino configurado
  - tipo: conceito
    titulo: Asserção assíncrona
    texto: O teste não sabe quando a Lambda termina. Ele consulta o efeito, como um item no DynamoDB, a cada intervalo, até encontrá-lo ou até o tempo limite, que precisa cobrir a inicialização a frio da função.
  - tipo: conceito
    titulo: Fila de mensagens mortas
    texto: A `RedrivePolicy` de uma fila aponta outra fila e um `maxReceiveCount`. Quando uma mensagem é recebida esse número de vezes sem ser apagada, o SQS a move para a fila de mensagens mortas, onde ela espera análise e não volta a acionar a função.
  - tipo: adr
    id: ADR-005
    titulo: Tática de asserções assíncronas
    status: proposed
    contexto: Os efeitos das Lambdas aparecem depois da chamada que os provocou, em tempo variável.
    decisao: '`PollingHelper` com `WaitUntilAsync`, que consulta uma condição a cada intervalo até um tempo limite, e `AssertNeverAsync`.'
    alternativas: Espera fixa com `Task.Delay`, novas tentativas com Polly e assinatura de eventos do LocalStack.
    consequencias: Testes que esperam só o necessário, com tempo limite que precisa ser ajustado por cenário.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os três arquivos que explicam o consumidor de fila do cenário 08: a função Python que lê a fila e grava no DynamoDB, a fixture que cria a fila e a liga à função, e a regra que ignora os testes com Lambda no macOS com Apple Silicon. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam por que uma mensagem inválida volta à fila sem limite.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: src/lambdas/sqs_consumer/handler.py
    commit: 50a5344
    linhas:
    - 'def lambda_handler(event, context):'
    - '    endpoint = os.environ.get("AWS_ENDPOINT_URL")'
    - '    dynamodb = boto3.resource("dynamodb", endpoint_url=endpoint)'
    - '    table = dynamodb.Table(os.environ["DYNAMODB_TABLE"])'
    - ''
    - '    for record in event.get("Records", []):'
    - '        body = json.loads(record["body"])'
    - '        table.put_item(Item={"id": record["messageId"], "body": json.dumps(body)})'
    - ''
    - '    return {"statusCode": 200}'
    anotacoes:
    - linha: 13
      texto: Uma mensagem que não é JSON gera exceção, e a invocação inteira falha.
    - linha: 14
      texto: O `messageId` como chave torna a gravação repetível sem duplicar.
    inicio: 7
    contexto: O `src/lambdas/sqs_consumer/handler.py` é a função Lambda em Python que o cenário 08 implanta no LocalStack para consumir a fila e gravar cada mensagem numa tabela do DynamoDB. O trecho abaixo é a função `lambda_handler` inteira, que interpreta o corpo de cada mensagem como JSON e grava o item com o `messageId` como chave, sem tratar a exceção de uma mensagem que não é JSON.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/08-SQS.Lambda.Consumer/Fixture.cs
    commit: 50a5344
    linhas:
    - '        QueueUrl = (await SQS.CreateQueueAsync("consumer-queue")).QueueUrl;'
    - '        QueueArn = (await SQS.GetQueueAttributesAsync(QueueUrl, ["QueueArn"])).Attributes["QueueArn"];'
    - ''
    - '        var mapping = await lambda.CreateEventSourceMappingAsync(new CreateEventSourceMappingRequest'
    - '        {'
    - '            FunctionName = FunctionName,'
    - '            EventSourceArn = QueueArn,'
    - '            BatchSize = 1,'
    - '            Enabled = true'
    - '        });'
    - ''
    - '        await PollingHelper.WaitUntilAsync(async () =>'
    - '        {'
    - '            var response = await lambda.GetEventSourceMappingAsync(new GetEventSourceMappingRequest'
    - '            {'
    - '                UUID = mapping.UUID'
    - '            });'
    - ''
    - '            return string.Equals(response.State, "Enabled", StringComparison.OrdinalIgnoreCase);'
    anotacoes:
    - linha: 50
      texto: 'A fila é criada sem atributos: sem `RedrivePolicy`.'
    - linha: 57
      texto: Uma mensagem por invocação.
    - linha: 68
      texto: A fixture espera o mapeamento ficar ativo.
    inicio: 50
    contexto: O `scenarios/08-SQS.Lambda.Consumer/Fixture.cs` é a fixture do cenário 08, que cria a tabela, implanta a função `sqs_consumer` e prepara a fila antes dos testes. O trecho abaixo cria a fila `consumer-queue` sem atributos, portanto sem fila de mensagens mortas, e liga a fila à função com um mapeamento de origem de eventos de uma mensagem por invocação.
  - tipo: editor
    rotulo: arquivo
    caminho: src/Shared/EnvironmentLimitations.cs
    commit: 50a5344
    linhas:
    - '    public static bool IsMacOsArm64LocalStackLambdaUnsupported =>'
    - '        OperatingSystem.IsMacOS() && RuntimeInformation.ProcessArchitecture == Architecture.Arm64;'
    anotacoes:
    - linha: 18
      texto: 'A regra vale para o processo de teste: no Linux, inclusive num contêiner num Mac, os testes rodam.'
    inicio: 17
    contexto: O `src/Shared/EnvironmentLimitations.cs` reúne as limitações de ambiente que os cenários usam para ignorar testes, com o motivo de cada uma. O trecho abaixo é a condição que identifica o macOS com processador ARM64, avaliada no processo de teste, e é ela que faz os testes com Lambda serem ignorados nesse sistema e rodarem no Linux.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, o caminho de uma mensagem inválida na fila do cenário 08, antes e depois da fila de mensagens mortas. Depois, classifique o que cada configuração faz com a mensagem.
  - tipo: fluxo
    titulo: A mensagem `isto não é JSON`
    etapas:
    - titulo: Entrega
      descricao: O mapeamento lê a mensagem, e ela fica invisível na fila por 30 s.
    - titulo: Falha
      descricao: O `json.loads` lança exceção, e a mensagem não é apagada.
    - titulo: Sem redirecionamento
      descricao: Depois da visibilidade, a mensagem volta e é entregue de novo, a cada 30 s, até o fim do período de retenção.
    - titulo: Com redirecionamento
      descricao: No segundo recebimento sem exclusão, o SQS move a mensagem para a `consumer-dlq`.
    - titulo: Análise
      descricao: A mensagem fica na fila de mensagens mortas sem acionar a função, à espera de correção ou descarte.
  - tipo: classificador
    enunciado: O que acontece com a mensagem inválida?
    categorias:
    - id: volta
      rotulo: Volta à fila indefinidamente
    - id: morta
      rotulo: Vai para a fila de mensagens mortas
    - id: some
      rotulo: É apagada
    itens:
    - texto: Fila sem `RedrivePolicy`
      categoria: volta
      explicacao: O passo 4 mostrou que ela não chegou à `consumer-dlq` em 120 s.
    - texto: Fila com `RedrivePolicy` e `maxReceiveCount` 2
      categoria: morta
      explicacao: O passo 6 mostrou a mudança.
    - texto: Função que captura a exceção e retorna sucesso
      categoria: some
      explicacao: O mapeamento apaga a mensagem quando a invocação dá certo, e o erro fica escondido.
    - texto: Fila de mensagens mortas criada, sem `RedrivePolicy` na fila de origem
      categoria: volta
      explicacao: A fila existe, mas nada aponta para ela.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é tirar da fila principal a mensagem que a função não consegue processar, que hoje volta e aciona a função até o fim do período de retenção, levando-a para uma fila de mensagens mortas e provando isso com teste. Os passos 1 a 3 preparam o contêiner Linux e rodam o cenário 08, os passos 4 e 5 escrevem o teste e criam a fila de mensagens mortas, e o passo 6 liga as duas filas com a `RedrivePolicy`. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: A fila `consumer-queue` do cenário 08 é criada sem `RedrivePolicy`, e a função `sqs_consumer` lança exceção para toda mensagem que não seja JSON. Uma mensagem desse tipo volta à fila depois de cada falha e aciona a função de novo até o fim do período de retenção.
    impacto: A mensagem envenenada consome invocações sem fim, ocupa a fila e esconde o problema, porque nenhum lugar guarda a mensagem para análise. No macOS com Apple Silicon, os testes com Lambda são ignorados, e o defeito não aparece na máquina de quem desenvolve.
    mecanismo: O laboratório roda os testes num contêiner Linux e escreve primeiro um teste que envia um texto que não é JSON e espera encontrá-lo na fila de mensagens mortas, com laço de consulta e tempo limite de 120 s, porque o efeito é assíncrono. Depois cria a `consumer-dlq` e liga as duas filas com `RedrivePolicy` e `maxReceiveCount` igual a 2.
    comprovacao: 'Com a fila de mensagens mortas criada e sem a política, o teste falha com `TimeoutException`. Com a `RedrivePolicy`, o cenário 08 mostra `Passed: 2`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: passos
    itens:
    - titulo: Ver os testes ignorados no macOS
      texto: Se você usa Linux ou WSL, pule para o passo 3 e rode os comandos `dotnet test` direto, sem `sincronizar` e sem `docker exec`.
      editor:
        rotulo: terminal
        linhas:
        - dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Ignorado|Aprovado!|Ignorado!' | sed -E 's/ \[[0-9.]+ m?s\]//'
      sucesso: '`Ignorado: 1` no macOS com Apple Silicon.'
    - titulo: Preparar o contêiner Linux
      texto: Crie o arquivo abaixo na raiz do repositório, construa a imagem, suba o contêiner e defina a função `sincronizar`.
      editor:
        rotulo: arquivo
        caminho: Dockerfile.linux (novo, na raiz do repositório)
        commit: 50a5344
        linhas:
        - FROM mcr.microsoft.com/dotnet/sdk:10.0
        - RUN apt-get update && apt-get install -y --no-install-recommends docker.io && rm -rf /var/lib/apt/lists/*
        - WORKDIR /repo
        - ''
        - '# no terminal:'
        - docker build -q -t aspire-aws-linux - < Dockerfile.linux
        - docker run -d --name aspire-linux --network host -v /var/run/docker.sock:/var/run/docker.sock aspire-aws-linux sleep infinity
        - sincronizar() { git ls-files -co --exclude-standard | COPYFILE_DISABLE=1 tar -cf - -T - | docker exec -i aspire-linux tar -x -C /repo 2>/dev/null; }
      sucesso: Um identificador `sha256:` da imagem e o identificador do contêiner.
    - titulo: Rodar o cenário 08 no Linux
      editor:
        rotulo: terminal
        linhas:
        - sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      sucesso: '`Passed: 1`.'
    - titulo: Escrever o teste da mensagem inválida
      texto: O teste envia um texto que não é JSON e espera encontrá-lo na fila de mensagens mortas em até 120 s.
      editor:
        rotulo: arquivo
        caminho: scenarios/08-SQS.Lambda.Consumer/MensagemInvalidaTests.cs (novo)
        commit: 50a5344
        linhas:
        - using Amazon.SQS.Model;
        - using Shared;
        - ''
        - namespace Scenarios.SQS.LambdaConsumer;
        - ''
        - 'public class MensagemInvalidaTests(Fixture fixture) : IClassFixture<Fixture>'
        - '{'
        - '    [SkipOnMacOsArm64LocalStackLambdaFact]'
        - '    public async Task MensagemQueALambdaNaoProcessa_VaiParaAFilaDeMensagensMortas()'
        - '    {'
        - '        await fixture.SQS.SendMessageAsync(fixture.QueueUrl, "isto não é JSON");'
        - ''
        - '        Message? morta = null;'
        - '        await PollingHelper.WaitUntilAsync(async () =>'
        - '        {'
        - '            var resposta = await fixture.SQS.ReceiveMessageAsync(new ReceiveMessageRequest'
        - '            {'
        - '                QueueUrl = fixture.DlqUrl,'
        - '                WaitTimeSeconds = 1'
        - '            });'
        - '            morta = resposta.Messages?.FirstOrDefault();'
        - '            return morta is not null;'
        - '        }, timeout: TimeSpan.FromSeconds(120),'
        - '        failureMessage: "A mensagem inválida não chegou à fila de mensagens mortas em 120 s.");'
        - ''
        - '        Assert.Equal("isto não é JSON", morta!.Body);'
        - '    }'
        - '}'
    - titulo: Criar a fila de mensagens mortas
      texto: Acrescente a propriedade e a criação da `consumer-dlq` na fixture e rode o teste.
      editor:
        rotulo: arquivo
        caminho: scenarios/08-SQS.Lambda.Consumer/Fixture.cs (alteração)
        commit: 50a5344
        linhas:
        - '// scenarios/08-SQS.Lambda.Consumer/Fixture.cs: abaixo da propriedade QueueUrl'
        - '    public string DlqUrl { get; private set; } = null!;'
        - ''
        - // no InitializeScenarioAsync, antes da linha que cria a consumer-queue
        - '        DlqUrl = (await SQS.CreateQueueAsync("consumer-dlq")).QueueUrl;'
        - ''
        - '// no terminal:'
        - sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      efeito: fila_morta_criada
      sucesso: '`Failed: 1` com `TimeoutException`, depois de cerca de 2 minutos: a fila existe, mas nada leva a mensagem até ela.'
    - titulo: Ligar a fila principal à de mensagens mortas
      texto: Troque a criação da `consumer-queue` pela versão com `RedrivePolicy`.
      editor:
        rotulo: arquivo
        caminho: scenarios/08-SQS.Lambda.Consumer/Fixture.cs (alteração)
        commit: 50a5344
        linhas:
        - '// scenarios/08-SQS.Lambda.Consumer/Fixture.cs: no lugar da linha que cria a consumer-queue'
        - // e com using Amazon.SQS.Model; no topo do arquivo
        - '        var dlqArn = (await SQS.GetQueueAttributesAsync(DlqUrl, ["QueueArn"])).Attributes["QueueArn"];'
        - '        // A visibilidade de 30 s acompanha o tempo limite de 30 s da função.'
        - '        QueueUrl = (await SQS.CreateQueueAsync(new CreateQueueRequest'
        - '        {'
        - '            QueueName = "consumer-queue",'
        - '            Attributes = new Dictionary<string, string>'
        - '            {'
        - '                ["VisibilityTimeout"] = "30",'
        - '                ["RedrivePolicy"] = $$"""{"deadLetterTargetArn":"{{dlqArn}}","maxReceiveCount":"2"}"""'
        - '            }'
        - '        })).QueueUrl;'
        - ''
        - '// no terminal:'
        - sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      efeito: redirecionamento
      sucesso: '`Passed: 2`, em cerca de um minuto e meio.'
  - tipo: terminal
    titulo: terminal · aspire-aws
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: docker build -q -t aspire-aws-linux - < Dockerfile.linux
      saida: sha256:a0faca54756aacaea5097cc0979f311171edd1d6c09d612dccf1af343c214321
      origem: executado
      dica: A imagem tem o .NET SDK 10 e o cliente do Docker. O identificador muda a cada construção.
    - entrada: docker run -d --name aspire-linux --network host -v /var/run/docker.sock:/var/run/docker.sock aspire-aws-linux sleep infinity
      saida: c010420897a4…
      origem: executado
      dica: O contêiner fica parado em `sleep infinity`, usa a rede da máquina e o Docker dela pelo socket. O identificador muda a cada execução.
    - entrada: sincronizar() { git ls-files -co --exclude-standard | COPYFILE_DISABLE=1 tar -cf - -T - | docker exec -i aspire-linux tar -x -C /repo 2>/dev/null; }
      saida: ''
      origem: executado
      dica: A função copia para `/repo` no contêiner os arquivos do repositório, inclusive os novos. O `COPYFILE_DISABLE=1` evita os arquivos `._*` do macOS.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      condicao:
      - fila_morta_criada
      - redirecionamento
      saida: 'Passed!  - Failed:     0, Passed:     2, Skipped:     0, Total:     2, Duration: 1 m 25 s - 08-SQS.Lambda.Consumer.dll (net10.0)'
      origem: executado
      dica: Depois de dois recebimentos com falha, o SQS moveu a mensagem para a `consumer-dlq`.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      condicao: fila_morta_criada
      saida: "  Failed Scenarios.SQS.LambdaConsumer.MensagemInvalidaTests.MensagemQueALambdaNaoProcessa_VaiParaAFilaDeMensagensMortas\n   System.TimeoutException : A mensagem inválida não chegou à fila de mensagens mortas em 120 s.\nFailed!  - Failed:     1, Passed:     1, Skipped:     0, Total:     2, Duration: 2 m 21 s - 08-SQS.Lambda.Consumer.dll (net10.0)"
      origem: executado
      dica: A Lambda falhou em cada recebimento da mensagem inválida, e sem política de redirecionamento ela nunca foi para a fila de mensagens mortas.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      saida: 'Passed!  - Failed:     0, Passed:     1, Skipped:     0, Total:     1, Duration: 1 s - 08-SQS.Lambda.Consumer.dll (net10.0)'
      origem: executado

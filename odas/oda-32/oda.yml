- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria com funções acionadas por eventos, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Mensagem que nunca sai da fila
    origem: executado
    rotulo_saida: log
    saida: "$ sincronizar && docker exec aspire-linux dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Failed |A mensagem inválida|Passed!|Failed!' | sed -E 's/ \\[[0-9 ms.]+\\]//'\n  Failed Scenarios.SQS.LambdaConsumer.MensagemInvalidaTests.MensagemQueALambdaNaoProcessa_VaiParaAFilaDeMensagensMortas\n   System.TimeoutException : A mensagem inválida não chegou à fila de mensagens mortas em 120 s.\nFailed!  - Failed:     1, Passed:     1, Skipped:     0, Total:     2, Duration: 2 m 21 s - 08-SQS.Lambda.Consumer.dll (net10.0)"
    pergunta: A fila de mensagens mortas existe, e a mensagem inválida não chegou a ela. Por quê?
    correcao: Configurar a `RedrivePolicy` na fila de origem, com o ARN da fila de mensagens mortas e um `maxReceiveCount`.
    alternativas:
    - texto: O teste esperou pouco.
      correta: false
      explicacao: Com a política, a mesma espera bastou.
    - texto: A fila de origem não tem `RedrivePolicy`, e o SQS não sabe para onde mover a mensagem.
      correta: true
      explicacao: A mensagem continua voltando à `consumer-queue` e acionando a função.
    - texto: A Lambda apagou a mensagem.
      correta: false
      explicacao: A função falhou, e o mapeamento só apaga depois de sucesso.
  - tipo: incidente
    titulo: Testes de Lambda ignorados no Mac
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet test scenarios/08-SQS.Lambda.Consumer 2>&1 | grep -E '^  Ignorado|Aprovado!|Ignorado!' | sed -E 's/ \\[[0-9.]+ m?s\\]//'\n  Ignorado Scenarios.SQS.LambdaConsumer.SqsLambdaConsumerTests.SendMessage_ShouldTriggerLambda_AndPersistToDynamoDb\nIgnorado!  – Com falha:     0, Aprovado:     0, Ignorado:     1, Total:     1, Duração: 1 ms - 08-SQS.Lambda.Consumer.dll (net10.0)"
    pergunta: No Mac com Apple Silicon, o cenário 08 não executa nada. O que fazer para rodá-lo?
    correcao: Rodar os testes num processo Linux, como o contêiner do passo 2, ou num computador Linux, no WSL ou no CI.
    alternativas:
    - texto: Instalar o LocalStack Pro.
      correta: false
      explicacao: A regra não consulta a edição do LocalStack.
    - texto: Apagar o atributo do teste.
      correta: false
      explicacao: O teste rodaria no ambiente que o repositório considera instável.
    - texto: A regra do repositório ignora os testes quando o processo de teste roda no macOS ARM64, e um processo Linux não cai na regra.
      correta: true
      explicacao: No contêiner, o mesmo teste passou.
  - tipo: incidente
    titulo: Erro escondido por um try
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/lambdas/sqs_consumer/handler.py:12-14

      for record in event.get("Records", []):

      body = json.loads(record["body"])

      table.put_item(Item={"id": record["messageId"], "body": json.dumps(body)})'
    pergunta: Um colega sugere envolver o `json.loads` num `try` que ignora o erro, para a fila não travar. Qual é a consequência?
    correcao: Deixar a exceção sair e configurar a fila de mensagens mortas, ou, com lotes maiores, devolver as falhas por item com `ReportBatchItemFailures`.
    alternativas:
    - texto: A invocação dá certo, o mapeamento apaga a mensagem, e o pedido se perde sem registro.
      correta: true
      explicacao: A fila de mensagens mortas guarda a mensagem para análise.
    - texto: A mensagem vai para a fila de mensagens mortas.
      correta: false
      explicacao: Só mensagens não apagadas são movidas.
    - texto: A Lambda tenta de novo sozinha.
      correta: false
      explicacao: Quem repete é o SQS, e só se a invocação falhar.
  - tipo: incidente
    titulo: Visibilidade menor que o tempo da função
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/Shared/LambdaDeployer.cs:40

      Timeout = 30,'
    pergunta: Para a mensagem inválida chegar mais cedo à fila de mensagens mortas, alguém propõe visibilidade de 5 s na `consumer-queue`. Por que o passo 6 usa 30 s?
    correcao: Manter a visibilidade da fila pelo menos igual ao tempo limite da função, que o `LambdaDeployer` define em 30 s, ou reduzir os dois juntos.
    alternativas:
    - texto: O `maxReceiveCount` exige 30 s.
      correta: false
      explicacao: O `maxReceiveCount` conta recebimentos, não tempo.
    - texto: Com visibilidade menor que o tempo da função, a mensagem volta à fila enquanto ainda está sendo processada, e a AWS recusa o mapeamento nessa configuração.
      correta: true
      explicacao: A visibilidade precisa cobrir a execução inteira da função.
    - texto: O SQS não aceita visibilidade abaixo de 30 s.
      correta: false
      explicacao: O mínimo do SQS é 0 s.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Como um teste confirma um efeito assíncrono da Lambda?
      alternativas:
      - texto: Lendo o retorno da chamada que enviou o evento.
        correta: false
        explicacao: O envio termina antes de a função rodar.
      - texto: Com uma espera fixa longa.
        correta: false
        explicacao: Fica lenta quando sobra tempo e falha quando falta.
      - texto: Consultando o efeito a cada intervalo até encontrá-lo ou até um tempo limite.
        correta: true
        explicacao: É o papel do `PollingHelper.WaitUntilAsync`.
    - enunciado: O que acontece com uma mensagem do SQS quando a Lambda falha?
      alternativas:
      - texto: Não é apagada e volta a ficar visível depois do tempo de visibilidade.
        correta: true
        explicacao: E é entregue de novo.
      - texto: É apagada.
        correta: false
        explicacao: Só a invocação bem-sucedida apaga a mensagem.
      - texto: Vai direto para a fila de mensagens mortas.
        correta: false
        explicacao: Só depois de `maxReceiveCount` recebimentos e com a política configurada.
    - enunciado: Onde fica a `RedrivePolicy`?
      alternativas:
      - texto: Na Lambda.
        correta: false
        explicacao: A função tem destinos próprios para invocações assíncronas, não para o SQS.
      - texto: Na fila de origem, apontando para a fila de mensagens mortas.
        correta: true
        explicacao: A fila de mensagens mortas é uma fila comum.
      - texto: Na fila de mensagens mortas.
        correta: false
        explicacao: Ela não sabe de onde vêm as mensagens.
    - enunciado: Por que a gravação usa o `messageId` como chave?
      alternativas:
      - texto: Para ordenar os itens.
        correta: false
        explicacao: A chave de partição não define ordem.
      - texto: Porque o corpo não pode ser chave.
        correta: false
        explicacao: O motivo é a idempotência.
      - texto: Para que a mesma mensagem entregue duas vezes não crie dois itens.
        correta: true
        explicacao: O SQS entrega pelo menos uma vez.
    - enunciado: Por que os testes com Lambda rodam no contêiner Linux num Mac?
      alternativas:
      - texto: Porque a regra que os ignora olha o sistema do processo de teste, e no contêiner o processo é Linux.
        correta: true
        explicacao: O LocalStack e as funções continuam no mesmo Docker.
      - texto: Porque o contêiner tem o LocalStack Pro.
        correta: false
        explicacao: A imagem tem só o SDK e o cliente do Docker.
      - texto: Porque o Mac não roda Docker.
        correta: false
        explicacao: O Docker roda, e é ele que o contêiner usa.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os cenários com Lambda rodaram no contêiner Linux.
    - A mensagem inválida não chegou à fila de mensagens mortas sem a `RedrivePolicy`.
    - Com a política, a mensagem foi movida depois de dois recebimentos.
    - O comportamento de falha de cada gatilho está claro.
    - O motivo do tempo limite nas asserções assíncronas está claro.

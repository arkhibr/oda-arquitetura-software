id: '33'
titulo: Pipelines com vários serviços
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é localizar o ponto em que uma mensagem parou num pipeline com vários serviços, porque nenhum deles avisa quem enviou, e corrigir o defeito do cenário 12, em que arquivos copiados para o bucket nunca são processados. No repositório `aspire-aws`, o cenário 12 liga um bucket do Amazon S3 (Simple Storage Service) a uma fila do Amazon SQS (Simple Queue Service), a fila a uma função do AWS Lambda e a função ao Amazon DynamoDB, e o cenário 13 faz o mesmo partindo do Amazon SNS (Simple Notification Service). Você vai escrever um teste que confere o primeiro e o último salto, eliminar os saltos que funcionam e corrigir o filtro da notificação do bucket.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: Pipeline de mensagens
      definicao: Sequência de serviços em que a saída de um é a entrada do seguinte, como um bucket que avisa uma fila, uma fila lida por uma função e uma função que grava numa tabela. Cada ligação entre dois serviços é um salto.
    - termo: Salto
      definicao: Passagem da mensagem de um serviço para o seguinte no pipeline. Conferir o primeiro e o último salto num teste indica em que trecho a mensagem parou.
    - termo: Amazon S3 (Simple Storage Service) e bucket
      definicao: O S3 é o serviço de armazenamento de objetos da AWS, e o bucket é o recipiente que guarda os objetos, cada um identificado por uma chave. No cenário 12, o bucket `pipeline-uploads` é a entrada do pipeline.
      referencia:
        rotulo: O que é o Amazon S3? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/Welcome.html
    - termo: Amazon SQS (Simple Queue Service)
      definicao: Serviço de filas da AWS. A fila guarda cada mensagem até que um consumidor a receba e a apague, e nos dois pipelines a fila fica entre a entrada e a função.
      referencia:
        rotulo: O que é o Amazon SQS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
    - termo: AWS Lambda
      definicao: Serviço da AWS que executa uma função quando um evento chega, sem servidor administrado por quem escreve a função. As funções dos dois pipelines são escritas em Python e leem as mensagens da fila.
      referencia:
        rotulo: O que é o AWS Lambda? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/welcome.html
    - termo: Amazon DynamoDB
      definicao: Banco NoSQL gerenciado da AWS que guarda itens em tabelas e os localiza pela chave. É a saída do pipeline 12, onde o teste procura o item com o corpo da mensagem.
      referencia:
        rotulo: O que é o Amazon DynamoDB? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Introduction.html
    - termo: Amazon SNS (Simple Notification Service)
      definicao: Serviço de tópicos da AWS, que copia cada mensagem publicada para todas as assinaturas do tópico. O pipeline 13 começa com uma publicação num tópico assinado por uma fila.
      referencia:
        rotulo: O que é o Amazon SNS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/sns/latest/dg/welcome.html
    - termo: Cenário
      definicao: No repositório `aspire-aws`, cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit que exercita uma integração com serviços da AWS. Esta ODA usa o cenário 12, `12-Pipeline.S3.SQS.Lambda.DynamoDB`, e o cenário 13, `13-Pipeline.SNS.SQS.Lambda.S3`.
    - termo: Notificação de evento do S3
      definicao: Configuração do bucket que envia um aviso a um destino, como uma fila, quando acontece um tipo de evento, por exemplo a criação de um objeto. A fixture do cenário 12 configura a notificação filtrada pelo tipo `ObjectCreatedPut`.
      referencia:
        rotulo: Tipos e destinos de notificações de evento (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html
    - termo: Tipos de evento de criação de objeto
      definicao: O S3 distingue a criação de objeto por `s3:ObjectCreated:Put`, `Post`, `Copy` e `CompleteMultipartUpload`, e `s3:ObjectCreated:*` inclui todos. No SDK .NET, os filtros correspondentes são `EventType.ObjectCreatedPut` e `EventType.ObjectCreatedAll`.
    - termo: '`PutObject`, `CopyObject` e `GetObjectMetadata`'
      definicao: Operações do S3. O `PutObject` envia um arquivo, o `CopyObject` copia um objeto de outro bucket ou chave, e o `GetObjectMetadata` consulta os dados de um objeto sem baixá-lo, que o teste usa para conferir o primeiro salto.
    - termo: Upload multiparte
      definicao: Envio de um arquivo grande em partes, concluído com `CompleteMultipartUpload`. O S3 gera um único evento de criação ao completar o envio, do tipo `s3:ObjectCreated:CompleteMultipartUpload`.
      referencia:
        rotulo: Upload fracionado no Amazon S3 (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonS3/latest/userguide/mpuoverview.html
    - termo: Política de acesso da fila
      definicao: Documento JSON gravado na fila que diz quais serviços podem enviar mensagens a ela. Na AWS, o S3 e o SNS só gravam na fila se a política autorizar `sqs:SendMessage`, e o LocalStack Community não aplica essa regra.
      referencia:
        rotulo: Políticas baseadas em identidade e em recurso (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/access_policies_identity-vs-resource.html
    - termo: ARN (Amazon Resource Name)
      definicao: Identificador único de um recurso da AWS, no formato `arn:aws:serviço:região:conta:recurso`. A política da fila limita a permissão ao ARN do bucket do pipeline.
      referencia:
        rotulo: Nomes do recurso da Amazon (ARNs) (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/reference-arns.html
    - termo: Assinatura
      definicao: Registro que liga um tópico do SNS a um destino, como uma fila. No pipeline 13, a fila assina o tópico e recebe uma cópia de cada publicação.
    - termo: LocalStack e LocalStack Community
      definicao: O LocalStack é um emulador dos serviços da AWS que roda num contêiner Docker e responde na porta 4566. O repositório usa a edição gratuita, a Community, que não aplica as políticas de acesso das filas.
      referencia:
        rotulo: Documentação do LocalStack
        url: https://docs.localstack.cloud/overview/
    - termo: Docker, imagem e contêiner
      definicao: O Docker executa programas em contêineres, processos isolados criados a partir de uma imagem, que reúne o sistema e as dependências. O laboratório constrói uma imagem com o .NET SDK 10 e o cliente do Docker e roda os testes num contêiner criado a partir dela com `docker exec`.
      referencia:
        rotulo: What is Docker? (documentação do Docker)
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: Socket do Docker (`/var/run/docker.sock`)
      definicao: Arquivo pelo qual programas conversam com o daemon do Docker, o serviço que cria e para os contêineres. O LocalStack usa esse arquivo para criar os contêineres das funções Lambda.
    - termo: Apple Silicon e teste ignorado
      definicao: Apple Silicon é a família de processadores ARM64 dos Macs recentes. O repositório ignora os testes com Lambda quando o processo de teste roda no macOS com ARM64, e por isso o laboratório os roda num contêiner Linux.
    - termo: Colima
      definicao: Ferramenta que roda o Docker no macOS dentro de uma máquina virtual Linux. O caminho do laboratório com o contêiner Linux foi verificado com o Colima.
    - termo: WSL (Windows Subsystem for Linux)
      definicao: Recurso do Windows que roda um ambiente Linux dentro do sistema. No WSL, os comandos `dotnet test` rodam direto, sem o contêiner do laboratório.
      referencia:
        rotulo: O que é o Subsistema do Windows para Linux (Microsoft Learn)
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: xUnit e fixture
      definicao: O xUnit é o framework de testes para .NET usado nos cenários. A fixture é a classe que o xUnit cria antes dos testes para preparar recursos compartilhados, e a do cenário 12 monta o pipeline do bucket até a tabela.
      referencia:
        rotulo: Sharing Context between Tests (documentação do xUnit)
        url: https://xunit.net/docs/shared-context
    - termo: Mapeamento de origem de eventos
      definicao: Recurso do Lambda que lê uma fila e invoca a função com as mensagens. A fixture do cenário 12 liga a fila à função `sqs_consumer` por um mapeamento desse tipo.
      referencia:
        rotulo: Usar o Lambda com o Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/with-sqs.html
    - termo: Envelope do SNS e entrega bruta
      definicao: Quando o SNS entrega a uma fila, a mensagem original chega dentro de um JSON do SNS, no campo `Message`, e a função do pipeline 13 extrai esse campo. Com a entrega bruta ligada na assinatura, a fila recebe a mensagem original sem o envelope.
      referencia:
        rotulo: Entrega de mensagens brutas do Amazon SNS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/sns/latest/dg/sns-large-payload-raw-message-delivery.html
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Desenhar os saltos de uma mensagem nos pipelines 12 e 13.
    - Escrever um teste que confere o primeiro e o último salto.
    - Localizar o salto que falhou eliminando os que funcionaram.
    - Explicar os tipos de evento de criação de objeto do S3.
    - Explicar a permissão que a fila precisa dar ao S3.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, do Git e de um Docker em execução que exponha `/var/run/docker.sock`. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. Os testes com Lambda são ignorados no macOS com Apple Silicon, e o laboratório os roda num contêiner Linux, caminho verificado com o Colima. No Linux ou no WSL, rode os comandos `dotnet test` direto, sem `sincronizar` e sem `docker exec`.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba descreve os saltos dos dois pipelines e o que cada ligação exige para a mensagem passar. Num pipeline assíncrono, nenhum serviço avisa quem enviou que a mensagem parou no caminho.
  - tipo: comparativo
    colunas:
    - Pipeline 12
    - Pipeline 13
    linhas:
    - dimensao: Entrada
      valores:
      - Objeto criado no bucket `pipeline-uploads`
      - Mensagem publicada num tópico SNS
    - dimensao: Ligação até a fila
      valores:
      - Notificação do bucket, filtrada por tipo de evento
      - Assinatura do tópico pela fila
    - dimensao: Permissão na fila
      valores:
      - Política que permite ao S3 o `sqs:SendMessage`
      - Política que permite ao SNS o `sqs:SendMessage`
    - dimensao: Saída
      valores:
      - Item no DynamoDB com o corpo da mensagem
      - Objeto em `results/` no S3
  - tipo: conceito
    titulo: Localizar pelo salto
    texto: Um teste de pipeline que só olha a saída diz que algo falhou, mas não onde. Conferir o primeiro salto e o último divide o caminho, e cada conferência intermediária elimina um trecho até sobrar uma ligação.
  - tipo: conceito
    titulo: Eventos de criação do S3
    texto: O S3 distingue a criação por `Put`, `Post`, `Copy` e `CompleteMultipartUpload`. Uma notificação filtrada por `s3:ObjectCreated:Put` ignora arquivos copiados de outro bucket e arquivos grandes enviados em partes, e `s3:ObjectCreated:*` inclui todos.
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra onde ficam as ligações entre os serviços dos dois pipelines: a fixture do cenário 12, que liga o bucket à fila e a fila à Lambda, e a função Python do cenário 13, que recebe as mensagens vindas do SNS. Cada editor traz acima dele o papel do arquivo, e os marcadores numerados ao lado das linhas explicam qual evento entra no pipeline e como cada salto passa a mensagem adiante.'
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/Fixture.cs
    commit: 50a5344
    linhas:
    - '        await S3.PutBucketNotificationAsync(new PutBucketNotificationRequest'
    - '        {'
    - '            BucketName = BucketName,'
    - '            QueueConfigurations ='
    - '            ['
    - '                new QueueConfiguration'
    - '                {'
    - '                    Id = "pipeline-trigger",'
    - '                    Queue = queueArn,'
    - '                    Events = [EventType.ObjectCreatedPut]'
    - '                }'
    - '            ]'
    - '        });'
    - ''
    - '        var mapping = await lambda.CreateEventSourceMappingAsync(new CreateEventSourceMappingRequest'
    - '        {'
    - '            FunctionName = FunctionName,'
    - '            EventSourceArn = queueArn,'
    - '            BatchSize = 1,'
    - '            Enabled = true'
    anotacoes:
    - linha: 85
      texto: Liga o bucket à fila.
    - linha: 94
      texto: Só a criação por `PutObject` gera mensagem.
    - linha: 99
      texto: Liga a fila à Lambda `sqs_consumer`.
    inicio: 85
    contexto: O `scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/Fixture.cs` é a fixture do cenário 12, que monta no LocalStack o pipeline do bucket S3 até a tabela do DynamoDB antes dos testes. O trecho abaixo cria o bucket, configura a notificação que envia à fila apenas os eventos `ObjectCreatedPut` e liga a fila à função `sqs_consumer`, e é nessa notificação que um arquivo copiado deixa de entrar no pipeline.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/Fixture.cs
    commit: 50a5344
    linhas:
    - '                  "Statement": ['
    - '                    {'
    - '                      "Sid": "AllowS3ToQueue",'
    - '                      "Effect": "Allow",'
    - '                      "Principal": { "Service": "s3.amazonaws.com" },'
    - '                      "Action": "sqs:SendMessage",'
    - '                      "Resource": "{{queueArn}}",'
    - '                      "Condition": {'
    - '                        "ArnLike": { "aws:SourceArn": "arn:aws:s3:::{{BucketName}}" }'
    - '                      }'
    - '                    }'
    anotacoes:
    - linha: 70
      texto: Na AWS, sem esta permissão, o S3 não consegue enviar para a fila.
    inicio: 66
    contexto: Antes das ligações, a mesma fixture grava na fila uma política de acesso escrita em JSON. O trecho abaixo autoriza o serviço S3 a enviar mensagens para a fila somente quando a origem é o bucket do cenário, permissão exigida na AWS para que a notificação do bucket chegue à fila.
  - tipo: editor
    rotulo: arquivo
    caminho: src/lambdas/fanout_processor/handler.py
    commit: 50a5344
    linhas:
    - '    for record in event.get("Records", []):'
    - '        outer = json.loads(record["body"])'
    - '        message = outer.get("Message", record["body"])'
    - '        key = f"results/{record[''messageId'']}.json"'
    - '        s3.put_object(Bucket=bucket, Key=key, Body=message)'
    anotacoes:
    - linha: 14
      texto: A mensagem do SNS chega embrulhada num envelope JSON, e a função desembrulha.
    - linha: 15
      texto: Cada mensagem vira um objeto com o `messageId` no nome.
    inicio: 12
    contexto: O `src/lambdas/fanout_processor/handler.py` é a função Lambda em Python do cenário 13, que lê mensagens de uma fila assinante de um tópico SNS e grava cada uma como objeto num bucket S3. O trecho abaixo é o laço que abre o envelope JSON do SNS, extrai o campo `Message` e grava o objeto `results/<messageId>.json`, o último salto que o teste do pipeline 13 confere.
- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, a busca pelo ponto em que um arquivo copiado parou no pipeline 12. Depois, classifique o que cada observação elimina.
  - tipo: fluxo
    titulo: Onde parou o `invoice-002.pdf`
    etapas:
    - titulo: Saída vazia
      descricao: Nenhum item com `invoice-002.pdf` aparece no DynamoDB depois de 60 s.
    - titulo: Primeiro salto
      descricao: 'O `GetObjectMetadata` encontra o objeto no bucket: a cópia funcionou.'
    - titulo: Comparação
      descricao: O arquivo enviado com `PutObject` atravessou o pipeline, e por isso a fila, a Lambda e a tabela funcionam.
    - titulo: Ligação suspeita
      descricao: Sobra a notificação do bucket, a única etapa que trata a cópia de modo diferente do envio.
    - titulo: Causa
      descricao: O filtro `ObjectCreatedPut` não inclui o evento `s3:ObjectCreated:Copy`.
  - tipo: classificador
    enunciado: O que esta observação permite concluir?
    categorias:
    - id: antes
      rotulo: A falha está antes deste ponto
    - id: depois
      rotulo: A falha está depois deste ponto
    itens:
    - texto: O objeto copiado está no bucket
      categoria: depois
      explicacao: A cópia e o armazenamento funcionaram.
    - texto: Nenhum objeto apareceu no bucket
      categoria: antes
      explicacao: A cópia em si falhou.
    - texto: Um arquivo enviado com `PutObject` chega ao DynamoDB
      categoria: antes
      explicacao: Fila, Lambda e tabela funcionam, e a diferença está na entrada.
    - texto: A Lambda foi invocada com o evento da cópia
      categoria: depois
      explicacao: A notificação e a fila funcionaram.
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é fazer um arquivo copiado de outro bucket atravessar o pipeline 12, que hoje o ignora sem erro, com um teste que confere o primeiro e o último salto e por isso indica em que trecho a mensagem parou. Os passos 1 e 2 preparam o contêiner Linux e rodam o pipeline, o passo 3 escreve o teste e localiza a falha, e o passo 4 amplia o filtro da notificação do bucket. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: faixa
    estilo: objetivo
    problema: A notificação do bucket `pipeline-uploads`, no cenário 12, é filtrada por `EventType.ObjectCreatedPut`, e só os arquivos enviados com `PutObject` geram mensagem para a fila. Um arquivo copiado de outro bucket com `CopyObject` chega ao bucket e não entra no pipeline.
    impacto: Arquivos que um parceiro copia de outro bucket, e arquivos grandes enviados por upload multiparte, nunca são processados, e nenhum serviço registra erro. Um teste que olha só a saída informa que algo falhou, sem indicar em que salto.
    mecanismo: O laboratório escreve um teste que copia o arquivo para o bucket do pipeline, confere o primeiro salto com `GetObjectMetadata` e espera o item no DynamoDB, e compara o resultado com o arquivo enviado por `PutObject` para eliminar os saltos que funcionam. A correção amplia o filtro da notificação para `EventType.ObjectCreatedAll`.
    comprovacao: 'Antes da correção, o teste falha com a mensagem `O objeto está no bucket do pipeline, mas nenhum item chegou ao DynamoDB em 60 s.`, que localiza a falha entre o bucket e a tabela. Depois da correção, o cenário 12 mostra `Passed: 2`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: passos
    itens:
    - titulo: Preparar o contêiner Linux
      texto: Se você usa Linux ou WSL, pule este passo. Crie o arquivo abaixo na raiz do repositório, construa a imagem, suba o contêiner e defina a função `sincronizar`.
      editor:
        rotulo: arquivo
        caminho: Dockerfile.linux (novo, na raiz do repositório)
        commit: 50a5344
        linhas:
        - FROM mcr.microsoft.com/dotnet/sdk:10.0
        - RUN apt-get update && apt-get install -y --no-install-recommends docker.io && rm -rf /var/lib/apt/lists/*
        - WORKDIR /repo
        - ''
        - '# no terminal:'
        - docker build -q -t aspire-aws-linux - < Dockerfile.linux
        - docker run -d --name aspire-linux --network host -v /var/run/docker.sock:/var/run/docker.sock aspire-aws-linux sleep infinity
        - sincronizar() { git ls-files -co --exclude-standard | COPYFILE_DISABLE=1 tar -cf - -T - | docker exec -i aspire-linux tar -x -C /repo 2>/dev/null; }
      sucesso: Um identificador `sha256:` da imagem e o identificador do contêiner.
    - titulo: Rodar o pipeline 12
      editor:
        rotulo: terminal
        linhas:
        - sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      sucesso: '`Passed: 1`.'
    - titulo: Escrever o teste do arquivo copiado
      texto: O teste grava o arquivo num bucket de recepção, copia para o bucket do pipeline, confere o objeto e espera o item no DynamoDB.
      editor:
        rotulo: arquivo
        caminho: scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/ArquivoCopiadoTests.cs (novo)
        commit: 50a5344
        linhas:
        - using Amazon.DynamoDBv2.Model;
        - using Amazon.S3.Model;
        - using Shared;
        - ''
        - namespace Scenarios.Pipeline.S3SqsLambdaDynamoDb;
        - ''
        - 'public class ArquivoCopiadoTests(Fixture fixture) : IClassFixture<Fixture>'
        - '{'
        - '    [SkipOnMacOsArm64LocalStackLambdaFact]'
        - '    public async Task ArquivoCopiadoParaOBucket_TambemPassaPeloPipeline()'
        - '    {'
        - '        await fixture.S3.PutBucketAsync("recepcao");'
        - '        await fixture.S3.PutObjectAsync(new PutObjectRequest'
        - '        {'
        - '            BucketName = "recepcao",'
        - '            Key = "invoice-002.pdf",'
        - '            ContentBody = "invoice data"'
        - '        });'
        - ''
        - '        await fixture.S3.CopyObjectAsync("recepcao", "invoice-002.pdf", Fixture.BucketName, "invoice-002.pdf");'
        - ''
        - '        // Primeiro salto: o objeto chegou ao bucket do pipeline'
        - '        var objeto = await fixture.S3.GetObjectMetadataAsync(Fixture.BucketName, "invoice-002.pdf");'
        - '        Assert.Equal(12, objeto.ContentLength);'
        - ''
        - '        // Último salto: o item chegou ao DynamoDB'
        - '        await PollingHelper.WaitUntilAsync(async () =>'
        - '        {'
        - '            var scan = await fixture.DynamoDB.ScanAsync(new ScanRequest { TableName = Fixture.TableName });'
        - '            return scan.Items.Any(item => item["body"].S.Contains("invoice-002.pdf", StringComparison.Ordinal));'
        - '        }, timeout: TimeSpan.FromSeconds(60),'
        - '        failureMessage: "O objeto está no bucket do pipeline, mas nenhum item chegou ao DynamoDB em 60 s.");'
        - '    }'
        - '}'
        - ''
        - '// no terminal:'
        - sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      efeito: teste_copia
      sucesso: '`Failed: 1` com `O objeto está no bucket do pipeline, mas nenhum item chegou ao DynamoDB em 60 s.`'
    - titulo: Ampliar os eventos da notificação
      texto: No `Fixture.cs` do cenário 12, troque `Events = [EventType.ObjectCreatedPut]` por `Events = [EventType.ObjectCreatedAll]` e rode de novo.
      editor:
        rotulo: terminal
        linhas:
        - sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      efeito: eventos_amplos
      sucesso: '`Passed: 2`.'
  - tipo: terminal
    titulo: terminal · aspire-aws
    comandos:
    - entrada: git stash push -u -m "trabalho das ODAs anteriores"
      saida: 'Saved working directory and index state On (no branch): trabalho das ODAs anteriores'
      origem: executado
      dica: Sem alterações a guardar, a saída é `No local changes to save`.
    - entrada: docker build -q -t aspire-aws-linux - < Dockerfile.linux
      saida: sha256:a0faca54756a…
      origem: executado
      dica: A imagem tem o .NET SDK 10 e o cliente do Docker. O identificador muda a cada construção.
    - entrada: docker run -d --name aspire-linux --network host -v /var/run/docker.sock:/var/run/docker.sock aspire-aws-linux sleep infinity
      saida: c010420897a4…
      origem: executado
      dica: O identificador do contêiner muda a cada execução.
    - entrada: sincronizar() { git ls-files -co --exclude-standard | COPYFILE_DISABLE=1 tar -cf - -T - | docker exec -i aspire-linux tar -x -C /repo 2>/dev/null; }
      saida: ''
      origem: executado
      dica: A função copia os arquivos do repositório para `/repo` no contêiner.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      condicao:
      - teste_copia
      - eventos_amplos
      saida: 'Passed!  - Failed:     0, Passed:     2, Skipped:     0, Total:     2, Duration: 47 s - 12-Pipeline.S3.SQS.Lambda.DynamoDB.dll (net10.0)'
      origem: executado
      dica: O arquivo copiado também atravessou o pipeline.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      condicao: teste_copia
      saida: "  Failed Scenarios.Pipeline.S3SqsLambdaDynamoDb.ArquivoCopiadoTests.ArquivoCopiadoParaOBucket_TambemPassaPeloPipeline\n   System.TimeoutException : O objeto está no bucket do pipeline, mas nenhum item chegou ao DynamoDB em 60 s.\nFailed!  - Failed:     1, Passed:     1, Skipped:     0, Total:     2, Duration: 1 m 57 s - 12-Pipeline.S3.SQS.Lambda.DynamoDB.dll (net10.0)"
      origem: executado
      dica: O objeto copiado chegou ao bucket, o primeiro salto, e o item não chegou ao DynamoDB, o último. A falha está em algum ponto entre os dois.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
      saida: 'Passed!  - Failed:     0, Passed:     1, Skipped:     0, Total:     1, Duration: 1 m 2 s - 12-Pipeline.S3.SQS.Lambda.DynamoDB.dll (net10.0)'
      origem: executado
      dica: Um arquivo enviado com `PutObject` atravessa o S3, o SQS e a Lambda até o DynamoDB.
    - entrada: sincronizar && docker exec aspire-linux dotnet test scenarios/13-Pipeline.SNS.SQS.Lambda.S3 2>&1 | grep -E 'Passed!|Failed!'
      saida: 'Passed!  - Failed:     0, Passed:     1, Skipped:     0, Total:     1, Duration: 1 s - 13-Pipeline.SNS.SQS.Lambda.S3.dll (net10.0)'
      origem: executado
      dica: O pipeline 13 publica no SNS, que entrega a uma fila lida por uma Lambda que grava no S3.
    cenarios:
    - rotulo: Pipeline 12
      comando: sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \[[0-9 ms.]+\]//'
    - rotulo: Pipeline 13
      comando: sincronizar && docker exec aspire-linux dotnet test scenarios/13-Pipeline.SNS.SQS.Lambda.S3 2>&1 | grep -E 'Passed!|Failed!'
- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria nesses pipelines, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Arquivos de um parceiro que nunca são processados
    origem: executado
    rotulo_saida: log
    saida: "$ sincronizar && docker exec aspire-linux dotnet test scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB 2>&1 | grep -E '^  Failed |nenhum item chegou|Passed!|Failed!' | sed -E 's/ \\[[0-9 ms.]+\\]//'\n  Failed Scenarios.Pipeline.S3SqsLambdaDynamoDb.ArquivoCopiadoTests.ArquivoCopiadoParaOBucket_TambemPassaPeloPipeline\n   System.TimeoutException : O objeto está no bucket do pipeline, mas nenhum item chegou ao DynamoDB em 60 s.\nFailed!  - Failed:     1, Passed:     1, Skipped:     0, Total:     2, Duration: 1 m 57 s - 12-Pipeline.S3.SQS.Lambda.DynamoDB.dll (net10.0)"
    pergunta: Os arquivos enviados pelo sistema web são processados, e os que um parceiro copia de outro bucket não são. Por quê?
    correcao: Trocar o filtro da notificação por `EventType.ObjectCreatedAll`, como no passo 4.
    alternativas:
    - texto: O DynamoDB demora mais para arquivos copiados.
      correta: false
      explicacao: Depois da correção, o mesmo teste passou no mesmo tempo limite.
    - texto: A cópia gera o evento `s3:ObjectCreated:Copy`, e a notificação só envia `s3:ObjectCreated:Put` para a fila.
      correta: true
      explicacao: O objeto chegou ao bucket, e nada foi enviado à fila.
    - texto: A Lambda recusa arquivos copiados.
      correta: false
      explicacao: A função nem foi invocada para esse arquivo.
  - tipo: incidente
    titulo: Arquivo grande que não entra no pipeline
    origem: codigo
    rotulo_saida: arquivo
    saida: 'scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/Fixture.cs:94

      Events = [EventType.ObjectCreatedPut]'
    pergunta: O SDK envia arquivos acima de um tamanho em partes, com upload multiparte. O que acontece com eles nesse pipeline?
    correcao: Usar `EventType.ObjectCreatedAll`, que inclui `s3:ObjectCreated:CompleteMultipartUpload`.
    alternativas:
    - texto: Entram uma vez por parte.
      correta: false
      explicacao: O S3 gera um evento só, ao completar o envio.
    - texto: Entram normalmente.
      correta: false
      explicacao: O tipo de evento é diferente de `Put`.
    - texto: Não entram, porque o evento é `CompleteMultipartUpload`, fora do filtro `Put`.
      correta: true
      explicacao: É a mesma causa do arquivo copiado.
  - tipo: incidente
    titulo: Pipeline que funciona no LocalStack e falha na AWS
    origem: codigo
    rotulo_saida: arquivo
    saida: 'scenarios/12-Pipeline.S3.SQS.Lambda.DynamoDB/Fixture.cs:66-76

      "Statement": [

      {

      "Sid": "AllowS3ToQueue",

      "Effect": "Allow",

      "Principal": { "Service": "s3.amazonaws.com" },

      "Action": "sqs:SendMessage",

      "Resource": "{{queueArn}}",

      "Condition": {

      "ArnLike": { "aws:SourceArn": "arn:aws:s3:::{{BucketName}}" }

      }

      }'
    pergunta: Um colega apagou a política da fila porque o teste passava sem ela no LocalStack. O que acontece na AWS?
    correcao: Manter a política que permite ao `s3.amazonaws.com` o `sqs:SendMessage`, restrita ao ARN do bucket.
    alternativas:
    - texto: A configuração da notificação é recusada ou o S3 não consegue enviar à fila, porque a AWS exige a permissão.
      correta: true
      explicacao: O LocalStack Community não aplica políticas de acesso, e o teste não percebe a falta.
    - texto: Funciona igual, porque o bucket e a fila são da mesma conta.
      correta: false
      explicacao: Serviços diferentes precisam de permissão explícita.
    - texto: A Lambda passa a ler o bucket direto.
      correta: false
      explicacao: A ligação continua sendo pela fila.
  - tipo: incidente
    titulo: Objeto com o envelope do SNS
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/lambdas/fanout_processor/handler.py:13-14

      outer = json.loads(record["body"])

      message = outer.get("Message", record["body"])'
    pergunta: No pipeline 13, por que a função lê `outer.get("Message", ...)` antes de gravar o corpo?
    correcao: 'Nenhuma correção: a função já trata os dois formatos. Outra opção é ligar a entrega bruta na assinatura do SNS.'
    alternativas:
    - texto: A Lambda recebe a mensagem cifrada.
      correta: false
      explicacao: O envelope é JSON comum.
    - texto: O SNS entrega à fila um envelope JSON com a mensagem no campo `Message`, a menos que a entrega bruta esteja ligada.
      correta: true
      explicacao: O `get` com valor padrão aceita os dois formatos.
    - texto: O SQS acrescenta o campo `Message`.
      correta: false
      explicacao: Quem acrescenta o envelope é o SNS.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que conferir o primeiro salto no teste do pipeline?
      alternativas:
      - texto: Para o teste ficar mais rápido.
        correta: false
        explicacao: A conferência acrescenta uma chamada.
      - texto: Porque o S3 é lento.
        correta: false
        explicacao: O motivo é localizar a falha.
      - texto: Para que a falha diga em que trecho a mensagem parou.
        correta: true
        explicacao: Com o objeto no bucket, a busca fica entre o bucket e a tabela.
    - enunciado: Que evento o `CopyObject` gera no bucket de destino?
      alternativas:
      - texto: '`s3:ObjectCreated:Copy`.'
        correta: true
        explicacao: Fora do filtro `Put`.
      - texto: '`s3:ObjectCreated:Put`.'
        correta: false
        explicacao: O tipo é específico da cópia.
      - texto: Nenhum.
        correta: false
        explicacao: Com o filtro amplo, a cópia acionou o pipeline.
    - enunciado: O que o arquivo enviado com `PutObject` atravessando o pipeline prova?
      alternativas:
      - texto: Que a notificação aceita qualquer evento.
        correta: false
        explicacao: Ela só aceitava `Put`.
      - texto: Que a fila, a Lambda e a tabela funcionam, e a diferença está na entrada.
        correta: true
        explicacao: A comparação elimina os saltos comuns.
      - texto: Que o pipeline não tem defeito.
        correta: false
        explicacao: O arquivo copiado não atravessou.
    - enunciado: Por que a fila precisa de uma política para o S3?
      alternativas:
      - texto: Porque o LocalStack exige.
        correta: false
        explicacao: O LocalStack Community não aplica a política.
      - texto: Para cifrar as mensagens.
        correta: false
        explicacao: Cifra é configurada à parte.
      - texto: Porque o S3 é outro serviço e só envia à fila com permissão explícita.
        correta: true
        explicacao: A condição limita a permissão ao bucket do pipeline.
    - enunciado: O que muda com a entrega bruta numa assinatura SNS para SQS?
      alternativas:
      - texto: A fila recebe a mensagem original, sem o envelope JSON do SNS.
        correta: true
        explicacao: Sem ela, a mensagem fica no campo `Message`.
      - texto: A mensagem chega mais rápido.
        correta: false
        explicacao: Muda o formato, não a velocidade.
      - texto: A fila deixa de precisar de política.
        correta: false
        explicacao: A permissão continua necessária.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - Os pipelines 12 e 13 rodaram no contêiner Linux.
    - O arquivo copiado parou entre o bucket e a tabela.
    - A notificação foi identificada como o salto que falhou.
    - Com `ObjectCreatedAll`, o arquivo copiado atravessou o pipeline.
    - A diferença entre o LocalStack e a AWS nas políticas de acesso está clara.

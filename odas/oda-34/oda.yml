id: '34'
titulo: Orquestração com Step Functions e tarefas em ECS
abas:
- id: missao
  titulo: Missão
  blocos:
  - tipo: legenda
    texto: O objetivo desta ODA é comparar uma máquina de estados do AWS Step Functions com uma tarefa em contêiner no Amazon ECS (Elastic Container Service) e fazer um pedido repetido terminar como resposta de negócio, porque sem tratamento ele encerra a execução em falha e exige investigação. No repositório `aspire-aws`, o cenário 15 tem uma máquina de estados que chama uma Lambda e por isso fica com os testes ignorados no macOS ARM64, e o cenário 18 roda um worker em contêiner que consome uma fila. Você vai criar uma máquina de estados sem Lambda que registra pedidos no DynamoDB, testá-la no LocalStack e fazê-la reconhecer o pedido repetido com um `Catch`.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA e estão na ordem em que surgem pela primeira vez. Os conceitos mais extensos trazem um link para uma referência de portal mantido pelo autor da tecnologia ou por uma organização de referência, e a busca do topo da página, acionada pela tecla /, leva de volta a qualquer termo.
    itens:
    - termo: AWS Step Functions e máquina de estados
      definicao: O Step Functions é o serviço da AWS que executa fluxos de trabalho descritos como máquinas de estados, em que cada estado é uma etapa e as transições dizem qual etapa vem depois. O serviço guarda o estado de cada execução, que pode ser consultada etapa por etapa.
      referencia:
        rotulo: O que é o Step Functions? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/step-functions/latest/dg/welcome.html
    - termo: Amazon ECS (Elastic Container Service) e tarefa em contêiner
      definicao: O ECS é o serviço da AWS que executa contêineres, e uma tarefa é uma execução de um ou mais contêineres a partir de uma definição. No cenário 18, o worker de pedidos roda como contêiner Docker na sua máquina, porque a API de controle do ECS não existe no LocalStack Community.
      referencia:
        rotulo: O que é o Amazon ECS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AmazonECS/latest/developerguide/Welcome.html
    - termo: Erro previsto e estado de negócio
      definicao: 'Erro previsto é uma falha que faz parte das regras, como um pedido que já foi registrado. Transformá-lo num estado de negócio é terminar a execução com uma resposta clara, como `situacao: duplicado`, sem registrar uma falha para investigar.'
    - termo: Cenário
      definicao: No repositório `aspire-aws`, cada pasta numerada de `scenarios/` é um cenário, um projeto de testes xUnit que exercita uma integração com serviços da AWS. Esta ODA usa o cenário 15, `15-StepFunctions.Orchestration`, e o cenário 18, `18-ECS.RunTask`.
    - termo: AWS Lambda
      definicao: Serviço da AWS que executa uma função quando um evento chega, sem servidor administrado por quem escreve a função. A máquina de estados original do cenário 15 chama uma Lambda, e a do laboratório não usa nenhuma.
      referencia:
        rotulo: O que é o AWS Lambda? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/lambda/latest/dg/welcome.html
    - termo: Worker
      definicao: Programa que roda continuamente buscando trabalho numa fila e processando cada item. O worker do cenário 18, em `src/tasks/pedido_processor/handler.py`, lê pedidos de uma fila SQS e os grava no PostgreSQL.
    - termo: Amazon SQS (Simple Queue Service)
      definicao: Serviço de filas da AWS. O consumidor recebe as mensagens, até dez por chamada no worker do cenário 18, e apaga cada uma depois de processá-la.
      referencia:
        rotulo: O que é o Amazon SQS? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
    - termo: Amazon DynamoDB
      definicao: Banco NoSQL gerenciado da AWS que guarda itens em tabelas e os localiza pela chave. A máquina de estados do laboratório grava os pedidos na tabela `pedidos-sfn`.
      referencia:
        rotulo: O que é o Amazon DynamoDB? (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Introduction.html
    - termo: Amazon States Language (ASL)
      definicao: Linguagem em JSON que define uma máquina de estados do Step Functions, com os estados, as transições e o tratamento de erros. Esta ODA usa os estados `Task`, que executa um trabalho, `Pass`, que acrescenta dados à saída, e `Choice`, que escolhe o próximo estado por uma condição.
      referencia:
        rotulo: Amazon States Language (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/step-functions/latest/dg/concepts-amazon-states-language.html
    - termo: '`Catch`, `Retry`, `ErrorEquals` e `ResultPath`'
      definicao: Campos de tratamento de erro de um estado. O `Retry` repete o estado que falhou, e o `Catch` compara o nome do erro com a lista `ErrorEquals` e desvia a execução para outro estado, guardando o erro no caminho indicado por `ResultPath`.
      referencia:
        rotulo: Tratar erros em fluxos de trabalho do Step Functions (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/step-functions/latest/dg/concepts-error-handling.html
    - termo: Integração direta com serviços
      definicao: Estado `Task` que chama outro serviço da AWS sem código intermediário, identificado por um recurso como `arn:aws:states:::dynamodb:putItem`. A máquina do laboratório grava no DynamoDB dessa forma, sem Lambda.
      referencia:
        rotulo: Operações do DynamoDB com o Step Functions (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/step-functions/latest/dg/connect-ddb.html
    - termo: Notação `.$` e caminho `$`
      definicao: 'Na definição de um estado, um parâmetro com nome terminado em `.$` recebe o valor lido da entrada da execução pelo caminho indicado. Em `"S.$": "$.id"`, o valor do atributo vem do campo `id` da entrada.'
    - termo: Teste ignorado (`Skip`)
      definicao: Teste marcado para não rodar, com o motivo registrado. Os dois testes do cenário 15 são ignorados porque a máquina de estados original depende de Lambda, e a execução de Lambda no LocalStack não funciona de forma estável no macOS ARM64.
    - termo: LocalStack e LocalStack Community
      definicao: O LocalStack é um emulador dos serviços da AWS que roda num contêiner Docker e responde na porta 4566. O repositório usa a edição gratuita, a Community, que emula o Step Functions e o DynamoDB e não oferece a API de controle do ECS.
      referencia:
        rotulo: Documentação do LocalStack
        url: https://docs.localstack.cloud/overview/
    - termo: Docker, imagem e contêiner
      definicao: O Docker executa programas em contêineres, processos isolados criados a partir de uma imagem. A fixture do cenário 18 constrói a imagem `ecs-worker:latest` e inicia o worker com o Docker da máquina.
      referencia:
        rotulo: What is Docker? (documentação do Docker)
        url: https://docs.docker.com/get-started/docker-overview/
    - termo: WSL (Windows Subsystem for Linux)
      definicao: Recurso do Windows que roda um ambiente Linux dentro do sistema. No Windows, os comandos desta ODA devem rodar nele, porque usam a sintaxe do bash.
      referencia:
        rotulo: O que é o Subsistema do Windows para Linux (Microsoft Learn)
        url: https://learn.microsoft.com/pt-br/windows/wsl/about
    - termo: ADR (Architecture Decision Record)
      definicao: Registro curto de uma decisão de arquitetura, com o contexto, a decisão, as alternativas e as consequências. A ADR-003, em `docs/architecture/adrs/`, registra o uso do LocalStack Community e as limitações de Lambda e de Step Functions.
      referencia:
        rotulo: Architectural Decision Records (adr.github.io)
        url: https://adr.github.io/
    - termo: Tipo Standard
      definicao: Tipo de máquina de estados do Step Functions para fluxos longos, com execuções de até um ano e histórico guardado pelo serviço. É o tipo usado na comparação com a tarefa em contêiner.
    - termo: Escrita condicional com `attribute_not_exists(id)`
      definicao: Gravação que o DynamoDB só aplica se a condição for verdadeira, e `attribute_not_exists(id)` exige que ainda não exista item com aquele `id`. Quando o pedido já existe, a gravação é recusada com `ConditionalCheckFailedException`.
      referencia:
        rotulo: Expressões de condição do DynamoDB (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html
    - termo: '`SUCCEEDED` e `FAILED`'
      definicao: Situações finais de uma execução do Step Functions. Sem `Catch`, o erro de um estado encerra a execução em `FAILED`, e com o `Catch` do laboratório a execução do pedido repetido termina em `SUCCEEDED`.
    - termo: xUnit e fixture
      definicao: O xUnit é o framework de testes para .NET usado nos cenários. A fixture é a classe que o xUnit cria antes dos testes para preparar recursos compartilhados, e a do laboratório cria a tabela `pedidos-sfn` e os clientes do Step Functions e do DynamoDB.
      referencia:
        rotulo: Sharing Context between Tests (documentação do xUnit)
        url: https://xunit.net/docs/shared-context
    - termo: '`host.docker.internal`'
      definicao: Nome que um contêiner usa para alcançar a máquina hospedeira. O worker do cenário 18 chega ao LocalStack e ao PostgreSQL por esse nome.
    - termo: PostgreSQL
      definicao: Banco de dados relacional de código aberto. O AppHost declara um contêiner PostgreSQL, onde o worker do cenário 18 grava os pedidos.
    - termo: Fila de mensagens mortas e `maxReceiveCount`
      definicao: Fila que recebe as mensagens recebidas `maxReceiveCount` vezes sem serem apagadas, para análise. A fila de pedidos do cenário 18 não tem essa configuração, e uma mensagem malformada volta à fila indefinidamente.
      referencia:
        rotulo: Filas de mensagens não entregues no Amazon SQS (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
    - termo: '`WaitTimeSeconds`'
      definicao: Tempo que a chamada de recebimento do SQS espera por mensagens novas quando a fila está vazia. No worker do cenário 18, esse tempo é de 2 segundos.
    - termo: Papel do IAM
      definicao: Identidade da AWS com permissões, assumida por um serviço para agir em nome dele. Na AWS, a máquina de estados precisa de um papel com permissão para gravar no DynamoDB.
      referencia:
        rotulo: Perfis do IAM (documentação da AWS)
        url: https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/id_roles.html
    - termo: Modo duplo (`AWS_TARGET=aws`)
      definicao: Variável de ambiente que desvia os mesmos testes para a AWS real. Sem ela, o AppHost sobe o LocalStack, e os clientes do SDK da AWS apontam para a porta 4566.
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Descrever quando usar uma máquina de estados e quando usar uma tarefa em contêiner.
    - Ler uma definição em Amazon States Language, com `Task`, `Pass`, `Choice` e `Catch`.
    - Integrar o Step Functions direto ao DynamoDB, sem Lambda.
    - Transformar um erro previsto num estado de negócio com `Catch`.
    - Explicar por que os testes originais do cenário 15 ficam ignorados.
  - tipo: faixa
    estilo: dica
    titulo: 💡 Antes de começar
    texto: Você vai precisar do .NET SDK 10.0.103 ou superior, exigido pelo `global.json`, do Git e de um Docker em execução. O repositório é o `arkhibr/aspire-aws` no commit `50a5344`, e o bloco Como ter o código na sua máquina, logo abaixo, mostra como obtê-lo. O laboratório usa um terminal na raiz do repositório, com a sintaxe do bash ou do zsh, e no Windows deve rodar no WSL.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código que esta ODA analisa está no repositório público `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. Todas as abas se referem ao commit `50a5344`, e os passos abaixo baixam o repositório, fixam esse commit e preparam a compilação. A pasta criada no primeiro passo é a raiz do repositório, de onde partem os caminhos de arquivo e os comandos desta ODA.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: passos
    itens:
    - titulo: Clonar o repositório
      texto: Rode os comandos numa pasta de trabalho da sua escolha. O Git cria a pasta `aspire-aws` com o histórico completo do repositório, e o `cd` entra nela. Se você já tem o clone, basta entrar na pasta dele.
      editor:
        rotulo: terminal
        linhas:
        - git clone https://github.com/arkhibr/aspire-aws
        - cd aspire-aws
    - titulo: Fixar o commit `50a5344`
      texto: O Git avisa que o repositório ficou em `detached HEAD`, e isso é esperado, porque os caminhos, os números de linha e as saídas desta ODA correspondem a esse commit. Se o Git recusar a troca por causa de alterações locais, a faixa Antes de começar, na aba Laboratório, mostra como guardá-las com `git stash`.
      editor:
        rotulo: terminal
        linhas:
        - git checkout 50a5344
    - titulo: Compilar a solução
      texto: O comando baixa os pacotes NuGet e compila a solução `aspire-aws.sln`, com o AppHost e todos os cenários. A compilação mostra centenas de avisos e nenhum erro, e o Docker só passa a ser necessário quando os testes sobem o LocalStack.
      editor:
        rotulo: terminal
        linhas:
        - dotnet build
    - titulo: Abrir o repositório no editor
      texto: Abra a pasta do repositório no editor que preferir. Com o Visual Studio Code instalado, o comando abaixo abre a pasta atual, e a busca de arquivos, com Ctrl+P no Windows e no Linux ou Cmd+P no macOS, encontra cada arquivo pelo caminho que as abas mostram.
      editor:
        rotulo: terminal
        linhas:
        - code .
  - tipo: terminal
    titulo: terminal · verificação do ambiente
    comandos:
    - entrada: dotnet --version
      saida: 10.0.401
      origem: exemplo
      dica: A versão precisa ser 10.0.103 ou superior, como exige o `global.json`.
    - entrada: docker info --format '{{.ServerVersion}}'
      saida: 29.5.2
      origem: exemplo
      dica: Uma resposta com versão indica que o daemon do Docker está em execução.
    cenarios:
    - rotulo: Verificar o .NET
      comando: dotnet --version
    - rotulo: Verificar o Docker
      comando: docker info --format '{{.ServerVersion}}'
- id: conceito
  titulo: Conceito
  blocos:
  - tipo: legenda
    texto: Esta aba compara duas formas de executar um processo na AWS, a máquina de estados do AWS Step Functions, fluxo de etapas guardado pelo serviço, e a tarefa em contêiner do Amazon ECS, programa que roda enquanto o contêiner estiver no ar. Os blocos de conceito explicam cada peça e os elementos da Amazon States Language, a linguagem JSON das máquinas de estados, antes da tabela comparativa.
  - tipo: conceito
    titulo: Máquina de estados e Step Functions
    texto: Uma máquina de estados descreve um processo como etapas, os estados, e transições que dizem qual etapa vem depois. O AWS Step Functions executa máquinas de estados e guarda o estado de cada execução, que pode ser consultada etapa por etapa e termina em `SUCCEEDED` ou `FAILED`. No tipo Standard, uma execução pode durar até um ano.
  - tipo: conceito
    titulo: Tarefa em contêiner e ECS
    texto: O Amazon ECS (Elastic Container Service) executa contêineres, processos isolados criados a partir de uma imagem, e uma tarefa é uma execução desses contêineres. No cenário 18, o worker de pedidos, programa que roda em laço buscando trabalho numa fila do Amazon SQS, roda como contêiner Docker na sua máquina, porque a API de controle do ECS não existe no LocalStack Community, a edição gratuita do emulador da AWS usado nos testes. O fluxo, os erros e as novas tentativas ficam no código do worker.
  - tipo: conceito
    titulo: Amazon States Language
    texto: A Amazon States Language (ASL) define a máquina de estados em JSON. O estado `Task` executa um trabalho, como chamar uma função do AWS Lambda ou outro serviço, o `Pass` acrescenta dados à saída e o `Choice` escolhe o próximo estado por uma condição. O `Retry` repete um estado que falhou, e o `Catch` desvia a execução para outro estado quando o erro está na lista `ErrorEquals`.
  - tipo: conceito
    titulo: Por que os testes do cenário 15 ficam ignorados
    texto: A máquina de estados original do cenário 15 tem um estado `Task` que chama uma Lambda, e o repositório ignora com `Skip` os testes que dependem de Lambda no macOS com processador ARM64, porque a invocação de Lambda no LocalStack 3.8 não é confiável nesse ambiente. A ADR-003 do repositório atribui o `Skip` do cenário 15 à falta de suporte ao Step Functions no LocalStack Community, e o laboratório desta ODA mostra uma máquina de estados sem Lambda respondendo no Community.
  - tipo: conceito
    titulo: Integração direta com serviços
    texto: 'Um estado `Task` pode chamar outro serviço da AWS sem código, pelo recurso arn:aws:states:::dynamodb:putItem, por exemplo. Os parâmetros da chamada saem da entrada da execução com a notação `.$`, como em `"S.$": "$.id"`.'
  - tipo: conceito
    titulo: Catch
    texto: Quando um estado falha, o `Catch` compara o nome do erro com a lista `ErrorEquals` e desvia a execução para outro estado, guardando o erro no caminho indicado por `ResultPath`. Sem `Catch`, a execução inteira termina em `FAILED`.
  - tipo: comparativo
    colunas:
    - Step Functions
    - Tarefa no ECS
    linhas:
    - dimensao: O que define o fluxo
      valores:
      - A definição JSON, com cada estado e transição
      - O código do contêiner
    - dimensao: Estado do processo
      valores:
      - Guardado pelo serviço, consultável por execução
      - Guardado pelo próprio código, num banco ou fila
    - dimensao: Erros e novas tentativas
      valores:
      - '`Retry` e `Catch` declarados por estado'
      - Escritos no código do worker
    - dimensao: Duração
      valores:
      - Até um ano por execução, no tipo Standard
      - Enquanto o contêiner estiver rodando
    - dimensao: No repositório
      valores:
      - Cenário 15
      - Cenário 18, com o worker de `src/tasks/pedido_processor`
- id: codigo
  titulo: No código
  blocos:
  - tipo: legenda
    texto: 'Esta aba mostra os arquivos das duas formas de executar um processo comparadas nesta ODA: a fixture do cenário 15, classe que define a máquina de estados antes dos testes, e, do cenário 18, a fixture que sobe o worker em contêiner e o programa Python desse worker, que consome uma fila. O bloco Termos usados nesta aba explica as palavras técnicas dos arquivos, e cada editor traz acima dele o papel do arquivo. Os marcadores numerados ao lado das linhas explicam como cada forma executa o passo e trata o erro.'
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A fixture é a classe que o xUnit, framework de testes do .NET, cria antes dos testes, e a do cenário 15 implanta uma função do AWS Lambda e registra a máquina de estados, cujo estado `Task` chama essa função e cujo estado `Choice` decide o próximo passo pelo resultado. A fixture do cenário 18 constrói a imagem Docker do worker, programa que lê pedidos de uma fila em laço, e o inicia como contêiner, que alcança o LocalStack e o PostgreSQL pelo nome `host.docker.internal`, o endereço da máquina hospedeira visto de dentro do contêiner. O `try` do Python envolve o código cujos erros o programa trata.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba pertencem ao repositório `aspire-aws`, que contém um catálogo de cenários de integração com serviços da AWS, emulados pelo LocalStack e orquestrados pelo .NET Aspire, cada um com testes xUnit. A barra de cada editor mostra o caminho do arquivo a partir da raiz do repositório e o commit `50a5344`, e os números à esquerda são as linhas do arquivo nesse commit. O botão Ver no GitHub de cada editor abre o mesmo trecho no navegador. Para ver os arquivos completos, abra o repositório pelo link abaixo ou siga o bloco Como ter o código na sua máquina, na aba Missão, e abra o arquivo pelo caminho indicado.
    links:
    - rotulo: aspire-aws no GitHub, commit 50a5344
      url: https://github.com/arkhibr/aspire-aws/tree/50a5344
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/15-StepFunctions.Orchestration/Fixture.cs
    commit: 50a5344
    linhas:
    - '        await new LambdaDeployer(lambda).DeployAsync(FunctionName, "stepfunctions_task");'
    - ''
    - '        var function = await lambda.GetFunctionAsync(new GetFunctionRequest'
    - '        {'
    - '            FunctionName = FunctionName'
    - '        });'
    - ''
    - '        var definition = $$"""'
    - '        {'
    - '          "Comment": "Example Step Functions workflow",'
    - '          "StartAt": "ProcessStep",'
    - '          "States": {'
    - '            "ProcessStep": {'
    - '              "Type": "Task",'
    - '              "Resource": "{{function.Configuration.FunctionArn}}",'
    - '              "Parameters": { "step": "process", "id.$": "$.id" },'
    - '              "ResultPath": "$.result",'
    - '              "Next": "CheckResult"'
    - '            },'
    - '            "CheckResult": {'
    - '              "Type": "Choice",'
    - '              "Choices": ['
    - '                {'
    - '                  "Variable": "$.result.processed",'
    - '                  "BooleanEquals": true,'
    - '                  "Next": "SuccessState"'
    - '                }'
    - '              ],'
    - '              "Default": "FailState"'
    - '            },'
    - '            "SuccessState": {'
    - '              "Type": "Succeed"'
    - '            },'
    - '            "FailState": {'
    - '              "Type": "Fail",'
    - '              "Error": "ProcessingFailed"'
    anotacoes:
    - linha: 47
      texto: A fixture implanta uma Lambda antes de criar a máquina de estados.
    - linha: 61
      texto: O estado `Task` chama essa Lambda, que precisa do Docker da máquina para rodar.
    - linha: 67
      texto: O `Choice` decide o próximo estado pelo resultado da Lambda.
    inicio: 47
    contexto: O `scenarios/15-StepFunctions.Orchestration/Fixture.cs` é a fixture do cenário 15, que cria a tabela, implanta a Lambda `stepfunctions_task` e registra a máquina de estados no LocalStack antes dos testes. O trecho abaixo implanta a Lambda e monta a definição da máquina de estados em JSON, com um estado `Task` que chama a Lambda e um `Choice` que decide entre sucesso e falha, e é essa dependência da Lambda que faz os testes do cenário serem ignorados no macOS com Apple Silicon.
  - tipo: editor
    rotulo: arquivo
    caminho: scenarios/18-ECS.RunTask/Fixture.cs
    commit: 50a5344
    linhas:
    - '        await RunDockerAsync("build", workerPath, "-t", "ecs-worker:latest");'
    - ''
    - '        // Inicia o container com nome único para evitar conflitos entre runs.'
    - '        // host.docker.internal resolve o host a partir do container. No Docker Desktop'
    - '        // (macOS/Windows) já existe nativamente; no Docker Engine puro (Linux/WSL2) não —'
    - '        // por isso o --add-host com host-gateway, que o define em ambos os ambientes.'
    - '        var containerName = $"ecs-worker-{Guid.NewGuid():N}";'
    - '        _workerContainerId = await RunDockerAsync('
    - '            "run", "-d",'
    - '            "--name", containerName,'
    - '            "--add-host", "host.docker.internal:host-gateway",'
    - '            "-e", "AWS_ENDPOINT_URL=http://host.docker.internal:4566",'
    anotacoes:
    - linha: 115
      texto: A fixture constrói a imagem do worker com o Docker da máquina.
    - linha: 125

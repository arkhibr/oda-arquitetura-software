- id: diagnostico
  titulo: Diagnóstico
  blocos:
  - tipo: legenda
    texto: 'Esta aba apresenta quatro situações que um time encontraria com essas duas formas de execução, cada uma com a saída ou o trecho que a evidencia. Para cada uma, escolha a causa entre as alternativas: a explicação e a correção aparecem depois da escolha.'
  - tipo: incidente
    titulo: Execução que falha num pedido repetido
    origem: executado
    rotulo_saida: log
    saida: "$ dotnet test scenarios/15-StepFunctions.Orchestration 2>&1 | grep -E '^  Com falha|segunda execução|Aprovado!|Com falha!|Ignorado!' | sed -E 's/ \\[[0-9.]+ m?s\\]//'\n  Com falha Scenarios.StepFunctions.Orchestration.RegistroDePedidoTests.MesmoPedidoDuasVezes_SegundaExecucaoTerminaComoDuplicado\n   segunda execução: FAILED DynamoDB.ConditionalCheckFailedException\nCom falha! – Com falha:     1, Aprovado:     0, Ignorado:     2, Total:     3, Duração: 53 s - 15-StepFunctions.Orchestration.dll (net10.0)"
    pergunta: O aplicativo reenviou um pedido, e o painel do Step Functions mostrou uma execução em `FAILED`. O que aconteceu?
    correcao: Acrescentar um `Catch` para `DynamoDB.ConditionalCheckFailedException` que leve a um estado de negócio, como no passo 5.
    alternativas:
    - texto: A máquina de estados tem uma definição inválida.
      correta: false
      explicacao: A criação da máquina valida a definição, e a primeira execução passou.
    - texto: A condição `attribute_not_exists(id)` recusou a gravação, e sem `Catch` o erro encerrou a execução.
      correta: true
      explicacao: O pedido já existia, o que é uma situação prevista, e não uma falha.
    - texto: O DynamoDB estava indisponível.
      correta: false
      explicacao: A primeira execução gravou o pedido na mesma tabela.
  - tipo: incidente
    titulo: Cenário com todos os testes ignorados
    origem: executado
    rotulo_saida: log
    saida: '$ dotnet test scenarios/15-StepFunctions.Orchestration 2>&1 | grep -E ''^  Com falha|segunda execução|Aprovado!|Com falha!|Ignorado!'' | sed -E ''s/ \[[0-9.]+ m?s\]//''

      Ignorado!  – Com falha:     0, Aprovado:     0, Ignorado:     2, Total:     2, Duração: 4 ms - 15-StepFunctions.Orchestration.dll (net10.0)


      scenarios/15-StepFunctions.Orchestration/Fixture.cs:61

      "Resource": "{{function.Configuration.FunctionArn}}",'
    pergunta: O laboratório mostrou o Step Functions funcionando no LocalStack Community. Por que os testes originais estão ignorados?
    correcao: Testar a orquestração com integrações diretas, como no laboratório, e deixar a Lambda para um ambiente que a execute, com `AWS_TARGET=aws` ou em Linux.
    alternativas:
    - texto: O Step Functions não existe no LocalStack Community.
      correta: false
      explicacao: O teste do laboratório executou duas máquinas.
    - texto: Os testes são lentos demais.
      correta: false
      explicacao: O motivo registrado é a falta de suporte.
    - texto: A máquina original chama uma Lambda, e a execução de Lambda no LocalStack depende do Docker da máquina e não funciona de forma estável no macOS ARM64.
      correta: true
      explicacao: A mensagem do `Skip` atribui o problema ao Step Functions, e o laboratório mostrou que o serviço responde.
  - tipo: incidente
    titulo: Mensagem malformada que trava o lote
    origem: codigo
    rotulo_saida: arquivo
    saida: "src/tasks/pedido_processor/handler.py:54-56 e 93-96\n            for msg in response.get(\"Messages\", []):\n                pedido = json.loads(msg[\"Body\"])\n                try:\n…\n        except Exception as e:\n            # Fila ainda não criada (fixture em inicialização) ou erro transitório\n            print(f\"[WORKER] Erro SQS (aguardando fila): {e}\")\n            time.sleep(2)"
    pergunta: Uma mensagem com JSON inválido chega à fila do worker do cenário 18. O que acontece com ela e com as outras do mesmo lote?
    correcao: Envolver a leitura de cada mensagem no `try` dela e configurar uma fila de mensagens mortas com `maxReceiveCount` na fila de pedidos.
    alternativas:
    - texto: O erro sai do laço das mensagens, o log registra `Erro SQS (aguardando fila)`, nenhuma mensagem restante do lote é apagada, e a malformada volta a cada leitura.
      correta: true
      explicacao: O `json.loads` fica fora do `try` interno, e a fila não tem redirecionamento para mensagens mortas.
    - texto: A mensagem é descartada e as outras seguem.
      correta: false
      explicacao: Nenhum `delete_message` roda para o lote.
    - texto: O worker para.
      correta: false
      explicacao: O `except` externo dorme 2 s e volta ao laço.
  - tipo: incidente
    titulo: Pedido repetido no worker
    origem: codigo
    rotulo_saida: arquivo
    saida: 'src/tasks/pedido_processor/handler.py:63-67

      """

      INSERT INTO pedidos (id, cliente, valor, status)

      VALUES (%s, %s, %s, %s)

      ON CONFLICT (id) DO NOTHING

      """,'
    pergunta: A mesma mensagem é entregue duas vezes ao worker. O que fica no banco?
    correcao: 'Nenhuma correção: o worker já é idempotente pela chave primária. Para avisar o cliente, seria preciso registrar a repetição.'
    alternativas:
    - texto: Um erro que derruba o worker.
      correta: false
      explicacao: O conflito é absorvido pelo `DO NOTHING`.
    - texto: Uma linha só, porque o `ON CONFLICT (id) DO NOTHING` ignora a segunda inserção sem erro.
      correta: true
      explicacao: É o mesmo papel que o `attribute_not_exists` cumpre na máquina de estados.
    - texto: Duas linhas com o mesmo `id`.
      correta: false
      explicacao: O `id` é chave primária.
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Quando uma máquina de estados é a melhor escolha?
      alternativas:
      - texto: Quando o processo exige horas de CPU.
        correta: false
        explicacao: Esse é o caso da tarefa em contêiner.
      - texto: Quando não há integração com outros serviços.
        correta: false
        explicacao: A integração é um dos pontos fortes do Step Functions.
      - texto: Quando o processo tem etapas, esperas e tratamento de erro que precisam ficar visíveis e guardados pelo serviço.
        correta: true
        explicacao: Cada execução pode ser consultada estado por estado.
    - enunciado: O que o recurso arn:aws:states:::dynamodb:putItem dispensa?
      alternativas:
      - texto: Uma Lambda só para gravar no DynamoDB.
        correta: true
        explicacao: O próprio Step Functions faz a chamada.
      - texto: A tabela.
        correta: false
        explicacao: A fixture cria a tabela antes.
      - texto: O papel IAM da máquina.
        correta: false
        explicacao: O papel continua obrigatório na AWS.
    - enunciado: O que o `Catch` faz com o erro do estado?
      alternativas:
      - texto: Apaga o erro sem registro.
        correta: false
        explicacao: O erro fica disponível na saída.
      - texto: Desvia para outro estado e guarda o erro no `ResultPath`.
        correta: true
        explicacao: No laboratório, o erro foi para `$.erro`.
      - texto: Repete o estado.
        correta: false
        explicacao: Repetir é papel do `Retry`.
    - enunciado: Por que tratar o pedido repetido como estado de negócio?
      alternativas:
      - texto: Para o DynamoDB aceitar a segunda gravação.
        correta: false
        explicacao: A gravação continua recusada.
      - texto: Para a execução ficar mais rápida.
        correta: false
        explicacao: O tempo não é o objetivo.
      - texto: Porque a repetição é prevista, e quem chamou recebe uma resposta clara em vez de uma falha para investigar.
        correta: true
        explicacao: 'A execução termina em `SUCCEEDED` com `situacao: duplicado`.'
    - enunciado: O que falta ao worker do cenário 18 para mensagens malformadas?
      alternativas:
      - texto: Tratar cada mensagem no próprio `try` e ter uma fila de mensagens mortas.
        correta: true
        explicacao: Sem isso, a mensagem volta indefinidamente e atrasa o lote.
      - texto: Ler uma mensagem por vez.
        correta: false
        explicacao: Reduz o impacto, mas a mensagem continua voltando.
      - texto: Aumentar o `WaitTimeSeconds`.
        correta: false
        explicacao: Afeta só a espera por mensagens novas.
  - tipo: resumo
  - tipo: checklist
    titulo: Checklist final
    itens:
    - O motivo dos testes ignorados do cenário 15 está claro.
    - A máquina sem Lambda gravou o pedido no DynamoDB do LocalStack.
    - A segunda execução falhou sem o `Catch` e terminou como duplicado com ele.
    - As diferenças entre máquina de estados e tarefa em contêiner estão claras.
    - Os pontos frágeis do worker do cenário 18 foram identificados.

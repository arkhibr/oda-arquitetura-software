- id: simulacao
  titulo: Simulação
  blocos:
  - tipo: legenda
    texto: Esta aba simula, sem executar nada, duas execuções da máquina de estados com o mesmo pedido, sem e com o `Catch`, o campo que desvia a execução para outro estado quando um erro acontece. Depois, classifique onde cada tipo de processo fica melhor.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A condição `attribute_not_exists(id)` faz o DynamoDB, banco NoSQL da AWS, gravar o pedido só se ainda não existir item com aquele `id`, e a recusa gera `ConditionalCheckFailedException`. Sem `Catch`, o erro encerra a execução em `FAILED`, e com `Catch` o erro é guardado no caminho `$.erro`, indicado pelo `ResultPath`, e a execução segue para o estado `Duplicado`. Uma tarefa no ECS é um contêiner que roda o processo enquanto estiver no ar.
  - tipo: fluxo
    titulo: O mesmo pedido duas vezes
    etapas:
    - titulo: Primeira execução
      descricao: 'O estado `GravarPedido` grava o pedido com a condição `attribute_not_exists(id)`, e o `Registrado` acrescenta `situacao: registrado`.'
    - titulo: Segunda execução
      descricao: A condição é falsa, e o DynamoDB devolve `ConditionalCheckFailedException`.
    - titulo: Sem Catch
      descricao: A execução termina em `FAILED`, e quem a iniciou precisa ler o erro para saber que o pedido já existia.
    - titulo: Com Catch
      descricao: O erro é guardado em `$.erro`, e a execução segue para o estado `Duplicado`.
    - titulo: Resultado
      descricao: 'A execução termina em `SUCCEEDED` com `situacao: duplicado`, uma resposta de negócio.'
  - tipo: classificador
    enunciado: Este processo fica melhor numa máquina de estados ou numa tarefa em contêiner?
    categorias:
    - id: sfn
      rotulo: Step Functions
    - id: ecs
      rotulo: Tarefa no ECS
    itens:
    - texto: Aprovação de crédito com espera de dias por um analista
      categoria: sfn
      explicacao: A execução guarda o estado durante a espera, sem contêiner rodando.
    - texto: Consumo contínuo de uma fila de pedidos
      categoria: ecs
      explicacao: É um processo longo e repetitivo, como o worker do cenário 18.
    - texto: Gravação condicional seguida de notificação
      categoria: sfn
      explicacao: Duas integrações diretas, sem código.
    - texto: Conversão de vídeos de uma hora
      categoria: ecs
      explicacao: Exige CPU e bibliotecas próprias por muito tempo.
    - texto: Fluxo com três etapas e tratamento de erro por etapa
      categoria: sfn
      explicacao: '`Retry` e `Catch` ficam declarados em cada estado.'
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O objetivo do laboratório é dar ao cenário 15 uma máquina de estados testável no LocalStack, sem a Lambda que deixa os testes originais ignorados, e transformar a recusa de um pedido repetido, que encerraria a execução em `FAILED`, num estado de negócio. O passo 1 roda o cenário 15, os passos 2 a 4 criam a fixture, o teste e a primeira definição, e o passo 5 acrescenta o `Catch`. O terminal simulado responde aos mesmos comandos com as saídas obtidas no commit de referência.
  - tipo: conceito
    titulo: 📘 Conceitos usados nesta aba
    texto: A máquina de estados do laboratório usa integração direta com o DynamoDB, um estado `Task` que chama o serviço sem função intermediária, e a gravação tem a condição `attribute_not_exists(id)`, que recusa o pedido repetido. A fixture cria a tabela `pedidos-sfn` e os clientes do SDK da AWS para o Step Functions e o DynamoDB, e o `Catch` desvia a execução para um estado de negócio quando o erro previsto acontece.
  - tipo: faixa
    estilo: objetivo
    problema: A máquina de estados do cenário 15 chama uma Lambda, e por isso os dois testes do cenário ficam ignorados no macOS ARM64, sem nenhum teste da orquestração nesse ambiente. Uma gravação condicional recusada por pedido repetido encerra a execução do Step Functions em `FAILED` quando a máquina não tem `Catch`.
    impacto: Sem `Catch`, o reenvio de um pedido, situação prevista pelo negócio, aparece no painel como falha a investigar, e quem iniciou a execução precisa ler o erro para descobrir que o pedido já existia.
    mecanismo: O laboratório cria uma máquina de estados sem Lambda, com integração direta ao DynamoDB pelo recurso `arn:aws:states:::dynamodb:putItem` e a condição `attribute_not_exists(id)`, e escreve primeiro um teste que executa duas vezes o mesmo pedido. Depois acrescenta um `Catch` para `DynamoDB.ConditionalCheckFailedException` que leva ao estado `Duplicado`.
    comprovacao: 'Sem o `Catch`, o teste falha com `segunda execução: FAILED DynamoDB.ConditionalCheckFailedException`. Com o `Catch`, a segunda execução termina em `SUCCEEDED` com `situacao: duplicado`, e o cenário 15 mostra `Aprovado: 1` e `Ignorado: 2`.'
  - tipo: faixa
    estilo: dica
    titulo: Antes de começar
    texto: 'Se você ainda não tem o repositório, rode `git clone https://github.com/arkhibr/aspire-aws`, entre na pasta criada e rode `git checkout 50a5344`. Se já tem o repositório de outra ODA, entre na pasta dele. Os laboratórios partem do commit `50a5344` sem as alterações das ODAs anteriores, e as contagens de testes dependem disso. Na raiz do repositório, rode `git stash push -u -m "trabalho das ODAs anteriores"`, que guarda as alterações sem apagá-las: `git stash list` mostra o que foi guardado, e `git stash pop` traz de volta. As pastas `bin/` e `obj/` continuam no lugar, porque o Git as ignora.'
  - tipo: faixa
    estilo: erro
    titulo: ⚠️ Se você usa Colima ou outro Docker sem /var/run/docker.sock
    sintoma: Os testes falham depois de cerca de dois minutos, com a mensagem `LocalStack did not become healthy within 120s`.
    causa: O `src/AppHost/Program.cs` monta o arquivo `/var/run/docker.sock` da máquina no contêiner do LocalStack, e a montagem falha quando o arquivo não existe.
    correcao: Depois do `git stash` da faixa Antes de começar, na aba Laboratório, retire a linha `.WithBindMount("/var/run/docker.sock", "/var/run/docker.sock")` de `src/AppHost/Program.cs`. A montagem só serve aos cenários com Lambda, e a máquina de estados do laboratório não usa Lambda.
  - tipo: passos
    itens:

- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: quiz
    perguntas:
    - enunciado: Por que as regras de roteamento ficam numa tabela?
      alternativas:
      - texto: Porque a Lambda não guarda variáveis.
        correta: false
        explicacao: A função recebe variáveis de ambiente, como as URLs das filas.
      - texto: Para o teste ficar mais rápido.
        correta: false
        explicacao: O motivo é a mudança sem implantação.
      - texto: Para mudar destinos por segmento sem implantar a função.
        correta: true
        explicacao: O roteador lê a tabela a cada invocação.
    - enunciado: Por que o descarte silencioso é um problema?
      alternativas:
      - texto: Porque a oferta some sem deixar nada que se possa consultar ou reprocessar.
        correta: true
        explicacao: Só uma linha de log registra o descarte.
      - texto: Porque a função falha.
        correta: false
        explicacao: A função termina sem erro.
      - texto: Porque a fila de entrada enche.
        correta: false
        explicacao: A mensagem é apagada.
    - enunciado: Por que a mudança do laboratório foi no código e não na tabela?
      alternativas:
      - texto: Porque o teste exige.
        correta: false
